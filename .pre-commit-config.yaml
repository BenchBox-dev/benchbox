default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: comment-policy
        name: comment and docstring policy
        entry: uv run -- python scripts/run_comment_policy.py --staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: corpus-inventory
        name: corpus-inventory drift check
        entry: uv run -- python scripts/generate_corpus_inventory.py --check
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^results-data/bundles/

      - id: audit-raw
        name: dependency audit raw inventory drift check
        entry: uv run -- python _project/scripts/dependency_audit/parse_deps.py --check
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^(pyproject\.toml|_project/scripts/dependency_audit/parse_deps\.py|docs/development/dependency-audit-raw\.md)$

      - id: uv-lock-revision-guard
        name: uv.lock revision downgrade guard
        entry: python3 _project/scripts/check_uv_lock_revision.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^uv\.lock$

      - id: uat-loc-table
        name: UAT production-LOC ceiling gate
        entry: uv run --project _project/scripts -- python _project/scripts/uat_loc_table.py --check
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^(tests/uat/.*\.py|_project/specs/uat-framework\.md|_project/specs/uat-loc-budget\.json|_project/scripts/uat_loc_table\.py)$

      - id: timing-policy-check
        name: timing policy (wall-clock allowlist)
        entry: uv run -- python _project/scripts/timing_policy_check.py --strict
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: \.(py|json)$

      - id: timing-policy-fast-lane
        name: timing policy (fast-lane collect)
        entry: bash -c 'if [ "$BENCHBOX_PREPUSH" = "1" ]; then exec uv run -- python _project/scripts/fast_lane_ceiling_check.py --strict; else echo "SKIPPED (timing policy fast lane is pre-push only)"; fi'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pr-preflight
        name: pr-preflight (changed-file lint and tests)
        entry: make pr-preflight
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: blind-spot-validate
        name: blind-spot frontmatter validation
        entry: uv run --project _project/scripts -- python _project/scripts/validate_blind_spot.py
        language: system
        stages: [pre-commit]
        files: ^_project/blind-spots/.*\.md$
        exclude: ^_project/blind-spots/README\.md$

      - id: explorer-tokens
        name: results-explorer token-scan
        entry: python3 _project/scripts/scan_explorer_tokens.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^(results-explorer/src/.*\.(tsx|ts|jsx|js|css|html)|landing/shared/site-tokens\.css)$

      - id: duplicate-code-warn
        name: pylint duplicate-code (warn-only)
        entry: uv run -- python _project/scripts/pylint_duplicate_code_warn.py
        language: system
        pass_filenames: false
        stages: [manual]

      - id: agent-instructions-check
        name: agent instruction authority and efficiency audit
        entry: make agent-instructions-check
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^(AGENTS\.md|CLAUDE\.md|GEMINI\.md|ANTIGRAVITY\.md|\.claude/(commands/|settings\.json)|\.claude/skills/|docs/(agent/|operations/agent-instruction)|_project/(evals/agent-instructions/|scripts/agent_instruction_audit\.py)|skill-sync\.(yaml|lock))

      - id: agent-write-preflight
        name: agent write location and identity preflight
        entry: sh scripts/agent_pre_commit_guard.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: agent-git-identity
        name: agent instruction + Git identity audit
        entry: make agent-identity-check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: agent-attribution-trailers
        name: reject agent Co-Authored-By/session trailers
        entry: sh scripts/check_agent_trailers.sh
        language: system
        always_run: true
        stages: [commit-msg]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args:
          - --ignore-words=.codespell-ignore.txt
          - --skip=*.pyc,_build,_binaries/*,benchbox/_binaries/*,*.json,*.lock,*.svg,*.min.js,*.min.css,*.csv
          - --quiet-level=2
        stages: [pre-commit]
        exclude: ^(_sources/|\.claude/skills/|_project/todo-db-export/|_project/audits/)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--unsafe]
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
        exclude: ^(_sources/|_binaries/|benchbox/_binaries/|\.claude/skills/)
      - id: trailing-whitespace
        stages: [pre-commit]
        exclude: ^(_sources/|_binaries/|benchbox/_binaries/|\.claude/skills/)
      - id: check-added-large-files
        args: [--maxkb=1000]
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: [--fix, --disable, MD013, MD033, MD041]
        stages: [pre-commit]
        exclude: ^\.claude/skills/
