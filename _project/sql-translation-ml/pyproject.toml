[project]
name = "sql-translation-ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "benchbox",
    "duckdb==1.3.2",
    "matplotlib>=3.11.2",
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "scipy>=1.18.1",
    "sqlglot==30.6.0",
    "torch>=2.6",
    "transformers>=4.45,<5",
]

[tool.uv]
required-version = ">=0.13.4"

[tool.uv.sources]
benchbox = { path = "../../", editable = true }

[dependency-groups]
dev = [
    "ty>=0.0.80",
]
