pytest:
  reason: "Test runner CLI; invoked as `pytest` or via -m pytest. Not imported."

pytest-cov:
  reason: "Coverage plugin; loaded by pytest via addopts in pytest.ini. Import alias is pytest_cov but never imported directly."

pytest-benchmark:
  reason: "Benchmark plugin; fixtures auto-injected by pytest. Not imported."

pytest-xdist:
  reason: "Parallel test plugin; loaded via pytest addopts `-n auto`. Not imported."

pytest-timeout:
  reason: "Timeout plugin; loaded via pytest marks/config. Not imported."

pytest-json-report:
  reason: "JSON report plugin for pytest; activated via --json-report/--json-report-file CLI flags (see .github/workflows/nightly-v2.yml). Not imported."

ruff:
  reason: "Linter/formatter CLI; invoked as `uv run ruff check/format`. Not imported."

ty:
  reason: "Type checker CLI; invoked as `uv run ty check`. Not imported."

tox:
  reason: "Test orchestration CLI; invoked as `tox`. Not imported."

mutmut:
  reason: "Mutation testing CLI; invoked as `mutmut run`. Not imported."

codespell:
  reason: "Spell checker CLI; invoked as `codespell`. Not imported."

pre-commit:
  reason: "Git hook and content-guard CLI; invoked as `uv run -- pre-commit`. Not imported."

import-linter:
  reason: "Import-layering CLI; invoked as `uv run -- lint-imports` (see `make lint-imports`). Configured via [tool.importlinter] in pyproject.toml. Not imported."

lxml:
  reason: "Backend for pandas DataFrame.to_xml, which the TPC-DI XML source format calls. Not imported directly."

certifi:
  reason: "Floor for the CA bundle that requests uses to verify TLS; 2026.10.19 is the release the Python security advisory names for the eMudhra emSign CA compromise. Not imported directly."

grpcio:
  reason: "Floor for the root-certificate bundle that gRPC clients (BigQuery Storage, Dataproc, Databricks Connect, Spark Connect) use to verify TLS; 1.84.1 ships a bundle without the compromised eMudhra emSign and AAA Certificate Services roots. Not imported directly."
