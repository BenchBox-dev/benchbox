[project]
name = "benchbox-project-scripts"
version = "0.1.0"
description = "Internal BenchBox TODO and release tooling - not shipped in the wheel"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0.0,<3.0.0",
    "pyyaml>=6.0.0",
    "sqlglot>=25.6.0,<31.0.0",
    "tractable[mcp]",
    "zstandard>=0.20.0",
]

[tool.uv]
managed = true
required-version = ">=0.13.4"

[tool.uv.sources]
tractable = { path = "vendor/tractable-1.1.1-py3-none-any.whl" }
