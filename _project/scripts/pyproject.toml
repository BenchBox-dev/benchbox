[project]
name = "benchbox-project-scripts"
version = "0.1.0"
description = "Internal BenchBox TODO and release tooling - not shipped in the wheel"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0.0,<2.0.0",
    "pyyaml>=6.0.0",
    "sqlglot>=25.6.0,<31.0.0",
    "todo-db[mcp]",
    "zstandard>=0.20.0",
]

[tool.uv]
managed = true
required-version = ">=0.13.4"

[tool.uv.sources]
todo-db = { path = "vendor/todo_db-0.12.0-py3-none-any.whl" }
