  category: large_catalog
  description: Total columns across all catalog tables
  sql: "SELECT\n    COUNT(*) AS total_columns,\n    COUNT(DISTINCT table_name) AS total_tables,\n    CAST(COUNT(*) AS FLOAT) / NULLIF(COUNT(DISTINCT table_name), 0) AS avg_columns_per_table\nFROM information_schema.columns\nWHERE table_name LIKE 'benchbox_catalog_%';\n"
  variants:
    clickhouse: "SELECT\n    COUNT(*) AS total_columns,\n    uniq(table) AS total_tables,\n    COUNT(*) / nullIf(uniq(table), 0) AS avg_columns_per_table\nFROM system.columns\nWHERE table LIKE 'benchbox_catalog_%';\n"
    sqlite: "WITH sqlite_columns AS (SELECT 'main' AS table_schema, m.name AS table_name, p.name AS column_name, p.type AS data_type, p.cid + 1 AS ordinal_position, CASE WHEN p.\"notnull\" = 0 AND p.pk = 0 THEN 'YES' ELSE 'NO' END AS is_nullable, p.dflt_value AS column_default, CASE WHEN INSTR(p.type, '(') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, '(') + 1) AS INTEGER) END AS numeric_precision, CASE WHEN INSTR(p.type, ',') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, ',') + 1) AS INTEGER) END AS numeric_scale, CASE WHEN INSTR(p.type, '(') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, '(') + 1) AS INTEGER) END AS character_maximum_length, LOWER(CASE WHEN INSTR(p.type, '(') > 0 THEN TRIM(SUBSTR(p.type, 1, INSTR(p.type, '(') - 1)) ELSE p.type END) AS base_type FROM sqlite_master m JOIN pragma_table_info(m.name) p WHERE m.type IN ('table', 'view') AND m.name NOT LIKE 'sqlite_%') SELECT COUNT(*) AS total_columns, COUNT(DISTINCT table_name) AS total_tables, CAST(COUNT(*) AS FLOAT) / NULLIF(COUNT(DISTINCT table_name), 0) AS avg_columns_per_table FROM sqlite_columns WHERE table_name LIKE 'benchbox_catalog_%';\n"
- id: large_catalog_pattern_search
