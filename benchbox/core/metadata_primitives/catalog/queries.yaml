    sqlite: "WITH sqlite_columns AS (SELECT 'main' AS table_schema, m.name AS table_name, p.name AS column_name, p.type AS data_type, p.cid + 1 AS ordinal_position, CASE WHEN p.\"notnull\" = 0 AND p.pk = 0 THEN 'YES' ELSE 'NO' END AS is_nullable, p.dflt_value AS column_default, CASE WHEN INSTR(p.type, '(') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, '(') + 1) AS INTEGER) END AS numeric_precision, CASE WHEN INSTR(p.type, ',') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, ',') + 1) AS INTEGER) END AS numeric_scale, CASE WHEN INSTR(p.type, '(') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, '(') + 1) AS INTEGER) END AS character_maximum_length, LOWER(CASE WHEN INSTR(p.type, '(') > 0 THEN TRIM(SUBSTR(p.type, 1, INSTR(p.type, '(') - 1)) ELSE p.type END) AS base_type FROM sqlite_master m JOIN pragma_table_info(m.name) p WHERE m.type IN ('table', 'view') AND m.name NOT LIKE 'sqlite_%') SELECT data_type, COUNT(*) AS column_count, COUNT(DISTINCT table_name) AS tables_with_type FROM sqlite_columns WHERE table_name LIKE 'benchbox_catalog_%' GROUP BY data_type ORDER BY column_count DESC;\n"
- id: constraint_fk_list
  category: constraint
  description: List all benchmark foreign key constraints
  sql: "SELECT\n    tc.table_name,\n    tc.constraint_name,\n    tc.constraint_type,\n    kcu.column_name\nFROM information_schema.table_constraints tc\nJOIN information_schema.key_column_usage kcu\n  ON tc.constraint_name = kcu.constraint_name\n  AND tc.table_schema = kcu.table_schema\nWHERE tc.table_name LIKE 'benchbox_fk_%'\n  AND tc.constraint_type = 'FOREIGN KEY'\nORDER BY tc.table_name, tc.constraint_name;\n"
  skip_on:
  - clickhouse
  - bigquery
  - datafusion
  - presto
  - trino
  variants:
    snowflake: "SELECT\n    table_name,\n    constraint_name,\n    constraint_type,\n    '' AS column_name\nFROM information_schema.table_constraints\nWHERE table_name ILIKE 'benchbox_fk_%'\n  AND constraint_type = 'FOREIGN KEY'\nORDER BY table_name, constraint_name;\n"
    duckdb: "SELECT\n    table_name,\n    constraint_text AS constraint_name,\n    constraint_type,\n    '' AS column_name\nFROM duckdb_constraints()\nWHERE table_name LIKE 'benchbox_fk_%'\n  AND constraint_type = 'FOREIGN KEY'\nORDER BY table_name;\n"
    sqlite: "SELECT table_name, constraint_name, constraint_type, column_name FROM (SELECT m.name AS table_name, 'fk_' || m.name || '_' || f.id AS constraint_name, 'FOREIGN KEY' AS constraint_type, f.\"from\" AS column_name, f.seq + 1 AS ordinal_position, f.\"table\" AS parent_table FROM sqlite_master m JOIN pragma_foreign_key_list(m.name) f WHERE m.type = 'table' AND m.name NOT LIKE 'sqlite_%') WHERE table_name LIKE 'benchbox_fk_%' ORDER BY table_name, constraint_name;\n"
- id: constraint_pk_list
  category: constraint
