- id: large_catalog_schema_summary
  category: large_catalog
  description: Summary statistics for large catalog
  sql: "SELECT\n    COUNT(DISTINCT t.table_name) AS table_count,\n    COUNT(c.column_name) AS total_columns,\n    AVG(col_counts.column_count) AS avg_columns\nFROM information_schema.tables t\nLEFT JOIN information_schema.columns c\n  ON t.table_name = c.table_name\n  AND t.table_schema = c.table_schema\nLEFT JOIN (\n    SELECT table_name, COUNT(*) AS column_count\n    FROM information_schema.columns\n    WHERE table_name LIKE 'benchbox_catalog_%'\n    GROUP BY table_name\n) col_counts ON t.table_name = col_counts.table_name\nWHERE t.table_name LIKE 'benchbox_catalog_%';\n"
  variants:
    clickhouse: "SELECT\n    uniq(t.name) AS table_count,\n    COUNT(c.name) AS total_columns,\n    AVG(col_counts.column_count) AS avg_columns\nFROM system.tables t\nLEFT JOIN system.columns c\n  ON t.name = c.table AND t.database = c.database\nLEFT JOIN (\n    SELECT table, COUNT(*) AS column_count\n    FROM system.columns\n    WHERE table LIKE 'benchbox_catalog_%'\n    GROUP BY table\n) col_counts ON t.name = col_counts.table\nWHERE t.name LIKE 'benchbox_catalog_%';\n"
    sqlite: "WITH sqlite_tables AS (SELECT 'main' AS table_schema, name AS table_name, CASE type WHEN 'view' THEN 'VIEW' ELSE 'BASE TABLE' END AS table_type FROM sqlite_master WHERE type IN ('table', 'view') AND name NOT LIKE 'sqlite_%'), sqlite_columns AS (SELECT 'main' AS table_schema, m.name AS table_name, p.name AS column_name, p.type AS data_type, p.cid + 1 AS ordinal_position, CASE WHEN p.\"notnull\" = 0 AND p.pk = 0 THEN 'YES' ELSE 'NO' END AS is_nullable, p.dflt_value AS column_default, CASE WHEN INSTR(p.type, '(') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, '(') + 1) AS INTEGER) END AS numeric_precision, CASE WHEN INSTR(p.type, ',') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, ',') + 1) AS INTEGER) END AS numeric_scale, CASE WHEN INSTR(p.type, '(') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, '(') + 1) AS INTEGER) END AS character_maximum_length, LOWER(CASE WHEN INSTR(p.type, '(') > 0 THEN TRIM(SUBSTR(p.type, 1, INSTR(p.type, '(') - 1)) ELSE p.type END) AS base_type FROM sqlite_master m JOIN pragma_table_info(m.name) p WHERE m.type IN ('table', 'view') AND m.name NOT LIKE 'sqlite_%') SELECT COUNT(DISTINCT t.table_name) AS table_count, COUNT(c.column_name) AS total_columns, AVG(col_counts.column_count) AS avg_columns FROM sqlite_tables t LEFT JOIN sqlite_columns c ON t.table_name = c.table_name AND t.table_schema = c.table_schema LEFT JOIN ( SELECT table_name, COUNT(*) AS column_count FROM sqlite_columns WHERE table_name LIKE 'benchbox_catalog_%' GROUP BY table_name ) col_counts ON t.table_name = col_counts.table_name WHERE t.table_name LIKE 'benchbox_catalog_%';\n"
- id: large_catalog_column_type_analysis
