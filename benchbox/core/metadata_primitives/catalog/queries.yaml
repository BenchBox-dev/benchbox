version: 1
queries:
- id: schema_list_schemata
  category: schema
  description: List all schemas in the current catalog
  sql: "SELECT\n    schema_name,\n    catalog_name\nFROM information_schema.schemata\nORDER BY schema_name;\n"
  variants:
    clickhouse: "SELECT\n    name AS schema_name,\n    'default' AS catalog_name\nFROM system.databases\nORDER BY name;\n"
    bigquery: "SELECT\n    schema_name,\n    catalog_name\nFROM INFORMATION_SCHEMA.SCHEMATA\nORDER BY schema_name;\n"
    sqlite: "SELECT\n    name AS schema_name,\n    name AS catalog_name\nFROM pragma_database_list\nORDER BY schema_name;\n"
    questdb: "SELECT\n    nspname AS schema_name,\n    'qdb' AS catalog_name\nFROM pg_catalog.pg_namespace\nORDER BY nspname;\n"
- id: schema_list_tables
  category: schema
  description: List all tables in the current schema
  sql: "SELECT\n    table_name,\n    table_type,\n    table_schema\nFROM information_schema.tables\nWHERE table_schema NOT IN ('information_schema', 'pg_catalog')\nORDER BY table_name;\n"
  variants:
    clickhouse: "SELECT\n    name AS table_name,\n    engine AS table_type,\n    database AS table_schema\nFROM system.tables\nWHERE database NOT IN ('system', 'INFORMATION_SCHEMA')\nORDER BY name;\n"
    snowflake: "SELECT\n    table_name,\n    table_type,\n    table_schema\nFROM information_schema.tables\nWHERE table_schema NOT IN ('INFORMATION_SCHEMA')\nORDER BY table_name;\n"
    bigquery: "SELECT\n    table_name,\n    table_type,\n    table_schema\nFROM INFORMATION_SCHEMA.TABLES\nORDER BY table_name;\n"
    sqlite: "WITH sqlite_tables AS (SELECT 'main' AS table_schema, name AS table_name, CASE type WHEN 'view' THEN 'VIEW' ELSE 'BASE TABLE' END AS table_type FROM sqlite_master WHERE type IN ('table', 'view') AND name NOT LIKE 'sqlite_%') SELECT table_name, table_type, table_schema FROM sqlite_tables WHERE table_schema NOT IN ('information_schema', 'pg_catalog') ORDER BY table_name;\n"
- id: schema_list_tables_filtered
  category: schema
  description: List tables matching a pattern
  sql: "SELECT\n    table_name,\n    table_type\nFROM information_schema.tables\nWHERE table_schema NOT IN ('information_schema', 'pg_catalog')\n  AND table_name LIKE '%line%'\nORDER BY table_name;\n"
  variants:
    clickhouse: "SELECT\n    name AS table_name,\n    engine AS table_type\nFROM system.tables\nWHERE database NOT IN ('system', 'INFORMATION_SCHEMA')\n  AND name LIKE '%line%'\nORDER BY name;\n"
    sqlite: "WITH sqlite_tables AS (SELECT 'main' AS table_schema, name AS table_name, CASE type WHEN 'view' THEN 'VIEW' ELSE 'BASE TABLE' END AS table_type FROM sqlite_master WHERE type IN ('table', 'view') AND name NOT LIKE 'sqlite_%') SELECT table_name, table_type FROM sqlite_tables WHERE table_schema NOT IN ('information_schema', 'pg_catalog') AND table_name LIKE '%line%' ORDER BY table_name;\n"
- id: schema_table_count
  category: schema
  description: Count total tables in catalog
  sql: "SELECT COUNT(*) AS table_count\nFROM information_schema.tables\nWHERE table_schema NOT IN ('information_schema', 'pg_catalog');\n"
  variants:
    clickhouse: "SELECT COUNT(*) AS table_count\nFROM system.tables\nWHERE database NOT IN ('system', 'INFORMATION_SCHEMA');\n"
    sqlite: "WITH sqlite_tables AS (SELECT 'main' AS table_schema, name AS table_name, CASE type WHEN 'view' THEN 'VIEW' ELSE 'BASE TABLE' END AS table_type FROM sqlite_master WHERE type IN ('table', 'view') AND name NOT LIKE 'sqlite_%') SELECT COUNT(*) AS table_count FROM sqlite_tables WHERE table_schema NOT IN ('information_schema', 'pg_catalog');\n"
- id: schema_list_views
  category: schema
  description: List all views in the catalog
  sql: "SELECT\n    table_name AS view_name,\n    table_schema AS view_schema,\n    view_definition\nFROM information_schema.views\nORDER BY table_name;\n"
  skip_on:
  - clickhouse
  variants:
    datafusion: "SELECT\n    table_name AS view_name,\n    table_schema AS view_schema,\n    definition AS view_definition\nFROM information_schema.views\nORDER BY table_name;\n"
    snowflake: "SELECT\n    table_name AS view_name,\n    table_schema AS view_schema,\n    view_definition\nFROM information_schema.views\nORDER BY table_name;\n"
    duckdb: "SELECT\n    view_name,\n    schema_name AS view_schema,\n    sql AS view_definition\nFROM duckdb_views()\nORDER BY view_name;\n"
    sqlite: "WITH sqlite_views AS (SELECT 'main' AS table_schema, name AS table_name, sql AS view_definition FROM sqlite_master WHERE type = 'view') SELECT table_name AS view_name, table_schema AS view_schema, view_definition FROM sqlite_views ORDER BY table_name;\n"
    questdb: "SELECT\n    view_name,\n    'public' AS view_schema,\n    view_sql AS view_definition\nFROM views()\nORDER BY view_name;\n"
- id: schema_object_types
  category: schema
  description: Count objects by type
  sql: "SELECT\n    table_type,\n    COUNT(*) AS object_count\nFROM information_schema.tables\nWHERE table_schema NOT IN ('information_schema', 'pg_catalog')\nGROUP BY table_type\nORDER BY object_count DESC;\n"
  variants:
    clickhouse: "SELECT\n    engine AS table_type,\n    COUNT(*) AS object_count\nFROM system.tables\nWHERE database NOT IN ('system', 'INFORMATION_SCHEMA')\nGROUP BY engine\nORDER BY object_count DESC;\n"
    sqlite: "WITH sqlite_tables AS (SELECT 'main' AS table_schema, name AS table_name, CASE type WHEN 'view' THEN 'VIEW' ELSE 'BASE TABLE' END AS table_type FROM sqlite_master WHERE type IN ('table', 'view') AND name NOT LIKE 'sqlite_%') SELECT table_type, COUNT(*) AS object_count FROM sqlite_tables WHERE table_schema NOT IN ('information_schema', 'pg_catalog') GROUP BY table_type ORDER BY object_count DESC;\n"
- id: schema_search_tables
  category: schema
  description: Search for tables by partial name match
  sql: "SELECT\n    table_schema,\n    table_name,\n    table_type\nFROM information_schema.tables\nWHERE table_name LIKE '%order%'\n   OR table_name LIKE '%customer%'\nORDER BY table_schema, table_name;\n"
  variants:
    clickhouse: "SELECT\n    database AS table_schema,\n    name AS table_name,\n    engine AS table_type\nFROM system.tables\nWHERE name LIKE '%order%'\n   OR name LIKE '%customer%'\nORDER BY database, name;\n"
    sqlite: "WITH sqlite_tables AS (SELECT 'main' AS table_schema, name AS table_name, CASE type WHEN 'view' THEN 'VIEW' ELSE 'BASE TABLE' END AS table_type FROM sqlite_master WHERE type IN ('table', 'view') AND name NOT LIKE 'sqlite_%') SELECT table_schema, table_name, table_type FROM sqlite_tables WHERE table_name LIKE '%order%' OR table_name LIKE '%customer%' ORDER BY table_schema, table_name;\n"
- id: schema_tables_by_schema
  category: schema
  description: Group tables by schema with counts
  sql: "SELECT\n    table_schema,\n    COUNT(*) AS table_count,\n    SUM(CASE WHEN table_type = 'BASE TABLE' THEN 1 ELSE 0 END) AS base_tables,\n    SUM(CASE WHEN table_type = 'VIEW' THEN 1 ELSE 0 END) AS views\nFROM information_schema.tables\nWHERE table_schema NOT IN ('information_schema', 'pg_catalog')\nGROUP BY table_schema\nORDER BY table_count DESC;\n"
  variants:
    clickhouse: "SELECT\n    database AS table_schema,\n    COUNT(*) AS table_count,\n    countIf(engine != 'View') AS base_tables,\n    countIf(engine = 'View') AS views\nFROM system.tables\nWHERE database NOT IN ('system', 'INFORMATION_SCHEMA')\nGROUP BY database\nORDER BY table_count DESC;\n"
    sqlite: "WITH sqlite_tables AS (SELECT 'main' AS table_schema, name AS table_name, CASE type WHEN 'view' THEN 'VIEW' ELSE 'BASE TABLE' END AS table_type FROM sqlite_master WHERE type IN ('table', 'view') AND name NOT LIKE 'sqlite_%') SELECT table_schema, COUNT(*) AS table_count, SUM(CASE WHEN table_type = 'BASE TABLE' THEN 1 ELSE 0 END) AS base_tables, SUM(CASE WHEN table_type = 'VIEW' THEN 1 ELSE 0 END) AS views FROM sqlite_tables WHERE table_schema NOT IN ('information_schema', 'pg_catalog') GROUP BY table_schema ORDER BY table_count DESC;\n"
- id: schema_recent_tables
  category: schema
  description: List tables with creation timestamps (where available)
  sql: "SELECT\n    table_schema,\n    table_name,\n    table_type\nFROM information_schema.tables\nWHERE table_schema NOT IN ('information_schema', 'pg_catalog')\nORDER BY table_name\nLIMIT 20;\n"
  variants:
    clickhouse: "SELECT\n    database AS table_schema,\n    name AS table_name,\n    engine AS table_type,\n    metadata_modification_time\nFROM system.tables\nWHERE database NOT IN ('system', 'INFORMATION_SCHEMA')\nORDER BY metadata_modification_time DESC\nLIMIT 20;\n"
    snowflake: "SELECT\n    table_schema,\n    table_name,\n    table_type,\n    created\nFROM information_schema.tables\nWHERE table_schema NOT IN ('INFORMATION_SCHEMA')\nORDER BY created DESC\nLIMIT 20;\n"
    sqlite: "WITH sqlite_tables AS (SELECT 'main' AS table_schema, name AS table_name, CASE type WHEN 'view' THEN 'VIEW' ELSE 'BASE TABLE' END AS table_type FROM sqlite_master WHERE type IN ('table', 'view') AND name NOT LIKE 'sqlite_%') SELECT table_schema, table_name, table_type FROM sqlite_tables WHERE table_schema NOT IN ('information_schema', 'pg_catalog') ORDER BY table_name LIMIT 20;\n"
- id: column_list_all
  category: column
  description: List all columns for all tables
  sql: "SELECT\n    table_schema,\n    table_name,\n    column_name,\n    data_type,\n    ordinal_position\nFROM information_schema.columns\nWHERE table_schema NOT IN ('information_schema', 'pg_catalog')\nORDER BY table_schema, table_name, ordinal_position;\n"
  variants:
    clickhouse: "SELECT\n    database AS table_schema,\n    table AS table_name,\n    name AS column_name,\n    type AS data_type,\n    position AS ordinal_position\nFROM system.columns\nWHERE database NOT IN ('system', 'INFORMATION_SCHEMA')\nORDER BY database, table, position;\n"
    sqlite: "WITH sqlite_columns AS (SELECT 'main' AS table_schema, m.name AS table_name, p.name AS column_name, p.type AS data_type, p.cid + 1 AS ordinal_position, CASE WHEN p.\"notnull\" = 0 AND p.pk = 0 THEN 'YES' ELSE 'NO' END AS is_nullable, p.dflt_value AS column_default, CASE WHEN INSTR(p.type, '(') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, '(') + 1) AS INTEGER) END AS numeric_precision, CASE WHEN INSTR(p.type, ',') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, ',') + 1) AS INTEGER) END AS numeric_scale, CASE WHEN INSTR(p.type, '(') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, '(') + 1) AS INTEGER) END AS character_maximum_length, LOWER(CASE WHEN INSTR(p.type, '(') > 0 THEN TRIM(SUBSTR(p.type, 1, INSTR(p.type, '(') - 1)) ELSE p.type END) AS base_type FROM sqlite_master m JOIN pragma_table_info(m.name) p WHERE m.type IN ('table', 'view') AND m.name NOT LIKE 'sqlite_%') SELECT table_schema, table_name, column_name, data_type, ordinal_position FROM sqlite_columns WHERE table_schema NOT IN ('information_schema', 'pg_catalog') ORDER BY table_schema, table_name, ordinal_position;\n"
- id: column_for_table
  category: column
  description: List columns for a specific table (lineitem)
  sql: "SELECT\n    column_name,\n    data_type,\n    is_nullable,\n    column_default,\n    ordinal_position\nFROM information_schema.columns\nWHERE table_name = 'lineitem'\nORDER BY ordinal_position;\n"
  variants:
    clickhouse: "SELECT\n    name AS column_name,\n    type AS data_type,\n    '' AS is_nullable,\n    default_expression AS column_default,\n    position AS ordinal_position\nFROM system.columns\nWHERE table = 'lineitem'\nORDER BY position;\n"
    sqlite: "WITH sqlite_columns AS (SELECT 'main' AS table_schema, m.name AS table_name, p.name AS column_name, p.type AS data_type, p.cid + 1 AS ordinal_position, CASE WHEN p.\"notnull\" = 0 AND p.pk = 0 THEN 'YES' ELSE 'NO' END AS is_nullable, p.dflt_value AS column_default, CASE WHEN INSTR(p.type, '(') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, '(') + 1) AS INTEGER) END AS numeric_precision, CASE WHEN INSTR(p.type, ',') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, ',') + 1) AS INTEGER) END AS numeric_scale, CASE WHEN INSTR(p.type, '(') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, '(') + 1) AS INTEGER) END AS character_maximum_length, LOWER(CASE WHEN INSTR(p.type, '(') > 0 THEN TRIM(SUBSTR(p.type, 1, INSTR(p.type, '(') - 1)) ELSE p.type END) AS base_type FROM sqlite_master m JOIN pragma_table_info(m.name) p WHERE m.type IN ('table', 'view') AND m.name NOT LIKE 'sqlite_%') SELECT column_name, data_type, is_nullable, column_default, ordinal_position FROM sqlite_columns WHERE table_name = 'lineitem' ORDER BY ordinal_position;\n"
- id: column_count_by_table
  category: column
  description: Count columns per table
  sql: "SELECT\n    table_schema,\n    table_name,\n    COUNT(*) AS column_count\nFROM information_schema.columns\nWHERE table_schema NOT IN ('information_schema', 'pg_catalog')\nGROUP BY table_schema, table_name\nORDER BY column_count DESC;\n"
  variants:
    clickhouse: "SELECT\n    database AS table_schema,\n    table AS table_name,\n    COUNT(*) AS column_count\nFROM system.columns\nWHERE database NOT IN ('system', 'INFORMATION_SCHEMA')\nGROUP BY database, table\nORDER BY column_count DESC;\n"
    sqlite: "WITH sqlite_columns AS (SELECT 'main' AS table_schema, m.name AS table_name, p.name AS column_name, p.type AS data_type, p.cid + 1 AS ordinal_position, CASE WHEN p.\"notnull\" = 0 AND p.pk = 0 THEN 'YES' ELSE 'NO' END AS is_nullable, p.dflt_value AS column_default, CASE WHEN INSTR(p.type, '(') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, '(') + 1) AS INTEGER) END AS numeric_precision, CASE WHEN INSTR(p.type, ',') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, ',') + 1) AS INTEGER) END AS numeric_scale, CASE WHEN INSTR(p.type, '(') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, '(') + 1) AS INTEGER) END AS character_maximum_length, LOWER(CASE WHEN INSTR(p.type, '(') > 0 THEN TRIM(SUBSTR(p.type, 1, INSTR(p.type, '(') - 1)) ELSE p.type END) AS base_type FROM sqlite_master m JOIN pragma_table_info(m.name) p WHERE m.type IN ('table', 'view') AND m.name NOT LIKE 'sqlite_%') SELECT table_schema, table_name, COUNT(*) AS column_count FROM sqlite_columns WHERE table_schema NOT IN ('information_schema', 'pg_catalog') GROUP BY table_schema, table_name ORDER BY column_count DESC;\n"
- id: column_data_types
  category: column
  description: Distribution of data types across all columns
  sql: "SELECT\n    data_type,\n    COUNT(*) AS column_count\nFROM information_schema.columns\nWHERE table_schema NOT IN ('information_schema', 'pg_catalog')\nGROUP BY data_type\nORDER BY column_count DESC;\n"
  variants:
    clickhouse: "SELECT\n    type AS data_type,\n    COUNT(*) AS column_count\nFROM system.columns\nWHERE database NOT IN ('system', 'INFORMATION_SCHEMA')\nGROUP BY type\nORDER BY column_count DESC;\n"
    sqlite: "WITH sqlite_columns AS (SELECT 'main' AS table_schema, m.name AS table_name, p.name AS column_name, p.type AS data_type, p.cid + 1 AS ordinal_position, CASE WHEN p.\"notnull\" = 0 AND p.pk = 0 THEN 'YES' ELSE 'NO' END AS is_nullable, p.dflt_value AS column_default, CASE WHEN INSTR(p.type, '(') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, '(') + 1) AS INTEGER) END AS numeric_precision, CASE WHEN INSTR(p.type, ',') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, ',') + 1) AS INTEGER) END AS numeric_scale, CASE WHEN INSTR(p.type, '(') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, '(') + 1) AS INTEGER) END AS character_maximum_length, LOWER(CASE WHEN INSTR(p.type, '(') > 0 THEN TRIM(SUBSTR(p.type, 1, INSTR(p.type, '(') - 1)) ELSE p.type END) AS base_type FROM sqlite_master m JOIN pragma_table_info(m.name) p WHERE m.type IN ('table', 'view') AND m.name NOT LIKE 'sqlite_%') SELECT data_type, COUNT(*) AS column_count FROM sqlite_columns WHERE table_schema NOT IN ('information_schema', 'pg_catalog') GROUP BY data_type ORDER BY column_count DESC;\n"
- id: column_nullable_analysis
  category: column
  description: Count nullable vs non-nullable columns
  sql: "SELECT\n    table_name,\n    SUM(CASE WHEN is_nullable = 'YES' THEN 1 ELSE 0 END) AS nullable_count,\n    SUM(CASE WHEN is_nullable = 'NO' THEN 1 ELSE 0 END) AS not_nullable_count\nFROM information_schema.columns\nWHERE table_schema NOT IN ('information_schema', 'pg_catalog')\nGROUP BY table_name\nORDER BY table_name;\n"
  variants:
    clickhouse: "SELECT\n    table AS table_name,\n    0 AS nullable_count,\n    COUNT(*) AS not_nullable_count\nFROM system.columns\nWHERE database NOT IN ('system', 'INFORMATION_SCHEMA')\nGROUP BY table\nORDER BY table;\n"
    sqlite: "WITH sqlite_columns AS (SELECT 'main' AS table_schema, m.name AS table_name, p.name AS column_name, p.type AS data_type, p.cid + 1 AS ordinal_position, CASE WHEN p.\"notnull\" = 0 AND p.pk = 0 THEN 'YES' ELSE 'NO' END AS is_nullable, p.dflt_value AS column_default, CASE WHEN INSTR(p.type, '(') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, '(') + 1) AS INTEGER) END AS numeric_precision, CASE WHEN INSTR(p.type, ',') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, ',') + 1) AS INTEGER) END AS numeric_scale, CASE WHEN INSTR(p.type, '(') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, '(') + 1) AS INTEGER) END AS character_maximum_length, LOWER(CASE WHEN INSTR(p.type, '(') > 0 THEN TRIM(SUBSTR(p.type, 1, INSTR(p.type, '(') - 1)) ELSE p.type END) AS base_type FROM sqlite_master m JOIN pragma_table_info(m.name) p WHERE m.type IN ('table', 'view') AND m.name NOT LIKE 'sqlite_%') SELECT table_name, SUM(CASE WHEN is_nullable = 'YES' THEN 1 ELSE 0 END) AS nullable_count, SUM(CASE WHEN is_nullable = 'NO' THEN 1 ELSE 0 END) AS not_nullable_count FROM sqlite_columns WHERE table_schema NOT IN ('information_schema', 'pg_catalog') GROUP BY table_name ORDER BY table_name;\n"
- id: column_search_by_name
  category: column
  description: Find columns matching a pattern
  sql: "SELECT\n    table_schema,\n    table_name,\n    column_name,\n    data_type\nFROM information_schema.columns\nWHERE column_name LIKE '%price%'\n   OR column_name LIKE '%cost%'\nORDER BY table_name, column_name;\n"
  variants:
    clickhouse: "SELECT\n    database AS table_schema,\n    table AS table_name,\n    name AS column_name,\n    type AS data_type\nFROM system.columns\nWHERE name LIKE '%price%'\n   OR name LIKE '%cost%'\nORDER BY table, name;\n"
    sqlite: "WITH sqlite_columns AS (SELECT 'main' AS table_schema, m.name AS table_name, p.name AS column_name, p.type AS data_type, p.cid + 1 AS ordinal_position, CASE WHEN p.\"notnull\" = 0 AND p.pk = 0 THEN 'YES' ELSE 'NO' END AS is_nullable, p.dflt_value AS column_default, CASE WHEN INSTR(p.type, '(') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, '(') + 1) AS INTEGER) END AS numeric_precision, CASE WHEN INSTR(p.type, ',') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, ',') + 1) AS INTEGER) END AS numeric_scale, CASE WHEN INSTR(p.type, '(') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, '(') + 1) AS INTEGER) END AS character_maximum_length, LOWER(CASE WHEN INSTR(p.type, '(') > 0 THEN TRIM(SUBSTR(p.type, 1, INSTR(p.type, '(') - 1)) ELSE p.type END) AS base_type FROM sqlite_master m JOIN pragma_table_info(m.name) p WHERE m.type IN ('table', 'view') AND m.name NOT LIKE 'sqlite_%') SELECT table_schema, table_name, column_name, data_type FROM sqlite_columns WHERE column_name LIKE '%price%' OR column_name LIKE '%cost%' ORDER BY table_name, column_name;\n"
- id: column_numeric_columns
  category: column
  description: List all numeric columns
  sql: "SELECT\n    table_name,\n    column_name,\n    data_type,\n    numeric_precision,\n    numeric_scale\nFROM information_schema.columns\nWHERE table_schema NOT IN ('information_schema', 'pg_catalog')\n  AND data_type IN ('integer', 'bigint', 'smallint', 'decimal', 'numeric', 'real', 'double precision', 'float')\nORDER BY table_name, column_name;\n"
  variants:
    presto: "SELECT\n    table_name,\n    column_name,\n    data_type,\n    TRY_CAST(REGEXP_EXTRACT(data_type, '\\((\\d+)', 1) AS INTEGER) AS numeric_precision,\n    TRY_CAST(REGEXP_EXTRACT(data_type, ',\\s*(\\d+)\\)', 1) AS INTEGER) AS numeric_scale\nFROM information_schema.columns\nWHERE table_schema NOT IN ('information_schema', 'pg_catalog')\n  AND (data_type IN ('integer', 'bigint', 'smallint', 'tinyint', 'real', 'double') OR data_type LIKE 'decimal%')\nORDER BY table_name, column_name;\n"
    trino: "SELECT\n    table_name,\n    column_name,\n    data_type,\n    TRY_CAST(REGEXP_EXTRACT(data_type, '\\((\\d+)', 1) AS INTEGER) AS numeric_precision,\n    TRY_CAST(REGEXP_EXTRACT(data_type, ',\\s*(\\d+)\\)', 1) AS INTEGER) AS numeric_scale\nFROM information_schema.columns\nWHERE table_schema NOT IN ('information_schema', 'pg_catalog')\n  AND (data_type IN ('integer', 'bigint', 'smallint', 'tinyint', 'real', 'double') OR data_type LIKE 'decimal%')\nORDER BY table_name, column_name;\n"
    duckdb: "SELECT\n    table_name,\n    column_name,\n    data_type,\n    numeric_precision,\n    numeric_scale\nFROM information_schema.columns\nWHERE table_schema NOT IN ('information_schema', 'pg_catalog')\n  AND data_type IN ('INTEGER', 'BIGINT', 'SMALLINT', 'DECIMAL', 'DOUBLE', 'FLOAT', 'REAL', 'HUGEINT', 'UINTEGER', 'UBIGINT')\nORDER BY table_name, column_name;\n"
    clickhouse: "SELECT\n    table AS table_name,\n    name AS column_name,\n    type AS data_type,\n    0 AS numeric_precision,\n    0 AS numeric_scale\nFROM system.columns\nWHERE database NOT IN ('system', 'INFORMATION_SCHEMA')\n  AND (type LIKE 'Int%' OR type LIKE 'UInt%' OR type LIKE 'Float%' OR type LIKE 'Decimal%')\nORDER BY table, name;\n"
    bigquery: "SELECT\n    table_name,\n    column_name,\n    data_type,\n    CAST(NULL AS INT64) AS numeric_precision,\n    CAST(NULL AS INT64) AS numeric_scale\nFROM INFORMATION_SCHEMA.COLUMNS\nWHERE STARTS_WITH(data_type, 'INT64') OR STARTS_WITH(data_type, 'NUMERIC') OR STARTS_WITH(data_type, 'BIGNUMERIC') OR STARTS_WITH(data_type, 'FLOAT64')\nORDER BY table_name, column_name;\n"
    sqlite: "WITH sqlite_columns AS (SELECT 'main' AS table_schema, m.name AS table_name, p.name AS column_name, p.type AS data_type, p.cid + 1 AS ordinal_position, CASE WHEN p.\"notnull\" = 0 AND p.pk = 0 THEN 'YES' ELSE 'NO' END AS is_nullable, p.dflt_value AS column_default, CASE WHEN INSTR(p.type, '(') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, '(') + 1) AS INTEGER) END AS numeric_precision, CASE WHEN INSTR(p.type, ',') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, ',') + 1) AS INTEGER) END AS numeric_scale, CASE WHEN INSTR(p.type, '(') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, '(') + 1) AS INTEGER) END AS character_maximum_length, LOWER(CASE WHEN INSTR(p.type, '(') > 0 THEN TRIM(SUBSTR(p.type, 1, INSTR(p.type, '(') - 1)) ELSE p.type END) AS base_type FROM sqlite_master m JOIN pragma_table_info(m.name) p WHERE m.type IN ('table', 'view') AND m.name NOT LIKE 'sqlite_%') SELECT table_name, column_name, data_type, numeric_precision, numeric_scale FROM sqlite_columns WHERE table_schema NOT IN ('information_schema', 'pg_catalog') AND base_type IN ('integer', 'int', 'bigint', 'smallint', 'tinyint', 'decimal', 'numeric', 'real', 'double', 'double precision', 'float') ORDER BY table_name, column_name;\n"
    questdb: "SELECT\n    table_name,\n    column_name,\n    data_type\nFROM information_schema.columns\nWHERE table_schema NOT IN ('information_schema', 'pg_catalog')\n  AND data_type IN ('integer', 'bigint', 'smallint', 'decimal', 'numeric', 'real', 'double precision', 'float')\nORDER BY table_name, column_name;\n"
- id: column_string_columns
  category: column
  description: List all string/text columns
  sql: "SELECT\n    table_name,\n    column_name,\n    data_type,\n    character_maximum_length\nFROM information_schema.columns\nWHERE table_schema NOT IN ('information_schema', 'pg_catalog')\n  AND data_type IN ('character varying', 'varchar', 'text', 'char', 'character')\nORDER BY table_name, column_name;\n"
  variants:
    presto: "SELECT\n    table_name,\n    column_name,\n    data_type,\n    TRY_CAST(REGEXP_EXTRACT(data_type, '\\((\\d+)\\)', 1) AS INTEGER) AS character_maximum_length\nFROM information_schema.columns\nWHERE table_schema NOT IN ('information_schema', 'pg_catalog')\n  AND (data_type = 'varchar' OR data_type LIKE 'varchar(%' OR data_type LIKE 'char(%')\nORDER BY table_name, column_name;\n"
    trino: "SELECT\n    table_name,\n    column_name,\n    data_type,\n    TRY_CAST(REGEXP_EXTRACT(data_type, '\\((\\d+)\\)', 1) AS INTEGER) AS character_maximum_length\nFROM information_schema.columns\nWHERE table_schema NOT IN ('information_schema', 'pg_catalog')\n  AND (data_type = 'varchar' OR data_type LIKE 'varchar(%' OR data_type LIKE 'char(%')\nORDER BY table_name, column_name;\n"
