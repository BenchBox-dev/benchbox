- id: query_explain_join
  category: query
  description: EXPLAIN plan for a join query
  sql: "EXPLAIN\nSELECT t.table_name, c.column_name\nFROM information_schema.tables t\nJOIN information_schema.columns c\n  ON t.table_name = c.table_name\n  AND t.table_schema = c.table_schema\nWHERE t.table_schema NOT IN ('information_schema', 'pg_catalog')\nLIMIT 100;\n"
  variants:
    snowflake: "SELECT t.table_name, c.column_name\nFROM information_schema.tables t\nJOIN information_schema.columns c\n  ON t.table_name = c.table_name\n  AND t.table_schema = c.table_schema\nWHERE t.table_schema NOT IN ('INFORMATION_SCHEMA')\nLIMIT 100;\n"
    clickhouse: "EXPLAIN\nSELECT t.name AS table_name, c.name AS column_name\nFROM system.tables t\nJOIN system.columns c ON t.name = c.table AND t.database = c.database\nWHERE t.database NOT IN ('system', 'INFORMATION_SCHEMA')\nLIMIT 100;\n"
    bigquery: "SELECT t.table_name, c.column_name\nFROM INFORMATION_SCHEMA.TABLES t\nJOIN INFORMATION_SCHEMA.COLUMNS c\n  ON t.table_name = c.table_name\n  AND t.table_schema = c.table_schema\nLIMIT 100;\n"
    sqlite: "EXPLAIN QUERY PLAN WITH sqlite_tables AS (SELECT 'main' AS table_schema, name AS table_name, CASE type WHEN 'view' THEN 'VIEW' ELSE 'BASE TABLE' END AS table_type FROM sqlite_master WHERE type IN ('table', 'view') AND name NOT LIKE 'sqlite_%'), sqlite_columns AS (SELECT 'main' AS table_schema, m.name AS table_name, p.name AS column_name, p.type AS data_type, p.cid + 1 AS ordinal_position, CASE WHEN p.\"notnull\" = 0 AND p.pk = 0 THEN 'YES' ELSE 'NO' END AS is_nullable, p.dflt_value AS column_default, CASE WHEN INSTR(p.type, '(') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, '(') + 1) AS INTEGER) END AS numeric_precision, CASE WHEN INSTR(p.type, ',') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, ',') + 1) AS INTEGER) END AS numeric_scale, CASE WHEN INSTR(p.type, '(') > 0 THEN CAST(SUBSTR(p.type, INSTR(p.type, '(') + 1) AS INTEGER) END AS character_maximum_length, LOWER(CASE WHEN INSTR(p.type, '(') > 0 THEN TRIM(SUBSTR(p.type, 1, INSTR(p.type, '(') - 1)) ELSE p.type END) AS base_type FROM sqlite_master m JOIN pragma_table_info(m.name) p WHERE m.type IN ('table', 'view') AND m.name NOT LIKE 'sqlite_%') SELECT t.table_name, c.column_name FROM sqlite_tables t JOIN sqlite_columns c ON t.table_name = c.table_name AND t.table_schema = c.table_schema WHERE t.table_schema NOT IN ('information_schema', 'pg_catalog') LIMIT 100;\n"
- id: query_explain_aggregate
  category: query
  description: EXPLAIN plan for an aggregate query
  sql: "EXPLAIN\nSELECT\n    table_schema,\n    COUNT(*) AS table_count,\n    SUM(CASE WHEN table_type = 'BASE TABLE' THEN 1 ELSE 0 END) AS base_tables\nFROM information_schema.tables\nWHERE table_schema NOT IN ('information_schema', 'pg_catalog')\nGROUP BY table_schema;\n"
  variants:
    snowflake: "SELECT\n    table_schema,\n    COUNT(*) AS table_count,\n    SUM(CASE WHEN table_type = 'BASE TABLE' THEN 1 ELSE 0 END) AS base_tables\nFROM information_schema.tables\nWHERE table_schema NOT IN ('INFORMATION_SCHEMA')\nGROUP BY table_schema;\n"
    clickhouse: "EXPLAIN\nSELECT\n    database AS table_schema,\n    COUNT(*) AS table_count,\n    countIf(engine != 'View') AS base_tables\nFROM system.tables\nWHERE database NOT IN ('system', 'INFORMATION_SCHEMA')\nGROUP BY database;\n"
    bigquery: "SELECT\n    table_schema,\n    COUNT(*) AS table_count,\n    COUNTIF(table_type = 'BASE TABLE') AS base_tables\nFROM INFORMATION_SCHEMA.TABLES\nGROUP BY table_schema;\n"
    sqlite: "EXPLAIN QUERY PLAN WITH sqlite_tables AS (SELECT 'main' AS table_schema, name AS table_name, CASE type WHEN 'view' THEN 'VIEW' ELSE 'BASE TABLE' END AS table_type FROM sqlite_master WHERE type IN ('table', 'view') AND name NOT LIKE 'sqlite_%') SELECT table_schema, COUNT(*) AS table_count, SUM(CASE WHEN table_type = 'BASE TABLE' THEN 1 ELSE 0 END) AS base_tables FROM sqlite_tables WHERE table_schema NOT IN ('information_schema', 'pg_catalog') GROUP BY table_schema;\n"
- id: query_list_constraints
  category: query
  description: List table constraints (where available)
  sql: "SELECT\n    table_schema,\n    table_name,\n    constraint_name,\n    constraint_type\nFROM information_schema.table_constraints\nWHERE table_schema NOT IN ('information_schema', 'pg_catalog')\nORDER BY table_name, constraint_type;\n"
  skip_on:
  - clickhouse
  - bigquery
  - datafusion
  - presto
  - trino
  variants:
    duckdb: "SELECT\n    schema_name AS table_schema,\n    table_name,\n    constraint_text AS constraint_name,\n    constraint_type\nFROM duckdb_constraints()\nWHERE schema_name NOT IN ('information_schema', 'pg_catalog')\nORDER BY table_name, constraint_type;\n"
    sqlite: "WITH sqlite_constraints AS (SELECT table_name, constraint_name, constraint_type FROM (SELECT m.name AS table_name, 'pk_' || m.name AS constraint_name, 'PRIMARY KEY' AS constraint_type, p.name AS column_name, p.pk AS ordinal_position FROM sqlite_master m JOIN pragma_table_info(m.name) p WHERE m.type = 'table' AND m.name NOT LIKE 'sqlite_%' AND p.pk > 0) GROUP BY table_name, constraint_name, constraint_type UNION ALL SELECT table_name, constraint_name, constraint_type FROM (SELECT m.name AS table_name, 'fk_' || m.name || '_' || f.id AS constraint_name, 'FOREIGN KEY' AS constraint_type, f.\"from\" AS column_name, f.seq + 1 AS ordinal_position, f.\"table\" AS parent_table FROM sqlite_master m JOIN pragma_foreign_key_list(m.name) f WHERE m.type = 'table' AND m.name NOT LIKE 'sqlite_%') GROUP BY table_name, constraint_name, constraint_type UNION ALL SELECT table_name, constraint_name, constraint_type FROM (SELECT m.name AS table_name, 'uq_' || m.name || '_' || i.name AS constraint_name, 'UNIQUE' AS constraint_type, ii.name AS column_name, ii.seqno + 1 AS ordinal_position FROM sqlite_master m JOIN pragma_index_list(m.name) i JOIN pragma_index_info(i.name) ii WHERE m.type = 'table' AND m.name NOT LIKE 'sqlite_%' AND i.\"unique\" = 1 AND i.origin = 'u') GROUP BY table_name, constraint_name, constraint_type) SELECT 'main' AS table_schema, table_name, constraint_name, constraint_type FROM sqlite_constraints ORDER BY table_name, constraint_type\n"
- id: wide_table_column_list
