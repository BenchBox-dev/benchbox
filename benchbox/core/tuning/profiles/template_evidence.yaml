        evidence: >-
          scripts.tuning_evidence, 9 shuffled rounds, seed 42, 22 queries, no failures or answer
          mismatches, A/A passed (G 1.0244, 95% CI 0.9861-1.0533): full tuned template G 1.0965
          (1.0443-1.1323), sort only G 1.1235 (1.0559-1.1732), constraints only G 1.0087
