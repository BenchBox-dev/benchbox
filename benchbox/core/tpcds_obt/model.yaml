  table: customer_address
  prefix: ship_addr_
  description: Shipping address attributes
  minimal: true
  keys: {store: ss.ss_addr_sk, web: ws.ws_ship_addr_sk, catalog: cs.cs_ship_addr_sk}
- name: returning_address
  table: customer_address
  prefix: returning_addr_
