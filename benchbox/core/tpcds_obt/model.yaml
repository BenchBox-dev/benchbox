  keys: {store: sr.sr_customer_sk, web: wr.wr_returning_customer_sk, catalog: cr.cr_returning_customer_sk}
- name: refunded_customer
  table: customer
  prefix: refunded_customer_
  description: Refunded customer attributes
  keys: {store: sr.sr_customer_sk, web: wr.wr_refunded_customer_sk, catalog: cr.cr_refunded_customer_sk}
- name: bill_cdemo
  table: customer_demographics
  prefix: bill_cdemo_
  description: Billing customer demographics attributes
  minimal: true
  keys: {store: ss.ss_cdemo_sk, web: ws.ws_bill_cdemo_sk, catalog: cs.cs_bill_cdemo_sk}
