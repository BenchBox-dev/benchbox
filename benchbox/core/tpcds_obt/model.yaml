  via: {role: returning_customer, column: c_current_hdemo_sk}
- name: return_store
  table: store
  prefix: return_store_
  description: Store that took the return
  keys: {store: sr.sr_store_sk}
- name: return_call_center
  table: call_center
  prefix: return_call_center_
  description: Call center that took the return
  keys: {catalog: cr.cr_call_center_sk}
- name: return_catalog_page
  table: catalog_page
  prefix: return_catalog_page_
  description: Catalog page the return refers to
  keys: {catalog: cr.cr_catalog_page_sk}
- name: return_web_page
  table: web_page
  prefix: return_web_page_
