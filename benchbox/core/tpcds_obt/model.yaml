  keys: {store: sr.sr_addr_sk, web: wr.wr_returning_addr_sk, catalog: cr.cr_returning_addr_sk}
- name: refunded_address
  table: customer_address
  prefix: refunded_addr_
  description: Refunded address attributes
  keys: {store: sr.sr_addr_sk, web: wr.wr_refunded_addr_sk, catalog: cr.cr_refunded_addr_sk}
- name: bill_cur_addr
  table: customer_address
  prefix: bill_cur_addr_
  description: Billing customer's current address attributes
  via: {role: bill_customer, column: c_current_addr_sk}
