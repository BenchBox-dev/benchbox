- id: 89
  template: query89.tpl
  template_sha256: a60df27ee23e89fca368f2dab482da8bff61c9303a11dc3787e807ec86dacdfa
  parameters:
    CAT_A:
    - 1
    CAT_B:
    - 1
    CAT_C:
    - 1
    CAT_D:
    - 1
    CAT_E:
    - 1
    CAT_F:
    - 1
    CLASS_A:
    - 1
    CLASS_B:
    - 1
    CLASS_C:
    - 1
    CLASS_D:
    - 1
    CLASS_E:
    - 1
    CLASS_F:
    - 1
    IDX: []
    YEAR:
    - 1
  sql: |-
    SELECT
      *
    FROM (
      SELECT
        obt.item_i_category,
        obt.item_i_class,
        obt.item_i_brand,
        obt.store_s_store_name,
        obt.store_s_company_name,
        obt.sold_date_d_moy,
        SUM(obt.sales_price) AS sum_sales,
        AVG(SUM(obt.sales_price)) OVER (
          PARTITION BY obt.item_i_category, obt.item_i_brand, obt.store_s_store_name, obt.store_s_company_name
        ) AS avg_monthly_sales
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_sk = obt.item_i_item_sk
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.store_sk = obt.store_s_store_sk
          AND obt.sold_date_d_year IN ([YEAR])
          AND (
            (
              obt.item_i_category IN ('[CAT_A]', '[CAT_B]', '[CAT_C]')
              AND obt.item_i_class IN ('[CLASS_A]', '[CLASS_B]', '[CLASS_C]')
            )
            OR (
              obt.item_i_category IN ('[CAT_D]', '[CAT_E]', '[CAT_F]')
              AND obt.item_i_class IN ('[CLASS_D]', '[CLASS_E]', '[CLASS_F]')
            )
          )
        )
        AND channel = 'store'
      GROUP BY
        obt.item_i_category,
        obt.item_i_class,
        obt.item_i_brand,
        obt.store_s_store_name,
        obt.store_s_company_name,
        obt.sold_date_d_moy
    ) AS tmp1
    WHERE
      CASE
        WHEN (
          avg_monthly_sales <> 0
        )
        THEN (
          ABS(sum_sales - avg_monthly_sales) / avg_monthly_sales
        )
        ELSE NULL
      END > 0.1
    ORDER BY
      sum_sales - avg_monthly_sales,
      store_s_store_name
    LIMIT 100
- id: 90
  template: query90.tpl
  template_sha256: 40520ef7e96c93ed3ffacfae84e2d33f2175a795e0db50e36b2c7b1758e24de8
  parameters:
    DEPCNT:
    - 1
    HOUR_AM:
    - 1
    HOUR_PM:
    - 1
  sql: |-
    SELECT
      CAST(amc AS DECIMAL(15, 4)) / CAST(pmc AS DECIMAL(15, 4)) AS am_pm_ratio
    FROM (
      SELECT
        COUNT(*) AS amc
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sold_time_sk = obt.sold_time_t_time_sk
          AND obt.ship_hdemo_sk = obt.ship_hdemo_hd_demo_sk
          AND obt.web_page_sk = obt.web_page_wp_web_page_sk
          AND obt.sold_time_t_hour BETWEEN [HOUR_AM] AND [HOUR_AM] + 1
          AND obt.ship_hdemo_hd_dep_count = [DEPCNT]
          AND obt.web_page_wp_char_count BETWEEN 5000 AND 5200
        )
        AND channel = 'web'
    ) AS am_count, (
      SELECT
        COUNT(*) AS pmc
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sold_time_sk = obt.sold_time_t_time_sk
          AND obt.ship_hdemo_sk = obt.ship_hdemo_hd_demo_sk
          AND obt.web_page_sk = obt.web_page_wp_web_page_sk
          AND obt.sold_time_t_hour BETWEEN [HOUR_PM] AND [HOUR_PM] + 1
          AND obt.ship_hdemo_hd_dep_count = [DEPCNT]
          AND obt.web_page_wp_char_count BETWEEN 5000 AND 5200
        )
        AND channel = 'web'
    ) AS pt
    ORDER BY
      am_pm_ratio
    LIMIT 100
- id: 91
  template: query91.tpl
  template_sha256: 04586097e383871e74dfe5b36dfd363c39676276d61e76b74b84afcbefa8c986
  parameters:
    BUY_POTENTIAL:
    - 1
    GMT:
    - 1
    MONTH:
    - 1
    YEAR:
    - 1
  identifier_parameters:
  - BUY_POTENTIAL
  - GMT
  identifier_map: {}
  sql: |-
    SELECT
      obt.call_center_cc_call_center_id AS Call_Center,
      obt.call_center_cc_name AS Call_Center_Name,
      obt.call_center_cc_manager AS Manager,
      SUM(obt.return_net_loss) AS Returns_Loss
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.call_center_sk = obt.call_center_cc_call_center_sk
        AND obt.returned_date_sk = obt.return_date_d_date_sk
        AND obt.returning_customer_c_customer_sk = obt.returning_customer_c_customer_sk
        AND obt.return_date_d_year = [YEAR]
        AND obt.return_date_d_moy = [MONTH]
        AND (
          (
            obt.returning_cdemo_cd_marital_status = 'M'
            AND obt.returning_cdemo_cd_education_status = 'Unknown'
          )
          OR (
            obt.returning_cdemo_cd_marital_status = 'W'
            AND obt.returning_cdemo_cd_education_status = 'Advanced Degree'
          )
        )
        AND obt.returning_hdemo_hd_buy_potential LIKE '[BUY_POTENTIAL]%'
        AND obt.returning_addr_ca_gmt_offset = [GMT]
      )
      AND channel = 'catalog'
    GROUP BY
      obt.call_center_cc_call_center_id,
      obt.call_center_cc_name,
      obt.call_center_cc_manager,
      obt.returning_cdemo_cd_marital_status,
      obt.returning_cdemo_cd_education_status
    ORDER BY
      SUM(obt.return_net_loss) DESC NULLS FIRST
- id: 92
  template: query92.tpl
  template_sha256: a8e6c13375da18c2ca9cce8d044bedf179e66d199e77b0b53ddf0c8c1f289ee2
  parameters:
    IMID:
    - 1
    WSDATE:
    - 1
    YEAR: []
  sql: |-
    SELECT
      SUM(obt.ext_discount_amt) AS "Excess Discount Amount"
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.item_i_manufact_id = [IMID]
        AND obt.item_i_item_sk = obt.item_sk
        AND obt.sold_date_d_date BETWEEN '[WSDATE]' AND (
          CAST('[WSDATE]' AS DATE) + INTERVAL 90 DAY
        )
        AND obt.sold_date_d_date_sk = obt.sold_date_sk
        AND obt.ext_discount_amt > (
          SELECT
            1.3 * AVG(obt.ext_discount_amt)
          FROM tpcds_sales_returns_obt AS obt
          WHERE
            (
              obt.item_sk = obt.item_i_item_sk
              AND obt.sold_date_d_date BETWEEN '[WSDATE]' AND (
                CAST('[WSDATE]' AS DATE) + INTERVAL 90 DAY
              )
              AND obt.sold_date_d_date_sk = obt.sold_date_sk
            )
            AND channel = 'web'
        )
      )
      AND channel = 'web'
    ORDER BY
      SUM(obt.ext_discount_amt)
    LIMIT 100
- id: 93
  template: query93.tpl
  template_sha256: 94039860c835a6f144c1c2b713fabfc0e19237833d612f14df54807024f44556
  parameters:
    REASON:
    - 1
  sql: |-
    SELECT
      ship_customer_sk,
      SUM(act_sales) AS sumsales
    FROM (
      SELECT
        obt.item_sk,
        obt.sale_id,
        obt.ship_customer_sk,
        CASE
          WHEN obt.return_quantity IS NOT NULL
          THEN (
            obt.quantity - obt.return_quantity
          ) * obt.sales_price
          ELSE (
            obt.quantity * obt.sales_price
          )
        END AS act_sales
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.reason_sk = obt.reason_r_reason_sk AND obt.reason_r_reason_desc = '[REASON]'
        )
        AND channel = 'store'
    ) AS t
    GROUP BY
      ship_customer_sk
    ORDER BY
      sumsales,
      ship_customer_sk
    LIMIT 100
- id: 94
  template: query94.tpl
  template_sha256: 8ac07ea9b9c35daf93d64980825b60676990eec43c70a653c7e6acaad3d1089f
  parameters:
    MONTH:
    - 1
    STATE:
    - 1
    YEAR:
    - 1
  sql: |-
    SELECT
      COUNT(DISTINCT obt.sale_id) AS "order count",
      SUM(obt.ext_ship_cost) AS "total shipping cost",
      SUM(obt.net_profit) AS "total net profit"
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.ship_date_d_date BETWEEN '[YEAR]-[MONTH]-01' AND (
          CAST('[YEAR]-[MONTH]-01' AS DATE) + INTERVAL 60 DAY
        )
        AND obt.ship_date_sk = obt.ship_date_d_date_sk
        AND obt.ship_addr_sk = obt.ship_addr_ca_address_sk
        AND obt.ship_addr_ca_state = '[STATE]'
        AND obt.web_site_sk = obt.web_site_web_site_sk
        AND obt.web_site_web_company_name = 'pri'
        AND EXISTS(
          SELECT
            *
          FROM tpcds_sales_returns_obt AS other_obt WHERE ( other_obt.sale_id = obt.sale_id AND other_obt.warehouse_sk <> obt.warehouse_sk ) AND other_obt.channel = 'web'
        )
        AND NOT EXISTS(
          SELECT
            *
          FROM tpcds_sales_returns_obt AS ret_obt WHERE ret_obt.sale_id = obt.sale_id AND ret_obt.has_return = 'Y' AND ret_obt.channel = 'web'
        )
      )
      AND channel = 'web'
    ORDER BY
      COUNT(DISTINCT obt.sale_id)
    LIMIT 100
- id: 95
  template: query95.tpl
  template_sha256: c4675aad174569ff477d3918c084fd56fd6ab4fac2c5d3c59d078f0889a908ea
  parameters:
    MONTH:
    - 1
    STATE:
    - 1
    YEAR:
    - 1
  sql: |-
    WITH ws_wh AS (
      SELECT DISTINCT
        obt.sale_id AS sale_id,
        obt.warehouse_sk AS wh1,
        other_obt.warehouse_sk AS wh2
      FROM tpcds_sales_returns_obt AS obt
      JOIN tpcds_sales_returns_obt AS other_obt
        ON obt.sale_id = other_obt.sale_id AND obt.warehouse_sk <> other_obt.warehouse_sk
      WHERE
        obt.channel = 'web' AND other_obt.channel = 'web'
    )
    SELECT
      COUNT(DISTINCT obt.sale_id) AS "order count",
      SUM(obt.ext_ship_cost) AS "total shipping cost",
      SUM(obt.net_profit) AS "total net profit"
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.ship_date_d_date BETWEEN '[YEAR]-[MONTH]-01' AND (
          CAST('[YEAR]-[MONTH]-01' AS DATE) + INTERVAL 60 DAY
        )
        AND obt.ship_date_sk = obt.ship_date_d_date_sk
        AND obt.ship_addr_sk = obt.ship_addr_ca_address_sk
        AND obt.ship_addr_ca_state = '[STATE]'
        AND obt.web_site_sk = obt.web_site_web_site_sk
        AND obt.web_site_web_company_name = 'pri'
        AND obt.sale_id IN (
          SELECT
            sale_id
          FROM ws_wh
        )
        AND obt.sale_id IN (
          SELECT
            ret_obt.sale_id
          FROM tpcds_sales_returns_obt AS ret_obt
          WHERE
            ret_obt.sale_id = obt.sale_id AND ret_obt.has_return = 'Y' AND ret_obt.channel = 'web'
        )
      )
      AND channel = 'web'
    ORDER BY
      COUNT(DISTINCT obt.sale_id)
    LIMIT 100
- id: 96
  template: query96.tpl
  template_sha256: 4f153d6102c19ac7fc263575e14ea9ee623d0d72f85e22db8edd2c7411dbf4fc
  parameters:
    DEPCNT:
    - 1
    HOUR:
    - 1
  sql: |-
    SELECT
      COUNT(*)
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.sold_time_sk = obt.sold_time_t_time_sk
        AND obt.ship_hdemo_sk = obt.bill_hdemo_hd_demo_sk
        AND obt.store_sk = obt.store_s_store_sk
        AND obt.sold_time_t_hour = [HOUR]
        AND obt.sold_time_t_minute >= 30
        AND obt.bill_hdemo_hd_dep_count = [DEPCNT]
        AND obt.store_s_store_name = 'ese'
      )
      AND channel = 'store'
    ORDER BY
      COUNT(*)
    LIMIT 100
- id: 97
  template: query97.tpl
  template_sha256: aab37cc8fb542b65063b475eadae9116a36e714a12b562d830713cb1ca8d9c83
  parameters:
    DMS:
    - 1
  sql: |-
    WITH ssci AS (
      SELECT
        obt.ship_customer_sk AS customer_sk,
        obt.item_sk AS item_sk
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_month_seq BETWEEN [DMS] AND [DMS] + 11
        )
        AND channel = 'store'
      GROUP BY
        obt.ship_customer_sk,
        obt.item_sk
    ), csci AS (
      SELECT
        obt.bill_customer_sk AS customer_sk,
        obt.item_sk AS item_sk
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_month_seq BETWEEN [DMS] AND [DMS] + 11
        )
        AND channel = 'catalog'
      GROUP BY
        obt.bill_customer_sk,
        obt.item_sk
    )
    SELECT
      SUM(
        CASE
          WHEN ssci.customer_sk IS NOT NULL AND csci.customer_sk IS NULL
          THEN 1
          ELSE 0
        END
      ) AS store_only,
      SUM(
        CASE
          WHEN ssci.customer_sk IS NULL AND csci.customer_sk IS NOT NULL
          THEN 1
          ELSE 0
        END
      ) AS catalog_only,
      SUM(
        CASE
          WHEN ssci.customer_sk IS NOT NULL AND csci.customer_sk IS NOT NULL
          THEN 1
          ELSE 0
        END
      ) AS store_and_catalog
    FROM ssci
    FULL OUTER JOIN csci
      ON (
        ssci.customer_sk = csci.customer_sk AND ssci.item_sk = csci.item_sk
      )
    LIMIT 100
- id: 98
  template: query98.tpl
  template_sha256: 0c8c2737bd74229df853f45b38f4e6794251422b3f0ec09620282dfc80ede33f
  parameters:
    CATEGORY:
    - 1
    - 2
    - 3
    SDATE:
    - 1
    YEAR: []
  sql: |-
    SELECT
      obt.item_i_item_id,
      obt.item_i_item_desc,
      obt.item_i_category,
      obt.item_i_class,
      obt.item_i_current_price,
      SUM(obt.ext_sales_price) AS itemrevenue,
      SUM(obt.ext_sales_price) * 100 / SUM(SUM(obt.ext_sales_price)) OVER (PARTITION BY obt.item_i_class) AS revenueratio
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.item_sk = obt.item_i_item_sk
        AND obt.item_i_category IN ('[CATEGORY]', '[CATEGORY.2]', '[CATEGORY.3]')
        AND obt.sold_date_sk = obt.sold_date_d_date_sk
        AND obt.sold_date_d_date BETWEEN CAST('[SDATE]' AS DATE) AND (
          CAST('[SDATE]' AS DATE) + INTERVAL 30 DAY
        )
      )
      AND channel = 'store'
    GROUP BY
      obt.item_i_item_id,
      obt.item_i_item_desc,
      obt.item_i_category,
      obt.item_i_class,
      obt.item_i_current_price
    ORDER BY
      obt.item_i_category,
      obt.item_i_class,
      obt.item_i_item_id,
      obt.item_i_item_desc,
      revenueratio
- id: 99
  template: query99.tpl
  template_sha256: a38e5200cecc4731e5f0da0f3eaf798c19372e4c732b5e1a57255e7aee3d2b58
  parameters:
    DMS:
    - 1
  sql: |-
    SELECT
      SUBSTRING(obt.warehouse_w_warehouse_name, 1, 20),
      obt.ship_mode_sm_type,
      obt.call_center_cc_name,
      SUM(CASE WHEN (
        obt.ship_date_sk - obt.sold_date_sk <= 30
      ) THEN 1 ELSE 0 END) AS "30 days",
      SUM(
        CASE
          WHEN (
            obt.ship_date_sk - obt.sold_date_sk > 30
          )
          AND (
            obt.ship_date_sk - obt.sold_date_sk <= 60
          )
          THEN 1
          ELSE 0
        END
      ) AS "31-60 days",
      SUM(
        CASE
          WHEN (
            obt.ship_date_sk - obt.sold_date_sk > 60
          )
          AND (
            obt.ship_date_sk - obt.sold_date_sk <= 90
          )
          THEN 1
          ELSE 0
        END
      ) AS "61-90 days",
      SUM(
        CASE
          WHEN (
            obt.ship_date_sk - obt.sold_date_sk > 90
          )
          AND (
            obt.ship_date_sk - obt.sold_date_sk <= 120
          )
          THEN 1
          ELSE 0
        END
      ) AS "91-120 days",
      SUM(CASE WHEN (
        obt.ship_date_sk - obt.sold_date_sk > 120
      ) THEN 1 ELSE 0 END) AS ">120 days"
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.ship_date_d_month_seq BETWEEN [DMS] AND [DMS] + 11
        AND obt.ship_date_sk = obt.ship_date_d_date_sk
        AND obt.warehouse_sk = obt.warehouse_w_warehouse_sk
        AND obt.ship_mode_sk = obt.ship_mode_sm_ship_mode_sk
        AND obt.call_center_sk = obt.call_center_cc_call_center_sk
      )
      AND channel = 'catalog'
    GROUP BY
      SUBSTRING(obt.warehouse_w_warehouse_name, 1, 20),
      obt.ship_mode_sm_type,
      obt.call_center_cc_name
    ORDER BY
      SUBSTRING(obt.warehouse_w_warehouse_name, 1, 20),
      obt.ship_mode_sm_type,
      obt.call_center_cc_name
    LIMIT 100
