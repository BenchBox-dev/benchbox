                  obt.item_i_color = '[COLOR.9]' OR obt.item_i_color = '[COLOR.10]'
                )
                AND (
                  obt.item_i_units = '[UNIT.9]' OR obt.item_i_units = '[UNIT.10]'
                )
                AND (
                  obt.item_i_size = '[SIZE]' OR obt.item_i_size = '[SIZE.2]'
                )
              )
              OR (
                obt.item_i_category = 'Women'
                AND (
                  obt.item_i_color = '[COLOR.11]' OR obt.item_i_color = '[COLOR.12]'
                )
                AND (
                  obt.item_i_units = '[UNIT.11]' OR obt.item_i_units = '[UNIT.12]'
                )
                AND (
                  obt.item_i_size = '[SIZE.3]' OR obt.item_i_size = '[SIZE.4]'
                )
              )
              OR (
                obt.item_i_category = 'Men'
                AND (
                  obt.item_i_color = '[COLOR.13]' OR obt.item_i_color = '[COLOR.14]'
                )
                AND (
                  obt.item_i_units = '[UNIT.13]' OR obt.item_i_units = '[UNIT.14]'
                )
                AND (
                  obt.item_i_size = '[SIZE.5]' OR obt.item_i_size = '[SIZE.6]'
