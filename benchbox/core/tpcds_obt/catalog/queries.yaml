- id: 56
  template: query56.tpl
  template_sha256: 7a8f163f71ded650bbc9d89af88114b44b7fcc4caafa776857ac229b855c5a3b
  parameters:
    COLOR:
    - 1
    - 2
    - 3
    GMT:
    - 1
    MONTH:
    - 1
    YEAR:
    - 1
  sql: |-
    WITH ss AS (
      SELECT
        obt.item_i_item_id,
        SUM(obt.ext_sales_price) AS total_sales
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_i_item_id IN (
            SELECT
              obt.item_i_item_id
            FROM tpcds_sales_returns_obt AS obt
            WHERE
              obt.item_i_color IN ('[COLOR]', '[COLOR.2]', '[COLOR.3]')
              AND channel IN ('catalog', 'store', 'web')
          )
          AND obt.item_sk = obt.item_i_item_sk
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_year = [YEAR]
          AND obt.sold_date_d_moy = [MONTH]
          AND obt.ship_addr_sk = obt.bill_addr_ca_address_sk
          AND obt.bill_addr_ca_gmt_offset = [GMT]
        )
        AND channel = 'store'
      GROUP BY
        obt.item_i_item_id
    ), cs AS (
      SELECT
        obt.item_i_item_id,
        SUM(obt.ext_sales_price) AS total_sales
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_i_item_id IN (
            SELECT
              obt.item_i_item_id
            FROM tpcds_sales_returns_obt AS obt
            WHERE
              obt.item_i_color IN ('[COLOR]', '[COLOR.2]', '[COLOR.3]')
              AND channel IN ('catalog', 'store', 'web')
          )
          AND obt.item_sk = obt.item_i_item_sk
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_year = [YEAR]
          AND obt.sold_date_d_moy = [MONTH]
          AND obt.bill_addr_sk = obt.bill_addr_ca_address_sk
          AND obt.bill_addr_ca_gmt_offset = [GMT]
        )
        AND channel = 'catalog'
      GROUP BY
        obt.item_i_item_id
    ), ws AS (
      SELECT
        obt.item_i_item_id,
        SUM(obt.ext_sales_price) AS total_sales
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_i_item_id IN (
            SELECT
              obt.item_i_item_id
            FROM tpcds_sales_returns_obt AS obt
            WHERE
              obt.item_i_color IN ('[COLOR]', '[COLOR.2]', '[COLOR.3]')
              AND channel IN ('catalog', 'store', 'web')
          )
          AND obt.item_sk = obt.item_i_item_sk
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_year = [YEAR]
          AND obt.sold_date_d_moy = [MONTH]
          AND obt.bill_addr_sk = obt.bill_addr_ca_address_sk
          AND obt.bill_addr_ca_gmt_offset = [GMT]
        )
        AND channel = 'web'
      GROUP BY
        obt.item_i_item_id
    )
    SELECT
      item_i_item_id,
      SUM(total_sales) AS total_sales
    FROM (
      SELECT
        *
      FROM ss
      UNION ALL
      SELECT
        *
      FROM cs
      UNION ALL
      SELECT
        *
      FROM ws
    ) AS tmp1
    GROUP BY
      item_i_item_id
    ORDER BY
      total_sales,
      item_i_item_id
    LIMIT 100
- id: 57
  template: query57.tpl
  template_sha256: 9833481006694b565ce7e19f513a62b49bb16660731b173e224abbe26f38c240
  parameters:
    ORDERBY:
    - 1
    SELECTONE:
    - 1
    SELECTTWO:
    - 1
    YEAR:
    - 1
  identifier_parameters:
  - ORDERBY
  - SELECTONE
  - SELECTTWO
  identifier_map: {}
  sql: |-
    WITH v1 AS (
      SELECT
        obt.item_i_category AS i_category,
        obt.item_i_brand AS i_brand,
        obt.call_center_cc_name AS cc_name,
        obt.sold_date_d_year AS d_year,
        obt.sold_date_d_moy AS d_moy,
        SUM(obt.sales_price) AS sum_sales,
        AVG(SUM(obt.sales_price)) OVER (
          PARTITION BY obt.item_i_category, obt.item_i_brand, obt.call_center_cc_name, obt.sold_date_d_year
        ) AS avg_monthly_sales,
        RANK() OVER (
          PARTITION BY obt.item_i_category, obt.item_i_brand, obt.call_center_cc_name
          ORDER BY obt.sold_date_d_year, obt.sold_date_d_moy
        ) AS rn
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_sk = obt.item_i_item_sk
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.call_center_cc_call_center_sk = obt.call_center_sk
          AND (
            obt.sold_date_d_year = [YEAR]
            OR (
              obt.sold_date_d_year = [YEAR] - 1 AND obt.sold_date_d_moy = 12
            )
            OR (
              obt.sold_date_d_year = [YEAR] + 1 AND obt.sold_date_d_moy = 1
            )
          )
        )
        AND channel = 'catalog'
      GROUP BY
        obt.item_i_category,
        obt.item_i_brand,
        obt.call_center_cc_name,
        obt.sold_date_d_year,
        obt.sold_date_d_moy
    ), v2 AS (
      SELECT
        [SELECTONE] [SELECTTWO],
        v1.avg_monthly_sales,
        v1.sum_sales,
        v1_lag.sum_sales AS psum,
        v1_lead.sum_sales AS nsum
      FROM v1, v1 AS v1_lag, v1 AS v1_lead
      WHERE
        v1.i_category = v1_lag.i_category
        AND v1.i_category = v1_lead.i_category
        AND v1.i_brand = v1_lag.i_brand
        AND v1.i_brand = v1_lead.i_brand
        AND v1.cc_name = v1_lag.cc_name
        AND v1.cc_name = v1_lead.cc_name
        AND v1.rn = v1_lag.rn + 1
        AND v1.rn = v1_lead.rn - 1
    )
    SELECT
      *
    FROM v2
    WHERE
      d_year = [YEAR]
      AND avg_monthly_sales > 0
      AND CASE
        WHEN avg_monthly_sales > 0
        THEN ABS(sum_sales - avg_monthly_sales) / avg_monthly_sales
        ELSE NULL
      END > 0.1
    ORDER BY
      sum_sales - avg_monthly_sales,
      [ORDERBY]
    LIMIT 100
- id: 58
  template: query58.tpl
  template_sha256: 452109c63497766415fa73ce4ab69d5ba87c10c396c66b1836e7e41ab339e55f
  parameters:
    SALES_DATE:
    - 1
    YEAR: []
  sql: |-
    WITH ss_items AS (
      SELECT
        obt.item_i_item_id AS item_id,
        SUM(obt.ext_sales_price) AS ss_item_rev
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_sk = obt.item_i_item_sk
          AND obt.sold_date_d_date IN (
            SELECT
              obt.sold_date_d_date
            FROM tpcds_sales_returns_obt AS obt
            WHERE
              obt.sold_date_d_week_seq = (
                SELECT
                  MAX(obt.sold_date_d_week_seq)
                FROM tpcds_sales_returns_obt AS obt
                WHERE
                  obt.sold_date_d_date = '[SALES_DATE]'
                  AND channel IN ('catalog', 'store', 'web')
              )
              AND channel IN ('catalog', 'store', 'web')
          )
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
        )
        AND channel = 'store'
      GROUP BY
        obt.item_i_item_id
    ), cs_items AS (
      SELECT
        obt.item_i_item_id AS item_id,
        SUM(obt.ext_sales_price) AS cs_item_rev
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_sk = obt.item_i_item_sk
          AND obt.sold_date_d_date IN (
            SELECT
              obt.sold_date_d_date
            FROM tpcds_sales_returns_obt AS obt
            WHERE
              obt.sold_date_d_week_seq = (
                SELECT
                  MAX(obt.sold_date_d_week_seq)
                FROM tpcds_sales_returns_obt AS obt
                WHERE
                  obt.sold_date_d_date = '[SALES_DATE]'
                  AND channel IN ('catalog', 'store', 'web')
              )
              AND channel IN ('catalog', 'store', 'web')
          )
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
        )
        AND channel = 'catalog'
      GROUP BY
        obt.item_i_item_id
    ), ws_items AS (
      SELECT
        obt.item_i_item_id AS item_id,
        SUM(obt.ext_sales_price) AS ws_item_rev
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_sk = obt.item_i_item_sk
          AND obt.sold_date_d_date IN (
            SELECT
              obt.sold_date_d_date
            FROM tpcds_sales_returns_obt AS obt
            WHERE
              obt.sold_date_d_week_seq = (
                SELECT
                  MAX(obt.sold_date_d_week_seq)
                FROM tpcds_sales_returns_obt AS obt
                WHERE
                  obt.sold_date_d_date = '[SALES_DATE]'
                  AND channel IN ('catalog', 'store', 'web')
              )
              AND channel IN ('catalog', 'store', 'web')
          )
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
        )
        AND channel = 'web'
      GROUP BY
        obt.item_i_item_id
    )
    SELECT
      ss_items.item_id,
      ss_item_rev,
      ss_item_rev / (
        (
          ss_item_rev + cs_item_rev + ws_item_rev
        ) / 3
      ) * 100 AS ss_dev,
      cs_item_rev,
      cs_item_rev / (
        (
          ss_item_rev + cs_item_rev + ws_item_rev
        ) / 3
      ) * 100 AS cs_dev,
      ws_item_rev,
      ws_item_rev / (
        (
          ss_item_rev + cs_item_rev + ws_item_rev
        ) / 3
      ) * 100 AS ws_dev,
      (
        ss_item_rev + cs_item_rev + ws_item_rev
      ) / 3 AS average
    FROM ss_items, cs_items, ws_items
    WHERE
      ss_items.item_id = cs_items.item_id
      AND ss_items.item_id = ws_items.item_id
      AND ss_item_rev BETWEEN 0.9 * cs_item_rev AND 1.1 * cs_item_rev
      AND ss_item_rev BETWEEN 0.9 * ws_item_rev AND 1.1 * ws_item_rev
      AND cs_item_rev BETWEEN 0.9 * ss_item_rev AND 1.1 * ss_item_rev
      AND cs_item_rev BETWEEN 0.9 * ws_item_rev AND 1.1 * ws_item_rev
      AND ws_item_rev BETWEEN 0.9 * ss_item_rev AND 1.1 * ss_item_rev
      AND ws_item_rev BETWEEN 0.9 * cs_item_rev AND 1.1 * cs_item_rev
    ORDER BY
      ss_items.item_id,
      ss_item_rev
    LIMIT 100
- id: 59
  template: query59.tpl
  template_sha256: 5f43ea2aefd5c90096eafa1313b296e4073849f5e54e5b12de4b7daf6dd32bb7
  parameters:
    DMS:
    - 1
  sql: |-
    WITH wss AS (
      SELECT
        obt.sold_date_d_week_seq,
        obt.store_sk,
        obt.store_s_store_name,
        obt.store_s_store_id,
        obt.sold_date_d_month_seq,
        SUM(
          CASE
            WHEN (
              obt.sold_date_d_day_name = 'Sunday'
            )
            THEN obt.sales_price
            ELSE NULL
          END
        ) AS sun_sales,
        SUM(
          CASE
            WHEN (
              obt.sold_date_d_day_name = 'Monday'
            )
            THEN obt.sales_price
            ELSE NULL
          END
        ) AS mon_sales,
        SUM(
          CASE
            WHEN (
              obt.sold_date_d_day_name = 'Tuesday'
            )
            THEN obt.sales_price
            ELSE NULL
          END
        ) AS tue_sales,
        SUM(
          CASE
            WHEN (
              obt.sold_date_d_day_name = 'Wednesday'
            )
            THEN obt.sales_price
            ELSE NULL
          END
        ) AS wed_sales,
        SUM(
          CASE
            WHEN (
              obt.sold_date_d_day_name = 'Thursday'
            )
            THEN obt.sales_price
            ELSE NULL
          END
        ) AS thu_sales,
        SUM(
          CASE
            WHEN (
              obt.sold_date_d_day_name = 'Friday'
            )
            THEN obt.sales_price
            ELSE NULL
          END
        ) AS fri_sales,
        SUM(
          CASE
            WHEN (
              obt.sold_date_d_day_name = 'Saturday'
            )
            THEN obt.sales_price
            ELSE NULL
          END
        ) AS sat_sales
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        obt.sold_date_d_date_sk = obt.sold_date_sk AND channel = 'store'
      GROUP BY
        obt.sold_date_d_week_seq,
        obt.store_sk,
        obt.store_s_store_name,
        obt.store_s_store_id,
        obt.sold_date_d_month_seq
    )
    SELECT
      s_store_name1 AS store_s_store_name,
      s_store_id1 AS store_s_store_id,
      d_week_seq1,
      sun_sales1 / sun_sales2,
      mon_sales1 / mon_sales2,
      tue_sales1 / tue_sales2,
      wed_sales1 / wed_sales2,
      thu_sales1 / thu_sales2,
      fri_sales1 / fri_sales2,
      sat_sales1 / sat_sales2
    FROM (
      SELECT
        wss.store_s_store_name AS s_store_name1,
        wss.sold_date_d_week_seq AS d_week_seq1,
        wss.store_s_store_id AS s_store_id1,
        sun_sales AS sun_sales1,
        mon_sales AS mon_sales1,
        tue_sales AS tue_sales1,
        wed_sales AS wed_sales1,
        thu_sales AS thu_sales1,
        fri_sales AS fri_sales1,
        sat_sales AS sat_sales1
      FROM wss
      WHERE
        wss.sold_date_d_month_seq BETWEEN [DMS] AND [DMS] + 11
    ) AS y, (
      SELECT
        wss.store_s_store_name AS s_store_name2,
        wss.sold_date_d_week_seq AS d_week_seq2,
        wss.store_s_store_id AS s_store_id2,
        sun_sales AS sun_sales2,
        mon_sales AS mon_sales2,
        tue_sales AS tue_sales2,
        wed_sales AS wed_sales2,
        thu_sales AS thu_sales2,
        fri_sales AS fri_sales2,
        sat_sales AS sat_sales2
      FROM wss
      WHERE
        wss.sold_date_d_month_seq BETWEEN [DMS] + 12 AND [DMS] + 23
    ) AS x
    WHERE
      s_store_id1 = s_store_id2 AND d_week_seq1 = d_week_seq2 - 52
    ORDER BY
      store_s_store_name,
      store_s_store_id,
      d_week_seq1
    LIMIT 100
- id: 60
  template: query60.tpl
  template_sha256: 97c30bec850e139ec4ab0206c8c54fbd6d96258e9af24669660b8220b32961fe
  parameters:
    CATEGORY:
    - 1
    GMT:
    - 1
    MONTH:
    - 1
    YEAR:
    - 1
  identifier_parameters:
  - CATEGORY
  identifier_map: {}
  sql: |-
    WITH ss AS (
      SELECT
        obt.item_i_item_id,
        SUM(obt.ext_sales_price) AS total_sales
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_i_item_id IN (
            SELECT
              obt.item_i_item_id
            FROM tpcds_sales_returns_obt AS obt
            WHERE
              obt.item_i_category IN ('[CATEGORY]')
              AND channel IN ('catalog', 'store', 'web')
          )
          AND obt.item_sk = obt.item_i_item_sk
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_year = [YEAR]
          AND obt.sold_date_d_moy = [MONTH]
          AND obt.ship_addr_sk = obt.bill_addr_ca_address_sk
          AND obt.bill_addr_ca_gmt_offset = [GMT]
        )
        AND channel = 'store'
      GROUP BY
        obt.item_i_item_id
    ), cs AS (
      SELECT
        obt.item_i_item_id,
        SUM(obt.ext_sales_price) AS total_sales
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_i_item_id IN (
            SELECT
              obt.item_i_item_id
            FROM tpcds_sales_returns_obt AS obt
            WHERE
              obt.item_i_category IN ('[CATEGORY]')
              AND channel IN ('catalog', 'store', 'web')
          )
          AND obt.item_sk = obt.item_i_item_sk
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_year = [YEAR]
          AND obt.sold_date_d_moy = [MONTH]
          AND obt.bill_addr_sk = obt.bill_addr_ca_address_sk
          AND obt.bill_addr_ca_gmt_offset = [GMT]
        )
        AND channel = 'catalog'
      GROUP BY
        obt.item_i_item_id
    ), ws AS (
      SELECT
        obt.item_i_item_id,
        SUM(obt.ext_sales_price) AS total_sales
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_i_item_id IN (
            SELECT
              obt.item_i_item_id
            FROM tpcds_sales_returns_obt AS obt
            WHERE
              obt.item_i_category IN ('[CATEGORY]')
              AND channel IN ('catalog', 'store', 'web')
          )
          AND obt.item_sk = obt.item_i_item_sk
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_year = [YEAR]
          AND obt.sold_date_d_moy = [MONTH]
          AND obt.bill_addr_sk = obt.bill_addr_ca_address_sk
          AND obt.bill_addr_ca_gmt_offset = [GMT]
        )
        AND channel = 'web'
      GROUP BY
        obt.item_i_item_id
    )
    SELECT
      item_i_item_id,
      SUM(total_sales) AS total_sales
    FROM (
      SELECT
        *
      FROM ss
      UNION ALL
      SELECT
        *
      FROM cs
      UNION ALL
      SELECT
        *
      FROM ws
    ) AS tmp1
    GROUP BY
      item_i_item_id
    ORDER BY
      item_i_item_id,
      total_sales
    LIMIT 100
- id: 61
  template: query61.tpl
  template_sha256: 9501f48fd73d4ed27111943dfa869480695884d70b9aaaf054a0585ee49c8d6f
  parameters:
    CATEGORY:
    - 1
    GMT:
    - 1
    MONTH:
    - 1
    YEAR:
    - 1
  identifier_parameters:
  - CATEGORY
  - GMT
  identifier_map: {}
  sql: |-
    SELECT
      promotions,
      total,
      CAST(promotions AS DECIMAL(15, 4)) / CAST(total AS DECIMAL(15, 4)) * 100
    FROM (
      SELECT
        SUM(obt.ext_sales_price) AS promotions
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.store_sk = obt.store_s_store_sk
          AND obt.promo_sk = obt.promo_p_promo_sk
          AND obt.ship_customer_sk = obt.bill_customer_c_customer_sk
          AND obt.item_sk = obt.item_i_item_sk
          AND obt.bill_addr_ca_gmt_offset = [GMT]
          AND obt.item_i_category = '[CATEGORY]'
          AND (
            obt.promo_p_channel_dmail = 'Y'
            OR obt.promo_p_channel_email = 'Y'
            OR obt.promo_p_channel_tv = 'Y'
          )
          AND obt.store_s_gmt_offset = [GMT]
          AND obt.sold_date_d_year = [YEAR]
          AND obt.sold_date_d_moy = [MONTH]
        )
        AND channel = 'store'
    ) AS promotional_sales, (
      SELECT
        SUM(obt.ext_sales_price) AS total
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.store_sk = obt.store_s_store_sk
          AND obt.ship_customer_sk = obt.bill_customer_c_customer_sk
          AND obt.item_sk = obt.item_i_item_sk
          AND obt.bill_addr_ca_gmt_offset = [GMT]
          AND obt.item_i_category = '[CATEGORY]'
          AND obt.store_s_gmt_offset = [GMT]
          AND obt.sold_date_d_year = [YEAR]
          AND obt.sold_date_d_moy = [MONTH]
        )
        AND channel = 'store'
    ) AS all_sales
    ORDER BY
      promotions,
      total
    LIMIT 100
- id: 62
  template: query62.tpl
  template_sha256: a20540c366048c36a67c2e8779472beee91f81e2a95981918ffe9186a901454e
  parameters:
    DMS:
    - 1
  sql: |-
    SELECT
      SUBSTRING(obt.warehouse_w_warehouse_name, 1, 20),
      obt.ship_mode_sm_type,
      obt.web_site_web_name,
      SUM(CASE WHEN (
        obt.ship_date_sk - obt.sold_date_sk <= 30
      ) THEN 1 ELSE 0 END) AS "30 days",
      SUM(
        CASE
          WHEN (
            obt.ship_date_sk - obt.sold_date_sk > 30
          )
          AND (
            obt.ship_date_sk - obt.sold_date_sk <= 60
          )
          THEN 1
          ELSE 0
        END
      ) AS "31-60 days",
      SUM(
        CASE
          WHEN (
            obt.ship_date_sk - obt.sold_date_sk > 60
          )
          AND (
            obt.ship_date_sk - obt.sold_date_sk <= 90
          )
          THEN 1
          ELSE 0
        END
      ) AS "61-90 days",
      SUM(
        CASE
          WHEN (
            obt.ship_date_sk - obt.sold_date_sk > 90
          )
          AND (
            obt.ship_date_sk - obt.sold_date_sk <= 120
          )
          THEN 1
          ELSE 0
        END
      ) AS "91-120 days",
      SUM(CASE WHEN (
        obt.ship_date_sk - obt.sold_date_sk > 120
      ) THEN 1 ELSE 0 END) AS ">120 days"
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.ship_date_d_month_seq BETWEEN [DMS] AND [DMS] + 11
        AND obt.ship_date_sk = obt.ship_date_d_date_sk
        AND obt.warehouse_sk = obt.warehouse_w_warehouse_sk
        AND obt.ship_mode_sk = obt.ship_mode_sm_ship_mode_sk
        AND obt.web_site_sk = obt.web_site_web_site_sk
      )
      AND channel = 'web'
    GROUP BY
      SUBSTRING(obt.warehouse_w_warehouse_name, 1, 20),
      obt.ship_mode_sm_type,
      obt.web_site_web_name
    ORDER BY
      SUBSTRING(obt.warehouse_w_warehouse_name, 1, 20),
      obt.ship_mode_sm_type,
      obt.web_site_web_name
    LIMIT 100
- id: 63
  template: query63.tpl
  template_sha256: cd290b6f8a83e690fcfa8ee29ce49cbd153a88840b7712dc1ced3912f5870459
  parameters:
    DMS:
    - 1
  sql: |-
    SELECT
      *
    FROM (
      SELECT
        obt.item_i_manager_id,
        SUM(obt.sales_price) AS sum_sales,
        AVG(SUM(obt.sales_price)) OVER (PARTITION BY obt.item_i_manager_id) AS avg_monthly_sales
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_sk = obt.item_i_item_sk
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.store_sk = obt.store_s_store_sk
          AND obt.sold_date_d_month_seq IN (
            [DMS],
            [DMS] + 1,
            [DMS] + 2,
            [DMS] + 3,
            [DMS] + 4,
            [DMS] + 5,
            [DMS] + 6,
            [DMS] + 7,
            [DMS] + 8,
            [DMS] + 9,
            [DMS] + 10,
            [DMS] + 11
          )
          AND (
            (
              obt.item_i_category IN ('Books', 'Children', 'Electronics')
              AND obt.item_i_class IN ('personal', 'portable', 'reference', 'self-help')
              AND obt.item_i_brand IN (
                'scholaramalgamalg #14',
                'scholaramalgamalg #7',
                'exportiunivamalg #9',
                'scholaramalgamalg #9'
              )
            )
            OR (
              obt.item_i_category IN ('Women', 'Music', 'Men')
              AND obt.item_i_class IN ('accessories', 'classical', 'fragrances', 'pants')
              AND obt.item_i_brand IN ('amalgimporto #1', 'edu packscholar #1', 'exportiimporto #1', 'importoamalg #1')
            )
          )
        )
        AND channel = 'store'
      GROUP BY
        obt.item_i_manager_id,
        obt.sold_date_d_moy
    ) AS tmp1
    WHERE
      CASE
        WHEN avg_monthly_sales > 0
        THEN ABS(sum_sales - avg_monthly_sales) / avg_monthly_sales
        ELSE NULL
      END > 0.1
    ORDER BY
      item_i_manager_id,
      avg_monthly_sales,
      sum_sales
    LIMIT 100
- id: 65
  template: query65.tpl
  template_sha256: 4769a55171ba59d35d667d6b108a6d7d5e5723f704823e2a875474cf4604c838
  parameters:
    DMS:
    - 1
  sql: |-
    SELECT
      obt.store_s_store_name,
      obt.item_i_item_desc,
      sc.revenue,
      obt.item_i_current_price,
      obt.item_i_wholesale_cost,
      obt.item_i_brand
    FROM tpcds_sales_returns_obt AS obt
    CROSS JOIN (
      SELECT
        store_sk,
        AVG(revenue) AS ave
      FROM (
        SELECT
          obt.store_sk,
          obt.item_sk,
          SUM(obt.sales_price) AS revenue
        FROM tpcds_sales_returns_obt AS obt
        WHERE
          (
            obt.sold_date_sk = obt.sold_date_d_date_sk
            AND obt.sold_date_d_month_seq BETWEEN [DMS] AND [DMS] + 11
          )
          AND channel = 'store'
        GROUP BY
          obt.store_sk,
          obt.item_sk
      ) AS sa
      GROUP BY
        store_sk
    ) AS sb
    CROSS JOIN (
      SELECT
        obt.store_sk AS store_sk,
        obt.item_sk AS item_sk,
        SUM(obt.sales_price) AS revenue
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_month_seq BETWEEN [DMS] AND [DMS] + 11
        )
        AND channel = 'store'
      GROUP BY
        obt.store_sk,
        obt.item_sk
    ) AS sc
    WHERE
      (
        sb.store_sk = sc.store_sk
        AND sc.revenue <= 0.1 * sb.ave
        AND obt.store_s_store_sk = sc.store_sk
        AND obt.item_i_item_sk = sc.item_sk
      )
      AND channel = 'store'
    ORDER BY
      obt.store_s_store_name,
      obt.item_i_item_desc
    LIMIT 100
- id: 66
  template: query66.tpl
  template_sha256: 83c4b13212c223c138c2f807f65b67371192a540acff4e4906b747ef4f0b7c13
  parameters:
    NETONE:
    - 1
    NETTWO:
    - 1
    SALESONE:
    - 1
    SALESTWO:
    - 1
    SMC:
    - 1
    - 2
    TIMEONE:
    - 1
    YEAR:
    - 1
  identifier_parameters:
  - NETONE
  - NETTWO
  - SALESONE
  - SALESTWO
  identifier_map:
    cs_ext_list_price: ext_list_price
    cs_ext_sales_price: ext_sales_price
    cs_net_paid: net_paid
    cs_net_paid_inc_ship: net_paid_inc_ship
    cs_net_paid_inc_ship_tax: net_paid_inc_ship_tax
    cs_net_paid_inc_tax: net_paid_inc_tax
    cs_net_profit: net_profit
    cs_sales_price: sales_price
    ws_ext_list_price: ext_list_price
    ws_ext_sales_price: ext_sales_price
    ws_net_paid: net_paid
    ws_net_paid_inc_ship: net_paid_inc_ship
    ws_net_paid_inc_ship_tax: net_paid_inc_ship_tax
    ws_net_paid_inc_tax: net_paid_inc_tax
    ws_net_profit: net_profit
    ws_sales_price: sales_price
  sql: |-
    SELECT
      warehouse_w_warehouse_name,
      warehouse_w_warehouse_sq_ft,
      warehouse_w_city,
      warehouse_w_county,
      warehouse_w_state,
      warehouse_w_country,
      ship_carriers,
      year,
      SUM(jan_sales) AS jan_sales,
      SUM(feb_sales) AS feb_sales,
      SUM(mar_sales) AS mar_sales,
      SUM(apr_sales) AS apr_sales,
      SUM(may_sales) AS may_sales,
      SUM(jun_sales) AS jun_sales,
      SUM(jul_sales) AS jul_sales,
      SUM(aug_sales) AS aug_sales,
      SUM(sep_sales) AS sep_sales,
      SUM(oct_sales) AS oct_sales,
      SUM(nov_sales) AS nov_sales,
      SUM(dec_sales) AS dec_sales,
      SUM(jan_sales / warehouse_w_warehouse_sq_ft) AS jan_sales_per_sq_foot,
      SUM(feb_sales / warehouse_w_warehouse_sq_ft) AS feb_sales_per_sq_foot,
      SUM(mar_sales / warehouse_w_warehouse_sq_ft) AS mar_sales_per_sq_foot,
      SUM(apr_sales / warehouse_w_warehouse_sq_ft) AS apr_sales_per_sq_foot,
      SUM(may_sales / warehouse_w_warehouse_sq_ft) AS may_sales_per_sq_foot,
      SUM(jun_sales / warehouse_w_warehouse_sq_ft) AS jun_sales_per_sq_foot,
      SUM(jul_sales / warehouse_w_warehouse_sq_ft) AS jul_sales_per_sq_foot,
      SUM(aug_sales / warehouse_w_warehouse_sq_ft) AS aug_sales_per_sq_foot,
      SUM(sep_sales / warehouse_w_warehouse_sq_ft) AS sep_sales_per_sq_foot,
      SUM(oct_sales / warehouse_w_warehouse_sq_ft) AS oct_sales_per_sq_foot,
      SUM(nov_sales / warehouse_w_warehouse_sq_ft) AS nov_sales_per_sq_foot,
      SUM(dec_sales / warehouse_w_warehouse_sq_ft) AS dec_sales_per_sq_foot,
      SUM(jan_net) AS jan_net,
      SUM(feb_net) AS feb_net,
      SUM(mar_net) AS mar_net,
      SUM(apr_net) AS apr_net,
      SUM(may_net) AS may_net,
      SUM(jun_net) AS jun_net,
      SUM(jul_net) AS jul_net,
      SUM(aug_net) AS aug_net,
      SUM(sep_net) AS sep_net,
      SUM(oct_net) AS oct_net,
      SUM(nov_net) AS nov_net,
      SUM(dec_net) AS dec_net
    FROM (
      SELECT
        obt.warehouse_w_warehouse_name,
        obt.warehouse_w_warehouse_sq_ft,
        obt.warehouse_w_city,
        obt.warehouse_w_county,
        obt.warehouse_w_state,
        obt.warehouse_w_country,
        '[SMC]' || ',' || '[SMC.2]' AS ship_carriers,
        obt.sold_date_d_year AS year,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 1
            THEN [SALESONE] * obt.quantity
            ELSE 0
          END
        ) AS jan_sales,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 2
            THEN [SALESONE] * obt.quantity
            ELSE 0
          END
        ) AS feb_sales,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 3
            THEN [SALESONE] * obt.quantity
            ELSE 0
          END
        ) AS mar_sales,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 4
            THEN [SALESONE] * obt.quantity
            ELSE 0
          END
        ) AS apr_sales,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 5
            THEN [SALESONE] * obt.quantity
            ELSE 0
          END
        ) AS may_sales,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 6
            THEN [SALESONE] * obt.quantity
            ELSE 0
          END
        ) AS jun_sales,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 7
            THEN [SALESONE] * obt.quantity
            ELSE 0
          END
        ) AS jul_sales,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 8
            THEN [SALESONE] * obt.quantity
            ELSE 0
          END
        ) AS aug_sales,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 9
            THEN [SALESONE] * obt.quantity
            ELSE 0
          END
        ) AS sep_sales,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 10
            THEN [SALESONE] * obt.quantity
            ELSE 0
          END
        ) AS oct_sales,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 11
            THEN [SALESONE] * obt.quantity
            ELSE 0
          END
        ) AS nov_sales,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 12
            THEN [SALESONE] * obt.quantity
            ELSE 0
          END
        ) AS dec_sales,
        SUM(
          CASE WHEN obt.sold_date_d_moy = 1 THEN [NETONE] * obt.quantity ELSE 0 END
        ) AS jan_net,
        SUM(
          CASE WHEN obt.sold_date_d_moy = 2 THEN [NETONE] * obt.quantity ELSE 0 END
        ) AS feb_net,
        SUM(
          CASE WHEN obt.sold_date_d_moy = 3 THEN [NETONE] * obt.quantity ELSE 0 END
        ) AS mar_net,
        SUM(
          CASE WHEN obt.sold_date_d_moy = 4 THEN [NETONE] * obt.quantity ELSE 0 END
        ) AS apr_net,
        SUM(
          CASE WHEN obt.sold_date_d_moy = 5 THEN [NETONE] * obt.quantity ELSE 0 END
        ) AS may_net,
        SUM(
          CASE WHEN obt.sold_date_d_moy = 6 THEN [NETONE] * obt.quantity ELSE 0 END
        ) AS jun_net,
        SUM(
          CASE WHEN obt.sold_date_d_moy = 7 THEN [NETONE] * obt.quantity ELSE 0 END
        ) AS jul_net,
        SUM(
          CASE WHEN obt.sold_date_d_moy = 8 THEN [NETONE] * obt.quantity ELSE 0 END
        ) AS aug_net,
        SUM(
          CASE WHEN obt.sold_date_d_moy = 9 THEN [NETONE] * obt.quantity ELSE 0 END
        ) AS sep_net,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 10
            THEN [NETONE] * obt.quantity
            ELSE 0
          END
        ) AS oct_net,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 11
            THEN [NETONE] * obt.quantity
            ELSE 0
          END
        ) AS nov_net,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 12
            THEN [NETONE] * obt.quantity
            ELSE 0
          END
        ) AS dec_net
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.warehouse_sk = obt.warehouse_w_warehouse_sk
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_time_sk = sold_time_t_time_sk
          AND obt.ship_mode_sk = obt.ship_mode_sm_ship_mode_sk
          AND obt.sold_date_d_year = [YEAR]
          AND sold_time_t_time BETWEEN [TIMEONE] AND [TIMEONE] + 28800
          AND obt.ship_mode_sm_carrier IN ('[SMC]', '[SMC.2]')
        )
        AND channel = 'web'
      GROUP BY
        obt.warehouse_w_warehouse_name,
        obt.warehouse_w_warehouse_sq_ft,
        obt.warehouse_w_city,
        obt.warehouse_w_county,
        obt.warehouse_w_state,
        obt.warehouse_w_country,
        obt.sold_date_d_year
      UNION ALL
      SELECT
        obt.warehouse_w_warehouse_name,
        obt.warehouse_w_warehouse_sq_ft,
        obt.warehouse_w_city,
        obt.warehouse_w_county,
        obt.warehouse_w_state,
        obt.warehouse_w_country,
        '[SMC]' || ',' || '[SMC.2]' AS ship_carriers,
        obt.sold_date_d_year AS year,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 1
            THEN [SALESTWO] * obt.quantity
            ELSE 0
          END
        ) AS jan_sales,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 2
            THEN [SALESTWO] * obt.quantity
            ELSE 0
          END
        ) AS feb_sales,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 3
            THEN [SALESTWO] * obt.quantity
            ELSE 0
          END
        ) AS mar_sales,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 4
            THEN [SALESTWO] * obt.quantity
            ELSE 0
          END
        ) AS apr_sales,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 5
            THEN [SALESTWO] * obt.quantity
            ELSE 0
          END
        ) AS may_sales,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 6
            THEN [SALESTWO] * obt.quantity
            ELSE 0
          END
        ) AS jun_sales,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 7
            THEN [SALESTWO] * obt.quantity
            ELSE 0
          END
        ) AS jul_sales,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 8
            THEN [SALESTWO] * obt.quantity
            ELSE 0
          END
        ) AS aug_sales,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 9
            THEN [SALESTWO] * obt.quantity
            ELSE 0
          END
        ) AS sep_sales,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 10
            THEN [SALESTWO] * obt.quantity
            ELSE 0
          END
        ) AS oct_sales,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 11
            THEN [SALESTWO] * obt.quantity
            ELSE 0
          END
        ) AS nov_sales,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 12
            THEN [SALESTWO] * obt.quantity
            ELSE 0
          END
        ) AS dec_sales,
        SUM(
          CASE WHEN obt.sold_date_d_moy = 1 THEN [NETTWO] * obt.quantity ELSE 0 END
        ) AS jan_net,
        SUM(
          CASE WHEN obt.sold_date_d_moy = 2 THEN [NETTWO] * obt.quantity ELSE 0 END
        ) AS feb_net,
        SUM(
          CASE WHEN obt.sold_date_d_moy = 3 THEN [NETTWO] * obt.quantity ELSE 0 END
        ) AS mar_net,
        SUM(
          CASE WHEN obt.sold_date_d_moy = 4 THEN [NETTWO] * obt.quantity ELSE 0 END
        ) AS apr_net,
        SUM(
          CASE WHEN obt.sold_date_d_moy = 5 THEN [NETTWO] * obt.quantity ELSE 0 END
        ) AS may_net,
        SUM(
          CASE WHEN obt.sold_date_d_moy = 6 THEN [NETTWO] * obt.quantity ELSE 0 END
        ) AS jun_net,
        SUM(
          CASE WHEN obt.sold_date_d_moy = 7 THEN [NETTWO] * obt.quantity ELSE 0 END
        ) AS jul_net,
        SUM(
          CASE WHEN obt.sold_date_d_moy = 8 THEN [NETTWO] * obt.quantity ELSE 0 END
        ) AS aug_net,
        SUM(
          CASE WHEN obt.sold_date_d_moy = 9 THEN [NETTWO] * obt.quantity ELSE 0 END
        ) AS sep_net,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 10
            THEN [NETTWO] * obt.quantity
            ELSE 0
          END
        ) AS oct_net,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 11
            THEN [NETTWO] * obt.quantity
            ELSE 0
          END
        ) AS nov_net,
        SUM(
          CASE
            WHEN obt.sold_date_d_moy = 12
            THEN [NETTWO] * obt.quantity
            ELSE 0
          END
        ) AS dec_net
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.warehouse_sk = obt.warehouse_w_warehouse_sk
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_time_sk = sold_time_t_time_sk
          AND obt.ship_mode_sk = obt.ship_mode_sm_ship_mode_sk
          AND obt.sold_date_d_year = [YEAR]
          AND sold_time_t_time BETWEEN [TIMEONE] AND [TIMEONE] + 28800
          AND obt.ship_mode_sm_carrier IN ('[SMC]', '[SMC.2]')
        )
        AND channel = 'catalog'
      GROUP BY
        obt.warehouse_w_warehouse_name,
        obt.warehouse_w_warehouse_sq_ft,
        obt.warehouse_w_city,
        obt.warehouse_w_county,
        obt.warehouse_w_state,
        obt.warehouse_w_country,
        obt.sold_date_d_year
    ) AS x
    GROUP BY
      warehouse_w_warehouse_name,
      warehouse_w_warehouse_sq_ft,
      warehouse_w_city,
      warehouse_w_county,
      warehouse_w_state,
      warehouse_w_country,
      ship_carriers,
      year
    ORDER BY
      warehouse_w_warehouse_name
    LIMIT 100
- id: 67
  template: query67.tpl
  template_sha256: 3bb0ac8d59ee37e04f223ff90041bfd2e0bb0a8cbf0aedaab3c9c610338e99cc
  parameters:
    DMS:
    - 1
  sql: |-
    SELECT
      *
    FROM (
      SELECT
        item_i_category,
        item_i_class,
        item_i_brand,
        item_i_product_name,
        sold_date_d_year,
        sold_date_d_qoy,
        sold_date_d_moy,
        store_s_store_id,
        sumsales,
        RANK() OVER (PARTITION BY item_i_category ORDER BY sumsales DESC NULLS FIRST) AS rk
      FROM (
        SELECT
          obt.item_i_category,
          obt.item_i_class,
          obt.item_i_brand,
          obt.item_i_product_name,
          obt.sold_date_d_year,
          obt.sold_date_d_qoy,
          obt.sold_date_d_moy,
          obt.store_s_store_id,
          SUM(COALESCE(obt.sales_price * obt.quantity, 0)) AS sumsales
        FROM tpcds_sales_returns_obt AS obt
        WHERE
          (
            obt.sold_date_sk = obt.sold_date_d_date_sk
            AND obt.item_sk = obt.item_i_item_sk
            AND obt.store_sk = obt.store_s_store_sk
            AND obt.sold_date_d_month_seq BETWEEN [DMS] AND [DMS] + 11
          )
          AND channel = 'store'
        GROUP BY
          ROLLUP (
            obt.item_i_category,
            obt.item_i_class,
            obt.item_i_brand,
            obt.item_i_product_name,
            obt.sold_date_d_year,
            obt.sold_date_d_qoy,
            obt.sold_date_d_moy,
            obt.store_s_store_id
          )
      ) AS dw1
    ) AS dw2
    WHERE
      rk <= 100
    ORDER BY
      item_i_category,
      item_i_class,
      item_i_brand,
      item_i_product_name,
      sold_date_d_year,
      sold_date_d_qoy,
      sold_date_d_moy,
      store_s_store_id,
      sumsales,
      rk
    LIMIT 100
- id: 69
  template: query69.tpl
  template_sha256: f02e8b9792ebf3adae7440c25f513492485dcbcef85f6d4a97c183f707aa562a
  parameters:
    MONTH:
    - 1
    STATE:
    - 1
    - 2
    - 3
    YEAR:
    - 1
  sql: |-
    SELECT
      obt.bill_cdemo_cd_gender,
      obt.bill_cdemo_cd_marital_status,
      obt.bill_cdemo_cd_education_status,
      COUNT(*) AS cnt1,
      obt.bill_cdemo_cd_purchase_estimate,
      COUNT(*) AS cnt2,
      obt.bill_cdemo_cd_credit_rating,
      COUNT(*) AS cnt3
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.bill_addr_ca_state IN ('[STATE]', '[STATE.2]', '[STATE.3]')
        AND EXISTS(
          SELECT
            *
          FROM tpcds_sales_returns_obt AS ex_obt WHERE ( ex_obt.bill_customer_c_customer_sk = obt.bill_customer_c_customer_sk
              AND ex_obt.sold_date_sk = ex_obt.sold_date_d_date_sk
              AND ex_obt.sold_date_d_year = [YEAR]
              AND ex_obt.sold_date_d_moy BETWEEN [MONTH] AND [MONTH] + 2
            ) AND ex_obt.channel = 'store'
        )
        AND (
          NOT EXISTS(
            SELECT
              *
            FROM tpcds_sales_returns_obt AS ex_obt WHERE ( ex_obt.bill_customer_c_customer_sk = obt.bill_customer_c_customer_sk
                AND ex_obt.sold_date_sk = ex_obt.sold_date_d_date_sk
                AND ex_obt.sold_date_d_year = [YEAR]
                AND ex_obt.sold_date_d_moy BETWEEN [MONTH] AND [MONTH] + 2
              ) AND ex_obt.channel = 'web'
          )
          AND NOT EXISTS(
            SELECT
              *
            FROM tpcds_sales_returns_obt AS ex_obt WHERE ( ex_obt.bill_customer_c_customer_sk = obt.bill_customer_c_customer_sk
                AND ex_obt.sold_date_sk = ex_obt.sold_date_d_date_sk
                AND ex_obt.sold_date_d_year = [YEAR]
                AND ex_obt.sold_date_d_moy BETWEEN [MONTH] AND [MONTH] + 2
              ) AND ex_obt.channel = 'catalog'
          )
        )
      )
      AND channel IN ('catalog', 'store', 'web')
    GROUP BY
      obt.bill_cdemo_cd_gender,
      obt.bill_cdemo_cd_marital_status,
      obt.bill_cdemo_cd_education_status,
      obt.bill_cdemo_cd_purchase_estimate,
      obt.bill_cdemo_cd_credit_rating
    ORDER BY
      obt.bill_cdemo_cd_gender,
      obt.bill_cdemo_cd_marital_status,
      obt.bill_cdemo_cd_education_status,
      obt.bill_cdemo_cd_purchase_estimate,
      obt.bill_cdemo_cd_credit_rating
    LIMIT 100
- id: 70
  template: query70.tpl
  template_sha256: 922d98620b44c0dd13740ec6cb94a700a0c0098ed32401af7d75107d3cc961ee
  parameters:
    DMS:
    - 1
  sql: |-
    SELECT
      SUM(obt.net_profit) AS total_sum,
      obt.store_s_state,
      obt.store_s_county,
      GROUPING(obt.store_s_state) + GROUPING(obt.store_s_county) AS lochierarchy,
      RANK() OVER (
        PARTITION BY GROUPING(obt.store_s_state) + GROUPING(obt.store_s_county), CASE WHEN GROUPING(obt.store_s_county) = 0 THEN obt.store_s_state END
        ORDER BY SUM(obt.net_profit) DESC NULLS FIRST
      ) AS rank_within_parent
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.sold_date_d_month_seq BETWEEN [DMS] AND [DMS] + 11
        AND obt.sold_date_d_date_sk = obt.sold_date_sk
        AND obt.store_s_store_sk = obt.store_sk
        AND obt.store_s_state IN (
          SELECT
            s_state
          FROM (
            SELECT
              obt.store_s_state AS s_state,
              RANK() OVER (PARTITION BY obt.store_s_state ORDER BY SUM(obt.net_profit) DESC NULLS FIRST) AS ranking
            FROM tpcds_sales_returns_obt AS obt
            WHERE
              (
                obt.sold_date_d_month_seq BETWEEN [DMS] AND [DMS] + 11
                AND obt.sold_date_d_date_sk = obt.sold_date_sk
                AND obt.store_s_store_sk = obt.store_sk
              )
              AND channel = 'store'
            GROUP BY
              obt.store_s_state
          ) AS tmp1
          WHERE
            ranking <= 5
        )
      )
      AND channel = 'store'
    GROUP BY
      ROLLUP (
        obt.store_s_state,
        obt.store_s_county
      )
    ORDER BY
      lochierarchy DESC NULLS FIRST,
      CASE WHEN lochierarchy = 0 THEN obt.store_s_state END,
      rank_within_parent
    LIMIT 100
- id: 71
  template: query71.tpl
  template_sha256: 230bd52957a448c46d8c63264552edf26054f3d5891aa771d34356772303dd01
  parameters:
    MONTH:
    - 1
    YEAR:
    - 1
  sql: |-
    SELECT
      obt.item_i_brand_id AS brand_id,
      obt.item_i_brand AS brand,
      sold_time_t_hour,
      sold_time_t_minute,
      SUM(ext_price) AS ext_price
    FROM tpcds_sales_returns_obt AS obt
    CROSS JOIN (
      SELECT
        obt.ext_sales_price AS ext_price,
        obt.sold_date_sk AS sold_date_sk,
        obt.item_sk AS sold_item_sk,
        obt.sold_time_sk AS time_sk
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sold_date_d_date_sk = obt.sold_date_sk
          AND obt.sold_date_d_moy = [MONTH]
          AND obt.sold_date_d_year = [YEAR]
        )
        AND channel = 'web'
      UNION ALL
      SELECT
        obt.ext_sales_price AS ext_price,
        obt.sold_date_sk AS sold_date_sk,
        obt.item_sk AS sold_item_sk,
        obt.sold_time_sk AS time_sk
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sold_date_d_date_sk = obt.sold_date_sk
          AND obt.sold_date_d_moy = [MONTH]
          AND obt.sold_date_d_year = [YEAR]
        )
        AND channel = 'catalog'
      UNION ALL
      SELECT
        obt.ext_sales_price AS ext_price,
        obt.sold_date_sk AS sold_date_sk,
        obt.item_sk AS sold_item_sk,
        obt.sold_time_sk AS time_sk
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sold_date_d_date_sk = obt.sold_date_sk
          AND obt.sold_date_d_moy = [MONTH]
          AND obt.sold_date_d_year = [YEAR]
        )
        AND channel = 'store'
    ) AS tmp
    WHERE
      (
        sold_item_sk = obt.item_i_item_sk
        AND obt.item_i_manager_id = 1
        AND time_sk = sold_time_t_time_sk
        AND (
          sold_time_t_meal_time = 'breakfast' OR sold_time_t_meal_time = 'dinner'
        )
      )
      AND channel IN ('catalog', 'store', 'web')
    GROUP BY
      obt.item_i_brand,
      obt.item_i_brand_id,
      sold_time_t_hour,
      sold_time_t_minute
    ORDER BY
      ext_price DESC NULLS FIRST,
      obt.item_i_brand_id
- id: 73
  template: query73.tpl
  template_sha256: 6f501a02843b22a99d85ecc830999d05e77cf15d814f4278ce7e717af628d037
  parameters:
    BPONE:
    - 1
    BPTWO:
    - 1
    COUNTYNUMBER: []
    COUNTY_A:
    - 1
    COUNTY_B:
    - 1
    COUNTY_C:
    - 1
    COUNTY_D:
    - 1
    YEAR:
    - 1
  identifier_parameters:
  - BPONE
  - BPTWO
  identifier_map: {}
  sql: |-
    SELECT
      obt.bill_customer_c_last_name,
      obt.bill_customer_c_first_name,
      obt.bill_customer_c_salutation,
      obt.bill_customer_c_preferred_cust_flag,
      obt.sale_id,
      cnt
    FROM tpcds_sales_returns_obt AS obt
    CROSS JOIN (
      SELECT
        obt.sale_id,
        obt.ship_customer_sk,
        COUNT(*) AS cnt
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.store_sk = obt.store_s_store_sk
          AND obt.ship_hdemo_sk = obt.bill_hdemo_hd_demo_sk
          AND obt.sold_date_d_dom BETWEEN 1 AND 2
          AND (
            obt.bill_hdemo_hd_buy_potential = '[BPONE]'
            OR obt.bill_hdemo_hd_buy_potential = '[BPTWO]'
          )
          AND obt.bill_hdemo_hd_vehicle_count > 0
          AND CASE
            WHEN obt.bill_hdemo_hd_vehicle_count > 0
            THEN obt.bill_hdemo_hd_dep_count / obt.bill_hdemo_hd_vehicle_count
            ELSE NULL
          END > 1
          AND obt.sold_date_d_year IN ([YEAR], [YEAR] + 1, [YEAR] + 2)
          AND obt.store_s_county IN ('[COUNTY_A]', '[COUNTY_B]', '[COUNTY_C]', '[COUNTY_D]')
        )
        AND channel = 'store'
      GROUP BY
        obt.sale_id,
        obt.ship_customer_sk
    ) AS dj
    WHERE
      (
        obt.ship_customer_sk = obt.bill_customer_c_customer_sk AND cnt BETWEEN 1 AND 5
      )
      AND channel = 'store'
    ORDER BY
      cnt DESC NULLS FIRST,
      obt.bill_customer_c_last_name ASC
- id: 74
  template: query74.tpl
  template_sha256: a19d9ecdd4d24515c7d8fa7b3a9fa585d91c28369346b47738cf71f2ef070c47
  parameters:
    AGGONE:
    - 1
    ORDERC:
    - 1
    - 2
    - 3
    YEAR:
    - 1
  identifier_parameters:
  - AGGONE
  identifier_map: {}
  sql: |-
    WITH year_total AS (
      SELECT
        obt.bill_customer_c_customer_id AS customer_id,
        obt.bill_customer_c_first_name AS customer_first_name,
        obt.bill_customer_c_last_name AS customer_last_name,
        obt.sold_date_d_year AS year,
        [AGGONE](obt.net_paid) AS year_total,
        's' AS sale_type
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.bill_customer_c_customer_sk = obt.ship_customer_sk
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_year IN ([YEAR], [YEAR] + 1)
        )
        AND channel = 'store'
      GROUP BY
        obt.bill_customer_c_customer_id,
        obt.bill_customer_c_first_name,
        obt.bill_customer_c_last_name,
        obt.sold_date_d_year
      UNION ALL
      SELECT
        obt.bill_customer_c_customer_id AS customer_id,
        obt.bill_customer_c_first_name AS customer_first_name,
        obt.bill_customer_c_last_name AS customer_last_name,
        obt.sold_date_d_year AS year,
        [AGGONE](obt.net_paid) AS year_total,
        'w' AS sale_type
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.bill_customer_c_customer_sk = obt.bill_customer_sk
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_year IN ([YEAR], [YEAR] + 1)
        )
        AND channel = 'web'
      GROUP BY
        obt.bill_customer_c_customer_id,
        obt.bill_customer_c_first_name,
        obt.bill_customer_c_last_name,
        obt.sold_date_d_year
    )
    SELECT
      t_s_secyear.customer_id,
      t_s_secyear.customer_first_name,
      t_s_secyear.customer_last_name
    FROM year_total AS t_s_firstyear, year_total AS t_s_secyear, year_total AS t_w_firstyear, year_total AS t_w_secyear
    WHERE
      t_s_secyear.customer_id = t_s_firstyear.customer_id
      AND t_s_firstyear.customer_id = t_w_secyear.customer_id
      AND t_s_firstyear.customer_id = t_w_firstyear.customer_id
      AND t_s_firstyear.sale_type = 's'
      AND t_w_firstyear.sale_type = 'w'
      AND t_s_secyear.sale_type = 's'
      AND t_w_secyear.sale_type = 'w'
      AND t_s_firstyear.year = [YEAR]
      AND t_s_secyear.year = [YEAR] + 1
      AND t_w_firstyear.year = [YEAR]
      AND t_w_secyear.year = [YEAR] + 1
      AND t_s_firstyear.year_total > 0
      AND t_w_firstyear.year_total > 0
      AND CASE
        WHEN t_w_firstyear.year_total > 0
        THEN t_w_secyear.year_total / t_w_firstyear.year_total
        ELSE NULL
      END > CASE
        WHEN t_s_firstyear.year_total > 0
        THEN t_s_secyear.year_total / t_s_firstyear.year_total
        ELSE NULL
      END
    ORDER BY
      [ORDERC],
      [ORDERC.2],
      [ORDERC.3]
    LIMIT 100
- id: 75
  template: query75.tpl
  template_sha256: 1b2b723ff63faa6fe1670b316ba9d452c11bb01bc9c69523bfe288b2e691a9d0
  parameters:
    CATEGORY:
    - 1
    CINDX: []
    YEAR:
    - 1
  sql: |-
    WITH all_sales AS (
      SELECT
        sold_date_d_year AS d_year,
        item_i_brand_id AS i_brand_id,
        item_i_class_id AS i_class_id,
        item_i_category_id AS i_category_id,
        item_i_manufact_id AS i_manufact_id,
        SUM(sales_cnt) AS sales_cnt,
        SUM(sales_amt) AS sales_amt
      FROM (
        SELECT
          obt.sold_date_d_year,
          obt.item_i_brand_id,
          obt.item_i_class_id,
          obt.item_i_category_id,
          obt.item_i_manufact_id,
          obt.quantity - COALESCE(obt.return_quantity, 0) AS sales_cnt,
          obt.ext_sales_price - COALESCE(obt.return_amount, 0.0) AS sales_amt
        FROM tpcds_sales_returns_obt AS obt
        WHERE
          (
            (
              obt.item_i_category = '[CATEGORY]' AND obt.item_i_item_sk = obt.item_sk
            )
            AND obt.sold_date_d_date_sk = obt.sold_date_sk
          )
          AND channel = 'catalog'
        UNION
        SELECT
          obt.sold_date_d_year,
          obt.item_i_brand_id,
          obt.item_i_class_id,
          obt.item_i_category_id,
          obt.item_i_manufact_id,
          obt.quantity - COALESCE(obt.return_quantity, 0) AS sales_cnt,
          obt.ext_sales_price - COALESCE(obt.return_amount, 0.0) AS sales_amt
        FROM tpcds_sales_returns_obt AS obt
        WHERE
          (
            (
              obt.item_i_category = '[CATEGORY]' AND obt.item_i_item_sk = obt.item_sk
            )
            AND obt.sold_date_d_date_sk = obt.sold_date_sk
          )
          AND channel = 'store'
        UNION
        SELECT
          obt.sold_date_d_year,
          obt.item_i_brand_id,
          obt.item_i_class_id,
          obt.item_i_category_id,
          obt.item_i_manufact_id,
          obt.quantity - COALESCE(obt.return_quantity, 0) AS sales_cnt,
          obt.ext_sales_price - COALESCE(obt.return_amount, 0.0) AS sales_amt
        FROM tpcds_sales_returns_obt AS obt
        WHERE
          (
            (
              obt.item_i_category = '[CATEGORY]' AND obt.item_i_item_sk = obt.item_sk
            )
            AND obt.sold_date_d_date_sk = obt.sold_date_sk
          )
          AND channel = 'web'
      ) AS sales_detail
      GROUP BY
        d_year,
        i_brand_id,
        i_class_id,
        i_category_id,
        i_manufact_id
    )
    SELECT
      prev_yr.d_year AS prev_year,
      curr_yr.d_year AS year,
      curr_yr.i_brand_id,
      curr_yr.i_class_id,
      curr_yr.i_category_id,
      curr_yr.i_manufact_id,
      prev_yr.sales_cnt AS prev_yr_cnt,
      curr_yr.sales_cnt AS curr_yr_cnt,
      curr_yr.sales_cnt - prev_yr.sales_cnt AS sales_cnt_diff,
      curr_yr.sales_amt - prev_yr.sales_amt AS sales_amt_diff
    FROM all_sales AS curr_yr, all_sales AS prev_yr
    WHERE
      curr_yr.i_brand_id = prev_yr.i_brand_id
      AND curr_yr.i_class_id = prev_yr.i_class_id
      AND curr_yr.i_category_id = prev_yr.i_category_id
      AND curr_yr.i_manufact_id = prev_yr.i_manufact_id
      AND curr_yr.d_year = [YEAR]
      AND prev_yr.d_year = [YEAR] - 1
      AND CAST(curr_yr.sales_cnt AS DECIMAL(17, 2)) / CAST(prev_yr.sales_cnt AS DECIMAL(17, 2)) < 0.9
    ORDER BY
      sales_cnt_diff,
      sales_amt_diff
    LIMIT 100
- id: 76
  template: query76.tpl
  template_sha256: 748201a1fd429951aa16c5a7a361aea437cc7f83dbfa0dffa5f6844e86aac05c
  parameters:
    NULLCOLCS:
    - 1
    NULLCOLSS:
    - 1
    NULLCOLWS:
    - 1
  identifier_parameters:
  - NULLCOLCS
  - NULLCOLSS
  - NULLCOLWS
  identifier_map:
    cs_bill_addr_sk: bill_addr_sk
    cs_bill_customer_sk: bill_customer_sk
    cs_bill_hdemo_sk: bill_hdemo_sk
    cs_promo_sk: promo_sk
    cs_ship_addr_sk: ship_addr_sk
    cs_ship_cdemo_sk: ship_cdemo_sk
    cs_ship_customer_sk: ship_customer_sk
    cs_ship_hdemo_sk: ship_hdemo_sk
    cs_ship_mode_sk: ship_mode_sk
    cs_warehouse_sk: warehouse_sk
    ss_addr_sk: ship_addr_sk
    ss_cdemo_sk: ship_cdemo_sk
    ss_customer_sk: ship_customer_sk
    ss_hdemo_sk: ship_hdemo_sk
    ss_promo_sk: promo_sk
    ss_store_sk: store_sk
    ws_bill_addr_sk: bill_addr_sk
    ws_bill_customer_sk: bill_customer_sk
    ws_bill_hdemo_sk: bill_hdemo_sk
    ws_promo_sk: promo_sk
    ws_ship_addr_sk: ship_addr_sk
    ws_ship_cdemo_sk: ship_cdemo_sk
    ws_ship_customer_sk: ship_customer_sk
    ws_ship_hdemo_sk: ship_hdemo_sk
    ws_ship_mode_sk: ship_mode_sk
    ws_warehouse_sk: warehouse_sk
    ws_web_page_sk: web_page_sk
    ws_web_site_sk: web_site_sk
  sql: |-
    SELECT
      channel,
      col_name,
      sold_date_d_year,
      sold_date_d_qoy,
      item_i_category,
      COUNT(*) AS sales_cnt,
      SUM(ext_sales_price) AS sales_amt
    FROM (
      SELECT
        'store' AS channel,
        '[NULLCOLSS]' AS col_name,
        obt.sold_date_d_year,
        obt.sold_date_d_qoy,
        obt.item_i_category,
        obt.ext_sales_price AS ext_sales_price
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          [NULLCOLSS] IS NULL
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.item_sk = obt.item_i_item_sk
        )
        AND channel = 'store'
      UNION ALL
      SELECT
        'web' AS channel,
        '[NULLCOLWS]' AS col_name,
        obt.sold_date_d_year,
        obt.sold_date_d_qoy,
        obt.item_i_category,
        obt.ext_sales_price AS ext_sales_price
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          [NULLCOLWS] IS NULL
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.item_sk = obt.item_i_item_sk
        )
        AND channel = 'web'
      UNION ALL
      SELECT
        'catalog' AS channel,
        '[NULLCOLCS]' AS col_name,
        obt.sold_date_d_year,
        obt.sold_date_d_qoy,
        obt.item_i_category,
        obt.ext_sales_price AS ext_sales_price
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          [NULLCOLCS] IS NULL
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.item_sk = obt.item_i_item_sk
        )
        AND channel = 'catalog'
    ) AS foo
    GROUP BY
      channel,
      col_name,
      sold_date_d_year,
      sold_date_d_qoy,
      item_i_category
    ORDER BY
      channel,
      col_name,
      sold_date_d_year,
      sold_date_d_qoy,
      item_i_category
    LIMIT 100
- id: 77
  template: query77.tpl
  template_sha256: 21644fbbc5b7cdab24b51a71647cec937f8bb261ee5f6fd49cc7f8e62a669026
  parameters:
    SALES_DATE:
    - 1
    YEAR: []
  sql: |-
    WITH ss AS (
      SELECT
        obt.store_s_store_sk AS s_store_sk,
        SUM(obt.ext_sales_price) AS sales,
        SUM(obt.net_profit) AS profit
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_date BETWEEN CAST('[SALES_DATE]' AS DATE) AND (
            CAST('[SALES_DATE]' AS DATE) + INTERVAL 30 DAY
          )
          AND obt.store_sk = obt.store_s_store_sk
        )
        AND channel = 'store'
      GROUP BY
        obt.store_s_store_sk
    ), sr AS (
      SELECT
        obt.store_s_store_sk AS s_store_sk,
        SUM(obt.return_amount) AS returns,
        SUM(obt.return_net_loss) AS profit_loss
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.returned_date_sk = obt.return_date_d_date_sk
          AND obt.return_date_d_date BETWEEN CAST('[SALES_DATE]' AS DATE) AND (
            CAST('[SALES_DATE]' AS DATE) + INTERVAL 30 DAY
          )
          AND obt.store_sk = obt.store_s_store_sk
        )
        AND channel = 'store'
      GROUP BY
        obt.store_s_store_sk
    ), cs AS (
      SELECT
        obt.call_center_sk,
        SUM(obt.ext_sales_price) AS sales,
        SUM(obt.net_profit) AS profit
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_date BETWEEN CAST('[SALES_DATE]' AS DATE) AND (
            CAST('[SALES_DATE]' AS DATE) + INTERVAL 30 DAY
          )
        )
        AND channel = 'catalog'
      GROUP BY
        obt.call_center_sk
    ), cr AS (
      SELECT
        obt.call_center_sk,
        SUM(obt.return_amount) AS returns,
        SUM(obt.return_net_loss) AS profit_loss
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.returned_date_sk = obt.return_date_d_date_sk
          AND obt.return_date_d_date BETWEEN CAST('[SALES_DATE]' AS DATE) AND (
            CAST('[SALES_DATE]' AS DATE) + INTERVAL 30 DAY
          )
        )
        AND channel = 'catalog'
      GROUP BY
        obt.call_center_sk
    ), ws AS (
      SELECT
        obt.web_page_wp_web_page_sk AS wp_web_page_sk,
        SUM(obt.ext_sales_price) AS sales,
        SUM(obt.net_profit) AS profit
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_date BETWEEN CAST('[SALES_DATE]' AS DATE) AND (
            CAST('[SALES_DATE]' AS DATE) + INTERVAL 30 DAY
          )
          AND obt.web_page_sk = obt.web_page_wp_web_page_sk
        )
        AND channel = 'web'
      GROUP BY
        obt.web_page_wp_web_page_sk
    ), wr AS (
      SELECT
        obt.web_page_wp_web_page_sk AS wp_web_page_sk,
        SUM(obt.return_amount) AS returns,
        SUM(obt.return_net_loss) AS profit_loss
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.returned_date_sk = obt.return_date_d_date_sk
          AND obt.return_date_d_date BETWEEN CAST('[SALES_DATE]' AS DATE) AND (
            CAST('[SALES_DATE]' AS DATE) + INTERVAL 30 DAY
          )
          AND obt.web_page_sk = obt.web_page_wp_web_page_sk
        )
        AND channel = 'web'
      GROUP BY
        obt.web_page_wp_web_page_sk
    )
    SELECT
      channel,
      id,
      SUM(sales) AS sales,
      SUM(returns) AS returns,
      SUM(profit) AS profit
    FROM (
      SELECT
        'store channel' AS channel,
        ss.s_store_sk AS id,
        sales,
        COALESCE(returns, 0) AS returns,
        (
          profit - COALESCE(profit_loss, 0)
        ) AS profit
      FROM ss
      LEFT JOIN sr
        ON ss.s_store_sk = sr.s_store_sk
      UNION ALL
      SELECT
        'catalog channel' AS channel,
        cs.call_center_sk AS id,
        sales,
        returns,
        (
          profit - profit_loss
        ) AS profit
      FROM cs, cr
      UNION ALL
      SELECT
        'web channel' AS channel,
        ws.wp_web_page_sk AS id,
        sales,
        COALESCE(returns, 0) AS returns,
        (
          profit - COALESCE(profit_loss, 0)
        ) AS profit
      FROM ws
      LEFT JOIN wr
        ON ws.wp_web_page_sk = wr.wp_web_page_sk
    ) AS x
    GROUP BY
      ROLLUP (
        channel,
        id
      )
    ORDER BY
      channel,
      id
    LIMIT 100
- id: 78
  template: query78.tpl
  template_sha256: 50007b69c4b2a1a07ccda17781a91e323ccbc935a303722a0fd675b256a14c39
  parameters:
    SELECTONE:
    - 1
    YEAR:
    - 1
  identifier_parameters:
  - SELECTONE
  identifier_map:
    ss_customer_sk: ship_customer_sk
    ss_item_sk: ss.item_sk
    ss_sold_year: ss_sold_year
  sql: |-
    WITH ws AS (
      SELECT
        obt.sold_date_d_year AS ws_sold_year,
        obt.item_sk,
        obt.bill_customer_sk AS ws_customer_sk,
        SUM(obt.quantity) AS ws_qty,
        SUM(obt.wholesale_cost) AS ws_wc,
        SUM(obt.sales_price) AS ws_sp
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.has_return = 'N' AND obt.sold_date_sk = obt.sold_date_d_date_sk
        )
        AND channel = 'web'
      GROUP BY
        obt.sold_date_d_year,
        obt.item_sk,
        obt.bill_customer_sk
    ), cs AS (
      SELECT
        obt.sold_date_d_year AS cs_sold_year,
        obt.item_sk,
        obt.bill_customer_sk AS cs_customer_sk,
        SUM(obt.quantity) AS cs_qty,
        SUM(obt.wholesale_cost) AS cs_wc,
        SUM(obt.sales_price) AS cs_sp
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.has_return = 'N' AND obt.sold_date_sk = obt.sold_date_d_date_sk
        )
        AND channel = 'catalog'
      GROUP BY
        obt.sold_date_d_year,
        obt.item_sk,
        obt.bill_customer_sk
    ), ss AS (
      SELECT
        obt.sold_date_d_year AS ss_sold_year,
        obt.item_sk,
        obt.ship_customer_sk,
        SUM(obt.quantity) AS ss_qty,
        SUM(obt.wholesale_cost) AS ss_wc,
        SUM(obt.sales_price) AS ss_sp
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.has_return = 'N' AND obt.sold_date_sk = obt.sold_date_d_date_sk
        )
        AND channel = 'store'
      GROUP BY
        obt.sold_date_d_year,
        obt.item_sk,
        obt.ship_customer_sk
    )
    SELECT
      [SELECTONE],
      ROUND(ss_qty / (
        COALESCE(ws_qty, 0) + COALESCE(cs_qty, 0)
      ), 2) AS ratio,
      ss_qty AS store_qty,
      ss_wc AS store_wholesale_cost,
      ss_sp AS store_sales_price,
      COALESCE(ws_qty, 0) + COALESCE(cs_qty, 0) AS other_chan_qty,
      COALESCE(ws_wc, 0) + COALESCE(cs_wc, 0) AS other_chan_wholesale_cost,
      COALESCE(ws_sp, 0) + COALESCE(cs_sp, 0) AS other_chan_sales_price
    FROM ss
    LEFT JOIN ws
      ON (
        ws_sold_year = ss_sold_year
        AND ws.item_sk = ss.item_sk
        AND ws_customer_sk = ship_customer_sk
      )
    LEFT JOIN cs
      ON (
        cs_sold_year = ss_sold_year
        AND ss.item_sk = cs.item_sk
        AND cs_customer_sk = ship_customer_sk
      )
    WHERE
      (
        COALESCE(ws_qty, 0) > 0 OR COALESCE(cs_qty, 0) > 0
      )
      AND ss_sold_year = [YEAR]
    ORDER BY
      [SELECTONE],
      ss_qty DESC NULLS FIRST,
      ss_wc DESC NULLS FIRST,
      ss_sp DESC NULLS FIRST,
      other_chan_qty,
      other_chan_wholesale_cost,
      other_chan_sales_price,
      ratio
    LIMIT 100
- id: 79
  template: query79.tpl
  template_sha256: bc9b85ad7c8448deaded4769a1d03e2dc6816da7c2a7963fe76d1687143db26f
  parameters:
    DEPCNT:
    - 1
    VEHCNT:
    - 1
    YEAR:
    - 1
  sql: |-
    SELECT
      obt.bill_customer_c_last_name,
      obt.bill_customer_c_first_name,
      SUBSTRING(obt.store_s_city, 1, 30),
      obt.sale_id,
      amt,
      profit
    FROM tpcds_sales_returns_obt AS obt
    CROSS JOIN (
      SELECT
        sub_obt.sale_id AS ms_sale_id,
        sub_obt.ship_customer_sk AS ms_ship_customer_sk,
        obt.store_s_city,
        SUM(sub_obt.coupon_amt) AS amt,
        SUM(sub_obt.net_profit) AS profit
      FROM tpcds_sales_returns_obt AS sub_obt
      WHERE
        (
          sub_obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.store_sk = obt.store_s_store_sk
          AND sub_obt.ship_hdemo_sk = obt.bill_hdemo_hd_demo_sk
          AND (
            obt.bill_hdemo_hd_dep_count = [DEPCNT]
            OR obt.bill_hdemo_hd_vehicle_count > [VEHCNT]
          )
          AND obt.sold_date_d_dow = 1
          AND obt.sold_date_d_year IN ([YEAR], [YEAR] + 1, [YEAR] + 2)
          AND obt.store_s_number_employees BETWEEN 200 AND 295
        )
        AND channel = 'store'
      GROUP BY
        sub_obt.sale_id,
        sub_obt.ship_customer_sk,
        sub_obt.ship_addr_sk,
        obt.store_s_city
    ) AS ms
    WHERE
      obt.sale_id = ms.ms_sale_id AND obt.ship_customer_sk = ms.ms_ship_customer_sk AND
      obt.ship_customer_sk = obt.bill_customer_c_customer_sk AND channel = 'store'
    ORDER BY
      obt.bill_customer_c_last_name,
      obt.bill_customer_c_first_name,
      SUBSTRING(obt.store_s_city, 1, 30),
      profit
    LIMIT 100
- id: 80
  template: query80.tpl
  template_sha256: 94dbb1c80f8c4e88bb1a61c2885234de3f245ea67b2af68ed81b1129d7014e26
  parameters:
    SALES_DATE:
    - 1
    YEAR: []
  sql: |-
    WITH ssr AS (
      SELECT
        obt.store_s_store_id AS store_id,
        SUM(obt.ext_sales_price) AS sales,
        SUM(COALESCE(obt.return_amount, 0)) AS returns,
        SUM(obt.net_profit - COALESCE(obt.return_net_loss, 0)) AS profit
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_date BETWEEN CAST('[SALES_DATE]' AS DATE) AND (
            CAST('[SALES_DATE]' AS DATE) + INTERVAL 30 DAY
          )
          AND obt.store_sk = obt.store_s_store_sk
          AND obt.item_sk = obt.item_i_item_sk
          AND obt.item_i_current_price > 50
          AND obt.promo_sk = obt.promo_p_promo_sk
          AND obt.promo_p_channel_tv = 'N'
        )
        AND channel = 'store'
      GROUP BY
        obt.store_s_store_id
    ), csr AS (
      SELECT
        obt.catalog_page_cp_catalog_page_id AS catalog_page_id,
        SUM(obt.ext_sales_price) AS sales,
        SUM(COALESCE(obt.return_amount, 0)) AS returns,
        SUM(obt.net_profit - COALESCE(obt.return_net_loss, 0)) AS profit
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_date BETWEEN CAST('[SALES_DATE]' AS DATE) AND (
            CAST('[SALES_DATE]' AS DATE) + INTERVAL 30 DAY
          )
          AND obt.catalog_page_sk = obt.catalog_page_cp_catalog_page_sk
          AND obt.item_sk = obt.item_i_item_sk
          AND obt.item_i_current_price > 50
          AND obt.promo_sk = obt.promo_p_promo_sk
          AND obt.promo_p_channel_tv = 'N'
        )
        AND channel = 'catalog'
      GROUP BY
        obt.catalog_page_cp_catalog_page_id
    ), wsr AS (
      SELECT
        obt.web_site_web_site_id,
        SUM(obt.ext_sales_price) AS sales,
        SUM(COALESCE(obt.return_amount, 0)) AS returns,
        SUM(obt.net_profit - COALESCE(obt.return_net_loss, 0)) AS profit
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_date BETWEEN CAST('[SALES_DATE]' AS DATE) AND (
            CAST('[SALES_DATE]' AS DATE) + INTERVAL 30 DAY
          )
          AND obt.web_site_sk = obt.web_site_web_site_sk
          AND obt.item_sk = obt.item_i_item_sk
          AND obt.item_i_current_price > 50
          AND obt.promo_sk = obt.promo_p_promo_sk
          AND obt.promo_p_channel_tv = 'N'
        )
        AND channel = 'web'
      GROUP BY
        obt.web_site_web_site_id
    )
    SELECT
      channel,
      id,
      SUM(sales) AS sales,
      SUM(returns) AS returns,
      SUM(profit) AS profit
    FROM (
      SELECT
        'store channel' AS channel,
        'store' || store_id AS id,
        sales,
        returns,
        profit
      FROM ssr
      UNION ALL
      SELECT
        'catalog channel' AS channel,
        'catalog_page' || catalog_page_id AS id,
        sales,
        returns,
        profit
      FROM csr
      UNION ALL
      SELECT
        'web channel' AS channel,
        'web_site' || web_site_web_site_id AS id,
        sales,
        returns,
        profit
      FROM wsr
    ) AS x
    GROUP BY
      ROLLUP (
        channel,
        id
      )
    ORDER BY
      channel,
      id
    LIMIT 100
- id: 81
  template: query81.tpl
  template_sha256: 61def14bcc7c4d116cc67febbf1f173650d750731595bd97c526b4fe8dafb958
  parameters:
    STATE:
    - 1
    YEAR:
    - 1
  sql: |-
    WITH customer_total_return AS (
      SELECT
        obt.returning_customer_c_customer_sk AS ctr_customer_sk,
        obt.returning_addr_ca_state AS ctr_state,
        SUM(obt.return_amount_inc_tax) AS ctr_total_return
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.returned_date_sk = obt.return_date_d_date_sk
          AND obt.return_date_d_year = [YEAR]
          AND obt.returning_addr_ca_address_sk = obt.returning_addr_ca_address_sk
        )
        AND channel = 'catalog'
      GROUP BY
        obt.returning_customer_c_customer_sk,
        obt.returning_addr_ca_state
    )
    SELECT
      obt.bill_customer_c_customer_id,
      obt.bill_customer_c_salutation,
      obt.bill_customer_c_first_name,
      obt.bill_customer_c_last_name,
      obt.bill_addr_ca_street_number,
      obt.bill_addr_ca_street_name,
      obt.bill_addr_ca_street_type,
      obt.bill_addr_ca_suite_number,
      obt.bill_addr_ca_city,
      obt.bill_addr_ca_county,
      obt.bill_addr_ca_state,
      obt.bill_addr_ca_zip,
      obt.bill_addr_ca_country,
      obt.bill_addr_ca_gmt_offset,
      obt.bill_addr_ca_location_type,
      ctr_total_return
    FROM tpcds_sales_returns_obt AS obt
    CROSS JOIN customer_total_return AS ctr1
    WHERE
      (
        ctr1.ctr_total_return > (
          SELECT
            AVG(ctr_total_return) * 1.2
          FROM customer_total_return AS ctr2
          WHERE
            ctr1.ctr_state = ctr2.ctr_state
        )
        AND obt.bill_addr_ca_state = '[STATE]'
        AND ctr1.ctr_customer_sk = obt.bill_customer_c_customer_sk
      )
      AND channel = 'catalog'
    ORDER BY
      obt.bill_customer_c_customer_id,
      obt.bill_customer_c_salutation,
      obt.bill_customer_c_first_name,
      obt.bill_customer_c_last_name,
      obt.bill_addr_ca_street_number,
      obt.bill_addr_ca_street_name,
      obt.bill_addr_ca_street_type,
      obt.bill_addr_ca_suite_number,
      obt.bill_addr_ca_city,
      obt.bill_addr_ca_county,
      obt.bill_addr_ca_state,
      obt.bill_addr_ca_zip,
      obt.bill_addr_ca_country,
      obt.bill_addr_ca_gmt_offset,
      obt.bill_addr_ca_location_type,
      ctr_total_return
    LIMIT 100
- id: 83
  template: query83.tpl
  template_sha256: 70f5bc97783e4140e95528d6a43fb72d3fc078d143329f69d69ada43539dd5d5
  parameters:
    RETURNED_DATE_ONE:
    - 1
    RETURNED_DATE_THREE:
    - 1
    RETURNED_DATE_TWO:
    - 1
    YEAR: []
  sql: |-
    WITH sr_items AS (
      SELECT
        obt.item_i_item_id AS item_id,
        SUM(obt.return_quantity) AS sr_item_qty
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_sk = obt.item_i_item_sk
          AND obt.return_date_d_date IN (
            SELECT
              obt.sold_date_d_date
            FROM tpcds_sales_returns_obt AS obt
            WHERE
              obt.sold_date_d_week_seq IN (
                SELECT
                  obt.sold_date_d_week_seq
                FROM tpcds_sales_returns_obt AS obt
                WHERE
                  obt.sold_date_d_date IN (
                    '[RETURNED_DATE_ONE]',
                    '[RETURNED_DATE_TWO]',
                    '[RETURNED_DATE_THREE]'
                  )
                  AND channel IN ('catalog', 'store', 'web')
              )
              AND channel IN ('catalog', 'store', 'web')
          )
          AND obt.returned_date_sk = obt.return_date_d_date_sk
        )
        AND channel = 'store'
      GROUP BY
        obt.item_i_item_id
    ), cr_items AS (
      SELECT
        obt.item_i_item_id AS item_id,
        SUM(obt.return_quantity) AS cr_item_qty
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_sk = obt.item_i_item_sk
          AND obt.return_date_d_date IN (
            SELECT
              obt.sold_date_d_date
            FROM tpcds_sales_returns_obt AS obt
            WHERE
              obt.sold_date_d_week_seq IN (
                SELECT
                  obt.sold_date_d_week_seq
                FROM tpcds_sales_returns_obt AS obt
                WHERE
                  obt.sold_date_d_date IN (
                    '[RETURNED_DATE_ONE]',
                    '[RETURNED_DATE_TWO]',
                    '[RETURNED_DATE_THREE]'
                  )
                  AND channel IN ('catalog', 'store', 'web')
              )
              AND channel IN ('catalog', 'store', 'web')
          )
          AND obt.returned_date_sk = obt.return_date_d_date_sk
        )
        AND channel = 'catalog'
      GROUP BY
        obt.item_i_item_id
    ), wr_items AS (
      SELECT
        obt.item_i_item_id AS item_id,
        SUM(obt.return_quantity) AS wr_item_qty
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_sk = obt.item_i_item_sk
          AND obt.return_date_d_date IN (
            SELECT
              obt.sold_date_d_date
            FROM tpcds_sales_returns_obt AS obt
            WHERE
              obt.sold_date_d_week_seq IN (
                SELECT
                  obt.sold_date_d_week_seq
                FROM tpcds_sales_returns_obt AS obt
                WHERE
                  obt.sold_date_d_date IN (
                    '[RETURNED_DATE_ONE]',
                    '[RETURNED_DATE_TWO]',
                    '[RETURNED_DATE_THREE]'
                  )
                  AND channel IN ('catalog', 'store', 'web')
              )
              AND channel IN ('catalog', 'store', 'web')
          )
          AND obt.returned_date_sk = obt.return_date_d_date_sk
        )
        AND channel = 'web'
      GROUP BY
        obt.item_i_item_id
    )
    SELECT
      sr_items.item_id,
      sr_item_qty,
      sr_item_qty / (
        sr_item_qty + cr_item_qty + wr_item_qty
      ) / 3.0 * 100 AS sr_dev,
      cr_item_qty,
      cr_item_qty / (
        sr_item_qty + cr_item_qty + wr_item_qty
      ) / 3.0 * 100 AS cr_dev,
      wr_item_qty,
      wr_item_qty / (
        sr_item_qty + cr_item_qty + wr_item_qty
      ) / 3.0 * 100 AS wr_dev,
      (
        sr_item_qty + cr_item_qty + wr_item_qty
      ) / 3.0 AS average
    FROM sr_items, cr_items, wr_items
    WHERE
      sr_items.item_id = cr_items.item_id AND sr_items.item_id = wr_items.item_id
    ORDER BY
      sr_items.item_id,
      sr_item_qty
    LIMIT 100
- id: 85
  template: query85.tpl
  template_sha256: 1e95614e7aebdb858f5d9aa76f98ff1940ed69d86cb26bb926237e99c9789025
  parameters:
    ES:
    - 1
    - 2
    - 3
    MS:
    - 1
    - 2
    - 3
    STATE:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    - 9
    YEAR:
    - 1
  sql: |-
    SELECT
      SUBSTRING(obt.reason_r_reason_desc, 1, 20),
      AVG(obt.quantity),
      AVG(obt.refunded_cash),
      AVG(obt.return_fee)
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.web_page_sk = obt.web_page_wp_web_page_sk
        AND obt.item_sk = obt.item_sk
        AND obt.sale_id = obt.sale_id
        AND obt.sold_date_sk = obt.sold_date_d_date_sk
        AND obt.sold_date_d_year = [YEAR]
        AND obt.returning_cdemo_cd_demo_sk = obt.returning_cdemo_cd_demo_sk
        AND obt.returning_cdemo_cd_demo_sk = obt.returning_cdemo_cd_demo_sk
        AND obt.returning_addr_ca_address_sk = obt.returning_addr_ca_address_sk
        AND obt.reason_r_reason_sk = obt.reason_sk
        AND (
          (
            obt.returning_cdemo_cd_marital_status = '[MS]'
            AND obt.returning_cdemo_cd_marital_status = obt.returning_cdemo_cd_marital_status
            AND obt.returning_cdemo_cd_education_status = '[ES]'
            AND obt.returning_cdemo_cd_education_status = obt.returning_cdemo_cd_education_status
            AND obt.sales_price BETWEEN 100.00 AND 150.00
          )
          OR (
            obt.returning_cdemo_cd_marital_status = '[MS.2]'
            AND obt.returning_cdemo_cd_marital_status = obt.returning_cdemo_cd_marital_status
            AND obt.returning_cdemo_cd_education_status = '[ES.2]'
            AND obt.returning_cdemo_cd_education_status = obt.returning_cdemo_cd_education_status
            AND obt.sales_price BETWEEN 50.00 AND 100.00
          )
          OR (
            obt.returning_cdemo_cd_marital_status = '[MS.3]'
            AND obt.returning_cdemo_cd_marital_status = obt.returning_cdemo_cd_marital_status
            AND obt.returning_cdemo_cd_education_status = '[ES.3]'
            AND obt.returning_cdemo_cd_education_status = obt.returning_cdemo_cd_education_status
            AND obt.sales_price BETWEEN 150.00 AND 200.00
          )
        )
        AND (
          (
            obt.returning_addr_ca_country = 'United States'
            AND obt.returning_addr_ca_state IN ('[STATE]', '[STATE.2]', '[STATE.3]')
            AND obt.net_profit BETWEEN 100 AND 200
          )
          OR (
            obt.returning_addr_ca_country = 'United States'
            AND obt.returning_addr_ca_state IN ('[STATE.4]', '[STATE.5]', '[STATE.6]')
            AND obt.net_profit BETWEEN 150 AND 300
          )
          OR (
            obt.returning_addr_ca_country = 'United States'
            AND obt.returning_addr_ca_state IN ('[STATE.7]', '[STATE.8]', '[STATE.9]')
            AND obt.net_profit BETWEEN 50 AND 250
          )
        )
      )
      AND channel = 'web'
    GROUP BY
      obt.reason_r_reason_desc
    ORDER BY
      SUBSTRING(obt.reason_r_reason_desc, 1, 20),
      AVG(obt.quantity),
      AVG(obt.refunded_cash),
      AVG(obt.return_fee)
    LIMIT 100
- id: 86
  template: query86.tpl
  template_sha256: 9b7722986d6efe9cfabcabd87dab12628f7df9adbb0609cacef6b23247ebdf10
  parameters:
    DMS:
    - 1
  sql: |-
    SELECT
      SUM(obt.net_paid) AS total_sum,
      obt.item_i_category,
      obt.item_i_class,
      GROUPING(obt.item_i_category) + GROUPING(obt.item_i_class) AS lochierarchy,
      RANK() OVER (
        PARTITION BY GROUPING(obt.item_i_category) + GROUPING(obt.item_i_class), CASE WHEN GROUPING(obt.item_i_class) = 0 THEN obt.item_i_category END
        ORDER BY SUM(obt.net_paid) DESC NULLS FIRST
      ) AS rank_within_parent
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.sold_date_d_month_seq BETWEEN [DMS] AND [DMS] + 11
        AND obt.sold_date_d_date_sk = obt.sold_date_sk
        AND obt.item_i_item_sk = obt.item_sk
      )
      AND channel = 'web'
    GROUP BY
      ROLLUP (
        obt.item_i_category,
        obt.item_i_class
      )
    ORDER BY
      lochierarchy DESC NULLS FIRST,
      CASE WHEN lochierarchy = 0 THEN obt.item_i_category END,
      rank_within_parent
    LIMIT 100
- id: 87
