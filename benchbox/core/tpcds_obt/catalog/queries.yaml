- id: 67
  template: query67.tpl
  template_sha256: 3bb0ac8d59ee37e04f223ff90041bfd2e0bb0a8cbf0aedaab3c9c610338e99cc
  parameters:
    DMS:
    - 1
  sql: |-
    SELECT
      *
    FROM (
      SELECT
        item_i_category,
        item_i_class,
        item_i_brand,
        item_i_product_name,
        sold_date_d_year,
        sold_date_d_qoy,
        sold_date_d_moy,
        store_s_store_id,
        sumsales,
        RANK() OVER (PARTITION BY item_i_category ORDER BY sumsales DESC NULLS FIRST) AS rk
      FROM (
        SELECT
          obt.item_i_category,
          obt.item_i_class,
          obt.item_i_brand,
          obt.item_i_product_name,
          obt.sold_date_d_year,
          obt.sold_date_d_qoy,
          obt.sold_date_d_moy,
          obt.store_s_store_id,
          SUM(COALESCE(obt.sales_price * obt.quantity, 0)) AS sumsales
        FROM tpcds_sales_returns_obt AS obt
        WHERE
          (
            obt.sold_date_sk = obt.sold_date_d_date_sk
            AND obt.item_sk = obt.item_i_item_sk
            AND obt.store_sk = obt.store_s_store_sk
            AND obt.sold_date_d_month_seq BETWEEN [DMS] AND [DMS] + 11
          )
          AND channel = 'store'
        GROUP BY
          ROLLUP (
            obt.item_i_category,
            obt.item_i_class,
            obt.item_i_brand,
            obt.item_i_product_name,
            obt.sold_date_d_year,
            obt.sold_date_d_qoy,
            obt.sold_date_d_moy,
            obt.store_s_store_id
          )
      ) AS dw1
    ) AS dw2
    WHERE
      rk <= 100
    ORDER BY
      item_i_category,
      item_i_class,
      item_i_brand,
      item_i_product_name,
      sold_date_d_year,
      sold_date_d_qoy,
      sold_date_d_moy,
      store_s_store_id,
      sumsales,
      rk
    LIMIT 100
- id: 68
  template: query68.tpl
  template_sha256: b8894f13bdd1b82f9dba3aeae49f8d5687c83b99c29b134c35e239b8ceca8b07
  parameters:
    CITY_A:
    - 1
    CITY_B:
    - 1
    DEPCNT:
    - 1
    VEHCNT:
    - 1
    YEAR:
    - 1
  sql: |-
    SELECT c_last_name, c_first_name, ca_city, bought_city, ss_ticket_number, extended_price, extended_tax, list_price
    FROM (
      SELECT sale_id AS ss_ticket_number, bill_customer_c_customer_sk AS cust_sk, bill_addr_ca_city AS bought_city,
        bill_customer_c_last_name AS c_last_name, bill_customer_c_first_name AS c_first_name, bill_cur_addr_ca_city AS ca_city,
        SUM(ext_sales_price) AS extended_price, SUM(ext_list_price) AS list_price, SUM(ext_tax) AS extended_tax
      FROM tpcds_sales_returns_obt
      WHERE channel = 'store' AND sold_date_d_date_sk IS NOT NULL AND store_s_store_sk IS NOT NULL
        AND bill_hdemo_hd_demo_sk IS NOT NULL AND bill_addr_ca_address_sk IS NOT NULL
        AND sold_date_d_dom BETWEEN 1 AND 2 AND (bill_hdemo_hd_dep_count = [DEPCNT] OR bill_hdemo_hd_vehicle_count = [VEHCNT])
        AND sold_date_d_year IN ([YEAR], [YEAR] + 1, [YEAR] + 2) AND store_s_city IN ('[CITY_A]', '[CITY_B]')
      GROUP BY sale_id, bill_customer_sk, bill_addr_sk, bill_addr_ca_city, bill_customer_c_customer_sk,
               bill_customer_c_last_name, bill_customer_c_first_name, bill_cur_addr_ca_city
    ) AS dn
    WHERE cust_sk IS NOT NULL AND ca_city <> bought_city
    ORDER BY c_last_name, ss_ticket_number
    LIMIT 100
- id: 69
  template: query69.tpl
  template_sha256: f02e8b9792ebf3adae7440c25f513492485dcbcef85f6d4a97c183f707aa562a
  parameters:
    MONTH:
    - 1
    STATE:
    - 1
    - 2
    - 3
    YEAR:
    - 1
  sql: |-
    WITH c AS (
      SELECT DISTINCT
        bill_customer_c_customer_sk AS c_customer_sk,
        bill_cur_cdemo_cd_gender AS cd_gender,
        bill_cur_cdemo_cd_marital_status AS cd_marital_status,
        bill_cur_cdemo_cd_education_status AS cd_education_status,
        bill_cur_cdemo_cd_purchase_estimate AS cd_purchase_estimate,
        bill_cur_cdemo_cd_credit_rating AS cd_credit_rating
      FROM tpcds_sales_returns_obt
      WHERE
        channel = 'store'
        AND bill_customer_c_customer_sk IS NOT NULL
        AND sold_date_d_year = [YEAR]
        AND sold_date_d_moy BETWEEN [MONTH] AND [MONTH] + 2
        AND bill_cur_addr_ca_state IN ('[STATE]', '[STATE.2]', '[STATE.3]')
        AND bill_cur_cdemo_cd_demo_sk IS NOT NULL
    )
    SELECT
      cd_gender,
      cd_marital_status,
      cd_education_status,
      COUNT(*) AS cnt1,
      cd_purchase_estimate,
      COUNT(*) AS cnt2,
      cd_credit_rating,
      COUNT(*) AS cnt3
    FROM c
    WHERE
      NOT EXISTS(
        SELECT 1
        FROM tpcds_sales_returns_obt AS w
        WHERE
          w.channel = 'web'
          AND w.bill_customer_sk = c.c_customer_sk
          AND w.sold_date_d_year = [YEAR]
          AND w.sold_date_d_moy BETWEEN [MONTH] AND [MONTH] + 2
      )
      AND NOT EXISTS(
        SELECT 1
        FROM tpcds_sales_returns_obt AS k
        WHERE
          k.channel = 'catalog'
          AND k.ship_customer_sk = c.c_customer_sk
          AND k.sold_date_d_year = [YEAR]
          AND k.sold_date_d_moy BETWEEN [MONTH] AND [MONTH] + 2
      )
    GROUP BY
      cd_gender,
      cd_marital_status,
      cd_education_status,
      cd_purchase_estimate,
      cd_credit_rating
    ORDER BY
      cd_gender,
      cd_marital_status,
      cd_education_status,
      cd_purchase_estimate,
      cd_credit_rating
    LIMIT 100
- id: 70
  template: query70.tpl
  template_sha256: 922d98620b44c0dd13740ec6cb94a700a0c0098ed32401af7d75107d3cc961ee
  parameters:
    DMS:
    - 1
  sql: |-
    SELECT
      SUM(obt.net_profit) AS total_sum,
      obt.store_s_state,
      obt.store_s_county,
      GROUPING(obt.store_s_state) + GROUPING(obt.store_s_county) AS lochierarchy,
      RANK() OVER (
        PARTITION BY GROUPING(obt.store_s_state) + GROUPING(obt.store_s_county), CASE WHEN GROUPING(obt.store_s_county) = 0 THEN obt.store_s_state END
        ORDER BY SUM(obt.net_profit) DESC NULLS FIRST
      ) AS rank_within_parent
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.sold_date_d_month_seq BETWEEN [DMS] AND [DMS] + 11
        AND obt.sold_date_d_date_sk = obt.sold_date_sk
        AND obt.store_s_store_sk = obt.store_sk
        AND obt.store_s_state IN (
          SELECT
            s_state
          FROM (
            SELECT
              obt.store_s_state AS s_state,
              RANK() OVER (PARTITION BY obt.store_s_state ORDER BY SUM(obt.net_profit) DESC NULLS FIRST) AS ranking
            FROM tpcds_sales_returns_obt AS obt
            WHERE
              (
                obt.sold_date_d_month_seq BETWEEN [DMS] AND [DMS] + 11
                AND obt.sold_date_d_date_sk = obt.sold_date_sk
                AND obt.store_s_store_sk = obt.store_sk
              )
              AND channel = 'store'
            GROUP BY
              obt.store_s_state
          ) AS tmp1
          WHERE
            ranking <= 5
        )
      )
      AND channel = 'store'
    GROUP BY
      ROLLUP (
        obt.store_s_state,
        obt.store_s_county
      )
    ORDER BY
      lochierarchy DESC NULLS FIRST,
      CASE WHEN lochierarchy = 0 THEN obt.store_s_state END,
      rank_within_parent
    LIMIT 100
- id: 71
  template: query71.tpl
  template_sha256: 230bd52957a448c46d8c63264552edf26054f3d5891aa771d34356772303dd01
  parameters:
    MONTH:
    - 1
    YEAR:
    - 1
  sql: |-
    SELECT
      item_i_brand_id AS brand_id,
      item_i_brand AS brand,
      sold_time_t_hour AS t_hour,
      sold_time_t_minute AS t_minute,
      SUM(ext_sales_price) AS ext_price
    FROM tpcds_sales_returns_obt
    WHERE
      sold_date_d_moy = [MONTH]
      AND sold_date_d_year = [YEAR]
      AND item_i_manager_id = 1
      AND sold_time_t_time_sk IS NOT NULL
      AND (
        sold_time_t_meal_time = 'breakfast' OR sold_time_t_meal_time = 'dinner'
      )
    GROUP BY
      item_i_brand,
      item_i_brand_id,
      sold_time_t_hour,
      sold_time_t_minute
    ORDER BY
      ext_price DESC NULLS FIRST,
      brand_id
- id: 73
  template: query73.tpl
  template_sha256: 6f501a02843b22a99d85ecc830999d05e77cf15d814f4278ce7e717af628d037
  parameters:
    BPONE:
    - 1
    BPTWO:
    - 1
    COUNTYNUMBER: []
    COUNTY_A:
    - 1
    COUNTY_B:
    - 1
    COUNTY_C:
    - 1
    COUNTY_D:
    - 1
    YEAR:
    - 1
  identifier_parameters:
  - BPONE
  - BPTWO
  identifier_map: {}
  sql: |-
    SELECT
      c_last_name,
      c_first_name,
      c_salutation,
      c_preferred_cust_flag,
      ss_ticket_number,
      cnt
    FROM (
      SELECT
        sale_id AS ss_ticket_number,
        bill_customer_c_customer_sk AS cust_sk,
        bill_customer_c_last_name AS c_last_name,
        bill_customer_c_first_name AS c_first_name,
        bill_customer_c_salutation AS c_salutation,
        bill_customer_c_preferred_cust_flag AS c_preferred_cust_flag,
        COUNT(*) AS cnt
      FROM tpcds_sales_returns_obt
      WHERE
        channel = 'store'
        AND sold_date_d_date_sk IS NOT NULL
        AND store_s_store_sk IS NOT NULL
        AND bill_hdemo_hd_demo_sk IS NOT NULL
        AND sold_date_d_dom BETWEEN 1 AND 2
        AND (
          bill_hdemo_hd_buy_potential = '[BPONE]' OR bill_hdemo_hd_buy_potential = '[BPTWO]'
        )
        AND bill_hdemo_hd_vehicle_count > 0
        AND CASE
          WHEN bill_hdemo_hd_vehicle_count > 0
          THEN bill_hdemo_hd_dep_count / bill_hdemo_hd_vehicle_count
          ELSE NULL
        END > 1
        AND sold_date_d_year IN ([YEAR], [YEAR] + 1, [YEAR] + 2)
        AND store_s_county IN ('[COUNTY_A]', '[COUNTY_B]', '[COUNTY_C]', '[COUNTY_D]')
      GROUP BY
        sale_id,
        bill_customer_sk,
        bill_customer_c_customer_sk,
        bill_customer_c_last_name,
        bill_customer_c_first_name,
        bill_customer_c_salutation,
        bill_customer_c_preferred_cust_flag
    ) AS dj
    WHERE
      cust_sk IS NOT NULL AND cnt BETWEEN 1 AND 5
    ORDER BY
      cnt DESC NULLS FIRST,
      c_last_name ASC
- id: 74
  template: query74.tpl
  template_sha256: a19d9ecdd4d24515c7d8fa7b3a9fa585d91c28369346b47738cf71f2ef070c47
  parameters:
    AGGONE:
    - 1
    ORDERC:
    - 1
    - 2
    - 3
    YEAR:
    - 1
  identifier_parameters:
  - AGGONE
  identifier_map: {}
  sql: |-
    WITH year_total AS (
      SELECT
        obt.bill_customer_c_customer_id AS customer_id,
        obt.bill_customer_c_first_name AS customer_first_name,
        obt.bill_customer_c_last_name AS customer_last_name,
        obt.sold_date_d_year AS year,
        [AGGONE](obt.net_paid) AS year_total,
        's' AS sale_type
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.bill_customer_c_customer_sk = obt.ship_customer_sk
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_year IN ([YEAR], [YEAR] + 1)
        )
        AND channel = 'store'
      GROUP BY
        obt.bill_customer_c_customer_id,
        obt.bill_customer_c_first_name,
        obt.bill_customer_c_last_name,
        obt.sold_date_d_year
      UNION ALL
      SELECT
        obt.bill_customer_c_customer_id AS customer_id,
        obt.bill_customer_c_first_name AS customer_first_name,
        obt.bill_customer_c_last_name AS customer_last_name,
        obt.sold_date_d_year AS year,
        [AGGONE](obt.net_paid) AS year_total,
        'w' AS sale_type
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.bill_customer_c_customer_sk = obt.bill_customer_sk
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_year IN ([YEAR], [YEAR] + 1)
        )
        AND channel = 'web'
      GROUP BY
        obt.bill_customer_c_customer_id,
        obt.bill_customer_c_first_name,
        obt.bill_customer_c_last_name,
        obt.sold_date_d_year
    )
    SELECT
      t_s_secyear.customer_id,
      t_s_secyear.customer_first_name,
      t_s_secyear.customer_last_name
    FROM year_total AS t_s_firstyear, year_total AS t_s_secyear, year_total AS t_w_firstyear, year_total AS t_w_secyear
    WHERE
      t_s_secyear.customer_id = t_s_firstyear.customer_id
      AND t_s_firstyear.customer_id = t_w_secyear.customer_id
      AND t_s_firstyear.customer_id = t_w_firstyear.customer_id
      AND t_s_firstyear.sale_type = 's'
      AND t_w_firstyear.sale_type = 'w'
      AND t_s_secyear.sale_type = 's'
      AND t_w_secyear.sale_type = 'w'
      AND t_s_firstyear.year = [YEAR]
      AND t_s_secyear.year = [YEAR] + 1
      AND t_w_firstyear.year = [YEAR]
      AND t_w_secyear.year = [YEAR] + 1
      AND t_s_firstyear.year_total > 0
      AND t_w_firstyear.year_total > 0
      AND CASE
        WHEN t_w_firstyear.year_total > 0
        THEN t_w_secyear.year_total / t_w_firstyear.year_total
        ELSE NULL
      END > CASE
        WHEN t_s_firstyear.year_total > 0
        THEN t_s_secyear.year_total / t_s_firstyear.year_total
        ELSE NULL
      END
    ORDER BY
      [ORDERC],
      [ORDERC.2],
      [ORDERC.3]
    LIMIT 100
- id: 75
  template: query75.tpl
  template_sha256: 1b2b723ff63faa6fe1670b316ba9d452c11bb01bc9c69523bfe288b2e691a9d0
  parameters:
    CATEGORY:
    - 1
    CINDX: []
    YEAR:
    - 1
  sql: |-
    WITH all_sales AS (
      SELECT
        sold_date_d_year AS d_year,
        item_i_brand_id AS i_brand_id,
        item_i_class_id AS i_class_id,
        item_i_category_id AS i_category_id,
        item_i_manufact_id AS i_manufact_id,
        SUM(sales_cnt) AS sales_cnt,
        SUM(sales_amt) AS sales_amt
      FROM (
        SELECT
          obt.sold_date_d_year,
          obt.item_i_brand_id,
          obt.item_i_class_id,
          obt.item_i_category_id,
          obt.item_i_manufact_id,
          obt.quantity - COALESCE(obt.return_quantity, 0) AS sales_cnt,
          obt.ext_sales_price - COALESCE(obt.return_amount, 0.0) AS sales_amt
        FROM tpcds_sales_returns_obt AS obt
        WHERE
          (
            (
              obt.item_i_category = '[CATEGORY]' AND obt.item_i_item_sk = obt.item_sk
            )
            AND obt.sold_date_d_date_sk = obt.sold_date_sk
          )
          AND channel = 'catalog'
        UNION
        SELECT
          obt.sold_date_d_year,
          obt.item_i_brand_id,
          obt.item_i_class_id,
          obt.item_i_category_id,
          obt.item_i_manufact_id,
          obt.quantity - COALESCE(obt.return_quantity, 0) AS sales_cnt,
          obt.ext_sales_price - COALESCE(obt.return_amount, 0.0) AS sales_amt
        FROM tpcds_sales_returns_obt AS obt
        WHERE
          (
            (
              obt.item_i_category = '[CATEGORY]' AND obt.item_i_item_sk = obt.item_sk
            )
            AND obt.sold_date_d_date_sk = obt.sold_date_sk
          )
          AND channel = 'store'
        UNION
        SELECT
          obt.sold_date_d_year,
          obt.item_i_brand_id,
          obt.item_i_class_id,
          obt.item_i_category_id,
          obt.item_i_manufact_id,
          obt.quantity - COALESCE(obt.return_quantity, 0) AS sales_cnt,
          obt.ext_sales_price - COALESCE(obt.return_amount, 0.0) AS sales_amt
        FROM tpcds_sales_returns_obt AS obt
        WHERE
          (
            (
              obt.item_i_category = '[CATEGORY]' AND obt.item_i_item_sk = obt.item_sk
            )
            AND obt.sold_date_d_date_sk = obt.sold_date_sk
          )
          AND channel = 'web'
      ) AS sales_detail
      GROUP BY
        d_year,
        i_brand_id,
        i_class_id,
        i_category_id,
        i_manufact_id
    )
    SELECT
      prev_yr.d_year AS prev_year,
      curr_yr.d_year AS year,
      curr_yr.i_brand_id,
      curr_yr.i_class_id,
      curr_yr.i_category_id,
      curr_yr.i_manufact_id,
      prev_yr.sales_cnt AS prev_yr_cnt,
      curr_yr.sales_cnt AS curr_yr_cnt,
      curr_yr.sales_cnt - prev_yr.sales_cnt AS sales_cnt_diff,
      curr_yr.sales_amt - prev_yr.sales_amt AS sales_amt_diff
    FROM all_sales AS curr_yr, all_sales AS prev_yr
    WHERE
      curr_yr.i_brand_id = prev_yr.i_brand_id
      AND curr_yr.i_class_id = prev_yr.i_class_id
      AND curr_yr.i_category_id = prev_yr.i_category_id
      AND curr_yr.i_manufact_id = prev_yr.i_manufact_id
      AND curr_yr.d_year = [YEAR]
      AND prev_yr.d_year = [YEAR] - 1
      AND CAST(curr_yr.sales_cnt AS DECIMAL(17, 2)) / CAST(prev_yr.sales_cnt AS DECIMAL(17, 2)) < 0.9
    ORDER BY
      sales_cnt_diff,
      sales_amt_diff
    LIMIT 100
- id: 76
  template: query76.tpl
  template_sha256: 748201a1fd429951aa16c5a7a361aea437cc7f83dbfa0dffa5f6844e86aac05c
  parameters:
    NULLCOLCS:
    - 1
    NULLCOLSS:
    - 1
    NULLCOLWS:
    - 1
  identifier_parameters:
  - NULLCOLCS
  - NULLCOLSS
  - NULLCOLWS
  identifier_map:
    cs_bill_addr_sk: bill_addr_sk
    cs_bill_customer_sk: bill_customer_sk
    cs_bill_hdemo_sk: bill_hdemo_sk
    cs_promo_sk: promo_sk
    cs_ship_addr_sk: ship_addr_sk
    cs_ship_cdemo_sk: ship_cdemo_sk
    cs_ship_customer_sk: ship_customer_sk
    cs_ship_hdemo_sk: ship_hdemo_sk
    cs_ship_mode_sk: ship_mode_sk
    cs_warehouse_sk: warehouse_sk
    ss_addr_sk: ship_addr_sk
    ss_cdemo_sk: ship_cdemo_sk
    ss_customer_sk: ship_customer_sk
    ss_hdemo_sk: ship_hdemo_sk
    ss_promo_sk: promo_sk
    ss_store_sk: store_sk
    ws_bill_addr_sk: bill_addr_sk
    ws_bill_customer_sk: bill_customer_sk
    ws_bill_hdemo_sk: bill_hdemo_sk
    ws_promo_sk: promo_sk
    ws_ship_addr_sk: ship_addr_sk
    ws_ship_cdemo_sk: ship_cdemo_sk
    ws_ship_customer_sk: ship_customer_sk
    ws_ship_hdemo_sk: ship_hdemo_sk
    ws_ship_mode_sk: ship_mode_sk
    ws_warehouse_sk: warehouse_sk
    ws_web_page_sk: web_page_sk
    ws_web_site_sk: web_site_sk
  sql: |-
    SELECT
      channel,
      col_name,
      sold_date_d_year,
      sold_date_d_qoy,
      item_i_category,
      COUNT(*) AS sales_cnt,
      SUM(ext_sales_price) AS sales_amt
    FROM (
      SELECT
        'store' AS channel,
        'ss_' || REPLACE('[NULLCOLSS]', 'ship_', '') AS col_name,
        obt.sold_date_d_year,
        obt.sold_date_d_qoy,
        obt.item_i_category,
        obt.ext_sales_price AS ext_sales_price
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          [NULLCOLSS] IS NULL
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.item_sk = obt.item_i_item_sk
        )
        AND channel = 'store'
      UNION ALL
      SELECT
        'web' AS channel,
        'ws_' || '[NULLCOLWS]' AS col_name,
        obt.sold_date_d_year,
        obt.sold_date_d_qoy,
        obt.item_i_category,
        obt.ext_sales_price AS ext_sales_price
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          [NULLCOLWS] IS NULL
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.item_sk = obt.item_i_item_sk
        )
        AND channel = 'web'
      UNION ALL
      SELECT
        'catalog' AS channel,
        'cs_' || '[NULLCOLCS]' AS col_name,
        obt.sold_date_d_year,
        obt.sold_date_d_qoy,
        obt.item_i_category,
        obt.ext_sales_price AS ext_sales_price
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          [NULLCOLCS] IS NULL
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.item_sk = obt.item_i_item_sk
        )
        AND channel = 'catalog'
    ) AS foo
    GROUP BY
      channel,
      col_name,
      sold_date_d_year,
      sold_date_d_qoy,
      item_i_category
    ORDER BY
      channel,
      col_name,
      sold_date_d_year,
      sold_date_d_qoy,
      item_i_category
    LIMIT 100
- id: 77
  template: query77.tpl
  template_sha256: 21644fbbc5b7cdab24b51a71647cec937f8bb261ee5f6fd49cc7f8e62a669026
  parameters:
    SALES_DATE:
    - 1
    YEAR: []
  sql: |-
    WITH ss AS (
      SELECT store_s_store_sk AS s_store_sk, SUM(ext_sales_price) AS sales, SUM(net_profit) AS profit
      FROM tpcds_sales_returns_obt
      WHERE channel = 'store' AND store_s_store_sk IS NOT NULL
        AND sold_date_d_date BETWEEN CAST('[SALES_DATE]' AS DATE) AND (CAST('[SALES_DATE]' AS DATE) + INTERVAL '30' DAY)
      GROUP BY 1
    ), sr AS (
      SELECT return_store_s_store_sk AS s_store_sk, SUM(return_amount) AS returns, SUM(return_net_loss) AS profit_loss
      FROM tpcds_sales_returns_obt
      WHERE channel = 'store' AND has_return = 'Y' AND return_store_s_store_sk IS NOT NULL
        AND return_date_d_date BETWEEN CAST('[SALES_DATE]' AS DATE) AND (CAST('[SALES_DATE]' AS DATE) + INTERVAL '30' DAY)
      GROUP BY 1
    ), cs AS (
      SELECT call_center_sk AS cs_call_center_sk, SUM(ext_sales_price) AS sales, SUM(net_profit) AS profit
      FROM tpcds_sales_returns_obt
      WHERE channel = 'catalog'
        AND sold_date_d_date BETWEEN CAST('[SALES_DATE]' AS DATE) AND (CAST('[SALES_DATE]' AS DATE) + INTERVAL '30' DAY)
      GROUP BY 1
    ), cr AS (
      SELECT return_call_center_cc_call_center_sk AS cr_call_center_sk, SUM(return_amount) AS returns, SUM(return_net_loss) AS profit_loss
      FROM tpcds_sales_returns_obt
      WHERE channel = 'catalog' AND has_return = 'Y'
        AND return_date_d_date BETWEEN CAST('[SALES_DATE]' AS DATE) AND (CAST('[SALES_DATE]' AS DATE) + INTERVAL '30' DAY)
      GROUP BY 1
    ), ws AS (
      SELECT web_page_wp_web_page_sk AS wp_web_page_sk, SUM(ext_sales_price) AS sales, SUM(net_profit) AS profit
      FROM tpcds_sales_returns_obt
      WHERE channel = 'web' AND web_page_wp_web_page_sk IS NOT NULL
        AND sold_date_d_date BETWEEN CAST('[SALES_DATE]' AS DATE) AND (CAST('[SALES_DATE]' AS DATE) + INTERVAL '30' DAY)
      GROUP BY 1
    ), wr AS (
      SELECT return_web_page_wp_web_page_sk AS wp_web_page_sk, SUM(return_amount) AS returns, SUM(return_net_loss) AS profit_loss
      FROM tpcds_sales_returns_obt
      WHERE channel = 'web' AND has_return = 'Y' AND return_web_page_wp_web_page_sk IS NOT NULL
        AND return_date_d_date BETWEEN CAST('[SALES_DATE]' AS DATE) AND (CAST('[SALES_DATE]' AS DATE) + INTERVAL '30' DAY)
      GROUP BY 1
    )
    SELECT channel, id, SUM(sales) AS sales, SUM(returns) AS returns, SUM(profit) AS profit
    FROM (
      SELECT 'store channel' AS channel, ss.s_store_sk AS id, sales, COALESCE(returns, 0) AS returns, (profit - COALESCE(profit_loss, 0)) AS profit
      FROM ss LEFT JOIN sr ON ss.s_store_sk = sr.s_store_sk
      UNION ALL
      SELECT 'catalog channel' AS channel, cs_call_center_sk AS id, sales, returns, (profit - profit_loss) AS profit FROM cs, cr
      UNION ALL
      SELECT 'web channel' AS channel, ws.wp_web_page_sk AS id, sales, COALESCE(returns, 0) AS returns, (profit - COALESCE(profit_loss, 0)) AS profit
      FROM ws LEFT JOIN wr ON ws.wp_web_page_sk = wr.wp_web_page_sk
    ) AS x
    GROUP BY ROLLUP (channel, id)
    ORDER BY channel, id
    LIMIT 100
- id: 78
  template: query78.tpl
  template_sha256: 50007b69c4b2a1a07ccda17781a91e323ccbc935a303722a0fd675b256a14c39
  parameters:
    SELECTONE:
    - 1
    YEAR:
    - 1
  identifier_parameters:
  - SELECTONE
  identifier_map:
    ss_customer_sk: ship_customer_sk
    ss_item_sk: ss.item_sk
    ss_sold_year: ss_sold_year
  sql: |-
    WITH ws AS (
      SELECT
        obt.sold_date_d_year AS ws_sold_year,
        obt.item_sk,
        obt.bill_customer_sk AS ws_customer_sk,
        SUM(obt.quantity) AS ws_qty,
        SUM(obt.wholesale_cost) AS ws_wc,
        SUM(obt.sales_price) AS ws_sp
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.has_return = 'N' AND obt.sold_date_sk = obt.sold_date_d_date_sk
        )
        AND channel = 'web'
      GROUP BY
        obt.sold_date_d_year,
        obt.item_sk,
        obt.bill_customer_sk
    ), cs AS (
      SELECT
        obt.sold_date_d_year AS cs_sold_year,
        obt.item_sk,
        obt.bill_customer_sk AS cs_customer_sk,
        SUM(obt.quantity) AS cs_qty,
        SUM(obt.wholesale_cost) AS cs_wc,
        SUM(obt.sales_price) AS cs_sp
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.has_return = 'N' AND obt.sold_date_sk = obt.sold_date_d_date_sk
        )
        AND channel = 'catalog'
      GROUP BY
        obt.sold_date_d_year,
        obt.item_sk,
        obt.bill_customer_sk
    ), ss AS (
      SELECT
        obt.sold_date_d_year AS ss_sold_year,
        obt.item_sk,
        obt.ship_customer_sk,
        SUM(obt.quantity) AS ss_qty,
        SUM(obt.wholesale_cost) AS ss_wc,
        SUM(obt.sales_price) AS ss_sp
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.has_return = 'N' AND obt.sold_date_sk = obt.sold_date_d_date_sk
        )
        AND channel = 'store'
      GROUP BY
        obt.sold_date_d_year,
        obt.item_sk,
        obt.ship_customer_sk
    )
    SELECT
      [SELECTONE],
      ROUND(ss_qty / (
        COALESCE(ws_qty, 0) + COALESCE(cs_qty, 0)
      ), 2) AS ratio,
      ss_qty AS store_qty,
      ss_wc AS store_wholesale_cost,
      ss_sp AS store_sales_price,
      COALESCE(ws_qty, 0) + COALESCE(cs_qty, 0) AS other_chan_qty,
      COALESCE(ws_wc, 0) + COALESCE(cs_wc, 0) AS other_chan_wholesale_cost,
      COALESCE(ws_sp, 0) + COALESCE(cs_sp, 0) AS other_chan_sales_price
    FROM ss
    LEFT JOIN ws
      ON (
        ws_sold_year = ss_sold_year
        AND ws.item_sk = ss.item_sk
        AND ws_customer_sk = ship_customer_sk
      )
    LEFT JOIN cs
      ON (
        cs_sold_year = ss_sold_year
        AND ss.item_sk = cs.item_sk
        AND cs_customer_sk = ship_customer_sk
      )
    WHERE
      (
        COALESCE(ws_qty, 0) > 0 OR COALESCE(cs_qty, 0) > 0
      )
      AND ss_sold_year = [YEAR]
    ORDER BY
      [SELECTONE],
      ss_qty DESC NULLS FIRST,
      ss_wc DESC NULLS FIRST,
      ss_sp DESC NULLS FIRST,
      other_chan_qty,
      other_chan_wholesale_cost,
      other_chan_sales_price,
      ratio
    LIMIT 100
- id: 79
  template: query79.tpl
  template_sha256: bc9b85ad7c8448deaded4769a1d03e2dc6816da7c2a7963fe76d1687143db26f
  parameters:
    DEPCNT:
    - 1
    VEHCNT:
    - 1
    YEAR:
    - 1
  sql: |-
    SELECT
      c_last_name,
      c_first_name,
      SUBSTRING(s_city, 1, 30),
      ss_ticket_number,
      amt,
      profit
    FROM (
      SELECT
        sale_id AS ss_ticket_number,
        bill_customer_c_customer_sk AS cust_sk,
        bill_customer_c_last_name AS c_last_name,
        bill_customer_c_first_name AS c_first_name,
        store_s_city AS s_city,
        SUM(coupon_amt) AS amt,
        SUM(net_profit) AS profit
      FROM tpcds_sales_returns_obt
      WHERE
        channel = 'store'
        AND sold_date_d_date_sk IS NOT NULL
        AND store_s_store_sk IS NOT NULL
        AND bill_hdemo_hd_demo_sk IS NOT NULL
        AND (
          bill_hdemo_hd_dep_count = [DEPCNT] OR bill_hdemo_hd_vehicle_count > [VEHCNT]
        )
        AND sold_date_d_dow = 1
        AND sold_date_d_year IN ([YEAR], [YEAR] + 1, [YEAR] + 2)
        AND store_s_number_employees BETWEEN 200 AND 295
      GROUP BY
        sale_id,
        bill_customer_sk,
        bill_addr_sk,
        store_s_city,
        bill_customer_c_customer_sk,
        bill_customer_c_last_name,
        bill_customer_c_first_name
    ) AS ms
    WHERE
      cust_sk IS NOT NULL
    ORDER BY
      c_last_name,
      c_first_name,
      SUBSTRING(s_city, 1, 30),
      profit
    LIMIT 100
- id: 80
  template: query80.tpl
  template_sha256: 94dbb1c80f8c4e88bb1a61c2885234de3f245ea67b2af68ed81b1129d7014e26
  parameters:
    SALES_DATE:
    - 1
    YEAR: []
  sql: |-
    WITH ssr AS (
      SELECT
        obt.store_s_store_id AS store_id,
        SUM(obt.ext_sales_price) AS sales,
        SUM(COALESCE(obt.return_amount, 0)) AS returns,
        SUM(obt.net_profit - COALESCE(obt.return_net_loss, 0)) AS profit
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_date BETWEEN CAST('[SALES_DATE]' AS DATE) AND (
            CAST('[SALES_DATE]' AS DATE) + INTERVAL 30 DAY
          )
          AND obt.store_sk = obt.store_s_store_sk
          AND obt.item_sk = obt.item_i_item_sk
          AND obt.item_i_current_price > 50
          AND obt.promo_sk = obt.promo_p_promo_sk
          AND obt.promo_p_channel_tv = 'N'
        )
        AND channel = 'store'
      GROUP BY
        obt.store_s_store_id
    ), csr AS (
      SELECT
        obt.catalog_page_cp_catalog_page_id AS catalog_page_id,
        SUM(obt.ext_sales_price) AS sales,
        SUM(COALESCE(obt.return_amount, 0)) AS returns,
        SUM(obt.net_profit - COALESCE(obt.return_net_loss, 0)) AS profit
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_date BETWEEN CAST('[SALES_DATE]' AS DATE) AND (
            CAST('[SALES_DATE]' AS DATE) + INTERVAL 30 DAY
          )
          AND obt.catalog_page_sk = obt.catalog_page_cp_catalog_page_sk
          AND obt.item_sk = obt.item_i_item_sk
          AND obt.item_i_current_price > 50
          AND obt.promo_sk = obt.promo_p_promo_sk
          AND obt.promo_p_channel_tv = 'N'
        )
        AND channel = 'catalog'
      GROUP BY
        obt.catalog_page_cp_catalog_page_id
    ), wsr AS (
      SELECT
        obt.web_site_web_site_id,
        SUM(obt.ext_sales_price) AS sales,
        SUM(COALESCE(obt.return_amount, 0)) AS returns,
        SUM(obt.net_profit - COALESCE(obt.return_net_loss, 0)) AS profit
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_date BETWEEN CAST('[SALES_DATE]' AS DATE) AND (
            CAST('[SALES_DATE]' AS DATE) + INTERVAL 30 DAY
          )
          AND obt.web_site_sk = obt.web_site_web_site_sk
          AND obt.item_sk = obt.item_i_item_sk
          AND obt.item_i_current_price > 50
          AND obt.promo_sk = obt.promo_p_promo_sk
          AND obt.promo_p_channel_tv = 'N'
        )
        AND channel = 'web'
      GROUP BY
        obt.web_site_web_site_id
    )
    SELECT
      channel,
      id,
      SUM(sales) AS sales,
      SUM(returns) AS returns,
      SUM(profit) AS profit
    FROM (
      SELECT
        'store channel' AS channel,
        'store' || store_id AS id,
        sales,
        returns,
        profit
      FROM ssr
      UNION ALL
      SELECT
        'catalog channel' AS channel,
        'catalog_page' || catalog_page_id AS id,
        sales,
        returns,
        profit
      FROM csr
      UNION ALL
      SELECT
        'web channel' AS channel,
        'web_site' || web_site_web_site_id AS id,
        sales,
        returns,
        profit
      FROM wsr
    ) AS x
    GROUP BY
      ROLLUP (
        channel,
        id
      )
    ORDER BY
      channel,
      id
    LIMIT 100
- id: 81
  template: query81.tpl
  template_sha256: 61def14bcc7c4d116cc67febbf1f173650d750731595bd97c526b4fe8dafb958
  parameters:
    STATE:
    - 1
    YEAR:
    - 1
  sql: |-
    WITH customer_total_return AS (
      SELECT
        returning_customer_c_customer_sk AS ctr_customer_sk,
        returning_addr_ca_state AS ctr_state,
        SUM(return_amount_inc_tax) AS ctr_total_return
      FROM tpcds_sales_returns_obt
      WHERE
        channel = 'catalog'
        AND has_return = 'Y'
        AND return_date_d_year = [YEAR]
        AND returning_addr_ca_address_sk IS NOT NULL
      GROUP BY
        returning_customer_c_customer_sk,
        returning_addr_ca_state
    ), cust AS (
      SELECT DISTINCT
        returning_customer_c_customer_sk AS c_customer_sk,
        returning_customer_c_customer_id AS c_customer_id,
        returning_customer_c_salutation AS c_salutation,
        returning_customer_c_first_name AS c_first_name,
        returning_customer_c_last_name AS c_last_name,
        returning_cur_addr_ca_street_number AS ca_street_number,
        returning_cur_addr_ca_street_name AS ca_street_name,
        returning_cur_addr_ca_street_type AS ca_street_type,
        returning_cur_addr_ca_suite_number AS ca_suite_number,
        returning_cur_addr_ca_city AS ca_city,
        returning_cur_addr_ca_county AS ca_county,
        returning_cur_addr_ca_state AS ca_state,
        returning_cur_addr_ca_zip AS ca_zip,
        returning_cur_addr_ca_country AS ca_country,
        returning_cur_addr_ca_gmt_offset AS ca_gmt_offset,
        returning_cur_addr_ca_location_type AS ca_location_type
      FROM tpcds_sales_returns_obt
      WHERE
        channel = 'catalog'
        AND has_return = 'Y'
        AND returning_customer_c_customer_sk IS NOT NULL
    )
    SELECT
      c_customer_id,
      c_salutation,
      c_first_name,
      c_last_name,
      ca_street_number,
      ca_street_name,
      ca_street_type,
      ca_suite_number,
      ca_city,
      ca_county,
      ca_state,
      ca_zip,
      ca_country,
      ca_gmt_offset,
      ca_location_type,
      ctr_total_return
    FROM customer_total_return AS ctr1
    JOIN cust
      ON ctr1.ctr_customer_sk = cust.c_customer_sk
    WHERE
      ctr1.ctr_total_return > (
        SELECT
          AVG(ctr_total_return) * 1.2
        FROM customer_total_return AS ctr2
        WHERE
          ctr1.ctr_state = ctr2.ctr_state
      )
      AND cust.ca_state = '[STATE]'
    ORDER BY
      c_customer_id,
      c_salutation,
      c_first_name,
      c_last_name,
      ca_street_number,
      ca_street_name,
      ca_street_type,
      ca_suite_number,
      ca_city,
      ca_county,
      ca_state,
      ca_zip,
      ca_country,
      ca_gmt_offset,
      ca_location_type,
      ctr_total_return
    LIMIT 100
- id: 83
  template: query83.tpl
  template_sha256: 70f5bc97783e4140e95528d6a43fb72d3fc078d143329f69d69ada43539dd5d5
  parameters:
    RETURNED_DATE_ONE:
    - 1
    RETURNED_DATE_THREE:
    - 1
    RETURNED_DATE_TWO:
    - 1
    YEAR: []
  sql: |-
    WITH sr_items AS (
      SELECT
        obt.item_i_item_id AS item_id,
        SUM(obt.return_quantity) AS sr_item_qty
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_sk = obt.item_i_item_sk
          AND obt.return_date_d_date IN (
            SELECT
              obt.sold_date_d_date
            FROM tpcds_sales_returns_obt AS obt
            WHERE
              obt.sold_date_d_week_seq IN (
                SELECT
                  obt.sold_date_d_week_seq
                FROM tpcds_sales_returns_obt AS obt
                WHERE
                  obt.sold_date_d_date IN (
                    '[RETURNED_DATE_ONE]',
                    '[RETURNED_DATE_TWO]',
                    '[RETURNED_DATE_THREE]'
                  )
                  AND channel IN ('catalog', 'store', 'web')
              )
              AND channel IN ('catalog', 'store', 'web')
          )
          AND obt.returned_date_sk = obt.return_date_d_date_sk
        )
        AND channel = 'store'
      GROUP BY
        obt.item_i_item_id
    ), cr_items AS (
      SELECT
        obt.item_i_item_id AS item_id,
        SUM(obt.return_quantity) AS cr_item_qty
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_sk = obt.item_i_item_sk
          AND obt.return_date_d_date IN (
            SELECT
              obt.sold_date_d_date
            FROM tpcds_sales_returns_obt AS obt
            WHERE
              obt.sold_date_d_week_seq IN (
                SELECT
                  obt.sold_date_d_week_seq
                FROM tpcds_sales_returns_obt AS obt
                WHERE
                  obt.sold_date_d_date IN (
                    '[RETURNED_DATE_ONE]',
                    '[RETURNED_DATE_TWO]',
                    '[RETURNED_DATE_THREE]'
                  )
                  AND channel IN ('catalog', 'store', 'web')
              )
              AND channel IN ('catalog', 'store', 'web')
          )
          AND obt.returned_date_sk = obt.return_date_d_date_sk
        )
        AND channel = 'catalog'
      GROUP BY
        obt.item_i_item_id
    ), wr_items AS (
      SELECT
        obt.item_i_item_id AS item_id,
        SUM(obt.return_quantity) AS wr_item_qty
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_sk = obt.item_i_item_sk
          AND obt.return_date_d_date IN (
            SELECT
              obt.sold_date_d_date
            FROM tpcds_sales_returns_obt AS obt
            WHERE
              obt.sold_date_d_week_seq IN (
                SELECT
                  obt.sold_date_d_week_seq
                FROM tpcds_sales_returns_obt AS obt
                WHERE
                  obt.sold_date_d_date IN (
                    '[RETURNED_DATE_ONE]',
                    '[RETURNED_DATE_TWO]',
                    '[RETURNED_DATE_THREE]'
                  )
                  AND channel IN ('catalog', 'store', 'web')
              )
              AND channel IN ('catalog', 'store', 'web')
          )
          AND obt.returned_date_sk = obt.return_date_d_date_sk
        )
        AND channel = 'web'
      GROUP BY
        obt.item_i_item_id
    )
    SELECT
      sr_items.item_id,
      sr_item_qty,
      sr_item_qty / (
        sr_item_qty + cr_item_qty + wr_item_qty
      ) / 3.0 * 100 AS sr_dev,
      cr_item_qty,
      cr_item_qty / (
        sr_item_qty + cr_item_qty + wr_item_qty
      ) / 3.0 * 100 AS cr_dev,
      wr_item_qty,
      wr_item_qty / (
        sr_item_qty + cr_item_qty + wr_item_qty
      ) / 3.0 * 100 AS wr_dev,
      (
        sr_item_qty + cr_item_qty + wr_item_qty
      ) / 3.0 AS average
    FROM sr_items, cr_items, wr_items
    WHERE
      sr_items.item_id = cr_items.item_id AND sr_items.item_id = wr_items.item_id
    ORDER BY
      sr_items.item_id,
      sr_item_qty
    LIMIT 100
- id: 85
  template: query85.tpl
  template_sha256: 1e95614e7aebdb858f5d9aa76f98ff1940ed69d86cb26bb926237e99c9789025
  parameters:
    ES:
    - 1
    - 2
    - 3
    MS:
    - 1
    - 2
    - 3
    STATE:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    - 9
    YEAR:
    - 1
  sql: |-
    SELECT
      SUBSTRING(obt.reason_r_reason_desc, 1, 20),
      AVG(obt.quantity),
      AVG(obt.refunded_cash),
      AVG(obt.return_fee)
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.web_page_sk = obt.web_page_wp_web_page_sk
        AND obt.item_sk = obt.item_sk
        AND obt.sale_id = obt.sale_id
        AND obt.sold_date_sk = obt.sold_date_d_date_sk
        AND obt.sold_date_d_year = [YEAR]
        AND obt.returning_cdemo_cd_demo_sk = obt.returning_cdemo_cd_demo_sk
        AND obt.returning_cdemo_cd_demo_sk = obt.returning_cdemo_cd_demo_sk
        AND obt.returning_addr_ca_address_sk = obt.returning_addr_ca_address_sk
        AND obt.reason_r_reason_sk = obt.reason_sk
        AND (
          (
            obt.returning_cdemo_cd_marital_status = '[MS]'
            AND obt.returning_cdemo_cd_marital_status = obt.returning_cdemo_cd_marital_status
            AND obt.returning_cdemo_cd_education_status = '[ES]'
            AND obt.returning_cdemo_cd_education_status = obt.returning_cdemo_cd_education_status
            AND obt.sales_price BETWEEN 100.00 AND 150.00
          )
          OR (
            obt.returning_cdemo_cd_marital_status = '[MS.2]'
            AND obt.returning_cdemo_cd_marital_status = obt.returning_cdemo_cd_marital_status
            AND obt.returning_cdemo_cd_education_status = '[ES.2]'
            AND obt.returning_cdemo_cd_education_status = obt.returning_cdemo_cd_education_status
            AND obt.sales_price BETWEEN 50.00 AND 100.00
          )
          OR (
            obt.returning_cdemo_cd_marital_status = '[MS.3]'
            AND obt.returning_cdemo_cd_marital_status = obt.returning_cdemo_cd_marital_status
            AND obt.returning_cdemo_cd_education_status = '[ES.3]'
            AND obt.returning_cdemo_cd_education_status = obt.returning_cdemo_cd_education_status
            AND obt.sales_price BETWEEN 150.00 AND 200.00
          )
        )
        AND (
          (
            obt.returning_addr_ca_country = 'United States'
            AND obt.returning_addr_ca_state IN ('[STATE]', '[STATE.2]', '[STATE.3]')
            AND obt.net_profit BETWEEN 100 AND 200
          )
          OR (
            obt.returning_addr_ca_country = 'United States'
            AND obt.returning_addr_ca_state IN ('[STATE.4]', '[STATE.5]', '[STATE.6]')
            AND obt.net_profit BETWEEN 150 AND 300
          )
          OR (
            obt.returning_addr_ca_country = 'United States'
            AND obt.returning_addr_ca_state IN ('[STATE.7]', '[STATE.8]', '[STATE.9]')
            AND obt.net_profit BETWEEN 50 AND 250
          )
        )
      )
      AND channel = 'web'
    GROUP BY
      obt.reason_r_reason_desc
    ORDER BY
      SUBSTRING(obt.reason_r_reason_desc, 1, 20),
      AVG(obt.quantity),
      AVG(obt.refunded_cash),
      AVG(obt.return_fee)
    LIMIT 100
- id: 86
  template: query86.tpl
  template_sha256: 9b7722986d6efe9cfabcabd87dab12628f7df9adbb0609cacef6b23247ebdf10
  parameters:
    DMS:
    - 1
  sql: |-
    SELECT
      SUM(obt.net_paid) AS total_sum,
      obt.item_i_category,
      obt.item_i_class,
      GROUPING(obt.item_i_category) + GROUPING(obt.item_i_class) AS lochierarchy,
      RANK() OVER (
        PARTITION BY GROUPING(obt.item_i_category) + GROUPING(obt.item_i_class), CASE WHEN GROUPING(obt.item_i_class) = 0 THEN obt.item_i_category END
        ORDER BY SUM(obt.net_paid) DESC NULLS FIRST
      ) AS rank_within_parent
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.sold_date_d_month_seq BETWEEN [DMS] AND [DMS] + 11
        AND obt.sold_date_d_date_sk = obt.sold_date_sk
        AND obt.item_i_item_sk = obt.item_sk
      )
      AND channel = 'web'
    GROUP BY
      ROLLUP (
        obt.item_i_category,
        obt.item_i_class
      )
    ORDER BY
      lochierarchy DESC NULLS FIRST,
      CASE WHEN lochierarchy = 0 THEN obt.item_i_category END,
      rank_within_parent
    LIMIT 100
- id: 87
  template: query87.tpl
  template_sha256: a521a506634cb62f7cc056d9111e616318cc151eb205e1d14f25adf7b9af5976
