      AND channel = 'store'
    GROUP BY
      obt.store_s_store_name
    ORDER BY
      obt.store_s_store_name
    LIMIT 100
- id: 9
  template: query9.tpl
  template_sha256: 2db1d593f05a0d364831bb4c5b4870743f8b91b68a9bee62f3f71b3023cedb29
  parameters:
    AGGCELSE:
    - 1
    AGGCTHEN:
    - 1
    RC:
    - 1
    - 2
    - 3
    - 4
    - 5
  identifier_parameters:
  - AGGCELSE
  - AGGCTHEN
  identifier_map:
    ss_ext_discount_amt: ext_discount_amt
    ss_ext_list_price: ext_list_price
    ss_ext_sales_price: ext_sales_price
    ss_ext_tax: ext_tax
    ss_net_paid: net_paid
    ss_net_paid_inc_tax: net_paid_inc_tax
    ss_net_profit: net_profit
  sql: |-
    SELECT
      CASE
        WHEN (
          SELECT
            COUNT(*)
          FROM tpcds_sales_returns_obt AS obt
          WHERE
            obt.quantity BETWEEN 1 AND 20 AND channel = 'store'
        ) > [RC]
        THEN (
          SELECT
            AVG([AGGCTHEN])
          FROM tpcds_sales_returns_obt AS obt
          WHERE
            obt.quantity BETWEEN 1 AND 20 AND channel = 'store'
        )
        ELSE (
          SELECT
            AVG([AGGCELSE])
          FROM tpcds_sales_returns_obt AS obt
          WHERE
            obt.quantity BETWEEN 1 AND 20 AND channel = 'store'
        )
      END AS bucket1,
      CASE
        WHEN (
          SELECT
            COUNT(*)
          FROM tpcds_sales_returns_obt AS obt
          WHERE
            obt.quantity BETWEEN 21 AND 40 AND channel = 'store'
        ) > [RC.2]
        THEN (
          SELECT
            AVG([AGGCTHEN])
          FROM tpcds_sales_returns_obt AS obt
          WHERE
            obt.quantity BETWEEN 21 AND 40 AND channel = 'store'
        )
        ELSE (
          SELECT
            AVG([AGGCELSE])
          FROM tpcds_sales_returns_obt AS obt
          WHERE
            obt.quantity BETWEEN 21 AND 40 AND channel = 'store'
        )
      END AS bucket2,
      CASE
        WHEN (
          SELECT
            COUNT(*)
          FROM tpcds_sales_returns_obt AS obt
          WHERE
            obt.quantity BETWEEN 41 AND 60 AND channel = 'store'
        ) > [RC.3]
        THEN (
          SELECT
            AVG([AGGCTHEN])
          FROM tpcds_sales_returns_obt AS obt
          WHERE
            obt.quantity BETWEEN 41 AND 60 AND channel = 'store'
        )
        ELSE (
          SELECT
            AVG([AGGCELSE])
          FROM tpcds_sales_returns_obt AS obt
          WHERE
            obt.quantity BETWEEN 41 AND 60 AND channel = 'store'
        )
      END AS bucket3,
      CASE
        WHEN (
          SELECT
            COUNT(*)
          FROM tpcds_sales_returns_obt AS obt
          WHERE
            obt.quantity BETWEEN 61 AND 80 AND channel = 'store'
        ) > [RC.4]
        THEN (
          SELECT
            AVG([AGGCTHEN])
          FROM tpcds_sales_returns_obt AS obt
          WHERE
            obt.quantity BETWEEN 61 AND 80 AND channel = 'store'
        )
        ELSE (
          SELECT
            AVG([AGGCELSE])
          FROM tpcds_sales_returns_obt AS obt
          WHERE
            obt.quantity BETWEEN 61 AND 80 AND channel = 'store'
        )
      END AS bucket4,
      CASE
        WHEN (
          SELECT
            COUNT(*)
          FROM tpcds_sales_returns_obt AS obt
          WHERE
            obt.quantity BETWEEN 81 AND 100 AND channel = 'store'
        ) > [RC.5]
        THEN (
          SELECT
            AVG([AGGCTHEN])
          FROM tpcds_sales_returns_obt AS obt
          WHERE
            obt.quantity BETWEEN 81 AND 100 AND channel = 'store'
        )
        ELSE (
          SELECT
            AVG([AGGCELSE])
          FROM tpcds_sales_returns_obt AS obt
          WHERE
            obt.quantity BETWEEN 81 AND 100 AND channel = 'store'
        )
      END AS bucket5
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      obt.reason_r_reason_sk = 1 AND channel = 'store'
- id: 10
  template: query10.tpl
  template_sha256: 937882b86b0a0c545d771e9f23622819fda4304339d3da79cbf7eb626b1b4591
  parameters:
    COUNTY:
    - 1
    - 2
    - 3
    - 4
    - 5
    MONTH:
    - 1
    YEAR:
    - 1
  sql: |-
    SELECT
      obt.bill_cdemo_cd_gender,
      obt.bill_cdemo_cd_marital_status,
      obt.bill_cdemo_cd_education_status,
      COUNT(*) AS cnt1,
      obt.bill_cdemo_cd_purchase_estimate,
      COUNT(*) AS cnt2,
      obt.bill_cdemo_cd_credit_rating,
      COUNT(*) AS cnt3,
      obt.bill_cdemo_cd_dep_count,
      COUNT(*) AS cnt4,
      obt.bill_cdemo_cd_dep_employed_count,
      COUNT(*) AS cnt5,
      obt.bill_cdemo_cd_dep_college_count,
      COUNT(*) AS cnt6
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.bill_addr_ca_county IN ('[COUNTY]', '[COUNTY.2]', '[COUNTY.3]', '[COUNTY.4]', '[COUNTY.5]')
        AND EXISTS(
          SELECT
            *
          FROM tpcds_sales_returns_obt AS ex_obt WHERE ( ex_obt.bill_customer_c_customer_sk = obt.bill_customer_c_customer_sk
              AND ex_obt.sold_date_sk = ex_obt.sold_date_d_date_sk
              AND ex_obt.sold_date_d_year = [YEAR]
              AND ex_obt.sold_date_d_moy BETWEEN [MONTH] AND [MONTH] + 3
            ) AND ex_obt.channel = 'store'
        )
        AND (
          EXISTS(
            SELECT
              *
            FROM tpcds_sales_returns_obt AS ex_obt WHERE ( ex_obt.bill_customer_c_customer_sk = obt.bill_customer_c_customer_sk
                AND ex_obt.sold_date_sk = ex_obt.sold_date_d_date_sk
                AND ex_obt.sold_date_d_year = [YEAR]
                AND ex_obt.sold_date_d_moy BETWEEN [MONTH] AND [MONTH] + 3
              ) AND ex_obt.channel = 'web'
          )
          OR EXISTS(
            SELECT
              *
            FROM tpcds_sales_returns_obt AS ex_obt WHERE ( ex_obt.bill_customer_c_customer_sk = obt.bill_customer_c_customer_sk
                AND ex_obt.sold_date_sk = ex_obt.sold_date_d_date_sk
                AND ex_obt.sold_date_d_year = [YEAR]
                AND ex_obt.sold_date_d_moy BETWEEN [MONTH] AND [MONTH] + 3
              ) AND ex_obt.channel = 'catalog'
          )
        )
      )
      AND channel IN ('catalog', 'store', 'web')
    GROUP BY
      obt.bill_cdemo_cd_gender,
      obt.bill_cdemo_cd_marital_status,
      obt.bill_cdemo_cd_education_status,
      obt.bill_cdemo_cd_purchase_estimate,
      obt.bill_cdemo_cd_credit_rating,
      obt.bill_cdemo_cd_dep_count,
      obt.bill_cdemo_cd_dep_employed_count,
      obt.bill_cdemo_cd_dep_college_count
    ORDER BY
      obt.bill_cdemo_cd_gender,
      obt.bill_cdemo_cd_marital_status,
      obt.bill_cdemo_cd_education_status,
      obt.bill_cdemo_cd_purchase_estimate,
      obt.bill_cdemo_cd_credit_rating,
      obt.bill_cdemo_cd_dep_count,
      obt.bill_cdemo_cd_dep_employed_count,
      obt.bill_cdemo_cd_dep_college_count
    LIMIT 100
- id: 11
  template: query11.tpl
  template_sha256: a0331ea068e9c4fdb7e361d98e8f0febc74df581ce0a84d1075f3c3357a4fc9f
  parameters:
    SELECTONE:
    - 1
    YEAR:
    - 1
  identifier_parameters:
  - SELECTONE
  identifier_map: {}
  sql: |-
    WITH year_total AS (
      SELECT
        obt.bill_customer_c_customer_id AS customer_id,
        obt.bill_customer_c_first_name AS customer_first_name,
        obt.bill_customer_c_last_name AS customer_last_name,
        obt.bill_customer_c_preferred_cust_flag AS customer_preferred_cust_flag,
        obt.bill_customer_c_birth_country AS customer_birth_country,
        obt.bill_customer_c_login AS customer_login,
        obt.bill_customer_c_email_address AS customer_email_address,
        obt.sold_date_d_year AS dyear,
        SUM(obt.ext_list_price - obt.ext_discount_amt) AS year_total,
        's' AS sale_type
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.bill_customer_c_customer_sk = obt.ship_customer_sk
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
        )
        AND channel = 'store'
      GROUP BY
        obt.bill_customer_c_customer_id,
        obt.bill_customer_c_first_name,
        obt.bill_customer_c_last_name,
        obt.bill_customer_c_preferred_cust_flag,
        obt.bill_customer_c_birth_country,
        obt.bill_customer_c_login,
        obt.bill_customer_c_email_address,
        obt.sold_date_d_year
      UNION ALL
      SELECT
        obt.bill_customer_c_customer_id AS customer_id,
        obt.bill_customer_c_first_name AS customer_first_name,
        obt.bill_customer_c_last_name AS customer_last_name,
        obt.bill_customer_c_preferred_cust_flag AS customer_preferred_cust_flag,
        obt.bill_customer_c_birth_country AS customer_birth_country,
        obt.bill_customer_c_login AS customer_login,
        obt.bill_customer_c_email_address AS customer_email_address,
        obt.sold_date_d_year AS dyear,
        SUM(obt.ext_list_price - obt.ext_discount_amt) AS year_total,
        'w' AS sale_type
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.bill_customer_c_customer_sk = obt.bill_customer_sk
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
        )
        AND channel = 'web'
      GROUP BY
        obt.bill_customer_c_customer_id,
        obt.bill_customer_c_first_name,
        obt.bill_customer_c_last_name,
        obt.bill_customer_c_preferred_cust_flag,
        obt.bill_customer_c_birth_country,
        obt.bill_customer_c_login,
        obt.bill_customer_c_email_address,
        obt.sold_date_d_year
    )
    SELECT
      t_s_secyear.customer_id,
      t_s_secyear.customer_first_name,
      t_s_secyear.customer_last_name,
      [SELECTONE]
    FROM year_total AS t_s_firstyear, year_total AS t_s_secyear, year_total AS t_w_firstyear, year_total AS t_w_secyear
    WHERE
      t_s_secyear.customer_id = t_s_firstyear.customer_id
      AND t_s_firstyear.customer_id = t_w_secyear.customer_id
      AND t_s_firstyear.customer_id = t_w_firstyear.customer_id
      AND t_s_firstyear.sale_type = 's'
      AND t_w_firstyear.sale_type = 'w'
      AND t_s_secyear.sale_type = 's'
      AND t_w_secyear.sale_type = 'w'
      AND t_s_firstyear.dyear = [YEAR]
      AND t_s_secyear.dyear = [YEAR] + 1
      AND t_w_firstyear.dyear = [YEAR]
      AND t_w_secyear.dyear = [YEAR] + 1
      AND t_s_firstyear.year_total > 0
      AND t_w_firstyear.year_total > 0
      AND CASE
        WHEN t_w_firstyear.year_total > 0
        THEN t_w_secyear.year_total / t_w_firstyear.year_total
        ELSE 0.0
      END > CASE
        WHEN t_s_firstyear.year_total > 0
        THEN t_s_secyear.year_total / t_s_firstyear.year_total
        ELSE 0.0
      END
    ORDER BY
      t_s_secyear.customer_id,
      t_s_secyear.customer_first_name,
      t_s_secyear.customer_last_name,
      [SELECTONE]
    LIMIT 100
- id: 12
  template: query12.tpl
  template_sha256: 849ee94964441bde85ff32078f3cab3a38d497a5cf2924fca71382e1a16c5a69
  parameters:
    CATEGORY:
    - 1
    - 2
    - 3
    SDATE:
    - 1
    YEAR: []
  sql: |-
    SELECT
      obt.item_i_item_id,
      obt.item_i_item_desc,
      obt.item_i_category,
      obt.item_i_class,
      obt.item_i_current_price,
      SUM(obt.ext_sales_price) AS itemrevenue,
      SUM(obt.ext_sales_price) * 100 / SUM(SUM(obt.ext_sales_price)) OVER (PARTITION BY obt.item_i_class) AS revenueratio
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.item_sk = obt.item_i_item_sk
        AND obt.item_i_category IN ('[CATEGORY]', '[CATEGORY.2]', '[CATEGORY.3]')
        AND obt.sold_date_sk = obt.sold_date_d_date_sk
        AND obt.sold_date_d_date BETWEEN CAST('[SDATE]' AS DATE) AND (
          CAST('[SDATE]' AS DATE) + INTERVAL 30 DAY
        )
      )
      AND channel = 'web'
    GROUP BY
      obt.item_i_item_id,
      obt.item_i_item_desc,
      obt.item_i_category,
      obt.item_i_class,
      obt.item_i_current_price
    ORDER BY
      obt.item_i_category,
      obt.item_i_class,
      obt.item_i_item_id,
      obt.item_i_item_desc,
      revenueratio
    LIMIT 100
- id: 13
  template: query13.tpl
  template_sha256: 2647cff4eaa10d5bf26900b049861d306bd53a7ae58faa89e905d488f1da6f5a
  parameters:
    ES:
    - 1
    - 2
    - 3
    MS:
    - 1
    - 2
    - 3
    STATE:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    - 9
  sql: |-
    SELECT
      AVG(obt.quantity),
      AVG(obt.ext_sales_price),
      AVG(obt.ext_wholesale_cost),
      SUM(obt.ext_wholesale_cost)
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.store_s_store_sk = obt.store_sk
        AND obt.sold_date_sk = obt.sold_date_d_date_sk
        AND obt.sold_date_d_year = 2001
        AND (
          (
            obt.ship_hdemo_sk = obt.bill_hdemo_hd_demo_sk
            AND obt.bill_cdemo_cd_demo_sk = obt.ship_cdemo_sk
            AND obt.bill_cdemo_cd_marital_status = '[MS]'
            AND obt.bill_cdemo_cd_education_status = '[ES]'
            AND obt.sales_price BETWEEN 100.00 AND 150.00
            AND obt.bill_hdemo_hd_dep_count = 3
          )
          OR (
            obt.ship_hdemo_sk = obt.bill_hdemo_hd_demo_sk
            AND obt.bill_cdemo_cd_demo_sk = obt.ship_cdemo_sk
            AND obt.bill_cdemo_cd_marital_status = '[MS.2]'
            AND obt.bill_cdemo_cd_education_status = '[ES.2]'
            AND obt.sales_price BETWEEN 50.00 AND 100.00
            AND obt.bill_hdemo_hd_dep_count = 1
          )
          OR (
            obt.ship_hdemo_sk = obt.bill_hdemo_hd_demo_sk
            AND obt.bill_cdemo_cd_demo_sk = obt.ship_cdemo_sk
            AND obt.bill_cdemo_cd_marital_status = '[MS.3]'
            AND obt.bill_cdemo_cd_education_status = '[ES.3]'
            AND obt.sales_price BETWEEN 150.00 AND 200.00
            AND obt.bill_hdemo_hd_dep_count = 1
          )
        )
        AND (
          (
            obt.ship_addr_sk = obt.bill_addr_ca_address_sk
            AND obt.bill_addr_ca_country = 'United States'
            AND obt.bill_addr_ca_state IN ('[STATE]', '[STATE.2]', '[STATE.3]')
            AND obt.net_profit BETWEEN 100 AND 200
          )
          OR (
            obt.ship_addr_sk = obt.bill_addr_ca_address_sk
            AND obt.bill_addr_ca_country = 'United States'
            AND obt.bill_addr_ca_state IN ('[STATE.4]', '[STATE.5]', '[STATE.6]')
            AND obt.net_profit BETWEEN 150 AND 300
          )
          OR (
            obt.ship_addr_sk = obt.bill_addr_ca_address_sk
            AND obt.bill_addr_ca_country = 'United States'
            AND obt.bill_addr_ca_state IN ('[STATE.7]', '[STATE.8]', '[STATE.9]')
            AND obt.net_profit BETWEEN 50 AND 250
          )
        )
      )
      AND channel = 'store'
- id: 14
  template: query14.tpl
  template_sha256: a550cd5c5a82a8cd6fed17380bed8cf2069c3e9e52d5e7a2349a811fb533ff5e
  parameters:
    YEAR:
    - 1
  sql: |
    WITH cross_items AS (
      SELECT
        item_i_item_sk,
        item_i_brand_id,
        item_i_class_id,
        item_i_category_id
      FROM (
        SELECT
          item_i_item_sk,
          item_i_brand_id,
          item_i_class_id,
          item_i_category_id,
          channel
        FROM tpcds_sales_returns_obt
        WHERE sold_date_d_year BETWEEN [YEAR] AND [YEAR] + 2
        GROUP BY item_i_item_sk, item_i_brand_id, item_i_class_id, item_i_category_id, channel
      ) items_by_channel
      GROUP BY item_i_item_sk, item_i_brand_id, item_i_class_id, item_i_category_id
      HAVING COUNT(DISTINCT channel) = 3
    ),
    avg_sales AS (
      SELECT AVG(quantity * list_price) AS average_sales
      FROM tpcds_sales_returns_obt
      WHERE sold_date_d_year BETWEEN [YEAR] AND [YEAR] + 2
    )
    SELECT
      channel,
      i_brand_id,
      i_class_id,
      i_category_id,
      SUM(sales),
      SUM(number_sales)
    FROM (
      SELECT
        channel,
        item_i_brand_id AS i_brand_id,
        item_i_class_id AS i_class_id,
        item_i_category_id AS i_category_id,
        SUM(quantity * list_price) AS sales,
        COUNT(*) AS number_sales
      FROM tpcds_sales_returns_obt
      WHERE item_sk IN (SELECT item_i_item_sk FROM cross_items)
        AND sold_date_d_year = [YEAR] + 2
        AND sold_date_d_moy = 11
      GROUP BY channel, item_i_brand_id, item_i_class_id, item_i_category_id
      HAVING SUM(quantity * list_price) > (SELECT average_sales FROM avg_sales)
    ) y
    GROUP BY ROLLUP (channel, i_brand_id, i_class_id, i_category_id)
    ORDER BY channel, i_brand_id, i_class_id, i_category_id
    LIMIT 100
- id: 15
  template: query15.tpl
  template_sha256: 9d39dbdeffa56ea3722870bee703d5bd2293343de4e8431a8daef62ffb83bc57
  parameters:
    QOY:
    - 1
    YEAR:
    - 1
  sql: |-
    SELECT
      obt.bill_addr_ca_zip,
      SUM(obt.sales_price)
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.bill_customer_sk = obt.bill_customer_c_customer_sk
        AND (
          SUBSTRING(obt.bill_addr_ca_zip, 1, 5) IN ('85669', '86197', '88274', '83405', '86475', '85392', '85460', '80348', '81792')
          OR obt.bill_addr_ca_state IN ('CA', 'WA', 'GA')
          OR obt.sales_price > 500
        )
        AND obt.sold_date_sk = obt.sold_date_d_date_sk
        AND obt.sold_date_d_qoy = [QOY]
        AND obt.sold_date_d_year = [YEAR]
      )
      AND channel = 'catalog'
    GROUP BY
      obt.bill_addr_ca_zip
    ORDER BY
      obt.bill_addr_ca_zip
    LIMIT 100
- id: 16
  template: query16.tpl
  template_sha256: 59113489221207907f33d4a86834aa3e279debc5471bb903a178583b5b6df4b0
  parameters:
    COUNTYNUMBER: []
    COUNTY_A:
    - 1
    COUNTY_B:
    - 1
    COUNTY_C:
    - 1
    COUNTY_D:
    - 1
    COUNTY_E:
    - 1
    MONTH:
    - 1
    STATE:
    - 1
    YEAR:
    - 1
  sql: |-
    SELECT
      COUNT(DISTINCT obt.sale_id) AS "order count",
      SUM(obt.ext_ship_cost) AS "total shipping cost",
      SUM(obt.net_profit) AS "total net profit"
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.ship_date_d_date BETWEEN '[YEAR]-[MONTH]-01' AND (
          CAST('[YEAR]-[MONTH]-01' AS DATE) + INTERVAL 60 DAY
        )
        AND obt.ship_date_sk = obt.ship_date_d_date_sk
        AND obt.ship_addr_sk = obt.ship_addr_ca_address_sk
        AND obt.ship_addr_ca_state = '[STATE]'
        AND obt.call_center_sk = obt.call_center_cc_call_center_sk
        AND obt.call_center_cc_county IN ('[COUNTY_A]', '[COUNTY_B]', '[COUNTY_C]', '[COUNTY_D]', '[COUNTY_E]')
        AND EXISTS(
          SELECT
            *
          FROM tpcds_sales_returns_obt AS other_obt WHERE ( other_obt.sale_id = obt.sale_id AND other_obt.warehouse_sk <> obt.warehouse_sk ) AND other_obt.channel = 'catalog'
        )
        AND NOT EXISTS(
          SELECT
            *
          FROM tpcds_sales_returns_obt AS ret_obt WHERE ret_obt.sale_id = obt.sale_id AND ret_obt.has_return = 'Y' AND ret_obt.channel = 'catalog'
        )
      )
      AND channel = 'catalog'
    ORDER BY
      COUNT(DISTINCT obt.sale_id)
    LIMIT 100
- id: 17
  template: query17.tpl
  template_sha256: 44a9f3c81f4dc60cef26511c05630b8c289ae0c1be7c5dba37e1e9ff85f12448
  parameters:
    YEAR:
    - 1
  sql: |-
    SELECT
      obt.item_i_item_id,
      obt.item_i_item_desc,
      obt.store_s_state,
      COUNT(obt.quantity) AS store_sales_quantitycount,
      AVG(obt.quantity) AS store_sales_quantityave,
      STDDEV_SAMP(obt.quantity) AS store_sales_quantitystdev,
      STDDEV_SAMP(obt.quantity) / AVG(obt.quantity) AS store_sales_quantitycov,
      COUNT(obt.return_quantity) AS store_returns_quantitycount,
      AVG(obt.return_quantity) AS store_returns_quantityave,
      STDDEV_SAMP(obt.return_quantity) AS store_returns_quantitystdev,
      STDDEV_SAMP(obt.return_quantity) / AVG(obt.return_quantity) AS store_returns_quantitycov,
      COUNT(obt.quantity) AS catalog_sales_quantitycount,
      AVG(obt.quantity) AS catalog_sales_quantityave,
      STDDEV_SAMP(obt.quantity) AS catalog_sales_quantitystdev,
      STDDEV_SAMP(obt.quantity) / AVG(obt.quantity) AS catalog_sales_quantitycov
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.sold_date_d_quarter_name = '[YEAR]Q1'
        AND obt.sold_date_d_date_sk = obt.sold_date_sk
        AND obt.item_i_item_sk = obt.item_sk
        AND obt.store_s_store_sk = obt.store_sk
        AND obt.ship_customer_sk = obt.returning_customer_c_customer_sk
        AND obt.item_sk = obt.item_sk
        AND obt.sale_id = obt.sale_id
        AND obt.returned_date_sk = obt.return_date_d_date_sk
        AND obt.return_date_d_quarter_name IN ('[YEAR]Q1', '[YEAR]Q2', '[YEAR]Q3')
        AND obt.returning_customer_c_customer_sk = obt.bill_customer_sk
        AND obt.item_sk = obt.item_sk
        AND obt.sold_date_sk = obt.sold_date_d_date_sk
        AND obt.sold_date_d_quarter_name IN ('[YEAR]Q1', '[YEAR]Q2', '[YEAR]Q3')
      )
      AND channel IN ('catalog', 'store')
    GROUP BY
      obt.item_i_item_id,
      obt.item_i_item_desc,
      obt.store_s_state
    ORDER BY
      obt.item_i_item_id,
      obt.item_i_item_desc,
      obt.store_s_state
    LIMIT 100
- id: 18
  template: query18.tpl
  template_sha256: 5a09294922e9690fb47aff91cb9c0eb43d64a713f05110c93336409364fae11b
  parameters:
    ES:
    - 1
    GEN:
    - 1
    MONTH:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    STATE:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    YEAR:
    - 1
  sql: |-
    SELECT
      obt.item_i_item_id,
      obt.bill_addr_ca_country,
      obt.bill_addr_ca_state,
      obt.bill_addr_ca_county,
      AVG(CAST(obt.quantity AS DECIMAL(12, 2))) AS agg1,
      AVG(CAST(obt.list_price AS DECIMAL(12, 2))) AS agg2,
      AVG(CAST(obt.coupon_amt AS DECIMAL(12, 2))) AS agg3,
      AVG(CAST(obt.sales_price AS DECIMAL(12, 2))) AS agg4,
      AVG(CAST(obt.net_profit AS DECIMAL(12, 2))) AS agg5,
      AVG(CAST(obt.bill_customer_c_birth_year AS DECIMAL(12, 2))) AS agg6,
      AVG(CAST(obt.bill_cdemo_cd_dep_count AS DECIMAL(12, 2))) AS agg7
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.sold_date_sk = obt.sold_date_d_date_sk
        AND obt.item_sk = obt.item_i_item_sk
        AND obt.bill_cdemo_sk = obt.bill_cdemo_cd_demo_sk
        AND obt.bill_customer_sk = obt.bill_customer_c_customer_sk
        AND obt.bill_cdemo_cd_gender = '[GEN]'
        AND obt.bill_cdemo_cd_education_status = '[ES]'
        AND obt.bill_customer_c_birth_month IN ([MONTH], [MONTH.2], [MONTH.3], [MONTH.4], [MONTH.5], [MONTH.6])
        AND obt.sold_date_d_year = [YEAR]
        AND obt.bill_addr_ca_state IN ('[STATE]', '[STATE.2]', '[STATE.3]', '[STATE.4]', '[STATE.5]', '[STATE.6]', '[STATE.7]')
      )
      AND channel = 'catalog'
    GROUP BY
      ROLLUP (
        obt.item_i_item_id,
        obt.bill_addr_ca_country,
        obt.bill_addr_ca_state,
        obt.bill_addr_ca_county
      )
    ORDER BY
      obt.bill_addr_ca_country,
      obt.bill_addr_ca_state,
      obt.bill_addr_ca_county,
      obt.item_i_item_id
    LIMIT 100
- id: 19
  template: query19.tpl
  template_sha256: 6299dfd107bebd87ac64010843801996efedd99605efd78a4b11d1f8b9e976f3
  parameters:
    MANAGER:
    - 1
    MGR_IDX: []
    MONTH:
    - 1
    YEAR:
    - 1
  sql: |-
    SELECT
      obt.item_i_brand_id AS brand_id,
      obt.item_i_brand AS brand,
      obt.item_i_manufact_id,
      obt.item_i_manufact,
      SUM(obt.ext_sales_price) AS ext_price
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.sold_date_d_date_sk = obt.sold_date_sk
        AND obt.item_sk = obt.item_i_item_sk
        AND obt.item_i_manager_id = [MANAGER]
        AND obt.sold_date_d_moy = [MONTH]
        AND obt.sold_date_d_year = [YEAR]
        AND obt.ship_customer_sk = obt.bill_customer_c_customer_sk
        AND SUBSTRING(obt.bill_addr_ca_zip, 1, 5) <> SUBSTRING(obt.store_s_zip, 1, 5)
        AND obt.store_sk = obt.store_s_store_sk
      )
      AND channel = 'store'
    GROUP BY
      obt.item_i_brand,
      obt.item_i_brand_id,
      obt.item_i_manufact_id,
      obt.item_i_manufact
    ORDER BY
      ext_price DESC NULLS FIRST,
      obt.item_i_brand,
      obt.item_i_brand_id,
      obt.item_i_manufact_id,
      obt.item_i_manufact
    LIMIT 100
- id: 20
  template: query20.tpl
  template_sha256: 7e0bc5bc02a305c4c8527711a965e5f419e728b4e76684349456e8d7225e68c9
  parameters:
    CATEGORY:
    - 1
    - 2
    - 3
    SDATE:
    - 1
    YEAR: []
  sql: |-
    SELECT
      obt.item_i_item_id,
      obt.item_i_item_desc,
      obt.item_i_category,
      obt.item_i_class,
      obt.item_i_current_price,
      SUM(obt.ext_sales_price) AS itemrevenue,
      SUM(obt.ext_sales_price) * 100 / SUM(SUM(obt.ext_sales_price)) OVER (PARTITION BY obt.item_i_class) AS revenueratio
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.item_sk = obt.item_i_item_sk
        AND obt.item_i_category IN ('[CATEGORY]', '[CATEGORY.2]', '[CATEGORY.3]')
        AND obt.sold_date_sk = obt.sold_date_d_date_sk
        AND obt.sold_date_d_date BETWEEN CAST('[SDATE]' AS DATE) AND (
          CAST('[SDATE]' AS DATE) + INTERVAL 30 DAY
        )
      )
      AND channel = 'catalog'
    GROUP BY
      obt.item_i_item_id,
      obt.item_i_item_desc,
      obt.item_i_category,
      obt.item_i_class,
      obt.item_i_current_price
    ORDER BY
      obt.item_i_category,
      obt.item_i_class,
      obt.item_i_item_id,
      obt.item_i_item_desc,
      revenueratio
    LIMIT 100
- id: 23
  template: query23.tpl
  template_sha256: 80c7baff33b3ecfc90316ba7d89cf098cdb3e9deb77a62ade5109347909ee3e0
  parameters:
    MONTH:
    - 1
    TOPPERCENT:
    - 1
    YEAR:
    - 1
  sql: |-
    WITH frequent_ss_items AS (
      SELECT
        SUBSTRING(obt.item_i_item_desc, 1, 30) AS itemdesc,
        obt.item_i_item_sk AS item_sk,
        obt.sold_date_d_date AS solddate,
        COUNT(*) AS cnt
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.item_sk = obt.item_i_item_sk
          AND obt.sold_date_d_year IN ([YEAR], [YEAR] + 1, [YEAR] + 2, [YEAR] + 3)
        )
        AND channel = 'store'
      GROUP BY
        SUBSTRING(obt.item_i_item_desc, 1, 30),
        obt.item_i_item_sk,
        obt.sold_date_d_date
      HAVING
        COUNT(*) > 4
    ), max_store_sales AS (
      SELECT
        MAX(csales) AS tpcds_cmax
      FROM (
        SELECT
          obt.bill_customer_c_customer_sk,
          SUM(obt.quantity * obt.sales_price) AS csales
        FROM tpcds_sales_returns_obt AS obt
        WHERE
          (
            obt.ship_customer_sk = obt.bill_customer_c_customer_sk
            AND obt.sold_date_sk = obt.sold_date_d_date_sk
            AND obt.sold_date_d_year IN ([YEAR], [YEAR] + 1, [YEAR] + 2, [YEAR] + 3)
          )
          AND channel = 'store'
        GROUP BY
          obt.bill_customer_c_customer_sk
      )
    ), best_ss_customer AS (
      SELECT
        obt.bill_customer_c_customer_sk,
        SUM(obt.quantity * obt.sales_price) AS ssales
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        obt.ship_customer_sk = obt.bill_customer_c_customer_sk AND channel = 'store'
      GROUP BY
        obt.bill_customer_c_customer_sk
      HAVING
        SUM(obt.quantity * obt.sales_price) > (
          [TOPPERCENT] / 100.0
        ) * (
          SELECT
            *
          FROM max_store_sales
        )
    )
    SELECT
      SUM(sales)
    FROM (
      SELECT
        obt.quantity * obt.list_price AS sales
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sold_date_d_year = [YEAR]
          AND obt.sold_date_d_moy = [MONTH]
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.item_sk IN (
            SELECT
              item_sk
            FROM frequent_ss_items
          )
          AND obt.bill_customer_sk IN (
            SELECT
              bill_customer_c_customer_sk
            FROM best_ss_customer
          )
        )
        AND channel = 'catalog'
      UNION ALL
      SELECT
        obt.quantity * obt.list_price AS sales
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sold_date_d_year = [YEAR]
          AND obt.sold_date_d_moy = [MONTH]
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.item_sk IN (
            SELECT
              item_sk
            FROM frequent_ss_items
          )
          AND obt.bill_customer_sk IN (
            SELECT
              bill_customer_c_customer_sk
            FROM best_ss_customer
          )
        )
        AND channel = 'web'
    )
    LIMIT 100; WITH frequent_ss_items AS (
      SELECT
        SUBSTRING(obt.item_i_item_desc, 1, 30) AS itemdesc,
        obt.item_i_item_sk AS item_sk,
        obt.sold_date_d_date AS solddate,
        COUNT(*) AS cnt
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.item_sk = obt.item_i_item_sk
          AND obt.sold_date_d_year IN ([YEAR], [YEAR] + 1, [YEAR] + 2, [YEAR] + 3)
        )
        AND channel = 'store'
      GROUP BY
        SUBSTRING(obt.item_i_item_desc, 1, 30),
        obt.item_i_item_sk,
        obt.sold_date_d_date
      HAVING
        COUNT(*) > 4
    ), max_store_sales AS (
      SELECT
        MAX(csales) AS tpcds_cmax
      FROM (
        SELECT
          obt.bill_customer_c_customer_sk,
          SUM(obt.quantity * obt.sales_price) AS csales
        FROM tpcds_sales_returns_obt AS obt
        WHERE
          (
            obt.ship_customer_sk = obt.bill_customer_c_customer_sk
            AND obt.sold_date_sk = obt.sold_date_d_date_sk
            AND obt.sold_date_d_year IN ([YEAR], [YEAR] + 1, [YEAR] + 2, [YEAR] + 3)
          )
          AND channel = 'store'
        GROUP BY
          obt.bill_customer_c_customer_sk
      )
    ), best_ss_customer AS (
      SELECT
        obt.bill_customer_c_customer_sk,
        SUM(obt.quantity * obt.sales_price) AS ssales
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        obt.ship_customer_sk = obt.bill_customer_c_customer_sk AND channel = 'store'
      GROUP BY
        obt.bill_customer_c_customer_sk
      HAVING
        SUM(obt.quantity * obt.sales_price) > (
          [TOPPERCENT] / 100.0
        ) * (
          SELECT
            *
          FROM max_store_sales
        )
    )
    SELECT
      bill_customer_c_last_name,
      bill_customer_c_first_name,
      sales
    FROM (
      SELECT
        obt.bill_customer_c_last_name,
        obt.bill_customer_c_first_name,
        SUM(obt.quantity * obt.list_price) AS sales
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sold_date_d_year = [YEAR]
          AND obt.sold_date_d_moy = [MONTH]
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.item_sk IN (
            SELECT
              item_sk
            FROM frequent_ss_items
          )
          AND obt.bill_customer_sk IN (
            SELECT
              bill_customer_c_customer_sk
            FROM best_ss_customer
          )
          AND obt.bill_customer_sk = obt.bill_customer_c_customer_sk
        )
        AND channel = 'catalog'
      GROUP BY
        obt.bill_customer_c_last_name,
        obt.bill_customer_c_first_name
      UNION ALL
      SELECT
        obt.bill_customer_c_last_name,
        obt.bill_customer_c_first_name,
        SUM(obt.quantity * obt.list_price) AS sales
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sold_date_d_year = [YEAR]
          AND obt.sold_date_d_moy = [MONTH]
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.item_sk IN (
            SELECT
              item_sk
            FROM frequent_ss_items
          )
          AND obt.bill_customer_sk IN (
            SELECT
              bill_customer_c_customer_sk
            FROM best_ss_customer
          )
          AND obt.bill_customer_sk = obt.bill_customer_c_customer_sk
        )
        AND channel = 'web'
      GROUP BY
        obt.bill_customer_c_last_name,
        obt.bill_customer_c_first_name
    )
    ORDER BY
      bill_customer_c_last_name,
      bill_customer_c_first_name,
      sales
    LIMIT 100
- id: 24
  template: query24.tpl
  template_sha256: 71ffb0e79f9525988a211da2b1a321f61a01ea025b34717a657cf95d278714f4
  parameters:
    AMOUNTONE:
    - 1
    COLOR:
    - 1
    - 2
    MARKET:
    - 1
  identifier_parameters:
  - AMOUNTONE
  identifier_map:
    ss_ext_sales_price: ext_sales_price
    ss_net_paid: net_paid
    ss_net_paid_inc_tax: net_paid_inc_tax
    ss_net_profit: net_profit
    ss_sales_price: sales_price
  sql: |-
    WITH ssales AS (
      SELECT
        obt.bill_customer_c_last_name,
        obt.bill_customer_c_first_name,
        obt.store_s_store_name,
        obt.bill_addr_ca_state,
        obt.store_s_state,
        obt.item_i_color,
        obt.item_i_current_price,
        obt.item_i_manager_id,
        obt.item_i_units,
        obt.item_i_size,
        SUM([AMOUNTONE]) AS netpaid
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sale_id = obt.sale_id
          AND obt.item_sk = obt.item_sk
          AND obt.ship_customer_sk = obt.bill_customer_c_customer_sk
          AND obt.item_sk = obt.item_i_item_sk
          AND obt.store_sk = obt.store_s_store_sk
          AND obt.bill_customer_c_birth_country <> UPPER(obt.bill_addr_ca_country)
          AND obt.store_s_zip = obt.bill_addr_ca_zip
          AND obt.store_s_market_id = [MARKET]
        )
        AND channel = 'store'
      GROUP BY
        obt.bill_customer_c_last_name,
        obt.bill_customer_c_first_name,
        obt.store_s_store_name,
        obt.bill_addr_ca_state,
        obt.store_s_state,
        obt.item_i_color,
        obt.item_i_current_price,
        obt.item_i_manager_id,
        obt.item_i_units,
        obt.item_i_size
    )
    SELECT
      bill_customer_c_last_name,
      bill_customer_c_first_name,
      store_s_store_name,
      SUM(netpaid) AS paid
    FROM ssales
    WHERE
      item_i_color = '[COLOR]'
    GROUP BY
      bill_customer_c_last_name,
      bill_customer_c_first_name,
      store_s_store_name
    HAVING
      SUM(netpaid) > (
        SELECT
          0.05 * AVG(netpaid)
        FROM ssales
      )
    ORDER BY
      bill_customer_c_last_name,
      bill_customer_c_first_name,
      store_s_store_name; WITH ssales AS (
      SELECT
        obt.bill_customer_c_last_name,
        obt.bill_customer_c_first_name,
        obt.store_s_store_name,
        obt.bill_addr_ca_state,
        obt.store_s_state,
        obt.item_i_color,
        obt.item_i_current_price,
        obt.item_i_manager_id,
        obt.item_i_units,
        obt.item_i_size,
        SUM([AMOUNTONE]) AS netpaid
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sale_id = obt.sale_id
          AND obt.item_sk = obt.item_sk
          AND obt.ship_customer_sk = obt.bill_customer_c_customer_sk
          AND obt.item_sk = obt.item_i_item_sk
          AND obt.store_sk = obt.store_s_store_sk
          AND obt.bill_customer_c_birth_country <> UPPER(obt.bill_addr_ca_country)
          AND obt.store_s_zip = obt.bill_addr_ca_zip
          AND obt.store_s_market_id = [MARKET]
        )
        AND channel = 'store'
      GROUP BY
        obt.bill_customer_c_last_name,
        obt.bill_customer_c_first_name,
        obt.store_s_store_name,
        obt.bill_addr_ca_state,
        obt.store_s_state,
        obt.item_i_color,
        obt.item_i_current_price,
        obt.item_i_manager_id,
        obt.item_i_units,
        obt.item_i_size
    )
    SELECT
      bill_customer_c_last_name,
      bill_customer_c_first_name,
      store_s_store_name,
      SUM(netpaid) AS paid
    FROM ssales
    WHERE
      item_i_color = '[COLOR.2]'
    GROUP BY
      bill_customer_c_last_name,
      bill_customer_c_first_name,
      store_s_store_name
    HAVING
      SUM(netpaid) > (
        SELECT
          0.05 * AVG(netpaid)
        FROM ssales
      )
    ORDER BY
      bill_customer_c_last_name,
      bill_customer_c_first_name,
      store_s_store_name
- id: 25
  template: query25.tpl
  template_sha256: e5115ba519ea8befb701bf5bbd7043c3df2f0bc6b01a42be788c2aaa471edef2
  parameters:
    AGG:
    - 1
    YEAR:
    - 1
  identifier_parameters:
  - AGG
  identifier_map: {}
  sql: |-
    SELECT
      obt.item_i_item_id,
      obt.item_i_item_desc,
      obt.store_s_store_id,
      obt.store_s_store_name,
      [AGG](obt.net_profit) AS store_sales_profit,
      [AGG](obt.return_net_loss) AS store_returns_loss,
      [AGG](obt.net_profit) AS catalog_sales_profit
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.sold_date_d_moy = 4
        AND obt.sold_date_d_year = [YEAR]
        AND obt.sold_date_d_date_sk = obt.sold_date_sk
        AND obt.item_i_item_sk = obt.item_sk
        AND obt.store_s_store_sk = obt.store_sk
        AND obt.ship_customer_sk = obt.returning_customer_c_customer_sk
        AND obt.item_sk = obt.item_sk
        AND obt.sale_id = obt.sale_id
        AND obt.returned_date_sk = obt.return_date_d_date_sk
        AND obt.return_date_d_moy BETWEEN 4 AND 10
        AND obt.return_date_d_year = [YEAR]
        AND obt.returning_customer_c_customer_sk = obt.bill_customer_sk
        AND obt.item_sk = obt.item_sk
        AND obt.sold_date_sk = obt.sold_date_d_date_sk
        AND obt.sold_date_d_moy BETWEEN 4 AND 10
        AND obt.sold_date_d_year = [YEAR]
      )
      AND channel IN ('catalog', 'store')
    GROUP BY
      obt.item_i_item_id,
      obt.item_i_item_desc,
      obt.store_s_store_id,
      obt.store_s_store_name
    ORDER BY
      obt.item_i_item_id,
      obt.item_i_item_desc,
      obt.store_s_store_id,
      obt.store_s_store_name
    LIMIT 100
- id: 26
  template: query26.tpl
  template_sha256: 74bb32512a2c4f8eb11617e50f0441cfe9a1e4e82051e52118df07452af3d2b3
  parameters:
    ES:
    - 1
    GEN:
    - 1
    MS:
    - 1
    YEAR:
    - 1
  sql: |-
    SELECT
      obt.item_i_item_id,
      AVG(obt.quantity) AS agg1,
      AVG(obt.list_price) AS agg2,
      AVG(obt.coupon_amt) AS agg3,
      AVG(obt.sales_price) AS agg4
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.sold_date_sk = obt.sold_date_d_date_sk
        AND obt.item_sk = obt.item_i_item_sk
        AND obt.bill_cdemo_sk = obt.bill_cdemo_cd_demo_sk
        AND obt.promo_sk = obt.promo_p_promo_sk
        AND obt.bill_cdemo_cd_gender = '[GEN]'
        AND obt.bill_cdemo_cd_marital_status = '[MS]'
        AND obt.bill_cdemo_cd_education_status = '[ES]'
        AND (
          obt.promo_p_channel_email = 'N' OR obt.promo_p_channel_event = 'N'
        )
        AND obt.sold_date_d_year = [YEAR]
      )
      AND channel = 'catalog'
    GROUP BY
      obt.item_i_item_id
    ORDER BY
      obt.item_i_item_id
    LIMIT 100
- id: 27
  template: query27.tpl
  template_sha256: 08af4b80c1efc52572ff8799a7abfc7c071e5dc3d96b689cfdeeee34b6ae47d6
  parameters:
    ES:
    - 1
    GEN:
    - 1
    MS:
    - 1
    STATENUMBER: []
    STATE_A:
    - 1
    STATE_B:
    - 1
    STATE_C:
    - 1
    STATE_D:
    - 1
    STATE_E:
    - 1
    STATE_F:
    - 1
    YEAR:
    - 1
  sql: |-
    SELECT
      obt.item_i_item_id,
      obt.store_s_state,
      GROUPING(obt.store_s_state) AS g_state,
      AVG(obt.quantity) AS agg1,
      AVG(obt.list_price) AS agg2,
      AVG(obt.coupon_amt) AS agg3,
      AVG(obt.sales_price) AS agg4
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.sold_date_sk = obt.sold_date_d_date_sk
        AND obt.item_sk = obt.item_i_item_sk
        AND obt.store_sk = obt.store_s_store_sk
        AND obt.ship_cdemo_sk = obt.bill_cdemo_cd_demo_sk
        AND obt.bill_cdemo_cd_gender = '[GEN]'
        AND obt.bill_cdemo_cd_marital_status = '[MS]'
        AND obt.bill_cdemo_cd_education_status = '[ES]'
        AND obt.sold_date_d_year = [YEAR]
        AND obt.store_s_state IN ('[STATE_A]', '[STATE_B]', '[STATE_C]', '[STATE_D]', '[STATE_E]', '[STATE_F]')
      )
      AND channel = 'store'
    GROUP BY
      ROLLUP (
        obt.item_i_item_id,
        obt.store_s_state
      )
    ORDER BY
      obt.item_i_item_id,
      obt.store_s_state
    LIMIT 100
- id: 28
  template: query28.tpl
  template_sha256: 33ca27ebc07a8f4d624eae0089d6b6907f26422818426a4ea21841ea32ede987
  parameters:
    COUPONAMT:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    LISTPRICE:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    WHOLESALECOST:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
  sql: |-
    SELECT
      *
    FROM (
      SELECT
        AVG(obt.list_price) AS B1_LP,
        COUNT(obt.list_price) AS B1_CNT,
        COUNT(DISTINCT obt.list_price) AS B1_CNTD
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.quantity BETWEEN 0 AND 5
          AND (
            obt.list_price BETWEEN [LISTPRICE] AND [LISTPRICE] + 10
            OR obt.coupon_amt BETWEEN [COUPONAMT] AND [COUPONAMT] + 1000
            OR obt.wholesale_cost BETWEEN [WHOLESALECOST] AND [WHOLESALECOST] + 20
          )
        )
        AND channel = 'store'
    ) AS B1, (
      SELECT
        AVG(obt.list_price) AS B2_LP,
        COUNT(obt.list_price) AS B2_CNT,
        COUNT(DISTINCT obt.list_price) AS B2_CNTD
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.quantity BETWEEN 6 AND 10
          AND (
            obt.list_price BETWEEN [LISTPRICE.2] AND [LISTPRICE.2] + 10
            OR obt.coupon_amt BETWEEN [COUPONAMT.2] AND [COUPONAMT.2] + 1000
            OR obt.wholesale_cost BETWEEN [WHOLESALECOST.2] AND [WHOLESALECOST.2] + 20
          )
        )
        AND channel = 'store'
    ) AS B2, (
      SELECT
        AVG(obt.list_price) AS B3_LP,
        COUNT(obt.list_price) AS B3_CNT,
        COUNT(DISTINCT obt.list_price) AS B3_CNTD
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.quantity BETWEEN 11 AND 15
          AND (
            obt.list_price BETWEEN [LISTPRICE.3] AND [LISTPRICE.3] + 10
            OR obt.coupon_amt BETWEEN [COUPONAMT.3] AND [COUPONAMT.3] + 1000
            OR obt.wholesale_cost BETWEEN [WHOLESALECOST.3] AND [WHOLESALECOST.3] + 20
          )
        )
        AND channel = 'store'
    ) AS B3, (
      SELECT
        AVG(obt.list_price) AS B4_LP,
        COUNT(obt.list_price) AS B4_CNT,
        COUNT(DISTINCT obt.list_price) AS B4_CNTD
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.quantity BETWEEN 16 AND 20
          AND (
            obt.list_price BETWEEN [LISTPRICE.4] AND [LISTPRICE.4] + 10
            OR obt.coupon_amt BETWEEN [COUPONAMT.4] AND [COUPONAMT.4] + 1000
            OR obt.wholesale_cost BETWEEN [WHOLESALECOST.4] AND [WHOLESALECOST.4] + 20
          )
        )
        AND channel = 'store'
    ) AS B4, (
      SELECT
        AVG(obt.list_price) AS B5_LP,
        COUNT(obt.list_price) AS B5_CNT,
        COUNT(DISTINCT obt.list_price) AS B5_CNTD
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.quantity BETWEEN 21 AND 25
          AND (
            obt.list_price BETWEEN [LISTPRICE.5] AND [LISTPRICE.5] + 10
            OR obt.coupon_amt BETWEEN [COUPONAMT.5] AND [COUPONAMT.5] + 1000
            OR obt.wholesale_cost BETWEEN [WHOLESALECOST.5] AND [WHOLESALECOST.5] + 20
          )
        )
        AND channel = 'store'
    ) AS B5, (
      SELECT
        AVG(obt.list_price) AS B6_LP,
        COUNT(obt.list_price) AS B6_CNT,
        COUNT(DISTINCT obt.list_price) AS B6_CNTD
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.quantity BETWEEN 26 AND 30
          AND (
            obt.list_price BETWEEN [LISTPRICE.6] AND [LISTPRICE.6] + 10
            OR obt.coupon_amt BETWEEN [COUPONAMT.6] AND [COUPONAMT.6] + 1000
            OR obt.wholesale_cost BETWEEN [WHOLESALECOST.6] AND [WHOLESALECOST.6] + 20
          )
        )
        AND channel = 'store'
    ) AS B6
    LIMIT 100
- id: 29
  template: query29.tpl
  template_sha256: 84fb042f9acaa59efaf2df09752745844c95854098161e612e133e7aaaf8593c
  parameters:
    AGG:
    - 1
    MONTH:
    - 1
    YEAR:
