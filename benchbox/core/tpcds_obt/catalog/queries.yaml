version: 1
queries:
- id: 1
  template: query1.tpl
  template_sha256: 43bd12704315f45866976de974e809c5371734d8dfe2a04f3ba0c1384350ecf7
  parameters:
    AGG_FIELD:
    - 1
    COUNTY: []
    STATE:
    - 1
    YEAR:
    - 1
  identifier_parameters:
  - AGG_FIELD
  identifier_map:
    sr_fee: return_fee
    sr_refunded_cash: refunded_cash
    sr_return_amt: return_amount
    sr_return_amt_inc_tax: return_amount_inc_tax
    sr_return_tax: return_tax
    sr_reversed_charge: reversed_charge
    sr_store_credit: store_credit
  sql: |-
    WITH customer_total_return AS (
      SELECT
        obt.returning_customer_c_customer_sk AS ctr_customer_sk,
        obt.store_sk AS ctr_store_sk,
        SUM([AGG_FIELD]) AS ctr_total_return
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.returned_date_sk = obt.return_date_d_date_sk
          AND obt.return_date_d_year = [YEAR]
        )
        AND channel = 'store'
      GROUP BY
        obt.returning_customer_c_customer_sk,
        obt.store_sk
    )
    SELECT
      obt.bill_customer_c_customer_id
    FROM tpcds_sales_returns_obt AS obt
    CROSS JOIN customer_total_return AS ctr1
    WHERE
      (
        ctr1.ctr_total_return > (
          SELECT
            AVG(ctr_total_return) * 1.2
          FROM customer_total_return AS ctr2
          WHERE
            ctr1.ctr_store_sk = ctr2.ctr_store_sk
        )
        AND obt.store_s_store_sk = ctr1.ctr_store_sk
        AND obt.store_s_state = '[STATE]'
        AND ctr1.ctr_customer_sk = obt.bill_customer_c_customer_sk
      )
      AND channel = 'store'
    ORDER BY
      obt.bill_customer_c_customer_id
    LIMIT 100
- id: 2
  template: query2.tpl
  template_sha256: 4dd48917556634fb3d7da1a0de242599272e27f22476bfe2b5221b4f15b0afc2
  parameters:
    YEAR:
    - 1
  sql: |-
    WITH wscs AS (
      SELECT
        sold_date_sk,
        sales_price
      FROM (
        SELECT
          obt.sold_date_sk AS sold_date_sk,
          obt.ext_sales_price AS sales_price
        FROM tpcds_sales_returns_obt AS obt
        WHERE
          channel = 'web'
        UNION ALL
        SELECT
          obt.sold_date_sk AS sold_date_sk,
          obt.ext_sales_price AS sales_price
        FROM tpcds_sales_returns_obt AS obt
        WHERE
          channel = 'catalog'
      )
    ), wswscs AS (
      SELECT
        obt.sold_date_d_week_seq AS d_week_seq,
        obt.sold_date_d_year AS d_year,
        SUM(
          CASE
            WHEN (
              obt.sold_date_d_day_name = 'Sunday'
            )
            THEN obt.sales_price
            ELSE NULL
          END
        ) AS sun_sales,
        SUM(
          CASE
            WHEN (
              obt.sold_date_d_day_name = 'Monday'
            )
            THEN obt.sales_price
            ELSE NULL
          END
        ) AS mon_sales,
        SUM(
          CASE
            WHEN (
              obt.sold_date_d_day_name = 'Tuesday'
            )
            THEN obt.sales_price
            ELSE NULL
          END
        ) AS tue_sales,
        SUM(
          CASE
            WHEN (
              obt.sold_date_d_day_name = 'Wednesday'
            )
            THEN obt.sales_price
            ELSE NULL
          END
        ) AS wed_sales,
        SUM(
          CASE
            WHEN (
              obt.sold_date_d_day_name = 'Thursday'
            )
            THEN obt.sales_price
            ELSE NULL
          END
        ) AS thu_sales,
        SUM(
          CASE
            WHEN (
              obt.sold_date_d_day_name = 'Friday'
            )
            THEN obt.sales_price
            ELSE NULL
          END
        ) AS fri_sales,
        SUM(
          CASE
            WHEN (
              obt.sold_date_d_day_name = 'Saturday'
            )
            THEN obt.sales_price
            ELSE NULL
          END
        ) AS sat_sales
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        obt.sold_date_d_date_sk = obt.sold_date_sk AND channel IN ('catalog', 'web')
      GROUP BY
        d_week_seq,
        d_year
    )
    SELECT
      d_week_seq1,
      ROUND(sun_sales1 / sun_sales2, 2),
      ROUND(mon_sales1 / mon_sales2, 2),
      ROUND(tue_sales1 / tue_sales2, 2),
      ROUND(wed_sales1 / wed_sales2, 2),
      ROUND(thu_sales1 / thu_sales2, 2),
      ROUND(fri_sales1 / fri_sales2, 2),
      ROUND(sat_sales1 / sat_sales2, 2)
    FROM (
      SELECT
        wswscs.d_week_seq AS d_week_seq1,
        sun_sales AS sun_sales1,
        mon_sales AS mon_sales1,
        tue_sales AS tue_sales1,
        wed_sales AS wed_sales1,
        thu_sales AS thu_sales1,
        fri_sales AS fri_sales1,
        sat_sales AS sat_sales1
      FROM wswscs AS wswscs
      WHERE
        (
          d_year = [YEAR]
        )
    ) AS y, (
      SELECT
        wswscs.d_week_seq AS d_week_seq2,
        sun_sales AS sun_sales2,
        mon_sales AS mon_sales2,
        tue_sales AS tue_sales2,
        wed_sales AS wed_sales2,
        thu_sales AS thu_sales2,
        fri_sales AS fri_sales2,
        sat_sales AS sat_sales2
      FROM tpcds_sales_returns_obt AS obt
      CROSS JOIN wswscs AS wswscs
      WHERE
        (
          obt.sold_date_d_week_seq = wswscs.d_week_seq
          AND obt.sold_date_d_year = [YEAR] + 1
        )
        AND channel IN ('catalog', 'web')
    ) AS z
    WHERE
      d_week_seq1 = d_week_seq2 - 53
    ORDER BY
      d_week_seq1
- id: 3
  template: query3.tpl
  template_sha256: 9756742590f746ac97703a30af751f278dd9b16a46a2a5f80a1e8eb6a9c5c3f2
  parameters:
    AGGC:
    - 1
    MANUFACT:
    - 1
    MONTH:
    - 1
  identifier_parameters:
  - AGGC
  identifier_map:
    ss_ext_discount_amt: ext_discount_amt
    ss_ext_sales_price: ext_sales_price
    ss_net_profit: net_profit
    ss_sales_price: sales_price
  sql: |-
    SELECT
      obt.sold_date_d_year,
      obt.item_i_brand_id AS brand_id,
      obt.item_i_brand AS brand,
      SUM([AGGC]) AS sum_agg
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.sold_date_d_date_sk = obt.sold_date_sk
        AND obt.item_sk = obt.item_i_item_sk
        AND obt.item_i_manufact_id = [MANUFACT]
        AND obt.sold_date_d_moy = [MONTH]
      )
      AND channel = 'store'
    GROUP BY
      obt.sold_date_d_year,
      obt.item_i_brand,
      obt.item_i_brand_id
    ORDER BY
      obt.sold_date_d_year,
      sum_agg DESC NULLS FIRST,
      brand_id
    LIMIT 100
- id: 4
  template: query4.tpl
  template_sha256: 0a5b92bffa65fa46ed04f6ee110796d5a49bab2b0819c776d868a0b8850b7bcd
  parameters:
    SELECTONE:
    - 1
    YEAR:
    - 1
  identifier_parameters:
  - SELECTONE
  identifier_map: {}
  sql: |-
    WITH year_total AS (
      SELECT
        obt.bill_customer_c_customer_id AS customer_id,
        obt.bill_customer_c_first_name AS customer_first_name,
        obt.bill_customer_c_last_name AS customer_last_name,
        obt.bill_customer_c_preferred_cust_flag AS customer_preferred_cust_flag,
        obt.bill_customer_c_birth_country AS customer_birth_country,
        obt.bill_customer_c_login AS customer_login,
        obt.bill_customer_c_email_address AS customer_email_address,
        obt.sold_date_d_year AS dyear,
        SUM(
          (
            (
              obt.ext_list_price - obt.ext_wholesale_cost - obt.ext_discount_amt
            ) + obt.ext_sales_price
          ) / 2
        ) AS year_total,
        's' AS sale_type
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.bill_customer_c_customer_sk = obt.ship_customer_sk
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
        )
        AND channel = 'store'
      GROUP BY
        obt.bill_customer_c_customer_id,
        obt.bill_customer_c_first_name,
        obt.bill_customer_c_last_name,
        obt.bill_customer_c_preferred_cust_flag,
        obt.bill_customer_c_birth_country,
        obt.bill_customer_c_login,
        obt.bill_customer_c_email_address,
        obt.sold_date_d_year
      UNION ALL
      SELECT
        obt.bill_customer_c_customer_id AS customer_id,
        obt.bill_customer_c_first_name AS customer_first_name,
        obt.bill_customer_c_last_name AS customer_last_name,
        obt.bill_customer_c_preferred_cust_flag AS customer_preferred_cust_flag,
        obt.bill_customer_c_birth_country AS customer_birth_country,
        obt.bill_customer_c_login AS customer_login,
        obt.bill_customer_c_email_address AS customer_email_address,
        obt.sold_date_d_year AS dyear,
        SUM(
          (
            (
              (
                obt.ext_list_price - obt.ext_wholesale_cost - obt.ext_discount_amt
              ) + obt.ext_sales_price
            ) / 2
          )
        ) AS year_total,
        'c' AS sale_type
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.bill_customer_c_customer_sk = obt.bill_customer_sk
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
        )
        AND channel = 'catalog'
      GROUP BY
        obt.bill_customer_c_customer_id,
        obt.bill_customer_c_first_name,
        obt.bill_customer_c_last_name,
        obt.bill_customer_c_preferred_cust_flag,
        obt.bill_customer_c_birth_country,
        obt.bill_customer_c_login,
        obt.bill_customer_c_email_address,
        obt.sold_date_d_year
      UNION ALL
      SELECT
        obt.bill_customer_c_customer_id AS customer_id,
        obt.bill_customer_c_first_name AS customer_first_name,
        obt.bill_customer_c_last_name AS customer_last_name,
        obt.bill_customer_c_preferred_cust_flag AS customer_preferred_cust_flag,
        obt.bill_customer_c_birth_country AS customer_birth_country,
        obt.bill_customer_c_login AS customer_login,
        obt.bill_customer_c_email_address AS customer_email_address,
        obt.sold_date_d_year AS dyear,
        SUM(
          (
            (
              (
                obt.ext_list_price - obt.ext_wholesale_cost - obt.ext_discount_amt
              ) + obt.ext_sales_price
            ) / 2
          )
        ) AS year_total,
        'w' AS sale_type
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.bill_customer_c_customer_sk = obt.bill_customer_sk
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
        )
        AND channel = 'web'
      GROUP BY
        obt.bill_customer_c_customer_id,
        obt.bill_customer_c_first_name,
        obt.bill_customer_c_last_name,
        obt.bill_customer_c_preferred_cust_flag,
        obt.bill_customer_c_birth_country,
        obt.bill_customer_c_login,
        obt.bill_customer_c_email_address,
        obt.sold_date_d_year
    )
    SELECT
      t_s_secyear.customer_id,
      t_s_secyear.customer_first_name,
      t_s_secyear.customer_last_name,
      [SELECTONE]
    FROM year_total AS t_s_firstyear, year_total AS t_s_secyear, year_total AS t_c_firstyear, year_total AS t_c_secyear, year_total AS t_w_firstyear, year_total AS t_w_secyear
    WHERE
      t_s_secyear.customer_id = t_s_firstyear.customer_id
      AND t_s_firstyear.customer_id = t_c_secyear.customer_id
      AND t_s_firstyear.customer_id = t_c_firstyear.customer_id
      AND t_s_firstyear.customer_id = t_w_firstyear.customer_id
      AND t_s_firstyear.customer_id = t_w_secyear.customer_id
      AND t_s_firstyear.sale_type = 's'
      AND t_c_firstyear.sale_type = 'c'
      AND t_w_firstyear.sale_type = 'w'
      AND t_s_secyear.sale_type = 's'
      AND t_c_secyear.sale_type = 'c'
      AND t_w_secyear.sale_type = 'w'
      AND t_s_firstyear.dyear = [YEAR]
      AND t_s_secyear.dyear = [YEAR] + 1
      AND t_c_firstyear.dyear = [YEAR]
      AND t_c_secyear.dyear = [YEAR] + 1
      AND t_w_firstyear.dyear = [YEAR]
      AND t_w_secyear.dyear = [YEAR] + 1
      AND t_s_firstyear.year_total > 0
      AND t_c_firstyear.year_total > 0
      AND t_w_firstyear.year_total > 0
      AND CASE
        WHEN t_c_firstyear.year_total > 0
        THEN t_c_secyear.year_total / t_c_firstyear.year_total
        ELSE NULL
      END > CASE
        WHEN t_s_firstyear.year_total > 0
        THEN t_s_secyear.year_total / t_s_firstyear.year_total
        ELSE NULL
      END
      AND CASE
        WHEN t_c_firstyear.year_total > 0
        THEN t_c_secyear.year_total / t_c_firstyear.year_total
        ELSE NULL
      END > CASE
        WHEN t_w_firstyear.year_total > 0
        THEN t_w_secyear.year_total / t_w_firstyear.year_total
        ELSE NULL
      END
    ORDER BY
      t_s_secyear.customer_id,
      t_s_secyear.customer_first_name,
      t_s_secyear.customer_last_name,
      [SELECTONE]
    LIMIT 100
- id: 5
  template: query5.tpl
  template_sha256: e232c642b31f7bd5a27f652a0528f5d33eb38e854f6c45ea6f27e0ad3abaa4de
  parameters:
    SALES_DATE:
    - 1
    YEAR: []
  sql: |-
    WITH ssr AS (
      SELECT
        obt.store_s_store_id,
        SUM(obt.sales_price) AS sales,
        SUM(profit) AS profit,
        SUM(return_amt) AS returns,
        SUM(net_loss) AS profit_loss
      FROM tpcds_sales_returns_obt AS obt
      CROSS JOIN (
        SELECT
          obt.store_sk AS store_sk,
          obt.sold_date_sk AS date_sk,
          obt.ext_sales_price AS sales_price,
          obt.net_profit AS profit,
          CAST(0 AS DECIMAL(7, 2)) AS return_amt,
          CAST(0 AS DECIMAL(7, 2)) AS net_loss
        FROM tpcds_sales_returns_obt AS obt
        WHERE
          channel = 'store'
        UNION ALL
        SELECT
          obt.store_sk AS store_sk,
          obt.returned_date_sk AS date_sk,
          CAST(0 AS DECIMAL(7, 2)) AS sales_price,
          CAST(0 AS DECIMAL(7, 2)) AS profit,
          obt.return_amount AS return_amt,
          obt.return_net_loss AS net_loss
        FROM tpcds_sales_returns_obt AS obt
        WHERE
          channel = 'store'
      ) AS salesreturns
      WHERE
        (
          date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_date BETWEEN CAST('[SALES_DATE]' AS DATE) AND (
            CAST('[SALES_DATE]' AS DATE) + INTERVAL 14 DAY
          )
          AND obt.store_sk = obt.store_s_store_sk
        )
        AND channel IN ('catalog', 'store', 'web')
      GROUP BY
        obt.store_s_store_id
    ), csr AS (
      SELECT
        obt.catalog_page_cp_catalog_page_id,
        SUM(obt.sales_price) AS sales,
        SUM(profit) AS profit,
        SUM(return_amt) AS returns,
        SUM(net_loss) AS profit_loss
      FROM tpcds_sales_returns_obt AS obt
      CROSS JOIN (
        SELECT
          obt.catalog_page_sk AS page_sk,
          obt.sold_date_sk AS date_sk,
          obt.ext_sales_price AS sales_price,
          obt.net_profit AS profit,
          CAST(0 AS DECIMAL(7, 2)) AS return_amt,
          CAST(0 AS DECIMAL(7, 2)) AS net_loss
        FROM tpcds_sales_returns_obt AS obt
        WHERE
          channel = 'catalog'
        UNION ALL
        SELECT
          obt.catalog_page_sk AS page_sk,
          obt.returned_date_sk AS date_sk,
          CAST(0 AS DECIMAL(7, 2)) AS sales_price,
          CAST(0 AS DECIMAL(7, 2)) AS profit,
          obt.return_amount AS return_amt,
          obt.return_net_loss AS net_loss
        FROM tpcds_sales_returns_obt AS obt
        WHERE
          channel = 'catalog'
      ) AS salesreturns
      WHERE
        (
          date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_date BETWEEN CAST('[SALES_DATE]' AS DATE) AND (
            CAST('[SALES_DATE]' AS DATE) + INTERVAL 14 DAY
          )
          AND page_sk = obt.catalog_page_cp_catalog_page_sk
        )
        AND channel IN ('catalog', 'store', 'web')
      GROUP BY
        obt.catalog_page_cp_catalog_page_id
    ), wsr AS (
      SELECT
        obt.web_site_web_site_id,
        SUM(obt.sales_price) AS sales,
        SUM(profit) AS profit,
        SUM(return_amt) AS returns,
        SUM(net_loss) AS profit_loss
      FROM tpcds_sales_returns_obt AS obt
      CROSS JOIN (
        SELECT
          obt.web_site_sk AS wsr_web_site_sk,
          obt.sold_date_sk AS date_sk,
          obt.ext_sales_price AS sales_price,
          obt.net_profit AS profit,
          CAST(0 AS DECIMAL(7, 2)) AS return_amt,
          CAST(0 AS DECIMAL(7, 2)) AS net_loss
        FROM tpcds_sales_returns_obt AS obt
        WHERE
          channel = 'web'
        UNION ALL
        SELECT
          obt.web_site_sk AS wsr_web_site_sk,
          obt.returned_date_sk AS date_sk,
          CAST(0 AS DECIMAL(7, 2)) AS sales_price,
          CAST(0 AS DECIMAL(7, 2)) AS profit,
          obt.return_amount AS return_amt,
          obt.return_net_loss AS net_loss
        FROM tpcds_sales_returns_obt AS obt
        WHERE
          channel = 'web'
      ) AS salesreturns
      WHERE
        (
          date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_date BETWEEN CAST('[SALES_DATE]' AS DATE) AND (
            CAST('[SALES_DATE]' AS DATE) + INTERVAL 14 DAY
          )
          AND wsr_web_site_sk = obt.web_site_web_site_sk
        )
        AND channel IN ('catalog', 'store', 'web')
      GROUP BY
        obt.web_site_web_site_id
    )
    SELECT
      channel,
      id,
      SUM(sales) AS sales,
      SUM(returns) AS returns,
      SUM(profit) AS profit
    FROM (
      SELECT
        'store channel' AS channel,
        'store' || store_s_store_id AS id,
        sales,
        returns,
        (
          profit - profit_loss
        ) AS profit
      FROM ssr
      UNION ALL
      SELECT
        'catalog channel' AS channel,
        'catalog_page' || catalog_page_cp_catalog_page_id AS id,
        sales,
        returns,
        (
          profit - profit_loss
        ) AS profit
      FROM csr
      UNION ALL
      SELECT
        'web channel' AS channel,
        'web_site' || web_site_web_site_id AS id,
        sales,
        returns,
        (
          profit - profit_loss
        ) AS profit
      FROM wsr
    ) AS x
    GROUP BY
      ROLLUP (
        channel,
        id
      )
    ORDER BY
      channel,
      id
    LIMIT 100
- id: 6
  template: query6.tpl
  template_sha256: 502f4a7d64d8de504379c750be4e9918ef466b1db28024b1b44fb70de257705e
  parameters:
    MONTH:
    - 1
    YEAR:
    - 1
  sql: |-
    SELECT
      obt.bill_addr_ca_state AS state,
      COUNT(*) AS cnt
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.bill_customer_c_customer_sk = obt.ship_customer_sk
        AND obt.sold_date_sk = obt.sold_date_d_date_sk
        AND obt.item_sk = obt.item_i_item_sk
        AND obt.sold_date_d_month_seq = (
          SELECT DISTINCT
            (
              obt.sold_date_d_month_seq
            )
          FROM tpcds_sales_returns_obt AS obt
          WHERE
            (
              obt.sold_date_d_year = [YEAR] AND obt.sold_date_d_moy = [MONTH]
            )
            AND channel = 'store'
        )
        AND obt.item_i_current_price > 1.2 * (
          SELECT
            AVG(obt.item_i_current_price)
          FROM tpcds_sales_returns_obt AS obt
          WHERE
            obt.item_i_category = obt.item_i_category AND channel = 'store'
        )
      )
      AND channel = 'store'
    GROUP BY
      obt.bill_addr_ca_state
    HAVING
      COUNT(*) >= 10
    ORDER BY
      cnt,
      obt.bill_addr_ca_state
    LIMIT 100
- id: 7
  template: query7.tpl
  template_sha256: 1a5fe27db2d5011a0732d9f98db5558f40eb28edfb1ce4741dfccf569eafce2d
  parameters:
    ES:
    - 1
    GEN:
    - 1
    MS:
    - 1
    YEAR:
    - 1
  sql: |-
    SELECT
      obt.item_i_item_id,
      AVG(obt.quantity) AS agg1,
      AVG(obt.list_price) AS agg2,
      AVG(obt.coupon_amt) AS agg3,
      AVG(obt.sales_price) AS agg4
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.sold_date_sk = obt.sold_date_d_date_sk
        AND obt.item_sk = obt.item_i_item_sk
        AND obt.ship_cdemo_sk = obt.bill_cdemo_cd_demo_sk
        AND obt.promo_sk = obt.promo_p_promo_sk
        AND obt.bill_cdemo_cd_gender = '[GEN]'
        AND obt.bill_cdemo_cd_marital_status = '[MS]'
        AND obt.bill_cdemo_cd_education_status = '[ES]'
        AND (
          obt.promo_p_channel_email = 'N' OR obt.promo_p_channel_event = 'N'
        )
        AND obt.sold_date_d_year = [YEAR]
      )
      AND channel = 'store'
    GROUP BY
      obt.item_i_item_id
    ORDER BY
      obt.item_i_item_id
    LIMIT 100
