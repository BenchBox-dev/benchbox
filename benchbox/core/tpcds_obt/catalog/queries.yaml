- id: 56
  template: query56.tpl
  template_sha256: 7a8f163f71ded650bbc9d89af88114b44b7fcc4caafa776857ac229b855c5a3b
  parameters:
    COLOR:
    - 1
    - 2
    - 3
    GMT:
    - 1
    MONTH:
    - 1
    YEAR:
    - 1
  sql: |-
    WITH ss AS (
      SELECT
        obt.item_i_item_id,
        SUM(obt.ext_sales_price) AS total_sales
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_i_item_id IN (
            SELECT
              obt.item_i_item_id
            FROM tpcds_sales_returns_obt AS obt
            WHERE
              obt.item_i_color IN ('[COLOR]', '[COLOR.2]', '[COLOR.3]')
              AND channel IN ('catalog', 'store', 'web')
          )
          AND obt.item_sk = obt.item_i_item_sk
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_year = [YEAR]
          AND obt.sold_date_d_moy = [MONTH]
          AND obt.ship_addr_sk = obt.bill_addr_ca_address_sk
          AND obt.bill_addr_ca_gmt_offset = [GMT]
        )
        AND channel = 'store'
      GROUP BY
        obt.item_i_item_id
    ), cs AS (
      SELECT
        obt.item_i_item_id,
        SUM(obt.ext_sales_price) AS total_sales
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_i_item_id IN (
            SELECT
              obt.item_i_item_id
            FROM tpcds_sales_returns_obt AS obt
            WHERE
              obt.item_i_color IN ('[COLOR]', '[COLOR.2]', '[COLOR.3]')
              AND channel IN ('catalog', 'store', 'web')
          )
          AND obt.item_sk = obt.item_i_item_sk
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_year = [YEAR]
          AND obt.sold_date_d_moy = [MONTH]
          AND obt.bill_addr_sk = obt.bill_addr_ca_address_sk
          AND obt.bill_addr_ca_gmt_offset = [GMT]
        )
        AND channel = 'catalog'
      GROUP BY
        obt.item_i_item_id
    ), ws AS (
      SELECT
        obt.item_i_item_id,
        SUM(obt.ext_sales_price) AS total_sales
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_i_item_id IN (
            SELECT
              obt.item_i_item_id
            FROM tpcds_sales_returns_obt AS obt
            WHERE
              obt.item_i_color IN ('[COLOR]', '[COLOR.2]', '[COLOR.3]')
              AND channel IN ('catalog', 'store', 'web')
          )
          AND obt.item_sk = obt.item_i_item_sk
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_year = [YEAR]
          AND obt.sold_date_d_moy = [MONTH]
          AND obt.bill_addr_sk = obt.bill_addr_ca_address_sk
          AND obt.bill_addr_ca_gmt_offset = [GMT]
        )
        AND channel = 'web'
      GROUP BY
        obt.item_i_item_id
    )
    SELECT
      item_i_item_id,
      SUM(total_sales) AS total_sales
    FROM (
      SELECT
        *
      FROM ss
      UNION ALL
      SELECT
        *
      FROM cs
      UNION ALL
      SELECT
        *
      FROM ws
    ) AS tmp1
    GROUP BY
      item_i_item_id
    ORDER BY
      total_sales,
      item_i_item_id
    LIMIT 100
- id: 57
  template: query57.tpl
  template_sha256: 9833481006694b565ce7e19f513a62b49bb16660731b173e224abbe26f38c240
  parameters:
    ORDERBY:
    - 1
    SELECTONE:
    - 1
    SELECTTWO:
    - 1
    YEAR:
    - 1
  identifier_parameters:
  - ORDERBY
  - SELECTONE
  - SELECTTWO
  identifier_map: {}
  sql: |-
    WITH v1 AS (
      SELECT
        obt.item_i_category AS i_category,
        obt.item_i_brand AS i_brand,
        obt.call_center_cc_name AS cc_name,
        obt.sold_date_d_year AS d_year,
        obt.sold_date_d_moy AS d_moy,
        SUM(obt.sales_price) AS sum_sales,
        AVG(SUM(obt.sales_price)) OVER (
          PARTITION BY obt.item_i_category, obt.item_i_brand, obt.call_center_cc_name, obt.sold_date_d_year
        ) AS avg_monthly_sales,
        RANK() OVER (
          PARTITION BY obt.item_i_category, obt.item_i_brand, obt.call_center_cc_name
          ORDER BY obt.sold_date_d_year, obt.sold_date_d_moy
        ) AS rn
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_sk = obt.item_i_item_sk
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.call_center_cc_call_center_sk = obt.call_center_sk
          AND (
            obt.sold_date_d_year = [YEAR]
            OR (
              obt.sold_date_d_year = [YEAR] - 1 AND obt.sold_date_d_moy = 12
            )
            OR (
              obt.sold_date_d_year = [YEAR] + 1 AND obt.sold_date_d_moy = 1
            )
          )
        )
        AND channel = 'catalog'
      GROUP BY
        obt.item_i_category,
        obt.item_i_brand,
        obt.call_center_cc_name,
        obt.sold_date_d_year,
        obt.sold_date_d_moy
    ), v2 AS (
      SELECT
        [SELECTONE] [SELECTTWO],
        v1.avg_monthly_sales,
        v1.sum_sales,
        v1_lag.sum_sales AS psum,
        v1_lead.sum_sales AS nsum
      FROM v1, v1 AS v1_lag, v1 AS v1_lead
      WHERE
        v1.i_category = v1_lag.i_category
        AND v1.i_category = v1_lead.i_category
        AND v1.i_brand = v1_lag.i_brand
        AND v1.i_brand = v1_lead.i_brand
        AND v1.cc_name = v1_lag.cc_name
        AND v1.cc_name = v1_lead.cc_name
        AND v1.rn = v1_lag.rn + 1
        AND v1.rn = v1_lead.rn - 1
    )
    SELECT
      *
    FROM v2
    WHERE
      d_year = [YEAR]
      AND avg_monthly_sales > 0
      AND CASE
        WHEN avg_monthly_sales > 0
        THEN ABS(sum_sales - avg_monthly_sales) / avg_monthly_sales
        ELSE NULL
      END > 0.1
    ORDER BY
      sum_sales - avg_monthly_sales,
      [ORDERBY]
    LIMIT 100
- id: 58
  template: query58.tpl
  template_sha256: 452109c63497766415fa73ce4ab69d5ba87c10c396c66b1836e7e41ab339e55f
  parameters:
    SALES_DATE:
    - 1
    YEAR: []
  sql: |-
    WITH ss_items AS (
      SELECT
        obt.item_i_item_id AS item_id,
        SUM(obt.ext_sales_price) AS ss_item_rev
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_sk = obt.item_i_item_sk
          AND obt.sold_date_d_date IN (
            SELECT
              obt.sold_date_d_date
            FROM tpcds_sales_returns_obt AS obt
            WHERE
              obt.sold_date_d_week_seq = (
                SELECT
                  MAX(obt.sold_date_d_week_seq)
                FROM tpcds_sales_returns_obt AS obt
                WHERE
                  obt.sold_date_d_date = '[SALES_DATE]'
                  AND channel IN ('catalog', 'store', 'web')
              )
              AND channel IN ('catalog', 'store', 'web')
          )
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
        )
        AND channel = 'store'
      GROUP BY
        obt.item_i_item_id
    ), cs_items AS (
      SELECT
        obt.item_i_item_id AS item_id,
        SUM(obt.ext_sales_price) AS cs_item_rev
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_sk = obt.item_i_item_sk
          AND obt.sold_date_d_date IN (
            SELECT
              obt.sold_date_d_date
            FROM tpcds_sales_returns_obt AS obt
            WHERE
              obt.sold_date_d_week_seq = (
                SELECT
                  MAX(obt.sold_date_d_week_seq)
                FROM tpcds_sales_returns_obt AS obt
                WHERE
                  obt.sold_date_d_date = '[SALES_DATE]'
                  AND channel IN ('catalog', 'store', 'web')
              )
              AND channel IN ('catalog', 'store', 'web')
          )
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
        )
        AND channel = 'catalog'
      GROUP BY
        obt.item_i_item_id
    ), ws_items AS (
      SELECT
        obt.item_i_item_id AS item_id,
        SUM(obt.ext_sales_price) AS ws_item_rev
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_sk = obt.item_i_item_sk
          AND obt.sold_date_d_date IN (
            SELECT
              obt.sold_date_d_date
            FROM tpcds_sales_returns_obt AS obt
            WHERE
              obt.sold_date_d_week_seq = (
                SELECT
                  MAX(obt.sold_date_d_week_seq)
                FROM tpcds_sales_returns_obt AS obt
                WHERE
                  obt.sold_date_d_date = '[SALES_DATE]'
                  AND channel IN ('catalog', 'store', 'web')
              )
              AND channel IN ('catalog', 'store', 'web')
          )
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
        )
        AND channel = 'web'
      GROUP BY
        obt.item_i_item_id
    )
    SELECT
      ss_items.item_id,
      ss_item_rev,
      ss_item_rev / (
        (
          ss_item_rev + cs_item_rev + ws_item_rev
        ) / 3
      ) * 100 AS ss_dev,
      cs_item_rev,
      cs_item_rev / (
        (
          ss_item_rev + cs_item_rev + ws_item_rev
        ) / 3
      ) * 100 AS cs_dev,
      ws_item_rev,
      ws_item_rev / (
        (
          ss_item_rev + cs_item_rev + ws_item_rev
        ) / 3
      ) * 100 AS ws_dev,
      (
        ss_item_rev + cs_item_rev + ws_item_rev
      ) / 3 AS average
    FROM ss_items, cs_items, ws_items
    WHERE
      ss_items.item_id = cs_items.item_id
      AND ss_items.item_id = ws_items.item_id
      AND ss_item_rev BETWEEN 0.9 * cs_item_rev AND 1.1 * cs_item_rev
      AND ss_item_rev BETWEEN 0.9 * ws_item_rev AND 1.1 * ws_item_rev
      AND cs_item_rev BETWEEN 0.9 * ss_item_rev AND 1.1 * ss_item_rev
      AND cs_item_rev BETWEEN 0.9 * ws_item_rev AND 1.1 * ws_item_rev
      AND ws_item_rev BETWEEN 0.9 * ss_item_rev AND 1.1 * ss_item_rev
      AND ws_item_rev BETWEEN 0.9 * cs_item_rev AND 1.1 * cs_item_rev
    ORDER BY
      ss_items.item_id,
      ss_item_rev
    LIMIT 100
- id: 59
  template: query59.tpl
  template_sha256: 5f43ea2aefd5c90096eafa1313b296e4073849f5e54e5b12de4b7daf6dd32bb7
  parameters:
    DMS:
    - 1
  sql: |-
    WITH wss AS (
      SELECT
        sold_date_d_week_seq AS d_week_seq,
        store_sk AS ss_store_sk,
        SUM(CASE WHEN sold_date_d_day_name = 'Sunday' THEN sales_price ELSE NULL END) AS sun_sales,
        SUM(CASE WHEN sold_date_d_day_name = 'Monday' THEN sales_price ELSE NULL END) AS mon_sales,
        SUM(CASE WHEN sold_date_d_day_name = 'Tuesday' THEN sales_price ELSE NULL END) AS tue_sales,
        SUM(CASE WHEN sold_date_d_day_name = 'Wednesday' THEN sales_price ELSE NULL END) AS wed_sales,
        SUM(CASE WHEN sold_date_d_day_name = 'Thursday' THEN sales_price ELSE NULL END) AS thu_sales,
        SUM(CASE WHEN sold_date_d_day_name = 'Friday' THEN sales_price ELSE NULL END) AS fri_sales,
        SUM(CASE WHEN sold_date_d_day_name = 'Saturday' THEN sales_price ELSE NULL END) AS sat_sales
      FROM tpcds_sales_returns_obt
      WHERE
        channel = 'store' AND sold_date_d_date_sk IS NOT NULL
      GROUP BY
        1,
        2
    ), cal AS (
      SELECT DISTINCT
        sold_date_d_date_sk AS d_date_sk,
        sold_date_d_week_seq AS d_week_seq,
        sold_date_d_month_seq AS d_month_seq
      FROM tpcds_sales_returns_obt
      WHERE
        sold_date_d_date_sk IS NOT NULL
    ), st AS (
      SELECT DISTINCT
        store_s_store_sk AS s_store_sk,
        store_s_store_name AS s_store_name,
        store_s_store_id AS s_store_id
      FROM tpcds_sales_returns_obt
      WHERE
        store_s_store_sk IS NOT NULL
    )
    SELECT
      s_store_name1,
      s_store_id1,
      d_week_seq1,
      sun_sales1 / sun_sales2,
      mon_sales1 / mon_sales2,
      tue_sales1 / tue_sales2,
      wed_sales1 / wed_sales2,
      thu_sales1 / thu_sales2,
      fri_sales1 / fri_sales2,
      sat_sales1 / sat_sales2
    FROM (
      SELECT
        st.s_store_name AS s_store_name1,
        wss.d_week_seq AS d_week_seq1,
        st.s_store_id AS s_store_id1,
        sun_sales AS sun_sales1,
        mon_sales AS mon_sales1,
        tue_sales AS tue_sales1,
        wed_sales AS wed_sales1,
        thu_sales AS thu_sales1,
        fri_sales AS fri_sales1,
        sat_sales AS sat_sales1
      FROM wss
      JOIN st
        ON wss.ss_store_sk = st.s_store_sk
      JOIN cal AS d
        ON d.d_week_seq = wss.d_week_seq
      WHERE
        d.d_month_seq BETWEEN [DMS] AND [DMS] + 11
    ) AS y, (
      SELECT
        st.s_store_name AS s_store_name2,
        wss.d_week_seq AS d_week_seq2,
        st.s_store_id AS s_store_id2,
        sun_sales AS sun_sales2,
        mon_sales AS mon_sales2,
        tue_sales AS tue_sales2,
        wed_sales AS wed_sales2,
        thu_sales AS thu_sales2,
        fri_sales AS fri_sales2,
        sat_sales AS sat_sales2
      FROM wss
      JOIN st
        ON wss.ss_store_sk = st.s_store_sk
      JOIN cal AS d
        ON d.d_week_seq = wss.d_week_seq
      WHERE
        d.d_month_seq BETWEEN [DMS] + 12 AND [DMS] + 23
    ) AS x
    WHERE
      s_store_id1 = s_store_id2 AND d_week_seq1 = d_week_seq2 - 52
    ORDER BY
      s_store_name1,
      s_store_id1,
      d_week_seq1
    LIMIT 100
- id: 60
  template: query60.tpl
  template_sha256: 97c30bec850e139ec4ab0206c8c54fbd6d96258e9af24669660b8220b32961fe
  parameters:
    CATEGORY:
    - 1
    GMT:
    - 1
    MONTH:
    - 1
    YEAR:
    - 1
  identifier_parameters:
  - CATEGORY
  identifier_map: {}
  sql: |-
    WITH ss AS (
      SELECT
        obt.item_i_item_id,
        SUM(obt.ext_sales_price) AS total_sales
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_i_item_id IN (
            SELECT
              obt.item_i_item_id
            FROM tpcds_sales_returns_obt AS obt
            WHERE
              obt.item_i_category IN ('[CATEGORY]')
              AND channel IN ('catalog', 'store', 'web')
          )
          AND obt.item_sk = obt.item_i_item_sk
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_year = [YEAR]
          AND obt.sold_date_d_moy = [MONTH]
          AND obt.ship_addr_sk = obt.bill_addr_ca_address_sk
          AND obt.bill_addr_ca_gmt_offset = [GMT]
        )
        AND channel = 'store'
      GROUP BY
        obt.item_i_item_id
    ), cs AS (
      SELECT
        obt.item_i_item_id,
        SUM(obt.ext_sales_price) AS total_sales
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_i_item_id IN (
            SELECT
              obt.item_i_item_id
            FROM tpcds_sales_returns_obt AS obt
            WHERE
              obt.item_i_category IN ('[CATEGORY]')
              AND channel IN ('catalog', 'store', 'web')
          )
          AND obt.item_sk = obt.item_i_item_sk
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_year = [YEAR]
          AND obt.sold_date_d_moy = [MONTH]
          AND obt.bill_addr_sk = obt.bill_addr_ca_address_sk
          AND obt.bill_addr_ca_gmt_offset = [GMT]
        )
        AND channel = 'catalog'
      GROUP BY
        obt.item_i_item_id
    ), ws AS (
      SELECT
        obt.item_i_item_id,
        SUM(obt.ext_sales_price) AS total_sales
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_i_item_id IN (
            SELECT
              obt.item_i_item_id
            FROM tpcds_sales_returns_obt AS obt
            WHERE
              obt.item_i_category IN ('[CATEGORY]')
              AND channel IN ('catalog', 'store', 'web')
          )
          AND obt.item_sk = obt.item_i_item_sk
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.sold_date_d_year = [YEAR]
          AND obt.sold_date_d_moy = [MONTH]
          AND obt.bill_addr_sk = obt.bill_addr_ca_address_sk
          AND obt.bill_addr_ca_gmt_offset = [GMT]
        )
        AND channel = 'web'
      GROUP BY
        obt.item_i_item_id
    )
    SELECT
      item_i_item_id,
      SUM(total_sales) AS total_sales
    FROM (
      SELECT
        *
      FROM ss
      UNION ALL
      SELECT
        *
      FROM cs
      UNION ALL
      SELECT
        *
      FROM ws
    ) AS tmp1
    GROUP BY
      item_i_item_id
    ORDER BY
      item_i_item_id,
      total_sales
    LIMIT 100
- id: 61
  template: query61.tpl
  template_sha256: 9501f48fd73d4ed27111943dfa869480695884d70b9aaaf054a0585ee49c8d6f
  parameters:
    CATEGORY:
    - 1
    GMT:
    - 1
    MONTH:
    - 1
    YEAR:
    - 1
  identifier_parameters:
  - CATEGORY
  - GMT
  identifier_map: {}
  sql: |-
    SELECT
      promotions,
      total,
      CAST(promotions AS DECIMAL(15, 4)) / CAST(total AS DECIMAL(15, 4)) * 100
    FROM (
      SELECT
        SUM(obt.ext_sales_price) AS promotions
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.store_sk = obt.store_s_store_sk
          AND obt.promo_sk = obt.promo_p_promo_sk
          AND obt.ship_customer_sk = obt.bill_customer_c_customer_sk
          AND obt.item_sk = obt.item_i_item_sk
          AND obt.bill_addr_ca_gmt_offset = [GMT]
          AND obt.item_i_category = '[CATEGORY]'
          AND (
            obt.promo_p_channel_dmail = 'Y'
            OR obt.promo_p_channel_email = 'Y'
            OR obt.promo_p_channel_tv = 'Y'
          )
          AND obt.store_s_gmt_offset = [GMT]
          AND obt.sold_date_d_year = [YEAR]
          AND obt.sold_date_d_moy = [MONTH]
        )
        AND channel = 'store'
    ) AS promotional_sales, (
      SELECT
        SUM(obt.ext_sales_price) AS total
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.store_sk = obt.store_s_store_sk
          AND obt.ship_customer_sk = obt.bill_customer_c_customer_sk
          AND obt.item_sk = obt.item_i_item_sk
          AND obt.bill_addr_ca_gmt_offset = [GMT]
          AND obt.item_i_category = '[CATEGORY]'
          AND obt.store_s_gmt_offset = [GMT]
          AND obt.sold_date_d_year = [YEAR]
          AND obt.sold_date_d_moy = [MONTH]
        )
        AND channel = 'store'
    ) AS all_sales
    ORDER BY
      promotions,
      total
    LIMIT 100
- id: 62
  template: query62.tpl
  template_sha256: a20540c366048c36a67c2e8779472beee91f81e2a95981918ffe9186a901454e
  parameters:
    DMS:
    - 1
  sql: |-
    SELECT
      SUBSTRING(obt.warehouse_w_warehouse_name, 1, 20),
      obt.ship_mode_sm_type,
      obt.web_site_web_name,
      SUM(CASE WHEN (
        obt.ship_date_sk - obt.sold_date_sk <= 30
      ) THEN 1 ELSE 0 END) AS "30 days",
      SUM(
        CASE
          WHEN (
            obt.ship_date_sk - obt.sold_date_sk > 30
          )
          AND (
            obt.ship_date_sk - obt.sold_date_sk <= 60
          )
          THEN 1
          ELSE 0
        END
      ) AS "31-60 days",
      SUM(
        CASE
          WHEN (
            obt.ship_date_sk - obt.sold_date_sk > 60
          )
          AND (
            obt.ship_date_sk - obt.sold_date_sk <= 90
          )
          THEN 1
          ELSE 0
        END
      ) AS "61-90 days",
      SUM(
        CASE
          WHEN (
            obt.ship_date_sk - obt.sold_date_sk > 90
          )
          AND (
            obt.ship_date_sk - obt.sold_date_sk <= 120
          )
          THEN 1
          ELSE 0
        END
      ) AS "91-120 days",
      SUM(CASE WHEN (
        obt.ship_date_sk - obt.sold_date_sk > 120
      ) THEN 1 ELSE 0 END) AS ">120 days"
    FROM tpcds_sales_returns_obt AS obt
    WHERE
      (
        obt.ship_date_d_month_seq BETWEEN [DMS] AND [DMS] + 11
        AND obt.ship_date_sk = obt.ship_date_d_date_sk
        AND obt.warehouse_sk = obt.warehouse_w_warehouse_sk
        AND obt.ship_mode_sk = obt.ship_mode_sm_ship_mode_sk
        AND obt.web_site_sk = obt.web_site_web_site_sk
      )
      AND channel = 'web'
    GROUP BY
      SUBSTRING(obt.warehouse_w_warehouse_name, 1, 20),
      obt.ship_mode_sm_type,
      obt.web_site_web_name
    ORDER BY
      SUBSTRING(obt.warehouse_w_warehouse_name, 1, 20),
      obt.ship_mode_sm_type,
      obt.web_site_web_name
    LIMIT 100
- id: 63
  template: query63.tpl
  template_sha256: cd290b6f8a83e690fcfa8ee29ce49cbd153a88840b7712dc1ced3912f5870459
  parameters:
    DMS:
    - 1
  sql: |-
    SELECT
      *
    FROM (
      SELECT
        obt.item_i_manager_id,
        SUM(obt.sales_price) AS sum_sales,
        AVG(SUM(obt.sales_price)) OVER (PARTITION BY obt.item_i_manager_id) AS avg_monthly_sales
      FROM tpcds_sales_returns_obt AS obt
      WHERE
        (
          obt.item_sk = obt.item_i_item_sk
          AND obt.sold_date_sk = obt.sold_date_d_date_sk
          AND obt.store_sk = obt.store_s_store_sk
          AND obt.sold_date_d_month_seq IN (
            [DMS],
            [DMS] + 1,
            [DMS] + 2,
            [DMS] + 3,
            [DMS] + 4,
            [DMS] + 5,
            [DMS] + 6,
            [DMS] + 7,
            [DMS] + 8,
            [DMS] + 9,
            [DMS] + 10,
            [DMS] + 11
          )
          AND (
            (
              obt.item_i_category IN ('Books', 'Children', 'Electronics')
              AND obt.item_i_class IN ('personal', 'portable', 'reference', 'self-help')
              AND obt.item_i_brand IN (
                'scholaramalgamalg #14',
                'scholaramalgamalg #7',
                'exportiunivamalg #9',
                'scholaramalgamalg #9'
              )
            )
            OR (
              obt.item_i_category IN ('Women', 'Music', 'Men')
              AND obt.item_i_class IN ('accessories', 'classical', 'fragrances', 'pants')
              AND obt.item_i_brand IN ('amalgimporto #1', 'edu packscholar #1', 'exportiimporto #1', 'importoamalg #1')
            )
          )
        )
        AND channel = 'store'
      GROUP BY
        obt.item_i_manager_id,
        obt.sold_date_d_moy
    ) AS tmp1
    WHERE
      CASE
        WHEN avg_monthly_sales > 0
        THEN ABS(sum_sales - avg_monthly_sales) / avg_monthly_sales
        ELSE NULL
      END > 0.1
    ORDER BY
      item_i_manager_id,
      avg_monthly_sales,
      sum_sales
    LIMIT 100
- id: 64
  template: query64.tpl
  template_sha256: dac0f9c9e0cf71596ee8c76d7cd2e32db190124e52f25a7722fb73fa4d041d93
  parameters:
    COLOR:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    PRICE:
    - 1
    YEAR:
    - 1
  sql: |-
    WITH cs_ui AS (
      SELECT item_sk AS cs_item_sk, SUM(ext_list_price) AS sale, SUM(refunded_cash + reversed_charge + store_credit) AS refund
      FROM tpcds_sales_returns_obt WHERE channel = 'catalog' AND has_return = 'Y'
      GROUP BY item_sk
      HAVING SUM(ext_list_price) > 2 * SUM(refunded_cash + reversed_charge + store_credit)
    ), cross_sales AS (
      SELECT o.item_i_product_name AS product_name, o.item_i_item_sk AS item_sk, o.store_s_store_name AS store_name, o.store_s_zip AS store_zip,
        o.bill_addr_ca_street_number AS b_street_number, o.bill_addr_ca_street_name AS b_street_name, o.bill_addr_ca_city AS b_city, o.bill_addr_ca_zip AS b_zip,
        o.bill_cur_addr_ca_street_number AS c_street_number, o.bill_cur_addr_ca_street_name AS c_street_name, o.bill_cur_addr_ca_city AS c_city, o.bill_cur_addr_ca_zip AS c_zip,
        o.sold_date_d_year AS syear, o.bill_first_sales_date_d_year AS fsyear, o.bill_first_shipto_date_d_year AS s2year,
        COUNT(*) AS cnt, SUM(o.wholesale_cost) AS s1, SUM(o.list_price) AS s2, SUM(o.coupon_amt) AS s3
      FROM tpcds_sales_returns_obt AS o JOIN cs_ui ON o.item_sk = cs_ui.cs_item_sk
      WHERE o.channel = 'store' AND o.has_return = 'Y'
        AND o.store_s_store_sk IS NOT NULL AND o.sold_date_d_date_sk IS NOT NULL AND o.bill_customer_c_customer_sk IS NOT NULL
        AND o.bill_cdemo_cd_demo_sk IS NOT NULL AND o.bill_hdemo_hd_demo_sk IS NOT NULL AND o.bill_addr_ca_address_sk IS NOT NULL
        AND o.item_i_item_sk IS NOT NULL AND o.bill_cur_cdemo_cd_demo_sk IS NOT NULL AND o.bill_cur_hdemo_hd_demo_sk IS NOT NULL
        AND o.bill_cur_addr_ca_address_sk IS NOT NULL AND o.bill_first_sales_date_d_date_sk IS NOT NULL
        AND o.bill_first_shipto_date_d_date_sk IS NOT NULL AND o.promo_p_promo_sk IS NOT NULL
        AND o.bill_hdemo_ib_lower_bound IS NOT NULL AND o.bill_cur_hdemo_ib_lower_bound IS NOT NULL
        AND o.bill_cdemo_cd_marital_status <> o.bill_cur_cdemo_cd_marital_status
        AND o.item_i_color IN ('[COLOR.1]', '[COLOR.2]', '[COLOR.3]', '[COLOR.4]', '[COLOR.5]', '[COLOR.6]')
        AND o.item_i_current_price BETWEEN [PRICE] AND [PRICE] + 10 AND o.item_i_current_price BETWEEN [PRICE] + 1 AND [PRICE] + 15
      GROUP BY o.item_i_product_name, o.item_i_item_sk, o.store_s_store_name, o.store_s_zip,
        o.bill_addr_ca_street_number, o.bill_addr_ca_street_name, o.bill_addr_ca_city, o.bill_addr_ca_zip,
        o.bill_cur_addr_ca_street_number, o.bill_cur_addr_ca_street_name, o.bill_cur_addr_ca_city, o.bill_cur_addr_ca_zip,
        o.sold_date_d_year, o.bill_first_sales_date_d_year, o.bill_first_shipto_date_d_year
    )
    SELECT cs1.product_name, cs1.store_name, cs1.store_zip, cs1.b_street_number, cs1.b_street_name, cs1.b_city, cs1.b_zip,
      cs1.c_street_number, cs1.c_street_name, cs1.c_city, cs1.c_zip, cs1.syear, cs1.cnt, cs1.s1 AS s11, cs1.s2 AS s21, cs1.s3 AS s31,
      cs2.s1 AS s12, cs2.s2 AS s22, cs2.s3 AS s32, cs2.syear, cs2.cnt
    FROM cross_sales AS cs1, cross_sales AS cs2
    WHERE cs1.item_sk = cs2.item_sk AND cs1.syear = [YEAR] AND cs2.syear = [YEAR] + 1 AND cs2.cnt <= cs1.cnt
      AND cs1.store_name = cs2.store_name AND cs1.store_zip = cs2.store_zip
    ORDER BY cs1.product_name, cs1.store_name, cs2.cnt, cs1.s1, cs2.s1
- id: 65
  template: query65.tpl
  template_sha256: 4769a55171ba59d35d667d6b108a6d7d5e5723f704823e2a875474cf4604c838
  parameters:
    DMS:
    - 1
  sql: |-
    WITH sc AS (
      SELECT
        store_sk,
        item_sk,
        store_s_store_name,
        item_i_item_desc,
        item_i_current_price,
        item_i_wholesale_cost,
        item_i_brand,
        store_s_store_sk,
        item_i_item_sk,
        SUM(sales_price) AS revenue
      FROM tpcds_sales_returns_obt
      WHERE
        channel = 'store' AND sold_date_d_month_seq BETWEEN [DMS] AND [DMS] + 11
      GROUP BY
        store_sk,
        item_sk,
        store_s_store_name,
        item_i_item_desc,
        item_i_current_price,
        item_i_wholesale_cost,
        item_i_brand,
        store_s_store_sk,
        item_i_item_sk
    ), sb AS (
      SELECT
        store_sk,
        AVG(revenue) AS ave
      FROM sc
      GROUP BY
        store_sk
    )
    SELECT
      sc.store_s_store_name AS s_store_name,
      sc.item_i_item_desc AS i_item_desc,
      sc.revenue,
      sc.item_i_current_price AS i_current_price,
      sc.item_i_wholesale_cost AS i_wholesale_cost,
      sc.item_i_brand AS i_brand
    FROM sb
    JOIN sc
      ON sb.store_sk = sc.store_sk
    WHERE
      sc.revenue <= 0.1 * sb.ave
      AND sc.store_s_store_sk IS NOT NULL
      AND sc.item_i_item_sk IS NOT NULL
    ORDER BY
      s_store_name,
      i_item_desc
    LIMIT 100
- id: 66
  template: query66.tpl
  template_sha256: 83c4b13212c223c138c2f807f65b67371192a540acff4e4906b747ef4f0b7c13
  parameters:
    NETONE:
    - 1
    NETTWO:
    - 1
    SALESONE:
    - 1
    SALESTWO:
    - 1
    SMC:
    - 1
    - 2
    TIMEONE:
    - 1
    YEAR:
    - 1
  identifier_parameters:
  - NETONE
  - NETTWO
  - SALESONE
  - SALESTWO
  identifier_map:
    cs_ext_list_price: ext_list_price
    cs_ext_sales_price: ext_sales_price
    cs_net_paid: net_paid
    cs_net_paid_inc_ship: net_paid_inc_ship
    cs_net_paid_inc_ship_tax: net_paid_inc_ship_tax
    cs_net_paid_inc_tax: net_paid_inc_tax
    cs_net_profit: net_profit
    cs_sales_price: sales_price
    ws_ext_list_price: ext_list_price
    ws_ext_sales_price: ext_sales_price
    ws_net_paid: net_paid
    ws_net_paid_inc_ship: net_paid_inc_ship
    ws_net_paid_inc_ship_tax: net_paid_inc_ship_tax
    ws_net_paid_inc_tax: net_paid_inc_tax
    ws_net_profit: net_profit
    ws_sales_price: sales_price
  sql: |-
    SELECT
      warehouse_w_warehouse_name,
      warehouse_w_warehouse_sq_ft,
      warehouse_w_city,
      warehouse_w_county,
      warehouse_w_state,
      warehouse_w_country,
      ship_carriers,
      year,
      SUM(jan_sales) AS jan_sales,
      SUM(feb_sales) AS feb_sales,
      SUM(mar_sales) AS mar_sales,
      SUM(apr_sales) AS apr_sales,
      SUM(may_sales) AS may_sales,
      SUM(jun_sales) AS jun_sales,
      SUM(jul_sales) AS jul_sales,
      SUM(aug_sales) AS aug_sales,
      SUM(sep_sales) AS sep_sales,
      SUM(oct_sales) AS oct_sales,
      SUM(nov_sales) AS nov_sales,
      SUM(dec_sales) AS dec_sales,
      SUM(jan_sales / warehouse_w_warehouse_sq_ft) AS jan_sales_per_sq_foot,
      SUM(feb_sales / warehouse_w_warehouse_sq_ft) AS feb_sales_per_sq_foot,
      SUM(mar_sales / warehouse_w_warehouse_sq_ft) AS mar_sales_per_sq_foot,
      SUM(apr_sales / warehouse_w_warehouse_sq_ft) AS apr_sales_per_sq_foot,
      SUM(may_sales / warehouse_w_warehouse_sq_ft) AS may_sales_per_sq_foot,
      SUM(jun_sales / warehouse_w_warehouse_sq_ft) AS jun_sales_per_sq_foot,
      SUM(jul_sales / warehouse_w_warehouse_sq_ft) AS jul_sales_per_sq_foot,
      SUM(aug_sales / warehouse_w_warehouse_sq_ft) AS aug_sales_per_sq_foot,
      SUM(sep_sales / warehouse_w_warehouse_sq_ft) AS sep_sales_per_sq_foot,
