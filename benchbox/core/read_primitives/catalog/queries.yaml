- {"id": "approx_top_k_lineitem", "category": "topn", "sql": "\nSELECT APPROX_TOP_K(l_shipmode, 5) as top_shipmodes\nFROM lineitem;\n", "result_contract": {"capability": "approximate_top_k", "columns": [{"name": "top_shipmodes", "type_class": "array"}]}, "variants": {"clickhouse": "\nSELECT topK(5)(l_shipmode) as top_shipmodes\nFROM lineitem;\n", "doris": "\nSELECT TOPN_ARRAY(l_shipmode, 5) as top_shipmodes\nFROM lineitem;\n"}, "skip_on": ["redshift", "datafusion", "sqlite"]}
- {"id": "window_growing_frame", "category": "window", "sql": "\nSELECT\n    l_orderkey,\n    l_linenumber,\n    l_quantity,\n    SUM(l_quantity) OVER (\n        PARTITION BY l_orderkey\n        ORDER BY l_linenumber\n        ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\n    ) as running_quantity\nFROM lineitem\nWHERE l_orderkey <= 1000;\n"}
- {"id": "window_lead_lag_same_frame", "category": "window", "result_contract": {"capability": "window_offset_functions", "row_identity": ["o_orderkey"], "columns": ["o_orderkey", "o_orderdate", "o_totalprice", "prev_order_price", "next_order_price"]}, "sql": "\nSELECT\n    o_orderkey,\n    o_orderdate,\n    o_totalprice,\n    LAG(o_totalprice, 1) OVER (\n        PARTITION BY o_custkey\n        ORDER BY o_orderdate, o_orderkey\n    ) as prev_order_price,\n    LEAD(o_totalprice, 1) OVER (\n        PARTITION BY o_custkey\n        ORDER BY o_orderdate, o_orderkey\n    ) as next_order_price\nFROM orders\nWHERE o_orderdate >= DATE '1995-01-01'\n  AND o_orderdate < DATE '1996-01-01';\n", "variants": {"clickhouse": "\nSELECT\n    o_orderkey,\n    o_orderdate,\n    o_totalprice,\n    lag(o_totalprice, 1) OVER (\n        PARTITION BY o_custkey\n        ORDER BY o_orderdate, o_orderkey\n    ) as prev_order_price,\n    lead(o_totalprice, 1) OVER (\n        PARTITION BY o_custkey\n        ORDER BY o_orderdate, o_orderkey\n    ) as next_order_price\nFROM orders\nWHERE o_orderdate >= toDate('1995-01-01')\n  AND o_orderdate < toDate('1996-01-01');\n"}}
- {"id": "window_row_number", "category": "window", "sql": "\nSELECT\n    o_custkey,\n    o_orderkey,\n    o_totalprice,\n    ROW_NUMBER() OVER (\n        PARTITION BY o_custkey\n        ORDER BY o_totalprice DESC\n    ) as order_rank\nFROM orders\nWHERE o_orderdate >= DATE '1995-01-01'\n  AND o_orderdate < DATE '1996-01-01';\n"}
- {"id": "window_multiple_orderings", "category": "window", "sql": "\nSELECT\n    l_orderkey,\n    l_partkey,\n    l_quantity,\n    l_extendedprice,\n    DENSE_RANK() OVER (PARTITION BY l_orderkey ORDER BY l_extendedprice DESC) as price_rank,\n    PERCENT_RANK() OVER (PARTITION BY l_orderkey ORDER BY l_quantity) as quantity_percentile,\n    CUME_DIST() OVER (PARTITION BY l_orderkey ORDER BY l_extendedprice) as price_distribution\nFROM lineitem\nWHERE l_orderkey <= 10000\nORDER BY l_orderkey, price_rank;\n", "result_contract": {"capability": "window_rank_distribution", "columns": ["l_orderkey", "l_partkey", "l_quantity", "l_extendedprice", "price_rank", "quantity_percentile", "price_distribution"]}, "skip_on": ["clickhouse"], "variants": {"clickhouse": "\nSELECT *\nFROM (\n    SELECT\n        l_orderkey,\n        l_partkey,\n        l_quantity,\n        l_extendedprice,\n        dense_rank() OVER (PARTITION BY l_orderkey ORDER BY l_extendedprice DESC) as price_rank,\n        percent_rank() OVER (PARTITION BY l_orderkey ORDER BY l_quantity) as quantity_percentile,\n        cume_dist() OVER (PARTITION BY l_orderkey ORDER BY l_extendedprice) as price_distribution\n    FROM lineitem\n    WHERE l_orderkey <= 10000\n) t\nORDER BY l_orderkey, price_rank;\n"}}
- {"id": "window_moving_frame", "category": "window", "sql": "\nSELECT\n    o_orderkey,\n    o_orderdate,\n    o_totalprice,\n    AVG(o_totalprice) OVER (\n        ORDER BY o_orderdate, o_orderkey\n        ROWS BETWEEN 5 PRECEDING AND CURRENT ROW\n    ) as moving_avg_6_orders,\n    SUM(o_totalprice) OVER (\n        ORDER BY o_orderdate\n        RANGE BETWEEN INTERVAL '30' DAY PRECEDING AND CURRENT ROW\n    ) as monthly_running_total\nFROM orders\nWHERE o_orderdate >= DATE '1995-01-01'\n  AND o_orderdate < DATE '1996-01-01'\nORDER BY o_orderdate, o_orderkey;\n", "skip_on": ["clickhouse", "redshift"], "variants": {"bigquery": "SELECT o_orderkey, o_orderdate, o_totalprice,\n    AVG(o_totalprice) OVER (\n        ORDER BY o_orderdate, o_orderkey\n        ROWS BETWEEN 5 PRECEDING AND CURRENT ROW\n    ) AS moving_avg_6_orders,\n    SUM(o_totalprice) OVER (\n        ORDER BY UNIX_DATE(o_orderdate)\n        RANGE BETWEEN 30 PRECEDING AND CURRENT ROW\n    ) AS monthly_running_total\nFROM orders\nWHERE o_orderdate >= DATE '1995-01-01'\n  AND o_orderdate < DATE '1996-01-01'\nORDER BY o_orderdate, o_orderkey;", "sqlite": "\nSELECT\n    o_orderkey,\n    o_orderdate,\n    o_totalprice,\n    AVG(o_totalprice) OVER (\n        ORDER BY o_orderdate, o_orderkey\n        ROWS BETWEEN 5 PRECEDING AND CURRENT ROW\n    ) as moving_avg_6_orders,\n    SUM(o_totalprice) OVER (\n        ORDER BY julianday(o_orderdate)\n        RANGE BETWEEN 30 PRECEDING AND CURRENT ROW\n    ) as monthly_running_total\nFROM orders\nWHERE o_orderdate >= '1995-01-01'\n  AND o_orderdate < '1996-01-01'\nORDER BY o_orderdate, o_orderkey;\n"}, "result_contract": {"capability": "moving_row_and_date_range_windows", "row_identity": ["o_orderkey"], "columns": ["o_orderkey", "o_orderdate", "o_totalprice", "moving_avg_6_orders", "monthly_running_total"]}}
- {"id": "window_unbounded_frame", "category": "window", "sql": "\nSELECT\n    l_orderkey,\n    l_linenumber,\n    l_shipdate,\n    l_quantity,\n    FIRST_VALUE(l_quantity) OVER (\n        PARTITION BY l_orderkey\n        ORDER BY l_linenumber\n        ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING\n    ) as first_line_qty,\n    LAST_VALUE(l_quantity) OVER (\n        PARTITION BY l_orderkey\n        ORDER BY l_linenumber\n        ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING\n    ) as last_line_qty\nFROM lineitem\nWHERE l_orderkey BETWEEN 1 AND 5000;\n"}
- {"id": "json_extract_simple", "category": "json", "sql": "\nSELECT\n    o_orderkey,\n    JSON_EXTRACT(o_comment, '$.priority') as order_priority,\n    JSON_EXTRACT(o_comment, '$.notes') as order_notes\nFROM orders\nWHERE JSON_EXTRACT(o_comment, '$.priority') IS NOT NULL\nLIMIT 1000;\n", "skip_on": ["bigquery", "databricks", "datafusion", "duckdb", "redshift", "snowflake", "sqlite"], "description": "TPC-H o_comment contains plain text, not valid JSON", "variants": {}}
- {"id": "json_extract_nested", "category": "json", "sql": "\nSELECT\n    c_custkey,\n    JSON_EXTRACT(c_comment, '$.profile.segment') as customer_segment,\n    JSON_EXTRACT(c_comment, '$.profile.preferences[0]') as primary_preference,\n    JSON_EXTRACT(c_comment, '$.history.last_order.date') as last_order_date\nFROM customer\nWHERE JSON_VALID(c_comment)\nLIMIT 500;\n", "result_contract": {"capability": "json_nested_path_extraction", "row_identity": ["c_custkey"], "columns": ["c_custkey", {"name": "customer_segment", "type_class": "json"}, {"name": "primary_preference", "type_class": "json"}, {"name": "last_order_date", "type_class": "json"}]}, "variants": {"clickhouse": "\nSELECT\n    c_custkey,\n    JSONExtractRaw(c_comment, 'profile', 'segment') as customer_segment,\n    JSONExtractRaw(c_comment, 'profile', 'preferences', 1) as primary_preference,\n    JSONExtractRaw(c_comment, 'history', 'last_order', 'date') as last_order_date\nFROM customer\nWHERE isValidJSON(c_comment)\nLIMIT 500;\n", }, "skip_on": ["spark", "bigquery", "datafusion", "redshift", "snowflake", "databricks"], "description": "TPC-H c_comment contains plain text, not valid JSON"}
- {"id": "json_aggregates", "category": "json", "sql": "\nSELECT\n    p_brand,\n    JSON_ARRAYAGG(p_name) as part_names,\n    JSON_OBJECTAGG(p_partkey, p_retailprice) as part_prices,\n    COUNT(*) as part_count\nFROM part\nWHERE p_type LIKE '%STEEL%'\nGROUP BY p_brand\nORDER BY p_brand\nLIMIT 100;\n", "result_contract": {"capability": "json_array_object_aggregation", "row_identity": ["p_brand"], "columns": ["p_brand", {"name": "part_names", "type_class": "json"}, {"name": "part_prices", "type_class": "json"}, "part_count"]}, "variants": {"spark": "\nSELECT\n    p_brand,\n    to_json(collect_list(p_name)) as part_names,\n    to_json(map_from_entries(collect_list(struct(CAST(p_partkey AS STRING), p_retailprice)))) as part_prices,\n    COUNT(*) as part_count\nFROM part\nWHERE p_type LIKE '%STEEL%'\nGROUP BY p_brand\nORDER BY p_brand\nLIMIT 100;\n", "duckdb": "\nSELECT\n    p_brand,\n    JSON_GROUP_ARRAY(p_name) as part_names,\n    JSON_GROUP_OBJECT(p_partkey, p_retailprice) as part_prices,\n    COUNT(*) as part_count\nFROM part\nWHERE p_type LIKE '%STEEL%'\nGROUP BY p_brand\nORDER BY p_brand\nLIMIT 100;\n", "clickhouse": "\nSELECT\n    p_brand,\n    toJSONString(groupArray(p_name)) as part_names,\n    toJSONString(mapFromArrays(groupArray(p_partkey), groupArray(p_retailprice))) as part_prices,\n    COUNT(*) as part_count\nFROM part\nWHERE p_type LIKE '%STEEL%'\nGROUP BY p_brand\nORDER BY p_brand\nLIMIT 100;\n", "snowflake": "SELECT p_brand,\n    TO_JSON(ARRAY_AGG(p_name)) AS part_names,\n    TO_JSON(OBJECT_AGG(TO_VARCHAR(p_partkey), TO_VARIANT(p_retailprice))) AS part_prices,\n    COUNT(*) AS part_count\nFROM part\nWHERE p_type LIKE '%STEEL%'\nGROUP BY p_brand\nORDER BY p_brand\nLIMIT 100;", "bigquery": "SELECT p_brand,\n    TO_JSON_STRING(ARRAY_AGG(p_name ORDER BY p_partkey)) AS part_names,\n    TO_JSON_STRING(JSON_OBJECT(ARRAY_AGG(CAST(p_partkey AS STRING) ORDER BY p_partkey), ARRAY_AGG(p_retailprice ORDER BY p_partkey))) AS part_prices,\n    COUNT(*) AS part_count\nFROM part\nWHERE p_type LIKE '%STEEL%'\nGROUP BY p_brand\nORDER BY p_brand\nLIMIT 100;", "sqlite": "\nSELECT\n    p_brand,\n    JSON_GROUP_ARRAY(p_name) as part_names,\n    JSON_GROUP_OBJECT(CAST(p_partkey AS TEXT), p_retailprice) as part_prices,\n    COUNT(*) as part_count\nFROM part\nWHERE p_type LIKE '%STEEL%'\nGROUP BY p_brand\nORDER BY p_brand\nLIMIT 100;\n", "doris": "\nSELECT\n    p_brand,\n    TO_JSON(COLLECT_LIST(p_name)) as part_names,\n    TO_JSON(MAP_AGG(CAST(p_partkey AS STRING), p_retailprice)) as part_prices,\n    COUNT(*) as part_count\nFROM part\nWHERE p_type LIKE '%STEEL%'\nGROUP BY p_brand\nORDER BY p_brand\nLIMIT 100;\n"}, "skip_on": ["datafusion", "redshift", "databricks"]}
- {"id": "fulltext_simple_search", "category": "fulltext", "sql": "\nSELECT\n    p_partkey,\n    p_name,\n    p_mfgr,\n    p_comment\nFROM part\nWHERE MATCH(p_name, p_comment) AGAINST ('STEEL COPPER' IN NATURAL LANGUAGE MODE)\nLIMIT 100;\n", "skip_on": ["spark", "bigquery", "clickhouse", "datafusion", "databricks", "duckdb", "redshift", "snowflake", "sqlite"], "description": "SQLite has no MATCH AGAINST; FTS5 requires a separate virtual table"}
- {"id": "fulltext_boolean_search", "category": "fulltext", "sql": "\nSELECT\n    c_custkey,\n    c_name,\n    c_comment,\n    MATCH(c_comment) AGAINST ('+BUILDING -FURNITURE' IN BOOLEAN MODE) as relevance_score\nFROM customer\nWHERE MATCH(c_comment) AGAINST ('+BUILDING -FURNITURE' IN BOOLEAN MODE)\nORDER BY relevance_score DESC\nLIMIT 50;\n", "skip_on": ["spark", "bigquery", "clickhouse", "datafusion", "databricks", "duckdb", "redshift", "snowflake", "sqlite"], "description": "SQLite has no MATCH AGAINST; FTS5 requires a separate virtual table"}
- {"id": "fulltext_phrase_search", "category": "fulltext", "sql": "\nSELECT\n    s_suppkey,\n    s_name,\n    s_comment,\n    MATCH(s_comment) AGAINST ('\"Customer Complaints\"' IN BOOLEAN MODE) as phrase_match_score\nFROM supplier\nWHERE MATCH(s_comment) AGAINST ('\"Customer Complaints\"' IN BOOLEAN MODE)\nORDER BY phrase_match_score DESC;\n", "skip_on": ["spark", "bigquery", "clickhouse", "datafusion", "databricks", "duckdb", "redshift", "snowflake", "sqlite"], "description": "SQLite has no MATCH AGAINST; FTS5 requires a separate virtual table"}
- {"id": "statistical_percentiles", "category": "statistical", "sql": "\nSELECT\n    l_returnflag,\n    l_linestatus,\n    COUNT(*) as record_count,\n    PERCENTILE_CONT(0.25) WITHIN GROUP (ORDER BY l_quantity) as quantity_q1,\n    PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY l_quantity) as quantity_median,\n    PERCENTILE_CONT(0.75) WITHIN GROUP (ORDER BY l_quantity) as quantity_q3,\n    PERCENTILE_CONT(0.95) WITHIN GROUP (ORDER BY l_extendedprice) as price_p95\nFROM lineitem\nGROUP BY l_returnflag, l_linestatus;\n", "result_contract": {"capability": "exact_continuous_percentiles", "row_identity": ["l_returnflag", "l_linestatus"], "columns": ["l_returnflag", "l_linestatus", "record_count", "quantity_q1", "quantity_median", "quantity_q3", "price_p95"]}, "variants": {"redshift": "\nSELECT DISTINCT\n    l_returnflag,\n    l_linestatus,\n    COUNT(*) OVER (PARTITION BY l_returnflag, l_linestatus) as record_count,\n    PERCENTILE_CONT(0.25) WITHIN GROUP (ORDER BY l_quantity) OVER (PARTITION BY l_returnflag, l_linestatus) as quantity_q1,\n    PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY l_quantity) OVER (PARTITION BY l_returnflag, l_linestatus) as quantity_median,\n    PERCENTILE_CONT(0.75) WITHIN GROUP (ORDER BY l_quantity) OVER (PARTITION BY l_returnflag, l_linestatus) as quantity_q3,\n    PERCENTILE_CONT(0.95) WITHIN GROUP (ORDER BY l_extendedprice) OVER (PARTITION BY l_returnflag, l_linestatus) as price_p95\nFROM lineitem;\n", "bigquery": "SELECT DISTINCT l_returnflag, l_linestatus,\n    COUNT(*) OVER (PARTITION BY l_returnflag, l_linestatus) AS record_count,\n    PERCENTILE_CONT(l_quantity, 0.25) OVER (PARTITION BY l_returnflag, l_linestatus) AS quantity_q1,\n    PERCENTILE_CONT(l_quantity, 0.5) OVER (PARTITION BY l_returnflag, l_linestatus) AS quantity_median,\n    PERCENTILE_CONT(l_quantity, 0.75) OVER (PARTITION BY l_returnflag, l_linestatus) AS quantity_q3,\n    PERCENTILE_CONT(l_extendedprice, 0.95) OVER (PARTITION BY l_returnflag, l_linestatus) AS price_p95\nFROM lineitem;", "sqlite": "\nSELECT\n    l_returnflag,\n    l_linestatus,\n    COUNT(*) as record_count,\n    PERCENTILE_CONT(0.25, l_quantity) as quantity_q1,\n    PERCENTILE_CONT(0.5, l_quantity) as quantity_median,\n    PERCENTILE_CONT(0.75, l_quantity) as quantity_q3,\n    PERCENTILE_CONT(0.95, l_extendedprice) as price_p95\nFROM lineitem\nGROUP BY l_returnflag, l_linestatus;\n", "doris": "\nSELECT\n    l_returnflag,\n    l_linestatus,\n    COUNT(*) as record_count,\n    PERCENTILE(l_quantity, 0.25) as quantity_q1,\n    PERCENTILE(l_quantity, 0.5) as quantity_median,\n    PERCENTILE(l_quantity, 0.75) as quantity_q3,\n    PERCENTILE(l_extendedprice, 0.95) as price_p95\nFROM lineitem\nGROUP BY l_returnflag, l_linestatus;\n"}, "skip_on": ["clickhouse"]}
- {"id": "approx_quantiles_array", "category": "statistical", "sql": "\nSELECT\n    l_returnflag,\n    l_linestatus,\n    APPROX_QUANTILE(l_quantity, [0.25, 0.5, 0.75, 0.95]) as quantity_quantiles\nFROM lineitem\nGROUP BY l_returnflag, l_linestatus;\n", "result_contract": {"capability": "approximate_quantile_array", "row_identity": ["l_returnflag", "l_linestatus"], "columns": ["l_returnflag", "l_linestatus", {"name": "quantity_quantiles", "type_class": "array"}]}, "variants": {"bigquery": "\nSELECT\n    l_returnflag,\n    l_linestatus,\n    [\n      APPROX_QUANTILES(l_quantity, 100)[OFFSET(25)],\n      APPROX_QUANTILES(l_quantity, 100)[OFFSET(50)],\n      APPROX_QUANTILES(l_quantity, 100)[OFFSET(75)],\n      APPROX_QUANTILES(l_quantity, 100)[OFFSET(95)]\n    ] as quantity_quantiles\nFROM lineitem\nGROUP BY l_returnflag, l_linestatus;\n", "clickhouse": "\nSELECT\n    l_returnflag,\n    l_linestatus,\n    quantilesTDigest(0.25, 0.5, 0.75, 0.95)(toFloat64(l_quantity)) as quantity_quantiles\nFROM lineitem\nGROUP BY l_returnflag, l_linestatus;\n", "snowflake": "\nSELECT\n    l_returnflag,\n    l_linestatus,\n    ARRAY_CONSTRUCT(\n      APPROX_PERCENTILE(l_quantity, 0.25),\n      APPROX_PERCENTILE(l_quantity, 0.5),\n      APPROX_PERCENTILE(l_quantity, 0.75),\n      APPROX_PERCENTILE(l_quantity, 0.95)\n    ) as quantity_quantiles\nFROM lineitem\nGROUP BY l_returnflag, l_linestatus;\n", "doris": "\nSELECT\n    l_returnflag,\n    l_linestatus,\n    PERCENTILE_ARRAY(l_quantity, [0.25, 0.5, 0.75, 0.95]) as quantity_quantiles\nFROM lineitem\nGROUP BY l_returnflag, l_linestatus;\n"}, "skip_on": ["redshift", "datafusion", "sqlite"]}
- {"id": "statistical_variance_stddev", "category": "statistical", "sql": "\nSELECT\n    o_orderpriority,\n    COUNT(*) as order_count,\n    AVG(o_totalprice) as avg_price,\n    VARIANCE(o_totalprice) as price_variance,\n    STDDEV(o_totalprice) as price_stddev,\n    STDDEV_POP(o_totalprice) as price_stddev_pop,\n    STDDEV_SAMP(o_totalprice) as price_stddev_samp\nFROM orders\nWHERE o_orderdate >= DATE '1995-01-01'\nGROUP BY o_orderpriority;\n", "result_contract": {"capability": "variance_stddev_aggregates", "row_identity": ["o_orderpriority"], "columns": ["o_orderpriority", "order_count", "avg_price", "price_variance", "price_stddev", "price_stddev_pop", "price_stddev_samp"]}, "variants": {"sqlite": "\nWITH s AS (\n    SELECT\n        o_orderpriority,\n        CAST(COUNT(*) AS REAL) as n,\n        AVG(o_totalprice) as mean_price,\n        AVG(o_totalprice * o_totalprice) as mean_square\n    FROM orders\n    WHERE o_orderdate >= '1995-01-01'\n    GROUP BY o_orderpriority\n)\nSELECT\n    o_orderpriority,\n    CAST(n AS INTEGER) as order_count,\n    mean_price as avg_price,\n    MAX(0.0, mean_square - mean_price * mean_price) * n / NULLIF(n - 1, 0) as price_variance,\n    SQRT(MAX(0.0, mean_square - mean_price * mean_price) * n / NULLIF(n - 1, 0)) as price_stddev,\n    SQRT(MAX(0.0, mean_square - mean_price * mean_price)) as price_stddev_pop,\n    SQRT(MAX(0.0, mean_square - mean_price * mean_price) * n / NULLIF(n - 1, 0)) as price_stddev_samp\nFROM s;\n"}}
- {"id": "statistical_correlation", "category": "statistical", "skip_on": ["redshift"], "sql": "\nSELECT\n    CORR(l_quantity, l_extendedprice) as qty_price_correlation,\n    COVAR_POP(l_quantity, l_discount) as qty_discount_covariance,\n    COVAR_SAMP(l_tax, l_extendedprice) as tax_price_covariance,\n    REGR_SLOPE(l_extendedprice, l_quantity) as price_qty_slope,\n    REGR_INTERCEPT(l_extendedprice, l_quantity) as price_qty_intercept,\n    REGR_R2(l_extendedprice, l_quantity) as regression_r_squared\nFROM lineitem\nWHERE l_shipdate >= DATE '1995-01-01'\n  AND l_shipdate < DATE '1996-01-01';\n", "result_contract": {"capability": "correlation_covariance_regression", "columns": ["qty_price_correlation", "qty_discount_covariance", "tax_price_covariance", "price_qty_slope", "price_qty_intercept", "regression_r_squared"]}, "variants": {"clickhouse": "\nSELECT\n    corr(toFloat64(l_quantity), toFloat64(l_extendedprice)) as qty_price_correlation,\n    covarPop(toFloat64(l_quantity), toFloat64(l_discount)) as qty_discount_covariance,\n    covarSamp(toFloat64(l_tax), toFloat64(l_extendedprice)) as tax_price_covariance,\n    corr(toFloat64(l_extendedprice), toFloat64(l_quantity)) * stddevSamp(toFloat64(l_extendedprice)) / nullif(stddevSamp(toFloat64(l_quantity)), 0) as price_qty_slope,\n    avg(toFloat64(l_extendedprice)) - corr(toFloat64(l_extendedprice), toFloat64(l_quantity)) * stddevSamp(toFloat64(l_extendedprice)) / nullif(stddevSamp(toFloat64(l_quantity)), 0) * avg(toFloat64(l_quantity)) as price_qty_intercept,\n    pow(corr(toFloat64(l_extendedprice), toFloat64(l_quantity)), 2) as regression_r_squared\nFROM lineitem\nWHERE l_shipdate >= toDate('1995-01-01')\n  AND l_shipdate < toDate('1996-01-01');\n", "bigquery": "SELECT\n    CORR(l_quantity, l_extendedprice) AS qty_price_correlation,\n    COVAR_POP(l_quantity, l_discount) AS qty_discount_covariance,\n    COVAR_SAMP(l_tax, l_extendedprice) AS tax_price_covariance,\n    COVAR_POP(l_extendedprice, l_quantity) / NULLIF(VAR_POP(l_quantity), 0) AS price_qty_slope,\n    AVG(l_extendedprice) -\n        COVAR_POP(l_extendedprice, l_quantity) / NULLIF(VAR_POP(l_quantity), 0) * AVG(l_quantity)\n        AS price_qty_intercept,\n    CASE\n        WHEN VAR_POP(l_quantity) = 0 THEN NULL\n        WHEN VAR_POP(l_extendedprice) = 0 THEN 1\n        ELSE POW(CORR(l_extendedprice, l_quantity), 2)\n    END AS regression_r_squared\nFROM lineitem\nWHERE l_shipdate >= DATE '1995-01-01'\n  AND l_shipdate < DATE '1996-01-01';", "sqlite": "\nWITH s AS (\n    SELECT\n        CAST(COUNT(*) AS REAL) as n,\n        AVG(l_quantity) as mx,\n        AVG(l_extendedprice) as my,\n        AVG(l_discount) as md,\n        AVG(l_tax) as mt,\n        AVG(l_quantity * l_quantity) as xx,\n        AVG(l_extendedprice * l_extendedprice) as yy,\n        AVG(l_quantity * l_extendedprice) as xy,\n        AVG(l_quantity * l_discount) as xd,\n        AVG(l_tax * l_extendedprice) as ty\n    FROM lineitem\n    WHERE l_shipdate >= '1995-01-01'\n      AND l_shipdate < '1996-01-01'\n)\nSELECT\n    (xy - mx * my) / NULLIF(SQRT((xx - mx * mx) * (yy - my * my)), 0) as qty_price_correlation,\n    xd - mx * md as qty_discount_covariance,\n    (ty - mt * my) * n / NULLIF(n - 1, 0) as tax_price_covariance,\n    (xy - mx * my) / NULLIF(xx - mx * mx, 0) as price_qty_slope,\n    my - (xy - mx * my) / NULLIF(xx - mx * mx, 0) * mx as price_qty_intercept,\n    (xy - mx * my) * (xy - mx * my) / NULLIF((xx - mx * mx) * (yy - my * my), 0) as regression_r_squared\nFROM s;\n", "doris": "\nSELECT\n    CORR(l_quantity, l_extendedprice) as qty_price_correlation,\n    COVAR_POP(l_quantity, l_discount) as qty_discount_covariance,\n    COVAR_SAMP(l_tax, l_extendedprice) as tax_price_covariance,\n    REGR_SLOPE(l_extendedprice, l_quantity) as price_qty_slope,\n    REGR_INTERCEPT(l_extendedprice, l_quantity) as price_qty_intercept,\n    POWER(CORR(l_extendedprice, l_quantity), 2) as regression_r_squared\nFROM lineitem\nWHERE l_shipdate >= DATE '1995-01-01'\n  AND l_shipdate < DATE '1996-01-01';\n"}}
- {"id": "olap_cube_analysis", "category": "olap", "sql": "\nSELECT\n    n.n_name as nation,\n    r.r_name as region,\n    EXTRACT(YEAR FROM o.o_orderdate) as order_year,\n    EXTRACT(QUARTER FROM o.o_orderdate) as order_quarter,\n    COUNT(*) as order_count,\n    SUM(o.o_totalprice) as total_revenue,\n    AVG(o.o_totalprice) as avg_order_value\nFROM orders o\nJOIN customer c ON o.o_custkey = c.c_custkey\nJOIN nation n ON c.c_nationkey = n.n_nationkey\nJOIN region r ON n.n_regionkey = r.r_regionkey\nWHERE o.o_orderdate >= DATE '1995-01-01'\n  AND o.o_orderdate < DATE '1997-01-01'\nGROUP BY CUBE(n.n_name, r.r_name,\n              EXTRACT(YEAR FROM o.o_orderdate),\n              EXTRACT(QUARTER FROM o.o_orderdate));\n", "variants": {"sqlite": "\nWITH base AS MATERIALIZED (\n  SELECT\n    n.n_name AS nation,\n    r.r_name AS region,\n    CAST(strftime('%Y', o.o_orderdate) AS INTEGER) AS order_year,\n    (CAST(strftime('%m', o.o_orderdate) AS INTEGER) + 2) / 3 AS order_quarter,\n    o.o_totalprice AS o_totalprice\n  FROM orders o\n  JOIN customer c ON o.o_custkey = c.c_custkey\n  JOIN nation n ON c.c_nationkey = n.n_nationkey\n  JOIN region r ON n.n_regionkey = r.r_regionkey\n  WHERE o.o_orderdate >= '1995-01-01'\n    AND o.o_orderdate < '1997-01-01'\n)\nSELECT NULL AS nation, NULL AS region, NULL AS order_year, NULL AS order_quarter, COUNT(*) AS order_count, SUM(o_totalprice) AS total_revenue, AVG(o_totalprice) AS avg_order_value FROM base\nUNION ALL\nSELECT nation, NULL AS region, NULL AS order_year, NULL AS order_quarter, COUNT(*) AS order_count, SUM(o_totalprice) AS total_revenue, AVG(o_totalprice) AS avg_order_value FROM base GROUP BY nation\nUNION ALL\nSELECT NULL AS nation, region, NULL AS order_year, NULL AS order_quarter, COUNT(*) AS order_count, SUM(o_totalprice) AS total_revenue, AVG(o_totalprice) AS avg_order_value FROM base GROUP BY region\nUNION ALL\nSELECT nation, region, NULL AS order_year, NULL AS order_quarter, COUNT(*) AS order_count, SUM(o_totalprice