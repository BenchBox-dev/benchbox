- {"id": "qualify_row_number", "category": "qualify", "sql": "\nSELECT\n    c_custkey,\n    c_name,\n    o_orderkey,\n    o_orderdate,\n    o_totalprice,\n    ROW_NUMBER() OVER (PARTITION BY c_custkey ORDER BY o_totalprice DESC) as order_rank\nFROM customer c\nJOIN orders o ON c.c_custkey = o.o_custkey\nWHERE o_orderdate >= DATE '1995-01-01'\nQUALIFY ROW_NUMBER() OVER (PARTITION BY c_custkey ORDER BY o_totalprice DESC) <= 3\nORDER BY c_custkey, order_rank;\n"}
- {"id": "qualify_dense_rank", "category": "qualify", "sql": "\nSELECT\n    p_type,\n    p_name,\n    p_retailprice,\n    DENSE_RANK() OVER (PARTITION BY p_type ORDER BY p_retailprice DESC) as price_rank\nFROM part\nQUALIFY DENSE_RANK() OVER (PARTITION BY p_type ORDER BY p_retailprice DESC) <= 2\nORDER BY p_type, price_rank, p_name;\n", "result_contract": {"capability": "qualify_dense_rank_filter", "row_identity": ["p_type", "p_name", "p_retailprice"], "columns": ["p_type", "p_name", "p_retailprice", "price_rank"]}, "variants": {"redshift": "\nSELECT p_type, p_name, p_retailprice, price_rank\nFROM (\n    SELECT\n        p_type,\n        p_name,\n        p_retailprice,\n        DENSE_RANK() OVER (PARTITION BY p_type ORDER BY p_retailprice DESC) as price_rank\n    FROM part\n) ranked\nWHERE price_rank <= 2\nORDER BY p_type, price_rank, p_name;\n"}}
- {"id": "qualify_percentile", "category": "qualify", "sql": "\nSELECT\n    o_orderpriority,\n    o_orderkey,\n    o_totalprice,\n    PERCENT_RANK() OVER (PARTITION BY o_orderpriority ORDER BY o_totalprice) as price_percentile\nFROM orders\nWHERE o_orderdate >= DATE '1995-01-01'\nQUALIFY PERCENT_RANK() OVER (PARTITION BY o_orderpriority ORDER BY o_totalprice) >= 0.9\nORDER BY o_orderpriority, o_totalprice DESC;\n"}
- {"id": "qualify_ntile", "category": "qualify", "sql": "\nSELECT\n    c_mktsegment,\n    o_orderkey,\n    o_totalprice,\n    NTILE(4) OVER (PARTITION BY c_mktsegment ORDER BY o_totalprice, o_orderkey) as quartile\nFROM orders o\nJOIN customer c ON o.o_custkey = c.c_custkey\nWHERE o_orderdate >= DATE '1995-01-01'\nQUALIFY NTILE(4) OVER (PARTITION BY c_mktsegment ORDER BY o_totalprice, o_orderkey) = 4\nORDER BY c_mktsegment, o_totalprice DESC, o_orderkey DESC;\n"}
- {"id": "qualify_cume_dist", "category": "qualify", "skip_on": ["clickhouse"], "sql": "\nSELECT\n    l_shipdate,\n    l_orderkey,\n    l_linenumber,\n    l_quantity,\n    CUME_DIST() OVER (PARTITION BY l_shipdate ORDER BY l_quantity) as quantity_cumulative_dist\nFROM lineitem\nWHERE l_shipdate >= DATE '1995-01-01'\n  AND l_shipdate < DATE '1996-01-01'\nQUALIFY CUME_DIST() OVER (PARTITION BY l_shipdate ORDER BY l_quantity) >= 0.95\nORDER BY l_shipdate, l_quantity DESC, l_orderkey, l_linenumber;\n", "result_contract": {"capability": "qualify_cume_dist_filter", "row_identity": ["l_shipdate", "l_orderkey", "l_linenumber"], "columns": ["l_shipdate", "l_orderkey", "l_linenumber", "l_quantity", "quantity_cumulative_dist"]}, "variants": {"clickhouse": "\nSELECT l_shipdate, l_orderkey, l_linenumber, l_quantity, quantity_cumulative_dist\nFROM (\n  SELECT\n      l_shipdate,\n      l_orderkey,\n      l_linenumber,\n      l_quantity,\n      cume_dist() OVER (PARTITION BY l_shipdate ORDER BY l_quantity) as quantity_cumulative_dist\n  FROM lineitem\n  WHERE l_shipdate >= toDate('1995-01-01')\n    AND l_shipdate < toDate('1996-01-01')\n) t\nWHERE quantity_cumulative_dist >= 0.95\nORDER BY l_shipdate, l_quantity DESC, l_orderkey, l_linenumber;\n"}}
- {"id": "qualify_lag_lead", "category": "qualify", "sql": "\nSELECT\n    c_custkey,\n    c_name,\n    o_orderkey,\n    o_orderdate,\n    o_totalprice,\n    LAG(o_totalprice) OVER (PARTITION BY c_custkey ORDER BY o_orderdate, o_orderkey) as prev_order_price\nFROM customer c\nJOIN orders o ON c.c_custkey = o.o_custkey\nWHERE o_orderdate >= DATE '1995-01-01'\nQUALIFY o_totalprice > LAG(o_totalprice) OVER (PARTITION BY c_custkey ORDER BY o_orderdate, o_orderkey)\nORDER BY c_custkey, o_orderdate, o_orderkey;\n"}
- {"id": "optimizer_exists_to_semijoin", "category": "optimizer", "sql": "\nSELECT\n    c_custkey,\n    c_name,\n    c_mktsegment,\n    c_nationkey\nFROM customer c\nWHERE EXISTS (\n    SELECT 1 \n    FROM orders o \n    WHERE o.o_custkey = c.c_custkey \n      AND o.o_orderdate >= DATE '1995-01-01'\n      AND o.o_orderdate < DATE '1996-01-01'\n      AND o.o_totalprice > 100000\n)\nORDER BY c_custkey\nLIMIT 1000;\n"}
- {"id": "optimizer_distinct_elimination", "category": "optimizer", "sql": "\nSELECT DISTINCT\n    o_orderkey,\n    o_custkey,\n    o_orderdate,\n    o_totalprice\nFROM orders o\nWHERE o_orderdate >= DATE '1995-01-01'\n  AND o_orderdate < DATE '1996-01-01'\n  AND o_totalprice > 50000\nORDER BY o_orderkey\nLIMIT 2000;\n"}
- {"id": "optimizer_common_subexpression", "category": "optimizer", "sql": "\nSELECT\n    l_orderkey,\n    l_partkey,\n    l_suppkey,\n    l_linenumber,\n    l_quantity * l_extendedprice * (1 - l_discount) * (1 + l_tax) as revenue_with_tax,\n    CASE \n        WHEN l_quantity * l_extendedprice * (1 - l_discount) * (1 + l_tax) > 50000 THEN 'High Value'\n        WHEN l_quantity * l_extendedprice * (1 - l_discount) * (1 + l_tax) > 10000 THEN 'Medium Value'\n        ELSE 'Low Value'\n    END as value_category,\n    ROUND(l_quantity * l_extendedprice * (1 - l_discount) * (1 + l_tax), 2) as rounded_revenue\nFROM lineitem\nWHERE l_shipdate >= DATE '1995-01-01'\n  AND l_shipdate < DATE '1996-01-01'\n  AND l_quantity * l_extendedprice * (1 - l_discount) * (1 + l_tax) > 1000\nORDER BY l_quantity * l_extendedprice * (1 - l_discount) * (1 + l_tax) DESC, l_orderkey, l_linenumber\nLIMIT 5000;\n"}
- {"id": "optimizer_predicate_pushdown", "category": "optimizer", "sql": "\nSELECT\n    c.c_name,\n    c.c_mktsegment,\n    o.o_orderdate,\n    o.o_totalprice\nFROM customer c\nJOIN orders o ON c.c_custkey = o.o_custkey\nWHERE c.c_nationkey = 15\n  AND o.o_orderdate >= DATE '1995-01-01'\n  AND o.o_orderdate < DATE '1996-01-01'\n  AND c.c_mktsegment = 'BUILDING'\nORDER BY o.o_totalprice DESC\nLIMIT 1000;\n"}
- {"id": "optimizer_join_reordering", "category": "optimizer", "sql": "\nSELECT\n    n.n_name,\n    c.c_name,\n    COUNT(o.o_orderkey) as order_count,\n    SUM(o.o_totalprice) as total_value\nFROM orders o\nJOIN customer c ON o.o_custkey = c.c_custkey\nJOIN nation n ON c.c_nationkey = n.n_nationkey\nWHERE n.n_regionkey = 1\n  AND o.o_orderdate >= DATE '1995-01-01'\n  AND o.o_orderdate < DATE '1996-01-01'\nGROUP BY n.n_name, c.c_name\nHAVING COUNT(o.o_orderkey) > 5\nORDER BY total_value DESC\nLIMIT 100;\n"}
- {"id": "optimizer_limit_pushdown", "category": "optimizer", "sql": "\nSELECT\n    c.c_name,\n    c.c_mktsegment,\n    o.o_orderdate,\n    o.o_totalprice,\n    o.o_orderpriority\nFROM customer c\nJOIN orders o ON c.c_custkey = o.o_custkey\nWHERE c.c_mktsegment = 'BUILDING'\n  AND o.o_orderdate >= DATE '1995-01-01'\n  AND o.o_orderdate < DATE '1996-01-01'\nORDER BY o.o_totalprice DESC\nLIMIT 100;\n"}
- {"id": "optimizer_aggregate_pushdown", "category": "optimizer", "sql": "\nSELECT\n    c.c_name,\n    c.c_mktsegment,\n    c.c_nationkey,\n    COUNT(o.o_orderkey) as order_count,\n    SUM(o.o_totalprice) as total_spent,\n    AVG(o.o_totalprice) as avg_order_value\nFROM customer c\nJOIN orders o ON c.c_custkey = o.o_custkey\nWHERE c.c_nationkey = 15\n  AND o.o_orderdate >= DATE '1995-01-01'\n  AND o.o_orderdate < DATE '1996-01-01'\nGROUP BY c.c_custkey, c.c_name, c.c_mktsegment, c.c_nationkey\nHAVING SUM(o.o_totalprice) > 500000\nORDER BY total_spent DESC\nLIMIT 50;\n"}
- {"id": "optimizer_scalar_subquery_flattening", "category": "optimizer", "sql": "\nSELECT\n    c.c_name,\n    c.c_mktsegment,\n    c.c_acctbal,\n    (SELECT AVG(o.o_totalprice) \n     FROM orders o \n     WHERE o.o_custkey = c.c_custkey \n       AND o.o_orderdate >= DATE '1995-01-01') as avg_order_value,\n    (SELECT COUNT(o.o_orderkey)\n     FROM orders o \n     WHERE o.o_custkey = c.c_custkey \n       AND o.o_orderdate >= DATE '1995-01-01') as order_count\nFROM customer c\nWHERE c.c_nationkey = 15\n  AND c.c_acctbal > 5000\nORDER BY avg_order_value DESC, c.c_name\nLIMIT 100;\n", "skip_on": ["clickhouse", "datafusion", "snowflake"], "description": "ClickHouse and DataFusion do not support correlated subqueries (ClickHouse: NOT_IMPLEMENTED Code 48; DataFusion: planner rejects). The point of this query is to measure the optimizer's ability to auto-flatten correlated scalar subqueries into joins, so a pre-flattened LEFT JOIN rewrite would only measure plain join execution and defeat the test. Snowflake rejects this correlated scalar shape with internal error 000603; the query measures optimizer flattening, so a pre-flattened join is not a comparable replacement.", "result_contract": {"capability": "scalar_subquery_flattening", "row_identity": ["c_name", "c_mktsegment", "c_acctbal"], "columns": ["c_name", "c_mktsegment", "c_acctbal", "avg_order_value", "order_count"]}, "variants": {"doris": "\nSELECT\n    c.c_name,\n    c.c_mktsegment,\n    c.c_acctbal,\n    (SELECT AVG(o.o_totalprice)\n     FROM orders o\n     WHERE o.o_custkey = c.c_custkey\n       AND o.o_orderdate >= DATE '1995-01-01') as avg_order_value,\n    (SELECT COUNT(o.o_orderkey)\n     FROM orders o\n     WHERE o.o_custkey = c.c_custkey\n       AND o.o_orderdate >= DATE '1995-01-01') as order_count\nFROM customer c\nWHERE c.c_nationkey = 15\n  AND c.c_acctbal > 5000\nORDER BY avg_order_value DESC, c.c_name\nLIMIT 100;\n"}}
- {"id": "optimizer_constant_folding", "category": "optimizer", "sql": "\nSELECT\n    l_orderkey,\n    l_partkey,\n    l_suppkey,\n    l_linenumber,\n    l_quantity * (1.0 + 0.0) as simplified_qty,\n    l_extendedprice * (2 * 3 + 4) as constant_folded,\n    l_discount + 0.0 - 0.0 as zero_folded,\n    CASE WHEN 1 = 1 THEN l_tax ELSE 0 END as condition_folded,\n    l_quantity / 1.0 as division_folded,\n    l_extendedprice + (5 - 5) as addition_folded\nFROM lineitem\nWHERE l_quantity * 1 > 10\n  AND l_shipdate >= DATE '1995-01-01'\n  AND l_discount + 0 < 0.1\nORDER BY l_quantity * (1 + 0) DESC, l_orderkey, l_linenumber\nLIMIT 1000;\n"}
- {"id": "optimizer_column_pruning", "category": "optimizer", "sql": "\nSELECT\n    c.c_name\nFROM customer c\nJOIN orders o ON c.c_custkey = o.o_custkey\nJOIN lineitem l ON o.o_orderkey = l.l_orderkey\nWHERE o.o_orderdate >= DATE '1995-01-01'\n  AND o.o_orderdate < DATE '1996-01-01'\n  AND l.l_quantity > 40\n  AND c.c_nationkey = 15\nORDER BY c.c_name\nLIMIT 500;\n"}
- {"id": "optimizer_in_to_exists", "category": "optimizer", "sql": "\nSELECT\n    c.c_name,\n    c.c_mktsegment,\n    c.c_nationkey,\n    c.c_acctbal\nFROM customer c\nWHERE c.c_custkey IN (\n    SELECT o.o_custkey\n    FROM orders o\n    WHERE o.o_orderdate >= DATE '1995-01-01'\n      AND o.o_orderdate < DATE '1996-01-01'\n      AND o.o_totalprice > 100000\n)\n  AND c.c_nationkey IN (1, 2, 3, 4, 5)\nORDER BY c.c_acctbal DESC\nLIMIT 200;\n"}
- {"id": "optimizer_union_optimization", "category": "optimizer", "sql": "\nSELECT c_name, c_mktsegment, 'high_value' as customer_type, c_acctbal\nFROM customer\nWHERE c_acctbal > 8000\n  AND c_nationkey IN (1, 2, 3)\nUNION ALL\nSELECT c_name, c_mktsegment, 'medium_value' as customer_type, c_acctbal\nFROM customer\nWHERE c_acctbal BETWEEN 4000 AND 8000\n  AND c_nationkey IN (1, 2, 3)\nUNION ALL\nSELECT c_name, c_mktsegment, 'low_value' as customer_type, c_acctbal\nFROM customer\nWHERE c_acctbal BETWEEN 1000 AND 4000\n  AND c_nationkey IN (1, 2, 3)\nORDER BY c_acctbal DESC\nLIMIT 300;\n"}
- {"id": "optimizer_runtime_filter", "category": "optimizer", "sql": "\nSELECT\n    l.l_orderkey,\n    l.l_partkey,\n    l.l_suppkey,\n    l.l_quantity,\n    l.l_extendedprice,\n    p.p_name,\n    p.p_type\nFROM lineitem l\nJOIN part p ON l.l_partkey = p.p_partkey\nWHERE p.p_type LIKE '%STEEL%'\n  AND p.p_size BETWEEN 10 AND 20\n  AND l.l_shipdate >= DATE '1995-01-01'\n  AND l.l_shipdate < DATE '1996-01-01'\n  AND l.l_quantity > 20\nORDER BY l.l_extendedprice DESC\nLIMIT 1000;\n"}
- {"id": "optimizer_groupjoin", "category": "optimizer", "sql": "\nSELECT\n    o.o_orderkey,\n    o.o_custkey,\n    o.o_orderdate,\n    COUNT(l.l_linenumber) AS line_count,\n    SUM(l.l_extendedprice * (1 - l.l_discount)) AS revenue\nFROM orders o\nJOIN lineitem l ON o.o_orderkey = l.l_orderkey\nGROUP BY o.o_orderkey, o.o_custkey, o.o_orderdate\nORDER BY revenue DESC\nLIMIT 100;\n"}
