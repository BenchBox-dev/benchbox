- {"id": "groupby_decimal_lowndv", "category": "groupby", "sql": "\nSELECT\n    l_discount,\n    COUNT(*) as discount_frequency,\n    AVG(l_quantity) as avg_qty\nFROM lineitem\nGROUP BY l_discount;\n"}
- {"id": "approx_quantile_groupby", "category": "statistical", "sql": "\nSELECT\n    l_shipmode,\n    APPROX_QUANTILE(l_quantity, 0.5) as median_quantity\nFROM lineitem\nGROUP BY l_shipmode;\n", "result_contract": {"capability": "approximate_quantile_groupby", "row_identity": ["l_shipmode"], "columns": ["l_shipmode", "median_quantity"]}, "variants": {"bigquery": "\nSELECT\n    l_shipmode,\n    APPROX_QUANTILES(l_quantity, 100)[OFFSET(50)] as median_quantity\nFROM lineitem\nGROUP BY l_shipmode;\n", "clickhouse": "\nSELECT\n    l_shipmode,\n    quantileTDigest(0.5)(toFloat64(l_quantity)) as median_quantity\nFROM lineitem\nGROUP BY l_shipmode;\n", "datafusion": "\nSELECT\n    l_shipmode,\n    approx_percentile_cont(l_quantity, 0.5) as median_quantity\nFROM lineitem\nGROUP BY l_shipmode;\n", "redshift": "\nSELECT\n    l_shipmode,\n    APPROXIMATE PERCENTILE_DISC(0.5) WITHIN GROUP (ORDER BY l_quantity) as median_quantity\nFROM lineitem\nGROUP BY l_shipmode;\n", "doris": "\nSELECT\n    l_shipmode,\n    PERCENTILE_APPROX(l_quantity, 0.5) as median_quantity\nFROM lineitem\nGROUP BY l_shipmode;\n"}, "skip_on": ["sqlite"]}
- {"id": "intrinsic_to_date", "category": "intrinsic", "sql": "\nSELECT\n    COUNT(*) as orders_by_month\nFROM orders\nWHERE o_orderdate = TO_DATE('1995-03-15', 'yyyy-MM-dd');\n", "result_contract": {"capability": "date_parse_filter", "columns": ["orders_by_month"]}, "variants": {"datafusion": "\nSELECT\n    COUNT(*) as orders_by_month\nFROM orders\nWHERE o_orderdate = TO_DATE('1995-03-15');\n", "sqlite": "\nSELECT\n    COUNT(*) as orders_by_month\nFROM orders\nWHERE o_orderdate = date('1995-03-15');\n"}}
- {"id": "limit", "category": "limit", "sql": "\nSELECT *\nFROM lineitem\nORDER BY l_orderkey, l_linenumber\nLIMIT 100;\n"}
- {"id": "long_predicate", "category": "long", "sql": "\nSELECT COUNT(*)\nFROM lineitem l\nJOIN orders o ON l.l_orderkey = o.o_orderkey\nJOIN customer c ON o.o_custkey = c.c_custkey\nWHERE l.l_shipdate >= DATE '1994-01-01'\n  AND l.l_shipdate < DATE '1995-01-01'\n  AND l.l_discount BETWEEN 0.05 AND 0.07\n  AND l.l_quantity < 24\n  AND o.o_orderpriority = '1-URGENT'\n  AND c.c_mktsegment = 'BUILDING'\n  AND l.l_returnflag = 'R'\n  AND l.l_linestatus = 'F'\n  AND o.o_totalprice > 100000\n  AND c.c_nationkey IN (1, 2, 3, 4, 5);\n"}
- {"id": "min_max_runtime_filter", "category": "filter", "sql": "\nSELECT\n    l.*\nFROM lineitem l\nWHERE l.l_orderkey IN (\n    SELECT o_orderkey\n    FROM orders\n    WHERE o_orderdate BETWEEN DATE '1995-01-01' AND DATE '1995-03-31'\n);\n"}
- {"id": "orderby_all", "category": "orderby", "sql": "\nSELECT *\nFROM customer\nORDER BY c_custkey;\n"}
- {"id": "orderby_bigint", "category": "orderby", "sql": "\nSELECT\n    l_orderkey,\n    SUM(l_quantity) as total_qty\nFROM lineitem\nGROUP BY l_orderkey\nORDER BY l_orderkey;\n"}
- {"id": "orderby_bigint_expression", "category": "orderby", "sql": "\nSELECT\n    l_orderkey,\n    l_partkey,\n    l_quantity * l_extendedprice as total_value\nFROM lineitem\nORDER BY l_quantity * l_extendedprice DESC\nLIMIT 100;\n"}
- {"id": "orderby_decimal16", "category": "orderby", "sql": "\nSELECT\n    l_orderkey,\n    l_extendedprice,\n    l_discount\nFROM lineitem\nORDER BY l_extendedprice DESC, l_discount ASC, l_orderkey ASC\nLIMIT 100;\n"}
- {"id": "orderby_multicol", "category": "orderby", "sql": "\nSELECT *\nFROM orders\nORDER BY o_orderpriority, o_orderdate DESC, o_totalprice DESC, o_orderkey\nLIMIT 100;\n"}
- {"id": "orderby_shortstrings", "category": "orderby", "sql": "\nSELECT DISTINCT l_returnflag, l_linestatus\nFROM lineitem\nORDER BY l_returnflag, l_linestatus;\n"}
- {"id": "shuffle_1mb_rows", "category": "shuffle", "sql": "\nSELECT\n    l1.l_orderkey,\n    COUNT(*) as match_count\nFROM lineitem l1\nJOIN lineitem l2 ON l1.l_partkey = l2.l_partkey\nWHERE l1.l_orderkey != l2.l_orderkey\n  AND l1.l_shipdate = l2.l_shipdate\nGROUP BY l1.l_orderkey\nLIMIT 10000;\n"}
- {"id": "shuffle_full_join_one_to_many_string_with_groupby", "category": "shuffle", "sql": "\nSELECT\n    c.c_mktsegment,\n    COUNT(o.o_orderkey) as order_count,\n    COUNT(c.c_custkey) as customer_count\nFROM customer c\nFULL OUTER JOIN orders o ON c.c_custkey = o.o_custkey\nGROUP BY c.c_mktsegment;\n"}
- {"id": "shuffle_inner_join_one_to_many_string_with_groupby", "category": "shuffle", "sql": "\nSELECT\n    c.c_mktsegment,\n    COUNT(*) as order_count,\n    SUM(o.o_totalprice) as total_revenue\nFROM customer c\nINNER JOIN orders o ON c.c_custkey = o.o_custkey\nGROUP BY c.c_mktsegment;\n"}
- {"id": "shuffle_inner_join_union_all_with_groupby", "category": "shuffle", "sql": "\nSELECT\n    source_type,\n    COUNT(*) as record_count\nFROM (\n    SELECT 'ORDER' as source_type, o_custkey as cust_id\n    FROM orders\n    WHERE o_orderdate >= DATE '1995-01-01'\n    UNION ALL\n    SELECT 'LINEITEM' as source_type, o_custkey as cust_id\n    FROM orders o\n    JOIN lineitem l ON o.o_orderkey = l.l_orderkey\n    WHERE l.l_shipdate >= DATE '1995-01-01'\n) combined\nGROUP BY source_type;\n"}
- {"id": "shuffle_left_join_one_to_many_string_with_groupby", "category": "shuffle", "sql": "\nSELECT\n    c.c_mktsegment,\n    COUNT(o.o_orderkey) as order_count,\n    COUNT(*) as total_rows\nFROM customer c\nLEFT JOIN orders o ON c.c_custkey = o.o_custkey\nGROUP BY c.c_mktsegment;\n"}
