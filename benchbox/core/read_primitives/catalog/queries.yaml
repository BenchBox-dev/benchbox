queries:
- {"id": "aggregation_distinct", "category": "aggregation", "sql": "\nSELECT COUNT(DISTINCT o_custkey) as unique_customers\nFROM orders\nWHERE o_orderdate >= DATE '1995-01-01';\n"}
- {"id": "aggregation_distinct_groupby", "category": "aggregation", "sql": "\nSELECT\n    l_returnflag,\n    l_linestatus,\n    COUNT(DISTINCT l_orderkey) as unique_orders,\n    COUNT(DISTINCT l_partkey) as unique_parts\nFROM lineitem\nGROUP BY l_returnflag, l_linestatus;\n"}
- {"id": "approx_count_distinct_simple", "category": "aggregation", "sql": "\nSELECT APPROX_COUNT_DISTINCT(o_custkey) as unique_customers\nFROM orders\nWHERE o_orderdate >= DATE '1995-01-01';\n", "result_contract": {"capability": "approximate_distinct_count", "columns": ["unique_customers"]}, "skip_on": ["sqlite"]}
- {"id": "approx_count_distinct_groupby", "category": "aggregation", "sql": "\nSELECT\n    l_returnflag,\n    l_linestatus,\n    APPROX_COUNT_DISTINCT(l_orderkey) as unique_orders,\n    APPROX_COUNT_DISTINCT(l_partkey) as unique_parts\nFROM lineitem\nGROUP BY l_returnflag, l_linestatus;\n", "result_contract": {"capability": "approximate_distinct_count", "row_identity": ["l_returnflag", "l_linestatus"], "columns": ["l_returnflag", "l_linestatus", "unique_orders", "unique_parts"]}, "skip_on": ["sqlite"]}
- {"id": "aggregation_groupby_large", "category": "aggregation", "sql": "\nSELECT\n    l_orderkey,\n    l_partkey,\n    l_suppkey,\n    SUM(l_quantity) as total_qty,\n    AVG(l_extendedprice) as avg_price\nFROM lineitem\nGROUP BY l_orderkey, l_partkey, l_suppkey;\n"}
- {"id": "aggregation_groupby_small", "category": "aggregation", "sql": "\nSELECT\n    n_regionkey,\n    COUNT(*) as nation_count,\n    MAX(n_name) as last_nation\nFROM nation\nGROUP BY n_regionkey;\n"}
- {"id": "aggregation_materialize", "category": "aggregation", "sql": "\nWITH order_totals AS (\n    SELECT\n        o_custkey,\n        SUM(o_totalprice) as customer_total\n    FROM orders\n    GROUP BY o_custkey\n)\nSELECT AVG(customer_total) as avg_customer_spending\nFROM order_totals;\n"}
- {"id": "aggregation_materialize_subquery", "category": "aggregation", "sql": "\nSELECT\n    c_mktsegment,\n    AVG(order_total) as avg_segment_order\nFROM (\n    SELECT\n        c.c_mktsegment,\n        o.o_orderkey,\n        SUM(l.l_extendedprice * (1 - l.l_discount)) as order_total\n    FROM customer c\n    JOIN orders o ON c.c_custkey = o.o_custkey\n    JOIN lineitem l ON o.o_orderkey = l.l_orderkey\n    GROUP BY c.c_mktsegment, o.o_orderkey\n) subq\nGROUP BY c_mktsegment;\n"}
- {"id": "aggregation_partition", "category": "aggregation", "sql": "\nSELECT\n    l_shipdate,\n    l_shipmode,\n    SUM(l_quantity) as daily_quantity,\n    COUNT(*) as shipment_count\nFROM lineitem\nWHERE l_shipdate >= DATE '1995-01-01'\n  AND l_shipdate < DATE '1996-01-01'\nGROUP BY l_shipdate, l_shipmode;\n"}
- {"id": "aggregation_selective", "category": "aggregation", "sql": "\nSELECT\n    SUM(l_extendedprice * l_discount) as total_discount_amount\nFROM lineitem\nWHERE l_discount > 0.05\n  AND l_quantity < 24;\n"}
- {"id": "aggregation_simple", "category": "aggregation", "sql": "\nSELECT\n    COUNT(*) as total_orders,\n    SUM(o_totalprice) as total_revenue\nFROM orders;\n"}
- {"id": "broadcast_join_two_tables", "category": "broadcast", "sql": "\nSELECT /*+ BROADCAST(n) */\n    COUNT(*) as supplier_count\nFROM supplier s\nJOIN nation n ON s.s_nationkey = n.n_nationkey;\n"}
- {"id": "broadcast_join_three_tables", "category": "broadcast", "sql": "\nSELECT /*+ BROADCAST(n, r) */\n    r.r_name,\n    n.n_name,\n    COUNT(*) as supplier_count\nFROM supplier s\nJOIN nation n ON s.s_nationkey = n.n_nationkey\nJOIN region r ON n.n_regionkey = r.r_regionkey\nGROUP BY r.r_name, n.n_name;\n"}
- {"id": "broadcast_join_four_tables", "category": "broadcast", "sql": "\nSELECT /*+ BROADCAST(n, r, p) */\n    r.r_name,\n    p.p_type,\n    SUM(ps.ps_supplycost * ps.ps_availqty) as total_value\nFROM partsupp ps\nJOIN supplier s ON ps.ps_suppkey = s.s_suppkey\nJOIN nation n ON s.s_nationkey = n.n_nationkey\nJOIN region r ON n.n_regionkey = r.r_regionkey\nJOIN part p ON ps.ps_partkey = p.p_partkey\nWHERE p.p_size = 15\nGROUP BY r.r_name, p.p_type;\n"}
- {"id": "predicate_ordering_aggregation", "category": "predicate", "sql": "\nSELECT\n    SUM(l_extendedprice) as total_price\nFROM lineitem\nWHERE l_shipdate >= DATE '1994-01-01'\n  AND l_shipdate < DATE '1995-01-01'\n  AND l_discount BETWEEN 0.05 AND 0.07\n  AND l_quantity < 24;\n"}
- {"id": "predicate_ordering_aggregation_groupby", "category": "predicate", "sql": "\nSELECT\n    l_returnflag,\n    SUM(l_quantity) as total_qty\nFROM lineitem\nWHERE l_shipdate <= DATE '1998-09-01'\n  AND l_discount > 0.05\n  AND l_tax < 0.08\n  AND l_quantity BETWEEN 10 AND 30\nGROUP BY l_returnflag;\n"}
- {"id": "predicate_ordering_costs", "category": "predicate", "sql": "\nSELECT *\nFROM lineitem\nWHERE l_quantity > 45\n  AND l_extendedprice > 50000\n  AND l_discount < 0.05\n  AND l_shipinstruct = 'DELIVER IN PERSON'\n  AND l_shipmode IN ('AIR', 'AIR REG')\nLIMIT 100;\n"}
- {"id": "predicate_ordering_subquery", "category": "predicate", "sql": "\nSELECT\n    o_orderkey,\n    o_totalprice\nFROM orders\nWHERE o_totalprice > 100000\n  AND o_orderdate >= DATE '1995-01-01'\n  AND o_custkey IN (\n    SELECT c_custkey\n    FROM customer\n    WHERE c_mktsegment = 'BUILDING'\n      AND c_nationkey = 1\n  );\n"}
- {"id": "count_star", "category": "count", "sql": "\nSELECT COUNT(*) as total_lineitems\nFROM lineitem;\n"}
- {"id": "decimal_arithmetic", "category": "decimal", "sql": "\nSELECT\n    l_orderkey,\n    l_extendedprice * (1 - l_discount) * (1 + l_tax) as final_price,\n    l_extendedprice / l_quantity as unit_price\nFROM lineitem\nWHERE l_quantity > 0\nLIMIT 1000;\n"}
- {"id": "empty_build_join", "category": "empty", "sql": "\nSELECT l.*\nFROM lineitem l\nLEFT JOIN (\n    SELECT * FROM orders WHERE o_totalprice < 0\n) o ON l.l_orderkey = o.o_orderkey;\n"}
- {"id": "exchange_broadcast", "category": "exchange", "sql": "\nSELECT /*+ BROADCAST(small_parts) */\n    l.l_orderkey,\n    SUM(l.l_quantity) as total_qty\nFROM lineitem l\nJOIN (\n    SELECT p_partkey\n    FROM part\n    WHERE p_size = 1\n) small_parts ON l.l_partkey = small_parts.p_partkey\nGROUP BY l.l_orderkey;\n"}
- {"id": "exchange_merge", "category": "exchange", "sql": "\nSELECT\n    o.o_orderkey,\n    l.l_linenumber,\n    l.l_quantity\nFROM orders o\nJOIN lineitem l ON o.o_orderkey = l.l_orderkey\nORDER BY o.o_orderkey, l.l_linenumber;\n"}
- {"id": "exchange_shuffle", "category": "exchange", "sql": "\nSELECT\n    ps1.ps_partkey,\n    ps1.ps_suppkey as supp1,\n    ps2.ps_suppkey as supp2\nFROM partsupp ps1\nJOIN partsupp ps2 ON ps1.ps_partkey = ps2.ps_partkey\nWHERE ps1.ps_suppkey < ps2.ps_suppkey\n  AND ps1.ps_supplycost > 100;\n"}
