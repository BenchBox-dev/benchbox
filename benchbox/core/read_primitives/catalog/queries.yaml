- {"id": "olap_rollup_analysis", "category": "olap", "sql": "\nSELECT\n    r.r_name as region,\n    n.n_name as nation,\n    c.c_mktsegment as market_segment,\n    COUNT(DISTINCT c.c_custkey) as customer_count,\n    COUNT(*) as order_count,\n    SUM(o.o_totalprice) as total_revenue,\n    AVG(o.o_totalprice) as avg_order_value\nFROM orders o\nJOIN customer c ON o.o_custkey = c.c_custkey\nJOIN nation n ON c.c_nationkey = n.n_nationkey\nJOIN region r ON n.n_regionkey = r.r_regionkey\nWHERE o.o_orderdate >= DATE '1995-01-01'\nGROUP BY ROLLUP(r.r_name, n.n_name, c.c_mktsegment)\nORDER BY r.r_name NULLS LAST, n.n_name NULLS LAST, c.c_mktsegment NULLS LAST;\n"}
- {"id": "timeseries_trend_analysis", "category": "timeseries", "skip_on": ["redshift", "databricks"], "sql": "\nWITH monthly_totals AS (\n  SELECT\n    DATE_TRUNC('month', o_orderdate) as order_month,\n    COUNT(*) as order_count,\n    SUM(o_totalprice) as monthly_revenue,\n    AVG(o_totalprice) as avg_order_value,\n    EXTRACT(EPOCH FROM DATE_TRUNC('month', o_orderdate)) as month_epoch\n  FROM orders\n  WHERE o_orderdate >= DATE '1995-01-01'\n    AND o_orderdate < DATE '1997-01-01'\n  GROUP BY DATE_TRUNC('month', o_orderdate)\n),\nmonthly_with_lag AS (\n  SELECT\n    order_month,\n    order_count,\n    monthly_revenue,\n    avg_order_value,\n    month_epoch,\n    LAG(monthly_revenue, 1) OVER (ORDER BY order_month) as prev_month_revenue\n  FROM monthly_totals\n)\nSELECT\n  order_month,\n  order_count,\n  monthly_revenue,\n  avg_order_value,\n  REGR_SLOPE(monthly_revenue, month_epoch) OVER () as revenue_trend_slope,\n  prev_month_revenue,\n  (monthly_revenue - prev_month_revenue) / NULLIF(prev_month_revenue, 0) * 100 as mom_growth_pct\nFROM monthly_with_lag\nORDER BY order_month;\n", "result_contract": {"capability": "monthly_time_series_regression", "row_identity": ["order_month"], "columns": ["order_month", "order_count", "monthly_revenue", "avg_order_value", "revenue_trend_slope", "prev_month_revenue", "mom_growth_pct"]}, "variants": {"spark": "\nWITH monthly_totals AS (\n  SELECT\n    DATE_TRUNC('month', o_orderdate) as order_month,\n    COUNT(*) as order_count,\n    SUM(o_totalprice) as monthly_revenue,\n    AVG(o_totalprice) as avg_order_value,\n    DATEDIFF(CAST(DATE_TRUNC('month', o_orderdate) AS DATE), DATE '1970-01-01') * 86400 as month_epoch\n  FROM orders\n  WHERE o_orderdate >= DATE '1995-01-01'\n    AND o_orderdate < DATE '1997-01-01'\n  GROUP BY DATE_TRUNC('month', o_orderdate)\n),\nmonthly_with_lag AS (\n  SELECT\n    order_month,\n    order_count,\n    monthly_revenue,\n    avg_order_value,\n    month_epoch,\n    LAG(monthly_revenue, 1) OVER (ORDER BY order_month) as prev_month_revenue\n  FROM monthly_totals\n)\nSELECT\n  order_month,\n  order_count,\n  monthly_revenue,\n  avg_order_value,\n  REGR_SLOPE(monthly_revenue, month_epoch) OVER () as revenue_trend_slope,\n  prev_month_revenue,\n  (monthly_revenue - prev_month_revenue) / NULLIF(prev_month_revenue, 0) * 100 as mom_growth_pct\nFROM monthly_with_lag\nORDER BY order_month;\n", "duckdb": "\nWITH monthly_totals AS (\n  SELECT\n    DATE_TRUNC('month', o_orderdate) as order_month,\n    COUNT(*) as order_count,\n    SUM(o_totalprice) as monthly_revenue,\n    AVG(o_totalprice) as avg_order_value,\n    EXTRACT(EPOCH FROM DATE_TRUNC('month', o_orderdate)) as month_epoch\n  FROM orders\n  WHERE o_orderdate >= DATE '1995-01-01'\n    AND o_orderdate < DATE '1997-01-01'\n  GROUP BY DATE_TRUNC('month', o_orderdate)\n),\nmonthly_with_lag AS (\n  SELECT\n    order_month,\n    order_count,\n    monthly_revenue,\n    avg_order_value,\n    month_epoch,\n    LAG(monthly_revenue, 1) OVER (ORDER BY order_month) as prev_month_revenue\n  FROM monthly_totals\n)\nSELECT\n  order_month,\n  order_count,\n  monthly_revenue,\n  avg_order_value,\n  REGR_SLOPE(monthly_revenue, month_epoch) OVER () as revenue_trend_slope,\n  prev_month_revenue,\n  (monthly_revenue - prev_month_revenue) / NULLIF(prev_month_revenue, 0) * 100 as mom_growth_pct\nFROM monthly_with_lag\nORDER BY order_month;\n", "clickhouse": "\nWITH monthly_totals AS (\n  SELECT\n    toStartOfMonth(o_orderdate) as order_month,\n    COUNT(*) as order_count,\n    toFloat64(SUM(o_totalprice)) as monthly_revenue,\n    toFloat64(AVG(o_totalprice)) as avg_order_value,\n    toFloat64(toUnixTimestamp(toStartOfMonth(o_orderdate))) as month_epoch\n  FROM orders\n  WHERE o_orderdate >= toDate('1995-01-01')\n    AND o_orderdate < toDate('1997-01-01')\n  GROUP BY toStartOfMonth(o_orderdate)\n),\nmonthly_with_lag AS (\n  SELECT\n    order_month,\n    order_count,\n    monthly_revenue,\n    avg_order_value,\n    month_epoch,\n    LAG(monthly_revenue, 1) OVER (ORDER BY order_month) as prev_month_revenue\n  FROM monthly_totals\n)\nSELECT\n  order_month,\n  order_count,\n  monthly_revenue,\n  avg_order_value,\n  corr(monthly_revenue, month_epoch) OVER () * stddevSamp(monthly_revenue) OVER () / nullif(stddevSamp(month_epoch) OVER (), 0) as revenue_trend_slope,\n  prev_month_revenue,\n  (monthly_revenue - prev_month_revenue) / nullif(prev_month_revenue, 0) * 100 as mom_growth_pct\nFROM monthly_with_lag\nORDER BY order_month;\n", "datafusion": "\nWITH monthly_totals AS (\n  SELECT\n    DATE_TRUNC('month', o_orderdate) as order_month,\n    COUNT(*) as order_count,\n    SUM(o_totalprice) as monthly_revenue,\n    AVG(o_totalprice) as avg_order_value,\n    EXTRACT(EPOCH FROM DATE_TRUNC('month', o_orderdate)) as month_epoch\n  FROM orders\n  WHERE o_orderdate >= DATE '1995-01-01'\n    AND o_orderdate < DATE '1997-01-01'\n  GROUP BY DATE_TRUNC('month', o_orderdate)\n),\nmonthly_with_lag AS (\n  SELECT\n    order_month,\n    order_count,\n    monthly_revenue,\n    avg_order_value,\n    month_epoch,\n    LAG(monthly_revenue, 1) OVER (ORDER BY order_month) as prev_month_revenue\n  FROM monthly_totals\n)\nSELECT\n  order_month,\n  order_count,\n  monthly_revenue,\n  avg_order_value,\n  REGR_SLOPE(monthly_revenue, month_epoch) OVER () as revenue_trend_slope,\n  prev_month_revenue,\n  (monthly_revenue - prev_month_revenue) / NULLIF(prev_month_revenue, 0) * 100 as mom_growth_pct\nFROM monthly_with_lag\nORDER BY order_month;\n", "bigquery": "WITH monthly_totals AS (\n    SELECT DATE_TRUNC(o_orderdate, MONTH) AS order_month,\n        COUNT(*) AS order_count,\n        SUM(o_totalprice) AS monthly_revenue,\n        AVG(o_totalprice) AS avg_order_value,\n        UNIX_SECONDS(TIMESTAMP(DATE_TRUNC(o_orderdate, MONTH))) AS month_epoch\n    FROM orders\n    WHERE o_orderdate >= DATE '1995-01-01'\n      AND o_orderdate < DATE '1997-01-01'\n    GROUP BY order_month\n),\nmonthly_with_lag AS (\n    SELECT order_month, order_count, monthly_revenue, avg_order_value, month_epoch,\n        LAG(monthly_revenue, 1) OVER (ORDER BY order_month) AS prev_month_revenue\n    FROM monthly_totals\n)\nSELECT order_month, order_count, monthly_revenue, avg_order_value,\n    COVAR_POP(monthly_revenue, month_epoch) OVER () /\n        NULLIF(VAR_POP(month_epoch) OVER (), 0) AS revenue_trend_slope,\n    prev_month_revenue,\n    (monthly_revenue - prev_month_revenue) / NULLIF(prev_month_revenue, 0) * 100 AS mom_growth_pct\nFROM monthly_with_lag\nORDER BY order_month;", "sqlite": "\nWITH monthly_totals AS (\n  SELECT\n    date(o_orderdate, 'start of month') as order_month,\n    COUNT(*) as order_count,\n    SUM(o_totalprice) as monthly_revenue,\n    AVG(o_totalprice) as avg_order_value,\n    CAST(strftime('%s', date(o_orderdate, 'start of month')) AS INTEGER) as month_epoch\n  FROM orders\n  WHERE o_orderdate >= '1995-01-01'\n    AND o_orderdate < '1997-01-01'\n  GROUP BY date(o_orderdate, 'start of month')\n),\nmonthly_with_lag AS (\n  SELECT\n    order_month,\n    order_count,\n    monthly_revenue,\n    avg_order_value,\n    month_epoch - MIN(month_epoch) OVER () as epoch_offset,\n    LAG(monthly_revenue, 1) OVER (ORDER BY order_month) as prev_month_revenue\n  FROM monthly_totals\n)\nSELECT\n  order_month,\n  order_count,\n  monthly_revenue,\n  avg_order_value,\n  (AVG(monthly_revenue * epoch_offset) OVER () - AVG(monthly_revenue) OVER () * AVG(epoch_offset) OVER ())\n    / NULLIF(AVG(epoch_offset * epoch_offset) OVER () - AVG(epoch_offset) OVER () * AVG(epoch_offset) OVER (), 0)\n    as revenue_trend_slope,\n  prev_month_revenue,\n  (monthly_revenue - prev_month_revenue) / NULLIF(prev_month_revenue, 0) * 100 as mom_growth_pct\nFROM monthly_with_lag\nORDER BY order_month;\n"}}
- {"id": "max_by_simple", "category": "max", "sql": "\nSELECT\n    n_name,\n    MAX_BY(c_name, c_acctbal) as richest_customer,\n    MAX(c_acctbal) as max_balance\nFROM customer c\nJOIN nation n ON c.c_nationkey = n.n_nationkey\nGROUP BY n_name\nORDER BY max_balance DESC, n_name;\n", "result_contract": {"capability": "arg_max_aggregate", "row_identity": ["n_name"], "columns": ["n_name", "richest_customer", "max_balance"]}, "variants": {"datafusion": "\nWITH ranked AS (\n  SELECT\n    n.n_name,\n    c.c_name,\n    c.c_acctbal,\n    ROW_NUMBER() OVER (PARTITION BY n.n_name ORDER BY c.c_acctbal DESC, c.c_name) as rn\n  FROM customer c\n  JOIN nation n ON c.c_nationkey = n.n_nationkey\n)\nSELECT\n  n_name,\n  c_name as richest_customer,\n  c_acctbal as max_balance\nFROM ranked\nWHERE rn = 1\nORDER BY max_balance DESC, n_name;\n", "redshift": "\nWITH ranked AS (\n  SELECT\n    n.n_name,\n    c.c_name,\n    c.c_acctbal,\n    ROW_NUMBER() OVER (PARTITION BY n.n_name ORDER BY c.c_acctbal DESC, c.c_name) as rn\n  FROM customer c\n  JOIN nation n ON c.c_nationkey = n.n_nationkey\n)\nSELECT\n  n_name,\n  c_name as richest_customer,\n  c_acctbal as max_balance\nFROM ranked\nWHERE rn = 1\nORDER BY max_balance DESC, n_name;\n", "sqlite": "\nWITH ranked AS (\n  SELECT\n    n.n_name,\n    c.c_name,\n    c.c_acctbal,\n    ROW_NUMBER() OVER (PARTITION BY n.n_name ORDER BY c.c_acctbal DESC, c.c_name) as rn\n  FROM customer c\n  JOIN nation n ON c.c_nationkey = n.n_nationkey\n)\nSELECT\n  n_name,\n  c_name as richest_customer,\n  c_acctbal as max_balance\nFROM ranked\nWHERE rn = 1\nORDER BY max_balance DESC, n_name;\n"}}
- {"id": "min_by_simple", "category": "min", "sql": "\nSELECT\n    n_name,\n    MIN_BY(c_name, c_acctbal) as poorest_customer,\n    MIN(c_acctbal) as min_balance\nFROM customer c\nJOIN nation n ON c.c_nationkey = n.n_nationkey\nGROUP BY n_name\nORDER BY min_balance ASC, n_name;\n", "result_contract": {"capability": "arg_min_aggregate", "row_identity": ["n_name"], "columns": ["n_name", "poorest_customer", "min_balance"]}, "variants": {"datafusion": "\nWITH ranked AS (\n  SELECT\n    n.n_name,\n    c.c_name,\n    c.c_acctbal,\n    ROW_NUMBER() OVER (PARTITION BY n.n_name ORDER BY c.c_acctbal ASC, c.c_name) as rn\n  FROM customer c\n  JOIN nation n ON c.c_nationkey = n.n_nationkey\n)\nSELECT\n  n_name,\n  c_name as poorest_customer,\n  c_acctbal as min_balance\nFROM ranked\nWHERE rn = 1\nORDER BY min_balance ASC, n_name;\n", "redshift": "\nWITH ranked AS (\n  SELECT\n    n.n_name,\n    c.c_name,\n    c.c_acctbal,\n    ROW_NUMBER() OVER (PARTITION BY n.n_name ORDER BY c.c_acctbal ASC, c.c_name) as rn\n  FROM customer c\n  JOIN nation n ON c.c_nationkey = n.n_nationkey\n)\nSELECT\n  n_name,\n  c_name as poorest_customer,\n  c_acctbal as min_balance\nFROM ranked\nWHERE rn = 1\nORDER BY min_balance ASC, n_name;\n", "sqlite": "\nWITH ranked AS (\n  SELECT\n    n.n_name,\n    c.c_name,\n    c.c_acctbal,\n    ROW_NUMBER() OVER (PARTITION BY n.n_name ORDER BY c.c_acctbal ASC, c.c_name) as rn\n  FROM customer c\n  JOIN nation n ON c.c_nationkey = n.n_nationkey\n)\nSELECT\n  n_name,\n  c_name as poorest_customer,\n  c_acctbal as min_balance\nFROM ranked\nWHERE rn = 1\nORDER BY min_balance ASC, n_name;\n"}}
- {"id": "max_by_complex", "category": "max", "sql": "\nSELECT\n    c_mktsegment,\n    MAX_BY(o_orderkey, o_totalprice) as most_expensive_order_id,\n    MAX_BY(o_orderdate, o_totalprice) as most_expensive_order_date,\n    MAX(o_totalprice) as max_order_value\nFROM orders o\nJOIN customer c ON o.o_custkey = c.c_custkey\nGROUP BY c_mktsegment\nORDER BY max_order_value DESC, c_mktsegment;\n", "result_contract": {"capability": "arg_max_aggregate", "row_identity": ["c_mktsegment"], "columns": ["c_mktsegment", "most_expensive_order_id", "most_expensive_order_date", "max_order_value"]}, "variants": {"datafusion": "\nWITH ranked AS (\n  SELECT\n    c.c_mktsegment,\n    o.o_orderkey,\n    o.o_orderdate,\n    o.o_totalprice,\n    ROW_NUMBER() OVER (\n      PARTITION BY c.c_mktsegment\n      ORDER BY o.o_totalprice DESC, o.o_orderkey\n    ) as rn\n  FROM orders o\n  JOIN customer c ON o.o_custkey = c.c_custkey\n)\nSELECT\n  c_mktsegment,\n  o_orderkey as most_expensive_order_id,\n  o_orderdate as most_expensive_order_date,\n  o_totalprice as max_order_value\nFROM ranked\nWHERE rn = 1\nORDER BY max_order_value DESC, c_mktsegment;\n", "redshift": "\nWITH ranked AS (\n  SELECT\n    c.c_mktsegment,\n    o.o_orderkey,\n    o.o_orderdate,\n    o.o_totalprice,\n    ROW_NUMBER() OVER (\n      PARTITION BY c.c_mktsegment\n      ORDER BY o.o_totalprice DESC, o.o_orderkey\n    ) as rn\n  FROM orders o\n  JOIN customer c ON o.o_custkey = c.c_custkey\n)\nSELECT\n  c_mktsegment,\n  o_orderkey as most_expensive_order_id,\n  o_orderdate as most_expensive_order_date,\n  o_totalprice as max_order_value\nFROM ranked\nWHERE rn = 1\nORDER BY max_order_value DESC, c_mktsegment;\n", "sqlite": "\nWITH ranked AS (\n  SELECT\n    c.c_mktsegment,\n    o.o_orderkey,\n    o.o_orderdate,\n    o.o_totalprice,\n    ROW_NUMBER() OVER (\n      PARTITION BY c.c_mktsegment\n      ORDER BY o.o_totalprice DESC, o.o_orderkey\n    ) as rn\n  FROM orders o\n  JOIN customer c ON o.o_custkey = c.c_custkey\n)\nSELECT\n 