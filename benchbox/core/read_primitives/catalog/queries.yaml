- {"id": "window_rank", "category": "window", "sql": "\nSELECT l_orderkey, l_returnflag, l_quantity,\n       RANK() OVER (PARTITION BY l_returnflag ORDER BY l_quantity DESC) as qty_rank\nFROM lineitem\nQUALIFY RANK() OVER (PARTITION BY l_returnflag ORDER BY l_quantity DESC) <= 5\nORDER BY l_returnflag, qty_rank, l_orderkey;\n", "result_contract": {"capability": "qualify_rank_filter", "columns": ["l_orderkey", "l_returnflag", "l_quantity", "qty_rank"]}, "variants": {"datafusion": "\nSELECT l_orderkey, l_returnflag, l_quantity, qty_rank\nFROM (\n    SELECT l_orderkey, l_returnflag, l_quantity,\n           RANK() OVER (PARTITION BY l_returnflag ORDER BY l_quantity DESC) as qty_rank\n    FROM lineitem\n) ranked\nWHERE qty_rank <= 5\nORDER BY l_returnflag, qty_rank, l_orderkey;\n", "redshift": "\nSELECT l_orderkey, l_returnflag, l_quantity, qty_rank\nFROM (\n    SELECT l_orderkey, l_returnflag, l_quantity,\n           RANK() OVER (PARTITION BY l_returnflag ORDER BY l_quantity DESC) as qty_rank\n    FROM lineitem\n) ranked\nWHERE qty_rank <= 5\nORDER BY l_returnflag, qty_rank, l_orderkey;\n"}}
