- {"id": "groupby_bigint_highndv", "category": "groupby", "sql": "\nSELECT\n    l_orderkey,\n    COUNT(*) as line_count\nFROM lineitem\nGROUP BY l_orderkey;\n"}
- {"id": "groupby_bigint_lowndv", "category": "groupby", "sql": "\nSELECT\n    o_orderpriority,\n    COUNT(*) as order_count\nFROM orders\nGROUP BY o_orderpriority;\n"}
