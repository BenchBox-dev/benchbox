- {"id": "any_value_with_filter", "category": "aggregation", "sql": "\nSELECT\n    n_regionkey,\n    ANY_VALUE(n_name) as sample_nation,\n    ANY_VALUE(n_comment) as sample_comment,\n    COUNT(*) as nation_count\nFROM nation\nGROUP BY n_regionkey;\n", "result_contract": {"capability": "arbitrary_value_aggregate", "row_identity": ["n_regionkey"], "columns": ["n_regionkey", "sample_nation", "sample_comment", "nation_count"]}, "variants": {"clickhouse": "\nSELECT\n    n_regionkey,\n    any(n_name) as sample_nation,\n    any(n_comment) as sample_comment,\n    COUNT(*) as nation_count\nFROM nation\nGROUP BY n_regionkey;\n"}, "skip_on": ["datafusion"]}
- {"id": "groupby_all_simple", "category": "aggregation", "sql": "\nSELECT\n    l_returnflag,\n    l_linestatus,\n    SUM(l_quantity) as total_qty,\n    AVG(l_extendedprice) as avg_price\nFROM lineitem\nGROUP BY ALL;\n", "variants": {"sqlite": "\nSELECT\n    l_returnflag,\n    l_linestatus,\n    SUM(l_quantity) as total_qty,\n    AVG(l_extendedprice) as avg_price\nFROM lineitem\nGROUP BY l_returnflag, l_linestatus;\n", "doris": "\nSELECT\n    l_returnflag,\n    l_linestatus,\n    SUM(l_quantity) as total_qty,\n    AVG(l_extendedprice) as avg_price\nFROM lineitem\nGROUP BY l_returnflag, l_linestatus;\n"}, "result_contract": {"capability": "group_by_all_inference", "row_identity": ["l_returnflag", "l_linestatus"], "columns": ["l_returnflag", "l_linestatus", "total_qty", "avg_price"]}}
- {"id": "groupby_all_complex", "category": "aggregation", "sql": "\nSELECT\n    DATE_TRUNC('month', o_orderdate) as order_month,\n    o_orderpriority,\n    COUNT(*) as order_count,\n    SUM(o_totalprice) as monthly_revenue\nFROM orders\nWHERE o_orderdate >= DATE '1995-01-01'\nGROUP BY ALL\nORDER BY order_month, o_orderpriority;\n", "result_contract": {"capability": "group_by_all_expansion", "row_identity": ["order_month", "o_orderpriority"], "columns": ["order_month", "o_orderpriority", "order_count", "monthly_revenue"]}, "variants": {"datafusion": "\nSELECT\n    DATE_TRUNC('month', o_orderdate) as order_month,\n    o_orderpriority,\n    COUNT(o_orderkey) as order_count,\n    SUM(o_totalprice) as monthly_revenue\nFROM orders\nWHERE o_orderdate >= DATE '1995-01-01'\nGROUP BY DATE_TRUNC('month', o_orderdate), o_orderpriority\nORDER BY order_month, o_orderpriority;\n", "sqlite": "\nSELECT\n    date(o_orderdate, 'start of month') as order_month,\n    o_orderpriority,\n    COUNT(*) as order_count,\n    SUM(o_totalprice) as monthly_revenue\nFROM orders\nWHERE o_orderdate >= '1995-01-01'\nGROUP BY date(o_orderdate, 'start of month'), o_orderpriority\nORDER BY order_month, o_orderpriority;\n", "doris": "\nSELECT\n    DATE_TRUNC(o_orderdate, 'month') as order_month,\n    o_orderpriority,\n    COUNT(*) as order_count,\n    SUM(o_totalprice) as monthly_revenue\nFROM orders\nWHERE o_orderdate >= DATE '1995-01-01'\nGROUP BY DATE_TRUNC(o_orderdate, 'month'), o_orderpriority\nORDER BY order_month, o_orderpriority;\n"}}
- {"id": "orderby_all_simple", "category": "orderby", "sql": "\nSELECT\n    r_name,\n    n_name,\n    COUNT(*) as supplier_count\nFROM supplier s\nJOIN nation n ON s.s_nationkey = n.n_nationkey\nJOIN region r ON n.n_regionkey = r.r_regionkey\nGROUP BY r_name, n_name\nORDER BY ALL;\n", "result_contract": {"capability": "order_by_all_expansion", "row_identity": ["r_name", "n_name"], "columns": ["r_name", "n_name", "supplier_count"]}, "variants": {"datafusion": "\nSELECT\n    r_name,\n    n_name,\n    COUNT(*) as supplier_count\nFROM supplier s\nJOIN nation n ON s.s_nationkey = n.n_nationkey\nJOIN region r ON n.n_regionkey = r.r_regionkey\nGROUP BY r_name, n_name\nORDER BY r_name, n_name, supplier_count;\n", "redshift": "\nSELECT\n    r_name,\n    n_name,\n    COUNT(*) as supplier_count\nFROM supplier s\nJOIN nation n ON s.s_nationkey = n.n_nationkey\nJOIN region r ON n.n_regionkey = r.r_regionkey\nGROUP BY r_name, n_name\nORDER BY r_name, n_name, supplier_count;\n", "bigquery": "SELECT r_name, n_name, COUNT(*) AS supplier_count FROM supplier s JOIN nation n ON s.s_nationkey = n.n_nationkey JOIN region r ON n.n_regionkey = r.r_regionkey GROUP BY r_name, n_name ORDER BY r_name, n_name, supplier_count;", "doris": "\nSELECT\n    r_name,\n    n_name,\n    COUNT(*) as supplier_count\nFROM supplier s\nJOIN nation n ON s.s_nationkey = n.n_nationkey\nJOIN region r ON n.n_regionkey = r.r_regionkey\nGROUP BY r_name, n_name\nORDER BY r_name, n_name, supplier_count;\n"}}
- {"id": "orderby_all_desc", "category": "orderby", "sql": "\nSELECT\n    p_brand,\n    p_type,\n    AVG(p_retailprice) as avg_price\nFROM part\nGROUP BY p_brand, p_type\nORDER BY ALL DESC\nLIMIT 100;\n", "result_contract": {"capability": "order_by_all_desc_expansion", "row_identity": ["p_brand", "p_type"], "columns": ["p_brand", "p_type", "avg_price"]}, "variants": {"datafusion": "\nSELECT\n    p_brand,\n    p_type,\n    AVG(p_retailprice) as avg_price\nFROM part\nGROUP BY p_brand, p_type\nORDER BY p_brand DESC, p_type DESC, avg_price DESC\nLIMIT 100;\n", "redshift": "\nSELECT\n    p_brand,\n    p_type,\n    AVG(p_retailprice) as avg_price\nFROM part\nGROUP BY p_brand, p_type\nORDER BY p_brand DESC, p_type DESC, avg_price DESC\nLIMIT 100;\n", "bigquery": "SELECT p_brand, p_type, AVG(p_retailprice) AS avg_price FROM part GROUP BY p_brand, p_type ORDER BY p_brand DESC, p_type DESC, avg_price DESC LIMIT 100;", "doris": "\nSELECT\n    p_brand,\n    p_type,\n    AVG(p_retailprice) as avg_price\nFROM part\nGROUP BY p_brand, p_type\nORDER BY p_brand DESC, p_type DESC, avg_price DESC\nLIMIT 100;\n"}}
- {"id": "array_agg_simple", "category": "array", "sql": "\nSELECT\n    ps_suppkey,\n    ARRAY_AGG(ps_partkey ORDER BY ps_partkey) as supplied_parts,\n    COUNT(*) as part_count\nFROM partsupp\nGROUP BY ps_suppkey\nHAVING COUNT(*) <= 100\nORDER BY ps_suppkey\nLIMIT 100;\n", "result_contract": {"capability": "ordered_array_aggregation", "row_identity": ["ps_suppkey"], "columns": ["ps_suppkey", {"name": "supplied_parts", "type_class": "array", "order_sensitive": true}, "part_count"]}, "variants": {"clickhouse": "\nSELECT\n    ps_suppkey,\n    arraySort(groupArray(ps_partkey)) as supplied_parts,\n    COUNT(*) as part_count\nFROM partsupp\nGROUP BY ps_suppkey\nHAVING COUNT(*) <= 100\nORDER BY ps_suppkey\nLIMIT 100;\n", "doris": "\nSELECT\n    ps_suppkey,\n    ARRAY_SORT(COLLECT_LIST(ps_partkey)) as supplied_parts,\n    COUNT(*) as part_count\nFROM partsupp\nGROUP BY ps_suppkey\nHAVING COUNT(*) <= 100\nORDER BY ps_suppkey\nLIMIT 100;\n"}, "skip_on": ["redshift", "sqlite"], "description": "SQLite has no array type or ARRAY_AGG"}
- {"id": "array_agg_distinct", "category": "array", "sql": "\nSELECT\n    c_mktsegment,\n    ARRAY_AGG(DISTINCT c_nationkey ORDER BY c_nationkey) as nation_keys\nFROM customer\nGROUP BY c_mktsegment\nORDER BY c_mktsegment;\n", "result_contract": {"capability": "ordered_distinct_array_aggregation", "row_identity": ["c_mktsegment"], "columns": ["c_mktsegment", {"name": "nation_keys", "type_class": "array", "order_sensitive": true}]}, "variants": {"clickhouse": "\nSELECT\n    c_mktsegment,\n    arraySort(groupUniqArray(c_nationkey)) as nation_keys\nFROM customer\nGROUP BY c_mktsegment\nORDER BY c_mktsegment;\n", "doris": "\nSELECT\n    c_mktsegment,\n    ARRAY_SORT(COLLECT_SET(c_nationkey)) as nation_keys\nFROM customer\nGROUP BY c_mktsegment\nORDER BY c_mktsegment;\n"}, "skip_on": ["redshift", "sqlite"], "description": "SQLite has no array type or ARRAY_AGG"}
- {"id": "array_unnest", "category": "array", "sql": "\nWITH supplier_parts AS (\n    SELECT\n        ps_suppkey,\n        ARRAY_AGG(ps_partkey) as parts\n    FROM partsupp\n    WHERE ps_suppkey <= 10\n    GROUP BY ps_suppkey\n)\nSELECT\n    ps_suppkey,\n    UNNEST(parts) as part_key\nFROM supplier_parts;\n", "result_contract": {"capability": "array_unnest", "row_identity": ["ps_suppkey", "part_key"], "columns": ["ps_suppkey", "part_key"]}, "variants": {"bigquery": "\nWITH supplier_parts AS (\n    SELECT\n        ps_suppkey,\n        ARRAY_AGG(ps_partkey) as parts\n    FROM partsupp\n    WHERE ps_suppkey <= 10\n    GROUP BY ps_suppkey\n)\nSELECT\n    ps_suppkey,\n    part_key\nFROM supplier_parts, UNNEST(parts) as part_key;\n", "clickhouse": "\nWITH supplier_parts AS (\n    SELECT\n        ps_suppkey,\n        groupArray(ps_partkey) as parts\n    FROM partsupp\n    WHERE ps_suppkey <= 10\n    GROUP BY ps_suppkey\n)\nSELECT\n    ps_suppkey,\n    arrayJoin(parts) as part_key\nFROM supplier_parts;\n", "doris": "\nWITH supplier_parts AS (\n    SELECT\n        ps_suppkey,\n        COLLECT_LIST(ps_partkey) as parts\n    FROM partsupp\n    WHERE ps_suppkey <= 10\n    GROUP BY ps_suppkey\n)\nSELECT\n    ps_suppkey,\n    part_key\nFROM supplier_parts\nLATERAL VIEW EXPLODE(parts) exploded AS part_key;\n"}, "skip_on": ["redshift", "sqlite"], "description": "SQLite has no array type or ARRAY_AGG"}
- {"id": "array_contains", "category": "array", "sql": "\nWITH supplier_parts AS (\n    SELECT\n        ps_suppkey,\n        ARRAY_AGG(ps_partkey) as parts\n    FROM partsupp\n    GROUP BY ps_suppkey\n)\nSELECT\n    ps_suppkey,\n    ARRAY_CONTAINS(parts, 100) as has_part_100\nFROM supplier_parts\nORDER BY ps_suppkey\nLIMIT 100;\n", "result_contract": {"capability": "array_membership_predicate", "row_identity": ["ps_suppkey"], "columns": ["ps_suppkey", "has_part_100"]}, "variants": {"duckdb": "\nWITH supplier_parts AS (\n    SELECT\n        ps_suppkey,\n        ARRAY_AGG(ps_partkey) as parts\n    FROM partsupp\n    GROUP BY ps_suppkey\n)\nSELECT\n    ps_suppkey,\n    list_contains(parts, 100) as has_part_100\nFROM supplier_parts\nORDER BY ps_suppkey\nLIMIT 100;\n", "clickhouse": "\nWITH supplier_parts AS (\n    SELECT\n        ps_suppkey,\n        groupArray(ps_partkey) as parts\n    FROM partsupp\n    GROUP BY ps_suppkey\n)\nSELECT\n    ps_suppkey,\n    has(parts, 100) as has_part_100\nFROM supplier_parts\nORDER BY ps_suppkey\nLIMIT 100;\n", "bigquery": "\nWITH supplier_parts AS (\n    SELECT\n        ps_suppkey,\n        ARRAY_AGG(ps_partkey) as parts\n    FROM partsupp\n    GROUP BY ps_suppkey\n)\nSELECT\n    ps_suppkey,\n    100 IN UNNEST(parts) as has_part_100\nFROM supplier_parts\nORDER BY ps_suppkey\nLIMIT 100;\n"}, "skip_on": ["datafusion", "redshift", "sqlite"], "description": "SQLite has no array type or ARRAY_AGG"}
- {"id": "array_length", "category": "array", "sql": "\nWITH supplier_parts AS (\n    SELECT\n        ps_suppkey,\n        ARRAY_AGG(ps_partkey) as parts\n    FROM partsupp\n    GROUP BY ps_suppkey\n)\nSELECT\n    ps_suppkey,\n    CARDINALITY(parts) as num_parts\nFROM supplier_parts\nORDER BY num_parts DESC, ps_suppkey\nLIMIT 100;\n", "result_contract": {"capability": "array_cardinality", "row_identity": ["ps_suppkey"], "columns": ["ps_suppkey", "num_parts"]}, "variants": {"duckdb": "\nWITH supplier_parts AS (\n    SELECT\n        ps_suppkey,\n        ARRAY_AGG(ps_partkey) as parts\n    FROM partsupp\n    GROUP BY ps_suppkey\n)\nSELECT\n    ps_suppkey,\n    len(parts) as num_parts\nFROM supplier_parts\nORDER BY num_parts DESC, ps_suppkey\nLIMIT 100;\n", "clickhouse": "\nWITH supplier_parts AS (\n    SELECT\n        ps_suppkey,\n        groupArray(ps_partkey) as parts\n    FROM partsupp\n    GROUP BY ps_suppkey\n)\nSELECT\n    ps_suppkey,\n    length(parts) as num_parts\nFROM supplier_parts\nORDER BY num_parts DESC, ps_suppkey\nLIMIT 100;\n", "snowflake": "WITH supplier_parts AS (\n    SELECT ps_suppkey, ARRAY_AGG(ps_partkey) AS parts\n    FROM partsupp GROUP BY ps_suppkey\n)\nSELECT ps_suppkey, ARRAY_SIZE(parts) AS num_parts\nFROM supplier_parts\nORDER BY num_parts DESC, ps_suppkey\nLIMIT 100;", "bigquery": "WITH supplier_parts AS (\n    SELECT ps_suppkey, ARRAY_AGG(ps_partkey) AS parts\n    FROM partsupp GROUP BY ps_suppkey\n)\nSELECT ps_suppkey, ARRAY_LENGTH(parts) AS num_parts\nFROM supplier_parts\nORDER BY num_parts DESC, ps_suppkey\nLIMIT 100;"}, "skip_on": ["datafusion", "redshift", "sqlite"], "description": "SQLite has no array type or ARRAY_AGG"}
- {"id": "array_slice", "category": "array", "sql": "\nWITH order_prices AS (\n    SELECT\n        o_custkey,\n        ARRAY_AGG(o_totalprice ORDER BY o_totalprice DESC) as prices\n    FROM orders\n    GROUP BY o_custkey\n    HAVING COUNT(*) >= 5\n)\nSELECT\n    o_custkey,\n    ARRAY_SLICE(prices, 1, 3) as top_3_orders\nFROM order_prices\nORDER BY o_custkey\nLIMIT 100;\n", "result_contract": {"capability": "ordered_array_slice", "row_identity": ["o_custkey"], "columns": ["o_custkey", {"name": "top_3_orders", "type_class": "array", "order_sensitive": true}]}, "variants": {"duckdb": "\nWITH order_prices AS (\n    SELECT\n        o_custkey,\n        ARRAY_AGG(o_totalprice ORDER BY o_totalprice DESC) as prices\n    FROM orders\n    GROUP BY o_custkey\n    HAVING COUNT(*) >= 5\n)\nSELECT\n    o_custkey,\n    prices[1:3] as top_3_orders\nFROM order_prices\nORDER BY o_custkey\nLIMIT 100;\n", "clickhouse": "\nWITH order_prices AS (\n    SELECT\n        o_custkey,\n        arrayReverseSort(groupArray(o_totalprice)) as prices\n    FROM orders\n    GROUP BY o_custkey\n    HAVING COUNT(*) >= 5\n)\nSELECT\n    o_custkey,\n    arraySlice(prices, 1, 3) as top_3_orders\nFROM order_prices\nORDER BY o_custkey\nLIMIT 100;\n", "doris": "\nWITH order_prices AS (\n    SELECT\n        o_custkey,\n        ARRAY_SORT(COLLECT_LIST(o_totalprice)) as prices\n    FROM orders\n    GROUP BY o_custkey\n    HAVING COUNT(*) >= 5\n)\nSELECT\n    o_custkey,\n    ARRAY_SLICE(REVERSE(prices), 1, 3) as top_3_orders\nFROM order_prices\nORDER BY o_custkey\nLIMIT 100;\n"}, "skip_on": ["redshift", "sqlite"], "description": "SQLite has no array type or ARRAY_AGG"}
- {"id": "array_min_max", "category": "array", "sql": "\nWITH order_prices AS (\n    SELECT\n        o_custkey,\n        ARRAY_AGG(o_totalprice) as prices\n    FROM orders\n    GROUP BY o_custkey\n)\nSELECT\n    o_custkey,\n    ARRAY_MIN(prices) as min_order,\n    ARRAY_MAX(prices) as max_order\nFROM order_prices\nORDER BY o_custkey\nLIMIT 100;\n", "result_contract": {"capability": "array_min_max", "row_identity": ["o_custkey"], "columns": ["o_custkey", "min_order", "max_order"]}, "variants": {"duckdb": "\nWITH order_prices AS (\n    SELECT\n        o_custkey,\n        ARRAY_AGG(o_totalprice) as prices\n    FROM orders\n    GROUP BY o_custkey\n)\nSELECT\n    o_custkey,\n    list_min(prices) as min_order,\n    list_max(prices) as max_order\nFROM order_prices\nORDER BY o_custkey\nLIMIT 100;\n", "clickhouse": "\nWITH order_prices AS (\n    SELECT\n        o_custkey,\n        groupArray(o_totalprice) as prices\n    FROM orders\n    GROUP BY o_custkey\n)\nSELECT\n    o_custkey,\n    arrayMin(prices) as min_order,\n    arrayMax(prices) as max_order\nFROM order_prices\nORDER BY o_custkey\nLIMIT 100;\n"}, "skip_on": ["bigquery", "datafusion", "redshift", "sqlite"], "description": "SQLite has no array type or ARRAY_AGG"}
- {"id": "array_sort", "category": "array", "sql": "\nWITH part_sizes AS (\n    SELECT\n        p_brand,\n        ARRAY_AGG(p_size) as sizes\n    FROM part\n    GROUP BY p_brand\n)\nSELECT\n    p_brand,\n    ARRAY_SORT(sizes) as sorted_sizes\nFROM part_sizes\nORDER BY p_brand\nLIMIT 50;\n", "result_contract": {"capability": "array_sort", "row_identity": ["p_brand"], "columns": ["p_brand", {"name": "sorted_sizes", "type_class": "array", "order_sensitive": true}]}, "variants": {"duckdb": "\nWITH part_sizes AS (\n    SELECT\n        p_brand,\n        ARRAY_AGG(p_size) as sizes\n    FROM part\n    GROUP BY p_brand\n)\nSELECT\n    p_brand,\n    list_sort(sizes) as sorted_sizes\nFROM part_sizes\nORDER BY p_brand\nLIMIT 50;\n", "clickhouse": "\nWITH part_sizes AS (\n    SELECT\n        p_brand,\n        groupArray(p_size) as sizes\n    FROM part\n    GROUP BY p_brand\n)\nSELECT\n    p_brand,\n    arraySort(sizes) as sorted_sizes\nFROM part_sizes\nORDER BY p_brand\nLIMIT 50;\n"}, "skip_on": ["bigquery", "redshift", "sqlite"], "description": "SQLite has no array type or ARRAY_AGG"}
- {"id": "array_distinct", "category": "array", "sql": "\nWITH ship_modes AS (\n    SELECT\n        l_orderkey,\n        ARRAY_AGG(l_shipmode) as modes\n    FROM lineitem\n    GROUP BY l_orderkey\n)\nSELECT\n    l_orderkey,\n    ARRAY_SORT(ARRAY_DISTINCT(modes)) as unique_modes\nFROM ship_modes\nORDER BY l_orderkey\nLIMIT 100;\n", "result_contract": {"capability": "distinct_array_values", "row_identity": ["l_orderkey"], "columns": ["l_orderkey", {"name": "unique_modes", "type_class": "array"}]}, "variants": {"duckdb": "\nWITH ship_modes AS (\n    SELECT\n        l_orderkey,\n        ARRAY_AGG(l_shipmode) as modes\n    FROM lineitem\n    GROUP BY l_orderkey\n)\nSELECT\n    l_orderkey,\n    list_sort(list_distinct(modes)) as unique_modes\nFROM ship_modes\nORDER BY l_orderkey\nLIMIT 100;\n", "clickhouse": "\nWITH ship_modes AS (\n    SELECT\n        l_orderkey,\n        groupArray(l_shipmode) as modes\n    FROM lineitem\n    GROUP BY l_orderkey\n)\nSELECT\n    l_orderkey,\n    arraySort(arrayDistinct(modes)) as unique_modes\nFROM ship_modes\nORDER BY l_orderkey\nLIMIT 100;\n"}, "skip_on": ["bigquery", "datafusion", "redshift", "sqlite"], "description": "SQLite has no array type or ARRAY_AGG"}
- {"id": "struct_construction", "category": "struct", "sql": "\nSELECT\n    c_custkey,\n    STRUCT(c_name, c_address, c_phone) as contact_info,\n    c_acctbal\nFROM customer\nWHERE c_nationkey = 1\nORDER BY c_custkey\nLIMIT 100;\n", "result_contract": {"capability": "positional_struct_construction", "row_identity": ["c_custkey"], "columns": ["c_custkey", {"name": "contact_info", "type_class": "struct"}, "c_acctbal"]}, "variants": {"clickhouse": "\nSELECT\n    c_custkey,\n    tuple(c_name, c_address, c_phone) as contact_info,\n    c_acctbal\nFROM customer\nWHERE c_nationkey = 1\nORDER BY c_custkey\nLIMIT 100;\n", "duckdb": "\nSELECT\n    c_custkey,\n    ROW(c_name, c_address, c_phone) as contact_info,\n    c_acctbal\nFROM customer\nWHERE c_nationkey = 1\nORDER BY c_custkey\nLIMIT 100;\n"}, "skip_on": ["redshift", "sqlite"], "description": "SQLite has no struct type"}
- {"id": "struct_access", "category": "struct", "sql": "\nWITH customer_info AS (\n    SELECT\n        c_custkey,\n        STRUCT(c_name AS name, c_phone AS phone, c_acctbal AS balance) as info\n    FROM customer\n    WHERE c_nationkey = 1\n)\nSELECT\n    c_custkey,\n    info.name,\n    info.balance\nFROM customer_info\nWHERE info.balance > 5000\nORDER BY c_custkey\nLIMIT 100;\n", "result_contract": {"capability": "struct_field_access", "row_identity": ["c_custkey"], "columns": ["c_custkey", "name", "balance"]}, "variants": {"clickhouse": "\nWITH customer_info AS (\n    SELECT\n        c_custkey,\n        tuple(c_name, c_phone, c_acctbal) as info\n    FROM customer\n    WHERE c_nationkey = 1\n)\nSELECT\n    c_custkey,\n    info.1 as name,\n    info.3 as balance\nFROM customer_info\nWHERE info.3 > 5000\nORDER BY c_custkey\nLIMIT 100;\n", "snowflake": "WITH customer_info AS (\n    SELECT c_custkey,\n        OBJECT_CONSTRUCT('name', c_name, 'phone', c_phone, 'balance', c_acctbal) AS info\n    FROM customer\n    WHERE c_nationkey = 1\n)\nSELECT c_custkey,\n    info:name::STRING AS name,\n    info:balance::DECIMAL(15, 2) AS balance\nFROM customer_info\nWHERE info:balance::DECIMAL(15, 2) > 5000\nORDER BY c_custkey\nLIMIT 100;", "doris": "\nWITH customer_info AS (\n    SELECT\n        c_custkey,\n        NAMED_STRUCT('name', c_name, 'phone', c_phone, 'balance', c_acctbal) as info\n    FROM customer\n    WHERE c_nationkey = 1\n)\nSELECT\n    c_custkey,\n    info.name,\n    info.balance\nFROM customer_info\nWHERE info.balance > 5000\nORDER BY c_custkey\nLIMIT 100;\n"}, "skip_on": ["redshift", "sqlite"], "description": "SQLite has no struct type"}
- {"id": "array_of_struct", "category": "struct", "sql": "\nSELECT\n    o_orderkey,\n    ARRAY_AGG(\n        STRUCT(l_linenumber, l_partkey, l_quantity, l_extendedprice)\n        ORDER BY l_linenumber\n    ) as line_items\nFROM orders o\nJOIN lineitem l ON o.o_orderkey = l.l_orderkey\nWHERE o_orderdate = DATE '1995-03-15'\nGROUP BY o_orderkey\nORDER BY o_orderkey\nLIMIT 50;\n", "result_contract": {"capability": "ordered_array_of_structs", "row_identity": ["o_orderkey"], "columns": ["o_orderkey", {"name": "line_items", "type_class": "array", "order_sensitive": true}]}, "variants": {"duckdb": "\nSELECT\n    o_orderkey,\n    ARRAY_AGG(\n        struct_pack(\n            l_linenumber := l_linenumber,\n            l_partkey := l_partkey,\n            l_quantity := l_quantity,\n            l_extendedprice := l_extendedprice\n        )\n        ORDER BY l_linenumber\n    ) as line_items\nFROM orders o\nJOIN lineitem l ON o.o_orderkey = l.l_orderkey\nWHERE o_orderdate = DATE '1995-03-15'\nGROUP BY o_orderkey\nORDER BY o_orderkey\nLIMIT 50;\n", "clickhouse": "\nSELECT\n    o_orderkey,\n    arraySort(\n        x -> x.1,\n        groupArray(\n            CAST(\n                (l_linenumber, l_partkey, l_quantity, l_extendedprice),\n                'Tuple(l_linenumber Int32, l_partkey Int32, l_quantity Decimal(15,2), l_extendedprice Decimal(15,2))'\n            )\n        )\n    ) as line_items\nFROM orders o\nJOIN lineitem l ON o.o_orderkey = l.l_orderkey\nWHERE o_orderdate = '1995-03-15'\nGROUP BY o_orderkey\nORDER BY o_orderkey\nLIMIT 50;\n", "doris": "\nWITH ordered_lines AS (\n    SELECT\n        o_orderkey,\n        COLLECT_LIST(\n            NAMED_STRUCT('l_linenumber', l_linenumber, 'l_partkey', l_partkey, 'l_quantity', l_quantity, 'l_extendedprice', l_extendedprice)\n        ) as unsorted_items\n    FROM orders o\n    JOIN lineitem l ON o.o_orderkey = l.l_orderkey\n    WHERE o_orderdate = DATE '1995-03-15'\n    GROUP BY o_orderkey\n)\nSELECT\n    o_orderkey,\n    ARRAY_MAP(\n        i -> unsorted_items[i],\n        ARRAY_SORTBY(\n            ARRAY_RANGE(1, ARRAY_SIZE(unsorted_items) + 1),\n            ARRAY_MAP(s -> STRUCT_ELEMENT(s, 'l_linenumber'), unsorted_items)\n        )\n    ) as line_items\nFROM ordered_lines\nORDER BY o_orderkey\nLIMIT 50;\n"}, "skip_on": ["redshift", "sqlite"], "description": "SQLite has no struct type"}
- {"id": "map_construction", "category": "map", "sql": "\nSELECT\n    ps_suppkey,\n    MAP_FROM_ENTRIES(\n        ARRAY_AGG(STRUCT(CAST(ps_partkey AS VARCHAR), ps_supplycost))\n    ) as part_costs\nFROM partsupp\nWHERE ps_suppkey <= 10\nGROUP BY ps_suppkey\nORDER BY ps_suppkey;\n", "result_contract": {"capability": "map_construction", "row_identity": ["ps_suppkey"], "columns": ["ps_suppkey", {"name": "part_costs", "type_class": "map"}]}, "variants": {"duckdb": "\nSELECT\n    ps_suppkey,\n    map_from_entries(\n        list(struct_pack(k := CAST(ps_partkey AS VARCHAR), v := ps_supplycost))\n    ) as part_costs\nFROM partsupp\nWHERE ps_suppkey <= 10\nGROUP BY ps_suppkey\nORDER BY ps_suppkey;\n", "datafusion": "\nSELECT\n    ps_suppkey,\n    MAP(\n        ARRAY_AGG(CAST(ps_partkey AS VARCHAR)),\n        ARRAY_AGG(ps_supplycost)\n    ) as part_costs\nFROM partsupp\nWHERE ps_suppkey <= 10\nGROUP BY ps_suppkey\nORDER BY ps_suppkey;\n", "clickhouse": "\nSELECT\n    ps_suppkey,\n    CAST(\n        (groupArray(CAST(ps_partkey AS String)), groupArray(ps_supplycost)),\n        'Map(String, Decimal(15,2))'\n    ) as part_costs\nFROM partsupp\nWHERE ps_suppkey <= 10\nGROUP BY ps_suppkey\nORDER BY ps_suppkey;\n", "doris": "\nSELECT\n    ps_suppkey,\n    MAP_AGG(CAST(ps_partkey AS STRING), ps_supplycost) as part_costs\nFROM partsupp\nWHERE ps_suppkey <= 10\nGROUP BY ps_suppkey\nORDER BY ps_suppkey;\n"}, "skip_on": ["bigquery", "redshift", "snowflake", "sqlite"], "description": "Snowflake OBJECT_AGG produces an OBJECT rather than the native map required by this result contract."}
- {"id": "map_access", "category": "map", "sql": "\nWITH supplier_costs AS (\n    SELECT\n        ps_suppkey,\n        MAP_FROM_ENTRIES(\n            ARRAY_AGG(STRUCT(CAST(ps_partkey AS VARCHAR), ps_supplycost))\n        ) as part_costs\n    FROM partsupp\n    WHERE ps_suppkey <= 10\n    GROUP BY ps_suppkey\n)\nSELECT\n    ps_suppkey,\n    part_costs['1'] as cost_for_part_1,\n    part_costs['5'] as cost_for_part_5\nFROM supplier_costs\nORDER BY ps_suppkey\nLIMIT 10;\n", "result_contract": {"capability": "map_key_access", "row_identity": ["ps_suppkey"], "columns": ["ps_suppkey", "cost_for_part_1", "cost_for_part_5"]}, "variants": {"datafusion": "\nWITH supplier_costs AS (\n    SELECT\n        ps_suppkey,\n        MAP(\n            ARRAY_AGG(CAST(ps_partkey AS VARCHAR)),\n            ARRAY_AGG(ps_supplycost)\n        ) as part_costs\n    FROM partsupp\n    WHERE ps_suppkey <= 10\n    GROUP BY ps_suppkey\n)\nSELECT\n    ps_suppkey,\n    MAP_EXTRACT(part_costs, '1')[1] as cost_for_part_1,\n    MAP_EXTRACT(part_costs, '5')[1] as cost_for_part_5\nFROM supplier_costs\nORDER BY ps_suppkey\nLIMIT 10;\n", "clickhouse": "\nWITH supplier_costs AS (\n    SELECT\n        ps_suppkey,\n        CAST(\n            (groupArray(CAST(ps_partkey AS String)), groupArray(ps_supplycost)),\n            'Map(String, Decimal(15,2))'\n        ) as part_costs\n    FROM partsupp\n    WHERE ps_suppkey <= 10\n    GROUP BY ps_suppkey\n)\nSELECT\n    ps_suppkey,\n    part_costs['1'] as cost_for_part_1,\n    part_costs['5'] as cost_for_part_5\nFROM supplier_costs\nLIMIT 10;\n", "doris": "\nWITH supplier_costs AS (\n    SELECT\n        ps_suppkey,\n        MAP_AGG(CAST(ps_partkey AS STRING), ps_supplycost) as part_costs\n    FROM partsupp\n    WHERE ps_suppkey <= 10\n    GROUP BY ps_suppkey\n)\nSELECT\n    ps_suppkey,\n    part_costs['1'] as cost_for_part_1,\n    part_costs['5'] as cost_for_part_5\nFROM supplier_costs\nORDER BY ps_suppkey\nLIMIT 10;\n"}, "skip_on": ["bigquery", "redshift", "snowflake", "sqlite"], "description": "Snowflake OBJECT key access would replace native map lookup with a different measured capability."}
- {"id": "map_keys_values", "category": "map", "sql": "\nWITH supplier_costs AS (\n    SELECT\n        ps_suppkey,\n        MAP_FROM_ENTRIES(\n            ARRAY_AGG(STRUCT(CAST(ps_partkey AS VARCHAR), ps_supplycost))\n        ) as part_costs\n    FROM partsupp\n    WHERE ps_suppkey <= 5\n    GROUP BY ps_suppkey\n)\nSELECT\n    ps_suppkey,\n    MAP_KEYS(part_costs) as part_ids,\n    MAP_VALUES(part_costs) as costs\nFROM supplier_costs\nORDER BY ps_suppkey;\n", "result_contract": {"capability": "map_keys_values", "row_identity": ["ps_suppkey"], "columns": ["ps_suppkey", {"name": "part_ids", "type_class": "array"}, {"name": "costs", "type_class": "array"}]}, "variants": {"datafusion": "\nWITH supplier_costs AS (\n    SELECT\n        ps_suppkey,\n        MAP(\n            ARRAY_AGG(CAST(ps_partkey AS VARCHAR)),\n            ARRAY_AGG(ps_supplycost)\n        ) as part_costs\n    FROM partsupp\n    WHERE ps_suppkey <= 5\n    GROUP BY ps_suppkey\n)\nSELECT\n    ps_suppkey,\n    MAP_KEYS(part_costs) as part_ids,\n    MAP_VALUES(part_costs) as costs\nFROM supplier_costs\nORDER BY ps_suppkey;\n", "clickhouse": "\nWITH supplier_costs AS (\n    SELECT\n        ps_suppkey,\n        CAST(\n            (groupArray(CAST(ps_partkey AS String)), groupArray(ps_supplycost)),\n            'Map(String, Decimal(15,2))'\n        ) as part_costs\n    FROM partsupp\n    WHERE ps_suppkey <= 5\n    GROUP BY ps_suppkey\n)\nSELECT\n    ps_suppkey,\n    mapKeys(part_costs) as part_ids,\n    mapValues(part_costs) as costs\nFROM supplier_costs\nORDER BY ps_suppkey;\n", "doris": "\nWITH supplier_costs AS (\n    SELECT\n        ps_suppkey,\n        MAP_AGG(CAST(ps_partkey AS STRING), ps_supplycost) as part_costs\n    FROM partsupp\n    WHERE ps_suppkey <= 5\n    GROUP BY ps_suppkey\n)\nSELECT\n    ps_suppkey,\n    MAP_KEYS(part_costs) as part_ids,\n    MAP_VALUES(part_costs) as costs\nFROM supplier_costs\nORDER BY ps_suppkey;\n"}, "skip_on": ["bigquery", "redshift", "snowflake", "sqlite"], "description": "Snowflake OBJECT keys and values do not satisfy the native map capability in this result contract."}
- {"id": "list_transform", "category": "lambda", "sql": "\nWITH part_prices AS (\n    SELECT\n        p_brand,\n        ARRAY_AGG(p_retailprice) as prices\n    FROM part\n    GROUP BY p_brand\n)\nSELECT\n    p_brand,\n    TRANSFORM(prices, x -> x * 1.1) as prices_with_tax\nFROM part_prices\nORDER BY p_brand\nLIMIT 50;\n", "result_contract": {"capability": "array_lambda_transform", "row_identity": ["p_brand"], "columns": ["p_brand", {"name": "prices_with_tax", "type_class": "array"}]}, "variants": {"duckdb": "\nWITH part_prices AS (\n    SELECT\n        p_brand,\n        ARRAY_AGG(p_retailprice) as prices\n    FROM part\n    GROUP BY p_brand\n)\nSELECT\n    p_brand,\n    list_transform(prices, x -> x * 1.1) as prices_with_tax\nFROM part_prices\nORDER BY p_brand\nLIMIT 50;\n", "clickhouse": "\nWITH part_prices AS (\n    SELECT\n        p_brand,\n        groupArray(p_retailprice) as prices\n    FROM part\n    GROUP BY p_brand\n)\nSELECT\n    p_brand,\n    arrayMap(x -> x * 1.1, prices) as prices_with_tax\nFROM part_prices\nORDER BY p_brand\nLIMIT 50;\n", "doris": "\nWITH part_prices AS (\n    SELECT\n        p_brand,\n        COLLECT_LIST(p_retailprice) as prices\n    FROM part\n    GROUP BY p_brand\n)\nSELECT\n    p_brand,\n    ARRAY_MAP(x -> x * 1.1, prices) as prices_with_tax\nFROM part_prices\nORDER BY p_brand\nLIMIT 50;\n"}, "skip_on": ["bigquery", "datafusion", "redshift", "sqlite"], "description": "SQLite has no lambda functions or higher-order list functions"}
- {"id": "list_filter", "category": "lambda", "sql": "\nWITH order_prices AS (\n    SELECT\n        o_custkey,\n        ARRAY_AGG(o_totalprice) as prices\n    FROM orders\n    GROUP BY o_custkey\n)\nSELECT\n    o_custkey,\n    FILTER(prices, x -> x > 100000) as large_orders\nFROM order_prices\nORDER BY o_custkey\nLIMIT 100;\n", "result_contract": {"capability": "array_lambda_filter", "row_identity": ["o_custkey"], "columns": ["o_custkey", {"name": "large_orders", "type_class": "array"}]}, "variants": {"duckdb": "\nWITH order_prices AS (\n    SELECT\n        o_custkey,\n        ARRAY_AGG(o_totalprice) as prices\n    FROM orders\n    GROUP BY o_custkey\n)\nSELECT\n    o_custkey,\n    list_filter(prices, x -> x > 100000) as large_orders\nFROM order_prices\nORDER BY o_custkey\nLIMIT 100;\n", "clickhouse": "\nWITH order_prices AS (\n    SELECT\n        o_custkey,\n        groupArray(o_totalprice) as prices\n    FROM orders\n    GROUP BY o_custkey\n)\nSELECT\n    o_custkey,\n    arrayFilter(x -> x > 100000, prices) as large_orders\nFROM order_prices\nORDER BY o_custkey\nLIMIT 100;\n", "doris": "\nWITH order_prices AS (\n    SELECT\n        o_custkey,\n        COLLECT_LIST(o_totalprice) as prices\n    FROM orders\n    GROUP BY o_custkey\n)\nSELECT\n    o_custkey,\n    ARRAY_FILTER(x -> x > 100000, prices) as large_orders\nFROM order_prices\nORDER BY o_custkey\nLIMIT 100;\n"}, "skip_on": ["bigquery", "datafusion", "redshift", "sqlite"], "description": "SQLite has no lambda functions or higher-order list functions"}
- {"id": "list_reduce", "category": "lambda", "sql": "\nWITH quantities AS (\n    SELECT\n        l_orderkey,\n        ARRAY_AGG(l_quantity) as qtys\n    FROM lineitem\n    GROUP BY l_orderkey\n)\nSELECT\n    l_orderkey,\n    REDUCE(qtys, 0, (acc, x) -> acc + x) as total_qty\nFROM quantities\nORDER BY l_orderkey\nLIMIT 100;\n", "result_contract": {"capability": "array_lambda_reduce", "row_identity": ["l_orderkey"], "columns": ["l_orderkey", "total_qty"]}, "variants": {"spark": "\nWITH quantities AS (\n    SELECT\n        l_orderkey,\n        ARRAY_AGG(l_quantity) as qtys\n    FROM lineitem\n    GROUP BY l_orderkey\n)\nSELECT\n    l_orderkey,\n    AGGREGATE(qtys, CAST(0 AS DECIMAL(38, 2)), (acc, x) -> acc + x) as total_qty\nFROM quantities\nORDER BY l_orderkey\nLIMIT 100;\n", "duckdb": "\nWITH quantities AS (\n    SELECT\n        l_orderkey,\n        ARRAY_AGG(l_quantity) as qtys\n    FROM lineitem\n    GROUP BY l_orderkey\n)\nSELECT\n    l_orderkey,\n    list_reduce(qtys, (acc, x) -> acc + x) as total_qty\nFROM quantities\nORDER BY l_orderkey\nLIMIT 100;\n", "clickhouse": "\nWITH quantities AS (\n    SELECT\n        l_orderkey,\n        groupArray(l_quantity) as qtys\n    FROM lineitem\n    GROUP BY l_orderkey\n)\nSELECT\n    l_orderkey,\n    arrayReduce('sum', qtys) as total_qty\nFROM quantities\nORDER BY l_orderkey\nLIMIT 100;\n", "doris": "\nWITH quantities AS (\n    SELECT\n        l_orderkey,\n        COLLECT_LIST(l_quantity) as qtys\n    FROM lineitem\n    GROUP BY l_orderkey\n)\nSELECT\n    l_orderkey,\n    ARRAY_SUM(qtys) as total_qty\nFROM quantities\nORDER BY l_orderkey\nLIMIT 100;\n"}, "skip_on": ["bigquery", "datafusion", "redshift", "databricks", "sqlite"], "description": "SQLite has no lambda functions or higher-order list functions"}
- {"id": "asof_join_basic", "category": "timeseries", "sql": "\nSELECT\n    l.l_orderkey,\n    l.l_shipdate,\n    o.o_orderdate,\n    o.o_totalprice,\n    l.l_shipdate - o.o_orderdate as days_to_ship\nFROM lineitem l\nASOF JOIN orders o\n    ON l.l_orderkey = o.o_orderkey\n    AND l.l_shipdate >= o.o_orderdate\nWHERE l.l_shipdate >= DATE '1995-01-01'\n  AND l.l_shipdate < DATE '1995-02-01'\nORDER BY l.l_orderkey, l.l_shipdate\nLIMIT 100;\n", "result_contract": {"capability": "asof_temporal_join", "columns": ["l_orderkey", "l_shipdate", "o_orderdate", "o_totalprice", "days_to_ship"]}, "variants": {"snowflake": "\nSELECT\n    l.l_orderkey,\n    l.l_shipdate,\n    o.o_orderdate,\n    o.o_totalprice,\n    l.l_shipdate - o.o_orderdate as days_to_ship\nFROM lineitem l\nASOF JOIN orders o\n    MATCH_CONDITION (l.l_shipdate >= o.o_orderdate)\n    ON l.l_orderkey = o.o_orderkey\nWHERE l.l_shipdate >= DATE '1995-01-01'\n  AND l.l_shipdate < DATE '1995-02-01'\nORDER BY l.l_orderkey, l.l_shipdate\nLIMIT 100;\n"}, "skip_on": ["spark", "bigquery", "datafusion", "databricks", "redshift", "sqlite"], "description": "SQLite has no ASOF JOIN"}
- {"id": "pivot_basic", "category": "pivot", "sql": "\nSELECT *\nFROM (\n    SELECT\n        l_returnflag,\n        l_shipmode,\n        l_quantity\n    FROM lineitem\n    WHERE l_shipdate >= DATE '1995-01-01'\n      AND l_shipdate < DATE '1995-04-01'\n)\nPIVOT (\n    SUM(l_quantity)\n    FOR l_shipmode IN ('AIR', 'RAIL', 'SHIP', 'TRUCK')\n);\n", "skip_on": ["clickhouse"]}
- {"id": "unpivot_basic", "category": "pivot", "sql": "\nSELECT\n    p_partkey,\n    dimension_name,\n    dimension_value\nFROM (\n    SELECT\n        p_partkey,\n        CAST(p_size AS DECIMAL(15, 2)) as p_size,\n        p_retailprice\n    FROM part\n    WHERE p_partkey <= 100\n)\nUNPIVOT (\n    dimension_value\n    FOR dimension_name IN (p_size, p_retailprice)\n)\nORDER BY p_partkey, dimension_name;\n", "result_contract": {"capability": "unpivot_rows", "row_identity": ["p_partkey", "dimension_name"], "columns": ["p_partkey", "dimension_name", "dimension_value"]}, "variants": {"datafusion": "\nSELECT\n    p_partkey,\n    'p_size' as dimension_name,\n    CAST(p_size AS DECIMAL(15, 2)) as dimension_value\nFROM part\nWHERE p_partkey <= 100\nUNION ALL\nSELECT\n    p_partkey,\n    'p_retailprice' as dimension_name,\n    p_retailprice as dimension_value\nFROM part\nWHERE p_partkey <= 100\nORDER BY p_partkey, dimension_name;\n", "doris": "\nSELECT\n    p_partkey,\n    dimension_name,\n    dimension_value\nFROM (\n    SELECT p_partkey, 'p_size' AS dimension_name, CAST(p_size AS DECIMAL(15, 2)) AS dimension_value\n    FROM part\n    WHERE p_partkey <= 100\n    UNION ALL\n    SELECT p_partkey, 'p_retailprice' AS dimension_name, CAST(p_retailprice AS DECIMAL(15, 2)) AS dimension_value\n    FROM part\n    WHERE p_partkey <= 100\n) unpivoted\nORDER BY p_partkey, dimension_name;\n"}, "skip_on": ["clickhouse"]}
