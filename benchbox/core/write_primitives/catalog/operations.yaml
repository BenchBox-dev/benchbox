- {"id": "insert_single_row", "description": "Tests single row INSERT performance with all columns specified", "write_sql": "INSERT INTO insert_ops_lineitem\nVALUES (\n  9000001, 1, 1, 1,\n  10.0, 1000.0, 0.05, 0.02,\n  'N', 'O',\n  DATE '1998-01-01', DATE '1998-01-15', DATE '1998-01-20',\n  'DELIVER IN PERSON', 'TRUCK', 'test insert'\n)\n", "validation_queries": [{"id": "verify_values", "sql": "SELECT l_quantity, l_extendedprice, l_discount\nFROM insert_ops_lineitem\nWHERE l_orderkey = 9000001\n", "expected_rows": 1}], "cleanup_sql": "DELETE FROM insert_ops_lineitem WHERE l_orderkey = 9000001\n", "expected_rows_affected": 1}
- {"id": "insert_batch_values_10", "description": "Tests small batch INSERT using VALUES clause with 10 rows", "write_sql": "INSERT INTO insert_ops_lineitem VALUES\n  (9000010, 1, 1, 1, 10.0, 1000.0, 0.05, 0.02, 'N', 'O', DATE '1998-01-01', DATE '1998-01-15', DATE '1998-01-20', 'DELIVER IN PERSON', 'TRUCK', 'batch 1'),\n  (9000011, 2, 2, 1, 20.0, 2000.0, 0.05, 0.02, 'N', 'O', DATE '1998-01-01', DATE '1998-01-15', DATE '1998-01-20', 'DELIVER IN PERSON', 'TRUCK', 'batch 2'),\n  (9000012, 3, 3, 1, 30.0, 3000.0, 0.05, 0.02, 'N', 'O', DATE '1998-01-01', DATE '1998-01-15', DATE '1998-01-20', 'DELIVER IN PERSON', 'TRUCK', 'batch 3'),\n  (9000013, 4, 4, 1, 40.0, 4000.0, 0.05, 0.02, 'N', 'O', DATE '1998-01-01', DATE '1998-01-15', DATE '1998-01-20', 'DELIVER IN PERSON', 'TRUCK', 'batch 4'),\n  (9000014, 5, 5, 1, 50.0, 5000.0, 0.05, 0.02, 'N', 'O', DATE '1998-01-01', DATE '1998-01-15', DATE '1998-01-20', 'DELIVER IN PERSON', 'TRUCK', 'batch 5'),\n  (9000015, 6, 6, 1, 60.0, 6000.0, 0.05, 0.02, 'N', 'O', DATE '1998-01-01', DATE '1998-01-15', DATE '1998-01-20', 'DELIVER IN PERSON', 'TRUCK', 'batch 6'),\n  (9000016, 7, 7, 1, 70.0, 7000.0, 0.05, 0.02, 'N', 'O', DATE '1998-01-01', DATE '1998-01-15', DATE '1998-01-20', 'DELIVER IN PERSON', 'TRUCK', 'batch 7'),\n  (9000017, 8, 8, 1, 80.0, 8000.0, 0.05, 0.02, 'N', 'O', DATE '1998-01-01', DATE '1998-01-15', DATE '1998-01-20', 'DELIVER IN PERSON', 'TRUCK', 'batch 8'),\n  (9000018, 9, 9, 1, 90.0, 9000.0, 0.05, 0.02, 'N', 'O', DATE '1998-01-01', DATE '1998-01-15', DATE '1998-01-20', 'DELIVER IN PERSON', 'TRUCK', 'batch 9'),\n  (9000019, 10, 10, 1, 100.0, 10000.0, 0.05, 0.02, 'N', 'O', DATE '1998-01-01', DATE '1998-01-15', DATE '1998-01-20', 'DELIVER IN PERSON', 'TRUCK', 'batch 10')\n", "validation_queries": [{"id": "verify_batch", "sql": "SELECT l_orderkey, l_quantity FROM insert_ops_lineitem WHERE l_orderkey BETWEEN 9000010 AND 9000019 ORDER BY l_orderkey", "expected_rows": 10}], "cleanup_sql": "DELETE FROM insert_ops_lineitem WHERE l_orderkey BETWEEN 9000010 AND 9000019\n", "expected_rows_affected": 10}
- {"id": "insert_select_simple", "description": "Tests INSERT INTO...SELECT with simple WHERE filter", "write_sql": "DELETE FROM insert_ops_lineitem WHERE l_orderkey BETWEEN 1 AND 10;\nINSERT INTO insert_ops_lineitem\nSELECT * FROM lineitem\nWHERE l_orderkey BETWEEN 1 AND 10\n", "validation_queries": [{"id": "verify_insert_select", "sql": "SELECT l_orderkey, l_linenumber\nFROM insert_ops_lineitem\nWHERE l_orderkey BETWEEN 1 AND 10\nORDER BY l_orderkey, l_linenumber\n", "expected_rows": null, "expected_rows_min": 1, "expected_rows_max": 200}], "cleanup_sql": "DELETE FROM insert_ops_lineitem WHERE l_orderkey BETWEEN 1 AND 10\n", "platform_overrides": {"starrocks": null, "questdb": "INSERT INTO insert_ops_lineitem\nSELECT * FROM lineitem\nWHERE l_orderkey BETWEEN 1 AND 10\n"}}
- {"id": "insert_batch_values_100", "description": "Tests medium batch INSERT using VALUES clause with 100 rows to measure batch overhead", "write_sql": "INSERT INTO insert_ops_lineitem\nSELECT 9000100 + n, 1, 1, 1, CAST(10.0 * n AS DECIMAL(15,2)), CAST(1000.0 * n AS DECIMAL(15,2)), CAST(0.05 AS DECIMAL(15,2)), CAST(0.02 AS DECIMAL(15,2)), 'N', 'O',\n       DATE '1998-01-01', DATE '1998-01-15', DATE '1998-01-20',\n       'DELIVER IN PERSON', 'TRUCK', 'batch_' || CAST(n AS VARCHAR)\nFROM (SELECT unnest(generate_series(0, 99)) AS n) t\n", "validation_queries": [{"id": "verify_batch_100", "sql": "SELECT COUNT(*) as cnt FROM insert_ops_lineitem WHERE l_orderkey BETWEEN 9000100 AND 9000199", "expected_rows": 1}], "cleanup_sql": "DELETE FROM insert_ops_lineitem WHERE l_orderkey BETWEEN 9000100 AND 9000199\n", "expected_rows_affected": 100, "platform_overrides": {"databricks": "INSERT INTO insert_ops_lineitem\nSELECT 9000100 + n, 1, 1, 1, CAST(10.0 * n AS DECIMAL(15,2)), CAST(1000.0 * n AS DECIMAL(15,2)), CAST(0.05 AS DECIMAL(15,2)), CAST(0.02 AS DECIMAL(15,2)), 'N', 'O',\n       DATE '1998-01-01', DATE '1998-01-15', DATE '1998-01-20',\n       'DELIVER IN PERSON', 'TRUCK', 'batch_' || CAST(n AS VARCHAR)\nFROM (SELECT EXPLODE(SEQUENCE(0, 99)) AS n) t\n", "bigquery": "INSERT INTO insert_ops_lineitem\nSELECT 9000100 + n, 1, 1, 1, CAST(10.0 * n AS NUMERIC), CAST(1000.0 * n AS NUMERIC), CAST(0.05 AS NUMERIC), CAST(0.02 AS NUMERIC), 'N', 'O',\n       DATE '1998-01-01', DATE '1998-01-15', DATE '1998-01-20',\n       'DELIVER IN PERSON', 'TRUCK', 'batch_' || CAST(n AS STRING)\nFROM UNNEST(GENERATE_ARRAY(0, 99)) AS n\n", "starrocks": null, "datafusion": "INSERT INTO insert_ops_lineitem\nSELECT 9000100 + n AS l_orderkey, 1 AS l_partkey, 1 AS l_suppkey, 1 AS l_linenumber, 10.0 * n AS l_quantity, 1000.0 * n AS l_extendedprice, 0.05 AS l_discount, 0.02 AS l_tax, 'N' AS l_returnflag, 'O' AS l_linestatus,\n       DATE '1998-01-01' AS l_shipdate, DATE '1998-01-15' AS l_commitdate, DATE '1998-01-20' AS l_receiptdate,\n       'DELIVER IN PERSON' AS l_shipinstruct, 'TRUCK' AS l_shipmode, 'batch_' || CAST(n AS VARCHAR) AS l_comment\nFROM (SELECT unnest(generate_series(0, 99)) AS n) t\n", "snowflake": "INSERT INTO insert_ops_lineitem\nSELECT 9000100 + n, 1, 1, 1, CAST(10.0 * n AS DECIMAL(15,2)), CAST(1000.0 * n AS DECIMAL(15,2)), CAST(0.05 AS DECIMAL(15,2)), CAST(0.02 AS DECIMAL(15,2)), 'N', 'O',\n       DATE '1998-01-01', DATE '1998-01-15', DATE '1998-01-20',\n       'DELIVER IN PERSON', 'TRUCK', 'batch_' || CAST(n AS VARCHAR)\nFROM (SELECT ROW_NUMBER() OVER (ORDER BY SEQ4()) - 1 AS n FROM TABLE(GENERATOR(ROWCOUNT => 100))) t\n", "sqlite": "WITH RECURSIVE series(n) AS (SELECT 0 UNION ALL SELECT n + 1 FROM series WHERE n < 99)\nINSERT INTO insert_ops_lineitem\nSELECT 9000100 + n, 1, 1, 1, 10.0 * n, 1000.0 * n, 0.05, 0.02, 'N', 'O',\n       '1998-01-01', '1998-01-15', '1998-01-20',\n       'DELIVER IN PERSON', 'TRUCK', 'batch_' || CAST(n AS TEXT)\nFROM series\n", "singlestore": "INSERT INTO insert_ops_lineitem\nSELECT 9000100 + t.n, 1, 1, 1, CAST(10.0 * t.n AS DECIMAL(15,2)), CAST(1000.0 * t.n AS DECIMAL(15,2)), CAST(0.05 AS DECIMAL(15,2)), CAST(0.02 AS DECIMAL(15,2)), 'N', 'O',\n       CAST('1998-01-01' AS DATE), CAST('1998-01-15' AS DATE), CAST('1998-01-20' AS DATE),\n       'DELIVER IN PERSON', 'TRUCK', CONCAT('batch_', CAST(t.n AS CHAR))\nFROM (SELECT a.n * 10 + b.n AS n FROM (SELECT 0 AS n UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) a CROSS JOIN (SELECT 0 AS n UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) b) t\n"}}
