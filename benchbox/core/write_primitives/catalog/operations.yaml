- {"id": "delete_gdpr_suppliers_5pct", "description": "Tests GDPR-compliant deletion with IN subquery at medium scale to measure deletion-by-list performance (5% of suppliers)", "write_sql": "DELETE FROM delete_ops_lineitem\nWHERE l_suppkey IN (\n  SELECT DISTINCT l_suppkey\n  FROM lineitem\n  WHERE l_suppkey <= (SELECT MAX(l_suppkey) * 0.05 FROM lineitem)\n)\n", "validation_queries": [{"id": "verify_gdpr_deletion_medium", "sql": "SELECT\n  CASE\n    WHEN COUNT(DISTINCT l_suppkey) = 0 THEN 1\n    ELSE 0\n  END as validation_passed\nFROM delete_ops_lineitem\nWHERE l_suppkey <= (SELECT MAX(l_suppkey) * 0.05 FROM lineitem)\n", "expected_rows": 1, "expected_rows_min": 1}], "cleanup_sql": "INSERT INTO delete_ops_lineitem\nSELECT * FROM lineitem\nWHERE l_suppkey <= (SELECT MAX(l_suppkey) * 0.05 FROM lineitem)\n", "platform_overrides": {"datafusion": null, "starrocks": null}}
- {"id": "merge_etl_aggregation_pattern", "description": "Tests ETL aggregation pattern with running totals and aggregate computations to measure aggregation overhead in MERGE", "write_sql": "MERGE INTO merge_ops_target AS target\nUSING (\n  SELECT\n    l_orderkey,\n    SUM(l_extendedprice * (1 - l_discount)) as computed_revenue,\n    MAX(l_shipdate) as latest_ship_date,\n    COUNT(*) as line_count\n  FROM lineitem\n  WHERE l_orderkey BETWEEN 1 AND 1000\n  GROUP BY l_orderkey\n) AS source\nON target.o_orderkey = source.l_orderkey\nWHEN MATCHED THEN\n  UPDATE SET\n    o_totalprice = target.o_totalprice + source.computed_revenue,\n    o_comment = 'etl_agg_lines_' || CAST(source.line_count AS VARCHAR)\nWHEN NOT MATCHED THEN\n  INSERT VALUES (source.l_orderkey, 1, 'O', source.computed_revenue, DATE '1998-01-01', '1-URGENT', 'Clerk#000000001', 0, 'etl_new')\n", "validation_queries": [{"id": "verify_etl_aggregation", "sql": "SELECT COUNT(*) as updated_count\nFROM merge_ops_target\nWHERE o_comment LIKE 'etl_agg%' OR o_comment = 'etl_new'\n", "expected_rows": 1, "expected_rows_min": 1}, {"id": "verify_etl_aggregation_values", "sql": "SELECT\n  CASE\n    WHEN COUNT(*) > 0 AND MIN(o_totalprice) IS NOT NULL THEN 1\n    ELSE 0\n  END as has_valid_aggregations\nFROM merge_ops_target\nWHERE o_comment LIKE 'etl_agg%'\n", "expected_rows": 1, "expected_rows_min": 1}], "cleanup_sql": "DELETE FROM merge_ops_target\nWHERE o_comment LIKE 'etl_agg%' OR o_comment = 'etl_new'\n", "platform_overrides": {"databricks": "MERGE INTO merge_ops_target AS target\nUSING (\n  SELECT\n    l_orderkey,\n    SUM(l_extendedprice * (1 - l_discount)) as computed_revenue,\n    MAX(l_shipdate) as latest_ship_date,\n    COUNT(*) as line_count\n  FROM lineitem\n  WHERE l_orderkey BETWEEN 1 AND 1000\n  GROUP BY l_orderkey\n) AS source\nON target.o_orderkey = source.l_orderkey\nWHEN MATCHED THEN\n  UPDATE SET\n    o_totalprice = target.o_totalprice + source.computed_revenue,\n    o_comment = 'etl_agg_lines_' || CAST(source.line_count AS VARCHAR)\nWHEN NOT MATCHED THEN\n  INSERT (o_orderkey, o_custkey, o_orderstatus, o_totalprice, o_orderdate, o_orderpriority, o_clerk, o_shippriority, o_comment) VALUES (source.l_orderkey, 1, 'O', source.computed_revenue, DATE '1998-01-01', '1-URGENT', 'Clerk#000000001', 0, 'etl_new')\n", "datafusion": null, "sqlite": "UPDATE merge_ops_target SET o_totalprice = merge_ops_target.o_totalprice + source.computed_revenue, o_comment = 'etl_agg_lines_' || CAST(source.line_count AS TEXT) FROM (SELECT l_orderkey, SUM(l_extendedprice * (1 - l_discount)) AS computed_revenue, MAX(l_shipdate) AS latest_ship_date, COUNT(*) AS line_count FROM lineitem WHERE l_orderkey BETWEEN 1 AND 1000 GROUP BY l_orderkey) AS source WHERE merge_ops_target.o_orderkey = source.l_orderkey;\nINSERT INTO merge_ops_target SELECT source.l_orderkey, 1, 'O', source.computed_revenue, '1998-01-01', '1-URGENT', 'Clerk#000000001', 0, 'etl_new' FROM (SELECT l_orderkey, SUM(l_extendedprice * (1 - l_discount)) AS computed_revenue, MAX(l_shipdate) AS latest_ship_date, COUNT(*) AS line_count FROM lineitem WHERE l_orderkey BETWEEN 1 AND 1000 GROUP BY l_orderkey) AS source WHERE NOT EXISTS (SELECT 1 FROM merge_ops_target AS t WHERE t.o_orderkey = source.l_orderkey)\n", "singlestore": "UPDATE merge_ops_target\nJOIN (\n  SELECT\n    l_orderkey,\n    SUM(l_extendedprice * (1 - l_discount)) AS computed_revenue,\n    MAX(l_shipdate) AS latest_ship_date,\n    COUNT(*) AS line_count\n  FROM lineitem\n  WHERE l_orderkey BETWEEN 1 AND 1000\n  GROUP BY l_orderkey\n) AS source ON merge_ops_target.o_orderkey = source.l_orderkey\nSET merge_ops_target.o_totalprice = merge_ops_target.o_totalprice + source.computed_revenue,\n    merge_ops_target.o_comment = CONCAT('etl_agg_lines_', CAST(source.line_count AS CHAR));\nINSERT INTO merge_ops_target\nSELECT source.l_orderkey, 1, 'O', source.computed_revenue, CAST('1998-01-01' AS DATE), '1-URGENT', 'Clerk#000000001', 0, 'etl_new'\nFROM (\n  SELECT\n    l_orderkey,\n    SUM(l_extendedprice * (1 - l_discount)) AS computed_revenue,\n    MAX(l_shipdate) AS latest_ship_date,\n    COUNT(*) AS line_count\n  FROM lineitem\n  WHERE l_orderkey BETWEEN 1 AND 1000\n  GROUP BY l_orderkey\n) AS source\nLEFT JOIN merge_ops_target AS target ON target.o_orderkey = source.l_orderkey\nWHERE target.o_orderkey IS NULL\n"}}
- {"id": "merge_deduplication_window_function", "description": "Tests MERGE with window function deduplication using ROW_NUMBER to measure duplicate elimination overhead", "write_sql": "MERGE INTO merge_ops_target AS target\nUSING (\n  SELECT\n    o_orderkey,\n    o_custkey,\n    o_orderstatus,\n    o_totalprice,\n    o_orderdate,\n    o_orderpriority,\n    o_clerk,\n    o_shippriority,\n    o_comment,\n    ROW_NUMBER() OVER (\n      PARTITION BY o_orderkey\n      ORDER BY o_orderdate DESC, o_totalprice DESC\n    ) as rn\n  FROM orders\n  WHERE o_orderkey BETWEEN 1 AND 500\n) AS source\nON target.o_orderkey = source.o_orderkey\nWHEN MATCHED AND source.rn = 1 THEN\n  UPDATE SET\n    o_totalprice = source.o_totalprice,\n    o_comment = 'dedup_update'\nWHEN NOT MATCHED AND source.rn = 1 THEN\n  INSERT VALUES (\n    source.o_orderkey, source.o_custkey, source.o_orderstatus,\n    source.o_totalprice, source.o_orderdate, source.o_orderpriority,\n    source.o_clerk, source.o_shippriority, 'dedup_insert'\n  )\n", "validation_queries": [{"id": "verify_deduplication", "sql": "SELECT COUNT(*) as dedup_count\nFROM merge_ops_target\nWHERE o_comment IN ('dedup_update', 'dedup_insert')\n", "expected_rows": 1, "expected_rows_min": 1}, {"id": "verify_no_duplicates", "sql": "SELECT\n  CASE\n    WHEN MAX(dup_count) = 1 THEN 1\n    ELSE 0\n  END as no_duplicates\nFROM (\n  SELECT o_orderkey, COUNT(*) as dup_count\n  FROM merge_ops_target\n  WHERE o_comment IN ('dedup_update', 'dedup_insert')\n  GROUP BY o_orderkey\n)\n", "expected_rows": 1, "expected_rows_min": 1, "platform_overrides": {"doris": "SELECT\n  CASE\n    WHEN MAX(dup_count) = 1 THEN 1\n    ELSE 0\n  END as no_duplicates\nFROM (\n  SELECT o_orderkey, COUNT(*) as dup_count\n  FROM merge_ops_target\n  WHERE o_comment IN ('dedup_update', 'dedup_insert')\n  GROUP BY o_orderkey\n) dup_counts\n"}}], "cleanup_sql": "DELETE FROM merge_ops_target\nWHERE o_comment IN ('dedup_update', 'dedup_insert')\n", "platform_overrides": {"databricks": "MERGE INTO merge_ops_target AS target\nUSING (\n  SELECT\n    o_orderkey,\n    o_custkey,\n    o_orderstatus,\n    o_totalprice,\n    o_orderdate,\n    o_orderpriority,\n    o_clerk,\n    o_shippriority,\n    o_comment,\n    ROW_NUMBER() OVER (\n      PARTITION BY o_orderkey\n      ORDER BY o_orderdate DESC, o_totalprice DESC\n    ) as rn\n  FROM orders\n  WHERE o_orderkey BETWEEN 1 AND 500\n) AS source\nON target.o_orderkey = source.o_orderkey\nWHEN MATCHED AND source.rn = 1 THEN\n  UPDATE SET\n    o_totalprice = source.o_totalprice,\n    o_comment = 'dedup_update'\nWHEN NOT MATCHED AND source.rn = 1 THEN\n  INSERT (o_orderkey, o_custkey, o_orderstatus, o_totalprice, o_orderdate, o_orderpriority, o_clerk, o_shippriority, o_comment) VALUES (\n    source.o_orderkey, source.o_custkey, source.o_orderstatus,\n    source.o_totalprice, source.o_orderdate, source.o_orderpriority,\n    source.o_clerk, source.o_shippriority, 'dedup_insert'\n  )\n", "datafusion": null, "sqlite": "UPDATE merge_ops_target SET o_totalprice = source.o_totalprice, o_comment = 'dedup_update' FROM (SELECT o_orderkey, o_custkey, o_orderstatus, o_totalprice, o_orderdate, o_orderpriority, o_clerk, o_shippriority, o_comment, ROW_NUMBER() OVER (PARTITION BY o_orderkey ORDER BY o_orderdate DESC, o_totalprice DESC) AS rn FROM orders WHERE o_orderkey BETWEEN 1 AND 500) AS source WHERE merge_ops_target.o_orderkey = source.o_orderkey AND source.rn = 1;\nINSERT INTO merge_ops_target SELECT source.o_orderkey, source.o_custkey, source.o_orderstatus, source.o_totalprice, source.o_orderdate, source.o_orderpriority, source.o_clerk, source.o_shippriority, 'dedup_insert' FROM (SELECT o_orderkey, o_custkey, o_orderstatus, o_totalprice, o_orderdate, o_orderpriority, o_clerk, o_shippriority, o_comment, ROW_NUMBER() OVER (PARTITION BY o_orderkey ORDER BY o_orderdate DESC, o_totalprice DESC) AS rn FROM orders WHERE o_orderkey BETWEEN 1 AND 500) AS source WHERE NOT EXISTS (SELECT 1 FROM merge_ops_target AS t WHERE t.o_orderkey = source.o_orderkey) AND source.rn = 1\n", "singlestore": "INSERT INTO merge_ops_target\nSELECT o_orderkey, o_custkey, o_orderstatus, o_totalprice, o_orderdate, o_orderpriority, o_clerk, o_shippriority,\n       'dedup_insert'\nFROM (\n  SELECT\n    o_orderkey, o_custkey, o_orderstatus, o_totalprice, o_orderdate, o_orderpriority, o_clerk, o_shippriority, o_comment,\n    ROW_NUMBER() OVER (\n      PARTITION BY o_orderkey\n      ORDER BY o_orderdate DESC, o_totalprice DESC\n    ) AS rn\n  FROM orders\n  WHERE o_orderkey BETWEEN 1 AND 500\n) AS source\nWHERE source.rn = 1\nON DUPLICATE KEY UPDATE o_totalprice = VALUES(o_totalprice), o_comment = 'dedup_update'\n"}}
- {"id": "merge_scd_type2_basic", "description": "Tests canonical SCD Type 2 dimension maintenance (close-old plus insert-new) via portable UPDATE then INSERT, keyed on a business key, to measure history-retaining merge overhead", "write_sql": "UPDATE scd2_ops_dim_customer\nSET is_current = false,\n    valid_to = (SELECT MIN(s.effective_ts) FROM scd2_ops_stage_customer s\n                WHERE s.c_custkey = scd2_ops_dim_customer.c_custkey AND s.change_type = 'changed')\nWHERE scd2_ops_dim_customer.is_current = true\n  AND EXISTS (SELECT 1 FROM scd2_ops_stage_customer s\n              WHERE s.c_custkey = scd2_ops_dim_customer.c_custkey\n                AND s.change_type = 'changed'\n                AND s.row_hash <> scd2_ops_dim_customer.row_hash);\nINSERT INTO scd2_ops_dim_customer\nSELECT (SELECT MAX(sk) FROM scd2_ops_dim_customer) + ROW_NUMBER() OVER (ORDER BY s.c_custkey),\n       s.c_custkey, s.c_name, s.c_address, s.c_acctbal, s.c_mktsegment, s.row_hash,\n       true, s.effective_ts, DATE '9999-12-31'\nFROM scd2_ops_stage_customer s\nWHERE (s.change_type = 'new'\n       OR (s.change_type = 'changed'\n           AND EXISTS (SELECT 1 FROM scd2_ops_dim_customer d\n                       WHERE d.c_custkey = s.c_custkey AND d.is_current = false AND d.valid_to = s.effective_ts)))\n  AND NOT EXISTS (SELECT 1 FROM scd2_ops_dim_customer d2\n                  WHERE d2.c_custkey = s.c_custkey AND d2.is_current = true)\n", "validation_queries": [{"id": "at_most_one_current_per_business_key", "sql": "SELECT c_custkey\nFROM scd2_ops_dim_customer\nWHERE is_current = true\nGROUP BY c_custkey\nHAVING COUNT(*) <> 1\n", "expected_rows": 0}, {"id": "every_changed_key_closed_with_stamp", "sql": "SELECT s.c_custkey\nFROM scd2_ops_stage_customer s\nWHERE s.change_type = 'changed'\n  AND NOT EXISTS (SELECT 1 FROM scd2_ops_dim_customer d\n                  WHERE d.c_custkey = s.c_custkey AND d.is_current = false AND d.valid_to = s.effective_ts)\n", "expected_rows": 0}, {"id": "every_changed_key_has_current_staged_version", "sql": "SELECT s.c_custkey\nFROM scd2_ops_stage_customer s\nWHERE s.change_type = 'changed'\n  AND NOT EXISTS (SELECT 1 FROM scd2_ops_dim_customer d\n                  WHERE d.c_custkey = s.c_custkey AND d.is_current = true AND d.row_hash = s.row_hash)\n", "expected_rows": 0}, {"id": "every_new_key_inserted_as_current", "sql": "SELECT s.c_custkey\nFROM scd2_ops_stage_customer s\nWHERE s.change_type = 'new'\n  AND NOT EXISTS (SELECT 1 FROM scd2_ops_dim_customer d\n                  WHERE d.c_custkey = s.c_custkey AND d.is_current = true)\n", "expected_rows": 0}, {"id": "basic_inserts_expected_new_version_count", "sql": "SELECT 1 WHERE (SELECT COUNT(*) FROM scd2_ops_dim_customer\n                WHERE valid_from IN (SELECT effective_ts FROM scd2_ops_stage_customer WHERE change_type IN ('changed', 'new'))) <> (SELECT COUNT(*) FROM scd2_ops_stage_customer WHERE change_type IN ('changed', 'new'))\n", "expected_rows": 0, "platform_overrides": {"bigquery": "SELECT 1 FROM (SELECT 1 AS _one) AS _t WHERE (SELECT COUNT(*) FROM scd2_ops_dim_customer\n                WHERE valid_from IN (SELECT effective_ts FROM scd2_ops_stage_customer WHERE change_type IN ('changed', 'new'))) <> (SELECT COUNT(*) FROM scd2_ops_stage_customer WHERE change_type IN ('changed', 'new'))\n", "singlestore": "SELECT 1 FROM DUAL WHERE (SELECT COUNT(*) FROM scd2_ops_dim_customer\n                WHERE valid_from IN (SELECT effective_ts FROM scd2_ops_stage_customer WHERE change_type IN ('changed', 'new'))) <> (SELECT COUNT(*) FROM scd2_ops_stage_customer WHERE change_type IN ('changed', 'new'))\n"}}, {"id": "basic_closes_expected_changed_count", "sql": "SELECT 1 WHERE (SELECT COUNT(*) FROM scd2_ops_dim_customer\n                WHERE is_current = false\n                  AND valid_to IN (SELECT effective_ts FROM scd2_ops_stage_customer\n                                   WHERE change_type = 'changed')) <> (SELECT COUNT(*) FROM scd2_ops_stage_customer WHERE change_type = 'changed')\n", "expected_rows": 0, "platform_overrides": {"bigquery": "SELECT 1 FROM (SELECT 1 AS _one) AS _t WHERE (SELECT COUNT(*) FROM scd2_ops_dim_customer\n                WHERE is_current = false\n                  AND valid_to IN (SELECT effective_ts FROM scd2_ops_stage_customer\n                                   WHERE change_type = 'changed')) <> (SELECT COUNT(*) FROM scd2_ops_stage_customer WHERE change_type = 'changed')\n", "singlestore": "SELECT 1 FROM DUAL WHERE (SELECT COUNT(*) FROM scd2_ops_dim_customer\n                WHERE is_current = false\n                  AND valid_to IN (SELECT effective_ts FROM scd2_ops_stage_customer\n                                   WHERE change_type = 'changed')) <> (SELECT COUNT(*) FROM scd2_ops_stage_customer WHERE change_type = 'changed')\n"}}], "cleanup_sql": "DELETE FROM scd2_ops_dim_customer\nWHERE (c_custkey IN (SELECT c_custkey FROM scd2_ops_stage_customer WHERE change_type = 'changed')\n       AND valid_from IN (SELECT effective_ts FROM scd2_ops_stage_customer WHERE change_type = 'changed'))\n   OR (c_custkey IN (SELECT c_custkey FROM scd2_ops_stage_customer WHERE change_type = 'new')\n       AND valid_from IN (SELECT effective_ts FROM scd2_ops_stage_customer WHERE change_type = 'new')\n       AND sk > (SELECT MAX(c_custkey) FROM scd2_ops_stage_customer));\nUPDATE scd2_ops_dim_customer SET is_current = true, valid_to = DATE '9999-12-31'\nWHERE is_current = false AND c_custkey IN (SELECT c_custkey FROM scd2_ops_stage_customer WHERE change_type = 'changed')\n  AND valid_to IN (SELECT effective_ts FROM scd2_ops_stage_customer WHERE change_type = 'changed')\n", "platform_overrides": {"datafusion": null, "singlestore": "UPDATE scd2_ops_dim_customer\nJOIN (\n  SELECT c_custkey, row_hash, MIN(effective_ts) OVER (PARTITION BY c_custkey) AS closed_ts\n  FROM scd2_ops_stage_customer WHERE change_type = 'changed'\n) AS s ON s.c_custkey = scd2_ops_dim_customer.c_custkey AND s.row_hash <> scd2_ops_dim_customer.row_hash\nSET scd2_ops_dim_customer.is_current = false, scd2_ops_dim_customer.valid_to = s.closed_ts\nWHERE scd2_ops_dim_customer.is_current = true;\nINSERT INTO scd2_ops_dim_customer\nSELECT (SELECT MAX(sk) FROM scd2_ops_dim_customer) + ROW_NUMBER() OVER (ORDER BY s.c_custkey),\n       s.c_custkey, s.c_name, s.c_address, s.c_acctbal, s.c_mktsegment, s.row_hash,\n       true, s.effective_ts, CAST('9999-12-31' AS DATE)\nFROM scd2_ops_stage_customer s\nLEFT JOIN scd2_ops_dim_customer d2 ON d2.c_custkey = s.c_custkey AND d2.is_current = true\nWHERE (s.change_type = 'new'\n       OR (s.change_type = 'changed'\n           AND s.c_custkey IN (SELECT d.c_custkey FROM scd2_ops_dim_customer d\n                               WHERE d.is_current = false AND d.valid_to = s.effective_ts)))\n  AND d2.c_custkey IS NULL\n"}, "cleanup_platform_overrides": {"sqlite": "DELETE FROM scd2_ops_dim_customer\nWHERE (c_custkey IN (SELECT c_custkey FROM scd2_ops_stage_customer WHERE change_type = 'changed')\n       AND valid_from IN (SELECT effective_ts FROM scd2_ops_stage_customer WHERE change_type = 'changed'))\n   OR (c_custkey IN (SELECT c_custkey FROM scd2_ops_stage_customer WHERE change_type = 'new')\n       AND valid_from IN (SELECT effective_ts FROM scd2_ops_stage_customer WHERE change_type = 'new')\n       AND sk > (SELECT MAX(c_custkey) FROM scd2_ops_stage_customer));\nUPDATE scd2_ops_dim_customer SET is_current = true, valid_to = '9999-12-31'\nWHERE is_current = false AND c_custkey IN (SELECT c_custkey FROM scd2_ops_stage_customer WHERE change_type = 'changed')\n  AND valid_to IN (SELECT effective_ts FROM scd2_ops_stage_customer WHERE change_type = 'changed')\n"}}
- {"id": "merge_scd_type2_no_change", "description": "Tests SCD Type 2 idempotency by applying an unchanged batch whose row fingerprints match the dimension, so a correct implementation closes no rows and inserts zero new versions", "write_sql": "UPDATE scd2_ops_dim_customer\nSET is_current = false,\n    valid_to = (SELECT MIN(s.effective_ts) FROM scd2_ops_stage_customer s\n                WHERE s.c_custkey = scd2_ops_dim_customer.c_custkey AND s.change_type = 'unchanged')\nWHERE scd2_ops_dim_customer.is_current = true\n  AND EXISTS (SELECT 1 FROM scd2_ops_stage_customer s\n              WHERE s.c_custkey = scd2_ops_dim_customer.c_custkey\n                AND s.change_type = 'unchanged'\n                AND s.row_hash <> scd2_ops_dim_customer.row_hash);\nINSERT INTO scd2_ops_dim_customer\nSELECT (SELECT MAX(sk) FROM scd2_ops_dim_customer) + ROW_NUMBER() OVER (ORDER BY s.c_custkey),\n       s.c_custkey, s.c_name, s.c_address, s.c_acctbal, s.c_mktsegment, s.row_hash,\n       true, s.effective_ts, DATE '9999-12-31'\nFROM scd2_ops_stage_customer s\nWHERE s.change_type = 'unchanged'\n  AND EXISTS (SELECT 1 FROM scd2_ops_dim_customer d\n              WHERE d.c_custkey = s.c_custkey AND d.is_current = false AND d.valid_to = s.effective_ts)\n", "validation_queries": [{"id": "at_most_one_current_per_business_key", "sql": "SELECT c_custkey\nFROM scd2_ops_dim_customer\nWHERE is_current = true\nGROUP BY c_custkey\nHAVING COUNT(*) <> 1\n", "expected_rows": 0}, {"id": "no_rows_closed_by_batch", "sql": "SELECT c_custkey FROM scd2_ops_dim_customer\nWHERE is_current = false\n  AND valid_to IN (SELECT effective_ts FROM scd2_ops_stage_customer WHERE change_type = 'unchanged')\n", "expected_rows": 0}, {"id": "no_new_versions_inserted", "sql": "SELECT c_custkey FROM scd2_ops_dim_customer\nWHERE valid_from IN (SELECT effective_ts FROM scd2_ops_stage_customer WHERE change_type = 'unchanged')\n", "expected_rows": 0}, {"id": "every_unchanged_key_has_current_version_matching_hash", "sql": "SELECT s.c_custkey\nFROM scd2_ops_stage_customer s\nWHERE s.change_type = 'unchanged'\n  AND NOT EXISTS (SELECT 1 FROM scd2_ops_dim_customer d\n                  WHERE d.c_custkey = s.c_custkey AND d.is_current = true AND d.row_hash = s.row_hash)\n", "expected_rows": 0}], "cleanup_sql": "DELETE FROM scd2_ops_dim_customer WHERE valid_from IN (SELECT effective_ts FROM scd2_ops_stage_customer WHERE change_type = 'unchanged');\nUPDATE scd2_ops_dim_customer SET is_current = true, valid_to = DATE '9999-12-31'\nWHERE is_current = false AND valid_to IN (SELECT effective_ts FROM scd2_ops_stage_customer WHERE change_type = 'unchanged')\n", "platform_overrides": {"datafusion": null, "singlestore": "UPDATE scd2_ops_dim_customer\nJOIN (\n  SELECT c_custkey, row_hash, MIN(effective_ts) OVER (PARTITION BY c_custkey) AS closed_ts\n  FROM scd2_ops_stage_customer WHERE change_type = 'unchanged'\n) AS s ON s.c_custkey = scd2_ops_dim_customer.c_custkey AND s.row_hash <> scd2_ops_dim_customer.row_hash\nSET scd2_ops_dim_customer.is_current = false, scd2_ops_dim_customer.valid_to = s.closed_ts\nWHERE scd2_ops_dim_customer.is_current = true;\nINSERT INTO scd2_ops_dim_customer\nSELECT (SELECT MAX(sk) FROM scd2_ops_dim_customer) + ROW_NUMBER() OVER (ORDER BY s.c_custkey),\n       s.c_custkey, s.c_name, s.c_address, s.c_acctbal, s.c_mktsegment, s.row_hash,\n       true, s.effective_ts, CAST('9999-12-31' AS DATE)\nFROM scd2_ops_stage_customer s\nJOIN scd2_ops_dim_customer d ON d.c_custkey = s.c_custkey AND d.is_current = false AND d.valid_to = s.effective_ts\nWHERE s.change_type = 'unchanged'\n"}, "cleanup_platform_overrides": {"sqlite": "DELETE FROM scd2_ops_dim_customer WHERE valid_from IN (SELECT effective_ts FROM scd2_ops_stage_customer WHERE change_type = 'unchanged');\nUPDATE scd2_ops_dim_customer SET is_current = true, valid_to = '9999-12-31'\nWHERE is_current = false AND valid_to IN (SELECT effective_ts FROM scd2_ops_stage_customer WHERE change_type = 'unchanged')\n"}}
- {"id": "merge_scd_type2_new_keys_only", "description": "Tests the SCD Type 2 insert-only path where every staged business key is brand-new, so the operation appends current versions and closes no existing rows", "write_sql": "INSERT INTO scd2_ops_dim_customer\nSELECT (SELECT MAX(sk) FROM scd2_ops_dim_customer) + ROW_NUMBER() OVER (ORDER BY s.c_custkey),\n       s.c_custkey, s.c_name, s.c_address, s.c_acctbal, s.c_mktsegment, s.row_hash,\n       true, s.effective_ts, DATE '9999-12-31'\nFROM scd2_ops_stage_customer s\nWHERE s.change_type = 'new'\n  AND NOT EXISTS (SELECT 1 FROM scd2_ops_dim_customer d WHERE d.c_custkey = s.c_custkey)\n", "validation_queries": [{"id": "at_most_one_current_per_business_key", "sql": "SELECT c_custkey\nFROM scd2_ops_dim_customer\nWHERE is_current = true\nGROUP BY c_custkey\nHAVING COUNT(*) <> 1\n", "expected_rows": 0}, {"id": "every_new_key_present_as_current", "sql": "SELECT s.c_custkey\nFROM scd2_ops_stage_customer s\nWHERE s.change_type = 'new'\n  AND NOT EXISTS (SELECT 1 FROM scd2_ops_dim_customer d\n                  WHERE d.c_custkey = s.c_custkey AND d.is_current = true)\n", "expected_rows": 0}, {"id": "no_rows_closed", "sql": "SELECT c_custkey FROM scd2_ops_dim_customer\nWHERE is_current = false\n  AND valid_to IN (SELECT effective_ts FROM scd2_ops_stage_customer WHERE change_type = 'new')\n", "expected_rows": 0}, {"id": "new_keys_only_inserts_expected_count", "sql": "SELECT 1 WHERE (SELECT COUNT(*) FROM scd2_ops_dim_customer\n                WHERE valid_from IN (SELECT effective_ts FROM scd2_ops_stage_customer\n                                    WHERE change_type = 'new')) <> (SELECT COUNT(*) FROM scd2_ops_stage_customer WHERE change_type = 'new')\n", "expected_rows": 0, "platform_overrides": {"bigquery": "SELECT 1 FROM (SELECT 1 AS _one) AS _t WHERE (SELECT COUNT(*) FROM scd2_ops_dim_customer\n                WHERE valid_from IN (SELECT effective_ts FROM scd2_ops_stage_customer\n                                    WHERE change_type = 'new')) <> (SELECT COUNT(*) FROM scd2_ops_stage_customer WHERE change_type = 'new')\n", "singlestore": "SELECT 1 FROM DUAL WHERE (SELECT COUNT(*) FROM scd2_ops_dim_customer\n                WHERE valid_from IN (SELECT effective_ts FROM scd2_ops_stage_customer\n                                    WHERE change_type = 'new')) <> (SELECT COUNT(*) FROM scd2_ops_stage_customer WHERE change_type = 'new')\n"}}], "cleanup_sql": "DELETE FROM scd2_ops_dim_customer\nWHERE c_custkey IN (SELECT c_custkey FROM scd2_ops_stage_customer WHERE change_type = 'new')\n  AND valid_from IN (SELECT effective_ts FROM scd2_ops_stage_customer WHERE change_type = 'new')\n  AND sk <= (SELECT MAX(c_custkey) FROM scd2_ops_stage_customer)\n", "platform_overrides": {"datafusion": null, "singlestore": "INSERT INTO scd2_ops_dim_customer\nSELECT (SELECT MAX(sk) FROM scd2_ops_dim_customer) + ROW_NUMBER() OVER (ORDER BY s.c_custkey),\n       s.c_custkey, s.c_name, s.c_address, s.c_acctbal, s.c_mktsegment, s.row_hash,\n       true, s.effective_ts, CAST('9999-12-31' AS DATE)\nFROM scd2_ops_stage_customer s\nLEFT JOIN scd2_ops_dim_customer d ON d.c_custkey = s.c_custkey\nWHERE s.change_type = 'new' AND d.c_custkey IS NULL\n"}}
