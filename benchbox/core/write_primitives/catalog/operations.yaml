- {"id": "bulk_load_upsert_mode", "category": "bulk_load", "description": "Tests bulk load with UPSERT semantics using MERGE to measure conflict resolution overhead", "file_dependencies": ["csv_upsert_data.csv"], "write_sql": "MERGE INTO bulk_load_ops_target AS target\nUSING (\n  SELECT * FROM read_csv_auto('{file_path}/csv_upsert_data.csv')\n) AS source\nON target.o_orderkey = source.o_orderkey\nWHEN MATCHED THEN\n  UPDATE SET\n    o_custkey = source.o_custkey,\n    o_orderstatus = source.o_orderstatus,\n    o_totalprice = source.o_totalprice,\n    o_orderdate = source.o_orderdate,\n    o_orderpriority = source.o_orderpriority,\n    o_clerk = source.o_clerk,\n    o_shippriority = source.o_shippriority,\n    o_comment = source.o_comment\nWHEN NOT MATCHED THEN INSERT\n", "validation_queries": [{"id": "verify_upsert", "sql": "SELECT COUNT(*) as cnt FROM bulk_load_ops_target", "expected_rows": 1}], "cleanup_sql": "TRUNCATE TABLE bulk_load_ops_target\n", "platform_overrides": {"databricks": null, "bigquery": null, "snowflake": null, "datafusion": null, "starrocks": null, "sqlite": null, "singlestore": "DROP TABLE IF EXISTS bulk_load_upsert_stage;\nCREATE TABLE bulk_load_upsert_stage LIKE bulk_load_ops_target;\nLOAD DATA LOCAL INFILE '{file_path}/csv_upsert_data.csv'\nINTO TABLE bulk_load_upsert_stage\nFIELDS TERMINATED BY ',' OPTIONALLY ENCLOSED BY '\"'\nLINES TERMINATED BY '\\r\\n'\nIGNORE 1 LINES;\nUPDATE bulk_load_ops_target JOIN bulk_load_upsert_stage AS source ON bulk_load_ops_target.o_orderkey = source.o_orderkey\nSET bulk_load_ops_target.o_custkey = source.o_custkey,\n    bulk_load_ops_target.o_orderstatus = source.o_orderstatus,\n    bulk_load_ops_target.o_totalprice = source.o_totalprice,\n    bulk_load_ops_target.o_orderdate = source.o_orderdate,\n    bulk_load_ops_target.o_orderpriority = source.o_orderpriority,\n    bulk_load_ops_target.o_clerk = source.o_clerk,\n    bulk_load_ops_target.o_shippriority = source.o_shippriority,\n    bulk_load_ops_target.o_comment = source.o_comment;\nINSERT INTO bulk_load_ops_target\nSELECT source.* FROM bulk_load_upsert_stage AS source\nLEFT JOIN bulk_load_ops_target AS target ON target.o_orderkey = source.o_orderkey\nWHERE target.o_orderkey IS NULL;\nDROP TABLE bulk_load_upsert_stage\n"}}
