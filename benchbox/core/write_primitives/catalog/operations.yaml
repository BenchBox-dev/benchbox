- {"id": "bulk_load_with_transformation", "category": "bulk_load", "description": "Tests bulk load with inline type conversion and transformation to measure ETL overhead", "file_dependencies": ["csv_small_1k.csv"], "write_sql": "TRUNCATE TABLE bulk_load_ops_target;\nINSERT INTO bulk_load_ops_target\nSELECT\n  CAST(o_orderkey AS INTEGER),\n  CAST(o_custkey AS INTEGER),\n  UPPER(o_orderstatus),\n  CAST(o_totalprice AS DECIMAL(15,2)),\n  CAST(o_orderdate AS DATE),\n  o_orderpriority,\n  o_clerk,\n  o_shippriority,\n  CONCAT('TRANSFORMED: ', o_comment)\nFROM read_csv_auto('{file_path}/csv_small_1k.csv')\n", "validation_queries": [{"id": "verify_transformation", "sql": "SELECT COUNT(*) as cnt FROM bulk_load_ops_target\nWHERE o_comment LIKE 'TRANSFORMED:%'\n", "expected_rows": 1}], "cleanup_sql": "TRUNCATE TABLE bulk_load_ops_target\n", "expected_rows_affected": 1000, "platform_overrides": {"databricks": null, "bigquery": null, "snowflake": null, "duckdb": "TRUNCATE TABLE bulk_load_ops_target;\nINSERT INTO bulk_load_ops_target\nSELECT\n  CAST(o_orderkey AS INTEGER),\n  CAST(o_custkey AS INTEGER),\n  UPPER(o_orderstatus),\n  CAST(o_totalprice AS DECIMAL(15,2)),\n  CAST(o_orderdate AS DATE),\n  o_orderpriority,\n  o_clerk,\n  o_shippriority,\n  CONCAT('TRANSFORMED: ', o_comment)\nFROM read_csv_auto('{file_path}/csv_small_1k.csv')\n", "starrocks": null, "sqlite": null, "singlestore": "TRUNCATE TABLE bulk_load_ops_target;\nLOAD DATA LOCAL INFILE '{file_path}/csv_small_1k.csv'\nINTO TABLE bulk_load_ops_target\nFIELDS TERMINATED BY ',' OPTIONALLY ENCLOSED BY '\"'\nLINES TERMINATED BY '\\r\\n'\nIGNORE 1 LINES\n(o_orderkey, o_custkey, @order_status, @total_price, @order_date, o_orderpriority, o_clerk, o_shippriority, @comment)\nSET o_orderstatus = UPPER(@order_status),\n    o_totalprice = CAST(@total_price AS DECIMAL(15,2)),\n    o_orderdate = CAST(@order_date AS DATE),\n    o_comment = LEFT(CONCAT('TRANSFORMED: ', @comment), 79)\n"}}
