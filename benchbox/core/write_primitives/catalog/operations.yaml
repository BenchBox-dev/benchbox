- {"id": "merge_with_join_condition", "description": "Tests MERGE with complex join condition involving multiple columns to measure matching overhead", "write_sql": "MERGE INTO merge_ops_lineitem_target AS target\nUSING (\n  SELECT l.*, o.o_custkey\n  FROM lineitem l\n  JOIN orders o ON l.l_orderkey = o.o_orderkey\n  WHERE l.l_orderkey BETWEEN 1 AND 10\n) AS source\nON target.l_orderkey = source.l_orderkey\n   AND target.l_linenumber = source.l_linenumber\nWHEN MATCHED THEN\n  UPDATE SET l_comment = 'merge_multi_key'\nWHEN NOT MATCHED THEN\n  INSERT VALUES (source.l_orderkey, source.l_partkey, source.l_suppkey, source.l_linenumber,\n                 source.l_quantity, source.l_extendedprice, source.l_discount, source.l_tax,\n                 source.l_returnflag, source.l_linestatus, source.l_shipdate, source.l_commitdate,\n                 source.l_receiptdate, source.l_shipinstruct, source.l_shipmode, source.l_comment)\n", "validation_queries": [{"id": "verify_join_merge", "sql": "SELECT COUNT(*) as cnt FROM merge_ops_lineitem_target\nWHERE l_orderkey BETWEEN 1 AND 10\n", "expected_rows": 1, "expected_rows_min": 1}], "cleanup_sql": "DELETE FROM merge_ops_lineitem_target WHERE l_orderkey BETWEEN 1 AND 10\n", "platform_overrides": {"databricks": "MERGE INTO merge_ops_lineitem_target AS target\nUSING (\n  SELECT l.*, o.o_custkey\n  FROM lineitem l\n  JOIN orders o ON l.l_orderkey = o.o_orderkey\n  WHERE l.l_orderkey BETWEEN 1 AND 10\n) AS source\nON target.l_orderkey = source.l_orderkey\n   AND target.l_linenumber = source.l_linenumber\nWHEN MATCHED THEN\n  UPDATE SET l_comment = 'merge_multi_key'\nWHEN NOT MATCHED THEN\n  INSERT (l_orderkey, l_partkey, l_suppkey, l_linenumber, l_quantity, l_extendedprice, l_discount, l_tax, l_returnflag, l_linestatus, l_shipdate, l_commitdate, l_receiptdate, l_shipinstruct, l_shipmode, l_comment) VALUES (source.l_orderkey, source.l_partkey, source.l_suppkey, source.l_linenumber,\n                 source.l_quantity, source.l_extendedprice, source.l_discount, source.l_tax,\n                 source.l_returnflag, source.l_linestatus, source.l_shipdate, source.l_commitdate,\n                 source.l_receiptdate, source.l_shipinstruct, source.l_shipmode, source.l_comment)\n", "datafusion": null, "sqlite": "UPDATE merge_ops_lineitem_target SET l_comment = 'merge_multi_key' FROM (SELECT l.*, o.o_custkey AS o_custkey FROM lineitem l JOIN orders o ON l.l_orderkey = o.o_orderkey WHERE l.l_orderkey BETWEEN 1 AND 10) AS source WHERE merge_ops_lineitem_target.l_orderkey = source.l_orderkey AND merge_ops_lineitem_target.l_linenumber = source.l_linenumber;\nINSERT INTO merge_ops_lineitem_target SELECT source.l_orderkey, source.l_partkey, source.l_suppkey, source.l_linenumber, source.l_quantity, source.l_extendedprice, source.l_discount, source.l_tax, source.l_returnflag, source.l_linestatus, source.l_shipdate, source.l_commitdate, source.l_receiptdate, source.l_shipinstruct, source.l_shipmode, source.l_comment FROM (SELECT l.*, o.o_custkey AS o_custkey FROM lineitem l JOIN orders o ON l.l_orderkey = o.o_orderkey WHERE l.l_orderkey BETWEEN 1 AND 10) AS source WHERE NOT EXISTS (SELECT 1 FROM merge_ops_lineitem_target AS t WHERE t.l_orderkey = source.l_orderkey AND t.l_linenumber = source.l_linenumber)\n", "singlestore": "INSERT INTO merge_ops_lineitem_target\nSELECT l.l_orderkey, l.l_partkey, l.l_suppkey, l.l_linenumber, l.l_quantity, l.l_extendedprice, l.l_discount, l.l_tax,\n       l.l_returnflag, l.l_linestatus, l.l_shipdate, l.l_commitdate, l.l_receiptdate, l.l_shipinstruct, l.l_shipmode, l.l_comment\nFROM lineitem l\nJOIN orders o ON l.l_orderkey = o.o_orderkey\nWHERE l.l_orderkey BETWEEN 1 AND 10\nON DUPLICATE KEY UPDATE l_comment = 'merge_multi_key'\n"}}
- {"id": "merge_from_subquery_aggregated", "description": "Tests MERGE with aggregated subquery source to measure aggregation plus merge overhead", "write_sql": "MERGE INTO merge_ops_summary_target AS target\nUSING (\n  SELECT o_custkey, SUM(o_totalprice) AS total_price, COUNT(*) AS order_count\n  FROM orders\n  WHERE o_orderkey <= 500\n  GROUP BY o_custkey\n) AS source\nON target.o_custkey = source.o_custkey\nWHEN MATCHED THEN\n  UPDATE SET o_totalprice = source.total_price,\n             order_count = source.order_count\nWHEN NOT MATCHED THEN\n  INSERT VALUES (NULL, source.o_custkey, NULL, source.total_price, NULL, source.order_count)\n", "validation_queries": [{"id": "verify_agg_merge", "sql": "SELECT COUNT(*) as cnt FROM merge_ops_summary_target WHERE order_count > 0", "expected_rows": 1, "expected_rows_min": 1}], "cleanup_sql": "DELETE FROM merge_ops_summary_target\n", "platform_overrides": {"databricks": "MERGE INTO merge_ops_summary_target AS target\nUSING (\n  SELECT o_custkey, SUM(o_totalprice) AS total_price, COUNT(*) AS order_count\n  FROM orders\n  WHERE o_orderkey <= 500\n  GROUP BY o_custkey\n) AS source\nON target.o_custkey = source.o_custkey\nWHEN MATCHED THEN\n  UPDATE SET o_totalprice = source.total_price,\n             order_count = source.order_count\nWHEN NOT MATCHED THEN\n  INSERT (o_orderkey, o_custkey, o_orderdate, o_totalprice, customer_name, order_count) VALUES (NULL, source.o_custkey, NULL, source.total_price, NULL, source.order_count)\n", "datafusion": null, "sqlite": "UPDATE merge_ops_summary_target SET o_totalprice = source.total_price, order_count = source.order_count FROM (SELECT o_custkey, SUM(o_totalprice) AS total_price, COUNT(*) AS order_count FROM orders WHERE o_orderkey <= 500 GROUP BY o_custkey) AS source WHERE merge_ops_summary_target.o_custkey = source.o_custkey;\nINSERT INTO merge_ops_summary_target SELECT NULL, source.o_custkey, NULL, source.total_price, NULL, source.order_count FROM (SELECT o_custkey, SUM(o_totalprice) AS total_price, COUNT(*) AS order_count FROM orders WHERE o_orderkey <= 500 GROUP BY o_custkey) AS source WHERE NOT EXISTS (SELECT 1 FROM merge_ops_summary_target AS t WHERE t.o_custkey = source.o_custkey)\n", "singlestore": "UPDATE merge_ops_summary_target\nJOIN (\n  SELECT o_custkey, SUM(o_totalprice) AS total_price, COUNT(*) AS order_count\n  FROM orders\n  WHERE o_orderkey <= 500\n  GROUP BY o_custkey\n) AS source ON merge_ops_summary_target.o_custkey = source.o_custkey\nSET merge_ops_summary_target.o_totalprice = source.total_price,\n    merge_ops_summary_target.order_count = source.order_count;\nINSERT INTO merge_ops_summary_target\nSELECT NULL, source.o_custkey, NULL, source.total_price, NULL, source.order_count\nFROM (\n  SELECT o_custkey, SUM(o_totalprice) AS total_price, COUNT(*) AS order_count\n  FROM orders\n  WHERE o_orderkey <= 500\n  GROUP BY o_custkey\n) AS source\nLEFT JOIN merge_ops_summary_target AS target ON target.o_custkey = source.o_custkey\nWHERE target.o_custkey IS NULL\n"}}
- {"id": "merge_conditional_update", "description": "Tests MERGE with conditional WHEN MATCHED clause to measure predicate evaluation overhead", "write_sql": "MERGE INTO merge_ops_target AS target\nUSING (\n  SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 50\n) AS source\nON target.o_orderkey = source.o_orderkey\nWHEN MATCHED AND source.o_totalprice > 100000 THEN\n  UPDATE SET o_comment = 'merge_high_value',\n             o_orderpriority = '1-URGENT'\nWHEN MATCHED THEN\n  UPDATE SET o_comment = 'merge_low_value'\nWHEN NOT MATCHED THEN INSERT\n", "validation_queries": [{"id": "verify_conditional", "sql": "SELECT COUNT(*) as cnt FROM merge_ops_target\nWHERE o_comment LIKE 'merge_%'\n", "expected_rows": 1, "expected_rows_min": 1}], "cleanup_sql": "UPDATE merge_ops_target SET o_comment = '', o_orderpriority = '5-LOW'\nWHERE o_comment LIKE 'merge_%'\n", "platform_overrides": {"databricks": "MERGE INTO merge_ops_target AS target\nUSING (\n  SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 50\n) AS source\nON target.o_orderkey = source.o_orderkey\nWHEN MATCHED AND source.o_totalprice > 100000 THEN\n  UPDATE SET o_comment = 'merge_high_value',\n             o_orderpriority = '1-URGENT'\nWHEN MATCHED THEN\n  UPDATE SET o_comment = 'merge_low_value'\nWHEN NOT MATCHED THEN INSERT *\n", "bigquery": "MERGE INTO merge_ops_target AS target\nUSING (\n  SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 50\n) AS source\nON target.o_orderkey = source.o_orderkey\nWHEN MATCHED AND source.o_totalprice > 100000 THEN\n  UPDATE SET o_comment = 'merge_high_value',\n             o_orderpriority = '1-URGENT'\nWHEN MATCHED THEN\n  UPDATE SET o_comment = 'merge_low_value'\nWHEN NOT MATCHED THEN INSERT VALUES (source.o_orderkey, source.o_custkey, source.o_orderstatus, source.o_totalprice, source.o_orderdate, source.o_orderpriority, source.o_clerk, source.o_shippriority, source.o_comment)\n", "snowflake": "MERGE INTO merge_ops_target AS target\nUSING (\n  SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 50\n) AS source\nON target.o_orderkey = source.o_orderkey\nWHEN MATCHED AND source.o_totalprice > 100000 THEN\n  UPDATE SET o_comment = 'merge_high_value',\n             o_orderpriority = '1-URGENT'\nWHEN MATCHED THEN\n  UPDATE SET o_comment = 'merge_low_value'\nWHEN NOT MATCHED THEN INSERT VALUES (source.o_orderkey, source.o_custkey, source.o_orderstatus, source.o_totalprice, source.o_orderdate, source.o_orderpriority, source.o_clerk, source.o_shippriority, source.o_comment)\n", "datafusion": null, "ducklake": null, "sqlite": "UPDATE merge_ops_target SET o_comment = 'merge_high_value', o_orderpriority = '1-URGENT' FROM (SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 50) AS source WHERE merge_ops_target.o_orderkey = source.o_orderkey AND source.o_totalprice > 100000;\nUPDATE merge_ops_target SET o_comment = 'merge_low_value' FROM (SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 50) AS source WHERE merge_ops_target.o_orderkey = source.o_orderkey AND NOT COALESCE(source.o_totalprice > 100000, 0);\nINSERT INTO merge_ops_target SELECT source.o_orderkey, source.o_custkey, source.o_orderstatus, source.o_totalprice, source.o_orderdate, source.o_orderpriority, source.o_clerk, source.o_shippriority, source.o_comment FROM (SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 50) AS source WHERE NOT EXISTS (SELECT 1 FROM merge_ops_target AS t WHERE t.o_orderkey = source.o_orderkey)\n", "singlestore": "INSERT INTO merge_ops_target\nSELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 50\nON DUPLICATE KEY UPDATE o_comment = IF(VALUES(o_totalprice) > 100000, 'merge_high_value', 'merge_low_value'),\n    o_orderpriority = IF(VALUES(o_totalprice) > 100000, '1-URGENT', merge_ops_target.o_orderpriority)\n", "doris": "MERGE INTO merge_ops_target AS target\nUSING (\n  SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 50\n) AS source\nON target.o_orderkey = source.o_orderkey\nWHEN MATCHED AND source.o_totalprice > 100000 THEN\n  UPDATE SET o_comment = 'merge_high_value',\n             o_orderpriority = '1-URGENT'\nWHEN MATCHED THEN\n  UPDATE SET o_comment = 'merge_low_value'\nWHEN NOT MATCHED THEN INSERT VALUES (source.o_orderkey, source.o_custkey, source.o_orderstatus, source.o_totalprice, source.o_orderdate, source.o_orderpriority, source.o_clerk, source.o_shippriority, source.o_comment)"}}
- {"id": "merge_conditional_insert", "description": "Tests MERGE with conditional WHEN NOT MATCHED clause to measure insert filtering overhead", "write_sql": "MERGE INTO merge_ops_source AS target\nUSING (\n  SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 100\n) AS source\nON target.o_orderkey = source.o_orderkey\nWHEN MATCHED THEN\n  UPDATE SET o_comment = 'merge_matched'\nWHEN NOT MATCHED AND source.o_totalprice > 50000 THEN\n  INSERT VALUES (source.o_orderkey, source.o_custkey, source.o_orderstatus,\n                 source.o_totalprice, source.o_orderdate, source.o_orderpriority,\n                 source.o_clerk, source.o_shippriority, 'high_value_insert')\n", "validation_queries": [{"id": "verify_filtered_insert", "sql": "SELECT COUNT(*) as cnt FROM merge_ops_source\nWHERE o_comment = 'high_value_insert'\n", "expected_rows": 1, "expected_rows_min": 0}], "cleanup_sql": "DELETE FROM merge_ops_source WHERE o_orderkey BETWEEN 1 AND 100\n", "platform_overrides": {"databricks": "MERGE INTO merge_ops_source AS target\nUSING (\n  SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 100\n) AS source\nON target.o_orderkey = source.o_orderkey\nWHEN MATCHED THEN\n  UPDATE SET o_comment = 'merge_matched'\nWHEN NOT MATCHED AND source.o_totalprice > 50000 THEN\n  INSERT (o_orderkey, o_custkey, o_orderstatus, o_totalprice, o_orderdate, o_orderpriority, o_clerk, o_shippriority, o_comment) VALUES (source.o_orderkey, source.o_custkey, source.o_orderstatus,\n                 source.o_totalprice, source.o_orderdate, source.o_orderpriority,\n                 source.o_clerk, source.o_shippriority, 'high_value_insert')\n", "datafusion": null, "sqlite": "UPDATE merge_ops_source SET o_comment = 'merge_matched' FROM (SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 100) AS source WHERE merge_ops_source.o_orderkey = source.o_orderkey;\nINSERT INTO merge_ops_source SELECT source.o_orderkey, source.o_custkey, source.o_orderstatus, source.o_totalprice, source.o_orderdate, source.o_orderpriority, source.o_clerk, source.o_shippriority, 'high_value_insert' FROM (SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 100) AS source WHERE NOT EXISTS (SELECT 1 FROM merge_ops_source AS t WHERE t.o_orderkey = source.o_orderkey) AND source.o_totalprice > 50000\n", "singlestore": "UPDATE merge_ops_source\nJOIN (\n  SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 100\n) AS source ON merge_ops_source.o_orderkey = source.o_orderkey\nSET merge_ops_source.o_comment = 'merge_matched';\nINSERT INTO merge_ops_source\nSELECT source.o_orderkey, source.o_custkey, source.o_orderstatus, source.o_totalprice, source.o_orderdate,\n       source.o_orderpriority, source.o_clerk, source.o_shippriority, 'high_value_insert'\nFROM (\n  SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 100\n) AS source\nLEFT JOIN merge_ops_source AS target ON target.o_orderkey = source.o_orderkey\nWHERE target.o_orderkey IS NULL AND source.o_totalprice > 50000\n"}}
- {"id": "merge_multi_column_update", "description": "Tests MERGE updating 5 plus columns to measure multi-column update overhead in MERGE", "write_sql": "MERGE INTO merge_ops_target AS target\nUSING (\n  SELECT\n    o_orderkey,\n    o_totalprice * 1.05 AS o_totalprice,\n    '1-URGENT' AS o_orderpriority,\n    'Clerk#000000999' AS o_clerk,\n    o_shippriority + 1 AS o_shippriority,\n    'merge_multi_col' AS o_comment\n  FROM merge_ops_target\n  WHERE o_orderkey <= (SELECT MIN(o_orderkey) + 50 FROM merge_ops_target)\n) AS source\nON target.o_orderkey = source.o_orderkey\nWHEN MATCHED THEN\n  UPDATE SET\n    o_totalprice = source.o_totalprice,\n    o_orderpriority = source.o_orderpriority,\n    o_clerk = source.o_clerk,\n    o_shippriority = source.o_shippriority,\n    o_comment = source.o_comment\n", "validation_queries": [{"id": "verify_multi_col_merge", "sql": "SELECT COUNT(*) as cnt FROM merge_ops_target WHERE o_comment = 'merge_multi_col'", "expected_rows": 1, "expected_rows_min": 1}], "cleanup_sql": "UPDATE merge_ops_target\nSET o_totalprice = o_totalprice / 1.05,\n    o_orderpriority = '5-LOW',\n    o_clerk = 'Clerk#000000001',\n    o_shippriority = 0,\n    o_comment = ''\nWHERE o_comment = 'merge_multi_col'\n", "platform_overrides": {"datafusion": null, "sqlite": "UPDATE merge_ops_target SET o_totalprice = source.o_totalprice, o_orderpriority = source.o_orderpriority, o_clerk = source.o_clerk, o_shippriority = source.o_shippriority, o_comment = source.o_comment FROM (SELECT o_orderkey, o_totalprice * 1.05 AS o_totalprice, '1-URGENT' AS o_orderpriority, 'Clerk#000000999' AS o_clerk, o_shippriority + 1 AS o_shippriority, 'merge_multi_col' AS o_comment FROM merge_ops_target WHERE o_orderkey <= (SELECT MIN(o_orderkey) + 50 FROM merge_ops_target)) AS source WHERE merge_ops_target.o_orderkey = source.o_orderkey\n", "singlestore": "UPDATE merge_ops_target\nJOIN (\n  SELECT\n    o_orderkey,\n    o_totalprice * 1.05 AS o_totalprice,\n    '1-URGENT' AS o_orderpriority,\n    'Clerk#000000999' AS o_clerk,\n    o_shippriority + 1 AS o_shippriority,\n    'merge_multi_col' AS o_comment\n  FROM merge_ops_target\n  WHERE o_orderkey <= (SELECT MIN(o_orderkey) + 50 FROM merge_ops_target)\n) AS source ON merge_ops_target.o_orderkey = source.o_orderkey\nSET merge_ops_target.o_totalprice = source.o_totalprice,\n    merge_ops_target.o_orderpriority = source.o_orderpriority,\n    merge_ops_target.o_clerk = source.o_clerk,\n    merge_ops_target.o_shippriority = source.o_shippriority,\n    merge_ops_target.o_comment = source.o_comment\n"}}
- {"id": "merge_computed_values", "description": "Tests MERGE with computed values using expressions to measure computation overhead", "write_sql": "MERGE INTO merge_ops_target AS target\nUSING (\n  SELECT\n    o_orderkey,\n    o_totalprice * 1.15 + 100.0 AS computed_price,\n    CASE\n      WHEN o_totalprice < 100000 THEN '5-LOW'\n      WHEN o_totalprice < 250000 THEN '3-MEDIUM'\n      ELSE '1-URGENT'\n    END AS computed_priority\n  FROM orders\n  WHERE o_orderkey BETWEEN 1 AND 50\n) AS source\nON target.o_orderkey = source.o_orderkey\nWHEN MATCHED THEN\n  UPDATE SET o_totalprice = source.computed_price,\n             o_orderpriority = source.computed_priority,\n             o_comment = 'merge_computed'\nWHEN NOT MATCHED THEN\n  INSERT VALUES (source.o_orderkey, 1, 'O', source.computed_price, CURRENT_DATE,\n                 source.computed_priority, 'Clerk#000000001', 0, 'merge_computed')\n", "validation_queries": [{"id": "verify_computed_merge", "sql": "SELECT COUNT(*) as cnt FROM merge_ops_target WHERE o_comment = 'merge_computed'", "expected_rows": 1, "expected_rows_min": 1}], "cleanup_sql": "UPDATE merge_ops_target\nSET o_totalprice = (o_totalprice - 100.0) / 1.15,\n    o_orderpriority = '5-LOW',\n    o_comment = ''\nWHERE o_comment = 'merge_computed'\n", "platform_overrides": {"databricks": "MERGE INTO merge_ops_target AS target\nUSING (\n  SELECT\n    o_orderkey,\n    o_totalprice * 1.15 + 100.0 AS computed_price,\n    CASE\n      WHEN o_totalprice < 100000 THEN '5-LOW'\n      WHEN o_totalprice < 250000 THEN '3-MEDIUM'\n      ELSE '1-URGENT'\n    END AS computed_priority\n  FROM orders\n  WHERE o_orderkey BETWEEN 1 AND 50\n) AS source\nON target.o_orderkey = source.o_orderkey\nWHEN MATCHED THEN\n  UPDATE SET o_totalprice = source.computed_price,\n             o_orderpriority = source.computed_priority,\n             o_comment = 'merge_computed'\nWHEN NOT MATCHED THEN\n  INSERT (o_orderkey, o_custkey, o_orderstatus, o_totalprice, o_orderdate, o_orderpriority, o_clerk, o_shippriority, o_comment) VALUES (source.o_orderkey, 1, 'O', source.computed_price, CURRENT_DATE,\n                 source.computed_priority, 'Clerk#000000001', 0, 'merge_computed')\n", "datafusion": null, "sqlite": "UPDATE merge_ops_target SET o_totalprice = source.computed_price, o_orderpriority = source.computed_priority, o_comment = 'merge_computed' FROM (SELECT o_orderkey, o_totalprice * 1.15 + 100.0 AS computed_price, CASE WHEN o_totalprice < 100000 THEN '5-LOW' WHEN o_totalprice < 250000 THEN '3-MEDIUM' ELSE '1-URGENT' END AS computed_priority FROM orders WHERE o_orderkey BETWEEN 1 AND 50) AS source WHERE merge_ops_target.o_orderkey = source.o_orderkey;\nINSERT INTO merge_ops_target SELECT source.o_orderkey, 1, 'O', source.computed_price, CURRENT_DATE, source.computed_priority, 'Clerk#000000001', 0, 'merge_computed' FROM (SELECT o_orderkey, o_totalprice * 1.15 + 100.0 AS computed_price, CASE WHEN o_totalprice < 100000 THEN '5-LOW' WHEN o_totalprice < 250000 THEN '3-MEDIUM' ELSE '1-URGENT' END AS computed_priority FROM orders WHERE o_orderkey BETWEEN 1 AND 50) AS source WHERE NOT EXISTS (SELECT 1 FROM merge_ops_target AS t WHERE t.o_orderkey = source.o_orderkey)\n", "singlestore": "INSERT INTO merge_ops_target\nSELECT\n  o_orderkey, 1, 'O', o_totalprice * 1.15 + 100.0, CURRENT_DATE,\n  CASE\n    WHEN o_totalprice < 100000 THEN '5-LOW'\n    WHEN o_totalprice < 250000 THEN '3-MEDIUM'\n    ELSE '1-URGENT'\n  END,\n  'Clerk#000000001', 0, 'merge_computed'\nFROM orders\nWHERE o_orderkey BETWEEN 1 AND 50\nON DUPLICATE KEY UPDATE o_totalprice = VALUES(o_totalprice), o_orderpriority = VALUES(o_orderpriority), o_comment = 'merge_computed'\n"}}
- {"id": "merge_string_operations", "description": "Tests MERGE with string manipulation functions to measure string processing overhead", "write_sql": "MERGE INTO merge_ops_target AS target\nUSING (\n  SELECT\n    o_orderkey,\n    CONCAT('ORDER-', CAST(o_orderkey AS VARCHAR), '-', o_orderpriority) AS computed_comment\n  FROM orders\n  WHERE o_orderkey BETWEEN 1 AND 50\n) AS source\nON target.o_orderkey = source.o_orderkey\nWHEN MATCHED THEN\n  UPDATE SET o_comment = source.computed_comment\n", "validation_queries": [{"id": "verify_string_merge", "sql": "SELECT COUNT(*) as cnt FROM merge_ops_target\nWHERE o_comment LIKE 'ORDER-%'\n", "expected_rows": 1, "expected_rows_min": 1}], "cleanup_sql": "UPDATE merge_ops_target SET o_comment = '' WHERE o_comment LIKE 'ORDER-%'\n", "platform_overrides": {"datafusion": null, "sqlite": "UPDATE merge_ops_target SET o_comment = source.computed_comment FROM (SELECT o_orderkey, 'ORDER-' || CAST(o_orderkey AS TEXT) || '-' || o_orderpriority AS computed_comment FROM orders WHERE o_orderkey BETWEEN 1 AND 50) AS source WHERE merge_ops_target.o_orderkey = source.o_orderkey\n", "singlestore": "UPDATE merge_ops_target\nJOIN (\n  SELECT\n    o_orderkey,\n    CONCAT('ORDER-', CAST(o_orderkey AS CHAR), '-', o_orderpriority) AS computed_comment\n  FROM orders\n  WHERE o_orderkey BETWEEN 1 AND 50\n) AS source ON merge_ops_target.o_orderkey = source.o_orderkey\nSET merge_ops_target.o_comment = source.computed_comment\n"}}
- {"id": "merge_date_arithmetic", "description": "Tests MERGE with date calculations to measure temporal operation overhead in MERGE", "write_sql": "MERGE INTO merge_ops_target AS target\nUSING (\n  SELECT\n    o_orderkey,\n    o_orderdate + INTERVAL '30' DAY AS shifted_date,\n    'merge_date_shift' AS marker\n  FROM orders\n  WHERE o_orderkey BETWEEN 1 AND 50\n) AS source\nON target.o_orderkey = source.o_orderkey\nWHEN MATCHED THEN\n  UPDATE SET o_orderdate = source.shifted_date,\n             o_comment = source.marker\n", "validation_queries": [{"id": "verify_date_merge", "sql": "SELECT COUNT(*) as cnt FROM merge_ops_target WHERE o_comment = 'merge_date_shift'", "expected_rows": 1, "expected_rows_min": 1}], "cleanup_sql": "UPDATE merge_ops_target\nSET o_orderdate = o_orderdate - INTERVAL '30' DAY,\n    o_comment = ''\nWHERE o_comment = 'merge_date_shift'\n", "platform_overrides": {"bigquery": null, "datafusion": null, "sqlite": "UPDATE merge_ops_target SET o_orderdate = source.shifted_date, o_comment = source.marker FROM (SELECT o_orderkey, DATE(o_orderdate, '+30 day') AS shifted_date, 'merge_date_shift' AS marker FROM orders WHERE o_orderkey BETWEEN 1 AND 50) AS source WHERE merge_ops_target.o_orderkey = source.o_orderkey\n", "singlestore": "UPDATE merge_ops_target\nJOIN (\n  SELECT\n    o_orderkey,\n    DATE_ADD(o_orderdate, INTERVAL 30 DAY) AS shifted_date,\n    'merge_date_shift' AS marker\n  FROM orders\n  WHERE o_orderkey BETWEEN 1 AND 50\n) AS source ON merge_ops_target.o_orderkey = source.o_orderkey\nSET merge_ops_target.o_orderdate = source.shifted_date,\n    merge_ops_target.o_comment = source.marker\n"}, "cleanup_platform_overrides": {"sqlite": "UPDATE merge_ops_target\nSET o_orderdate = DATE(o_orderdate, '-30 day'),\n    o_comment = ''\nWHERE o_comment = 'merge_date_shift'\n"}}
- {"id": "merge_with_cte_source", "description": "Tests MERGE with CTE as source to measure CTE materialization overhead", "write_sql": "WITH enriched_orders AS (\n  SELECT\n    o.o_orderkey,\n    o.o_totalprice,\n    c.c_name,\n    c.c_mktsegment\n  FROM orders o\n  JOIN customer c ON o.o_custkey = c.c_custkey\n  WHERE o.o_orderkey BETWEEN 1 AND 50\n)\nMERGE INTO merge_ops_summary_target AS target\nUSING enriched_orders AS source\nON target.o_orderkey = source.o_orderkey\nWHEN MATCHED THEN\n  UPDATE SET o_totalprice = source.o_totalprice,\n             customer_name = source.c_name\nWHEN NOT MATCHED THEN\n  INSERT VALUES (source.o_orderkey, NULL, NULL, source.o_totalprice, source.c_name, NULL)\n", "validation_queries": [{"id": "verify_cte_merge", "sql": "SELECT COUNT(*) as cnt FROM merge_ops_summary_target\nWHERE o_orderkey BETWEEN 1 AND 50\n", "expected_rows": 1, "expected_rows_min": 1}], "cleanup_sql": "DELETE FROM merge_ops_summary_target WHERE o_orderkey BETWEEN 1 AND 50\n", "platform_overrides": {"databricks": "WITH enriched_orders AS (\n  SELECT\n    o.o_orderkey,\n    o.o_totalprice,\n    c.c_name,\n    c.c_mktsegment\n  FROM orders o\n  JOIN customer c ON o.o_custkey = c.c_custkey\n  WHERE o.o_orderkey BETWEEN 1 AND 50\n)\nMERGE INTO merge_ops_summary_target AS target\nUSING enriched_orders AS source\nON target.o_orderkey = source.o_orderkey\nWHEN MATCHED THEN\n  UPDATE SET o_totalprice = source.o_totalprice,\n             customer_name = source.c_name\nWHEN NOT MATCHED THEN\n  INSERT (o_orderkey, o_custkey, o_orderdate, o_totalprice, customer_name, order_count) VALUES (source.o_orderkey, NULL, NULL, source.o_totalprice, source.c_name, NULL)\n", "bigquery": "MERGE INTO merge_ops_summary_target AS target\nUSING (\n  SELECT o.o_orderkey, o.o_totalprice, c.c_name, c.c_mktsegment\n  FROM orders o JOIN customer c ON o.o_custkey = c.c_custkey\n  WHERE o.o_orderkey BETWEEN 1 AND 50\n) AS source\nON target.o_orderkey = source.o_orderkey\nWHEN MATCHED THEN\n  UPDATE SET o_totalprice = source.o_totalprice,\n             customer_name = source.c_name\nWHEN NOT MATCHED THEN\n  INSERT VALUES (source.o_orderkey, NULL, NULL, source.o_totalprice, source.c_name, NULL)\n", "snowflake": "MERGE INTO merge_ops_summary_target AS target\nUSING (\n  SELECT o.o_orderkey, o.o_totalprice, c.c_name, c.c_mktsegment\n  FROM orders o JOIN customer c ON o.o_custkey = c.c_custkey\n  WHERE o.o_orderkey BETWEEN 1 AND 50\n) AS source\nON target.o_orderkey = source.o_orderkey\nWHEN MATCHED THEN\n  UPDATE SET o_totalprice = source.o_totalprice,\n             customer_name = source.c_name\nWHEN NOT MATCHED THEN\n  INSERT VALUES (source.o_orderkey, NULL, NULL, source.o_totalprice, source.c_name, NULL)\n", "datafusion": null, "sqlite": "WITH enriched_orders AS (SELECT o.o_orderkey, o.o_totalprice, c.c_name, c.c_mktsegment FROM orders o JOIN customer c ON o.o_custkey = c.c_custkey WHERE o.o_orderkey BETWEEN 1 AND 50) UPDATE merge_ops_summary_target SET o_totalprice = source.o_totalprice, customer_name = source.c_name FROM enriched_orders AS source WHERE merge_ops_summary_target.o_orderkey = source.o_orderkey;\nWITH enriched_orders AS (SELECT o.o_orderkey, o.o_totalprice, c.c_name, c.c_mktsegment FROM orders o JOIN customer c ON o.o_custkey = c.c_custkey WHERE o.o_orderkey BETWEEN 1 AND 50) INSERT INTO merge_ops_summary_target SELECT source.o_orderkey, NULL, NULL, source.o_totalprice, source.c_name, NULL FROM enriched_orders AS source WHERE NOT EXISTS (SELECT 1 FROM merge_ops_summary_target AS t WHERE t.o_orderkey = source.o_orderkey)\n", "singlestore": "UPDATE merge_ops_summary_target\nJOIN (\n  SELECT o.o_orderkey, o.o_totalprice, c.c_name, c.c_mktsegment\n  FROM orders o\n  JOIN customer c ON o.o_custkey = c.c_custkey\n  WHERE o.o_orderkey BETWEEN 1 AND 50\n) AS source ON merge_ops_summary_target.o_orderkey = source.o_orderkey\nSET merge_ops_summary_target.o_totalprice = source.o_totalprice,\n    merge_ops_summary_target.customer_name = source.c_name;\nINSERT INTO merge_ops_summary_target\nSELECT source.o_orderkey, NULL, NULL, source.o_totalprice, source.c_name, NULL\nFROM (\n  SELECT o.o_orderkey, o.o_totalprice, c.c_name, c.c_mktsegment\n  FROM orders o\n  JOIN customer c ON o.o_custkey = c.c_custkey\n  WHERE o.o_orderkey BETWEEN 1 AND 50\n) AS source\nLEFT JOIN merge_ops_summary_target AS target ON target.o_orderkey = source.o_orderkey\nWHERE target.o_orderkey IS NULL\n"}}
- {"id": "merge_returning_clause", "description": "Tests MERGE...RETURNING to measure overhead of returning merged row data", "write_sql": "MERGE INTO merge_ops_target AS target\nUSING (\n  SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 10\n) AS source\nON target.o_orderkey = source.o_orderkey\nWHEN MATCHED THEN\n  UPDATE SET o_comment = 'merge_returning'\nWHEN NOT MATCHED THEN INSERT\nRETURNING o_orderkey, o_totalprice, o_comment\n", "validation_queries": [{"id": "verify_returning_merge", "sql": "SELECT COUNT(*) as cnt FROM merge_ops_target\nWHERE o_orderkey BETWEEN 1 AND 10\n", "expected_rows": 1, "expected_rows_min": 1}], "cleanup_sql": "DELETE FROM merge_ops_target WHERE o_orderkey BETWEEN 1 AND 10\n", "platform_overrides": {"databricks": null, "singlestore": null, "bigquery": null, "datafusion": null, "starrocks": null, "ducklake": null, "snowflake": null, "sqlite": "UPDATE merge_ops_target SET o_comment = 'merge_returning' FROM (SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 10) AS source WHERE merge_ops_target.o_orderkey = source.o_orderkey RETURNING o_orderkey, o_totalprice, o_comment;\nINSERT INTO merge_ops_target SELECT source.o_orderkey, source.o_custkey, source.o_orderstatus, source.o_totalprice, source.o_orderdate, source.o_orderpriority, source.o_clerk, source.o_shippriority, source.o_comment FROM (SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 10) AS source WHERE NOT EXISTS (SELECT 1 FROM merge_ops_target AS t WHERE t.o_orderkey = source.o_orderkey) RETURNING o_orderkey, o_totalprice, o_comment\n"}}
- {"id": "merge_error_handling", "description": "Tests MERGE with potential constraint violations to measure error handling overhead", "write_sql": "MERGE INTO merge_ops_target AS target\nUSING (\n  SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 50\n  UNION ALL\n  SELECT * FROM orders WHERE o_orderkey BETWEEN 45 AND 55\n) AS source\nON target.o_orderkey = source.o_orderkey\nWHEN MATCHED THEN\n  UPDATE SET o_comment = 'merge_with_dups'\nWHEN NOT MATCHED THEN INSERT\n", "validation_queries": [{"id": "verify_error_merge", "sql": "SELECT COUNT(*) as cnt FROM merge_ops_target\nWHERE o_orderkey BETWEEN 1 AND 55\n", "expected_rows": 1, "expected_rows_min": 1}], "cleanup_sql": "DELETE FROM merge_ops_target WHERE o_orderkey BETWEEN 1 AND 55\n", "platform_overrides": {"databricks": null, "bigquery": null, "snowflake": null, "datafusion": null, "sqlite": "UPDATE merge_ops_target SET o_comment = 'merge_with_dups' FROM (SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 50 UNION ALL SELECT * FROM orders WHERE o_orderkey BETWEEN 45 AND 55) AS source WHERE merge_ops_target.o_orderkey = source.o_orderkey;\nINSERT OR IGNORE INTO merge_ops_target SELECT source.o_orderkey, source.o_custkey, source.o_orderstatus, source.o_totalprice, source.o_orderdate, source.o_orderpriority, source.o_clerk, source.o_shippriority, source.o_comment FROM (SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 50 UNION ALL SELECT * FROM orders WHERE o_orderkey BETWEEN 45 AND 55) AS source WHERE NOT EXISTS (SELECT 1 FROM merge_ops_target AS t WHERE t.o_orderkey = source.o_orderkey)\n", "singlestore": "INSERT INTO merge_ops_target\nSELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 50\nUNION ALL\nSELECT * FROM orders WHERE o_orderkey BETWEEN 45 AND 55\nON DUPLICATE KEY UPDATE o_comment = 'merge_with_dups'\n", "doris": "MERGE INTO merge_ops_target AS target\nUSING (\n  SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 50\n  UNION ALL\n  SELECT * FROM orders WHERE o_orderkey BETWEEN 45 AND 55\n) AS source\nON target.o_orderkey = source.o_orderkey\nWHEN MATCHED THEN\n  UPDATE SET o_comment = 'merge_with_dups'\nWHEN NOT MATCHED THEN INSERT VALUES (source.o_orderkey, source.o_custkey, source.o_orderstatus, source.o_totalprice, source.o_orderdate, source.o_orderpriority, source.o_clerk, source.o_shippriority, source.o_comment)"}}
