- {"id": "merge_upsert_with_delete", "description": "Tests MERGE with DELETE clause for unmatched target rows to measure tri-directional merge overhead", "write_sql": "MERGE INTO merge_ops_target AS target\nUSING (\n  SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 20\n) AS source\nON target.o_orderkey = source.o_orderkey\nWHEN MATCHED THEN\n  UPDATE SET o_comment = 'merge_matched'\nWHEN NOT MATCHED BY TARGET THEN INSERT\nWHEN NOT MATCHED BY SOURCE AND target.o_orderkey <= 25 THEN\n  DELETE\n", "validation_queries": [{"id": "verify_merge_delete", "sql": "SELECT COUNT(*) as cnt FROM merge_ops_target\nWHERE o_orderkey BETWEEN 1 AND 25\n", "expected_rows": 1, "expected_rows_min": 1}], "platform_overrides": {"databricks": null, "bigquery": null, "snowflake": null, "datafusion": null, "ducklake": null, "sqlite": "UPDATE merge_ops_target SET o_comment = 'merge_matched' FROM (SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 20) AS source WHERE merge_ops_target.o_orderkey = source.o_orderkey;\nINSERT INTO merge_ops_target SELECT source.o_orderkey, source.o_custkey, source.o_orderstatus, source.o_totalprice, source.o_orderdate, source.o_orderpriority, source.o_clerk, source.o_shippriority, source.o_comment FROM (SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 20) AS source WHERE NOT EXISTS (SELECT 1 FROM merge_ops_target AS t WHERE t.o_orderkey = source.o_orderkey);\nDELETE FROM merge_ops_target WHERE o_orderkey <= 25 AND NOT EXISTS (SELECT 1 FROM (SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 20) AS source WHERE source.o_orderkey = merge_ops_target.o_orderkey)\n", "singlestore": "DELETE FROM merge_ops_target\nWHERE o_orderkey <= 25\n  AND o_orderkey NOT IN (SELECT o_orderkey FROM orders WHERE o_orderkey BETWEEN 1 AND 20);\nINSERT INTO merge_ops_target\nSELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 20\nON DUPLICATE KEY UPDATE o_comment = 'merge_matched'\n"}}
