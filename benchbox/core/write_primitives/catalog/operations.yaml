- {"id": "merge_simple_upsert_small", "description": "Tests simple MERGE upsert with 10 rows to measure baseline MERGE overhead", "write_sql": "MERGE INTO merge_ops_target AS target\nUSING (\n  SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 10\n) AS source\nON target.o_orderkey = source.o_orderkey\nWHEN MATCHED THEN\n  UPDATE SET o_totalprice = source.o_totalprice,\n             o_comment = 'merged_update'\nWHEN NOT MATCHED THEN INSERT\n", "validation_queries": [{"id": "verify_merge", "sql": "SELECT COUNT(*) as cnt FROM merge_ops_target\nWHERE o_orderkey BETWEEN 1 AND 10\n", "expected_rows": 1, "expected_rows_min": 1}], "cleanup_sql": "DELETE FROM merge_ops_target WHERE o_orderkey BETWEEN 1 AND 10\n", "platform_overrides": {"databricks": "MERGE INTO merge_ops_target AS target\nUSING (\n  SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 10\n) AS source\nON target.o_orderkey = source.o_orderkey\nWHEN MATCHED THEN\n  UPDATE SET o_totalprice = source.o_totalprice,\n             o_comment = 'merged_update'\nWHEN NOT MATCHED THEN INSERT *\n", "bigquery": "MERGE INTO merge_ops_target AS target\nUSING (\n  SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 10\n) AS source\nON target.o_orderkey = source.o_orderkey\nWHEN MATCHED THEN\n  UPDATE SET o_totalprice = source.o_totalprice,\n             o_comment = 'merged_update'\nWHEN NOT MATCHED THEN INSERT VALUES (source.o_orderkey, source.o_custkey, source.o_orderstatus, source.o_totalprice, source.o_orderdate, source.o_orderpriority, source.o_clerk, source.o_shippriority, source.o_comment)\n", "snowflake": "MERGE INTO merge_ops_target AS target\nUSING (\n  SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 10\n) AS source\nON target.o_orderkey = source.o_orderkey\nWHEN MATCHED THEN\n  UPDATE SET o_totalprice = source.o_totalprice,\n             o_comment = 'merged_update'\nWHEN NOT MATCHED THEN INSERT VALUES (source.o_orderkey, source.o_custkey, source.o_orderstatus, source.o_totalprice, source.o_orderdate, source.o_