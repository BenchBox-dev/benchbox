- {"id": "sketch_insert_theta_per_partition", "description": "Builds per-partition Theta sketches over l_orderkey + l_extendedprice and persists them", "requires_setup": false, "write_sql": "INSTALL datasketches FROM community;\nLOAD datasketches;\nDROP TABLE IF EXISTS sketch_ops_daily_users;\nCREATE TABLE sketch_ops_daily_users (\n  activity_date DATE,\n  region VARCHAR(25),\n  user_sketch BLOB,\n  rev_sketch BLOB\n);\nINSERT INTO sketch_ops_daily_users\nSELECT\n  l_shipdate AS activity_date,\n  l_returnflag AS region,\n  datasketch_theta(l_orderkey) AS user_sketch,\n  datasketch_theta(CAST(l_extendedprice AS INTEGER)) AS rev_sketch\nFROM lineitem\nGROUP BY l_shipdate, l_returnflag;\n", "validation_queries": [{"id": "rows_persisted", "sql": "SELECT COUNT(*) as partitions FROM sketch_ops_daily_users\n", "expected_rows_min": 1}], "cleanup_sql": "DROP TABLE IF EXISTS sketch_ops_daily_users\n", "platform_overrides": {"databricks": "DROP TABLE IF EXISTS sketch_ops_daily_users;\nCREATE TABLE sketch_ops_daily_users (\n  activity_date DATE, region STRING, user_sketch BINARY, rev_sketch BINARY\n) USING DELTA;\nINSERT INTO sketch_ops_daily_users\nSELECT l_shipdate, l_returnflag,\n       theta_sketch_agg(l_orderkey),\n       theta_sketch_agg(CAST(l_extendedprice AS INT))\nFROM lineitem GROUP BY l_shipdate, l_returnflag;\n", "snowflake": "DROP TABLE IF EXISTS sketch_ops_daily_users;\nCREATE TABLE sketch_ops_daily_users (\n  activity_date DATE, region VARCHAR(25), user_sketch BINARY, rev_sketch BINARY\n);\nINSERT INTO sketch_ops_daily_users\nSELECT l_shipdate, l_returnflag,\n       DATASKETCHES_THETA_ACCUMULATE(l_orderkey),\n       DATASKETCHES_THETA_ACCUMULATE(CAST(l_extendedprice AS INTEGER))\nFROM lineitem GROUP BY l_shipdate, l_returnflag;\n", "bigquery": "DROP TABLE IF EXISTS sketch_ops_daily_users;\nCREATE TABLE sketch_ops_daily_users (\n  activity_date DATE, region STRING, user_sketch BYTES, rev_sketch BYTES\n);\nINSERT INTO sketch_ops_daily_users\nSELECT l_shipdate, l_returnflag,\n       HLL_COUNT.INIT(l_orderkey),\n       HLL_COUNT.INIT(CAST(l_extendedprice AS INT64))\nFROM lineitem GROUP BY l_shipdate, l_returnflag;\n", "clickhouse": "DROP TABLE IF EXISTS sketch_ops_daily_users;\nCREATE TABLE sketch_ops_daily_users (\n  activity_date Date, region String,\n  user_sketch AggregateFunction(uniq, UInt64),\n  rev_sketch AggregateFunction(uniq, UInt64)\n) ENGINE = MergeTree() ORDER BY (activity_date, region);\nINSERT INTO sketch_ops_daily_users\nSELECT l_shipdate, l_returnflag,\n       uniqState(toUInt64(l_orderkey)),\n       uniqState(toUInt64(l_extendedprice))\nFROM lineitem GROUP BY l_shipdate, l_returnflag;\n", "datafusion": null, "redshift": "DROP TABLE IF EXISTS sketch_ops_daily_users;\nCREATE TABLE sketch_ops_daily_users (\n  activity_date DATE, region VARCHAR(25),\n  user_sketch HLLSKETCH, rev_sketch HLLSKETCH\n) DISTSTYLE EVEN;\nINSERT INTO sketch_ops_daily_users\nSELECT l_shipdate, l_returnflag,\n       HLL_CREATE_SKETCH(l_orderkey),\n       HLL_CREATE_SKETCH(CAST(l_extendedprice AS BIGINT))\nFROM lineitem\nGROUP BY l_shipdate, l_returnflag;\n", "sqlite": null, "starrocks": null, "trino": null, "athena": null}}
- {"id": "sketch_insert_kll_per_partition", "description": "Builds per-partition KLL quantile sketches over l_extendedprice", "requires_setup": false, "write_sql": "INSTALL datasketches FROM community;\nLOAD datasketches;\nDROP TABLE IF EXISTS sketch_ops_kll_partitions;\nCREATE TABLE sketch_ops_kll_partitions (\n  activity_date DATE,\n  region VARCHAR(25),\n  price_sketch BLOB\n);\nINSERT INTO sketch_ops_kll_partitions\nSELECT\n  l_shipdate,\n  l_returnflag,\n  datasketch_kll(200, l_extendedprice)\nFROM lineitem\nGROUP BY l_shipdate, l_returnflag;\n", "validation_queries": [{"id": "kll_partitions_persisted", "sql": "SELECT COUNT(*) as partitions FROM sketch_ops_kll_partitions\n", "expected_rows_min": 1}], "cleanup_sql": "DROP TABLE IF EXISTS sketch_ops_kll_partitions\n", "platform_overrides": {"databricks": "DROP TABLE IF EXISTS sketch_ops_kll_partitions;\nCREATE TABLE sketch_ops_kll_partitions (\n  activity_date DATE, region STRING, price_sketch BINARY\n) USING DELTA;\nINSERT INTO sketch_ops_kll_partitions\nSELECT l_shipdate, l_returnflag, kll_sketch_agg_double(CAST(l_extendedprice AS DOUBLE))\nFROM lineitem GROUP BY l_shipdate, l_returnflag;\n", "snowflake": "DROP TABLE IF EXISTS sketch_ops_kll_partitions;\nCREATE TABLE sketch_ops_kll_partitions (\n  activity_date DATE, region VARCHAR(25), price_sketch BINARY\n);\nINSERT INTO sketch_ops_kll_partitions\nSELECT l_shipdate, l_returnflag,\n       DATASKETCHES_KLL_ACCUMULATE(CAST(l_extendedprice AS DOUBLE))\nFROM lineitem GROUP BY l_shipdate, l_returnflag;\n", "bigquery": "DROP TABLE IF EXISTS sketch_ops_kll_partitions;\nCREATE TABLE sketch_ops_kll_partitions (\n  activity_date DATE, region STRING, price_sketch BYTES\n);\nINSERT INTO sketch_ops_kll_partitions\nSELECT l_shipdate, l_returnflag,\n       KLL_QUANTILES.INIT_INT64(CAST(l_extendedprice AS INT64))\nFROM lineitem GROUP BY l_shipdate, l_returnflag;\n", "clickhouse": "DROP TABLE IF EXISTS sketch_ops_kll_partitions;\nCREATE TABLE sketch_ops_kll_partitions (\n  activity_date Date, region String,\n  price_sketch AggregateFunction(quantileTDigest(0.5), Float64)\n) ENGINE = MergeTree() ORDER BY (activity_date, region);\nINSERT INTO sketch_ops_kll_partitions\nSELECT l_shipdate, l_returnflag,\n       quantileTDigestState(0.5)(toFloat64(l_extendedprice))\nFROM lineitem GROUP BY l_shipdate, l_returnflag;\n", "datafusion": null, "redshift": null, "sqlite": null, "starrocks": null, "trino": null, "athena": null}}
- {"id": "sketch_insert_topk_per_shard", "description": "Builds per-shard frequent-items (Top-K accumulator) sketches over l_shipmode", "requires_setup": false, "write_sql": "INSTALL datasketches FROM community;\nLOAD datasketches;\nDROP TABLE IF EXISTS sketch_ops_topk;\nCREATE TABLE sketch_ops_topk (\n  shard_id INTEGER,\n  topk_sketch BLOB\n);\nINSERT INTO sketch_ops_topk\nSELECT\n  CAST(l_orderkey % 8 AS INTEGER) AS shard_id,\n  datasketch_frequent_items(8, l_shipmode) AS topk_sketch\nFROM lineitem\nGROUP BY l_orderkey % 8;\n", "validation_queries": [{"id": "topk_shards_persisted", "sql": "SELECT COUNT(*) as shards FROM sketch_ops_topk\n", "expected_rows_min": 1}], "cleanup_sql": "DROP TABLE IF EXISTS sketch_ops_topk\n", "platform_overrides": {"databricks": "DROP TABLE IF EXISTS sketch_ops_topk;\nCREATE TABLE sketch_ops_topk (\n  shard_id INT, topk_sketch BINARY\n) USING DELTA;\nINSERT INTO sketch_ops_topk\nSELECT CAST(l_orderkey % 8 AS INT),\n       approx_top_k_accumulate(l_shipmode)\nFROM lineitem GROUP BY l_orderkey % 8;\n", "snowflake": "DROP TABLE IF EXISTS sketch_ops_topk;\nCREATE TABLE sketch_ops_topk (\n  shard_id INTEGER, topk_sketch BINARY\n);\nINSERT INTO sketch_ops_topk\nSELECT MOD(l_orderkey, 8),\n       APPROX_TOP_K_ACCUMULATE(l_shipmode, 1024)\nFROM lineitem GROUP BY MOD(l_orderkey, 8);\n", "bigquery": null, "clickhouse": "DROP TABLE IF EXISTS sketch_ops_topk;\nCREATE TABLE sketch_ops_topk (\n  shard_id Int32,\n  topk_sketch AggregateFunction(topK(8), String)\n) ENGINE = MergeTree() ORDER BY shard_id;\nINSERT INTO sketch_ops_topk\nSELECT toInt32(l_orderkey % 8),\n       topKState(8)(l_shipmode)\nFROM lineitem GROUP BY l_orderkey % 8;\n", "datafusion": null, "redshift": null, "sqlite": null, "starrocks": null, "trino": null, "athena": null}}
- {"id": "sketch_query_theta_union_merge", "description": "★ Headline — populate theta sketches per partition, then merge across all partitions in a single query and emit an approximate distinct count (compare to aggregation_distinct in read_primitives). BigQuery substitutes HLL_COUNT for Theta (no native Theta surface) — the persist + merge + requery shape is identical, but the underlying sketch family differs.", "requires_setup": false, "write_sql": "INSTALL datasketches FROM community;\nLOAD datasketches;\nDROP TABLE IF EXISTS sketch_ops_daily_users;\nCREATE TABLE sketch_ops_daily_users (\n  activity_date DATE, region VARCHAR(25), user_sketch BLOB, rev_sketch BLOB\n);\nINSERT INTO sketch_ops_daily_users\nSELECT l_shipdate, l_returnflag,\n       datasketch_theta(l_orderkey),\n       datasketch_theta(CAST(l_extendedprice AS INTEGER))\nFROM lineitem\nGROUP BY l_shipdate, l_returnflag;\nSELECT datasketch_theta_estimate(datasketch_theta(user_sketch)) AS distinct_orders\nFROM sketch_ops_daily_users;\n", "validation_queries": [{"id": "theta_estimate_in_range", "sql": "SELECT datasketch_theta_estimate(datasketch_theta(user_sketch)) AS distinct_orders\nFROM sketch_ops_daily_users\n", "expected_value_min": 14500, "expected_value_max": 15500, "platform_overrides": {"clickhouse": "SELECT uniqMerge(user_sketch) AS distinct_orders\nFROM sketch_ops_daily_users\n", "redshift": "SELECT HLL_CARDINALITY(HLL_COMBINE(user_sketch)) AS distinct_orders\nFROM sketch_ops_daily_users\n"}, "bounds_scale_with_sf": true}, {"id": "theta_storage_size_duckdb", "sql": "SELECT octet_length(datasketch_theta(user_sketch)) AS sketch_bytes\nFROM sketch_ops_daily_users\n", "expected_value_min": 16000, "expected_value_max": 50000, "platform_overrides": {"clickhouse": null, "databricks": null, "snowflake": null, "bigquery": null, "redshift": null, "datafusion": null, "sqlite": null, "starrocks": null}}, {"id": "theta_storage_size_clickhouse", "sql": "SELECT length(toString(uniqMergeState(user_sketch))) AS sketch_bytes\nFROM sketch_ops_daily_users\n", "expected_value_min": 16000, "expected_value_max": 100000, "platform_overrides": {"duckdb": null, "databricks": null, "snowflake": null, "bigquery": null, "redshift": null, "datafusion": null, "sqlite": null, "starrocks": null}}], "cleanup_sql": "DROP TABLE IF EXISTS sketch_ops_daily_users\n", "platform_overrides": {"databricks": "DROP TABLE IF EXISTS sketch_ops_daily_users;\nCREATE TABLE sketch_ops_daily_users (\n  activity_date DATE, region STRING, user_sketch BINARY, rev_sketch BINARY\n) USING DELTA;\nINSERT INTO sketch_ops_daily_users\nSELECT l_shipdate, l_returnflag, theta_sketch_agg(l_orderkey),\n       theta_sketch_agg(CAST(l_extendedprice AS INT))\nFROM lineitem GROUP BY l_shipdate, l_returnflag;\nSELECT theta_sketch_estimate(theta_union_agg(user_sketch)) AS distinct_orders\nFROM sketch_ops_daily_users;\n", "snowflake": "DROP TABLE IF EXISTS sketch_ops_daily_users;\nCREATE TABLE sketch_ops_daily_users (\n  activity_date DATE, region VARCHAR(25), user_sketch BINARY, rev_sketch BINARY\n);\nINSERT INTO sketch_ops_daily_users\nSELECT l_shipdate, l_returnflag, DATASKETCHES_THETA_ACCUMULATE(l_orderkey),\n       DATASKETCHES_THETA_ACCUMULATE(CAST(l_extendedprice AS INTEGER))\nFROM lineitem GROUP BY l_shipdate, l_returnflag;\nSELECT DATASKETCHES_THETA_ESTIMATE(DATASKETCHES_THETA_COMBINE(user_sketch)) AS distinct_orders\nFROM sketch_ops_daily_users;\n", "bigquery": "DROP TABLE IF EXISTS sketch_ops_daily_users;\nCREATE TABLE sketch_ops_daily_users (\n  activity_date DATE, region STRING, user_sketch BYTES, rev_sketch BYTES\n);\nINSERT INTO sketch_ops_daily_users\nSELECT l_shipdate, l_returnflag, HLL_COUNT.INIT(l_orderkey),\n       HLL_COUNT.INIT(CAST(l_extendedprice AS INT64))\nFROM lineitem GROUP BY l_shipdate, l_returnflag;\nSELECT HLL_COUNT.MERGE(user_sketch) AS distinct_orders\nFROM sketch_ops_daily_users;\n", "clickhouse": "DROP TABLE IF EXISTS sketch_ops_daily_users;\nCREATE TABLE sketch_ops_daily_users (\n  activity_date Date, region String,\n  user_sketch AggregateFunction(uniq, UInt64),\n  rev_sketch AggregateFunction(uniq, UInt64)\n) ENGINE = MergeTree() ORDER BY (activity_date, region);\nINSERT INTO sketch_ops_daily_users\nSELECT l_shipdate, l_returnflag,\n       uniqState(toUInt64(l_orderkey)),\n       uniqState(toUInt64(l_extendedprice))\nFROM lineitem GROUP BY l_shipdate, l_returnflag;\nSELECT uniqMerge(user_sketch) AS distinct_orders\nFROM sketch_ops_daily_users;\n", "datafusion": null, "redshift": "DROP TABLE IF EXISTS sketch_ops_daily_users;\nCREATE TABLE sketch_ops_daily_users (\n  activity_date DATE, region VARCHAR(25),\n  user_sketch HLLSKETCH, rev_sketch HLLSKETCH\n) DISTSTYLE EVEN;\nINSERT INTO sketch_ops_daily_users\nSELECT l_shipdate, l_returnflag,\n       HLL_CREATE_SKETCH(l_orderkey),\n       HLL_CREATE_SKETCH(CAST(l_extendedprice AS BIGINT))\nFROM lineitem GROUP BY l_shipdate, l_returnflag;\nSELECT HLL_CARDINALITY(HLL_COMBINE(user_sketch)) AS distinct_orders\nFROM sketch_ops_daily_users;\n", "sqlite": null, "starrocks": null, "trino": null, "athena": null}}
