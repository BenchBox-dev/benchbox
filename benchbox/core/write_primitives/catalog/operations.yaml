ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) c) t\n"}}
- {"id": "insert_select_with_join", "description": "Tests INSERT INTO...SELECT with JOIN to measure join overhead during data insertion", "write_sql": "INSERT INTO insert_ops_orders_summary (o_orderkey, o_custkey, o_orderdate, o_totalprice, customer_name)\nSELECT o.o_orderkey, o.o_custkey, o.o_orderdate, o.o_totalprice, c.c_name\nFROM orders o\nJOIN customer c ON o.o_custkey = c.c_custkey\nWHERE o.o_orderkey BETWEEN 1 AND 100\n", "validation_queries": [{"id": "verify_joined_insert", "sql": "SELECT COUNT(*) as cnt\nFROM insert_ops_orders_summary\nWHERE o_orderkey BETWEEN 1 AND 100\n", "expected_rows": 1, "expected_rows_min": 1}], "cleanup_sql": "DELETE FROM insert_ops_orders_summary WHERE o_orderkey BETWEEN 1 AND 100\n"}
- {"id": "insert_select_aggregated", "description": "Tests INSERT INTO...SELECT with GROUP BY aggregation to measure aggregation overhead", "write_sql": "INSERT INTO insert_ops_orders_summary (o_custkey, o_totalprice, order_count)\nSELECT o_custkey, SUM(o_totalprice), COUNT(*)\nFROM orders\nWHERE o_orderkey <= 1000\nGROUP BY o_custkey\n", "validation_queries": [{"id": "verify_aggregated_insert", "sql": "SELECT COUNT(*) as customer_count, SUM(order_count) as total_orders\nFROM insert_ops_orders_summary\n", "expected_rows": 1, "expected_rows_min": 1}], "cleanup_sql": "DELETE FROM insert_ops_orders_summary\n"}
- {"id": "insert_select_from_multiple", "description": "Tests INSERT INTO...SELECT from 3 plus tables with multiple JOINs to measure complex query overhead", "write_sql": "INSERT INTO insert_ops_lineitem_enriched\n  (l_orderkey, l_partkey, l_suppkey, l_quantity, l_extendedprice,\n   o_orderdate, c_name, s_name, p_name)\nSELECT l.l_orderkey, l.l_partkey, l.l_suppkey, l.l_quantity, l.l_extendedprice,\n       o.o_orderdate, c.c_name, s.s_name, p.p_name\nFROM lineitem l\nJOIN orders o ON l.l_orderkey = o.o_orderkey\nJOIN customer c ON o.o_custkey = c.c_custkey\nJOIN supplier s ON l.l_suppkey = s.s_suppkey\nJOIN part p ON l.l_partkey = p.p_partkey\nWHERE l.l_orderkey BETWEEN 1 AND 50\n", "validation_queries": [{"id": "verify_multi_join_insert", "sql": "SELECT COUNT(*) as cnt\nFROM insert_ops_lineitem_enriched\nWHERE l_orderkey BETWEEN 1 AND 50\n", "expected_rows": 1, "expected_rows_min": 1}], "cleanup_sql": "DELETE FROM insert_ops_lineitem_enriched WHERE l_orderkey BETWEEN 1 AND 50\n"}
- {"id": "insert_with_default_values", "description": "Tests INSERT with DEFAULT keyword to measure default value processing overhead", "write_sql": "INSERT INTO write_ops_log (log_id, operation_id, operation_category, timestamp, rows_affected, duration_ms, success)\nVALUES (1, 'test_insert', 'insert', CURRENT_TIMESTAMP, 0, 0.0, true)\n", "validation_queries": [{"id": "verify_default_insert", "sql": "SELECT COUNT(*) as cnt\nFROM write_ops_log\nWHERE operation_id = 'test_insert' AND operation_category = 'insert'\n", "expected_rows": 1, "expected_rows_min": 1}], "cleanup_sql": "DELETE FROM write_ops_log WHERE operation_id = 'test_insert' AND operation_category = 'insert'\n"}
- {"id": "insert_select_union", "description": "Tests INSERT INTO...SELECT with UNION to measure set operation overhead during insertion", "write_sql": "DELETE FROM insert_ops_orders WHERE o_orderkey BETWEEN 1 AND 50;\nINSERT INTO insert_ops_orders\nSELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 25\nUNION ALL\nSELECT * FROM orders WHERE o_orderkey BETWEEN 26 AND 50\n", "validation_queries": [{"id": "verify_union_insert", "sql": "SELECT COUNT(*) as cnt\nFROM insert_ops_orders\nWHERE o_orderkey BETWEEN 1 AND 50\n", "expected_rows": 1, "expected_rows_min": 1}], "cleanup_sql": "DELETE FROM insert_ops_orders WHERE o_orderkey BETWEEN 1 AND 50\n", "platform_overrides": {"questdb": "INSERT INTO insert_ops_orders\nSELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 25\nUNION ALL\nSELECT * FROM orders WHERE o_orderkey BETWEEN 26 AND 50\n"}}
- {"id": "insert_on_conflict_ignore", "description": "Tests INSERT with conflict handling using ON CONFLICT DO NOTHING to measure constraint checking overhead", "write_sql": "INSERT INTO insert_ops_orders\nSELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 10\nON CONFLICT (o_orderkey) DO NOTHING\n", "validation_queries": [{"id": "verify_conflict_handling", "sql": "SELECT COUNT(*) as cnt\nFROM insert_ops_orders\nWHERE o_orderkey BETWEEN 1 AND 10\n", "expected_rows": 1}], "cleanup_sql": "DELETE FROM insert_ops_orders WHERE o_orderkey BETWEEN 1 AND 10\n", "platform_overrides": {"databricks": "MERGE INTO insert_ops_orders AS t\nUSING (SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 10) AS s\nON t.o_orderkey = s.o_orderkey\nWHEN NOT MATCHED THEN INSERT *\n", "bigquery": "MERGE INTO insert_ops_orders AS t\nUSING (SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 10) AS s\nON t.o_orderkey = s.o_orderkey\nWHEN NOT MATCHED THEN INSERT ROW\n", "duckdb": "INSERT OR IGNORE INTO insert_ops_orders\nSELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 10\n", "sqlite": "INSERT OR IGNORE INTO insert_ops_orders\nSELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 10\n", "datafusion": null, "starrocks": null, "ducklake": null, "snowflake": "MERGE INTO insert_ops_orders AS t\nUSING (SELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 10) AS s\nON t.o_orderkey = s.o_orderkey\nWHEN NOT MATCHED THEN INSERT VALUES (s.o_orderkey, s.o_custkey, s.o_orderstatus, s.o_totalprice, s.o_orderdate, s.o_orderpriority, s.o_clerk, s.o_shippriority, s.o_comment)\n", "singlestore": "INSERT IGNORE INTO insert_ops_orders\nSELECT * FROM orders WHERE o_orderkey BETWEEN 1 AND 10\n", "doris": "INSERT INTO insert_ops_orders\nSELECT * FROM orders o WHERE o.o_orderkey BETWEEN 1 AND 10\n  AND NOT EXISTS (SELECT 1 FROM insert_ops_orders t WHERE t.o_orderkey = o.o_orderkey)\n"}}
- {"id": "insert_returning_clause", "description": "Tests INSERT...RETURNING to measure overhead of returning inserted row data", "write_sql": "INSERT INTO insert_ops_lineitem\nVALUES (9000500, 1, 1, 1, 10.0, 1000.0, 0.05, 0.02, 'N', 'O',\n        DATE '1998-01-01', DATE '1998-01-15', DATE '1998-01-20',\n        'DELIVER IN PERSON', 'TRUCK', 'returning_test')\nRETURNING l_orderkey, l_partkey, l_quantity\n", "validation_queries": [{"id": "verify_returning_insert", "sql": "SELECT l_orderkey, l_quantity\nFROM insert_ops_lineitem\nWHERE l_orderkey = 9000500\n", "expected_rows": 1}], "cleanup_sql": "DELETE FROM insert_ops_lineitem WHERE l_orderkey = 9000500\n", "expected_rows_affected": 1, "platform_overrides": {"databricks": null, "singlestore": null, "bigquery": null, "datafusion": null, "starrocks": null, "ducklake": null, "snowflake": null}}
- {"id": "update_single_row_pk", "description": "Tests single row UPDATE by primary key to measure index lookup plus update cost", "write_sql": "UPDATE update_ops_orders\nSET o_totalprice = o_totalprice * 1.1,\n    o_comment = 'updated_single'\nWHERE o_orderkey = (SELECT MIN(o_orderkey) FROM update_ops_orders)\n", "validation_queries": [{"id": "verify_update", "sql": "SELECT COUNT(*) as cnt\nFROM update_ops_orders\nWHERE o_comment = 'updated_single'\n", "expected_rows": 1}], "cleanup_sql": "UPDATE update_ops_orders\nSET o_totalprice = o_totalprice / 1.1,\n    o_comment = ''\nWHERE o_comment = 'updated_single'\n", "expected_rows_affected": 1, "platform_overrides": {"datafusion": null}}
- {"id": "update_selective_10pct", "description": "Tests UPDATE affecting approximately 10 percent of table rows to measure selective update performance", "write_sql": "UPDATE update_ops_orders\nSET o_comment = 'selective_10pct'\nWHERE o_orderkey <= (\n  SELECT CAST(MAX(o_orderkey) * 0.1 AS INTEGER)\n  FROM update_ops_orders\n)\n", "validation_queries": [{"id": "count_updated", "sql": "SELECT COUNT(*) as cnt FROM update_ops_orders WHERE o_comment = 'selective_10pct'"}], "cleanup_sql": "UPDATE update_ops_orders\nSET o_comment = ''\nWHERE o_comment = 'selective_10pct'\n", "platform_overrides": {"datafusion": null}}
- {"id": "update_with_subquery", "description": "Tests UPDATE with correlated subquery to measure subquery execution cost per row", "write_sql": "UPDATE update_ops_orders\nSET o_totalprice = (\n  SELECT SUM(l_extendedprice * (1 - l_discount))\n  FROM lineitem\n  WHERE l_orderkey = update_ops_orders.o_orderkey\n)\nWHERE EXISTS (\n  SELECT 1 FROM lineitem WHERE l_orderkey = update_ops_orders.o_orderkey\n)\nAND o_orderkey <= (SELECT MIN(o_orderkey) + 100 FROM update_ops_orders)\n", "validation_queries": [{"id": "verify_calculation", "sql": "SELECT COUNT(*) as cnt\nFROM update_ops_orders o\nWHERE o_orderkey <= (SELECT MIN(o_orderkey) + 100 FROM update_ops_orders)\n"}], "cleanup_sql": "UPDATE update_ops_orders\nSET o_totalprice = (\n  SELECT SUM(l_extendedprice * (1 - l_discount))\n  FROM lineitem\n  WHERE l_orderkey = update_ops_orders.o_orderkey\n)\nWHERE o_orderkey <= (SELECT MIN(o_orderkey) + 100 FROM update_ops_orders)\n", "platform_overrides": {"datafusion": null}}
