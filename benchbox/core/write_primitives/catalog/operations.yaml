- {"id": "sketch_query_theta_union_merge_lgk14", "description": "Theta sweep variant — lg_k=14 (16384 entries, ~64KB serialized, ~0.8% RSE). Larger and tighter than default lg_k=12.", "requires_setup": false, "write_sql": "INSTALL datasketches FROM community;\nLOAD datasketches;\nDROP TABLE IF EXISTS sketch_ops_daily_users;\nCREATE TABLE sketch_ops_daily_users (\n  activity_date DATE, region VARCHAR(25), user_sketch BLOB, rev_sketch BLOB\n);\nINSERT INTO sketch_ops_daily_users\nSELECT l_shipdate, l_returnflag,\n       datasketch_theta(14, l_orderkey),\n       datasketch_theta(14, CAST(l_extendedprice AS INTEGER))\nFROM lineitem GROUP BY l_shipdate, l_returnflag;\nSELECT datasketch_theta_estimate(datasketch_theta(14, user_sketch)) AS distinct_orders\nFROM sketch_ops_daily_users;\n", "validation_queries": [{"id": "theta_lgk14_estimate_in_range", "sql": "SELECT datasketch_theta_estimate(datasketch_theta(14, user_sketch)) AS distinct_orders\nFROM sketch_ops_daily_users\n", "expected_value_min": 14700, "expected_value_max": 15300, "bounds_scale_with_sf": true}, {"id": "theta_lgk14_storage_size", "sql": "SELECT octet_length(datasketch_theta(14, user_sketch)) AS sketch_bytes\nFROM sketch_ops_daily_users\n", "expected_value_min": 60000, "expected_value_max": 200000}], "cleanup_sql": "DROP TABLE IF EXISTS sketch_ops_daily_users\n", "platform_overrides": {"trino": null, "athena": null, "databricks": null, "snowflake": null, "bigquery": null, "clickhouse": null, "datafusion": null, "redshift": null, "sqlite": null, "starrocks": null}}
- {"id": "sketch_query_kll_quantiles_merge_k100", "description": "KLL sweep variant — k=100 (~1.5KB, ~1.65% normalized rank error). Smaller and lossier than default k=200.", "requires_setup": false, "write_sql": "INSTALL datasketches FROM community;\nLOAD datasketches;\nDROP TABLE IF EXISTS sketch_ops_kll_partitions;\nCREATE TABLE sketch_ops_kll_partitions (\n  activity_date DATE, region VARCHAR(25), price_sketch BLOB\n);\nINSERT INTO sketch_ops_kll_partitions\nSELECT l_shipdate, l_returnflag, datasketch_kll(100, l_extendedprice)\nFROM lineitem GROUP BY l_shipdate, l_returnflag;\nSELECT datasketch_kll_quantile(datasketch_kll(100, price_sketch::sketch_kll_double), 0.5::DOUBLE, true) AS median_price\nFROM sketch_ops_kll_partitions;\n", "validation_queries": [{"id": "kll_k100_median_in_range", "sql": "SELECT datasketch_kll_quantile(datasketch_kll(100, price_sketch::sketch_kll_double), 0.5::DOUBLE, true) AS median_price\nFROM sketch_ops_kll_partitions\n", "expected_value_min": 30000, "expected_value_max": 40000}, {"id": "kll_k100_storage_size", "sql": "SELECT octet_length(datasketch_kll(100, price_sketch::sketch_kll_double)) AS sketch_bytes\nFROM sketch_ops_kll_partitions\n", "expected_value_min": 500, "expected_value_max": 5000}], "cleanup_sql": "DROP TABLE IF EXISTS sketch_ops_kll_partitions\n", "platform_overrides": {"trino": null, "athena": null, "databricks": null, "snowflake": null, "bigquery": null, "clickhouse": null, "datafusion": null, "redshift": null, "sqlite": null, "starrocks": null}}
- {"id": "sketch_query_kll_quantiles_merge_k1000", "description": "KLL sweep variant — k=1000 (~15KB, ~0.59% normalized rank error). Larger and tighter than default k=200.", "requires_setup": false, "write_sql": "INSTALL datasketches FROM community;\nLOAD datasketches;\nDROP TABLE IF EXISTS sketch_ops_kll_partitions;\nCREATE TABLE sketch_ops_kll_partitions (\n  activity_date DATE, region VARCHAR(25), price_sketch BLOB\n);\nINSERT INTO sketch_ops_kll_partitions\nSELECT l_shipdate, l_returnflag, datasketch_kll(1000, l_extendedprice)\nFROM lineitem GROUP BY l_shipdate, l_returnflag;\nSELECT datasketch_kll_quantile(datasketch_kll(1000, price_sketch::sketch_kll_double), 0.5::DOUBLE, true) AS median_price\nFROM sketch_ops_kll_partitions;\n", "validation_queries": [{"id": "kll_k1000_median_in_range", "sql": "SELECT datasketch_kll_quantile(datasketch_kll(1000, price_sketch::sketch_kll_double), 0.5::DOUBLE, true) AS median_price\nFROM sketch_ops_kll_partitions\n", "expected_value_min": 30000, "expected_value_max": 40000}, {"id": "kll_k1000_storage_size", "sql": "SELECT octet_length(datasketch_kll(1000, price_sketch::sketch_kll_double)) AS sketch_bytes\nFROM sketch_ops_kll_partitions\n", "expected_value_min": 5000, "expected_value_max": 40000}], "cleanup_sql": "DROP TABLE IF EXISTS sketch_ops_kll_partitions\n", "platform_overrides": {"trino": null, "athena": null, "databricks": null, "snowflake": null, "bigquery": null, "clickhouse": null, "datafusion": null, "redshift": null, "sqlite": null, "starrocks": null}}
- {"id": "sketch_query_topk_combine_lgmm8", "description": "Top-K sweep variant — explicit lg_max_map_size=8 (256 buckets, ~600B). Same parameter as the default headline op; provided for sweep-symmetry comparisons.", "requires_setup": false, "write_sql": "INSTALL datasketches FROM community;\nLOAD datasketches;\nDROP TABLE IF EXISTS sketch_ops_topk;\nCREATE TABLE sketch_ops_topk (shard_id INTEGER, topk_sketch BLOB);\nINSERT INTO sketch_ops_topk\nSELECT CAST(l_orderkey % 8 AS INTEGER),\n       datasketch_frequent_items(8, l_shipmode)\nFROM lineitem GROUP BY l_orderkey % 8;\nSELECT LENGTH(datasketch_frequent_items_get_frequent(\n  datasketch_frequent_items(8, topk_sketch), 'NO_FALSE_POSITIVES'\n)) AS frequent_count\nFROM sketch_ops_topk;\n", "validation_queries": [{"id": "topk_lgmm8_frequent_count_in_range", "sql": "SELECT LENGTH(datasketch_frequent_items_get_frequent(\n  datasketch_frequent_items(8, topk_sketch), 'NO_FALSE_POSITIVES'\n)) AS frequent_count\nFROM sketch_ops_topk\n", "expected_value_min": 6, "expected_value_max": 8}, {"id": "topk_lgmm8_storage_size", "sql": "SELECT octet_length(datasketch_frequent_items(8, topk_sketch)) AS sketch_bytes\nFROM sketch_ops_topk\n", "expected_value_min": 75, "expected_value_max": 300}], "cleanup_sql": "DROP TABLE IF EXISTS sketch_ops_topk\n", "platform_overrides": {"trino": null, "athena": null, "databricks": null, "snowflake": null, "bigquery": null, "clickhouse": null, "datafusion": null, "redshift": null, "sqlite": null, "starrocks": null}}
- {"id": "sketch_query_topk_combine_lgmm10", "description": "Top-K sweep variant — lg_max_map_size=10 (1024 buckets, ~2KB). Larger than default lgmm=8; should still report 7 frequent items deterministically (lineitem has 7 distinct shipmodes).", "requires_setup": false, "write_sql": "INSTALL datasketches FROM community;\nLOAD datasketches;\nDROP TABLE IF EXISTS sketch_ops_topk;\nCREATE TABLE sketch_ops_topk (shard_id INTEGER, topk_sketch BLOB);\nINSERT INTO sketch_ops_topk\nSELECT CAST(l_orderkey % 8 AS INTEGER),\n       datasketch_frequent_items(10, l_shipmode)\nFROM lineitem GROUP BY l_orderkey % 8;\nSELECT LENGTH(datasketch_frequent_items_get_frequent(\n  datasketch_frequent_items(10, topk_sketch), 'NO_FALSE_POSITIVES'\n)) AS frequent_count\nFROM sketch_ops_topk;\n", "validation_queries": [{"id": "topk_lgmm10_frequent_count_in_range", "sql": "SELECT LENGTH(datasketch_frequent_items_get_frequent(\n  datasketch_frequent_items(10, topk_sketch), 'NO_FALSE_POSITIVES'\n)) AS frequent_count\nFROM sketch_ops_topk\n", "expected_value_min": 6, "expected_value_max": 8}, {"id": "topk_lgmm10_storage_size", "sql": "SELECT octet_length(datasketch_frequent_items(10, topk_sketch)) AS sketch_bytes\nFROM sketch_ops_topk\n", "expected_value_min": 75, "expected_value_max": 300}], "cleanup_sql": "DROP TABLE IF EXISTS sketch_ops_topk\n", "platform_overrides": {"trino": null, "athena": null, "databricks": null, "snowflake": null, "bigquery": null, "clickhouse": null, "datafusion": null, "redshift": null, "sqlite": null, "starrocks": null}}
- {"id": "sketch_df_hll_persist_merge", "description": "★ Headline DataFrame — PySpark HLL persist+merge cycle. Builds per-group HLL sketches of l_orderkey via `F.hll_sketch_agg`, persists state to Parquet, then merges via `F.hll_union_agg` and extracts the distinct-count estimate via `F.hll_sketch_estimate`. Pairs with the SQL-side `sketch_query_theta_union_merge` so users can compare DataFrame and SQL paths against the same true-distinct=15000 baseline at SF=0.01.", "requires_setup": false, "write_sql": "", "aggregate_state": {"sketch_type": "hll", "source_table": "lineitem", "target_subdir": "write_primitives/sketch_df_hll_persist_merge", "group_cols": ["l_shipdate", "l_returnflag"], "value_col": "l_orderkey", "sketch_alias": "user_sketch", "supported_platforms": ["pyspark"]}, "validation_queries": [{"id": "hll_distinct_in_range", "sql": "SELECT 1\n", "expected_value_min": 14250, "expected_value_max": 15750, "bounds_scale_with_sf": true}]}
- {"id": "sketch_df_topk_persist_merge", "description": "★ Headline DataFrame — PySpark Top-K persist+merge cycle. Spark 4.1+ only — `F.approx_top_k_accumulate` is the per-group state builder; `F.approx_top_k_combine` + `F.approx_top_k_estimate` perform the merge+extract. Reports the count of frequent items (lineitem has 7 distinct l_shipmodes; SF=0.01 returns 7 deterministically). Skipped cleanly on Spark 3.5.x via `pyspark_supports_approx_top_k` runtime guard.", "requires_setup": false, "write_sql": "", "aggregate_state": {"sketch_type": "topk", "source_table": "lineitem", "target_subdir": "write_primitives/sketch_df_topk_persist_merge", "group_cols": ["l_shipmode"], "value_col": "l_shipmode", "sketch_alias": "topk_sketch", "supported_platforms": ["pyspark"]}, "validation_queries": [{"id": "topk_frequent_count_in_range", "sql": "SELECT 1\n", "expected_value_min": 6, "expected_value_max": 8}]}
