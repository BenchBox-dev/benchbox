tables:
- id: VECTORS
  key: vectors
  schema:
    name: vectors
    columns:
    - name: id
      type: BIGINT
      nullable: false
      primary_key: true
    - name: embedding
      type: FLOAT_ARRAY
      nullable: false
    - name: category
      type: VARCHAR(50)
      nullable: false
    - name: doc_id
      type: VARCHAR(100)
      nullable: false
- id: VECTOR_QUERIES
  key: vector_queries
  schema:
    name: vector_queries
    columns:
    - name: query_id
      type: INTEGER
      nullable: false
      primary_key: true
    - name: query_vector
      type: FLOAT_ARRAY
      nullable: false
table_order:
- vectors
- vector_queries
embedding_type_map:
  duckdb: REAL[{dim}]
  postgresql: VECTOR({dim})
  postgres: VECTOR({dim})
  snowflake: VECTOR(FLOAT, {dim})
  clickhouse: Array(Float32)
  bigquery: ARRAY<FLOAT64>
  starrocks: ARRAY<REAL>
  doris: ARRAY<REAL>
  spark: ARRAY<REAL>
  lakesail: ARRAY<REAL>
  pyspark: ARRAY<REAL>
  velox: ARRAY<REAL>
  databricks: ARRAY<REAL>
  singlestore: VECTOR({dim}, F32)
  default: REAL[{dim}]
