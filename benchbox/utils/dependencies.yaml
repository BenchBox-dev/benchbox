dataframe_dependency_groups:
  pandas:
    name: pandas
    description: Pandas DataFrame library for data analysis
    packages:
    - pandas
    install_command: uv add benchbox --extra pandas
    use_cases:
    - Data analysis
    - Data manipulation
    - DataFrame benchmarking
    platforms:
    - Pandas
  dask:
    name: dask
    description: Dask parallel computing library
    packages:
    - dask
    - pandas
    install_command: uv add benchbox --extra dask
    use_cases:
    - Parallel computing
    - Out-of-core processing
    - Large datasets
    platforms:
    - Dask
  pyspark:
    name: pyspark
    description: Apache Spark Python interface
    packages:
    - pyspark
    install_command: uv add benchbox --extra pyspark
    use_cases:
    - Distributed computing
    - Big data processing
    - Spark SQL
    platforms:
    - Apache Spark (PySpark)
  polars:
    name: polars
    description: Polars high-performance DataFrame library
    packages:
    - polars
    install_command: uv add benchbox --extra polars
    use_cases:
    - High-performance analytics
    - Lazy evaluation
    - Rust-powered DataFrame
    platforms:
    - Polars
  datafusion:
    name: datafusion
    description: Apache DataFusion query engine
    packages:
    - datafusion
    install_command: uv add benchbox --extra datafusion
    use_cases:
    - SQL on DataFrames
    - Arrow-native processing
    - Query optimization
    platforms:
    - Apache DataFusion
  dataframe-pandas-family:
