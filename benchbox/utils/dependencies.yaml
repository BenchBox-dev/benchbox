    description: All Pandas-family DataFrame platforms
    packages:
    - pandas
    - dask
    install_command: uv add benchbox --extra dataframe-pandas-family
    use_cases:
    - Pandas ecosystem benchmarking
    - Pandas API comparison
    platforms:
    - Pandas
    - Dask
  dataframe-expression-family:
