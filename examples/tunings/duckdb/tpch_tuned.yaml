primary_keys:
  enabled: true
  enforce_uniqueness: true
  nullable: false

foreign_keys:
  enabled: true
  enforce_referential_integrity: true
  on_delete_action: CASCADE
  on_update_action: RESTRICT

unique_constraints:
  enabled: false
  ignore_nulls: false

check_constraints:
  enabled: false
  enforce_on_insert: true
  enforce_on_update: true

platform_optimizations:
  z_ordering_enabled: false
  z_ordering_columns: []
  auto_optimize_enabled: false
  auto_compact_enabled: false
  bloom_filters_enabled: false
  bloom_filter_columns: []
  materialized_views_enabled: false

table_tunings:
  LINEITEM:
    table_name: LINEITEM
    sorting:
    - name: L_ORDERKEY
      type: INTEGER
      order: 1
    - name: L_LINENUMBER
      type: INTEGER
      order: 2
    - name: L_PARTKEY
      type: INTEGER
      order: 3
    - name: L_SUPPKEY
      type: INTEGER
      order: 4

  ORDERS:
    table_name: ORDERS
    sorting:
    - name: O_ORDERKEY
      type: INTEGER
      order: 1
    - name: O_CUSTKEY
      type: INTEGER
      order: 2

  PART:
    table_name: PART
    sorting:
    - name: P_PARTKEY
      type: INTEGER
      order: 1
    - name: P_TYPE
      type: VARCHAR
      order: 2
    - name: P_SIZE
      type: INTEGER
      order: 3

  SUPPLIER:
    table_name: SUPPLIER
    sorting:
    - name: S_SUPPKEY
      type: INTEGER
      order: 1
    - name: S_NATIONKEY
      type: INTEGER
      order: 2

  CUSTOMER:
    table_name: CUSTOMER
    sorting:
    - name: C_CUSTKEY
      type: INTEGER
      order: 1
    - name: C_NATIONKEY
      type: INTEGER
      order: 2

  PARTSUPP:
    table_name: PARTSUPP
    sorting:
    - name: PS_PARTKEY
      type: INTEGER
      order: 1
    - name: PS_SUPPKEY
      type: INTEGER
      order: 2

