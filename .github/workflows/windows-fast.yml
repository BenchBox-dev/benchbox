name: Windows Fast Tests

on:
  workflow_dispatch:
    inputs:
      test_path:
        description: Test path passed to pytest (defaults to the whole tests tree)
        required: false
        default: tests
        type: string
      ref:
        description: Branch, tag or SHA to test (defaults to the ref the workflow was dispatched on)
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  windows:
    name: "windows:fast | fast unit tests (windows-latest, py3.12)"
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Verify the installed wheel loads the bundled SQLGlot runtime
        shell: bash
        run: |
          uv build --wheel
          uv run -- python scripts/smoke_sqlglot_runtime_install.py dist/*.whl

      - name: Run fast tests
        shell: bash
        env:
          TEST_PATH: ${{ inputs.test_path }}
        run: uv run -- python -m pytest "${TEST_PATH:-tests}" -m "fast and not (slow or stress or resource_heavy or live_integration)" --tb=short --timeout=120 --junitxml=junit-fast-windows.xml

      - name: Upload fast test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: windows-fast
          path: junit-fast-windows.xml
          if-no-files-found: ignore
          retention-days: 14
