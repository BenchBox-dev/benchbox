
name: Publication Preview Deploy (G2)

"on":
  workflow_dispatch:
    inputs:
      develop_sha:
        description: "Pinned develop SHA (40-hex commit)"
        required: true
        type: string
      published_results_sha:
        description: "Pinned published-results SHA (40-hex commit)"
        required: true
        type: string
      release_sha:
        description: "Pinned known-good release SHA for the root rebuild"
        required: false
        default: "f841b85f1d40cc2396f16fb185d1dfbb371ac1a3"
        type: string
      generation:
        description: "Preview generation id, [a-z0-9-]{1,32} (served at /preview/<generation>/) "
        required: true
        type: string
      approver:
        description: "Maintainer approving this generation (contract attestor-of-record)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build root + preview generation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      generation: ${{ steps.vars.outputs.generation }}
      preview_db_sha: ${{ steps.preview.outputs.preview_db_sha }}
      root_db_sha: ${{ steps.root.outputs.root_db_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Validate dispatch inputs
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "::error::preview publication must be dispatched from develop"
            exit 1
          fi
          DEVELOP_SHA="${{ inputs.develop_sha }}"
          PUBLISHED_SHA="${{ inputs.published_results_sha }}"
          RELEASE_SHA="${{ inputs.release_sha }}"
          GENERATION="${{ inputs.generation }}"
          APPROVER="${{ inputs.approver }}"
          for label in DEVELOP_SHA PUBLISHED_SHA RELEASE_SHA; do
            val="${!label}"
            if ! printf '%s' "$val" | grep -qE '^[0-9a-f]{40}$'; then
              echo "::error::$label must be a 40-hex commit SHA, got: $val"
              exit 1
            fi
            git cat-file -e "$val" || { echo "::error::$label not found in repo: $val"; exit 1; }
          done
          if ! printf '%s' "$GENERATION" | grep -qE '^[a-z0-9-]{1,32}$'; then
            echo "::error::generation must match [a-z0-9-]{1,32}, got: $GENERATION"
            exit 1
          fi
          if [ -z "$APPROVER" ]; then
            echo "::error::approver is required (manual maintainer approval)"
            exit 1
          fi
          {
            echo "generation=$GENERATION"
            echo "develop_sha=$DEVELOP_SHA"
            echo "published_results_sha=$PUBLISHED_SHA"
            echo "release_sha=$RELEASE_SHA"
            echo "approver=$APPROVER"
          } >> "$GITHUB_OUTPUT"
          echo "inputs OK generation=$GENERATION approver=$APPROVER"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "20"

      - name: Build production-equivalent root from release SHA
        id: root
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA="${{ steps.vars.outputs.release_sha }}"
          git fetch origin "$RELEASE_SHA" --depth=1
          WORK="$(mktemp -d)"
          git worktree add --detach "$WORK" "$RELEASE_SHA"
          trap 'git worktree remove --force "$WORK"' EXIT
          mkdir -p site
          if [ ! -f "$WORK/results-explorer/package.json" ]; then
            echo "::error::release worktree lacks results-explorer/package.json"
            exit 1
          fi
          test -f "$WORK/results-explorer/package-lock.json" || {
            echo "results-explorer/package-lock.json is required for npm ci" >&2
            exit 1
          }
          test -d "$WORK/results-data/bundles"
          test -d "$WORK/_project/scripts/explorer_pipeline"
          npm ci --prefix "$WORK/results-explorer"
          npm run --prefix "$WORK/results-explorer" typecheck
          (
            cd "$WORK"
            uv run -- python _project/scripts/explorer_publish.py build \
              --data-dir results-data/ --output results-explorer/public/data/
          )
          test -s "$WORK/results-explorer/public/data/results.duckdb"
          (
            cd "$WORK"
            uv run -- python _project/scripts/results_explorer_snapshot_invariants.py \
              results-explorer/public/data/results.duckdb
          )
          npm run --prefix "$WORK/results-explorer" build
          if [ -f "$WORK/scripts/generate_query_docs.py" ]; then
            (cd "$WORK" && uv run -- python scripts/generate_query_docs.py)
          fi
          (
            cd "$WORK/docs"
            uv run sphinx-build -b html --keep-going . _build/html
          )
          (
            cd "$WORK"
            uv run -- python scripts/assemble_public_site.py --site-dir "$OLDPWD/site-tmp-root"
          )
          rm -rf site
          mv site-tmp-root site
          uv run python scripts/publication/check_artifact_privacy.py site
          ROOT_DB="site/results/data/results.duckdb"
          ROOT_DB_SHA=""
          if [ -f "$ROOT_DB" ]; then
            ROOT_DB_SHA=$(sha256sum "$ROOT_DB" | cut -d ' ' -f 1)
          fi
          echo "root_db_sha=$ROOT_DB_SHA" >> "$GITHUB_OUTPUT"
          echo "root DB sha256: ${ROOT_DB_SHA:-MISSING}"

      - name: Build preview generation subtree from pinned SHAs
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          GENERATION="${{ steps.vars.outputs.generation }}"
          DEVELOP_SHA="${{ steps.vars.outputs.develop_sha }}"
          PUBLISHED_SHA="${{ steps.vars.outputs.published_results_sha }}"
          git fetch origin "$DEVELOP_SHA" --depth=1
          git fetch origin "$PUBLISHED_SHA" --depth=1
          rm -rf preview-payload preview-dist
          mkdir -p preview-payload preview-dist
          git archive "$PUBLISHED_SHA" results-data | tar -x -C preview-payload
          uv run python _project/scripts/explorer_publish.py build \
            --data-dir preview-payload/results-data \
            --output preview-dist/data
          if [ ! -f "preview-dist/data/results.duckdb" ]; then
            echo "::error::preview DB missing after explorer_publish build"
            exit 1
          fi
          uv run python _project/scripts/results_explorer_snapshot_invariants.py \
            preview-dist/data/results.duckdb
          mkdir -p "site/preview/$GENERATION/results"
          cp -r preview-dist/data "site/preview/$GENERATION/results/"
          DEST="site/preview/$GENERATION"
          PREVIEW_DB_SHA=$(sha256sum "$DEST/results/data/results.duckdb" | cut -d ' ' -f 1)
          {
            echo '<!doctype html><html><head><meta charset="utf-8">'
            echo "<title>Preview $GENERATION</title></head><body>"
            echo "<h1>Publication preview $GENERATION</h1>"
            echo "<p>develop=$DEVELOP_SHA published-results=$PUBLISHED_SHA</p>"
            echo "<p>database_sha256=$PREVIEW_DB_SHA</p>"
            echo '</body></html>'
          } > "$DEST/index.html"
          cp "$DEST/index.html" "$DEST/results/index.html"
          uv run python scripts/publication/check_artifact_privacy.py site
          echo "preview_db_sha=$PREVIEW_DB_SHA" >> "$GITHUB_OUTPUT"
          echo "preview DB sha256: $PREVIEW_DB_SHA"

      - name: Write desired manifest + assembly receipt
        shell: bash
        run: |
          set -euo pipefail
          GENERATION="${{ steps.vars.outputs.generation }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          mkdir -p receipt-dist
          MANIFEST_DIGEST_INPUT="develop=${{ steps.vars.outputs.develop_sha }}|published=${{ steps.vars.outputs.published_results_sha }}|target=benchbox.dev/preview/$GENERATION|generation=$GENERATION"
          MANIFEST_DIGEST=$(printf '%s' "$MANIFEST_DIGEST_INPUT" | sha256sum | cut -d ' ' -f 1)
          cat > receipt-dist/desired-manifest.json <<EOF
          {
            "schema_version": 1,
            "target": "benchbox.dev/preview/$GENERATION",
            "generation": "$GENERATION",
            "develop_sha": "${{ steps.vars.outputs.develop_sha }}",
            "published_results_sha": "${{ steps.vars.outputs.published_results_sha }}",
            "release_sha": "${{ steps.vars.outputs.release_sha }}",
            "manifest_digest": "$MANIFEST_DIGEST",
            "approver": "${{ steps.vars.outputs.approver }}",
            "dispatched_by": "${{ github.actor }}",
            "timestamp": "$TIMESTAMP"
          }
          EOF
          (cd site && find . -type f -exec sha256sum {} + | sort) > receipt-dist/assembly-file-digests.txt
          ASSEMBLY_DIGEST=$(sha256sum receipt-dist/assembly-file-digests.txt | cut -d ' ' -f 1)
          cat > receipt-dist/assembly-receipt.json <<EOF
          {
            "schema_version": 1,
            "generation": "$GENERATION",
            "artifact_digest": "$ASSEMBLY_DIGEST",
            "preview_db_sha256": "${{ steps.preview.outputs.preview_db_sha }}",
            "root_db_sha256": "${{ steps.root.outputs.root_db_sha }}",
            "timestamp": "$TIMESTAMP"
          }
          EOF
          echo "manifest_digest=$MANIFEST_DIGEST assembly_digest=$ASSEMBLY_DIGEST"

      - name: Pre-deploy root-neutrality gate
        shell: bash
        run: |
          set -euo pipefail
          LIVE_DB_SHA=$(uv run -- python -c \
            "import json; print(json.load(open('docs/operations/publication-baseline-2026-08-31.json'))['live_database']['sha256'])")
          LIVE_DB_URL=$(uv run -- python -c \
            "import json; print(json.load(open('docs/operations/publication-baseline-2026-08-31.json'))['live_database']['url'])")
          ROOT_DB="site/results/data/results.duckdb"
          if [ ! -f "$ROOT_DB" ]; then
            echo "::error::rebuilt root has no results.duckdb; refusing deploy"
            exit 1
          fi
          curl -sSL --fail --retry 3 -o /tmp/live-results.duckdb "$LIVE_DB_URL" || {
            echo "::error::could not download live DB from $LIVE_DB_URL; refusing deploy"
            exit 1
          }
          LIVE_DL_SHA=$(sha256sum /tmp/live-results.duckdb | cut -d ' ' -f 1)
          if [ "$LIVE_DL_SHA" != "$LIVE_DB_SHA" ]; then
            echo "::error::live DB moved under us ($LIVE_DL_SHA != baseline $LIVE_DB_SHA); refusing deploy"
            exit 1
          fi
          uv run -- python scripts/publication/compare_db_digest.py compare \
            "$ROOT_DB" /tmp/live-results.duckdb || exit 1
          echo "root neutrality proven: canonical digest equivalence with live $LIVE_DB_SHA"

      - name: Upload Pages artifact (site + preview subtree)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
          include-hidden-files: true

      - name: Upload generation receipts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: preview-receipts-${{ steps.vars.outputs.generation }}
          path: receipt-dist/
          retention-days: 90

  deploy:
    name: Deploy preview site to GitHub Pages
    needs: build
    if: false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      pages_write_outcome: ${{ steps.deployment.outcome }}
    steps:
      - name: Guard preview deploy disabled in code
        run: |
          echo "::error::Preview deployment is permanently disabled in code per publication transaction contract"
          exit 1

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Check for independent publication ownership
        id: independent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE=false
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | select(.name | startswith("publication-live-receipt-")) | "\(.created_at) \(.id) \(.workflow_run.id)"' \
            | sort -r > independent-publication-runs.txt
          while read -r _CREATED_AT ARTIFACT_ID RUN_ID; do
            [ -n "${RUN_ID:-}" ] || continue
            RUN_META=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" \
              --jq '[.name, .status, .conclusion, .event, .head_branch] | @tsv')
            IFS=$'\t' read -r RUN_NAME RUN_STATUS RUN_CONCLUSION RUN_EVENT RUN_BRANCH <<< "$RUN_META"
            if [[ "$RUN_NAME" == "Publication Control Plane Deployment" && "$RUN_STATUS" == "completed" && \
                  "$RUN_EVENT" == "workflow_dispatch" && "$RUN_BRANCH" == "develop" ]]; then
              :
            else
              continue
            fi
            rm -rf independent-receipt && mkdir independent-receipt
            gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > independent-receipt.zip
            unzip -q independent-receipt.zip -d independent-receipt
            if EXPECTED_RUN_ID="$RUN_ID" RUN_CONCLUSION="$RUN_CONCLUSION" python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from scripts.publication.reconciliation import receipt_targets_benchbox_dev, verify_live_receipt_signature

          path = Path("independent-receipt/live-receipt.json")
          if not path.is_file():
              raise SystemExit(1)
          receipt = json.loads(path.read_text())
          valid, _ = verify_live_receipt_signature(receipt)
          if not valid or not receipt_targets_benchbox_dev(receipt):
              raise SystemExit(1)
          if str(receipt.get("receipt_run_id", receipt.get("artifact_run_id"))) != os.environ["EXPECTED_RUN_ID"]:
              raise SystemExit(1)
          if not re.fullmatch(r"[0-9a-f]{40}", str(receipt.get("source_commit", ""))):
              raise SystemExit(1)
          if os.environ["RUN_CONCLUSION"] != "success":
              if not str(receipt.get("receipt_id", "")).startswith("rollback-"):
                  raise SystemExit(1)
              if not receipt.get("routes") or not all(route.get("ok") for route in receipt["routes"]):
                  raise SystemExit(1)
          PY
            then
              ACTIVE=true
              break
            fi
          done < independent-publication-runs.txt
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          if [ "$ACTIVE" = "true" ]; then
            echo "::notice::Independent publication owns Pages; skipping the preview deployment"
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.independent.outputs.active != 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  record:
    name: Record deployment receipt + soak state
    needs: [build, deploy]
    if: needs.deploy.outputs.pages_write_outcome == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Download generation receipts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: preview-receipts-${{ needs.build.outputs.generation }}
          path: ./receipt-dist

      - name: Write deployment receipt + soak state
        shell: bash
        run: |
          set -euo pipefail
          GENERATION="${{ needs.build.outputs.generation }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          DEPLOY_ID="${{ github.run_id }}-${{ github.run_attempt }}"
          cat > receipt-dist/deployment-receipt.json <<EOF
          {
            "schema_version": 1,
            "generation": "$GENERATION",
            "target": "benchbox.dev/preview/$GENERATION",
            "deployment_id": "$DEPLOY_ID",
            "page_url": "https://benchbox.dev",
            "timestamp": "$TIMESTAMP"
          }
          EOF
          SOAK_START=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > receipt-dist/soak-state.json <<EOF
          {
            "schema_version": 1,
            "generation": "$GENERATION",
            "soak_start": "$SOAK_START",
            "soak_hours": 12,
            "probe_interval_minutes": 30,
            "preview_db_sha256": "${{ needs.build.outputs.preview_db_sha }}",
            "root_db_sha256": "${{ needs.build.outputs.root_db_sha }}"
          }
          EOF
          echo "soak state opens at $SOAK_START for generation $GENERATION"

      - name: Upload deployment receipt + soak state
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: preview-deploy-record-${{ needs.build.outputs.generation }}
          path: receipt-dist/
          retention-days: 90
