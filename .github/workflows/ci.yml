      - name: Oracle coverage map drift check
        id: guard-oracle-coverage-map
        continue-on-error: true
        run: make oracle-coverage-map-check

      - name: Pricing data drift check
        id: guard-pricing-data
        continue-on-error: true
        run: make pricing-data-check

      - name: Public contract drift check
        id: guard-public-contract-drift
        continue-on-error: true
        run: uv run -- python scripts/check_public_contract_drift.py

      - name: Documentation contracts drift check
        id: guard-doc-contracts
        continue-on-error: true
        run: make doc-contracts-guard

      - name: Dependency audit (no unused declarations)
        id: guard-audit-deps
        continue-on-error: true
        run: make audit-deps

      - name: Dependency inventory drift check
        id: guard-audit-raw
        continue-on-error: true
        run: make audit-raw-check

      - name: Release curation list drift check
        id: guard-release-curation
        continue-on-error: true
        run: uv run -- python scripts/check_release_curation.py

      - name: Untracked skill-mirror drift guard (cloud parity)
        id: guard-skill-mirror-drift
        continue-on-error: true
        run: sh scripts/check_untracked_skill_mirrors.sh

      - name: Duplicate code delta vs PR base
        id: guard-duplicate-delta
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: make duplicate-check-delta

      - name: Complexity policy and report
        id: guard-complexity-policy
        continue-on-error: true
        run: make complexity-check

      - name: Run promoted regression reproducers
        id: guard-promoted-reproducers
        continue-on-error: true
        run: |
          uv run -- python -m pytest \
            tests/integration/test_cross_surface_mutation_sensitivity.py \
            tests/unit/test_standardized_test_commands.py::TestMakefileCommands::test_cross_surface_gates_are_pinned_in_make_and_ci \
            tests/integration/test_plan_capture_phase.py \
            tests/integration/test_tpcds_power_test.py \
            tests/integration/test_ducklake_integration.py \
            tests/integration/tuning/test_duckdb_fk_load_ordering.py \
            tests/integration/test_tpch_power_test.py \
            tests/integration/test_tpch_throughput_test.py \
            -m "(slow or medium) and not live_integration" \
            -k "not (test_cross_surface_mutation_sensitivity or test_tpcds_power_test or test_tpch_power_test or test_tpch_throughput_test) or test_targets_cover_every_enforced_gate or h2odb or test_execute_one_query_drains_raw_cursor_before_commit or boundary_query" \
            -n 0 --tb=short -q --junitxml="$RUNNER_TEMP/promoted-reproducers.xml"
          uv run -- python - "$RUNNER_TEMP/promoted-reproducers.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          cases = [
              (case.get("classname", ""), case.get("name", ""))
              for case in ET.parse(sys.argv[1]).iter("testcase")
          ]
          groups = {
              "cross-surface target drift guard": ("test_cross_surface_mutation_sensitivity", "test_targets_cover_every_enforced_gate"),
              "cross-surface Make/CI pinning guard": ("test_standardized_test_commands", "test_cross_surface_gates_are_pinned_in_make_and_ci"),
              "h2odb mutation-catch": ("test_cross_surface_mutation_sensitivity", "h2odb"),
              "plan-capture phase": ("test_plan_capture_phase", ""),
              "TPC-DS drain before commit": ("test_tpcds_power_test", "test_execute_one_query_drains_raw_cursor_before_commit"),
              "DuckLake in-process adapter": ("test_ducklake_integration", ""),
              "DuckDB FK load ordering": ("test_duckdb_fk_load_ordering", ""),
              "TPC-H power boundary query": ("test_tpch_power_test", "boundary_query"),
              "TPC-H throughput boundary query": ("test_tpch_throughput_test", "boundary_query"),
          }
          empty = [
              label
              for label, (module, name) in groups.items()
              if not any(f".{module}" in classname and name in test for classname, test in cases)
          ]
          if empty:
              raise SystemExit(f"Promoted reproducer groups selected no tests: {', '.join(empty)}")
          print(f"All {len(groups)} promoted reproducer groups ran ({len(cases)} tests).")
          PY

      - name: Check for unsafe patch() string paths in tests
        id: guard-patch-safety
        continue-on-error: true
        run: uv run -- python scripts/check_patch_safety.py

      - name: lint-guard-summary
        id: lint-guard-summary
        if: always()
        env:
          STEPS_CONTEXT: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$STEPS_CONTEXT" > "$RUNNER_TEMP/steps_context.json"

          ids=$(jq -r 'keys[] | select(startswith("guard-"))' "$RUNNER_TEMP/steps_context.json" | sort) || {
            echo "aggregator: jq failed to parse the steps context" >&2
            exit 1
          }
          if [ -z "$ids" ]; then
            echo "aggregator: no guard-* steps found in the steps context" >&2
            exit 1
          fi

          {
            echo "## Lint guard summary"
            echo
            echo "| Guard | Outcome |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for id in $ids; do
            outcome=$(jq -r --arg id "$id" '.[$id].outcome' "$RUNNER_TEMP/steps_context.json")
            if [ "$outcome" = "success" ]; then
              echo "| $id | ✅ success |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $id | ⚠️ $outcome |" >> "$GITHUB_STEP_SUMMARY"
              echo "FAILED: $id ($outcome)"
              failed=1
            fi
          done

          if [ "$failed" -eq 1 ]; then
            echo "One or more lint guards failed -- see the table above and the" \
              "per-step logs for details." >&2
            exit 1
          fi
          echo "All lint guards passed."

  code-test:
    name: test (ubuntu-latest, 3.14)
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.code-tests-needed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Summarize Make interface changes
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: python make/interface_summary.py --base-ref "$BASE_REF" --summary "$GITHUB_STEP_SUMMARY"

      - name: Pre-build the assertion-rewrite cache
        run: |
          find tests \( -name 'test_*.py' -o -name '*_test.py' \) -not -path '*/__pycache__/*' | sort \
            | awk -v n="$(nproc)" -v dir="$RUNNER_TEMP" '{ print > (dir "/rewrite-chunk." (NR % n)) }'
          pids=()
          for chunk in "$RUNNER_TEMP"/rewrite-chunk.*; do
            xargs uv run -- python -m pytest --collect-only -q -n 0 -p no:cacheprovider < "$chunk" > "$chunk.log" 2>&1 &
            pids+=("$!:$chunk")
          done
          for entry in "${pids[@]}"; do
            status=0
            wait "${entry%%:*}" || status=$?
            if [ "$status" -ne 0 ] && [ "$status" -ne 5 ]; then
              echo "::warning::Assertion-rewrite warm-up chunk ${entry#*:} exited $status"
              tail -n 20 "${entry#*:}.log"
            fi
          done

      - name: Run fast tests
        env:
          BENCHBOX_MAX_XDIST_WORKERS: "4"
          BENCHBOX_XDIST_TRACE_DIR: xdist-failure-trace
          COVERAGE_CORE: sysmon
        run: |
          mkdir -p fast-junit
          (
            min_kb=
            while :; do
              avail_kb=$(awk '/^MemAvailable:/ { print $2 }' /proc/meminfo)
              if [ -z "$min_kb" ] || [ "$avail_kb" -lt "$min_kb" ]; then
                min_kb=$avail_kb
                echo "$min_kb" > "$RUNNER_TEMP/mem-available-min-kb"
              fi
              sleep 2
            done
          ) &
          sampler=$!
          status=0
          uv run -- python -m pytest tests -m "fast and not (slow or stress or resource_heavy or live_integration)" -n auto --tb=short --timeout=120 --durations=25 -o junit_duration_report=total --junitxml=fast-junit/junit.xml -p scripts.fast_tier_calibration --collection-timing fast-junit/collection.jsonl -p pytest_cov --cov=benchbox --cov-report=xml --cov-report=term-missing --cov-fail-under=70 || status=$?
          kill "$sampler" 2>/dev/null || true
          total_mib=$(awk '/^MemTotal:/ { print int($2 / 1024) }' /proc/meminfo)
          if [ -s "$RUNNER_TEMP/mem-available-min-kb" ]; then
            min_mib=$(( $(cat "$RUNNER_TEMP/mem-available-min-kb") / 1024 ))
            echo "Lowest available memory during the fast tests: ${min_mib} MiB of ${total_mib} MiB" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Check fast-tier junit parses
        if: always()
        continue-on-error: true
        run: |
          uv run -- python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          from pathlib import Path

          from tests.duration_policy import collect_junit_durations

          durations = collect_junit_durations([Path("fast-junit/junit.xml")])
          print(f"Fast-tier junit parsed: {len(durations)} tests")
          PY

      - name: Record fast-tier runner calibration
        if: always()
        continue-on-error: true
        run: |
          uv run -- python -m scripts.fast_tier_calibration \
            --collection-file fast-junit/collection.jsonl \
            --output fast-junit/calibration.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload fast-tier junit
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: fast-junit-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: fast-junit/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

      - name: Upload xdist failure trace
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: xdist-failure-trace
          path: xdist-failure-trace/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  medium-collect:
    name: medium-collect
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.heavy-needed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Compile sources in parallel before collection
        run: uv run -- python -m compileall -q -j 0 tests benchbox || echo "::warning::Bytecode warm-up skipped some files"

      - name: Collect the complete medium tier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p t2-artifacts
          BENCHBOX_TEST_TIER=t2 uv run -- python -m pytest --collect-only -q -n 0 --assert=plain \
            -m "medium and not (slow or stress or resource_heavy or live_integration)" \
            > t2-artifacts/medium-collect.txt
          count=$(grep -Eo '^[0-9]+/[0-9]+ tests collected' t2-artifacts/medium-collect.txt | tail -1 | cut -d/ -f1)
          test -n "$count"
          uv run -- python scripts/release_canary_sharding.py collect \
            --input t2-artifacts/medium-collect.txt \
            --nodeids-output t2-artifacts/medium-nodeids.txt \
            --summary-output t2-artifacts/medium-collection.json \
            --expected-count "$count" --shard-count 4 \
            --durations tests/fixtures/medium_shard_durations.json \
            --workflow ci.yml --job medium-collect \
            --marker-expression "medium and not (slow or stress or resource_heavy or live_integration)" \
            --checked-ref "${{ github.ref }}" --checked-sha "${{ github.sha }}"

      - name: Upload medium collection evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: t2-medium-nodeids-${{ github.sha }}
          path: t2-artifacts/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  medium-test:
    name: medium-test (shard ${{ matrix.shard_index }})
    needs: [ci-paths, medium-collect]
    if: ${{ !cancelled() && !(github.event.action == 'edited' && !github.event.changes.base) && needs.ci-paths.result == 'success' && needs.ci-paths.outputs.medium-shards != '[]' && (needs.ci-paths.outputs.heavy-needed != 'true' || needs.medium-collect.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard_index: ${{ fromJSON(needs.ci-paths.outputs.medium-shards) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ needs.ci-paths.outputs.heavy-needed == 'true' && '3.12' || '3.14' }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Download coverage selection
        if: needs.ci-paths.outputs.heavy-needed != 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: coverage-selection-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: coverage-selection

      - name: Run medium tests for changed paths
        if: needs.ci-paths.outputs.heavy-needed != 'true'
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
        run: |
          set -euo pipefail
          targets="coverage-selection/coverage-nodeids.txt"
          test -f "$targets"
          mapfile -t node_ids < "$targets" || true
          if [ "${#node_ids[@]}" -gt 0 ]; then
            collected="coverage-selection/collected.txt"
            BENCHBOX_TEST_TIER=t2 uv run -- python -m pytest --collect-only -q "${node_ids[@]}" \
              > "$collected" 2>/dev/null || true
            runnable="coverage-selection/runnable-nodeids.txt"
            uv run -- python scripts/coverage_test_selection.py prune \
              --nodeids-in "$targets" \
              --collected-in "$collected" \
              --nodeids-out "$runnable"
            mapfile -t node_ids < "$runnable"
          fi
          if [ "${#node_ids[@]}" -eq 0 ]; then
            echo "No tests selected for the changed paths."
            exit 0
          fi
          echo "Medium tests selected by coverage impact: ${#node_ids[@]}"
          uv run -- python scripts/release_canary_sharding.py shard \
            --input "$runnable" \
            --nodeids-output "coverage-selection/shard-${SHARD_INDEX}-nodeids.txt" \
            --summary-output "coverage-selection/shard-${SHARD_INDEX}-summary.json" \
            --shard-index "$SHARD_INDEX" --shard-count 4 \
            --workflow ci.yml --job medium-test \
            --marker-expression "medium and not (slow or stress or resource_heavy or live_integration)" \
            --durations tests/fixtures/medium_shard_durations.json
          mapfile -t node_ids < "coverage-selection/shard-${SHARD_INDEX}-nodeids.txt"
          if [ "${#node_ids[@]}" -eq 0 ]; then
            echo "No selected tests assigned to shard ${SHARD_INDEX}."
            exit 0
          fi
          echo "Selected tests assigned to shard ${SHARD_INDEX}: ${#node_ids[@]}"
          printf '%s\n' "${node_ids[@]:0:50}"
          status=0
          BENCHBOX_TEST_TIER=t2 uv run -- python -m pytest "${node_ids[@]}" \
            -m "medium and not (slow or stress or resource_heavy or live_integration)" \
            --tb=short --timeout=60 -q || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 5 ]; then
            exit "$status"
          fi

      - name: Download medium collection evidence
        if: needs.ci-paths.outputs.heavy-needed == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: t2-medium-nodeids-${{ github.sha }}
          path: t2-artifacts

      - name: Partition the complete medium tier
        if: needs.ci-paths.outputs.heavy-needed == 'true'
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
        run: |
          uv run -- python scripts/release_canary_sharding.py shard \
            --input t2-artifacts/medium-nodeids.txt \
            --nodeids-output "t2-artifacts/shard-${SHARD_INDEX}-nodeids.txt" \
            --summary-output "t2-artifacts/shard-${SHARD_INDEX}-summary.json" \
            --shard-index "$SHARD_INDEX" --shard-count 4 \
            --workflow ci.yml --job medium-test \
            --marker-expression "medium and not (slow or stress or resource_heavy or live_integration)" \
            --collection-summary t2-artifacts/medium-collection.json --checked-sha "${{ github.sha }}" \
            --durations tests/fixtures/medium_shard_durations.json

      - name: Run medium speed tier
        if: needs.ci-paths.outputs.heavy-needed == 'true'
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
        run: |
          set -euo pipefail
          test -s "t2-artifacts/shard-${SHARD_INDEX}-nodeids.txt"
          mapfile -t node_ids < "t2-artifacts/shard-${SHARD_INDEX}-nodeids.txt"
          sample_resources() {
            while sleep 30; do
              echo "[resources $(date -u +%H:%M:%S)] $(free -m | awk '/Mem:/ {print "used_mb=" $3 " available_mb=" $7}') load=$(cut -d' ' -f1-3 /proc/loadavg)"
              ps -eo pid,rss,etimes,comm --sort=-rss | awk 'NR <= 4 {print "  " $0}'
            done
          }
          sample_resources &
          sampler=$!
          trap 'pkill -P "${sampler}" 2>/dev/null || true; kill "${sampler}" 2>/dev/null || true' EXIT
          BENCHBOX_TEST_TIER=t2 uv run -- python -m pytest \
            -m "medium and not (slow or stress or resource_heavy or live_integration)" \
            --tb=short --timeout=60 -n 5 --dist loadscope --durations=25 \
            -p scripts.pytest_shard_evidence \
            --assigned-nodeids "t2-artifacts/shard-${SHARD_INDEX}-nodeids.txt" \
            --shard-evidence "t2-artifacts/shard-${SHARD_INDEX}-execution.json" \
            --junitxml "t2-artifacts/shard-${SHARD_INDEX}-junit.xml" \
            --checked-sha "${{ github.sha }}" "${node_ids[@]}"

      - name: Record kernel memory events for the medium shard
        if: always()
        shell: bash
        run: |
          free -m
          sudo dmesg -T 2>/dev/null | grep -iE 'out of memory|oom-kill|killed process' | tail -20 || true

      - name: Run changed tests on the curated release tree
        if: ${{ !cancelled() && matrix.shard_index == 0 && needs.ci-paths.outputs.code-tests-needed == 'true' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          UV_PYTHON: '3.14'
        run: uv run -- python scripts/release_curation_dry_run.py --changed-since "$BASE_SHA"

      - name: Upload medium shard evidence
        if: ${{ always() && needs.ci-paths.outputs.heavy-needed == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: t2-medium-shard-${{ matrix.shard_index }}-${{ github.sha }}
          path: t2-artifacts/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  trunk-lane-plain:
