  correctness-gate:
    name: correctness-gate (${{ matrix.partition }})
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.heavy-needed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        partition: [a, b]
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run bounded real-result correctness gate
        if: matrix.partition == 'b'
        run: make test-correctness-gate

      - name: Run TPC-Havoc variant-equivalence gate
        if: matrix.partition == 'b'
        run: make tpchavoc-equivalence-report

      - name: Run TPC-Havoc DataFrame variant-equivalence gate
        if: matrix.partition == 'a'
        run: make tpchavoc-dataframe-equivalence-report

      - name: Run SSB cross-surface SQL<->DataFrame equivalence gate
        if: matrix.partition == 'b'
        run: make ssb-cross-surface-equivalence-report

      - name: Run AMPLab cross-surface SQL<->DataFrame equivalence gate
        if: matrix.partition == 'b'
        run: make amplab-cross-surface-equivalence-report

      - name: Run CoffeeShop cross-surface SQL<->DataFrame equivalence gate
        if: matrix.partition == 'a'
        run: make coffeeshop-cross-surface-equivalence-report

      - name: Run ClickBench cross-surface SQL<->DataFrame equivalence gate
        if: matrix.partition == 'b'
        run: make clickbench-cross-surface-equivalence-report

      - name: Run JoinOrder-synthetic cross-surface SQL<->DataFrame equivalence gate
        if: matrix.partition == 'b'
        run: make joinorder-synthetic-cross-surface-equivalence-report

      - name: Run H2O-DB cross-surface SQL<->DataFrame equivalence gate
        if: matrix.partition == 'a'
        run: make h2odb-cross-surface-equivalence-report

      - name: Run Read Primitives cross-surface SQL<->DataFrame equivalence gate
        if: matrix.partition == 'b'
        run: make read-primitives-cross-surface-equivalence-report

      - name: Run FlightData cross-surface SQL<->DataFrame equivalence gate
        if: matrix.partition == 'a'
        run: make flightdata-cross-surface-equivalence-report

      - name: Run Data Vault cross-surface SQL<->DataFrame equivalence gate
        if: matrix.partition == 'b'
        run: make datavault-cross-surface-equivalence-report

      - name: Run NYC Taxi cross-surface SQL<->DataFrame equivalence gate
        if: matrix.partition == 'a'
        run: make nyctaxi-cross-surface-equivalence-report

      - name: Run TSBS DevOps cross-surface SQL<->DataFrame equivalence gate
        if: matrix.partition == 'a'
        run: make tsbs-devops-cross-surface-equivalence-report

      - name: Run TPC-H Skew cross-surface SQL<->DataFrame equivalence gate
        if: matrix.partition == 'a'
        run: make tpch-skew-cross-surface-equivalence-report

      - name: Run TPC-H cross-surface SQL<->DataFrame equivalence gate
        if: matrix.partition == 'a'
        run: make tpch-cross-surface-equivalence-report

      - name: Run TPC-DS cross-surface SQL<->DataFrame equivalence gate (Polars and DataFusion)
        if: matrix.partition == 'b'
        run: make tpcds-cross-surface-equivalence-report

      - name: Run TPC-DS cross-surface SQL<->DataFrame equivalence gate (pandas)
        if: matrix.partition == 'a'
        run: make tpcds-pandas-cross-surface-equivalence-report

      - name: Run the required local-engine cases
        if: ${{ !cancelled() && matrix.partition == 'a' }}
        timeout-minutes: 20
        run: make test-required-local-cases

      - name: Run TPC-Havoc DataFusion variant-equivalence sample and .tbl load regression
        if: ${{ !cancelled() && matrix.partition == 'a' }}
        continue-on-error: true
        timeout-minutes: 15
        run: |
          uv run -- python -m pytest \
            tests/integration/platforms/test_tpchavoc_datafusion_equivalence.py \
            tests/integration/platforms/test_datafusion_tbl_load.py \
            -m "slow" -n 0 --tb=short -v

      - name: Run in-process plan-capture gate
        if: ${{ !cancelled() && matrix.partition == 'b' }}
        timeout-minutes: 10
        run: make plan-capture-gate

      - name: Run the polars-df smoke and cross-surface gates on Polars 2.0.0
        if: ${{ !cancelled() && matrix.partition == 'b' }}
        timeout-minutes: 30
        run: |
          uv pip install "polars==2.0.0"
          make polars-df-compat-check

  tuning-liveness:
    name: tuning-liveness
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.tuning-paths-changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run real-CLI tuning liveness matrix
        run: make tuning-liveness-gate

  sql-execution-evidence:
    name: sql-execution-evidence
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.sql-evidence-paths-changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: ghcr.io/benchbox-dev/postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        credentials:
          username: ${{ github.actor }}
          password: ${{ github.token }}
        env:
          POSTGRES_USER: benchbox
          POSTGRES_PASSWORD: benchbox
          POSTGRES_DB: benchbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run the executed SQL comparison gate
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          BENCHBOX_POSTGRES_DSN: postgresql://benchbox:benchbox@127.0.0.1:5432/benchbox_test
        run: make sql-execution-gate

  package-smoke:
    name: package-smoke
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.packaging-needed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Build package
        run: |
          uv build
          uv run -- python -m scripts.verify_sqlglot_runtime_distribution dist/*.whl dist/*.tar.gz

      - name: Test package installation
        shell: bash
        run: |
          set -euo pipefail
          wheel_count=$(find dist -maxdepth 1 -name '*.whl' | wc -l | tr -d '[:space:]')
          if [ "$wheel_count" != "1" ]; then
            echo "::error::Expected exactly one wheel, found $wheel_count"
            find dist -maxdepth 1 -type f -print
            exit 1
          fi
          wheel=$(find "$PWD/dist" -maxdepth 1 -name '*.whl' -print -quit)
          tmpdir=$(mktemp -d)
          cd "$tmpdir"
          uv run --isolated --no-project --with "$wheel" -- python -c "import importlib.util; import benchbox; assert importlib.util.find_spec('pandas') is None, 'core install must not pull pandas'; print('Package installation successful (minimal import surface)')"
          uv run --isolated --no-project --with "$wheel" -- benchbox --help
          uv run --isolated --no-project --with "$wheel" -- python -c "from benchbox import TPCDSOBT; benchmark = TPCDSOBT(scale_factor=1.0); queries = benchmark.get_queries(); assert queries, 'expected OBT queries from wheel install'; assert benchmark.get_query(next(iter(queries))); print(f'TPC-DS-OBT wheel smoke: {len(queries)} queries')"

  dependency-audit:
    name: dependency-audit
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.packaging-needed == 'true' }}
    runs-on: ubuntu-latest
    env:
      PIP_AUDIT_IGNORE_VULNS: "PYSEC-2026-3696,PYSEC-2026-3697,PYSEC-2026-3698,PYSEC-2026-3699,PYSEC-2026-3923,PYSEC-2026-3447"
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run security audit
        run: |
          if [ -n "${PIP_AUDIT_IGNORE_VULNS}" ]; then
            IGNORE_ARGS=$(printf '%s' "${PIP_AUDIT_IGNORE_VULNS}" | tr ',' '\n' | sed '/^$/d;s/^[[:space:]]*//;s/[[:space:]]*$//;/^$/d;s/^/--ignore-vuln /' | tr '\n' ' ')
            uv run --with pip-audit -- pip-audit ${IGNORE_ARGS}
          else
            uv run --with pip-audit -- pip-audit
          fi

  results-data-check:
    name: results-data-check
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.unit-results-data == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Install dependencies
        run: uv sync --group dev
      - name: Corpus inventory is current
        run: uv run -- python scripts/generate_corpus_inventory.py --check
      - name: Corpus validation
        run: uv run -- python results-data/validate_corpus.py
      - name: Submission validator stays in sync
        if: ${{ needs.ci-paths.outputs.submission-validator-changed == 'true' }}
        run: |
          git fetch --no-tags --depth=1 origin published-results
          git show FETCH_HEAD:.github/workflows/validate-submission.yml \
            > /tmp/published-validate-submission.yml
          uv run -- python scripts/check_submission_validator_sync.py \
            --develop .github/workflows/validate-submission.yml \
            --published /tmp/published-validate-submission.yml
      - name: Corpus, submission, and explorer-pipeline contract tests
        run: |
          uv run -- python -m pytest -p no:cacheprovider -o addopts='' -q \
            tests/unit/scripts/test_generate_corpus_inventory.py \
            tests/unit/scripts/test_validate_submission.py \
            tests/unit/scripts/explorer_pipeline \
            tests/unit/workflows/test_corpus_trust_boundary.py \
            tests/unit/publication \
            tests/unit/explorer

  parity-check:
    name: parity-check
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.viz-needed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Verify parity fixtures match Python source
        run: make parity-check

  api-contract-check:
    name: api-contract-check
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.api-contract-changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Verify public API symbols against the released wheel
        run: make api-contract-check

  example-validation:
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.unit-docs == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Enforce the site-owned documentation freeze
        if: ${{ github.event_name == 'pull_request' }}
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid event base SHA" >&2; exit 1; }
          if ! git cat-file -e "$EVENT_BASE_SHA:scripts/check_docs_freeze.py" 2>/dev/null; then
            echo "The base revision carries no documentation freeze gate."
            exit 0
          fi
          trusted="$RUNNER_TEMP/trusted-docs-freeze"
          mkdir -p "$trusted"
          git show "$EVENT_BASE_SHA:scripts/check_docs_freeze.py" > "$trusted/check_docs_freeze.py"
          git show "$EVENT_BASE_SHA:scripts/docs_history_filter.py" > "$trusted/docs_history_filter.py"
          python -I "$trusted/check_docs_freeze.py" --root "$PWD" --base "$EVENT_BASE_SHA" --head HEAD

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Validate examples and docs references
        run: make docs-validate

      - name: Generate documentation inputs
        run: make docs-generate

  spellcheck:
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.unit-docs == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Run codespell
        run: >-
          uvx --from 'codespell[toml]==2.4.3' codespell
          --ignore-words .codespell-ignore.txt
          --skip "*.pyc,_build,*.json,*.jsonl,*.lock,*.svg,*.min.js,*.min.css,_binaries,*.tpl,*.dst,*.tbl,_sources,benchmark_runs,*.dat,*.pdf,_project,htmlcov,.venv"

  core:
    name: ${{ (github.event.action == 'edited' && !github.event.changes.base) && 'core (text edit)' || 'core' }}
    needs: [ci-paths, code-lint, code-test, medium-collect, medium-test, correctness-gate, tpch-binary-framing, tuning-liveness, sql-execution-evidence, package-smoke, dependency-audit, trunk-lane-plain, trunk-lane-coverage]
    if: ${{ always() && !cancelled() && !(github.event.action == 'edited' && !github.event.changes.base) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout the result helper
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/ci_unit_result.py
            scripts/coverage_test_selection.py
            scripts/release_canary_sharding.py
            _project/scripts/preflight_targets.py
            tests/fixtures/medium_shard_durations.json
            scripts/build_fast_duration_baseline.py
            tests/__init__.py
            tests/duration_policy.py
            tests/fixtures/fast_tier_baseline/
          sparse-checkout-cone-mode: false

      - name: Download complete medium shard evidence
        if: needs.ci-paths.outputs.heavy-needed == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: t2-medium-*-${{ github.sha }}
          path: t2-evidence
          merge-multiple: false

      - name: Verify complete medium shard coverage
        if: needs.ci-paths.outputs.heavy-needed == 'true'
        run: >-
          python scripts/release_canary_sharding.py verify-medium --artifacts t2-evidence
          --checked-sha "${{ github.sha }}" --durations tests/fixtures/medium_shard_durations.json

      - name: Download shadow selection
        if: ${{ always() && needs.ci-paths.outputs.heavy-needed == 'true' && needs.ci-paths.outputs.unit-core == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: coverage-selection-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: coverage-selection

      - name: Report shadow selection misses
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          junit_args=()
          if [ -d t2-evidence ]; then
            junit_args+=(--junit t2-evidence)
          fi
          selection_args=()
          if [ -f coverage-selection/coverage-selection.json ]; then
            selection_args+=(--selection-in coverage-selection/coverage-selection.json)
          fi
          python scripts/coverage_test_selection.py misses \
            "${selection_args[@]}" \
            "${junit_args[@]}" \
            --expected-shards 4 \
            --json-out coverage-selection-misses.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload shadow selection misses
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: coverage-selection-misses-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: coverage-selection-misses.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Aggregate core result
        id: aggregate
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          python scripts/ci_unit_result.py \
            --unit core \
            --needs "$NEEDS_JSON" \
            --always ci-paths \
            --expect code-lint=${{ needs.ci-paths.outputs.code-tests-needed == 'true' }} \
            --expect code-test=${{ needs.ci-paths.outputs.code-tests-needed == 'true' }} \
            --expect medium-collect=${{ needs.ci-paths.outputs.heavy-needed == 'true' }} \
            --expect medium-test=${{ needs.ci-paths.outputs.medium-shards != '[]' }} \
            --expect correctness-gate=${{ needs.ci-paths.outputs.heavy-needed == 'true' }} \
            --expect tpch-binary-framing=${{ needs.ci-paths.outputs.heavy-needed == 'true' || needs.ci-paths.outputs.framing-needed == 'true' }} \
            --expect tuning-liveness=${{ needs.ci-paths.outputs.tuning-paths-changed == 'true' }} \
            --expect sql-execution-evidence=${{ needs.ci-paths.outputs.sql-evidence-paths-changed == 'true' }} \
            --expect package-smoke=${{ needs.ci-paths.outputs.packaging-needed == 'true' }} \
            --expect dependency-audit=${{ needs.ci-paths.outputs.packaging-needed == 'true' }} \
            --expect trunk-lane-plain=${{ needs.ci-paths.outputs.trunk-lane-plain-needed == 'true' }} \
            --expect trunk-lane-coverage=${{ needs.ci-paths.outputs.trunk-lane-coverage-needed == 'true' }} || {
            rc=$?
            if [ "$rc" -eq 3 ]; then
              echo "superseded=true" >> "$GITHUB_OUTPUT"
            fi
            exit "$rc"
          }

      - name: Cancel superseded run so the aggregate concludes cancelled
        if: always() && cancelled() && steps.aggregate.outputs.superseded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}" || true
          sleep 90

      - name: Download fast-tier junit for duration verification
        if: ${{ always() && github.event_name == 'pull_request' && needs.ci-paths.outputs.code-tests-needed == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: fast-junit-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: fast-junit

      - name: verify-fast-duration
        if: ${{ github.event_name == 'pull_request' && needs.ci-paths.outputs.code-tests-needed == 'true' }}
        timeout-minutes: 2
        run: |
          python -m scripts.build_fast_duration_baseline verify \
            --baseline tests/fixtures/fast_tier_baseline \
            --run-dir fast-junit \
            --summary "$GITHUB_STEP_SUMMARY" \
            --report-out fast-duration-verdict.json

      - name: Record fast-duration verdict not applicable
        if: ${{ always() && github.event_name == 'pull_request' && needs.ci-paths.outputs.code-tests-needed == 'false' }}
        continue-on-error: true
        run: |
          printf '%s\n' '{"verdict": "not-applicable", "reason": "no fast-tier tests ran for this head"}' > fast-duration-verdict.json

      - name: Upload fast-duration verdict
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: fast-duration-verdict-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: fast-duration-verdict.json
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  explorer:
    name: ${{ (github.event.action == 'edited' && !github.event.changes.base) && 'explorer (text edit)' || 'explorer' }}
    needs: [ci-paths, parity-check]
    if: ${{ always() && !cancelled() && !(github.event.action == 'edited' && !github.event.changes.base) }}
    runs-on: ubuntu-latest
