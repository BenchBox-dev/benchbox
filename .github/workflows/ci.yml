          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          python scripts/ci_unit_result.py \
            --unit docs \
            --needs "$NEEDS_JSON" \
            --always ci-paths \
            --expect example-validation=${{ needs.ci-paths.outputs.unit-docs == 'true' }} \
            --expect spellcheck=${{ needs.ci-paths.outputs.unit-docs == 'true' }} || {
            rc=$?
            if [ "$rc" -eq 3 ]; then
              echo "superseded=true" >> "$GITHUB_OUTPUT"
            fi
            exit "$rc"
          }

      - name: Cancel superseded run so the aggregate concludes cancelled
        if: always() && cancelled() && steps.aggregate.outputs.superseded == 'true'
        env:
