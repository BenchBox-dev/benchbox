    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout the result helper
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci_unit_result.py
          sparse-checkout-cone-mode: false

      - name: Aggregate explorer result
        id: aggregate
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          python scripts/ci_unit_result.py \
            --unit explorer \
            --needs "$NEEDS_JSON" \
            --always ci-paths \
            --expect parity-check=${{ needs.ci-paths.outputs.viz-needed == 'true' }} || {
            rc=$?
            if [ "$rc" -eq 3 ]; then
              echo "superseded=true" >> "$GITHUB_OUTPUT"
            fi
            exit "$rc"
          }

      - name: Cancel superseded run so the aggregate concludes cancelled
        if: always() && cancelled() && steps.aggregate.outputs.superseded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}" || true
          sleep 90

  results-data:
    name: ${{ (github.event.action == 'edited' && !github.event.changes.base) && 'results-data (text edit)' || 'results-data' }}
    needs: [ci-paths, results-data-check]
    if: ${{ always() && !cancelled() && !(github.event.action == 'edited' && !github.event.changes.base) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout the result helper
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci_unit_result.py
          sparse-checkout-cone-mode: false

      - name: Aggregate results-data result
        id: aggregate
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          python scripts/ci_unit_result.py \
            --unit results-data \
            --needs "$NEEDS_JSON" \
            --always ci-paths \
            --expect results-data-check=${{ needs.ci-paths.outputs.unit-results-data == 'true' }} || {
            rc=$?
            if [ "$rc" -eq 3 ]; then
              echo "superseded=true" >> "$GITHUB_OUTPUT"
            fi
            exit "$rc"
          }

      - name: Cancel superseded run so the aggregate concludes cancelled
        if: always() && cancelled() && steps.aggregate.outputs.superseded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}" || true
          sleep 90

  docs:
    name: ${{ (github.event.action == 'edited' && !github.event.changes.base) && 'docs (text edit)' || 'docs' }}
    needs: [ci-paths, example-validation, spellcheck]
    if: ${{ always() && !cancelled() && !(github.event.action == 'edited' && !github.event.changes.base) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout the result helper
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci_unit_result.py
          sparse-checkout-cone-mode: false

      - name: Aggregate docs result
        id: aggregate
