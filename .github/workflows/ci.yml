    name: explorer-tokens
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.explorer-paths-needed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
