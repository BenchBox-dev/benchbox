  audit-sha:
    name: audit-sha
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.audit-paths-changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref || 'develop' }}
        run: git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Validate changed audit develop SHA stamps
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMRT "origin/${{ github.base_ref || 'develop' }}...HEAD" \
            | grep -E '^_project/audits/.*\.md$' > /tmp/changed-audits.txt || true
          if [ ! -s /tmp/changed-audits.txt ]; then
            echo "No changed audit Markdown files to validate."
            exit 0
          fi
          ANCESTRY_REF="HEAD"
          while IFS= read -r audit_path; do
            make audit-sha-check FILE="$audit_path" AUDIT_SHA_TARGET_REF="origin/${{ github.base_ref || 'develop' }}" AUDIT_SHA_ANCESTRY_REF="$ANCESTRY_REF"
          done < /tmp/changed-audits.txt

  code-lint:
