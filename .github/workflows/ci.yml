  medium-collect:
    name: medium-collect
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.heavy-needed == 'true' && needs.ci-paths.outputs.unit-core == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Collect the complete medium tier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p t2-artifacts
          BENCHBOX_TEST_TIER=t2 uv run -- python -m pytest --collect-only -q -n 0 \
            -m "medium and not (slow or stress or resource_heavy or live_integration)" \
            > t2-artifacts/medium-collect.txt
          count=$(grep -Eo '^[0-9]+/[0-9]+ tests collected' t2-artifacts/medium-collect.txt | tail -1 | cut -d/ -f1)
          test -n "$count"
          uv run -- python scripts/release_canary_sharding.py collect \
            --input t2-artifacts/medium-collect.txt \
            --nodeids-output t2-artifacts/medium-nodeids.txt \
            --summary-output t2-artifacts/medium-collection.json \
            --expected-count "$count" --shard-count 4 \
            --workflow ci.yml --job medium-collect \
            --marker-expression "medium and not (slow or stress or resource_heavy or live_integration)" \
            --checked-ref "${{ github.ref }}" --checked-sha "${{ github.sha }}"

      - name: Upload medium collection evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: t2-medium-nodeids-${{ github.sha }}
          path: t2-artifacts/
          if-no-files-found: error
          retention-days: 30

  medium-test:
    name: medium-test (shard ${{ matrix.shard_index }})
    needs: [ci-paths, medium-collect]
    if: ${{ !cancelled() && needs.medium-collect.result == 'success' && needs.ci-paths.outputs.heavy-needed == 'true' && needs.ci-paths.outputs.unit-core == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Set up Node.js for TypeScript comment parsing
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '20'

      - name: Install locked TypeScript parser
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/comment-policy-node"
          mkdir -p "$package_dir"
          cp quality/comment-policy-package.json "$package_dir/package.json"
          cp quality/comment-policy-package-lock.json "$package_dir/package-lock.json"
          (
            cd "$package_dir"
            npm ci --ignore-scripts --no-audit --no-fund
          )
          echo "COMMENT_POLICY_TYPESCRIPT=$package_dir/node_modules/typescript" >> "$GITHUB_ENV"

      - name: Download medium collection evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: t2-medium-nodeids-${{ github.sha }}
          path: t2-artifacts

      - name: Partition the complete medium tier
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
        run: |
          uv run -- python scripts/release_canary_sharding.py shard \
            --input t2-artifacts/medium-nodeids.txt \
            --nodeids-output "t2-artifacts/shard-${SHARD_INDEX}-nodeids.txt" \
            --summary-output "t2-artifacts/shard-${SHARD_INDEX}-summary.json" \
            --shard-index "$SHARD_INDEX" --shard-count 4 \
            --workflow ci.yml --job medium-test \
            --marker-expression "medium and not (slow or stress or resource_heavy or live_integration)" \
            --collection-summary t2-artifacts/medium-collection.json --checked-sha "${{ github.sha }}"

      - name: Run medium speed tier
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
        run: |
          set -euo pipefail
          test -s "t2-artifacts/shard-${SHARD_INDEX}-nodeids.txt"
          mapfile -t node_ids < "t2-artifacts/shard-${SHARD_INDEX}-nodeids.txt"
          sample_resources() {
            while sleep 30; do
              echo "[resources $(date -u +%H:%M:%S)] $(free -m | awk '/Mem:/ {print "used_mb=" $3 " available_mb=" $7}') load=$(cut -d' ' -f1-3 /proc/loadavg)"
              ps -eo pid,rss,etimes,comm --sort=-rss | awk 'NR <= 4 {print "  " $0}'
            done
          }
          sample_resources &
          sampler=$!
          trap 'pkill -P "${sampler}" 2>/dev/null || true; kill "${sampler}" 2>/dev/null || true' EXIT
          BENCHBOX_TEST_TIER=t2 uv run -- python -m pytest \
            -m "medium and not (slow or stress or resource_heavy or live_integration)" \
            --tb=short --timeout=60 -n 5 --durations=25 \
            -p scripts.pytest_shard_evidence \
            --assigned-nodeids "t2-artifacts/shard-${SHARD_INDEX}-nodeids.txt" \
            --shard-evidence "t2-artifacts/shard-${SHARD_INDEX}-execution.json" \
            --checked-sha "${{ github.sha }}" "${node_ids[@]}"

      - name: Record kernel memory events for the medium shard
        if: always()
        shell: bash
        run: |
          free -m
          sudo dmesg -T 2>/dev/null | grep -iE 'out of memory|oom-kill|killed process' | tail -20 || true

      - name: Upload medium shard evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: t2-medium-shard-${{ matrix.shard_index }}-${{ github.sha }}
          path: t2-artifacts/
          if-no-files-found: error
          retention-days: 30

