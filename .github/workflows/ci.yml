          cache: "npm"
          cache-dependency-path: |
            results-explorer/package-lock.json
            website/package-lock.json

      - name: Install results-explorer dependencies
        run: npm ci
        working-directory: results-explorer

      - name: Build explorer data
        run: uv run -- python _project/scripts/explorer_publish.py build --data-dir results-data/ --output results-explorer/public/data/

      - name: Build results-explorer
        run: npm run build
        working-directory: results-explorer

      - name: Install website dependencies
        run: npm ci
        working-directory: website

      - name: Build website
        run: make site-build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: results-explorer

      - name: Capture public site from the Astro build
        run: make site-visual-capture SITE_VISUAL_DIR=${{ runner.temp }}/public-site-visual-astro SITE_VISUAL_SOURCE_SHA=${{ github.event.pull_request.head.sha || github.sha }}

      - name: Upload Astro visual captures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: public-site-visual-astro-${{ github.run_id }}
          path: ${{ runner.temp }}/public-site-visual-astro
          if-no-files-found: ignore
          retention-days: 3

  api-contract-check:
    name: api-contract-check
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.api-contract-changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Verify public API symbols against the released wheel
        run: make api-contract-check

  example-validation:
    needs: visual-inputs
    if: needs.visual-inputs.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Validate example file references
        run: uv run python scripts/validate_example_references.py

      - name: Check example file syntax
        run: uv run python scripts/check_example_syntax.py

      - name: Validate visualization screenshot sync
        run: uv run python scripts/validate_visualization_images.py

      - name: Check /prompts/ catalog is fresh
        run: uv run -- python scripts/generate_landing_quickstarts.py --check

      - name: Check for unsafe patch() string paths in tests
        run: uv run python scripts/check_patch_safety.py

  spellcheck:
    needs: visual-inputs
    if: needs.visual-inputs.outputs.changed == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Run codespell
        uses: codespell-project/actions-codespell@e3258cca84ce02b0bb36a3d41f2c18f719a0cc1a
        with:
          ignore_words_file: .codespell-ignore.txt
          skip: "*.pyc,_build,*.json,*.lock,*.svg,*.min.js,*.min.css,_binaries,*.tpl,*.dst,*.tbl,_sources,benchmark_runs,*.dat,*.pdf,_project,_blog,htmlcov,.venv"

  core:
    name: core
    needs: [ci-paths, code-lint, code-test, medium-collect, medium-test, correctness-gate, polars-2-compat, required-local-cases, plan-capture-gate, tpch-binary-framing, datafusion-integration, package-smoke, dependency-audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout the result helper
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/ci_unit_result.py
            scripts/release_canary_sharding.py
          sparse-checkout-cone-mode: false

      - name: Download complete medium shard evidence
        if: needs.ci-paths.outputs.heavy-needed == 'true' && needs.ci-paths.outputs.unit-core == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: t2-medium-*-${{ github.sha }}
          path: t2-evidence
          merge-multiple: false

      - name: Verify complete medium shard coverage
        if: needs.ci-paths.outputs.heavy-needed == 'true' && needs.ci-paths.outputs.unit-core == 'true'
        run: python scripts/release_canary_sharding.py verify-medium --artifacts t2-evidence --checked-sha "${{ github.sha }}"

      - name: Aggregate core result
        id: aggregate
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          python scripts/ci_unit_result.py \
            --unit core \
            --needs "$NEEDS_JSON" \
            --always ci-paths \
            --expect code-lint=${{ needs.ci-paths.outputs.code-tests-needed == 'true' }} \
            --expect code-test=${{ needs.ci-paths.outputs.code-tests-needed == 'true' }} \
            --expect medium-collect=${{ needs.ci-paths.outputs.heavy-needed == 'true' && needs.ci-paths.outputs.unit-core == 'true' }} \
            --expect medium-test=${{ needs.ci-paths.outputs.heavy-needed == 'true' && needs.ci-paths.outputs.unit-core == 'true' }} \
            --expect correctness-gate=${{ needs.ci-paths.outputs.heavy-needed == 'true' && needs.ci-paths.outputs.unit-core == 'true' }} \
            --expect polars-2-compat=${{ needs.ci-paths.outputs.heavy-needed == 'true' && needs.ci-paths.outputs.unit-core == 'true' }} \
            --expect required-local-cases=${{ needs.ci-paths.outputs.heavy-needed == 'true' && needs.ci-paths.outputs.unit-core == 'true' }} \
            --expect plan-capture-gate=${{ needs.ci-paths.outputs.heavy-needed == 'true' && needs.ci-paths.outputs.unit-core == 'true' }} \
            --expect tpch-binary-framing=${{ needs.ci-paths.outputs.heavy-needed == 'true' || needs.ci-paths.outputs.framing-needed == 'true' }} \
            --expect datafusion-integration=${{ needs.ci-paths.outputs.heavy-needed == 'true' && needs.ci-paths.outputs.unit-core == 'true' }} \
            --expect package-smoke=${{ needs.ci-paths.outputs.packaging-needed == 'true' }} \
            --expect dependency-audit=${{ needs.ci-paths.outputs.packaging-needed == 'true' }} || {
            rc=$?
            if [ "$rc" -eq 3 ]; then
              echo "superseded=true" >> "$GITHUB_OUTPUT"
            fi
            exit "$rc"
          }

      - name: Cancel superseded run so the aggregate concludes cancelled
        if: always() && cancelled() && steps.aggregate.outputs.superseded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}" || true
          sleep 90

  explorer:
    name: explorer
    needs: [ci-paths, explorer-tokens, explorer-vitest, parity-check, explorer-e2e, visual-inputs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
