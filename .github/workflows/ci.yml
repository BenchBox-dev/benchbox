name: CI
run-name: ${{ (github.event.action == 'edited' && !github.event.changes.base) && 'CI (text edit)' || 'CI' }}


env:
  BENCHBOX_TEST_LOCK_WAIT_SECONDS: "0"

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches-ignore: [release]

concurrency:
  group: ${{ (github.event.action == 'edited' && !github.event.changes.base) && format('ci-text-{0}', github.run_id) || format('ci-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  comment-policy:
    name: comment-policy
    if: ${{ !(github.event.action == 'edited' && !github.event.changes.base) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: false
          working-directory: ${{ runner.temp }}
          ignore-empty-workdir: true
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce comment and docstring policy
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${BASE_REF:?BASE_REF is required}"
          installed="$(git ls-tree -r --name-only "$BASE_REF" -- \
            scripts/check_comment_policy.py scripts/check_comment_cleanup_scope.py \
            scripts/comment_syntax.py \
            scripts/comment_payloads.py scripts/comment_execution.py scripts/comment_policy_entry.py \
            quality/comment-policy.json quality/comment-policy-requirements.txt)"
          if git cat-file -e "${BASE_REF}:scripts/run_comment_policy.py" 2>/dev/null; then
            git show "${BASE_REF}:scripts/run_comment_policy.py" > "$RUNNER_TEMP/comment-policy-runner.py"
          elif [ -z "$installed" ] && git merge-base --is-ancestor ed5c263c513ba65499f4918d3a7de607f280c65b "$BASE_REF"; then
            cp scripts/run_comment_policy.py "$RUNNER_TEMP/comment-policy-runner.py"
          else
            echo "Trusted comment-policy launcher is missing" >&2
            exit 1
          fi
          python -I "$RUNNER_TEMP/comment-policy-runner.py"
      - name: Enforce pinned notice drift
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          : "${BASE_REF:?BASE_REF is required}"
          if git diff --quiet "$BASE_REF" HEAD -- LICENSE COPYRIGHT.md quality/comment-cleanup-scope.json; then
            echo "No pinned notice inputs changed; drift check not needed."
            exit 0
          fi
          if ! git cat-file -e "${BASE_REF}:scripts/check_comment_cleanup_scope.py" 2>/dev/null; then
            echo "Trusted pinned-notice checker is missing" >&2
            exit 1
          fi
          git show "${BASE_REF}:scripts/check_comment_cleanup_scope.py" > "$RUNNER_TEMP/trusted_check_scope.py"
          python -I "$RUNNER_TEMP/trusted_check_scope.py" --check-drift --base "$BASE_REF"

  ci-paths:
    name: ci-paths
    if: ${{ !(github.event.action == 'edited' && !github.event.changes.base) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      safe-content-only: ${{ steps.classify.outputs.safe-content-only }}
      needs-code-ci: ${{ steps.classify.outputs.needs-code-ci }}
      content-guard-needed: ${{ steps.classify.outputs.content-guard-needed }}
      skill-integrity-needed: ${{ steps.classify.outputs.skill-integrity-needed }}
      skill-integrity-only: ${{ steps.classify.outputs.skill-integrity-only }}
      audit-paths-changed: ${{ steps.path-flags.outputs.audit-paths-changed }}
      submission-validator-changed: ${{ steps.path-flags.outputs.submission-validator-changed }}
      api-contract-changed: ${{ steps.path-flags.outputs.api-contract-changed }}
      tuning-paths-changed: ${{ steps.path-flags.outputs.tuning-paths-changed }}
      sql-evidence-paths-changed: ${{ steps.path-flags.outputs.sql-evidence-paths-changed }}
      trunk-lane-plain-needed: ${{ steps.path-flags.outputs.trunk-lane-plain-needed }}
      trunk-lane-coverage-needed: ${{ steps.path-flags.outputs.trunk-lane-coverage-needed }}
      estimated-runner-minutes-saved: ${{ steps.classify.outputs.estimated-runner-minutes-saved }}
      packaging-needed: ${{ steps.classify.outputs.packaging-needed }}
      framing-needed: ${{ steps.classify.outputs.framing-needed }}
      viz-needed: ${{ steps.classify.outputs.viz-needed }}
      heavy-needed: ${{ steps.heavy.outputs.heavy-needed }}
      unit-core: ${{ steps.units.outputs.unit-core }}
      unit-results-data: ${{ steps.units.outputs.unit-results-data }}
      unit-docs: ${{ steps.units.outputs.unit-docs }}
      unit-tooling: ${{ steps.units.outputs.unit-tooling }}
      code-tests-needed: ${{ steps.units.outputs.code-tests-needed }}
      medium-shards: ${{ steps.medium-shards.outputs.medium-shards }}
    steps:
      - name: Check base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          case "$BASE_REF" in
            develop|release|published-results)
              echo "Base branch '$BASE_REF' is an integration branch; the normal CI lanes apply."
              ;;
            *)
              if [ "$IS_DRAFT" = "true" ]; then
                echo "Draft PR stacked on '$BASE_REF'; it cannot be armed until it is retargeted at develop."
              else
                echo "::error::Ready PR base branch is '$BASE_REF', not develop, release or published-results."
                echo "Only a draft PR may target a parent branch. After the parent merges, retarget this PR at develop and rebase it onto the squash commit."
                exit 1
              fi
              ;;
          esac

      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Enforce untracked handoff boundary
        run: sh scripts/check_untracked_handoffs.sh

      - name: Validate TODO JSON/Git state contract
        run: python _project/scripts/todo_state_contract_check.py

      - name: Select release candidate
        id: release
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid event base SHA" >&2; exit 1; }
          git fetch --no-tags origin "$EVENT_BASE_SHA"
          python -I -S scripts/release_flow.py select --base-sha "$EVENT_BASE_SHA" --github-output "$GITHUB_OUTPUT"

      - name: Install uv for release checks
        if: steps.release.outputs.release-check-needed == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Check release content
        if: steps.release.outputs.release-check-needed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release-version }}
          UPSTREAM_FRESHNESS_REQUIRED: ${{ steps.release.outputs.upstream-freshness-required }}
          RELEASE_IDENTITY_CHANGED: ${{ steps.release.outputs.release-identity-changed }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          skip=
          if [ "$UPSTREAM_FRESHNESS_REQUIRED" != "true" ]; then skip=1; fi
          pre_tag=
          if [ "$RELEASE_IDENTITY_CHANGED" = "true" ]; then pre_tag=1; fi
          make release-check VERSION="$RELEASE_VERSION" BASE_REF="$EVENT_BASE_SHA" SKIP_UPSTREAM_FRESHNESS="$skip" RELEASE_PRE_TAG="$pre_tag"

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref || 'develop' }}:refs/remotes/origin/${{ github.base_ref || 'develop' }}"

      - name: Classify changed paths
        id: classify
        run: |
          python scripts/path_filter_decision.py \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --rules-base-ref "${{ github.event.pull_request.base.sha }}" \
            --json-out ci-path-decision.json \
            --lists-dir .ci-paths \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Check changelog fragments
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          trusted="$RUNNER_TEMP/trusted-changelog"
          mkdir -p "$trusted/scripts" "$trusted/_project/scripts" "$trusted/.github"
          git show "$EVENT_BASE_SHA:scripts/changelog_fragments.py" > "$trusted/scripts/changelog_fragments.py"
          git show "$EVENT_BASE_SHA:_project/scripts/soundness_paths.py" > "$trusted/_project/scripts/soundness_paths.py"
          git show "$EVENT_BASE_SHA:.github/soundness-paths.txt" > "$trusted/.github/soundness-paths.txt"
          git show "$EVENT_BASE_SHA:.github/changelog-paths.txt" > "$RUNNER_TEMP/changelog-paths.txt"
          git diff --name-only --no-renames --diff-filter=ACDMRT "$EVENT_BASE_SHA...HEAD" > "$RUNNER_TEMP/changed.txt"
          git diff --name-only --diff-filter=A "$EVENT_BASE_SHA...HEAD" > "$RUNNER_TEMP/added.txt"
          python -I "$trusted/scripts/changelog_fragments.py" --root "$PWD" check \
            --changelog "$PWD/CHANGELOG.md" \
            --require-empty-unreleased \
            --title "$PR_TITLE" \
            --changed-files-from "$RUNNER_TEMP/changed.txt" \
            --added-files-from "$RUNNER_TEMP/added.txt" \
            --manifest "$RUNNER_TEMP/changelog-paths.txt" \
            --release-base-sha "$EVENT_BASE_SHA"

      - name: Flag changed paths read by later jobs
        id: path-flags
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test -f .ci-paths/changed.txt
          audit=false
          validator=false
          api=false
          tuning=false
          sql_evidence=false
          if grep -qE '^_project/audits/' .ci-paths/changed.txt; then audit=true; fi
          if grep -qxE '\.github/workflows/validate-submission\.yml|scripts/check_submission_validator_sync\.py' .ci-paths/changed.txt; then validator=true; fi
          if grep -qxE '_project/design/api-public-symbols\.json|scripts/check_api_contract_symbols\.py|scripts/api_contract_probe\.py' .ci-paths/changed.txt; then api=true; fi
          echo "audit-paths-changed=$audit" >> "$GITHUB_OUTPUT"
          echo "submission-validator-changed=$validator" >> "$GITHUB_OUTPUT"
          echo "api-contract-changed=$api" >> "$GITHUB_OUTPUT"
          if grep -qE '^(benchbox/core/tuning/|benchbox/cli/tuning|benchbox/platforms/base/(adapter|ddl_helpers|sorted_ingestion|tuning|tuning_config|tuning_trust)\.py|benchbox/platforms/(duckdb|sqlite|datafusion|polars)|benchbox/platforms/clickhouse/|benchbox/platforms/dataframe/polars|tests/integration/tuning/|tests/fixtures/tuning/|examples/tunings/)' .ci-paths/changed.txt; then tuning=true; fi
          echo "tuning-paths-changed=$tuning" >> "$GITHUB_OUTPUT"
          if grep -qE '^(benchbox/_vendor/|benchbox/utils/dialect_utils\.py|benchbox/sql_compat/|benchbox/core/(tpch|tpcds|tpchavoc|tpcds_obt)/|benchbox/platforms/(sqlite|duckdb|datafusion|postgresql)|scripts/sql_execution_gate/|tests/unit/scripts/test_sql_execution_gate\.py)' .ci-paths/changed.txt; then sql_evidence=true; fi
          trunk_plain=false
          trunk_coverage=false
          git diff --name-only --no-renames --diff-filter=ACDMRT "$EVENT_BASE_SHA...HEAD" > .ci-paths/trunk-lane-changed.txt
          if grep -qxE '\.github/workflows/trunk\.yml|scripts/release_canary_sharding\.py|scripts/pytest_shard_evidence\.py|tests/fixtures/medium_shard_durations\.json' .ci-paths/trunk-lane-changed.txt; then trunk_plain=true; fi
          if grep -qxE '\.github/workflows/trunk-coverage\.yml|scripts/release_canary_sharding\.py|scripts/pytest_shard_evidence\.py|scripts/pytest_coverage_timeout\.py|scripts/coverage_map\.ini|tests/fixtures/medium_shard_durations\.json' .ci-paths/trunk-lane-changed.txt; then trunk_coverage=true; fi
          echo "trunk-lane-plain-needed=$trunk_plain" >> "$GITHUB_OUTPUT"
          echo "trunk-lane-coverage-needed=$trunk_coverage" >> "$GITHUB_OUTPUT"
          echo "sql-evidence-paths-changed=$sql_evidence" >> "$GITHUB_OUTPUT"

      - name: Classify merge units
        id: units
        run: |
          python scripts/ci_units.py \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --json-out ci-unit-decision.json \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload path decision
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ci-path-decision
          path: |
            ci-path-decision.json
            ci-unit-decision.json
          retention-days: 30

      - name: Fetch coverage test map
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin develop
          python scripts/coverage_test_selection.py fetch-map \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --dest-dir .coverage-map \
            --json-out coverage-fetch.json

      - name: Select tests by coverage impact
        id: coverage-select
        run: |
          set -euo pipefail
          map_path="$(python -c "import json; print(json.load(open('coverage-fetch.json')).get('path') or '')")"
          map_args=()
          if [ -n "$map_path" ]; then
            map_args=(--map "$map_path")
          fi
          python scripts/coverage_test_selection.py select \
            "${map_args[@]}" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --decision-in ci-path-decision.json \
            --nodeids-out coverage-nodeids.txt \
            --json-out coverage-selection.json \
            --summary "$GITHUB_STEP_SUMMARY"
          test -s coverage-selection.json

      - name: Upload coverage selection
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: coverage-selection-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            coverage-selection.json
            coverage-nodeids.txt
          if-no-files-found: error
          retention-days: 14

      - name: Decide heavy-tier need
        id: heavy
        run: |
          set -euo pipefail
          python scripts/heavy_tier_needed.py \
            --decision-in ci-path-decision.json \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --selection-in coverage-selection.json \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Decide medium shards
        id: medium-shards
        run: |
          set -euo pipefail
          selected=$(grep -c . coverage-nodeids.txt || true)
          if [ "${{ steps.heavy.outputs.heavy-needed }}" = "true" ]; then
            shards='[0,1,2,3]'
          elif [ "${{ steps.units.outputs.code-tests-needed }}" != "true" ]; then
            shards='[]'
          elif [ "$selected" -gt 0 ]; then
            shards='[0,1,2,3]'
          else
            shards='[0]'
          fi
          echo "medium-shards=$shards" >> "$GITHUB_OUTPUT"
          echo "Medium shards: $shards (coverage-selected node IDs: $selected)" >> "$GITHUB_STEP_SUMMARY"

  tpch-binary-framing:
    name: TPC-H binary framing (${{ matrix.os }})
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.heavy-needed == 'true' || needs.ci-paths.outputs.framing-needed == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Verify bundled dbgen binaries emit clean framing
        run: uv run -- python -m pytest tests/unit/core/tpch/test_tpch_dbgen_framing_binaries.py -m 'unit or slow' -v

  content-guard:
    name: content-guard
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.content-guard-needed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref || 'develop' }}:refs/remotes/origin/${{ github.base_ref || 'develop' }}"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Recreate path lists
        run: |
          python scripts/path_filter_decision.py \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --json-out ci-path-decision.json \
            --lists-dir .ci-paths

      - name: Validate YAML hygiene
        shell: bash
        run: |
          if [ ! -s .ci-paths/yaml.txt ]; then
            echo "No YAML content paths changed."
            exit 0
          fi
          mapfile -t yaml_paths < .ci-paths/yaml.txt
          existing_yaml_paths=()
          for yaml_path in "${yaml_paths[@]}"; do
            if [ -e "$yaml_path" ]; then
              existing_yaml_paths+=("$yaml_path")
            else
              echo "Skipping deleted YAML path: $yaml_path"
            fi
          done
          if [ ${#existing_yaml_paths[@]} -eq 0 ]; then
            echo "No existing YAML content paths to lint."
            exit 0
          fi
          uv run -- pre-commit run check-yaml --files "${existing_yaml_paths[@]}"

      - name: Validate artifact hygiene
        run: uv run -- python _project/scripts/artifact_hygiene_check.py --all-tracked

      - name: Validate markdown hygiene
        shell: bash
        run: |
          if [ ! -s .ci-paths/markdown.txt ]; then
            echo "No markdown content paths changed."
            exit 0
          fi
          mapfile -t markdown_paths < .ci-paths/markdown.txt
          existing_markdown_paths=()
          for markdown_path in "${markdown_paths[@]}"; do
            if [ -e "$markdown_path" ]; then
              existing_markdown_paths+=("$markdown_path")
            else
              echo "Skipping deleted markdown path: $markdown_path"
            fi
          done
          if [ ${#existing_markdown_paths[@]} -eq 0 ]; then
            echo "No existing markdown content paths to lint."
            exit 0
          fi
          uv run -- pre-commit run markdownlint --files "${existing_markdown_paths[@]}"

      - name: Validate public contract drift guard
        shell: bash
        run: |
          if [ ! -s .ci-paths/docs.txt ] && [ ! -s .ci-paths/markdown.txt ]; then
            echo "No docs or markdown paths changed."
            exit 0
          fi
          uv run -- python - <<'PY'
          from pathlib import Path

          contract = Path("docs/reference/public-contracts.md").read_text(encoding="utf-8")
          readme = Path("README.md").read_text(encoding="utf-8")

          forbidden_readme_count_claims = [
              "Twenty-Two Benchmarks",
              "SQL Platforms (",
              "DataFrame Platforms (",
          ]
          offenders = [phrase for phrase in forbidden_readme_count_claims if phrase in readme]
          if offenders:
              raise SystemExit(
                  "README.md has exact hand-maintained count claims; use registry-derived checks "
                  f"or mark them non-authoritative: {offenders}"
              )

          required_surfaces = [
              "CLI commands and documented options",
              "Top-level Python wrapper facades",
              "`benchbox.base.BaseBenchmark`",
              "`BaseBenchmark.run_with_platform`",
              "Adapter subclassing hooks and base mixins",
              "Platform registry metadata",
              "MCP tools",
              "Result JSON bundles",
              "Explorer read model and generated browser inputs",
              "Public submission validator behavior",
              "SQL compatibility rule catalog",
              "Generated compatibility docs",
              "`benchbox.experimental` namespace",
              "`_project` scripts, audits, and analysis artifacts",
              "TODO, DONE, and ADR/future-state docs",
          ]
          missing_surfaces = [surface for surface in required_surfaces if surface not in contract]
          if missing_surfaces:
              raise SystemExit(f"public-contracts.md missing required surfaces: {missing_surfaces}")

          required_statuses = [
              "`stable`",
              "`beta`",
              "`experimental`",
              "`repo_only`",
              "`deprecated`",
              "`document_only`",
          ]
          missing_statuses = [status for status in required_statuses if status not in contract]
          if missing_statuses:
              raise SystemExit(f"public-contracts.md missing support_status values: {missing_statuses}")

          from benchbox.core.benchmark_registry import list_benchmark_ids, list_loader_benchmark_ids
          from benchbox.core.platform_registry import PlatformRegistry
          from benchbox.core.results.schema import SCHEMA_VERSION

          platforms = PlatformRegistry.get_all_platform_metadata()
          sql_capable = sum(1 for item in platforms.values() if item.get("capabilities", {}).get("supports_sql"))
          dataframe_capable = sum(
              1 for item in platforms.values() if item.get("capabilities", {}).get("supports_dataframe")
          )
          dual_mode = sum(
              1
              for item in platforms.values()
              if item.get("capabilities", {}).get("supports_sql")
              and item.get("capabilities", {}).get("supports_dataframe")
          )

          source_fragments = [
              f"{len(list_benchmark_ids())} benchmark metadata entries",
              f"{len(list_loader_benchmark_ids())} loader-resolved IDs",
              f"{len(platforms)} platform metadata entries",
              f"{sql_capable} SQL-capable",
              f"{dataframe_capable} DataFrame-capable",
              f"{dual_mode} dual-mode",
              f"Current result schema version: `{SCHEMA_VERSION}`",
          ]
          missing_fragments = [fragment for fragment in source_fragments if fragment not in contract]
          if missing_fragments:
              raise SystemExit(f"public-contracts.md source-derived claims are stale: {missing_fragments}")
          PY

  skill-integrity:
    name: skill-integrity
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.skill-integrity-needed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate skill config, receipt, and tool pin
        run: python3 scripts/skill_sync_ci_policy.py validate --manifest skill-sync.conf

      - name: Clone skill sources to the configured checkout paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/skill-home/Developer"
          git clone --quiet https://github.com/joeharris76/skill-sync-skills.git \
            "$RUNNER_TEMP/skill-home/Developer/skill-sync-skills"
          git clone --quiet https://github.com/joeharris76/todo-db.git \
            "$RUNNER_TEMP/skill-home/Developer/todo-db"
          git clone --quiet https://github.com/joeharris76/skill-sync.git \
            "$RUNNER_TEMP/skill-home/Developer/skill-sync"

      - name: Preview, apply, verify, and re-check the skill mirrors
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/skill-home"
          echo "--- preview (read-only) ---"
          sh tools/skill-sync preview
          echo "--- apply ---"
          sh tools/skill-sync apply
          echo "--- the committed snapshot must be untouched by apply ---"
          test -z "$(git status --porcelain)"
          echo "--- verify the payload offline against its manifest ---"
          sh tools/skill-sync verify
