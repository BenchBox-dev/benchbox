  tooling:
    name: ${{ (github.event.action == 'edited' && !github.event.changes.base) && 'tooling (text edit)' || 'tooling' }}
    needs: [ci-paths, content-guard, skill-integrity, audit-sha, comment-policy]
    if: ${{ always() && !cancelled() && !(github.event.action == 'edited' && !github.event.changes.base) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout the result helper
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci_unit_result.py
          sparse-checkout-cone-mode: false

      - name: Aggregate tooling result
        id: aggregate
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          python scripts/ci_unit_result.py \
            --unit tooling \
            --needs "$NEEDS_JSON" \
            --always ci-paths \
            --always comment-policy \
            --expect content-guard=${{ needs.ci-paths.outputs.content-guard-needed == 'true' }} \
            --expect skill-integrity=${{ needs.ci-paths.outputs.skill-integrity-needed == 'true' }} \
            --expect audit-sha=${{ needs.ci-paths.outputs.audit-paths-changed == 'true' }} || {
            rc=$?
            if [ "$rc" -eq 3 ]; then
              echo "superseded=true" >> "$GITHUB_OUTPUT"
            fi
            exit "$rc"
          }

      - name: Cancel superseded run so the aggregate concludes cancelled
        if: always() && cancelled() && steps.aggregate.outputs.superseded == 'true'
        env:
