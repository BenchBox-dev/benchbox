name: CI


env:
  BENCHBOX_TEST_LOCK_WAIT_SECONDS: "0"

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
    branches-ignore: [release]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  comment-policy:
    name: comment-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: false
          working-directory: ${{ runner.temp }}
          ignore-empty-workdir: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '20'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce comment and docstring policy
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          : "${BASE_REF:?BASE_REF is required}"
          installed="$(git ls-tree -r --name-only "$BASE_REF" -- \
            scripts/check_comment_policy.py scripts/check_comment_cleanup_scope.py \
            scripts/comment_syntax.py scripts/comment_syntax_js.cjs \
            scripts/comment_payloads.py scripts/comment_execution.py scripts/comment_policy_entry.py \
            quality/comment-policy.json quality/comment-policy-requirements.txt \
            quality/comment-policy-package.json quality/comment-policy-package-lock.json)"
          if git cat-file -e "${BASE_REF}:scripts/run_comment_policy.py" 2>/dev/null; then
            git show "${BASE_REF}:scripts/run_comment_policy.py" > "$RUNNER_TEMP/comment-policy-runner.py"
          elif [ -z "$installed" ] && git merge-base --is-ancestor ed5c263c513ba65499f4918d3a7de607f280c65b "$BASE_REF"; then
            cp scripts/run_comment_policy.py "$RUNNER_TEMP/comment-policy-runner.py"
          else
            echo "Trusted comment-policy launcher is missing" >&2
            exit 1
          fi
          python -I "$RUNNER_TEMP/comment-policy-runner.py" --native-tests

  base-guard:
    name: PR base branch is an integration branch
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          case "$BASE_REF" in
            develop|release|published-results)
              echo "Base branch '$BASE_REF' is an integration branch; the normal CI lanes apply."
              ;;
            *)
              if [ "$IS_DRAFT" = "true" ]; then
                echo "Draft PR stacked on '$BASE_REF'; it cannot be armed until it is retargeted at develop."
              else
                echo "::error::Ready PR base branch is '$BASE_REF', not develop, release or published-results."
                echo "Only a draft PR may target a parent branch. After the parent merges, retarget this PR at develop and rebase it onto the squash commit."
                exit 1
              fi
              ;;
          esac

  ci-paths:
    name: ci-paths
    runs-on: ubuntu-latest
    outputs:
      safe-content-only: ${{ steps.classify.outputs.safe-content-only }}
      needs-code-ci: ${{ steps.classify.outputs.needs-code-ci }}
      content-guard-needed: ${{ steps.classify.outputs.content-guard-needed }}
      skill-integrity-needed: ${{ steps.classify.outputs.skill-integrity-needed }}
      skill-integrity-only: ${{ steps.classify.outputs.skill-integrity-only }}
      audit-paths-changed: ${{ steps.path-flags.outputs.audit-paths-changed }}
      submission-validator-changed: ${{ steps.path-flags.outputs.submission-validator-changed }}
      api-contract-changed: ${{ steps.path-flags.outputs.api-contract-changed }}
      estimated-runner-minutes-saved: ${{ steps.classify.outputs.estimated-runner-minutes-saved }}
      packaging-needed: ${{ steps.classify.outputs.packaging-needed }}
      framing-needed: ${{ steps.classify.outputs.framing-needed }}
      heavy-needed: ${{ steps.heavy.outputs.heavy-needed }}
      viz-needed: ${{ steps.classify.outputs.viz-needed }}
      explorer-vitest-needed: ${{ steps.classify.outputs.explorer-vitest-needed }}
      explorer-paths-needed: ${{ steps.classify.outputs.explorer-paths-needed }}
      explorer-tokens-needed: ${{ steps.classify.outputs.explorer-tokens-needed }}
      site-theme-needed: ${{ steps.classify.outputs.site-theme-needed }}
      site-needed: ${{ steps.classify.outputs.site-needed }}
      site-parity-needed: ${{ steps.classify.outputs.site-parity-needed }}
      unit-core: ${{ steps.units.outputs.unit-core }}
      unit-explorer: ${{ steps.units.outputs.unit-explorer }}
      unit-results-data: ${{ steps.units.outputs.unit-results-data }}
      unit-docs: ${{ steps.units.outputs.unit-docs }}
      unit-landing: ${{ steps.units.outputs.unit-landing }}
      unit-tooling: ${{ steps.units.outputs.unit-tooling }}
      code-tests-needed: ${{ steps.units.outputs.code-tests-needed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Validate TODO JSON/Git state contract
        run: python _project/scripts/todo_state_contract_check.py

      - name: Select release candidate
        id: release
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid event base SHA" >&2; exit 1; }
          git fetch --no-tags origin "$EVENT_BASE_SHA"
          python -I -S scripts/release_flow.py select --base-sha "$EVENT_BASE_SHA" --github-output "$GITHUB_OUTPUT"

      - name: Install uv for release checks
        if: steps.release.outputs.release-check-needed == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Check release content
        if: steps.release.outputs.release-check-needed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release-version }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make release-check VERSION="$RELEASE_VERSION" BASE_REF="$EVENT_BASE_SHA"

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref || 'develop' }}:refs/remotes/origin/${{ github.base_ref || 'develop' }}"

      - name: Classify changed paths
        id: classify
        run: |
          python scripts/path_filter_decision.py \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --json-out ci-path-decision.json \
            --lists-dir .ci-paths \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Flag changed paths read by later jobs
        id: path-flags
        run: |
          set -euo pipefail
          test -f .ci-paths/changed.txt
          audit=false
          validator=false
          api=false
          if grep -qE '^(_project/audits/|results-explorer/e2e/captures/)' .ci-paths/changed.txt; then audit=true; fi
          if grep -qxE '\.github/workflows/validate-submission\.yml|scripts/check_submission_validator_sync\.py' .ci-paths/changed.txt; then validator=true; fi
          if grep -qxE '_project/design/site-inventory/api-public-symbols\.json|scripts/check_api_contract_symbols\.py|scripts/api_contract_probe\.py' .ci-paths/changed.txt; then api=true; fi
          echo "audit-paths-changed=$audit" >> "$GITHUB_OUTPUT"
          echo "submission-validator-changed=$validator" >> "$GITHUB_OUTPUT"
          echo "api-contract-changed=$api" >> "$GITHUB_OUTPUT"

      - name: Classify merge units
        id: units
        run: |
          python scripts/ci_units.py \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --json-out ci-unit-decision.json \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload path decision
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ci-path-decision
          path: |
            ci-path-decision.json
            ci-unit-decision.json
          retention-days: 30

      - name: Decide heavy-tier need
        id: heavy
        run: |
          set -euo pipefail
          python scripts/heavy_tier_needed.py \
            --decision-in ci-path-decision.json \
            --event "${{ github.event_name }}" \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  tpch-binary-framing:
    name: TPC-H binary framing (${{ matrix.os }})
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.heavy-needed == 'true' || needs.ci-paths.outputs.framing-needed == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Verify bundled dbgen binaries emit clean framing
        run: uv run -- python -m pytest tests/unit/core/tpch/test_tpch_dbgen_framing_binaries.py -m 'unit or slow' -v

  content-guard:
    name: content-guard
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.content-guard-needed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref || 'develop' }}:refs/remotes/origin/${{ github.base_ref || 'develop' }}"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Recreate path lists
        run: |
          python scripts/path_filter_decision.py \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --json-out ci-path-decision.json \
            --lists-dir .ci-paths

      - name: Validate YAML hygiene
        shell: bash
        run: |
          if [ ! -s .ci-paths/yaml.txt ]; then
            echo "No YAML content paths changed."
            exit 0
          fi
          mapfile -t yaml_paths < .ci-paths/yaml.txt
          existing_yaml_paths=()
          for yaml_path in "${yaml_paths[@]}"; do
            if [ -e "$yaml_path" ]; then
              existing_yaml_paths+=("$yaml_path")
            else
              echo "Skipping deleted YAML path: $yaml_path"
            fi
          done
          if [ ${#existing_yaml_paths[@]} -eq 0 ]; then
            echo "No existing YAML content paths to lint."
            exit 0
          fi
          uv run -- pre-commit run check-yaml --files "${existing_yaml_paths[@]}"

      - name: Validate artifact hygiene
        run: uv run -- python _project/scripts/artifact_hygiene_check.py --all-tracked

      - name: Validate markdown hygiene
        shell: bash
        run: |
          if [ ! -s .ci-paths/markdown.txt ]; then
            echo "No markdown content paths changed."
            exit 0
          fi
          mapfile -t markdown_paths < .ci-paths/markdown.txt
          existing_markdown_paths=()
          for markdown_path in "${markdown_paths[@]}"; do
            if [ -e "$markdown_path" ]; then
              existing_markdown_paths+=("$markdown_path")
            else
              echo "Skipping deleted markdown path: $markdown_path"
            fi
          done
          if [ ${#existing_markdown_paths[@]} -eq 0 ]; then
            echo "No existing markdown content paths to lint."
            exit 0
          fi
          uv run -- pre-commit run markdownlint --files "${existing_markdown_paths[@]}"

      - name: Validate docs references
        shell: bash
        run: |
          if [ ! -s .ci-paths/docs.txt ]; then
            echo "No docs paths changed."
            exit 0
          fi
          make docs-validate

      - name: Validate public contract drift guard
        shell: bash
        run: |
          if [ ! -s .ci-paths/docs.txt ] && [ ! -s .ci-paths/markdown.txt ]; then
            echo "No docs or markdown paths changed."
            exit 0
          fi
          uv run -- python - <<'PY'
          from pathlib import Path

          contract = Path("docs/reference/public-contracts.md").read_text(encoding="utf-8")
          readme = Path("README.md").read_text(encoding="utf-8")

          forbidden_readme_count_claims = [
              "Twenty-Two Benchmarks",
              "SQL Platforms (",
              "DataFrame Platforms (",
          ]
          offenders = [phrase for phrase in forbidden_readme_count_claims if phrase in readme]
          if offenders:
              raise SystemExit(
                  "README.md has exact hand-maintained count claims; use registry-derived checks "
                  f"or mark them non-authoritative: {offenders}"
              )

          required_surfaces = [
              "CLI commands and documented options",
              "Top-level Python wrapper facades",
              "`benchbox.base.BaseBenchmark`",
              "`BaseBenchmark.run_with_platform`",
              "Adapter subclassing hooks and base mixins",
              "Platform registry metadata",
              "MCP tools",
              "Result JSON bundles",
              "Explorer read model and generated browser inputs",
              "Public submission validator behavior",
              "SQL compatibility rule catalog",
              "Generated compatibility docs",
              "`benchbox.experimental` namespace",
              "`_project` scripts, audits, and analysis artifacts",
              "TODO, DONE, and ADR/future-state docs",
          ]
          missing_surfaces = [surface for surface in required_surfaces if surface not in contract]
          if missing_surfaces:
              raise SystemExit(f"public-contracts.md missing required surfaces: {missing_surfaces}")

          required_statuses = [
              "`stable`",
              "`beta`",
              "`experimental`",
              "`repo_only`",
              "`deprecated`",
              "`document_only`",
          ]
          missing_statuses = [status for status in required_statuses if status not in contract]
          if missing_statuses:
              raise SystemExit(f"public-contracts.md missing support_status values: {missing_statuses}")

          from benchbox.core.benchmark_registry import list_benchmark_ids, list_loader_benchmark_ids
          from benchbox.core.platform_registry import PlatformRegistry
          from benchbox.core.results.schema import SCHEMA_VERSION

          platforms = PlatformRegistry.get_all_platform_metadata()
          sql_capable = sum(1 for item in platforms.values() if item.get("capabilities", {}).get("supports_sql"))
          dataframe_capable = sum(
              1 for item in platforms.values() if item.get("capabilities", {}).get("supports_dataframe")
          )
          dual_mode = sum(
              1
              for item in platforms.values()
              if item.get("capabilities", {}).get("supports_sql")
              and item.get("capabilities", {}).get("supports_dataframe")
          )

          source_fragments = [
              f"{len(list_benchmark_ids())} benchmark metadata entries",
              f"{len(list_loader_benchmark_ids())} loader-resolved IDs",
              f"{len(platforms)} platform metadata entries",
              f"{sql_capable} SQL-capable",
              f"{dataframe_capable} DataFrame-capable",
              f"{dual_mode} dual-mode",
              f"Current result schema version: `{SCHEMA_VERSION}`",
          ]
          missing_fragments = [fragment for fragment in source_fragments if fragment not in contract]
          if missing_fragments:
              raise SystemExit(f"public-contracts.md source-derived claims are stale: {missing_fragments}")
          PY

  skill-integrity:
    name: skill-integrity
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.skill-integrity-needed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate skill config, receipt, and tool pin
        run: python3 scripts/skill_sync_ci_policy.py validate --manifest skill-sync.conf

      - name: Clone skill sources to the configured checkout paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/skill-home/Developer"
          git clone --quiet https://github.com/joeharris76/skill-sync-skills.git \
            "$RUNNER_TEMP/skill-home/Developer/skill-sync-skills"
          git clone --quiet https://github.com/joeharris76/todo-db.git \
            "$RUNNER_TEMP/skill-home/Developer/todo-db"
          git clone --quiet https://github.com/joeharris76/skill-sync.git \
            "$RUNNER_TEMP/skill-home/Developer/skill-sync"

      - name: Preview, apply, verify, and re-check the skill mirrors
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/skill-home"
          echo "--- preview (read-only) ---"
          sh tools/skill-sync preview
          echo "--- apply ---"
          sh tools/skill-sync apply
          echo "--- the committed snapshot must be untouched by apply ---"
          test -z "$(git status --porcelain)"
          echo "--- verify the payload offline against its manifest ---"
          sh tools/skill-sync verify
          echo "--- second check must be clean ---"
          sh tools/skill-sync check

      - name: Enforce untracked mirror boundary
        run: sh scripts/check_untracked_skill_mirrors.sh

      - name: Audit instruction authority and PR commit identity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 _project/scripts/agent_instruction_audit.py
          python3 _project/scripts/agent_instruction_audit.py --check-commit-range "$BASE_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install focused test dependencies
        run: uv sync --group dev

      - name: Run skill policy and instruction audit contracts
        run: |
          uv run -- python -m pytest \
            tests/unit/scripts/test_skill_sync_ci_policy.py \
            tests/unit/scripts/test_path_filter_decision.py \
            tests/unit/scripts/test_ci_lint_environment_boundary.py \
            tests/unit/scripts/test_agent_instruction_audit.py \
            -q

      - name: Validate tracked artifact hygiene
        run: uv run -- python _project/scripts/artifact_hygiene_check.py --all-tracked

  audit-sha:
    name: audit-sha
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.audit-paths-changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref || 'develop' }}
        run: git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Validate changed audit develop SHA stamps
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMRT "origin/${{ github.base_ref || 'develop' }}...HEAD" \
            | grep -E '^_project/audits/.*\.md$' > /tmp/changed-audits.txt || true
          if [ ! -s /tmp/changed-audits.txt ]; then
            echo "No changed audit Markdown files to validate."
            exit 0
          fi
          ANCESTRY_REF="HEAD"
          while IFS= read -r audit_path; do
            make audit-sha-check FILE="$audit_path" AUDIT_SHA_TARGET_REF="origin/${{ github.base_ref || 'develop' }}" AUDIT_SHA_ANCESTRY_REF="$ANCESTRY_REF"
          done < /tmp/changed-audits.txt

  code-lint:
    name: lint
    needs: ci-paths
    if: ${{ needs.ci-paths.outputs.code-tests-needed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Validate uv.lock revision against the PR base
        id: guard-uv-lock-revision
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: make uv-lock-revision-check

      - name: SQLGlot repro retirement check (runs repros on sqlglot upgrade)
        id: guard-sqlglot-repro-retirement
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: make sqlglot-repro-retirement-check

      - name: Stale _project/ reference check
        id: guard-project-references
        continue-on-error: true
        run: uv run -- python _project/scripts/check_project_references.py

      - name: Lint and format check with ruff
        id: guard-ruff
        continue-on-error: true
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check with ty
        id: guard-ty
        continue-on-error: true
        run: uv run ty check

      - name: Strict type check for quality-governance island
        id: guard-quality-governance-typecheck
        continue-on-error: true
        run: make quality-governance-typecheck

      - name: Validate test marker annotations
        id: guard-lint-markers
        continue-on-error: true
        run: make lint-markers

      - name: Validate import layering
        id: guard-lint-imports
        continue-on-error: true
        run: make lint-imports

      - name: Validate Windows antipatterns
        id: guard-windows-antipatterns
        continue-on-error: true
        run: make windows-antipatterns-check

      - name: Validate artifact hygiene
        id: guard-artifact-hygiene
        continue-on-error: true
        run: make artifact-hygiene

      - name: Validate agent instruction authority and efficiency
        id: guard-agent-instructions
        continue-on-error: true
        run: make agent-instructions-check

      - name: Validate no agent authorship or attribution in PR commits
        id: guard-agent-commit-range
        continue-on-error: true
        run: make agent-commit-range-check

      - name: Timing policy (wall-clock allowlist)
        id: guard-timing-policy
        continue-on-error: true
        run: uv run -- python _project/scripts/timing_policy_check.py --strict

      - name: Fast lane marker and path guards
        id: guard-fast-lane-markers
        continue-on-error: true
        run: uv run -- python _project/scripts/fast_lane_ceiling_check.py --strict

      - name: UAT spec LOC table drift check
        id: guard-uat-loc-table
        continue-on-error: true
        run: uv run --project _project/scripts --no-sync -- python _project/scripts/uat_loc_table.py --check

      - name: Compatibility governance drift check
        id: guard-compat-docs
        continue-on-error: true
        run: make compat-docs-check

      - name: Platform manifest drift check
        id: guard-platform-manifest
        continue-on-error: true
        run: make platform-manifest-check

      - name: Oracle coverage map drift check
        id: guard-oracle-coverage-map
        continue-on-error: true
        run: make oracle-coverage-map-check

      - name: Pricing data drift check
        id: guard-pricing-data
        continue-on-error: true
        run: make pricing-data-check

      - name: Public contract drift check
        id: guard-public-contract-drift
        continue-on-error: true
        run: uv run -- python scripts/check_public_contract_drift.py

      - name: Dependency audit (no unused declarations)
        id: guard-audit-deps
        continue-on-error: true
        run: make audit-deps

      - name: Dependency inventory drift check
        id: guard-audit-raw
        continue-on-error: true
        run: make audit-raw-check

      - name: Release curation list drift check
        id: guard-release-curation
        continue-on-error: true
        run: uv run -- python scripts/check_release_curation.py

      - name: Untracked skill-mirror drift guard (cloud parity)
        id: guard-skill-mirror-drift
        continue-on-error: true
        run: sh scripts/check_untracked_skill_mirrors.sh

      - name: Duplicate code delta vs PR base
        id: guard-duplicate-delta
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: make duplicate-check-delta

      - name: Complexity policy and report
        id: guard-complexity-policy
        continue-on-error: true
        run: make complexity-check

      - name: lint-guard-summary
        id: lint-guard-summary
        if: always()
        env:
          STEPS_CONTEXT: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$STEPS_CONTEXT" > "$RUNNER_TEMP/steps_context.json"

          ids=$(jq -r 'keys[] | select(startswith("guard-"))' "$RUNNER_TEMP/steps_context.json" | sort) || {
            echo "aggregator: jq failed to parse the steps context" >&2
            exit 1
          }
          if [ -z "$ids" ]; then
            echo "aggregator: no guard-* steps found in the steps context" >&2
            exit 1
          fi

          {
            echo "## Lint guard summary"
            echo
            echo "| Guard | Outcome |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for id in $ids; do
            outcome=$(jq -r --arg id "$id" '.[$id].outcome' "$RUNNER_TEMP/steps_context.json")
            if [ "$outcome" = "success" ]; then
              echo "| $id | ✅ success |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $id | ⚠️ $outcome |" >> "$GITHUB_STEP_SUMMARY"
              echo "FAILED: $id ($outcome)"
              failed=1
            fi
          done

          if [ "$failed" -eq 1 ]; then
            echo "One or more lint guards failed -- see the table above and the" \
              "per-step logs for details." >&2
            exit 1
          fi
          echo "All lint guards passed."

