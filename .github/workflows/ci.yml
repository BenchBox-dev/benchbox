            --expect explorer-tokens=${{ needs.ci-paths.outputs.explorer-paths-needed == 'true' }} \
            --expect explorer-vitest=${{ needs.ci-paths.outputs.explorer-vitest-needed == 'true' }} \
            --expect parity-check=${{ needs.ci-paths.outputs.viz-needed == 'true' }} \
            --expect explorer-e2e=${{ needs.ci-paths.outputs.unit-explorer == 'true' }} \
            --expect visual-inputs=${{ true }} || {
            rc=$?
            if [ "$rc" -eq 3 ]; then
              echo "superseded=true" >> "$GITHUB_OUTPUT"
            fi
            exit "$rc"
          }

      - name: Cancel superseded run so the aggregate concludes cancelled
