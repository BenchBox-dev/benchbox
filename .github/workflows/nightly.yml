name: Nightly Validation

env:
  BENCHBOX_TEST_LOCK_WAIT_SECONDS: "0"
  BENCHBOX_TEST_TIER: t1

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: nightly-validation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: >-
      test (${{ matrix.os }}, ${{ matrix.python-version }})${{
      matrix.os == 'windows-latest' && ' (quarantine #2568)' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.11'

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run linting
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run -- python scripts/check_windows_antipatterns.py

      - name: Run type checking
        run: |
          uv run ty check

      - name: Run fast tests
        run: |
          uv run -- python -m pytest tests -m "fast and not (slow or stress or resource_heavy or live_integration)" --tb=short --timeout=120 -p pytest_cov --cov=benchbox --cov-report=xml --cov-report=term-missing --cov-fail-under=70 --junitxml=junit-fast.xml

      - name: Upload fast test duration report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: fast-junit-report
          path: junit-fast.xml
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  slow-tier-observation:
    name: Slow tier observation
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    env:
      BENCHBOX_TEST_TIER: t3
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Report slow module coverage
        run: uv run -- python _project/scripts/report_slow_test_coverage.py

      - name: Observe non-credentialed slow tests
        run: |
          uv run -- python -m pytest tests -m "slow and not (stress or resource_heavy or live_integration)" -n 0 --tb=short --timeout=1200 --durations=20 --junitxml=junit-t3-slow.xml

      - name: Download fast test duration report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: fast-junit-report
          path: duration-inputs
        continue-on-error: true

      - name: Refresh test duration artifact
        if: success()
        run: |
          test -f duration-inputs/junit-fast.xml
          test -f junit-t3-slow.xml
          uv run -- python _project/scripts/update_test_durations.py \
            --input duration-inputs/junit-fast.xml \
            --input junit-t3-slow.xml

      - name: Upload duration report and artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: t3-test-durations
          path: |
            junit-t3-slow.xml
            duration-inputs/junit-fast.xml
            tests/fixtures/test_durations.json
          if-no-files-found: ignore

  duckdb-preview:
    name: DuckDB 2.0 preview compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DUCKDB_PREVIEW_VERSION: 1.6.0.dev379
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install BenchBox and the pinned DuckDB preview
        run: |
          uv sync --group dev --extra duckdb
          uv pip install --upgrade --prerelease=allow "duckdb==${DUCKDB_PREVIEW_VERSION}"

      - name: Verify preview identity
        run: |
          uv run --no-sync -- python - <<'PY'
          import os

          import duckdb

          package_version = duckdb.__version__
          engine_version = duckdb.connect(":memory:").execute("SELECT version()").fetchone()[0]
          print(f"DuckDB Python package: {package_version}")
          print(f"DuckDB engine: {engine_version}")
          if package_version != os.environ["DUCKDB_PREVIEW_VERSION"] or not engine_version.startswith("v2.0.0-"):
              raise SystemExit("installed DuckDB preview identity does not match the pinned 2.0 preview")
          PY

      - name: Run DuckDB compatibility suite
        run: |
          uv run --no-sync -- python -m pytest \
            tests/unit/core/query_plans/parsers/test_duckdb_parser_versions.py \
            tests/unit/platforms/test_duckdb_adapter.py \
            tests/unit/platforms/test_duckdb_behavioral.py \
            tests/unit/platforms/test_duckdb_introspection.py \
            tests/unit/platforms/test_duckdb_operations.py \
            tests/unit/platforms/test_duckdb_plan_capture.py \
            tests/unit/platforms/test_duckdb_real_connection.py \
            tests/unit/platforms/test_duckdb_sorted_loading.py \
            tests/unit/platforms/test_ducklake_adapter.py \
            tests/integration/test_duckdb_integration.py \
            tests/integration/test_ducklake_integration.py \
            -m "not live_integration" -n 0 --tb=short

  binary-framing:
    name: TPC-H binary framing guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Verify bundled dbgen binaries emit clean framing
        run: |
          uv run -- python -m pytest tests/unit/core/tpch/test_tpch_dbgen_framing_binaries.py -m slow -v

  check-test-patterns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Run patch safety check
        run: uv run -- python scripts/check_patch_safety.py

  security:
    runs-on: ubuntu-latest
    env:
      PIP_AUDIT_IGNORE_VULNS: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run security audit
        run: |
          if [ -n "${PIP_AUDIT_IGNORE_VULNS}" ]; then
            IGNORE_ARGS=$(printf '%s' "${PIP_AUDIT_IGNORE_VULNS}" | tr ',' '\n' | sed '/^$/d;s/^[[:space:]]*//;s/[[:space:]]*$//;/^$/d;s/^/--ignore-vuln /' | tr '\n' ' ')
            uvx pip-audit ${IGNORE_ARGS}
          else
            uvx pip-audit
          fi

  sqlglot-generator:
    name: SQLGlot generated translation pilot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Validate generated-case disposition policy
        run: >-
          uv run -- python scripts/check_sqlglot_generator_known_failures.py
          --policy _project/sqlglot-upstream/generator-policy.json

      - name: Run deterministic generated translation cases
        id: generator
        shell: bash
        env:
          FAILURE_ARTIFACT: ${{ runner.temp }}/sqlglot-generator-failure.json
          SUMMARY_ARTIFACT: ${{ runner.temp }}/sqlglot-generator-summary.json
        run: |
          set +e
          uv run -- python _project/sqlglot-upstream/repros/generator.py \
            --seed "${GITHUB_RUN_ID}" \
            --source-dialect postgres \
            --target-dialect duckdb \
            --cases 1024 \
            --deadline-seconds 300 \
            --failure-artifact "${FAILURE_ARTIFACT}" \
            --summary-artifact "${SUMMARY_ARTIFACT}"
          status=$?
          set -e

          if [ "${status}" -eq 1 ]; then
            uv run -- python _project/sqlglot-upstream/repros/generator.py \
              --seed "${GITHUB_RUN_ID}" \
              --source-dialect postgres \
              --target-dialect duckdb \
              --failure-artifact "${FAILURE_ARTIFACT}" \
              --summary-artifact "${SUMMARY_ARTIFACT}" \
              --validate-advisory-evidence
            echo "::warning::SQLGlot generated translation case discovered; replay artifact uploaded and nightly remains red."
            exit "${status}"
          fi
          if [ "${status}" -ne 0 ]; then
            echo "::error::SQLGlot generator infrastructure or contract failure (exit ${status})."
            exit "${status}"
          fi

      - name: Upload generated translation evidence
        if: ${{ !cancelled() && steps.generator.outcome != 'skipped' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: sqlglot-generator-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sqlglot-generator-summary.json
            ${{ runner.temp }}/sqlglot-generator-failure.json
          if-no-files-found: warn
          retention-days: 14

  integration-smoke:
    name: integration-smoke (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      BENCHBOX_TEST_TIER: t2
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run integration smoke tests
        run: |
          uv run -- python -m pytest tests/integration -m "platform_smoke or (integration and fast)" --tb=short

  integration-table-formats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BENCHBOX_TEST_TIER: t2
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run table-format integration tests
        run: |
          uv run -- python -m pytest -q tests/integration/core/data_organization/test_presorted_generation.py -m "requires_table_formats" --tb=short

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BENCHBOX_TEST_TIER: t3
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: benchbox
          POSTGRES_PASSWORD: benchbox
          POSTGRES_DB: benchbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Wait for PostgreSQL service to be reachable
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U benchbox >/dev/null 2>&1; then
              echo "PostgreSQL is reachable."
              exit 0
            fi
            echo "Waiting for PostgreSQL (attempt ${attempt}/30)..."
            sleep 2
          done
          echo "::error::PostgreSQL service never became reachable on localhost:5432; the live integration gate cannot be skipped silently."
          exit 1

      - name: Run PostgreSQL live integration tests
        run: |
          set -o pipefail
          uv run -- python -m pytest tests/integration/platforms/test_postgresql_live.py \
            -m "live_postgresql" --tb=short -v -p no:cacheprovider \
            | tee /tmp/pg_live_output.txt
          if ! grep -Eq '[0-9]+ passed' /tmp/pg_live_output.txt; then
            echo "::error::PostgreSQL live integration tests produced no passing tests (all skipped or none collected); refusing to pass the gate."
            exit 1
          fi

  cloud-live-plan-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BENCHBOX_TEST_TIER: t3
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USERNAME: ${{ secrets.SNOWFLAKE_USERNAME }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
      BIGQUERY_PROJECT: ${{ secrets.BIGQUERY_PROJECT }}
      BIGQUERY_DATASET: ${{ secrets.BIGQUERY_DATASET }}
      REDSHIFT_HOST: ${{ secrets.REDSHIFT_HOST }}
      REDSHIFT_PORT: ${{ secrets.REDSHIFT_PORT || 5439 }}
      REDSHIFT_USER: ${{ secrets.REDSHIFT_USER }}
      REDSHIFT_PASSWORD: ${{ secrets.REDSHIFT_PASSWORD }}
      REDSHIFT_DATABASE: ${{ secrets.REDSHIFT_DATABASE }}
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      MOTHERDUCK_DATABASE: ${{ secrets.MOTHERDUCK_DATABASE || 'benchbox_test' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: |
          uv sync --group dev --extra snowflake --extra bigquery --extra redshift --extra duckdb

      - name: Write GCP service account key to temp file
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -n "${GCP_SERVICE_ACCOUNT_KEY}" ]; then
            key_file="${RUNNER_TEMP}/gcp-service-account-key.json"
            printf '%s' "${GCP_SERVICE_ACCOUNT_KEY}" > "${key_file}"
            chmod 600 "${key_file}"
            echo "GOOGLE_APPLICATION_CREDENTIALS=${key_file}" >> "${GITHUB_ENV}"
          else
            echo "No GCP service account key configured; BigQuery tests will skip."
          fi

      - name: Run Snowflake, BigQuery, Redshift, and MotherDuck plan-capture live tests
        run: |
          uv run -- python -m pytest \
            "tests/integration/platforms/test_snowflake_live.py::TestLiveSnowflakeQueryPlanCapture" \
            "tests/integration/platforms/test_bigquery_live.py::TestLiveBigQueryQueryPlanCapture" \
            "tests/integration/platforms/test_redshift_live.py::TestLiveRedshiftQueryPlanCapture" \
            "tests/integration/platforms/test_motherduck_live.py::TestLiveMotherDuckQueryPlanCapture" \
            -m "live_snowflake or live_bigquery or live_redshift or live_motherduck" --tb=short -v -p no:cacheprovider

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BENCHBOX_TEST_TIER: t2
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run integration tests
        run: |
          uv run -- python -m pytest tests/integration -m "integration and not (slow or stress or resource_heavy or live_integration)" --tb=short --maxfail=5 --timeout=300

  test-package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Build package
        run: |
          uv build

      - name: Test package installation
        shell: bash
        run: |
          set -euo pipefail
          wheel_count=$(find dist -maxdepth 1 -name '*.whl' | wc -l | tr -d '[:space:]')
          if [ "$wheel_count" != "1" ]; then
            echo "::error::Expected exactly one wheel, found $wheel_count"
            find dist -maxdepth 1 -type f -print
            exit 1
          fi
          wheel=$(find "$PWD/dist" -maxdepth 1 -name '*.whl' -print -quit)
          tmpdir=$(mktemp -d)
          cd "$tmpdir"
          uv run --isolated --no-project --with "$wheel" -- python -c "import importlib.util; import benchbox; assert importlib.util.find_spec('pandas') is None, 'core install must not pull pandas'; print('Package installation successful (minimal import surface)')"
          uv run --isolated --no-project --with "$wheel" -- benchbox --help

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: nightly-test-build-dist-${{ matrix.os }}
          path: dist/
          retention-days: 7

  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Detect results explorer
        id: explorer
        shell: bash
        run: |
          if [ -f results-explorer/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "results-explorer is absent; skipping explorer parity."
          fi

      - name: Set up Python
        if: steps.explorer.outputs.present == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        if: steps.explorer.outputs.present == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Set up Node.js
        if: steps.explorer.outputs.present == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '20'

      - name: Install Python dependencies
        if: steps.explorer.outputs.present == 'true'
        run: uv sync --group dev

      - name: Install Node dependencies
        if: steps.explorer.outputs.present == 'true'
        run: npm ci
        working-directory: results-explorer

      - name: Audit frontend dependencies
        if: steps.explorer.outputs.present == 'true'
        run: npm run audit:high
        working-directory: results-explorer

      - name: Verify parity fixtures match Python source
        if: steps.explorer.outputs.present == 'true'
        run: make parity-check

      - name: Run Vitest parity suite
        if: steps.explorer.outputs.present == 'true'
        run: npm test -- --reporter=verbose
        working-directory: results-explorer

  website-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Detect website
        id: website
        shell: bash
        run: |
          if [ -f website/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "website is absent; skipping website audit."
          fi

      - name: Set up Node.js
        if: steps.website.outputs.present == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'

      - name: Install website dependencies
        if: steps.website.outputs.present == 'true'
        run: npm ci
        working-directory: website

      - name: Audit website dependencies
        if: steps.website.outputs.present == 'true'
        run: npm run audit:high
        working-directory: website

  scheduled-workflow-liveness:
    name: scheduled-workflow-liveness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout develop (scheduled workflows are authored there first)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: develop

      - name: Assert every scheduled workflow in the tree has a recent scheduled run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/scheduled_workflow_liveness.py

  mirror-cedardb:
    uses: ./.github/workflows/mirror-ci-images.yml
    permissions:
      contents: read
      packages: write
    with:
      images: '["cedardb"]'

  throughput-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      THROUGHPUT_FLOOR_MEDIAN: ${{ vars.THROUGHPUT_FLOOR_MEDIAN }}
      THROUGHPUT_FLOOR_MAX_DROP_FRACTION: ${{ vars.THROUGHPUT_FLOOR_MAX_DROP_FRACTION }}
      THROUGHPUT_BASELINE_MIN_RECORDED_AT: ${{ vars.THROUGHPUT_BASELINE_MIN_RECORDED_AT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run real-DB throughput integration tests (DuckDB)
        run: |
          uv run -- python -m pytest tests/integration -k "throughput and duckdb" -m integration --tb=short -v

      - name: Run DuckDB throughput UAT cell (TPC-H SF1, run-official --streams 3)
        id: duckdb-sweep
        run: |
          make uat-sweep CONFIG=tests/uat/configs/uat-throughput-duckdb-nightly.yaml

      - name: Download retained Throughput@Size baselines
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          history="$HOME/Developer/benchmark_runs/throughput-baseline-history"
          mkdir -p "$history"
          if ! run_ids=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly.yml --branch develop --event schedule --limit 30 \
            --json databaseId --jq ".[] | select(.databaseId != ${GITHUB_RUN_ID}) | .databaseId"); then
            echo "::warning::could not list prior nightly runs; the Throughput@Size floor stays observe-only"
            exit 0
          fi
          for run_id in ${run_ids}; do
            gh run download "${run_id}" --repo "$GITHUB_REPOSITORY" \
              --pattern 'throughput-baseline-duckdb-tpch-sf1-*' --dir "${history}/${run_id}" 2>/dev/null || true
          done
          echo "Downloaded $(find "$history" -name 'throughput-baseline-*.json' | wc -l) baseline record(s)"

      - name: Assert the requested stream count reached the driver and every stream succeeded
        if: ${{ !cancelled() }}
        run: |
          uv run -- python -m tests.uat.throughput assert \
            --cells-glob "$HOME/Developer/benchmark_runs/logs/uat_throughput_duckdb_nightly_*/cells.jsonl" \
            --platform duckdb --benchmark tpch --scale 1 --streams 3 \
            --evaluate-floor \
            --baseline-history "$HOME/Developer/benchmark_runs/throughput-baseline-history" \
            --baseline-out "$HOME/Developer/benchmark_runs/throughput-baseline"

      - name: Upload throughput UAT logs and results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: throughput-uat-duckdb-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ~/Developer/benchmark_runs/logs/uat_throughput_duckdb_*
            ~/Developer/benchmark_runs/results/tpch_sf1_*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Throughput@Size baseline record
        if: ${{ !cancelled() && steps.duckdb-sweep.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: throughput-baseline-duckdb-tpch-sf1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ~/Developer/benchmark_runs/throughput-baseline/
          if-no-files-found: ignore
          retention-days: 90

  throughput-uat-cedardb:
    needs: mirror-cedardb
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    outputs:
      cedardb_sweep_outcome: ${{ steps.cedardb-sweep.outcome }}
    env:
      CEDARDB_IMAGE: ghcr.io/benchbox-dev/cedardb@sha256:dbbacb16b24421a9a123cd1d065e2a049c60b7cc6060d7db2f3cccbf69f5ff62
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Run CedarDB throughput UAT cell (TPC-H SF1, run-official --streams 3)
        id: cedardb-sweep
        run: |
          make uat-sweep CONFIG=tests/uat/configs/uat-throughput-cedardb-nightly.yaml

      - name: Assert the CedarDB cell stream count and per-stream success
        if: ${{ !cancelled() }}
        run: |
          uv run -- python -m tests.uat.throughput assert \
            --cells-glob "$HOME/Developer/benchmark_runs/logs/uat_throughput_cedardb_nightly_*/cells.jsonl" \
            --platform cedardb --benchmark tpch --scale 1 --streams 3

      - name: Upload CedarDB throughput UAT logs and results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: throughput-uat-cedardb-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ~/Developer/benchmark_runs/logs/uat_throughput_cedardb_*
            ~/Developer/benchmark_runs/results/tpch_sf1_*.json
          if-no-files-found: warn
          retention-days: 14

  throughput-uat-signal:
    name: throughput-uat-signal
    needs: [throughput-uat, throughput-uat-cedardb]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Publish the throughput-uat commit status
        env:
          GH_TOKEN: ${{ github.token }}
          DUCKDB_RESULT: ${{ needs.throughput-uat.result }}
          CEDARDB_RESULT: ${{ needs.throughput-uat-cedardb.result }}
          CEDARDB_SWEEP_OUTCOME: ${{ needs.throughput-uat-cedardb.outputs.cedardb_sweep_outcome }}
        run: |
          case "${DUCKDB_RESULT}:${CEDARDB_RESULT}" in
            success:success) state=success ;;
            cancelled:*|*:cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context="nightly/throughput-uat" \
            -f description="throughput-uat DuckDB ${DUCKDB_RESULT}; CedarDB job ${CEDARDB_RESULT}; cell ${CEDARDB_SWEEP_OUTCOME:-not run}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  pyspark-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run PySpark tests
        run: |
          make test-pyspark

  green-unmerged-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: write
      checks: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Run green-unmerged sweep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run -- python _project/scripts/green_unmerged_sweep.py --apply

  ruleset-drift:
    name: ruleset-drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: develop
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Compare live governance with the runbook
        env:
          RULESET_DRIFT_TOKEN: ${{ secrets.RULESET_DRIFT_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/ruleset_drift_check.py \
            --token "${RULESET_DRIFT_TOKEN}" \
            --require-bypass-actor-visibility \
            --output ruleset-drift.json

      - name: Upload drift evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: nightly-ruleset-drift-${{ github.run_id }}-${{ github.run_attempt }}
          path: ruleset-drift.json
          if-no-files-found: warn
          retention-days: 30
