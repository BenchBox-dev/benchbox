name: Tests

env:
  BENCHBOX_TEST_LOCK_WAIT_SECONDS: "0"

on:
  push:
    branches:
      - release
  pull_request:
    branches:
      - release

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (ubuntu-latest, 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run linting
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run -- python scripts/check_windows_antipatterns.py

      - name: Run type checking
        run: |
          uv run ty check

      - name: Run fast tests
        run: |
          uv run -- python -m pytest tests -m "fast and not (slow or stress or resource_heavy or live_integration)" --tb=short --timeout=120 -p pytest_cov --cov=benchbox --cov-report=xml --cov-report=term-missing --cov-fail-under=70

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  compat-test:
    name: compat-test (${{ matrix.os }}, ${{ matrix.python-version }})
    if: ${{ (github.event_name != 'pull_request' || github.base_ref != 'develop') && (github.event_name != 'pull_request' || github.base_ref != 'release' || !startsWith(github.head_ref, 'v')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: ubuntu-latest
            python-version: '3.14'
          - os: macos-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.11'

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run linting
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run -- python scripts/check_windows_antipatterns.py

      - name: Run type checking
        run: |
          uv run ty check

      - name: Run fast tests
        run: |
          uv run -- python -m pytest tests -m "fast and not (slow or stress or resource_heavy or live_integration)" --tb=short --timeout=120 -p pytest_cov --cov=benchbox --cov-report=xml --cov-report=term-missing --cov-fail-under=70

  check-test-patterns:
    if: ${{ github.event_name != 'pull_request' || github.base_ref != 'develop' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Run patch safety check
        run: python scripts/check_patch_safety.py

  security:
    if: ${{ github.event_name != 'pull_request' || github.base_ref != 'develop' }}
    runs-on: ubuntu-latest
    env:
      PIP_AUDIT_IGNORE_VULNS: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run security audit
        run: |
          if [ -n "${PIP_AUDIT_IGNORE_VULNS}" ]; then
            IGNORE_ARGS=$(printf '%s' "${PIP_AUDIT_IGNORE_VULNS}" | tr ',' '\n' | sed '/^$/d;s/^[[:space:]]*//;s/[[:space:]]*$//;/^$/d;s/^/--ignore-vuln /' | tr '\n' ' ')
            uvx pip-audit ${IGNORE_ARGS}
          else
            uvx pip-audit
          fi

  integration-smoke:
    if: ${{ (github.event_name != 'pull_request' || github.base_ref != 'develop') && (github.event_name != 'pull_request' || github.base_ref != 'release' || !startsWith(github.head_ref, 'v')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run integration smoke tests
        run: |
          uv run -- python -m pytest tests/integration -m "platform_smoke or (integration and fast)" --tb=short

  integration-table-formats:
    if: ${{ github.event_name != 'pull_request' || github.base_ref != 'develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run table-format integration tests
        run: |
          uv run -- python -m pytest -q tests/integration/core/data_organization/test_presorted_generation.py -m "requires_table_formats" --tb=short

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'release')
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run integration tests
        run: |
          uv run -- python -m pytest tests/integration -m "integration and not (slow or stress or resource_heavy or live_integration)" --tb=short --maxfail=5 --timeout=300

  correctness-gate:
    name: correctness-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'release')
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run bounded real-result correctness gate
        run: make test-correctness-gate

  test-package:
    if: ${{ github.event_name != 'pull_request' || github.base_ref != 'develop' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Build package
        run: |
          uv build

      - name: Test package installation
        shell: bash
        run: |
          set -euo pipefail
          wheel_count=$(find dist -maxdepth 1 -name '*.whl' | wc -l | tr -d '[:space:]')
          if [ "$wheel_count" != "1" ]; then
            echo "::error::Expected exactly one wheel, found $wheel_count"
            find dist -maxdepth 1 -type f -print
            exit 1
          fi
          wheel=$(find "$PWD/dist" -maxdepth 1 -name '*.whl' -print -quit)
          tmpdir=$(mktemp -d)
          cd "$tmpdir"
          uv run --isolated --no-project --with "$wheel" -- python -c "import importlib.util; import benchbox; assert importlib.util.find_spec('pandas') is None, 'core install must not pull pandas'; print('Package installation successful (minimal import surface)')"
          uv run --isolated --no-project --with "$wheel" -- benchbox --help

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: test-build-dist-${{ matrix.os }}
          path: dist/
          retention-days: 7

  release-readiness:
    name: release-readiness
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Check dependency upper bounds
        run: |
          mkdir -p release-artifacts
          uv run -- python scripts/check_dependency_bounds.py \
            --fail-on=cap-reached \
            --output release-artifacts/dependency-bounds.md

      - name: Check release branch curation
        run: |
          missing=0
          for forbidden in \
            .claude \
            .codex \
            .gemini \
            .pre-commit-config.yaml \
            todo.config.yaml \
            skill-sync.conf \
            tools/skill-sync \
            .coveragerc_core \
            .dockerignore \
            .env.example \
            .mcp.json \
            AGENTS.md \
            CLAUDE.md \
            GEMINI.md \
            .github/workflows/seed-corpus.yml \
            .github/workflows/sync-results-data-to-published.yml \
            .github/workflows/validate-submission.yml; do
            if [ -e "$forbidden" ]; then
              echo "::error::Release branch still contains curated path: $forbidden"
              missing=1
            fi
          done

          for required in \
            results-data \
            _project/scripts/explorer_pipeline \
            _project/scripts/explorer_publish.py \
            _project/scripts/results_explorer_snapshot_invariants.py; do
            if [ ! -e "$required" ]; then
              echo "::error::Curated Explorer publication path is missing: $required"
              missing=1
            fi
          done

          while IFS= read -r path; do
            case "$path" in
              _project/scripts/explorer_pipeline/*|\
              _project/scripts/explorer_publish.py|\
              _project/scripts/results_explorer_snapshot_invariants.py)
                ;;
              *)
                echo "::error::Release branch contains non-curated _project path: $path"
                missing=1
                ;;
            esac
          done < <(git ls-files -- _project)

          exit "$missing"

      - name: Upload dependency bounds report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-pr-dependency-bounds
          path: release-artifacts/dependency-bounds.md
          retention-days: 30

  release-required-result:
    name: release-required-result
    needs: [test, integration, correctness-gate, test-package, release-readiness]
    if: ${{ always() && github.event_name == 'pull_request' && github.base_ref == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate release-required result
        env:
          FAST_TEST_RESULT: ${{ needs.test.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          CORRECTNESS_RESULT: ${{ needs.correctness-gate.result }}
          PACKAGE_RESULT: ${{ needs.test-package.result }}
          RELEASE_READINESS_RESULT: ${{ needs.release-readiness.result }}
        run: |
          set -euo pipefail

          failed=0
          for pair in \
            "test (ubuntu-latest, 3.12)=$FAST_TEST_RESULT" \
            "integration=$INTEGRATION_RESULT" \
            "correctness-gate=$CORRECTNESS_RESULT" \
            "test-package=$PACKAGE_RESULT" \
            "release-readiness=$RELEASE_READINESS_RESULT"; do
            name="${pair%%=*}"
            result="${pair#*=}"
            if [ "$result" != "success" ]; then
              echo "$name=$result"
              failed=1
            fi
          done

          if [ "$failed" != "0" ]; then
            exit 1
          fi

          echo "Release-required checks passed."

  parity:
    if: ${{ (github.event_name != 'pull_request' || github.base_ref != 'develop') && (github.event_name != 'pull_request' || !startsWith(github.event.pull_request.title, 'Release v')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Verify parity fixtures match Python source
        run: make parity-check

  pyspark-tests:
    if: ${{ github.event_name != 'pull_request' || github.base_ref != 'develop' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run PySpark tests
        run: |
          make test-pyspark
