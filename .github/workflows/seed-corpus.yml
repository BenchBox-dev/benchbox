name: Seed Corpus

on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Run only this benchmark (leave blank to run all)"
        required: false
        default: ""
        type: string

jobs:
  generate-seed-corpus:
    name: "${{ matrix.benchmark }} / ${{ matrix.platform }} / sf${{ matrix.scale_factor }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - benchmark: tpch
            platform: duckdb
            scale_factor: "0.01"
            extras: duckdb
          - benchmark: tpch
            platform: datafusion
            scale_factor: "0.01"
            extras: datafusion
          - benchmark: tpch
            platform: polars-df
            scale_factor: "0.01"
            extras: polars

          - benchmark: tpch
            platform: duckdb
            scale_factor: "0.1"
            extras: duckdb
          - benchmark: tpch
            platform: datafusion
            scale_factor: "0.1"
            extras: datafusion
          - benchmark: tpch
            platform: polars-df
            scale_factor: "0.1"
            extras: polars

          - benchmark: tpch
            platform: duckdb
            scale_factor: "1.0"
            extras: duckdb
            official: true
          - benchmark: tpch
            platform: datafusion
            scale_factor: "1.0"
            extras: datafusion
            official: true
          - benchmark: tpch
            platform: clickhouse-local
            scale_factor: "1.0"
            extras: clickhouse-local
            official: true

          - benchmark: tpcds
            platform: duckdb
            scale_factor: "1"
            extras: duckdb
            official: true
          - benchmark: tpcds
            platform: datafusion
            scale_factor: "1"
            extras: datafusion
            official: true
          - benchmark: tpcds
            platform: clickhouse-local
            scale_factor: "1"
            extras: clickhouse-local
            official: true

          - benchmark: ssb
            platform: duckdb
            scale_factor: "0.01"
            extras: duckdb
          - benchmark: ssb
            platform: datafusion
            scale_factor: "0.01"
            extras: datafusion
          - benchmark: ssb
            platform: polars-df
            scale_factor: "0.01"
            extras: polars

          - benchmark: ssb
            platform: duckdb
            scale_factor: "0.1"
            extras: duckdb
          - benchmark: ssb
            platform: datafusion
            scale_factor: "0.1"
            extras: datafusion
          - benchmark: ssb
            platform: polars-df
            scale_factor: "0.1"
            extras: polars

    env:
      SELECTED: ${{ github.event_name == 'schedule' || github.event.inputs.benchmark == '' || github.event.inputs.benchmark == matrix.benchmark }}
      BENCHBOX_OUTPUT_DIR: ${{ github.workspace }}/benchmark_runs
      SEED_CELL: ${{ matrix.benchmark }} / ${{ matrix.platform }} / sf${{ matrix.scale_factor }}
      SEED_STATUS_FILE: seed-status/${{ matrix.benchmark }}--${{ matrix.platform }}--sf${{ matrix.scale_factor }}.txt

    steps:
      - name: Checkout code
        if: env.SELECTED == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        if: env.SELECTED == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install uv
        if: env.SELECTED == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install BenchBox
        if: env.SELECTED == 'true'
        run: uv sync --extra ${{ matrix.extras }}

      - name: Run benchmark
        if: env.SELECTED == 'true'
        run: |
          command=(uv run benchbox run \
            --platform "${{ matrix.platform }}" \
            --benchmark "${{ matrix.benchmark }}" \
            --scale "${{ matrix.scale_factor }}" \
            --phases generate,load,power \
            --compression zstd:9)
          if [ "${{ matrix.official }}" = "true" ]; then
            command+=(--official --seed 42)
          fi
          "${command[@]}"

      - name: Locate result bundle
        if: env.SELECTED == 'true'
        id: locate
        shell: bash
        run: |
          RESULT=$(find benchmark_runs/results -maxdepth 1 -name "*.json" \
            ! -name "*.plans.json" ! -name "*.tuning.json" \
            ! -name "*.override.json" \
            -printf "%T@ %p\n" 2>/dev/null \
            | sort -rn | head -1 | awk '{print $2}')
          if [ -z "$RESULT" ]; then
            echo "ERROR: no result bundle found in benchmark_runs/results/" >&2
            exit 1
          fi
          echo "result_file=$RESULT" >> "$GITHUB_OUTPUT"
          echo "Found result bundle: $RESULT"

      - name: Stage bundle under results-data/
        if: env.SELECTED == 'true'
        shell: bash
        env:
          RESULT_FILE: ${{ steps.locate.outputs.result_file }}
          BENCHBOX_MACHINE_ID_SALT: ${{ secrets.BENCHBOX_MACHINE_ID_SALT }}
        run: |
          DEST="results-data/bundles/${{ matrix.benchmark }}/${{ matrix.platform }}/sf${{ matrix.scale_factor }}"
          uv run -- python scripts/stage_seed_corpus_bundle.py "$RESULT_FILE" "$DEST"
        id: stage

      - name: Record a failed cell
        if: failure() && env.SELECTED == 'true'
        shell: bash
        run: |
          if [ ! -f "$SEED_STATUS_FILE" ]; then
            mkdir -p "$(dirname "$SEED_STATUS_FILE")"
            printf '%s\tjob_failed\n' "$SEED_CELL" > "$SEED_STATUS_FILE"
          fi

      - name: Upload cell status
        if: ${{ !cancelled() && env.SELECTED == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: seed-status--${{ matrix.benchmark }}--${{ matrix.platform }}--sf${{ matrix.scale_factor }}
          path: seed-status/
          retention-days: 14

      - name: Upload bundle artifact
        if: env.SELECTED == 'true' && steps.stage.outputs.eligible == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: seed-bundle--${{ matrix.benchmark }}--${{ matrix.platform }}--sf${{ matrix.scale_factor }}
          path: results-data/bundles/${{ matrix.benchmark }}/${{ matrix.platform }}/sf${{ matrix.scale_factor }}/
          retention-days: 14

  create-pr:
    name: Open PR with seed corpus bundles
    runs-on: ubuntu-latest
    needs: generate-seed-corpus
    if: always()
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Download all bundle artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: seed-bundle--*
          path: results-data/bundles/
          merge-multiple: false

      - name: Download cell statuses
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: seed-status--*
          path: seed-status/
          merge-multiple: true

      - name: Flatten artifact subdirectories
        shell: bash
        run: |
          shopt -s nullglob
          for artifact_dir in results-data/bundles/seed-bundle--*/; do
            name=$(basename "$artifact_dir")
            rest="${name#seed-bundle--}"
            benchmark="${rest%%--*}"; rest="${rest#*--}"
            platform="${rest%%--*}"; rest="${rest#*--}"
            scale="${rest#sf}"

            dest="results-data/bundles/${benchmark}/${platform}/sf${scale}"
            mkdir -p "$dest"
            mv "$artifact_dir"* "$dest/" 2>/dev/null || true
            rmdir "$artifact_dir" 2>/dev/null || true
          done

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Regenerate corpus inventory
        run: uv run -- python scripts/generate_corpus_inventory.py --write

      - name: Validate corpus before opening a PR
        run: uv run -- python results-data/validate_corpus.py

      - name: Check for new corpus changes
        id: check
        shell: bash
        run: |
          git add results-data/bundles/ results-data/corpus-inventory.json
          if git diff --cached --quiet; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR branch and commit
        if: steps.check.outputs.no_changes == 'false'
        shell: bash
        run: |
          DATE=$(date -u +%Y%m%d)
          BRANCH="chore/seed-corpus-${DATE}-${{ github.run_number }}"
          git config user.name "benchbox-bot"
          git config user.email "bot@benchbox.dev"
          git checkout -b "$BRANCH"
          git commit -m "chore(data): add seed corpus bundles (run ${{ github.run_number }})"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
        id: commit

      - name: Open pull request
        if: steps.check.outputs.no_changes == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY_FILE="$(mktemp)"
          cat > "$BODY_FILE" <<'EOF'
          ## Seed corpus update

          Automated PR from the `seed-corpus` workflow (run [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).

          ### Bundles included

          New or updated result bundles are committed under `results-data/bundles/`.
          Review the diff to confirm expected benchmark × platform × scale coverage.

          ### Skipped cells
          EOF
          SKIPPED="$(find seed-status -type f -name '*.txt' -exec cat {} + | LC_ALL=C sort | awk -F '\t' '$2 != "eligible" {print "- `" $1 "`: `" $2 "`"}')"
          if [ -n "$SKIPPED" ]; then
            printf '\n%s\n' "$SKIPPED" >> "$BODY_FILE"
          else
            printf '\nNone.\n' >> "$BODY_FILE"
          fi
          cat >> "$BODY_FILE" <<'EOF'

          ### Trust label

          All bundles in this PR carry the `maintainer-run` / `public-curated` trust label.

          ### Merging

          Merge into `develop` triggers `sync-results-data-to-published`, which
          opens a draft PR mirroring these bundles onto the `published-results`
          corpus branch.
          EOF
          gh pr create \
            --title "chore(data): seed corpus bundles (run ${{ github.run_number }})" \
            --body-file "$BODY_FILE" \
            --base develop \
            --head "${{ steps.commit.outputs.branch }}"

      - name: No changes to commit
        if: steps.check.outputs.no_changes == 'true'
        run: echo "All generated bundles already exist in the repo - nothing to commit."
