name: oracle-gate

run-name: oracle-gate (${{ github.event_name }} ${{ (github.event.pull_request.number || github.event.issue.number || inputs.pr) && format('pr={0}', github.event.pull_request.number || github.event.issue.number || inputs.pr) || github.event.workflow_run.head_sha && format('sha={0}', github.event.workflow_run.head_sha) || 'sweep' }})

on:
  push:
    branches: [develop]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [oracle-verdict, oracle-review]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to gate
        required: true
        type: string
      head_sha:
        description: Head commit the gate falls back to when the pull request cannot be read
        required: false
        type: string
  schedule:
    - cron: '41 * * * *'

permissions: {}

concurrency:
  group: "oracle-gate-${{ (github.event_name == 'push' && 'push-sweep') || (github.event_name == 'issue_comment' && !(contains(github.event.comment.body, 'Stand-in oracle review: APPROVE') || (github.event.action == 'edited' && contains(github.event.changes.body.from, 'Stand-in oracle review: APPROVE'))) && format('ignored-{0}', github.run_id)) || (github.event_name == 'workflow_run' && format('bridge-{0}', github.event.workflow_run.head_sha)) || github.event.pull_request.number || github.event.issue.number || inputs.pr || format('run-{0}', github.run_id) }}"
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  gate:
    name: gate
    if: >-
      github.event_name != 'schedule' && github.event_name != 'workflow_run' && github.event_name != 'push' &&
      (github.event_name != 'issue_comment' || (github.event.issue.pull_request && (contains(github.event.comment.body, 'Stand-in oracle review: APPROVE') || (github.event.action == 'edited' && contains(github.event.changes.body.from, 'Stand-in oracle review: APPROVE')))))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: oracle
    permissions:
      contents: read
      pull-requests: read
    env:
      HAS_APP: ${{ secrets.ORACLE_APP_ID != '' && secrets.ORACLE_APP_PRIVATE_KEY != '' }}
      REPO: ${{ github.repository }}
    steps:
      - name: Refuse a dispatch from any ref other than develop
        if: github.event_name == 'workflow_dispatch'
        env:
          CURRENT_REF: ${{ github.ref }}
        run: |
          if [ "$CURRENT_REF" != refs/heads/develop ]; then
            echo "oracle-gate: error: dispatch runs only from develop" >&2
            exit 2
          fi

      - name: Check out the trusted develop copy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: develop
          persist-credentials: false
          sparse-checkout: |
            .github/inert-paths.txt
            .github/oracle-reviewers.yml
            .github/soundness-paths.txt
            .github/workflows/oracle-gate.yml
            _project/scripts/oracle_gate.py
            _project/scripts/oracle_review_check.py
            _project/scripts/oracle_reviewers
            _project/scripts/inert_paths.py
            _project/scripts/soundness_paths.py

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Resolve the pull request
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          INPUT_HEAD: ${{ inputs.head_sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          PR_NUMBER="$EVENT_PR"
          case "$PR_NUMBER" in
            ''|*[!0-9]*|0*)
              echo "oracle-gate: error: cannot resolve a pull request number" >&2
              exit 2
              ;;
          esac
          echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          HEAD_SHA="${INPUT_HEAD:-$EVENT_HEAD}"
          if printf '%s' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint the App token
        id: app
        if: steps.resolve.outputs.pr != '' && env.HAS_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.ORACLE_APP_ID }}
          private-key: ${{ secrets.ORACLE_APP_PRIVATE_KEY }}
          permission-statuses: write
          permission-pull-requests: read

      - name: Post the gate for the head
        if: steps.resolve.outputs.pr != '' && env.HAS_APP == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr }}
          KNOWN_HEAD: ${{ steps.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          HEAD_ARGS=()
          if [ -n "$KNOWN_HEAD" ]; then HEAD_ARGS=(--head-sha "$KNOWN_HEAD"); fi
          uv run --isolated --no-project --python 3.12 --with pyyaml==6.0.3 -- python _project/scripts/oracle_gate.py --repo "$REPO" --pr "$PR_NUMBER" "${HEAD_ARGS[@]}"

      - name: Log the gate without posting when the App is not configured
        if: steps.resolve.outputs.pr != '' && env.HAS_APP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr }}
          KNOWN_HEAD: ${{ steps.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          HEAD_ARGS=()
          if [ -n "$KNOWN_HEAD" ]; then HEAD_ARGS=(--head-sha "$KNOWN_HEAD"); fi
          uv run --isolated --no-project --python 3.12 --with pyyaml==6.0.3 -- python _project/scripts/oracle_gate.py --repo "$REPO" --pr "$PR_NUMBER" --no-post "${HEAD_ARGS[@]}"

  bridge:
    name: bridge
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    env:
      REPO: ${{ github.repository }}
    steps:
      - name: Dispatch the gate for the develop pull request at this head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          case "$HEAD_SHA" in
            ''|*[!0-9a-f]*)
              echo "oracle-gate: error: the completed run has no usable head SHA" >&2
              exit 2
              ;;
          esac
          PR_NUMBER="$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" | jq -r --arg sha "$HEAD_SHA" '[.[] | select(.base.ref == "develop" and .state == "open" and .head.sha == $sha) | .number][0] // empty')"
          if [ -z "$PR_NUMBER" ]; then
            echo "oracle-gate: no open develop pull request has head $HEAD_SHA; nothing to gate"
            exit 0
          fi
          gh workflow run oracle-gate.yml --repo "$REPO" --ref develop -f pr="$PR_NUMBER" -f head_sha="$HEAD_SHA"
          echo "oracle-gate: dispatched the gate for #$PR_NUMBER at $HEAD_SHA"

  sweep:
    name: sweep
    if: github.event_name == 'schedule' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: oracle
    permissions:
      contents: read
      pull-requests: read
    env:
      HAS_APP: ${{ secrets.ORACLE_APP_ID != '' && secrets.ORACLE_APP_PRIVATE_KEY != '' }}
      REPO: ${{ github.repository }}
    steps:
      - name: Check out the trusted develop copy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: develop
          persist-credentials: false
          sparse-checkout: |
            .github/inert-paths.txt
            .github/oracle-reviewers.yml
            .github/soundness-paths.txt
            .github/workflows/oracle-gate.yml
            _project/scripts/oracle_gate.py
            _project/scripts/oracle_review_check.py
            _project/scripts/oracle_reviewers
            _project/scripts/inert_paths.py
            _project/scripts/soundness_paths.py

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Mint the App token
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.ORACLE_APP_ID }}
          private-key: ${{ secrets.ORACLE_APP_PRIVATE_KEY }}
          permission-statuses: write
          permission-pull-requests: read

      - name: Gate every open pull request targeting develop
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          set -euo pipefail
          POST="--no-post"
          if [ "${{ env.HAS_APP }}" = true ]; then
            POST=""
          else
            echo "::notice::oracle-gate is not posted because the App secrets are not set"
          fi
          PRS="$(gh api --paginate "repos/$REPO/pulls?base=develop&state=open&per_page=100" --jq '.[] | "\(.number) \(.head.sha)"')"
          FAILED=""
          RESULT="$RUNNER_TEMP/oracle-gate-result"
          while read -r PR_NUMBER HEAD_SHA; do
            [ -n "$PR_NUMBER" ] || continue
            rm -f "$RESULT"
            STATUS=0
            ORACLE_GATE_RESULT_FILE="$RESULT" uv run --isolated --no-project --python 3.12 --with pyyaml==6.0.3 -- python _project/scripts/oracle_gate.py --repo "$REPO" --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" $POST < /dev/null || STATUS=$?
            REPORTED="$(cat "$RESULT" 2>/dev/null || true)"
            if [ "$REPORTED" != "$STATUS" ] || { [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 3 ]; }; then
              echo "::warning::oracle-gate failed for #$PR_NUMBER (exit $STATUS, reported ${REPORTED:-none})"
              FAILED="$FAILED $PR_NUMBER"
            fi
          done <<< "$PRS"
          if [ -n "$FAILED" ]; then
            echo "::error::oracle-gate failed for:$FAILED"
            exit 1
          fi
