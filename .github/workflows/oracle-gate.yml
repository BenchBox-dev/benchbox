name: oracle-gate

run-name: oracle-gate (${{ github.event_name }} ${{ (github.event.pull_request.number || github.event.issue.number || inputs.pr) && format('pr={0}', github.event.pull_request.number || github.event.issue.number || inputs.pr) || github.event.workflow_run.head_sha && format('sha={0}', github.event.workflow_run.head_sha) || 'sweep' }})

on:
  push:
    branches: [develop]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [oracle-review]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to gate
        required: true
        type: string
      head_sha:
        description: Head commit the gate falls back to when the pull request cannot be read
        required: false
        type: string
  schedule:
    - cron: '41 * * * *'

permissions: {}

concurrency:
  group: "oracle-gate-${{ (github.event_name == 'push' && 'push-sweep') || (github.event_name == 'issue_comment' && !(contains(github.event.comment.body, 'Stand-in oracle review: APPROVE') || contains(github.event.comment.body, 'Omp candidate check: ') || contains(github.event.comment.body, 'Oracle adjudication: ') || (github.event.action == 'edited' && (contains(github.event.changes.body.from, 'Stand-in oracle review: APPROVE') || contains(github.event.changes.body.from, 'Omp candidate check: ') || contains(github.event.changes.body.from, 'Oracle adjudication: ')))) && format('ignored-{0}', github.run_id)) || (github.event_name == 'workflow_run' && format('bridge-{0}', github.event.workflow_run.head_sha)) || github.event.pull_request.number || github.event.issue.number || inputs.pr || format('run-{0}', github.run_id) }}"
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  gate:
    permissions:
      actions: write
      contents: read
      pull-requests: read
    uses: joeharris76/theseus/.github/workflows/gate.yml@6e5765e56b05ca0765cdd5273a8c1215e64756a2
    with:
      environment: oracle
      theseus_ref: 6e5765e56b05ca0765cdd5273a8c1215e64756a2
      gated_base: develop
    secrets:
      ORACLE_APP_ID: ${{ secrets.ORACLE_APP_ID }}
      ORACLE_APP_PRIVATE_KEY: ${{ secrets.ORACLE_APP_PRIVATE_KEY }}
