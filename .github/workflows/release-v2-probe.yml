name: Release v2 probe

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: release-v2-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: release-v2 probe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Check the release-v2 job graph under every probe and real outcome
        run: |
          set -euo pipefail
          uv run --locked --no-dev -- python scripts/release_probe_graph.py

      - name: Run every probe variant when a release input changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/release_probe_launch.py \
            --repository "$REPOSITORY" \
            --pull-request "$PULL_REQUEST" \
            --branch "$HEAD_BRANCH" \
            --head-sha "$HEAD_SHA" \
            --timeout-seconds 1200
