name: Site and docs


env:
  BENCHBOX_TEST_LOCK_WAIT_SECONDS: "0"

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches-ignore: [release]

concurrency:
  group: site-docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  site-paths:
    name: site-paths
    runs-on: ubuntu-latest
    outputs:
      viz-needed: ${{ steps.classify.outputs.viz-needed }}
      explorer-vitest-needed: ${{ steps.classify.outputs.explorer-vitest-needed }}
      explorer-paths-needed: ${{ steps.classify.outputs.explorer-paths-needed }}
      site-theme-needed: ${{ steps.classify.outputs.site-theme-needed }}
      site-needed: ${{ steps.classify.outputs.site-needed }}
      site-parity-needed: ${{ steps.classify.outputs.site-parity-needed }}
      unit-explorer: ${{ steps.units.outputs.unit-explorer }}
      docs-paths-changed: ${{ steps.docs-paths.outputs.changed }}
      site-changed: ${{ steps.site-inputs.outputs.changed }}
      site-render-changed: ${{ steps.site-inputs.outputs.render_changed }}
      site-source-sha: ${{ steps.site-inputs.outputs.source_sha }}
      site-base-sha: ${{ steps.site-inputs.outputs.base_sha }}
      site-baseline-candidates: ${{ steps.site-inputs.outputs.baseline_candidates }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref || 'develop' }}:refs/remotes/origin/${{ github.base_ref || 'develop' }}"

      - name: Classify changed paths
        id: classify
        run: |
          python scripts/path_filter_decision.py \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --json-out site-path-decision.json \
            --lists-dir .ci-paths \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Flag changed docs paths
        id: docs-paths
        run: |
          set -euo pipefail
          if [ -s .ci-paths/docs.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Classify merge units
        id: units
        run: |
          python scripts/ci_units.py \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --json-out site-unit-decision.json \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload path decision
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: site-path-decision
          path: |
            site-path-decision.json
            site-unit-decision.json
          retention-days: 30

      - name: Classify site inputs and validate recovery source
        id: site-inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RECOVERY_SOURCE_SHA: ${{ inputs.baseline_source_sha }}
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$CURRENT_SHA"
          if [ -n "$RECOVERY_SOURCE_SHA" ]; then
            if [ "$EVENT_NAME" != workflow_dispatch ] || [ "$CURRENT_REF" != refs/heads/develop ] || [[ ! "$RECOVERY_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Recovery requires a full lowercase SHA dispatched on develop."
              exit 1
            fi
            git fetch origin develop
            git merge-base --is-ancestor "$RECOVERY_SOURCE_SHA" origin/develop || {
              echo "::error::Recovery source must be an ancestor of protected develop."
              exit 1
            }
            SOURCE_SHA="$RECOVERY_SOURCE_SHA"
          fi
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          BASE_SHA="$PR_BASE_SHA"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" != pull_request ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'render_changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Missing exact PR base SHA."
            exit 1
          fi
          git cat-file -e "$BASE_SHA^{commit}" || {
            echo "::error::Exact base commit is unavailable."
            exit 1
          }
          SITE_PATHS=(
            benchbox/ docs/ examples/ landing/ website/
            _project/scripts/explorer_pipeline/
            _project/scripts/explorer_publish.py
            _project/scripts/results_explorer_snapshot_invariants.py
            results-data/ results-explorer/
            scripts/assemble_public_site.py
            scripts/capture_chart_images.py
            scripts/check_doc_relative_links.py
            scripts/check_example_syntax.py
            scripts/generate_compat_docs.py
            scripts/generate_landing_quickstarts.py
            scripts/generate_query_docs.py
            scripts/publication/
            scripts/site_inputs.py
            scripts/site_inventory.py
            scripts/validate_example_references.py
            scripts/validate_visualization_images.py
            .github/workflows/site-docs.yml .github/workflows/docs.yml Makefile README.md pyproject.toml uv.lock
          )
          RENDER_PATHS=(
            docs/ landing/ examples/ results-data/ results-explorer/ website/
            _project/scripts/explorer_pipeline/
            _project/scripts/explorer_publish.py
            _project/scripts/results_explorer_snapshot_invariants.py
            scripts/assemble_public_site.py scripts/generate_landing_quickstarts.py
            scripts/generate_query_docs.py scripts/generate_compat_docs.py
            benchbox/__init__.py benchbox/cli/ benchbox/core/platform_registry.py
            benchbox/core/benchmark_registry.py benchbox/platforms/manifest.py
            .github/workflows/site-docs.yml .github/workflows/docs.yml README.md pyproject.toml uv.lock
          )
          CHANGED_PATHS=$(git diff --name-only "$BASE_SHA"...HEAD -- "${SITE_PATHS[@]}")
          if [ -z "$CHANGED_PATHS" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          RENDER_CHANGED_PATHS=$(git diff --name-only "$BASE_SHA"...HEAD -- "${RENDER_PATHS[@]}")
          if [ -z "$RENDER_CHANGED_PATHS" ]; then
            echo 'render_changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'render_changed=true' >> "$GITHUB_OUTPUT"
          fi
          CANDIDATES="$BASE_SHA"
          ANCESTORS=$(git rev-list --first-parent --max-count=25 "$BASE_SHA^" 2>/dev/null || true)
          for ANCESTOR in $ANCESTORS; do
            git diff --quiet "$ANCESTOR" "$BASE_SHA" -- "${RENDER_PATHS[@]}" || break
            CANDIDATES="$CANDIDATES $ANCESTOR"
          done
          echo "baseline_candidates=$CANDIDATES" >> "$GITHUB_OUTPUT"

  explorer-tokens:
    name: explorer-tokens
    needs: site-paths
    if: ${{ needs.site-paths.outputs.explorer-paths-needed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref || 'develop' }}:refs/remotes/origin/${{ github.base_ref || 'develop' }}"

      - name: Run explorer token scan
        run: make lint-explorer-tokens

  explorer-vitest:
    name: explorer-vitest
    needs: site-paths
    if: ${{ needs.site-paths.outputs.explorer-vitest-needed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: results-explorer/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Install explorer dependencies
        run: npm ci
        working-directory: results-explorer

      - name: Run Explorer Vitest suite
        run: npm test -- --run
        working-directory: results-explorer

  parity-check:
    name: parity-check
    needs: site-paths
    if: ${{ needs.site-paths.outputs.viz-needed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Verify parity fixtures match Python source
        run: make parity-check

  explorer-e2e:
    needs: site-paths
    name: Chromium (full suite, blocking)
    if: ${{ needs.site-paths.outputs.unit-explorer == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: results-explorer/package-lock.json

      - name: Install explorer dependencies
        run: npm ci
        working-directory: results-explorer

      - name: Typecheck explorer e2e harness
        run: npm run typecheck:e2e
        working-directory: results-explorer

      - name: Audit frontend dependencies
        run: npm run audit:high
        working-directory: results-explorer

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('results-explorer/package-lock.json') }}

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium
        working-directory: results-explorer

      - name: Run Chromium suite
        run: npm run test:e2e:chromium
        working-directory: results-explorer

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: playwright-report-chromium
          path: |
            results-explorer/playwright-report
            results-explorer/test-results
          if-no-files-found: ignore
          retention-days: 3

  site-theme-tokens:
    name: site-theme-tokens
    needs: site-paths
    if: ${{ needs.site-paths.outputs.site-theme-needed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref || 'develop' }}:refs/remotes/origin/${{ github.base_ref || 'develop' }}"

      - name: Run public site theme token scan
        run: make lint-site-theme-tokens

  docs-build:
    needs: site-paths
    if: needs.site-paths.outputs.site-changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      site-uploaded: ${{ steps.site-artifact.outputs.uploaded }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.site-paths.outputs.site-source-sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Run codespell
        continue-on-error: true
        timeout-minutes: 10
        run: >-
          uvx --from 'codespell[toml]==2.4.3' codespell
          --ignore-words .codespell-ignore.txt
          --skip "*.pyc,_build,*.json,*.lock,*.svg,*.min.js,*.min.css,_binaries,*.tpl,*.dst,*.tbl,_sources,benchmark_runs,*.dat,*.pdf,_project,_blog,htmlcov,.venv"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Cache Sphinx build artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            docs/_build
          key: ${{ runner.os }}-sphinx-${{ hashFiles('docs/**', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-sphinx-

      - name: Generate documentation inputs
        run: make docs-generate

      - name: Build documentation
        run: |
          cd docs
          uv run sphinx-build -b html -W --keep-going . _build/html

      - name: Validate results-explorer lockfile
        if: hashFiles('results-explorer/package.json') != ''
        run: |
          test -f results-explorer/package-lock.json || {
            echo "results-explorer/package-lock.json is required for npm ci" >&2
            exit 1
          }

      - name: Set up Node.js
        if: hashFiles('results-explorer/package.json') != ''
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: results-explorer/package-lock.json

      - name: Install results-explorer dependencies
        if: hashFiles('results-explorer/package.json') != ''
        run: npm ci
        working-directory: results-explorer

      - name: Verify curated Explorer publication inputs
        if: hashFiles('results-explorer/package.json') != ''
        run: |
          test -d results-data/bundles
          test -d _project/scripts/explorer_pipeline
          test -f _project/scripts/explorer_publish.py
          test -f _project/scripts/results_explorer_snapshot_invariants.py

      - name: Typecheck results-explorer
        if: hashFiles('results-explorer/package.json') != ''
        run: npm run typecheck
        working-directory: results-explorer

      - name: Build explorer data (static pipeline)
        if: hashFiles('results-explorer/package.json') != ''
        run: uv run -- python _project/scripts/explorer_publish.py build --data-dir results-data/ --output results-explorer/public/data/

      - name: Validate explorer snapshot invariants
        if: hashFiles('results-explorer/package.json') != ''
        run: |
          test -s results-explorer/public/data/results.duckdb
          uv run -- python _project/scripts/results_explorer_snapshot_invariants.py results-explorer/public/data/results.duckdb

      - name: Build results-explorer
        if: hashFiles('results-explorer/package.json') != ''
        run: npm run build
        working-directory: results-explorer

      - name: Assemble public site
        run: uv run -- python scripts/assemble_public_site.py --site-dir site

      - name: Scan assembled site for privacy leaks
        run: uv run python scripts/publication/check_artifact_privacy.py site

      - name: Upload HTML artifacts
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
          include-hidden-files: true

      - name: Upload assembled site for visual acceptance
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: public-site-assembled-${{ github.run_id }}
          path: site
          retention-days: 3

      - name: Record that the assembled site was uploaded
        id: site-artifact
        run: echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: Validate example file references
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: uv run python scripts/validate_example_references.py

      - name: Check example file syntax
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: uv run python scripts/check_example_syntax.py

      - name: Validate docs references
        if: ${{ !cancelled() && needs.site-paths.outputs.docs-paths-changed == 'true' }}
        timeout-minutes: 10
        run: make docs-validate

  public-site-visual-regression:
    name: Public-site visual regression
    if: ${{ !cancelled() && needs.docs-build.outputs.site-uploaded == 'true' && needs.site-paths.outputs.site-render-changed == 'true' && github.event_name == 'pull_request' }}
    needs: [site-paths, docs-build]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.site-paths.outputs.site-source-sha }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: results-explorer/package-lock.json

      - name: Download assembled site
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: public-site-assembled-${{ github.run_id }}
          path: site

      - name: Install explorer dependencies
        run: npm ci
        working-directory: results-explorer

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: results-explorer

      - name: Capture public site
        env:
          E2E_PAGES_SHAPED: "1"
          E2E_SITE_DIR: ${{ github.workspace }}/site
          PUBLIC_SITE_VISUAL_PHASE: capture
          PUBLIC_SITE_VISUAL_OUTPUT: ${{ runner.temp }}/public-site-visual-current
          PUBLIC_SITE_VISUAL_SOURCE_SHA: ${{ needs.site-paths.outputs.site-source-sha }}
        run: npm run test:e2e:public-site
        working-directory: results-explorer

      - name: Download visual baseline for base or site-equivalent ancestor
        id: baseline
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLIC_SITE_VISUAL_BASE_SHA: ${{ needs.site-paths.outputs.site-base-sha }}
          PUBLIC_SITE_VISUAL_BASELINE_CANDIDATES: ${{ needs.site-paths.outputs.site-baseline-candidates }}
          PUBLIC_SITE_VISUAL_BASELINE: ${{ runner.temp }}/public-site-visual-baseline
          PUBLIC_SITE_VISUAL_BASELINE_WAIT_SECONDS: "4800"
        run: node scripts/download-public-site-visual-baseline.mjs
        working-directory: results-explorer

      - name: Compare public site with exact base
        if: github.event_name == 'pull_request'
        env:
          E2E_PAGES_SHAPED: "1"
          E2E_SITE_DIR: ${{ github.workspace }}/site
          PUBLIC_SITE_VISUAL_PHASE: compare
          PUBLIC_SITE_VISUAL_OUTPUT: ${{ runner.temp }}/public-site-visual-current
          PUBLIC_SITE_VISUAL_BASELINE: ${{ runner.temp }}/public-site-visual-baseline
          PUBLIC_SITE_VISUAL_BASE_SHA: ${{ steps.baseline.outputs.baseline_sha }}
          PUBLIC_SITE_VISUAL_REQUIRE_BASELINE: "1"
          PUBLIC_SITE_VISUAL_SOURCE_SHA: ${{ needs.site-paths.outputs.site-source-sha }}
          PR_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          APPROVED_HEAD_SHA: ${{ github.event_name == 'pull_request' && vars.APPROVED_HEAD_SHA || '' }}
          APPROVAL_REASON: ${{ github.event_name == 'pull_request' && vars.APPROVAL_REASON || '' }}
        run: npm run test:e2e:public-site
        working-directory: results-explorer

      - name: Upload protected-develop visual baseline
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: public-site-visual-baseline-${{ needs.site-paths.outputs.site-source-sha }}
          path: ${{ runner.temp }}/public-site-visual-current
          retention-days: 30

      - name: Upload visual diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: public-site-visual-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/public-site-visual-current
            results-explorer/test-results
            results-explorer/playwright-report
          if-no-files-found: ignore
          retention-days: 3

  site-build:
    name: site-build
    needs: site-paths
    if: ${{ needs.site-paths.outputs.site-needed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            results-explorer/package-lock.json
            website/package-lock.json

      - name: Install results-explorer dependencies
        run: npm ci
        working-directory: results-explorer

      - name: Build explorer data
        run: uv run -- python _project/scripts/explorer_publish.py build --data-dir results-data/ --output results-explorer/public/data/

      - name: Build results-explorer
        run: npm run build
        working-directory: results-explorer

      - name: Install website dependencies
        run: npm ci
        working-directory: website

      - name: Typecheck, audit and build website
        run: make site-check site-build

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('website/package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: website

      - name: Test built website and not-found fallback
        run: make site-test-built

      - name: Scan website output for privacy leaks
        run: uv run python scripts/publication/check_artifact_privacy.py website/dist

      - name: Capture public site from the Astro build
        if: ${{ !cancelled() && hashFiles('website/dist/results/index.html') != '' }}
        continue-on-error: true
        timeout-minutes: 15
        run: make site-visual-capture SITE_VISUAL_DIR=${{ runner.temp }}/public-site-visual-astro SITE_VISUAL_SOURCE_SHA=${{ github.sha }}

      - name: Upload Astro visual captures
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: public-site-visual-astro-${{ github.run_id }}
          path: ${{ runner.temp }}/public-site-visual-astro
          if-no-files-found: ignore
          retention-days: 3

  site-parity:
    name: site-parity
    needs: site-paths
    if: ${{ needs.site-paths.outputs.site-parity-needed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            results-explorer/package-lock.json
            website/package-lock.json

      - name: Install results-explorer dependencies
        run: npm ci
        working-directory: results-explorer

      - name: Build explorer data
        run: uv run -- python _project/scripts/explorer_publish.py build --data-dir results-data/ --output results-explorer/public/data/

      - name: Build results-explorer
        run: npm run build
        working-directory: results-explorer

      - name: Generate Explorer browser fixtures
        run: npm run test:e2e:fixtures
        working-directory: results-explorer

      - name: Install website dependencies
        run: npm ci
        working-directory: website

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('website/package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: website

      - name: Compare the Astro build with the Sphinx site
        run: make site-parity SITE_PARITY_SHA=${{ github.event.pull_request.head.sha || github.sha }}

      - name: Upload the URL compatibility report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: url-compatibility-report
          path: |
            site-parity/report
            site-parity/browser-report.json
          if-no-files-found: ignore
          retention-days: 30

  explorer:
    name: explorer
    needs: [site-paths, explorer-tokens, explorer-vitest, parity-check, explorer-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout the result helper
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci_unit_result.py
          sparse-checkout-cone-mode: false

      - name: Aggregate explorer result
        id: aggregate
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          python scripts/ci_unit_result.py \
            --unit explorer \
            --needs "$NEEDS_JSON" \
            --always site-paths \
            --expect explorer-tokens=${{ needs.site-paths.outputs.explorer-paths-needed == 'true' }} \
            --expect explorer-vitest=${{ needs.site-paths.outputs.explorer-vitest-needed == 'true' }} \
            --expect parity-check=${{ needs.site-paths.outputs.viz-needed == 'true' }} \
            --expect explorer-e2e=${{ needs.site-paths.outputs.unit-explorer == 'true' }} || {
            rc=$?
            if [ "$rc" -eq 3 ]; then
              echo "superseded=true" >> "$GITHUB_OUTPUT"
            fi
            exit "$rc"
          }

      - name: Cancel superseded run so the aggregate concludes cancelled
        if: always() && cancelled() && steps.aggregate.outputs.superseded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}" || true
          sleep 90

  docs:
    name: docs
    needs: [site-paths, docs-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout the result helper
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci_unit_result.py
          sparse-checkout-cone-mode: false

      - name: Aggregate docs result
        id: aggregate
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          python scripts/ci_unit_result.py \
            --unit docs \
            --needs "$NEEDS_JSON" \
            --always site-paths \
            --expect docs-build=${{ needs.site-paths.outputs.site-changed == 'true' }} || {
            rc=$?
            if [ "$rc" -eq 3 ]; then
              echo "superseded=true" >> "$GITHUB_OUTPUT"
            fi
            exit "$rc"
          }

      - name: Cancel superseded run so the aggregate concludes cancelled
        if: always() && cancelled() && steps.aggregate.outputs.superseded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}" || true
          sleep 90

  landing:
    name: landing
    needs: [site-paths, site-theme-tokens, site-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout the result helper
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci_unit_result.py
          sparse-checkout-cone-mode: false

      - name: Aggregate landing result
        id: aggregate
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          python scripts/ci_unit_result.py \
            --unit landing \
            --needs "$NEEDS_JSON" \
            --always site-paths \
            --expect site-theme-tokens=${{ needs.site-paths.outputs.site-theme-needed == 'true' }} \
            --expect site-build=${{ needs.site-paths.outputs.site-needed == 'true' }} || {
            rc=$?
            if [ "$rc" -eq 3 ]; then
              echo "superseded=true" >> "$GITHUB_OUTPUT"
            fi
            exit "$rc"
          }

      - name: Cancel superseded run so the aggregate concludes cancelled
        if: always() && cancelled() && steps.aggregate.outputs.superseded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}" || true
          sleep 90
