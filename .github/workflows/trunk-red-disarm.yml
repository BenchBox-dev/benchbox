name: Trunk Red Disarm

run-name: trunk-red-disarm (${{ github.event.workflow_run.head_sha }})

on:
  workflow_run:
    workflows: [Trunk]
    types:
      - completed

concurrency:
  group: trunk-red-disarm
  cancel-in-progress: false

permissions:
  pull-requests: write
  actions: read
  contents: write

jobs:
  disarm:
    name: disarm armed PRs
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the disarm scripts with full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          sparse-checkout: |
            scripts/trunk_revert.py
            scripts/trunk_red_disarm.py
          sparse-checkout-cone-mode: false

      - name: Disarm auto-merge where the arm gate would refuse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python scripts/trunk_red_disarm.py --repo "$REPO"
