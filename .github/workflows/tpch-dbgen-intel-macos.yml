name: TPC-H dbgen Intel macOS

env:
  BENCHBOX_HEAVY_ADMIT_MIN_GIB: "1.5"
  BENCHBOX_HEAVY_MIN_FREE_DISK_GIB: "5"
  BENCHBOX_HEAVY_MIN_LEVEL: "20"

on:
  schedule:
    - cron: "45 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "benchbox/_binaries/tpc-h/darwin-x86_64/**"
      - "_sources/tpc-h/dbgen/**"
      - "tests/unit/core/tpch/test_tpch_dbgen_framing_binaries.py"
      - ".github/workflows/tpch-dbgen-intel-macos.yml"

permissions:
  contents: read

concurrency:
  group: tpch-dbgen-intel-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dbgen:
    name: Bundled darwin-x86_64 dbgen
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync

      - name: Require an Intel host and the bundled binary
        run: |
          test "$(uname -m)" = "x86_64"
          test "$(uv run -- python -c 'import platform; print(platform.machine())')" = "x86_64"
          file benchbox/_binaries/tpc-h/darwin-x86_64/dbgen
          test -x benchbox/_binaries/tpc-h/darwin-x86_64/dbgen

      - name: Compare supplier and customer hashes with the canonical values
        run: |
          uv run -- python - <<'PY'
          import runpy
          import sys
          from hashlib import sha256

          guard = runpy.run_path("tests/unit/core/tpch/test_tpch_dbgen_framing_binaries.py")
          dbgen = guard["_dbgen_in"](guard["_BINARIES_ROOT"] / "darwin-x86_64")
          failed = False
          for table, expected in sorted(guard["_CANONICAL_SF001_SHA256"].items()):
              rows = guard["_generate_rows"](dbgen, table)
              if rows is None:
                  sys.exit(f"{dbgen} could not be executed on this host")
              actual = sha256("".join(f"{row}\n" for row in rows).encode()).hexdigest()
              print(f"darwin-x86_64 dbgen -T {table} -s 0.01: {actual} (expected {expected})")
              failed |= actual != expected
          sys.exit(1 if failed else 0)
          PY

      - name: Run the bundled-binary guard tests
        run: uv run -- pytest tests/unit/core/tpch/test_tpch_dbgen_framing_binaries.py -n 0 -v -m slow -p no:cacheprovider
