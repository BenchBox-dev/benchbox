name: Release v2 probe verdict

on:
  workflow_run:
    workflows: ["Release v2"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-v2-probe-verdict-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  verdict:
    name: release-v2 probe verdict
    if: ${{ github.event.workflow_run.event == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Complete the probe check when every variant run has finished
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          python3 -m scripts.release_probe_verdict --repository "$REPOSITORY" --run-id "$RUN_ID"
