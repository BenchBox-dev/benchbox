name: TODO Git state validation

on:
  schedule:
    - cron: '0 9 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: todo-state-validate
  cancel-in-progress: false

jobs:
  validate:
    name: Validate TODO Git state
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout develop
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: develop
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Sync locked package-only runtime
        run: uv sync --project _project/scripts --locked

      - name: Validate authoritative state branch
        run: >-
          uv run --project _project/scripts --locked --
          tractable validate
          --config .tractable/config.json
          --repo-root "$GITHUB_WORKSPACE"
