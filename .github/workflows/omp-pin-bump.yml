name: Omp pin bump

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omp-pin-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Prepare an omp pin bump
    if: github.repository == 'BenchBox-dev/BenchBox'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      state: ${{ steps.prepare.outputs.state }}
      version: ${{ steps.prepare.outputs.version }}
      base: ${{ steps.prepare.outputs.base }}

    steps:
      - name: Checkout develop
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Check the latest stable omp build against the pin
        id: prepare
        env:
          OUT_DIR: ${{ runner.temp }}/omp-bump
        run: |
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          uv run --isolated --no-project --python 3.12 --with pyyaml==6.0.3 -- \
            python -m _project.scripts.oracle_reviewers.omp_bump prepare \
            --policy .github/oracle-reviewers.yml --out-dir "$OUT_DIR"

      - name: Report the candidate
        if: always() && steps.prepare.outputs.state != ''
        env:
          OUT_DIR: ${{ runner.temp }}/omp-bump
          STATE: ${{ steps.prepare.outputs.state }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          {
            echo "## omp ${VERSION}: ${STATE}"
            echo
            echo '```'
            cat "$OUT_DIR/detail.txt"
            echo '```'
            if [ -f "$OUT_DIR/pr-body.md" ]; then
              cat "$OUT_DIR/pr-body.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hand the prepared bump to the pull request job
        if: steps.prepare.outputs.state == 'ready'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: omp-bump
          path: |
            ${{ runner.temp }}/omp-bump/policy.yml
            ${{ runner.temp }}/omp-bump/pr-body.md
          if-no-files-found: error

  open-pr:
    name: Open the omp pin bump pull request
    needs: bump
    if: github.repository == 'BenchBox-dev/BenchBox' && needs.bump.outputs.state == 'ready'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the prepared bump
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: omp-bump
          path: ${{ runner.temp }}/omp-bump

      - name: Open the bump pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_DIR: ${{ runner.temp }}/omp-bump
          VERSION: ${{ needs.bump.outputs.version }}
          PREPARED_BASE: ${{ needs.bump.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9._-]+)?$ ]]; then
            echo "refusing a version that is not a release number: ${VERSION}" >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$PREPARED_BASE" ]; then
            echo "develop changed after candidate validation; rerun preparation before publishing." >&2
            exit 1
          fi
          BRANCH="chore/omp-pin-${VERSION}"
          existing="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=all&base=develop&head=${GITHUB_REPOSITORY%%/*}:${BRANCH}&per_page=100" | jq 'add')"
          PR="$(printf '%s\n' "$existing" | jq -r '[.[] | select(.state == "open")][0].number // empty')"
          git config user.name "benchbox-bot"
          git config user.email "bot@benchbox.dev"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          if [ -z "$PR" ]; then
            if [ "$(printf '%s\n' "$existing" | jq 'length')" != 0 ]; then
              echo "A closed pull request for ${BRANCH} already exists; nothing to open."
              exit 0
            fi
            git show-ref --verify --quiet "refs/remotes/origin/${BRANCH}" && {
              echo "Refusing to overwrite an existing branch without an open pull request." >&2
              exit 1
            }
            git checkout -b "$BRANCH"
            cp "$OUT_DIR/policy.yml" .github/oracle-reviewers.yml
            git add .github/oracle-reviewers.yml
            git commit -m "chore(oracle): pin omp ${VERSION}"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" push origin "$BRANCH"
            PR="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" \
              -f title="chore(oracle): pin omp ${VERSION}" -F body=@"$OUT_DIR/pr-body.md" \
              -f base=develop -f head="$BRANCH" --jq .number)"
          else
            if ! printf '%s\n' "$existing" | jq -e --arg repo "$GITHUB_REPOSITORY" '
              .[] | select(.state == "open") |
              .user.login == "github-actions[bot]" and
              (.head.repo.full_name | ascii_downcase) == ($repo | ascii_downcase) and
              ([.labels[].name] | index("no-auto-merge") | not)
            ' > /dev/null; then
              echo "Refusing to refresh a held or non-automation pull request." >&2
              exit 1
            fi
            EXPECTED_HEAD="$(printf '%s\n' "$existing" | jq -r '.[] | select(.state == "open") | .head.sha')"
            git fetch origin "$BRANCH"
            git checkout -b "$BRANCH" FETCH_HEAD
            if [ "$(git rev-parse HEAD)" != "$EXPECTED_HEAD" ]; then
              echo "Candidate changed during refresh; refusing to update it." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$PREPARED_BASE" HEAD; then
              git merge --no-commit --no-ff "$PREPARED_BASE"
            fi
            if ! cmp -s .github/oracle-reviewers.yml "$OUT_DIR/policy.yml" ||
              ! git diff --quiet "$PREPARED_BASE" -- . ':!.github/oracle-reviewers.yml'; then
              echo "Candidate differs from the validated pin-only change; leaving it unchanged." >&2
              exit 1
            fi
            if git rev-parse --quiet --verify MERGE_HEAD > /dev/null; then
              git commit -m "chore(oracle): refresh omp ${VERSION} against current policy"
              git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" push origin "$BRANCH"
            fi
          fi
          older="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=develop&per_page=100" |
            jq -r --arg repo "$GITHUB_REPOSITORY" --arg version "$VERSION" '
              def release: capture("^(?<major>[0-9]+)[.](?<minor>[0-9]+)[.](?<patch>[0-9]+)$") |
                [.major, .minor, .patch] | map(tonumber);
              add[] |
              select(.user.login == "github-actions[bot]") |
              select((.head.repo.full_name | ascii_downcase) == ($repo | ascii_downcase)) |
              select([.labels[].name] | index("no-auto-merge") | not) |
              select(.head.ref | startswith("chore/omp-pin-")) |
              select((.head.ref | ltrimstr("chore/omp-pin-") | release) < ($version | release)) |
              .number')"
          for OLD_PR in $older; do
            gh pr close "$OLD_PR" --repo "$GITHUB_REPOSITORY" \
              --comment "Superseded by #${PR}, which proposes omp ${VERSION}. The replacement still requires candidate validation and all merge gates."
          done
          HEAD_SHA="$(git rev-parse HEAD)"
          verdicts="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/statuses?per_page=100" --jq '.[] | select(.context == "oracle-verdict") | .id')"
          titles="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/oracle-verdict.yml/runs?per_page=100" --jq '.workflow_runs[].display_title')"
          if [ -n "$verdicts" ] || printf '%s\n' "$titles" | grep -F "pr=${PR} head=${HEAD_SHA}" > /dev/null; then
            echo "Pull request #${PR} already has a review for ${HEAD_SHA}."
            exit 0
          fi
          gh workflow run oracle-verdict.yml --repo "$GITHUB_REPOSITORY" --ref develop -f pr="$PR" -f head="$HEAD_SHA"
