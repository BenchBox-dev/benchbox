name: Fast duration baseline refresh

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-duration-baseline-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Regenerate the fast-tier duration baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          token: ${{ secrets.CROSS_SURFACE_BASELINE_PR_TOKEN || github.token }}

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Fetch recent merged-PR fast-junit artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_RUNS_SCAN: "60"
          MAX_SOURCE_RUNS: "20"
          API_CALL_BUDGET: "120"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fast-refresh/runs
          : > fast-refresh/api-calls.log
          calls=0
          api_call() {
            calls=$((calls + 1))
            echo "call $calls: $*" >> fast-refresh/api-calls.log
            if [ "$calls" -gt "$API_CALL_BUDGET" ]; then
              echo "API call budget $API_CALL_BUDGET exceeded" >&2
              exit 1
            fi
          }
          api_call "run list --workflow ci.yml --limit $MAX_RUNS_SCAN"
          gh run list --workflow ci.yml --limit "$MAX_RUNS_SCAN" \
            --json databaseId,status,conclusion > fast-refresh/ci-runs.json
          python3 - <<'PY' > fast-refresh/run-ids.txt
          import json
          runs = json.load(open("fast-refresh/ci-runs.json"))
          for run in runs:
              if run["status"] == "completed" and run.get("conclusion") == "success":
                  print(run["databaseId"])
          PY
          : > fast-refresh/manifest.json
          echo "[" > fast-refresh/manifest.json
          first=1
          kept=0
          declare -A seen_pr=()
          while read -r run_id; do
            [ "$kept" -ge "$MAX_SOURCE_RUNS" ] && break
            api_call "run $run_id artifacts"
            names=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/artifacts?per_page=100" \
              -q '.artifacts[] | select(.name | startswith("fast-junit-")) | "\(.id) \(.name) \(.expired)"')
            [ -z "$names" ] && continue
            while read -r artifact_id name expired; do
              [ "$kept" -ge "$MAX_SOURCE_RUNS" ] && break
              [ "$expired" = "true" ] && continue
              case "$name" in fast-junit-trunk-*) continue;; esac
              case "$name" in fast-junit-[0-9]*-*) ;;
                *) continue;;
              esac
              pr_number="${name#fast-junit-}"
              pr_number="${pr_number%%-*}"
              case "$pr_number" in ''|*[!0-9]*) continue;; esac
              [ -n "${seen_pr[$pr_number]:-}" ] && continue
              api_call "pr $pr_number state"
              state=$(gh pr view "$pr_number" --json state -q .state 2>/dev/null || echo UNKNOWN)
              echo "run $run_id artifact $artifact_id pr $pr_number state $state" >> fast-refresh/api-calls.log
              [ "$state" = "MERGED" ] || continue
              sha="${name##*-}"
              if [ "$first" -eq 1 ]; then first=0; else echo "," >> fast-refresh/manifest.json; fi
              printf '  {"run_id": %s, "pr": %s, "sha": "%s", "artifact_id": %s, "dir": "fast-refresh/runs/run-%s"}' \
                "$run_id" "$pr_number" "$sha" "$artifact_id" "$run_id" >> fast-refresh/manifest.json
              api_call "run $run_id download $name"
              gh run download "$run_id" -n "$name" -D "fast-refresh/runs/run-$run_id" >> fast-refresh/api-calls.log 2>&1
              seen_pr[$pr_number]=1
              kept=$((kept + 1))
            done <<< "$names"
          done < fast-refresh/run-ids.txt
          echo "" >> fast-refresh/manifest.json
          echo "]" >> fast-refresh/manifest.json
          echo "kept=$kept" >> "$GITHUB_OUTPUT"
          {
            echo "## Source runs"
            echo ""
            echo "Kept $kept merged-PR fast-junit artifacts (budget $API_CALL_BUDGET calls, used $calls)."
            echo ""
          } > fast-refresh/source-runs.md

      - name: Build the refreshed baseline
        run: |
          uv run -- python -m scripts.build_fast_duration_baseline build \
            --manifest fast-refresh/manifest.json \
            --output tests/fixtures/fast_tier_baseline

      - name: Collect the current fast tier
        shell: bash
        run: |
          set -euo pipefail
          uv run -- python -m pytest --collect-only -q -p no:cacheprovider -n 0 --assert=plain \
            -m "fast and not (slow or stress or resource_heavy or live_integration)" tests/ \
            | grep -E "^tests/.*::" | sort -u > fast-refresh/collected-ids.txt
          wc -l fast-refresh/collected-ids.txt

      - name: Gate-check the refreshed baseline
        run: |
          uv run -- python -m scripts.build_fast_duration_baseline check \
            --baseline tests/fixtures/fast_tier_baseline \
            --manifest fast-refresh/manifest.json \
            --collected-ids fast-refresh/collected-ids.txt \
            --report-out fast-refresh/gate-report.json

      - name: Check for baseline changes
        id: check
        shell: bash
        run: |
          if git diff --quiet -- tests/fixtures/fast_tier_baseline; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate the docs reference inventory
        if: steps.check.outputs.changed == 'true'
        run: uv run -- python scripts/doc_reference_inventory.py

      - name: Verify the docs reference inventory is current
        if: steps.check.outputs.changed == 'true'
        shell: bash
        run: |
          if ! uv run -- python scripts/doc_reference_inventory.py --check; then
            echo "::error::quality/docs-reference-inventory.json is still stale after regeneration; refusing to open a refresh PR that fails test_doc_reference_inventory"
            exit 1
          fi

      - name: Create refresh PR
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CROSS_SURFACE_BASELINE_PR_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="chore/fast-baseline-$(date -u +%Y%m%d)-${{ github.run_number }}"
          git config user.name "benchbox-bot"
          git config user.email "bot@benchbox.dev"
          git checkout -b "$BRANCH"
          git add tests/fixtures/fast_tier_baseline quality/docs-reference-inventory.json
          git commit -m "chore(ci): refresh the fast-tier duration baseline (run ${{ github.run_number }})"
          git push origin "$BRANCH"
          BODY_FILE="$(mktemp)"
          {
            echo "## Fast-tier duration baseline refresh"
            echo ""
            echo "Automated refresh from workflow run ${{ github.run_number }}."
            cat fast-refresh/source-runs.md
            echo ""
            echo "### Gate check"
            echo ""
            echo '```json'
            cat fast-refresh/gate-report.json
            echo '```'
            echo ""
            echo "### API usage"
            echo ""
            echo '```'
            cat fast-refresh/api-calls.log
            echo '```'
          } > "$BODY_FILE"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            gh pr create --title "chore(ci): refresh the fast-tier duration baseline" \
              --body-file "$BODY_FILE" --base develop --head "$BRANCH"
          fi

  medium:
    name: Refresh the medium-shard durations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          token: ${{ secrets.CROSS_SURFACE_BASELINE_PR_TOKEN || github.token }}

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Fetch the five newest complete Trunk medium runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_RUNS_SCAN: "30"
          SOURCE_RUNS: "5"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fast-refresh/medium
          : > fast-refresh/medium/run-ids.txt
          kept=0
          for run_id in $(gh run list --workflow trunk.yml --branch develop --event push --status success \
            --limit "$MAX_RUNS_SCAN" --json databaseId -q '.[].databaseId'); do
            [ "$kept" -ge "$SOURCE_RUNS" ] && break
            names=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/artifacts?per_page=100" \
              -q '.artifacts[] | select(.expired | not) | .name')
            complete=1
            for prefix in t2-medium-shard-0- t2-medium-shard-1- t2-medium-shard-2- t2-medium-shard-3- t2-medium-nodeids-; do
              if [ "$(printf '%s\n' "$names" | grep -c "^$prefix")" -eq 0 ]; then complete=0; fi
            done
            [ "$complete" -eq 1 ] || continue
            for shard in 0 1 2 3; do
              name=$(printf '%s\n' "$names" | grep "^t2-medium-shard-$shard-" | sed -n 1p)
              gh run download "$run_id" -n "$name" -D "fast-refresh/medium/run-$run_id/shard-$shard"
            done
            if [ "$kept" -eq 0 ]; then
              name=$(printf '%s\n' "$names" | grep "^t2-medium-nodeids-" | sed -n 1p)
              gh run download "$run_id" -n "$name" -D fast-refresh/medium/nodeids
              cp fast-refresh/medium/nodeids/medium-nodeids.txt fast-refresh/medium/collected.txt
            fi
            echo "$run_id" >> fast-refresh/medium/run-ids.txt
            kept=$((kept + 1))
          done
          if [ "$kept" -eq 0 ]; then
            echo "::error::no successful Trunk push run on develop in the newest $MAX_RUNS_SCAN has all four unexpired medium shard artifacts"
            exit 1
          fi
          echo "Kept $kept Trunk runs: $(paste -sd, fast-refresh/medium/run-ids.txt)"

      - name: Report medium-shard drift
        shell: bash
        run: |
          set -euo pipefail
          newest=$(head -1 fast-refresh/medium/run-ids.txt)
          args=()
          for shard in 0 1 2 3; do
            args+=(--shard "fast-refresh/medium/run-$newest/shard-$shard/shard-$shard-junit.xml")
          done
          uv run -- python -m scripts.build_fast_duration_baseline medium-drift \
            --recorded tests/fixtures/medium_shard_durations.json \
            "${args[@]}" \
            --report-out fast-refresh/drift-report.json \
            | tee fast-refresh/drift.md

      - name: Rebuild the medium-shard durations
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while read -r run_id; do
            args+=(--run-dir "fast-refresh/medium/run-$run_id")
          done < fast-refresh/medium/run-ids.txt
          newest=$(head -1 fast-refresh/medium/run-ids.txt)
          ids=$(paste -sd, fast-refresh/medium/run-ids.txt | sed 's/,/, /g')
          uv run -- python -m scripts.build_fast_duration_baseline medium-refresh \
            "${args[@]}" \
            --collected fast-refresh/medium/collected.txt \
            --output tests/fixtures/medium_shard_durations.json \
            --source "Medium shard junit reports from Trunk runs $ids (per-test p95, ids limited to run $newest's collected medium tests)"

      - name: Project the busiest-to-average shard ratio with the refreshed durations
        shell: bash
        run: |
          set -euo pipefail
          newest=$(head -1 fast-refresh/medium/run-ids.txt)
          args=()
          for shard in 0 1 2 3; do
            args+=(--shard "fast-refresh/medium/run-$newest/shard-$shard/shard-$shard-junit.xml")
          done
          uv run -- python -m scripts.build_fast_duration_baseline medium-drift \
            --recorded tests/fixtures/medium_shard_durations.json \
            "${args[@]}" \
            --collected fast-refresh/medium/collected.txt \
            --projected-durations tests/fixtures/medium_shard_durations.json \
            --report-out fast-refresh/drift-after.json > /dev/null

      - name: Check for medium durations changes
        id: check
        shell: bash
        run: |
          if git diff --quiet -- tests/fixtures/medium_shard_durations.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate the docs reference inventory
        if: steps.check.outputs.changed == 'true'
        run: uv run -- python scripts/doc_reference_inventory.py

      - name: Verify the docs reference inventory is current
        if: steps.check.outputs.changed == 'true'
        shell: bash
        run: |
          if ! uv run -- python scripts/doc_reference_inventory.py --check; then
            echo "::error::quality/docs-reference-inventory.json is still stale after regeneration; refusing to open a refresh PR that fails test_doc_reference_inventory"
            exit 1
          fi

      - name: Create medium durations PR
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CROSS_SURFACE_BASELINE_PR_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="chore/medium-durations-$(date -u +%Y%m%d)-${{ github.run_number }}"
          git config user.name "benchbox-bot"
          git config user.email "bot@benchbox.dev"
          git checkout -b "$BRANCH"
          git add tests/fixtures/medium_shard_durations.json quality/docs-reference-inventory.json
          git commit -m "chore(ci): refresh the medium-shard durations (run ${{ github.run_number }})"
          git push origin "$BRANCH"
          BEFORE=$(jq -r '.max_to_mean_shard_seconds // "n/a"' fast-refresh/drift-report.json)
          AFTER=$(jq -r '.projected_max_to_mean_shard_seconds // "n/a"' fast-refresh/drift-after.json)
          BODY_FILE="$(mktemp)"
          {
            echo "## Medium-shard durations refresh"
            echo ""
            echo "Automated refresh from workflow run ${{ github.run_number }} using Trunk runs $(paste -sd, fast-refresh/medium/run-ids.txt | sed 's/,/, /g')."
            echo ""
            echo "Busiest-to-average medium shard junit time: before $BEFORE, projected after $AFTER."
            echo ""
            cat fast-refresh/drift.md
          } > "$BODY_FILE"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            gh pr create --title "chore(ci): refresh the medium-shard durations" \
              --body-file "$BODY_FILE" --base develop --head "$BRANCH"
          fi
