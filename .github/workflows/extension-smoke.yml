name: Extension Smoke

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'benchbox/core/write_primitives/**'
      - 'benchbox/core/read_primitives/**'
      - 'scripts/duckdb_datasketches_smoke.py'
      - 'benchbox/utils/duckdb_extensions.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/extension-smoke.yml'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: extension-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  duckdb-datasketches:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install duckdb only
        run: uv sync --no-dev --no-install-project

      - name: Run datasketches smoke
        run: uv run -- python scripts/duckdb_datasketches_smoke.py
