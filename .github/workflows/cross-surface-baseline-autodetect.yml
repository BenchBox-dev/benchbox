name: Cross-Surface Baseline Auto-Prune


on:
  schedule:
    - cron: '0 10 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cross-surface-baseline-autodetect
  cancel-in-progress: false

env:
  SUMMARY_PATH: _project/cross-surface-baseline-autodetect/summary.json
  PRUNE_BRANCH: chore/cross-surface-baseline-autoprune
  BASELINE_PATH: benchbox/core/equivalence/cross_surface_baseline.yaml

jobs:
  detect-and-prune:
    name: Detect + prune resolved cross-surface baseline entries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout develop
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.CROSS_SURFACE_BASELINE_PR_TOKEN || github.token }}

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Detect resolved entries and prune via the existing writer
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${SUMMARY_PATH}")"
          uv run -- python _project/scripts/cross_surface_baseline_autodetect.py \
            --json-out "${SUMMARY_PATH}"

      - name: Surface gates needing manual attention
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f "${SUMMARY_PATH}" ]; then
            echo "detect step produced no summary - see the failing step above"
            exit 0
          fi
          uv run -- python - <<'PY'
          import json
          import os

          with open(os.environ["SUMMARY_PATH"], encoding="utf-8") as fh:
              summary = json.load(fh)

          for gate in summary.get("needs_attention", []):
              print(
                  f"::warning::{gate}: a resolved cross-surface baseline entry could not be "
                  "fully auto-pruned (a code-only ClassifiedDivergence entry, or another "
                  "failure on the same run) - see the job log above, and prune "
                  "benchbox/core/equivalence/cross_surface.py by hand if needed."
              )
          PY

      - name: Check for baseline changes
        id: diff
        run: |
          set -euo pipefail
          git add "${BASELINE_PATH}"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push prune branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "benchbox-bot"
          git config user.email "benchbox-bot@users.noreply.github.com"
          git fetch --no-tags origin "${PRUNE_BRANCH}:refs/remotes/origin/${PRUNE_BRANCH}" 2>/dev/null || true
          git checkout -B "${PRUNE_BRANCH}"
          git commit -m "chore(equivalence): prune resolved cross-surface baseline entries" \
            -m "Auto-generated by .github/workflows/cross-surface-baseline-autodetect.yml. Only known-divergence entries that no longer reproduce on the enforced gates were removed (via the existing make cross-surface-update-baseline writer); no still-reproducing entry is touched. Soundness-path PR: oracle-review needs the oracle's success review of the head before it can merge."
          git push --force-with-lease origin "${PRUNE_BRANCH}"

      - name: Open or update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CROSS_SURFACE_BASELINE_PR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --base develop --head "${PRUNE_BRANCH}" --state open --json number --jq '.[0].number // empty')"
          body_file="$(mktemp)"
          {
            echo "Automated prune of resolved cross-surface known-divergence baseline entries."
            echo ""
            echo "\`_project/scripts/cross_surface_baseline_autodetect.py\` ran every enforced"
            echo "gate (\`benchbox/core/equivalence/cross_surface.py:GATES\`), read each gate's own"
            echo "\"previously-known divergences now equivalent\" report, and invoked the EXISTING"
            echo "\`--update-baseline\` writer (\`make cross-surface-update-baseline\`) to drop only"
            echo "entries that no longer reproduce. No still-reproducing entry is touched, and the"
            echo "blocking PR gate (\`make <gate>-cross-surface-equivalence-report\`) never prunes -"
            echo "this scheduled workflow is the only path that writes this file."
            echo ""
            echo "**Merge by hand after review.** \`benchbox/core/equivalence/**\` is a soundness"
            echo "path, so the oracle review gate needs the oracle's success review; check the diff (it"
            echo "can only ever REMOVE a resolved entry - see the writer's own contract)."
            echo ""
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "${body_file}"
          if [ -z "${existing}" ]; then
            gh pr create --base develop --head "${PRUNE_BRANCH}" \
              --title "chore(equivalence): prune resolved cross-surface baseline entries" \
              --body-file "${body_file}"
          else
            echo "PR #${existing} already open for ${PRUNE_BRANCH}; updating body."
            gh pr edit "${existing}" --body-file "${body_file}"
          fi

      - name: No changes
        if: steps.diff.outputs.changed == 'false'
        run: echo "No resolved cross-surface baseline entries this run - nothing to prune."

      - name: Upload autodetect summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: cross-surface-baseline-autodetect-summary
          path: ${{ env.SUMMARY_PATH }}
          retention-days: 30
