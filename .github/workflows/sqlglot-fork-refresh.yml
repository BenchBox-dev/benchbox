name: SQLGlot fork refresh

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sqlglot-fork-refresh
  cancel-in-progress: false

env:
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  prepare:
    name: Refresh the fork checkout onto a new upstream tag
    if: github.repository == 'BenchBox-dev/BenchBox' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      state: ${{ steps.prepare.outputs.state }}

    steps:
      - name: Checkout develop
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout the fork
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: BenchBox-dev/benchbox-sqlglot
          ref: main
          path: fork
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Refresh onto the newest upstream tag when every patch applies
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/sqlglot_fork_refresh.py prepare --clone fork --out-dir "$RUNNER_TEMP/refresh"

      - name: Report the outcome
        if: always()
        run: |
          {
            echo "## SQLGlot fork refresh"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/refresh/state.json" 2>/dev/null || echo '{}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hand the result to the later jobs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: sqlglot-refresh
          path: |
            ${{ runner.temp }}/refresh/state.json
            ${{ runner.temp }}/refresh/refresh.bundle
          if-no-files-found: ignore

  open-pr:
    name: Push the refresh and open the fork pull request
    needs: prepare
    if: github.repository == 'BenchBox-dev/BenchBox' && github.ref == 'refs/heads/develop' && needs.prepare.outputs.state == 'ready'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout develop
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout the fork
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: BenchBox-dev/benchbox-sqlglot
          ref: main
          path: fork
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the prepared refresh
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: sqlglot-refresh
          path: ${{ runner.temp }}/refresh

      - name: Push the branch and open the pull request
        env:
          FORK_TOKEN: ${{ secrets.SQLGLOT_FORK_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.SQLGLOT_FORK_REFRESH_TOKEN || github.token }}
        run: python3 -I scripts/sqlglot_fork_refresh.py open-pr --clone fork --out-dir "$RUNNER_TEMP/refresh" --run-url "$RUN_URL"

      - name: Hand the outcome to the follow-up job
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: sqlglot-refresh-open
          path: ${{ runner.temp }}/refresh/open.json
          if-no-files-found: ignore

  follow-up:
    name: Raise or close the follow-up issue
    needs: [prepare, open-pr]
    if: always() && github.repository == 'BenchBox-dev/BenchBox' && github.ref == 'refs/heads/develop' && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch the prepared refresh
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: sqlglot-refresh
          path: ${{ runner.temp }}/refresh

      - name: Fetch the pull request outcome
        if: needs.open-pr.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: sqlglot-refresh-open
          path: ${{ runner.temp }}/refresh

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 -I scripts/sqlglot_fork_refresh.py sync-issue --out-dir "$RUNNER_TEMP/refresh" --run-url "$RUN_URL"
