name: Validate Submission

on:
  pull_request_target:
    branches:
      - published-results
    paths:
      - "results-data/bundles/**"
      - "results-data/corpus/**"
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate result bundles
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Resolve BASE_SHA and MERGE_SHA
        id: shas
        env:
          BASE_SHA_INPUT: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BASE_SHA="$BASE_SHA_INPUT"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          if git fetch origin "pull/${PR_NUMBER}/merge" --depth=1 2>/dev/null; then
            MERGE_SHA=$(git rev-parse FETCH_HEAD)
            git fetch origin "pull/${PR_NUMBER}/head" --depth=1
            git cat-file -e "$HEAD_SHA" || {
              echo "::error::HEAD_SHA $HEAD_SHA not found after fetching origin pull/${PR_NUMBER}/head"
              exit 1
            }
          else
            echo "::warning::Could not fetch origin pull/${PR_NUMBER}/merge (likely conflicts), falling back to head SHA"
            MERGE_SHA="$HEAD_SHA"
            git fetch origin "$HEAD_SHA" --depth=1 2>/dev/null || true
          fi
          echo "MERGE_SHA=$MERGE_SHA" >> "$GITHUB_ENV"
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
          echo "CORPUS_CHANGED_PATHS_FILE=/tmp/corpus_changed_paths.txt" >> "$GITHUB_ENV"
          echo "corpus_changed_paths_file=/tmp/corpus_changed_paths.txt" >> "$GITHUB_OUTPUT"
          echo "Resolved BASE_SHA=$BASE_SHA MERGE_SHA=$MERGE_SHA CORPUS_CHANGED_PATHS_FILE=/tmp/corpus_changed_paths.txt"

      - name: Cleanup stale corpus paths file
        run: |
          rm -f "$CORPUS_CHANGED_PATHS_FILE" "$CORPUS_CHANGED_PATHS_FILE.tmp"
          echo "Cleaned $CORPUS_CHANGED_PATHS_FILE"

      - name: Reject validator or workflow changes in a submission PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ env.MERGE_SHA }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          CHANGED_GUARD=$(git diff --name-only "$BASE_SHA...${MERGE_SHA:-HEAD}" -- \
            scripts/validate_submission.py \
            benchbox/validation/bundle.py \
            benchbox/core/results/query_status.py \
            benchbox/core/results/schema_policy.py \
            scripts/generate_corpus_inventory.py \
            .github/workflows/validate-submission.yml \
            || true)
          if [ -n "$CHANGED_GUARD" ]; then
            TRUSTED_MIRROR="false"
            if [ "$BASE_REF" = "published-results" ] && [ "$IS_FORK" = "false" ] && [ "$PR_AUTHOR" = "github-actions[bot]" ]; then
              case "$HEAD_REF" in
                auto/results-mirror-*) TRUSTED_MIRROR="true" ;;
              esac
            fi
            if [ "$TRUSTED_MIRROR" = "true" ]; then
              echo "Trusted bot-created same-repo mirror PR ($HEAD_REF) validator/workflow mirror - allowed:"
              printf '%s\n' "$CHANGED_GUARD"
            else
              echo "::error::This submission PR modifies validator/workflow files, which is not allowed:"
              printf '%s\n' "$CHANGED_GUARD"
              echo "Revert these files and open a separate develop PR for validator/workflow changes."
              exit 1
            fi
          else
            echo "No validator/workflow files changed - proceeding."
          fi

      - name: Reject non-maintainer vendor/ additions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ env.MERGE_SHA }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          VENDOR_CHANGES=$(git diff --name-only "$BASE_SHA...${MERGE_SHA:-HEAD}" -- \
            'results-data/bundles/vendor/**' || true)
          if [ -n "$VENDOR_CHANGES" ]; then
            TRUSTED_MIRROR="false"
            if [ "$BASE_REF" = "published-results" ] && [ "$IS_FORK" = "false" ] && [ "$PR_AUTHOR" = "github-actions[bot]" ]; then
              case "$HEAD_REF" in
                auto/results-mirror-*) TRUSTED_MIRROR="true" ;;
              esac
            fi
            case "$AUTHOR_ASSOCIATION" in
              OWNER | MEMBER | COLLABORATOR)
                echo "Maintainer ($AUTHOR_ASSOCIATION) vendor/ addition - allowed."
                ;;
              *)
                if [ "$TRUSTED_MIRROR" = "true" ]; then
                  echo "Trusted bot-created same-repo mirror PR ($HEAD_REF) vendor/ addition - allowed."
                else
                  echo "::error::This PR adds or modifies files under results-data/bundles/vendor/, which grants the ranking-eligible vendor-supplied label. Only maintainers may do this:"
                  printf '%s\n' "$VENDOR_CHANGES"
                  echo "Community submissions belong in results-data/bundles/ (not vendor/). Author association: ${AUTHOR_ASSOCIATION}."
                  exit 1
                fi
                ;;
            esac
          fi
          echo "No non-maintainer vendor/ additions - proceeding."

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Collect corpus changed paths
        id: corpus-paths
        env:
          BASE_SHA: ${{ env.BASE_SHA }}
          MERGE_SHA: ${{ env.MERGE_SHA }}
          CORPUS_CHANGED_PATHS_FILE: ${{ env.CORPUS_CHANGED_PATHS_FILE }}
        run: |
          set -euo pipefail
          : "${BASE_SHA:?BASE_SHA required}"
          EFFECTIVE_MERGE="${MERGE_SHA:-HEAD}"
          EFFECTIVE_BASE="$BASE_SHA"
          rm -f "$CORPUS_CHANGED_PATHS_FILE.tmp"
          TMP="$CORPUS_CHANGED_PATHS_FILE.tmp"
          CHANGED_BUNDLES_CORPUS=$(git diff --no-renames --name-only --diff-filter=ACMRD "$EFFECTIVE_BASE...$EFFECTIVE_MERGE" -- 'results-data/bundles/**' || true)
          CHANGED_CORPUS_SUBTREE=$(git diff --no-renames --name-only --diff-filter=ACMRD "$EFFECTIVE_BASE...$EFFECTIVE_MERGE" -- 'results-data/corpus/**' || true)
          CHANGED_CORPUS=$(printf '%s\n%s\n' "$CHANGED_BUNDLES_CORPUS" "$CHANGED_CORPUS_SUBTREE" | sed '/^$/d' | sort -u || true)
          if [ -z "$CHANGED_CORPUS" ]; then
            : > "$TMP"
          else
            printf '%s\n' "$CHANGED_CORPUS" | sort -u > "$TMP"
          fi
          mv "$TMP" "$CORPUS_CHANGED_PATHS_FILE"
          echo "Corpus changed paths (MERGE_SHA=$EFFECTIVE_MERGE):"
          if [ -s "$CORPUS_CHANGED_PATHS_FILE" ]; then
            cat "$CORPUS_CHANGED_PATHS_FILE"
          else
            echo "(empty - no corpus changes)"
          fi
          test -f "$CORPUS_CHANGED_PATHS_FILE"
          uv run -- python scripts/validate_submission.py --corpus-changed-paths "$CORPUS_CHANGED_PATHS_FILE"

      - name: Find changed bundles
        id: changed
        env:
          BASE_SHA: ${{ env.BASE_SHA }}
          MERGE_SHA: ${{ env.MERGE_SHA }}
          CORPUS_CHANGED_PATHS_FILE: ${{ env.CORPUS_CHANGED_PATHS_FILE }}
        run: |
          set -euo pipefail
          : "${BASE_SHA:?BASE_SHA required}"
          EFFECTIVE_MERGE="${MERGE_SHA:-HEAD}"
          CHANGED=$(git diff --no-renames --name-only --diff-filter=ACMR "$BASE_SHA...$EFFECTIVE_MERGE" -- ':(icase,glob)results-data/bundles/*.json' ':(icase,glob)results-data/bundles/**/*.json' \
            | grep -vi '\.plans\.json$' \
            | grep -vi '\.tuning\.json$' \
            | grep -vi '\.applied\.json$' \
            | grep -vi 'corpus-inventory\.json$' \
            | grep -vi '\.manifest\.json$' \
            | grep -vi '\.override\.json$' \
            | grep -vi 'submission-manifest\.json$' \
            || true)

          while IFS= read -r -d '' deleted_bundle; do
              stem="${deleted_bundle:0:${#deleted_bundle}-5}"
              for suffix in ".manifest.json" ".plans.json" ".tuning.json" ".applied.json" ".override.json"; do
                companion=$(git ls-tree -rz --name-only "$EFFECTIVE_MERGE" -- results-data/bundles \
                  | STEM="$stem" SUFFIX="$suffix" awk -v RS='\0' \
                    'length($0) == length(ENVIRON["STEM"]) + length(ENVIRON["SUFFIX"]) && \
                     substr($0, 1, length(ENVIRON["STEM"])) == ENVIRON["STEM"] && \
                     tolower(substr($0, length(ENVIRON["STEM"]) + 1)) == tolower(ENVIRON["SUFFIX"]) { if (!found) { print; found=1 } }')
                if [ -n "$companion" ]; then
                  echo "::error file=${companion}::Deleting ${deleted_bundle} also requires deleting its same-stem companion"
                  exit 1
                fi
              done

              deleted_dir="${deleted_bundle%/*}"
              deleted_name="${deleted_bundle##*/}"
              expected_manifest_lower=$(printf '%s' "$deleted_dir/submission-manifest.json" | tr 'A-Z' 'a-z')
              while IFS= read -r -d '' legacy_manifest; do
                if [ "$(printf '%s' "$legacy_manifest" | tr 'A-Z' 'a-z')" != "$expected_manifest_lower" ]; then
                  continue
                fi
                referenced_bundle=$(git cat-file -p "$EFFECTIVE_MERGE:${legacy_manifest}" | python3 -c "import json, sys; data = json.load(sys.stdin); print(data.get('bundle_file', '') if isinstance(data, dict) else '')" 2>/dev/null || true)
                if [ "$referenced_bundle" = "$deleted_name" ]; then
                  echo "::error file=${legacy_manifest}::Deleting ${deleted_bundle} also requires deleting its referencing legacy manifest"
                  exit 1
                fi
              done < <(git ls-tree -rz --name-only "$EFFECTIVE_MERGE" -- "$deleted_dir" \
                | grep -zi 'submission-manifest\.json$' || true)
          done < <(git diff --no-renames --name-only -z --diff-filter=D \
            "$BASE_SHA...$EFFECTIVE_MERGE" -- \
            ':(icase,glob)results-data/bundles/*.json' ':(icase,glob)results-data/bundles/**/*.json' \
            | grep -vizE '\.(manifest|plans|tuning|applied|override)\.json$' \
            | grep -viz 'corpus-inventory\.json$' \
            | grep -viz 'submission-manifest\.json$' \
            || true)

          CHANGED_MANIFESTS=$(git diff --no-renames --name-only --diff-filter=ACMRD \
            "$BASE_SHA...$EFFECTIVE_MERGE" -- \
            ':(icase,glob)results-data/bundles/*.json' ':(icase,glob)results-data/bundles/**/*.json' \
            | grep -i '\.manifest\.json$' \
            || true)
          if [ -n "$CHANGED_MANIFESTS" ]; then
            while IFS= read -r manifest; do
              stem="${manifest:0:${#manifest}-14}"
              bundle=$(git ls-tree -r --name-only "$EFFECTIVE_MERGE" -- results-data/bundles \
                | awk -v stem="$stem" 'substr($0, 1, length($0) - 5) == stem && tolower(substr($0, length($0) - 4)) == ".json" { if (!found) { print; found=1 } }')
              if [ -n "$bundle" ] && git cat-file -e "$EFFECTIVE_MERGE:${bundle}" 2>/dev/null \
                  && ! printf '%s\n' "$CHANGED" | grep -qxF "$bundle"; then
                CHANGED="${CHANGED:+${CHANGED}$'\n'}${bundle}"
              fi
            done <<< "$CHANGED_MANIFESTS"
          fi

          CHANGED_APPLIED=$(git diff --no-renames --name-only --diff-filter=ACMRD \
            "$BASE_SHA...$EFFECTIVE_MERGE" -- \
            ':(icase,glob)results-data/bundles/*.json' ':(icase,glob)results-data/bundles/**/*.json' \
            | grep -i '\.applied\.json$' \
            || true)
          if [ -n "$CHANGED_APPLIED" ]; then
            while IFS= read -r applied; do
              stem="${applied:0:${#applied}-13}"
              bundle=$(git ls-tree -r --name-only "$EFFECTIVE_MERGE" -- results-data/bundles \
                | awk -v stem="$stem" 'substr($0, 1, length($0) - 5) == stem && tolower(substr($0, length($0) - 4)) == ".json" { if (!found) { print; found=1 } }')
              if [ -n "$bundle" ] && git cat-file -e "$EFFECTIVE_MERGE:${bundle}" 2>/dev/null \
                  && ! printf '%s\n' "$CHANGED" | grep -qxF "$bundle"; then
                CHANGED="${CHANGED:+${CHANGED}$'\n'}${bundle}"
              fi
            done <<< "$CHANGED_APPLIED"
          fi

          CHANGED_COMPANIONS=$(git diff --no-renames --name-only --diff-filter=ACMRD \
            "$BASE_SHA...$EFFECTIVE_MERGE" -- \
            ':(icase,glob)results-data/bundles/*.json' ':(icase,glob)results-data/bundles/**/*.json' \
            | grep -iE '\.(plans|tuning|override)\.json$' \
            | grep -ivE '(corpus-inventory|submission-manifest)\.json$' \
            || true)
          if [ -n "$CHANGED_COMPANIONS" ]; then
            while IFS= read -r companion; do
              lower=$(printf '%s' "$companion" | tr '[:upper:]' '[:lower:]')
              case "$lower" in
                *.plans.json) strip=11 ;;
                *.tuning.json) strip=12 ;;
                *.override.json) strip=14 ;;
                *) continue ;;
              esac
              stem="${companion:0:$(( ${#companion} - strip ))}"
              bundle=$(git ls-tree -r --name-only "$EFFECTIVE_MERGE" -- results-data/bundles \
                | awk -v stem="$stem" 'substr($0, 1, length($0) - 5) == stem && tolower(substr($0, length($0) - 4)) == ".json" { if (!found) { print; found=1 } }')
              if [ -z "$bundle" ] && git cat-file -e "$EFFECTIVE_MERGE:${companion}" 2>/dev/null; then
                echo "::error file=${companion}::Live companion has no primary bundle at ${stem}.json"
                exit 1
              fi
              if [ -n "$bundle" ] && git cat-file -e "$EFFECTIVE_MERGE:${bundle}" 2>/dev/null \
                  && ! printf '%s\n' "$CHANGED" | grep -qxF "$bundle"; then
                CHANGED="${CHANGED:+${CHANGED}$'\n'}${bundle}"
              fi
            done <<< "$CHANGED_COMPANIONS"
          fi

          if [ -z "$CHANGED" ]; then
            echo "No bundle files changed."
            echo "has_bundles=false" >> "$GITHUB_OUTPUT"
            if [ -s "$CORPUS_CHANGED_PATHS_FILE" ]; then
              echo "Corpus changed but no bundles - will run corpus inventory check"
              echo "has_bundles=corpus-only" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Changed bundles:"
            echo "$CHANGED"
            echo "has_bundles=true" >> "$GITHUB_OUTPUT"
            echo "$CHANGED" > /tmp/changed_bundles.txt
            rm -rf /tmp/payload
            mkdir -p /tmp/payload
            while IFS= read -r bundle; do
              dir=$(dirname "$bundle")
              mkdir -p "/tmp/payload/$dir"
              git show "$EFFECTIVE_MERGE:$bundle" > "/tmp/payload/$bundle" 2>/dev/null || echo "Warning: cannot extract $bundle at $EFFECTIVE_MERGE" >&2
              stem="${bundle%.json}"
              for suffix in ".manifest.json" ".applied.json" ".plans.json" ".tuning.json" ".override.json"; do
                companion="${stem}${suffix}"
                if git cat-file -e "$EFFECTIVE_MERGE:$companion" 2>/dev/null; then
                  git show "$EFFECTIVE_MERGE:$companion" > "/tmp/payload/$companion" 2>/dev/null || true
                fi
              done
            done <<< "$CHANGED"
            sed 's|^|/tmp/payload/|' /tmp/changed_bundles.txt > /tmp/changed_bundles_payload.txt
            mv /tmp/changed_bundles_payload.txt /tmp/changed_bundles.txt
          fi

      - name: Reject disallowed corpus paths
        id: corpus-allowlist
        env:
          CORPUS_CHANGED_PATHS_FILE: ${{ env.CORPUS_CHANGED_PATHS_FILE }}
          MERGE_SHA: ${{ env.MERGE_SHA }}
        run: |
          set -euo pipefail
          CORPUS_PATHS="${CORPUS_CHANGED_PATHS_FILE:-/tmp/corpus_changed_paths.txt}"
          echo "Checking corpus allowlist via $CORPUS_PATHS (MERGE_SHA=$MERGE_SHA)"
          if [ ! -f "$CORPUS_PATHS" ]; then
            echo "::error::CORPUS_CHANGED_PATHS_FILE missing at $CORPUS_PATHS - failing closed"
            exit 1
          fi
          uv run -- python scripts/validate_submission.py --corpus-changed-paths "$CORPUS_PATHS"

      - name: Validate bundles
        if: steps.changed.outputs.has_bundles == 'true'
        id: validate
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ env.BASE_SHA }}
          MERGE_SHA: ${{ env.MERGE_SHA }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CORPUS_CHANGED_PATHS_FILE: ${{ env.CORPUS_CHANGED_PATHS_FILE }}
        run: |
          set -euo pipefail
          REQUIRE_MANIFEST="--require-manifest"
          ALLOW_PARTIAL_VALIDATION=""
          if [ "${BASE_REF:-}" = "published-results" ] && [ "$IS_FORK" = "false" ] && [ "$PR_AUTHOR" = "github-actions[bot]" ]; then
            case "$HEAD_REF" in
              auto/results-mirror-*)
                REQUIRE_MANIFEST=""
                ALLOW_PARTIAL_VALIDATION="--allow-partial-validation"
                ;;
            esac
          fi
          _BASE_SHA="${BASE_SHA:-HEAD}"
          _MERGE_SHA="${MERGE_SHA:-HEAD}"
          _HEAD_SHA="${HEAD_SHA:-HEAD}"
          _CORPUS_FILE="${CORPUS_CHANGED_PATHS_FILE:-/tmp/corpus_changed_paths.txt}"
          CORPUS_ARG=""
          if [ -f "$_CORPUS_FILE" ]; then
            CORPUS_ARG="--corpus-changed-paths $_CORPUS_FILE"
          fi
          xargs -d '\n' uv run -- python scripts/validate_submission.py $REQUIRE_MANIFEST $ALLOW_PARTIAL_VALIDATION $CORPUS_ARG --pr-comment /tmp/pr_comment.md < /tmp/changed_bundles.txt \
            | tee /tmp/validation_output.txt
          uv run -- python scripts/publication/validator_parity.py --base-sha "$_BASE_SHA" --merge-sha "$_MERGE_SHA" --head-sha "$_HEAD_SHA" --corpus-changed-paths "$_CORPUS_FILE" $REQUIRE_MANIFEST $ALLOW_PARTIAL_VALIDATION

      - name: Check override approvals
        if: steps.validate.outcome == 'success'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ env.BASE_SHA }}
          MERGE_SHA: ${{ env.MERGE_SHA }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EFFECTIVE_MERGE="${MERGE_SHA:-HEAD}"
          OVERRIDES=$(git diff --no-renames --name-only --diff-filter=ACMR "$BASE_SHA...$EFFECTIVE_MERGE" -- \
            ':(icase,glob)results-data/bundles/*.override.json' ':(icase,glob)results-data/bundles/**/*.override.json' \
            || true)
          CHANGED_BUNDLES=$(git diff --no-renames --name-only --diff-filter=ACMR "$BASE_SHA...$EFFECTIVE_MERGE" -- \
            ':(icase,glob)results-data/bundles/*.json' ':(icase,glob)results-data/bundles/**/*.json' \
            | grep -viE '\.(manifest|plans|tuning|applied|override)\.json$' \
            | grep -vi 'corpus-inventory\.json$' \
            | grep -vi 'submission-manifest\.json$' \
            || true)
          ASSOCIATED=""
          while IFS= read -r bundle; do
            [ -n "$bundle" ] || continue
            candidate="${bundle%.json}.override.json"
            if git cat-file -e "$EFFECTIVE_MERGE:$candidate" 2>/dev/null; then
              ASSOCIATED=$(printf '%s\n%s' "$ASSOCIATED" "$candidate")
            fi
          done <<< "$CHANGED_BUNDLES"
          OVERRIDES=$(printf '%s\n%s' "$OVERRIDES" "$ASSOCIATED" | sed '/^[[:space:]]*$/d' | sort -u)
          if [ -z "$OVERRIDES" ]; then
            echo "No override artifacts changed or associated."
            exit 0
          fi
          if [ "${PR_AUTHOR:-}" = "github-actions[bot]" ]; then
            echo "Mirror-lane bot PR: overrides advisory, no approval required."
            exit 0
          fi
          failed=0
          while IFS= read -r artifact; do
            [ -n "$artifact" ] || continue
            approver=$(git show "$EFFECTIVE_MERGE:$artifact" 2>/dev/null \
              | python3 -c "import json,sys; data=json.load(sys.stdin); print(data.get('approver','') if isinstance(data,dict) else '')" 2>/dev/null || true)
            if [ -z "$approver" ]; then
              echo "::error file=${artifact}::Override artifact has no approver."
              failed=1
              continue
            fi
            if [ "$(printf '%s' "$approver" | tr 'A-Z' 'a-z')" = "$(printf '%s' "$PR_AUTHOR" | tr 'A-Z' 'a-z')" ]; then
              echo "::error file=${artifact}::Override approver must differ from the PR author."
              failed=1
              continue
            fi
            approved=$(WANT="$approver" WANT_SHA="$HEAD_SHA" gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --paginate --slurp 2>/dev/null \
              | WANT="$approver" WANT_SHA="$HEAD_SHA" python3 -c "import json,os,sys; loaded=json.load(sys.stdin); pages=loaded if (isinstance(loaded,list) and loaded and all(isinstance(p,list) for p in loaded)) else [loaded]; all_reviews=[r for page in pages for r in (page if isinstance(page,list) else [page])]; want=os.environ.get('WANT','').lower(); want_sha=os.environ.get('WANT_SHA',''); latest=next((r.get('state') for r in reversed(all_reviews) if (((r.get('user') or {}).get('login')) or '').lower()==want and r.get('state') in ('APPROVED','CHANGES_REQUESTED','DISMISSED') and (not want_sha or r.get('commit_id')==want_sha)), None); print('yes' if latest=='APPROVED' else 'no')" 2>/dev/null || echo no)
            if [ "$approved" != "yes" ]; then
              echo "::error file=${artifact}::No APPROVED review from override approver '${approver}'."
              failed=1
              continue
            fi
            echo "Override ${artifact} approved by ${approver}."
          done <<< "$OVERRIDES"
          exit "$failed"

      - name: Check corpus inventory
        if: steps.validate.outcome == 'success' || steps.changed.outputs.has_bundles == 'corpus-only'
        run: |
          if [ -f "$CORPUS_CHANGED_PATHS_FILE" ] && [ -s "$CORPUS_CHANGED_PATHS_FILE" ]; then
            echo "Corpus files changed - running inventory check against MERGE_SHA payload"
          fi
          uv run -- python scripts/generate_corpus_inventory.py --check

      - name: Stage validation comment artifact
        if: steps.changed.outputs.has_bundles == 'true' && always()
        run: |
          mkdir -p /tmp/pr-comment-artifact
          if [ -f /tmp/pr_comment.md ]; then
            cp /tmp/pr_comment.md /tmp/pr-comment-artifact/pr_comment.md
          fi

      - name: Upload validation comment artifact
        if: steps.changed.outputs.has_bundles == 'true' && always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: submission-validation-comment
          path: /tmp/pr-comment-artifact/
          if-no-files-found: warn
          retention-days: 3

      - name: Post PR comment (same-repo fast path)
        if: steps.validate.outcome != 'skipped' && always()
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/pr_comment.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## Submission Validation';
            const existing = comments.find(c =>
              c.body.trimStart().startsWith(marker) &&
              (c.user.type === 'Bot' || c.user.login === 'github-actions[bot]')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: No bundles changed
        if: steps.changed.outputs.has_bundles == 'false'
        run: echo "No result bundles changed in this PR - skipping validation."
