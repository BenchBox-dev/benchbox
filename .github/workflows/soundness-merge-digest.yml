name: Soundness Merge Digest

on:
  schedule:
    - cron: "23 5 * * *"
  push:
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Record the current develop head as the first checkpoint
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: soundness-merge-digest
  cancel-in-progress: false

jobs:
  digest:
    name: Digest soundness-path merges
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out develop
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: develop
          fetch-depth: 0

      - name: Report and record the digest
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          set -uo pipefail
          status=0
          args=(--repo "${REPOSITORY}" --branch develop --apply)
          if [[ "${BOOTSTRAP}" == "true" ]]; then
            args+=(--bootstrap)
          fi
          python3 _project/scripts/soundness_merge_digest.py "${args[@]}" || status=1
          lines="$(git for-each-ref --format='%(refname:strip=3)' 'refs/remotes/origin/release/')" || exit 1
          for branch in ${lines}; do
            python3 _project/scripts/soundness_merge_digest.py --repo "${REPOSITORY}" --branch "${branch}" --apply || status=1
          done
          exit "${status}"
