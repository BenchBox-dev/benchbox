name: pr-hold

run-name: pr-hold (${{ github.event.action }} pr=${{ github.event.pull_request.number }})

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]

permissions:
  pull-requests: read

concurrency:
  group: pr-hold-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  hold:
    name: hold
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse to merge while the durable hold label is present
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HOLD_LABEL: no-auto-merge
        run: |
          set -eu
          labels="$(gh api "repos/$REPO/pulls/$PR" --jq '.labels[].name')"
          if printf '%s\n' "$labels" | grep -Fxq "$HOLD_LABEL"; then
            echo "::error::PR carries the durable hold label '$HOLD_LABEL'. Only the owner releases it, by naming this PR in a current request."
            exit 1
          fi
          echo "No durable hold label."
