name: Comment Policy Nightly

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comment-policy-nightly
  cancel-in-progress: false

jobs:
  whole-tree:
    name: Whole-tree comment policy on develop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: false
          working-directory: ${{ runner.temp }}
          ignore-empty-workdir: true
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the whole tree against the checked-out develop commit
        run: python -I scripts/run_comment_policy.py --full
