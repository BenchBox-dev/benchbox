name: Trunk

env:
  BENCHBOX_TEST_LOCK_WAIT_SECONDS: "0"

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: trunk-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  fast:
    name: fast (ubuntu-latest, 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run fast tests
        run: |
          uv run -- python -m pytest tests -m "fast and not (slow or stress or resource_heavy or live_integration)" --tb=short --timeout=120

  medium-collect:
    name: medium-collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Collect the complete medium tier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p t2-artifacts
          BENCHBOX_TEST_TIER=t2 uv run -- python -m pytest --collect-only -q -n 0 \
            -m "medium and not (slow or stress or resource_heavy or live_integration)" \
            > t2-artifacts/medium-collect.txt
          count=$(grep -Eo '^[0-9]+/[0-9]+ tests collected' t2-artifacts/medium-collect.txt | tail -1 | cut -d/ -f1)
          test -n "$count"
          uv run -- python scripts/release_canary_sharding.py collect \
            --input t2-artifacts/medium-collect.txt \
            --nodeids-output t2-artifacts/medium-nodeids.txt \
            --summary-output t2-artifacts/medium-collection.json \
            --expected-count "$count" --shard-count 4 \
            --workflow trunk.yml --job medium-collect \
            --marker-expression "medium and not (slow or stress or resource_heavy or live_integration)" \
            --checked-ref "${{ github.ref }}" --checked-sha "${{ github.sha }}"

      - name: Upload medium collection evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: t2-medium-nodeids-${{ github.sha }}
          path: t2-artifacts/
          if-no-files-found: error
          retention-days: 30

  medium-test:
    name: medium-test (shard ${{ matrix.shard_index }})
    needs: medium-collect
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Download medium collection evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: t2-medium-nodeids-${{ github.sha }}
          path: t2-artifacts

      - name: Partition the complete medium tier
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
        run: |
          uv run -- python scripts/release_canary_sharding.py shard \
            --input t2-artifacts/medium-nodeids.txt \
            --nodeids-output "t2-artifacts/shard-${SHARD_INDEX}-nodeids.txt" \
            --summary-output "t2-artifacts/shard-${SHARD_INDEX}-summary.json" \
            --shard-index "$SHARD_INDEX" --shard-count 4 \
            --workflow trunk.yml --job medium-test \
            --marker-expression "medium and not (slow or stress or resource_heavy or live_integration)" \
            --collection-summary t2-artifacts/medium-collection.json --checked-sha "${{ github.sha }}"

      - name: Run medium speed tier
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
        run: |
          set -euo pipefail
          test -s "t2-artifacts/shard-${SHARD_INDEX}-nodeids.txt"
          mapfile -t node_ids < "t2-artifacts/shard-${SHARD_INDEX}-nodeids.txt"
          sample_resources() {
            while sleep 30; do
              echo "[resources $(date -u +%H:%M:%S)] $(free -m | awk '/Mem:/ {print "used_mb=" $3 " available_mb=" $7}') load=$(cut -d' ' -f1-3 /proc/loadavg)"
              ps -eo pid,rss,etimes,comm --sort=-rss | awk 'NR <= 4 {print "  " $0}'
            done
          }
          sample_resources &
          sampler=$!
          trap 'pkill -P "${sampler}" 2>/dev/null || true; kill "${sampler}" 2>/dev/null || true' EXIT
          BENCHBOX_TEST_TIER=t2 uv run -- python -m pytest \
            -m "medium and not (slow or stress or resource_heavy or live_integration)" \
            --tb=short --timeout=60 -n 5 --durations=25 \
            -p scripts.pytest_shard_evidence \
            --assigned-nodeids "t2-artifacts/shard-${SHARD_INDEX}-nodeids.txt" \
            --shard-evidence "t2-artifacts/shard-${SHARD_INDEX}-execution.json" \
            --checked-sha "${{ github.sha }}" "${node_ids[@]}"

      - name: Record kernel memory events for the medium shard
        if: always()
        shell: bash
        run: |
          free -m
          sudo dmesg -T 2>/dev/null | grep -iE 'out of memory|oom-kill|killed process' | tail -20 || true

      - name: Upload medium shard evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: t2-medium-shard-${{ matrix.shard_index }}-${{ github.sha }}
          path: t2-artifacts/
          if-no-files-found: error
          retention-days: 30

  correctness-gate:
    name: correctness-gate (${{ matrix.partition }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        partition: [a, b]
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run bounded real-result correctness gate
        if: matrix.partition == 'b'
        run: make test-correctness-gate

      - name: Run TPC-Havoc variant-equivalence gate
        if: matrix.partition == 'b'
        run: make tpchavoc-equivalence-report

      - name: Run TPC-Havoc DataFrame variant-equivalence gate
        if: matrix.partition == 'a'
        run: make tpchavoc-dataframe-equivalence-report

      - name: Run SSB cross-surface SQL<->DataFrame equivalence gate
        if: matrix.partition == 'b'
        run: make ssb-cross-surface-equivalence-report

      - name: Run AMPLab cross-surface SQL<->DataFrame equivalence gate
        if: matrix.partition == 'b'
        run: make amplab-cross-surface-equivalence-report

      - name: Run CoffeeShop cross-surface SQL<->DataFrame equivalence gate
        if: matrix.partition == 'a'
        run: make coffeeshop-cross-surface-equivalence-report

      - name: Run ClickBench cross-surface SQL<->DataFrame equivalence gate
        if: matrix.partition == 'b'
        run: make clickbench-cross-surface-equivalence-report

      - name: Run JoinOrder-synthetic cross-surface SQL<->DataFrame equivalence gate
        if: matrix.partition == 'b'
        run: make joinorder-synthetic-cross-surface-equivalence-report

      - name: Run H2O-DB cross-surface SQL<->DataFrame equivalence gate
        if: matrix.partition == 'a'
        run: make h2odb-cross-surface-equivalence-report

      - name: Run Read Primitives cross-surface SQL<->DataFrame equivalence gate
        if: matrix.partition == 'b'
        run: make read-primitives-cross-surface-equivalence-report

      - name: Run FlightData cross-surface SQL<->DataFrame equivalence gate
        if: matrix.partition == 'a'
        run: make flightdata-cross-surface-equivalence-report

      - name: Run Data Vault cross-surface SQL<->DataFrame equivalence gate
        if: matrix.partition == 'b'
        run: make datavault-cross-surface-equivalence-report

      - name: Run NYC Taxi cross-surface SQL<->DataFrame equivalence gate
        if: matrix.partition == 'a'
        run: make nyctaxi-cross-surface-equivalence-report

      - name: Run TSBS DevOps cross-surface SQL<->DataFrame equivalence gate
        if: matrix.partition == 'a'
        run: make tsbs-devops-cross-surface-equivalence-report

      - name: Run TPC-H Skew cross-surface SQL<->DataFrame equivalence gate
        if: matrix.partition == 'a'
        run: make tpch-skew-cross-surface-equivalence-report

      - name: Run TPC-H cross-surface SQL<->DataFrame equivalence gate
        if: matrix.partition == 'a'
        run: make tpch-cross-surface-equivalence-report

      - name: Run TPC-DS cross-surface SQL<->DataFrame equivalence gate (Polars and DataFusion)
        if: matrix.partition == 'b'
        run: make tpcds-cross-surface-equivalence-report

      - name: Run TPC-DS cross-surface SQL<->DataFrame equivalence gate (pandas)
        if: matrix.partition == 'a'
        run: make tpcds-pandas-cross-surface-equivalence-report

  tpcds-parity-draws:
    name: tpcds-parity-draws
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Compare every TPC-DS backend twice on three other Power draws
        run: make tpcds-cross-surface-draws-report

  required-local-cases:
    name: required-local-cases
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run the required local-engine cases
        run: make test-required-local-cases

  dist-artifact:
    name: dist-artifact
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Verify source bundled binary manifest
        run: uv run --locked --no-dev -- python scripts/bundled_binary_manifest.py

      - name: Build wheel and sdist
        run: |
          set -euo pipefail
          uv build
          wheel_count=$(find dist -maxdepth 1 -name '*.whl' | wc -l | tr -d '[:space:]')
          sdist_count=$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d '[:space:]')
          if [ "$wheel_count" != "1" ] || [ "$sdist_count" != "1" ]; then
            echo "::error::Expected exactly one wheel and one sdist, found $wheel_count wheel(s) and $sdist_count sdist(s)"
            find dist -maxdepth 1 -type f -print
            exit 1
          fi
          uv run --locked --no-dev -- python scripts/verify_distribution_binaries.py dist/*.whl dist/*.tar.gz
          (cd dist && sha256sum -- *.whl *.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Bind distributions to the producer attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I -S scripts/release_artifact_consumer.py producer --dist dist

      - name: Upload dist artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dist-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/producer-receipt.json
          if-no-files-found: error
          retention-days: 90
