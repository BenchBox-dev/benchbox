name: Sync results-data to published-results

on:
  push:
    branches: [develop]
    paths:
      - "results-data/bundles/**"
      - "results-data/corpus-inventory.json"
      - "results-data/CORPUS_NOTES.md"
      - "results-data/SEED_CORPUS_SPEC.md"
      - "results-data/README.md"
      - "results-data/validate_corpus.py"
      - "scripts/validate_submission.py"
      - "scripts/publication/validator_parity.py"
      - "benchbox/validation/bundle.py"
      - "benchbox/core/results/query_status.py"
      - "benchbox/core/results/schema_policy.py"
      - "benchbox/core/results/subscale_policy.py"
      - "benchbox/core/results/timing_fields.py"
      - "scripts/generate_corpus_inventory.py"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: sync-results-to-published-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "benchbox-bot"
          git config user.email "benchbox-bot@users.noreply.github.com"

      - name: Detect drift between develop and published-results
        id: drift
        run: |
          git fetch origin published-results:refs/remotes/origin/published-results
          PUBLISHED_BASE_SHA=$(git rev-parse --verify origin/published-results^{commit})
          if [[ ! "${PUBLISHED_BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not capture an immutable published-results base SHA."
            exit 1
          fi
          echo "Captured published-results base: ${PUBLISHED_BASE_SHA}"
          echo "published_base_sha=${PUBLISHED_BASE_SHA}" >> "$GITHUB_OUTPUT"

          mapfile -t DIFFED < <(git diff --name-only origin/published-results "${GITHUB_SHA}" -- \
            'results-data/bundles' 'results-data/corpus-inventory.json' \
            'results-data/CORPUS_NOTES.md' 'results-data/SEED_CORPUS_SPEC.md' \
            'results-data/README.md' 'results-data/validate_corpus.py' \
            'benchbox/validation/bundle.py' \
            'benchbox/core/results/query_status.py' \
            'benchbox/core/results/schema_policy.py' \
            'benchbox/core/results/subscale_policy.py' \
            'benchbox/core/results/timing_fields.py' \
            'scripts/validate_submission.py' 'scripts/publication/validator_parity.py' \
            'scripts/generate_corpus_inventory.py')

          if [[ ${#DIFFED[@]} -eq 0 ]]; then
            echo "No drift between develop and published-results in mirrored paths."
            echo "has_drift=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Drift detected in ${#DIFFED[@]} path(s):"
          printf '  %s\n' "${DIFFED[@]}"
          echo "has_drift=true" >> "$GITHUB_OUTPUT"

          {
            echo "diff_count=${#DIFFED[@]}"
          } >> "$GITHUB_OUTPUT"

      - name: Install uv
        if: steps.drift.outputs.has_drift == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Set up Python
        if: steps.drift.outputs.has_drift == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Gate corpus publication fixed point
        if: steps.drift.outputs.has_drift == 'true'
        run: |
          set -euo pipefail
          uv run -- python - <<'PY'
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          from benchbox.core.results.anonymization import AnonymizationManager
          from benchbox.core.results.canonical_json import canonical_json_bytes

          RESULTS_DATA = Path("results-data")
          COMPANION_SUFFIXES = (".manifest.json", ".plans.json", ".tuning.json", ".applied.json", ".override.json")
          MIGRATION_MANIFEST = "path-privacy-migration.manifest.json"

          manager = AnonymizationManager()
          drifted: list[str] = []
          scanned = 0

          for path in sorted((RESULTS_DATA / "bundles").rglob("*.json")):
              if path.name.endswith(COMPANION_SUFFIXES) or path.name == MIGRATION_MANIFEST:
                  continue
              stored = path.read_bytes()
              payload = json.loads(stored.decode("utf-8"))
              if not isinstance(payload, dict):
                  continue
              scanned += 1
              if canonical_json_bytes(manager.anonymize_result_payload(payload)) != stored:
                  drifted.append(str(path))

          if not scanned:
              print(
                  "::error::No primary bundles scanned — publication fixed-point gate would be vacuous.",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          if drifted:
              print(
                  f"::error::Corpus is not at the publication fixed point "
                  f"({len(drifted)} bundle(s) would be rewritten by re-anonymization). "
                  f"Refusing to open a mirror that would rewrite published bytes. "
                  f"Same byte-identity gate as test_rederived_corpus_publishes_byte_identically_and_is_stable_under_a_second_pass.",
                  file=sys.stderr,
              )
              for rel in drifted[:20]:
                  print(f"  {rel}", file=sys.stderr)
              raise SystemExit(1)

          print(f"Publication fixed point OK ({scanned} primary bundles).")
          PY

      - name: Build mirror branch
        if: steps.drift.outputs.has_drift == 'true'
        id: build
        run: |
          MIRROR_BRANCH="auto/results-mirror-${GITHUB_SHA::8}"
          echo "mirror_branch=${MIRROR_BRANCH}" >> "$GITHUB_OUTPUT"

          PUBLISHED_BASE_SHA="${{ steps.drift.outputs.published_base_sha }}"
          if [[ ! "${PUBLISHED_BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Mirror build has no captured published-results base SHA; refusing to publish."
            exit 1
          fi
          git switch --force-create "${MIRROR_BRANCH}" "${PUBLISHED_BASE_SHA}"

          SOURCE_REF="${GITHUB_SHA}"
          BUNDLES_DIR='results-data/bundles'
          FILE_PATHS=(
            'results-data/CORPUS_NOTES.md'
            'results-data/SEED_CORPUS_SPEC.md'
            'results-data/README.md'
            'results-data/validate_corpus.py'
            'benchbox/validation/bundle.py'
            'benchbox/core/results/query_status.py'
            'benchbox/core/results/schema_policy.py'
            'benchbox/core/results/subscale_policy.py'
            'benchbox/core/results/timing_fields.py'
            'scripts/validate_submission.py'
            'scripts/publication/validator_parity.py'
            'scripts/generate_corpus_inventory.py'
          )

          if git cat-file -e "${SOURCE_REF}:${BUNDLES_DIR}" 2>/dev/null; then
            git checkout "${SOURCE_REF}" -- "${BUNDLES_DIR}"
          else
            echo "Source commit has no ${BUNDLES_DIR}; leaving published tree intact (union overlay)."
          fi

          for path in "${FILE_PATHS[@]}"; do
            if git cat-file -e "${SOURCE_REF}:${path}" 2>/dev/null; then
              git checkout "${SOURCE_REF}" -- "${path}"
            else
              git rm -f --quiet "${path}" 2>/dev/null || true
            fi
          done

          if [[ -d "${BUNDLES_DIR}" ]]; then
            uv run --no-project --python 3.11 -- python scripts/generate_corpus_inventory.py --write
            git add results-data/corpus-inventory.json
          fi

          if git diff --staged --quiet && git diff --quiet; then
            echo "After applying develop content, mirror branch matches"
            echo "published-results — nothing to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add results-data scripts benchbox/validation benchbox/core/results/query_status.py benchbox/core/results/schema_policy.py benchbox/core/results/subscale_policy.py benchbox/core/results/timing_fields.py || true

          MSG_FILE=$(mktemp)
          cat > "${MSG_FILE}" <<MSG
          chore(corpus): mirror results-data changes from develop@${GITHUB_SHA::8}

          This is an auto-generated mirror PR. The develop-side push at
          ${GITHUB_SHA} changed paths under the slim-branch allowlist. This
          commit replays those changes against published-results so the slim
          branch refreshes develop's curated maintainer subset while preserving
          accepted published-only archive content.

          Maintainer review the diff and flip the PR ready to merge.
          MSG
          awk '{sub(/^[[:space:]]{10}/,""); print}' "${MSG_FILE}" > "${MSG_FILE}.clean"
          mv "${MSG_FILE}.clean" "${MSG_FILE}"
          git commit -F "${MSG_FILE}"
          rm -f "${MSG_FILE}"

          git fetch origin published-results:refs/remotes/origin/published-results
          CURRENT_PUBLISHED_SHA=$(git rev-parse --verify origin/published-results^{commit})
          if [[ "${CURRENT_PUBLISHED_SHA}" != "${PUBLISHED_BASE_SHA}" ]]; then
            echo "::error::published-results moved during mirror creation."
            echo "Captured base: ${PUBLISHED_BASE_SHA}"
            echo "Current tip:   ${CURRENT_PUBLISHED_SHA}"
            echo "No mirror PR was opened. Re-run this workflow after the accepted publication settles."
            exit 1
          fi

          PRE_COMMIT_ALLOW_NO_CONFIG=1 git push --force-with-lease origin "${MIRROR_BRANCH}"

          MIRROR_HEAD_SHA=$(git rev-parse --verify HEAD^{commit})
          echo "mirror_head_sha=${MIRROR_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Validate mirrored corpus content
        if: steps.drift.outputs.has_drift == 'true' && steps.build.outputs.has_changes == 'true'
        id: validate
        run: |
          set -uo pipefail

          CHANGED_BUNDLES=$(git diff --no-renames --name-only --diff-filter=ACMR origin/published-results HEAD -- \
            'results-data/bundles/*.json' 'results-data/bundles/**/*.json' \
            | grep -vi '\.plans\.json$' \
            | grep -vi '\.tuning\.json$' \
            | grep -vi '\.applied\.json$' \
            | grep -vi '\.manifest\.json$' \
            | grep -vi '\.override\.json$' \
            || true)

          STATE="success"
          DESCRIPTION="Corpus content validated before mirroring."

          if [[ -n "${CHANGED_BUNDLES}" ]]; then
            echo "Validating changed bundle(s):"
            printf '  %s\n' "${CHANGED_BUNDLES}"
            if ! printf '%s\n' "${CHANGED_BUNDLES}" | xargs -d '\n' uv run --no-project --python 3.11 -- \
              python scripts/validate_submission.py --allow-partial-validation; then
              STATE="failure"
              DESCRIPTION="scripts/validate_submission.py rejected the mirrored bundle content."
            fi
          fi

          if [[ "${STATE}" == "success" ]]; then
            if ! uv run --no-project --python 3.11 -- python scripts/generate_corpus_inventory.py --check; then
              STATE="failure"
              DESCRIPTION="results-data/corpus-inventory.json is stale for the mirrored content."
            fi
          fi

          echo "state=${STATE}" >> "$GITHUB_OUTPUT"
          echo "description=${DESCRIPTION}" >> "$GITHUB_OUTPUT"

      - name: Report validation as a commit status on the mirror PR
        if: always() && steps.drift.outputs.has_drift == 'true' && steps.build.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ steps.validate.outputs.state }}
          DESCRIPTION: ${{ steps.validate.outputs.description }}
        run: |
          STATE="${STATE:-error}"
          DESCRIPTION="${DESCRIPTION:-Validation did not complete; see the workflow run.}"
          SHA=$(git rev-parse HEAD)
          gh api "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state="${STATE}" \
            -f context="corpus-mirror/validate-bundles" \
            -f description="${DESCRIPTION}" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Open or update draft PR
        id: pr
        if: always() && steps.drift.outputs.has_drift == 'true' && steps.build.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIRROR_BRANCH: ${{ steps.build.outputs.mirror_branch }}
          DIFF_COUNT: ${{ steps.drift.outputs.diff_count }}
          PUBLISHED_BASE_SHA: ${{ steps.drift.outputs.published_base_sha }}
          MIRROR_HEAD_SHA: ${{ steps.build.outputs.mirror_head_sha }}
        run: |
          EXISTING=$(gh pr list \
            --base published-results \
            --head "${MIRROR_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          BODY=$(cat <<EOF | awk '{sub(/^[[:space:]]{10}/,""); print}'
          Auto-mirror of develop's \`results-data/\` changes onto the slim
          \`published-results\` branch. Triggered by develop@\`${GITHUB_SHA::8}\`.

          **${DIFF_COUNT}** path(s) changed. Review the diff and flip the PR
          ready to merge when the develop-side change is ready to surface
          on the public corpus branch. This PR will not auto-merge.

          The mirror was built from published-results@${PUBLISHED_BASE_SHA}
          and has head ${MIRROR_HEAD_SHA}. If the accepted publication moves,
          rerun the mirror workflow instead of merging this stale proposal.

          See [\`docs/internal/adr/adr-published-results-slim-corpus-branch.md\`](https://github.com/${{ github.repository }}/blob/develop/docs/internal/adr/adr-published-results-slim-corpus-branch.md)
          for the slim-branch design and
          [\`docs/internal/results-phase-2-runbook.md\`](https://github.com/${{ github.repository }}/blob/develop/docs/internal/results-phase-2-runbook.md)
          for the operating model.
          EOF
          )

          if [[ -z "${EXISTING}" ]]; then
            gh pr create \
              --draft \
              --base published-results \
              --head "${MIRROR_BRANCH}" \
              --title "chore(corpus): mirror results-data changes from develop@${GITHUB_SHA::8}" \
              --body "${BODY}"
          else
            echo "PR #${EXISTING} already open for ${MIRROR_BRANCH}; updating body."
            gh pr edit "${EXISTING}" --body "${BODY}"
          fi

          PR_NUMBER=$(gh pr list \
            --base published-results \
            --head "${MIRROR_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::Mirror PR was not found after create/update."
            exit 1
          fi
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Verify mirror PR publication freshness
        if: always() && steps.drift.outputs.has_drift == 'true' && steps.build.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          MIRROR_BRANCH: ${{ steps.build.outputs.mirror_branch }}
          PUBLISHED_BASE_SHA: ${{ steps.drift.outputs.published_base_sha }}
          MIRROR_HEAD_SHA: ${{ steps.build.outputs.mirror_head_sha }}
        run: |
          set -euo pipefail

          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::Cannot verify mirror freshness without a PR number."
            exit 1
          fi

          CURRENT_PUBLISHED_SHA=$(gh api \
            "repos/${{ github.repository }}/git/ref/heads/published-results" \
            --jq '.object.sha')
          PR_JSON=$(gh pr view "${PR_NUMBER}" --json state,baseRefName,baseRefOid,headRefName,headRefOid)
          PR_STATE=$(jq -r '.state' <<<"${PR_JSON}")
          PR_BASE_REF=$(jq -r '.baseRefName' <<<"${PR_JSON}")
          PR_BASE_SHA=$(jq -r '.baseRefOid' <<<"${PR_JSON}")
          PR_HEAD_REF=$(jq -r '.headRefName' <<<"${PR_JSON}")
          PR_HEAD_SHA=$(jq -r '.headRefOid' <<<"${PR_JSON}")

          STALE_REASON=""
          if [[ "${CURRENT_PUBLISHED_SHA}" != "${PUBLISHED_BASE_SHA}" ]]; then
            STALE_REASON="published-results advanced after the mirror was built"
          elif [[ "${PR_STATE}" != "OPEN" ]]; then
            STALE_REASON="the created proposal no longer targets the expected base"
          elif [[ "${PR_BASE_REF}" != "published-results" ]]; then
            STALE_REASON="the created proposal no longer targets the expected base"
          elif [[ "${PR_BASE_SHA}" != "${PUBLISHED_BASE_SHA}" ]]; then
            STALE_REASON="the proposal base does not match the captured published-results revision"
          elif [[ "${PR_HEAD_REF}" != "${MIRROR_BRANCH}" ]]; then
            STALE_REASON="the created proposal head does not match the built mirror revision"
          elif [[ "${PR_HEAD_SHA}" != "${MIRROR_HEAD_SHA}" ]]; then
            STALE_REASON="the created proposal head does not match the built mirror revision"
          fi

          if [[ -n "${STALE_REASON}" ]]; then
            if [[ "${PR_STATE}" == "OPEN" ]]; then
              gh pr close "${PR_NUMBER}" \
                --comment "Closing this mirror proposal: ${STALE_REASON}. Re-run the mirror workflow to build from the current published-results tip."
            fi
            echo "::error::${STALE_REASON}; mirror PR #${PR_NUMBER} was closed."
            exit 1
          fi

          echo "Mirror PR #${PR_NUMBER} is fresh against published-results@${PUBLISHED_BASE_SHA}."

      - name: Close superseded mirror PRs
        if: steps.drift.outputs.has_drift == 'true' && steps.build.outputs.has_changes == 'true' && steps.validate.outputs.state == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail

          OPEN_MIRRORS=$(gh pr list \
            --base published-results \
            --state open \
            --limit 1000 \
            --json number,headRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository == false and (.headRefName | startswith("auto/results-mirror-"))) | "\(.number) \(.headRefName)"')

          printf '%s\n' "${OPEN_MIRRORS}" | while read -r number head; do
            [[ -n "${number}" ]] || continue
            if [[ "${number}" == "${PR_NUMBER}" ]]; then
              continue
            fi
            older_sha="${head#auto/results-mirror-}"
            if ! git merge-base --is-ancestor "${older_sha}" "${GITHUB_SHA}" 2>/dev/null; then
              echo "Leaving mirror PR #${number} open: ${older_sha} is not an ancestor of ${GITHUB_SHA::8}."
              continue
            fi
            gh pr close "${number}" \
              --comment "Superseded by #${PR_NUMBER}. Each mirror is a full snapshot of develop against published-results, and #${PR_NUMBER} was built from develop@${GITHUB_SHA::8}, which contains develop@${older_sha}." \
              || echo "::warning::Could not close superseded mirror PR #${number}."
          done

      - name: Fail the run if mirrored content failed validation
        if: always() && steps.drift.outputs.has_drift == 'true' && steps.build.outputs.has_changes == 'true' && steps.validate.outputs.state != 'success'
        run: |
          echo "::error::Mirrored corpus content did not pass validation; see the corpus-mirror/validate-bundles status on the mirror PR for detail."
          exit 1

      - name: No-op summary
        if: steps.drift.outputs.has_drift != 'true' || steps.build.outputs.has_changes != 'true'
        run: echo "No mirror PR needed — develop and published-results are already in sync for the mirrored paths."
