name: SQLGlot delivery

on:
  workflow_run:
    workflows: [CI, review-verdict, review-gate]
    types: [completed]
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify and report only; publish nothing
        type: boolean
        default: true
      retry:
        description: Propose again a delivery whose earlier pull request was closed unmerged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sqlglot-delivery
  cancel-in-progress: false
  queue: max

env:
  SQLGLOT_DELIVERY_ENABLED: ${{ vars.SQLGLOT_DELIVERY_ENABLED }}

jobs:
  readiness:
    name: Verify the delivery App without repository mutations
    if: >-
      github.repository == 'BenchBox-dev/BenchBox' && github.ref == 'refs/heads/develop' &&
      github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Authenticate and check installation scope
        env:
          APP_ID: ${{ secrets.SQLGLOT_DELIVERY_APP_ID }}
          APP_KEY: ${{ secrets.SQLGLOT_DELIVERY_APP_PRIVATE_KEY }}
        run: |
          node <<'NODE'
          const { sign } = require('node:crypto');
          const { appendFileSync } = require('node:fs');
          const repository = 'BenchBox-dev/BenchBox';
          const expected = { contents: 'write', pull_requests: 'write', metadata: 'read' };
          const summary = message => appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## SQLGlot App readiness\n\n${message}\n`);
          const requireValue = (condition, message) => { if (!condition) throw new Error(message); };
          async function request(method, path, token, body) {
            const response = await fetch(`https://api.github.com${path}`, {
              method,
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
                'Content-Type': 'application/json',
              },
              body: body === undefined ? undefined : JSON.stringify(body),
            });
            requireValue(response.ok, `${method} ${path}: HTTP ${response.status}`);
            return response.status === 204 ? null : response.json();
          }
          async function probe() {
            requireValue(/^\d+$/.test(process.env.APP_ID || '') && process.env.APP_KEY,
              'Configure SQLGLOT_DELIVERY_APP_ID and SQLGLOT_DELIVERY_APP_PRIVATE_KEY');
            const now = Math.floor(Date.now() / 1000);
            const encode = value => Buffer.from(JSON.stringify(value)).toString('base64url');
            const payload = `${encode({ alg: 'RS256', typ: 'JWT' })}.${encode({ iat: now - 60, exp: now + 300, iss: process.env.APP_ID })}`;
            let signature;
            try { signature = sign('RSA-SHA256', Buffer.from(payload), process.env.APP_KEY).toString('base64url'); }
            catch { throw new Error('The delivery App private key is invalid'); }
            const jwt = `${payload}.${signature}`;
            console.log(`::add-mask::${jwt}`);
            const installation = await request('GET', `/repos/${repository}/installation`, jwt);
            requireValue(String(installation.app_id) === process.env.APP_ID && !installation.suspended_at,
              'The configured delivery App installation is missing or suspended');
            requireValue(installation.account?.login === 'BenchBox-dev' && installation.repository_selection === 'selected',
              'Install the delivery App on selected BenchBox-dev repositories only');
            const permissions = installation.permissions || {};
            requireValue(Object.entries(expected).every(([name, level]) => permissions[name] === level) &&
              Object.entries(permissions).every(([name, level]) => expected[name] === level || level === 'none'),
              'The delivery App needs only contents/PR write and metadata read');
            const auth = await request('POST', `/app/installations/${installation.id}/access_tokens`, jwt,
              { permissions: { contents: 'read', pull_requests: 'read' } });
            requireValue(typeof auth.token === 'string' && auth.token.length > 0, 'No read-only installation token returned');
            console.log(`::add-mask::${auth.token}`);
            try {
              const access = await request('GET', '/installation/repositories?per_page=100', auth.token);
              requireValue(access.total_count === 1 && access.repositories?.length === 1 &&
                access.repositories[0].full_name?.toLowerCase() === repository.toLowerCase(),
                'The delivery App must be installed on BenchBox only');
            } finally {
              await request('DELETE', '/installation/token', auth.token);
            }
            summary('Verified configured App authentication, installation on BenchBox only, and contents/PR write permissions. The temporary probe token was read-only and revoked; no repository content or PR was changed.');
          }
          probe().catch(error => {
            summary(`Readiness failed: ${error.message}. No publication is permitted.`);
            console.error(`::error::${error.message}`);
            process.exitCode = 1;
          });
          NODE

  prepare:
    name: Verify the newest delivery and prepare its adoption
    if: >-
      github.repository == 'BenchBox-dev/BenchBox' && github.ref == 'refs/heads/develop' &&
      github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    services:
      questdb:
        image: ghcr.io/benchbox-dev/questdb@sha256:67eaed863ebb2383227919ea9a5499a4a39ceca3862c20b974c84a10e11cdf89
        credentials:
          username: ${{ github.actor }}
          password: ${{ github.token }}
        ports:
          - 8812:8812
    outputs:
      state: ${{ steps.plan.outputs.state }}
      version: ${{ steps.plan.outputs.version }}

    steps:
      - name: Checkout develop
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Verify the producer deliveries against the pin
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_DIR: ${{ runner.temp }}/sqlglot-delivery
        run: uv run -- python -m scripts.sqlglot_delivery plan --out-dir "$OUT_DIR/plan"

      - name: Prepare the adoption
        if: steps.plan.outputs.state == 'adopt'
        env:
          BENCHBOX_QUESTDB_DSN: postgresql://admin:quest@127.0.0.1:8812/qdb
          OUT_DIR: ${{ runner.temp }}/sqlglot-delivery
        run: uv run -- python -m scripts.sqlglot_delivery prepare --plan-dir "$OUT_DIR/plan" --out-dir "$OUT_DIR/prepared"

      - name: Report the plan
        if: always()
        env:
          OUT_DIR: ${{ runner.temp }}/sqlglot-delivery
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          {
            echo "## SQLGlot delivery"
            echo
            echo "Kill switch (SQLGLOT_DELIVERY_ENABLED): ${SQLGLOT_DELIVERY_ENABLED:-unset}; dry run: ${DRY_RUN}"
            echo
            echo '```json'
            cat "$OUT_DIR/plan/plan.json" 2>/dev/null || echo '{}'
            echo '```'
            if [ -f "$OUT_DIR/prepared/pull-request.json" ]; then
              echo
              echo '```json'
              cat "$OUT_DIR/prepared/pull-request.json"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hand the prepared adoption to the publish job
        if: steps.plan.outputs.state == 'adopt'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: sqlglot-delivery
          path: |
            ${{ runner.temp }}/sqlglot-delivery/prepared/plan.json
            ${{ runner.temp }}/sqlglot-delivery/prepared/pull-request.json
            ${{ runner.temp }}/sqlglot-delivery/prepared/adoption.bundle
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish the adoption pull request and arm it
    needs: [prepare, readiness]
    if: >-
      github.repository == 'BenchBox-dev/BenchBox' && github.ref == 'refs/heads/develop' &&
      vars.SQLGLOT_DELIVERY_ENABLED == 'true' && needs.prepare.outputs.state == 'adopt' &&
      (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout develop
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the prepared adoption
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: sqlglot-delivery
          path: ${{ runner.temp }}/sqlglot-delivery/prepared

      - name: Require the delivery App credentials
        env:
          APP_ID: ${{ secrets.SQLGLOT_DELIVERY_APP_ID }}
          APP_KEY: ${{ secrets.SQLGLOT_DELIVERY_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::The SQLGLOT_DELIVERY_APP_ID and SQLGLOT_DELIVERY_APP_PRIVATE_KEY secrets are not both configured, so nothing was published. An owner installs the delivery App on BenchBox-dev/BenchBox with contents and pull-requests write, then sets both secrets."
            exit 1
          fi

      - name: Mint the App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.SQLGLOT_DELIVERY_APP_ID }}
          private-key: ${{ secrets.SQLGLOT_DELIVERY_APP_PRIVATE_KEY }}
          owner: BenchBox-dev
          repositories: BenchBox
          permission-contents: write
          permission-pull-requests: write

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Push the branch and open or reconcile the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          PREPARED: ${{ runner.temp }}/sqlglot-delivery/prepared
          RETRY_FLAG: ${{ inputs.retry && '--retry' || '' }}
        run: >-
          uv run -- python -m scripts.sqlglot_delivery publish --prepared "$PREPARED" --clone .
          --repo "$GITHUB_REPOSITORY" --automation-login "$APP_LOGIN" $RETRY_FLAG

      - name: Arm the adoption pull request through the repository arming rules
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: >-
          uv run -- python -m scripts.sqlglot_delivery arm --clone .
          --repo "$GITHUB_REPOSITORY" --automation-login "$APP_LOGIN"

  arm:
    name: Recheck adoption arming after CI and review
    if: >-
      github.repository == 'BenchBox-dev/BenchBox' && github.ref == 'refs/heads/develop' &&
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == 'BenchBox-dev/BenchBox' &&
      startsWith(github.event.workflow_run.head_branch, 'chore/sqlglot-') &&
      vars.SQLGLOT_DELIVERY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout develop
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false
      - name: Mint the App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.SQLGLOT_DELIVERY_APP_ID }}
          private-key: ${{ secrets.SQLGLOT_DELIVERY_APP_PRIVATE_KEY }}
          owner: BenchBox-dev
          repositories: BenchBox
          permission-contents: write
          permission-pull-requests: write
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Install dependencies
        run: uv sync --group dev
      - name: Arm through the repository arming rules
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: >-
          uv run -- python -m scripts.sqlglot_delivery arm --clone .
          --repo "$GITHUB_REPOSITORY" --automation-login "$APP_LOGIN"
