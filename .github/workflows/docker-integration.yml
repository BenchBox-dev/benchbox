name: Docker integration

env:
  BENCHBOX_HEAVY_ADMIT_MIN_GIB: "1.5"
  BENCHBOX_HEAVY_MIN_FREE_DISK_GIB: "5"

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Comma-separated subset to run (default: all). Choices: postgres,clickhouse,trino,singlestore,firebolt'
        required: false
        default: 'all'
  pull_request:
    paths:
      - 'benchbox/platforms/singlestore.py'
      - 'docker/singlestore/**'
      - 'tests/integration/platforms/test_singlestore_live.py'
      - 'tests/integration/platforms/test_singlestore_tpcds_maintenance_live.py'
      - 'benchbox/platforms/firebolt.py'
      - 'docker/firebolt/**'
      - 'tests/integration/platforms/test_firebolt_core_live.py'
      - 'tests/integration/platforms/test_firebolt_core_native_load_live.py'
      - '.github/workflows/docker-integration.yml'
  schedule:
    - cron: '0 7 * * *'

concurrency:
  group: docker-integration-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-input:
    runs-on: ubuntu-latest
    outputs:
      run_postgres: ${{ steps.select.outputs.run_postgres }}
      run_clickhouse: ${{ steps.select.outputs.run_clickhouse }}
      run_trino: ${{ steps.select.outputs.run_trino }}
      run_singlestore: ${{ steps.select.outputs.run_singlestore }}
      run_firebolt: ${{ steps.select.outputs.run_firebolt }}
    steps:
      - name: Validate services input and select jobs
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          SERVICES: ${{ inputs.services }}
        run: |
          set -euo pipefail
          SERVICE_NAMES=(postgres clickhouse trino singlestore firebolt)
          PULL_REQUEST_SERVICES=(singlestore firebolt)
          declare -A selected
          for name in "${SERVICE_NAMES[@]}"; do selected[$name]=false; done
          emit() {
            local summary=""
            for name in "${SERVICE_NAMES[@]}"; do
              echo "run_$name=${selected[$name]}" >> "$GITHUB_OUTPUT"
              summary="$summary $name=${selected[$name]}"
            done
            echo "Selected:$summary"
          }
          if [ "$EVENT_NAME" = pull_request ]; then
            for name in "${PULL_REQUEST_SERVICES[@]}"; do selected[$name]=true; done
            emit
            exit 0
          fi
          if [ "$EVENT_NAME" != workflow_dispatch ]; then
            for name in "${SERVICE_NAMES[@]}"; do selected[$name]=true; done
            emit
            exit 0
          fi
          IFS=',' read -ra TOKENS <<< "$SERVICES"
          for tok in "${TOKENS[@]}"; do
            t="$(echo "$tok" | tr -d '[:space:]')"
            case "$t" in
              all) for name in "${SERVICE_NAMES[@]}"; do selected[$name]=true; done ;;
              postgres|clickhouse|trino|singlestore|firebolt) selected[$t]=true ;;
              '')
                echo "::error::Empty service token in services input '$SERVICES'."
                exit 1
                ;;
              *)
                echo "::error::Unknown service '$t'. Choices: postgres,clickhouse,trino,singlestore,firebolt (or all)."
                exit 1
                ;;
            esac
          done
          any=false
          for name in "${SERVICE_NAMES[@]}"; do
            if [ "${selected[$name]}" = true ]; then any=true; fi
          done
          if [ "$any" = false ]; then
            echo "::error::No services selected."
            exit 1
          fi
          emit

  mirror-clickhouse:
    needs: validate-input
    if: ${{ needs.validate-input.outputs.run_clickhouse == 'true' }}
    uses: ./.github/workflows/mirror-ci-images.yml
    permissions:
      contents: read
      packages: write
    with:
      images: '["clickhouse"]'

  mirror-trino:
    needs: validate-input
    if: ${{ needs.validate-input.outputs.run_trino == 'true' }}
    uses: ./.github/workflows/mirror-ci-images.yml
    permissions:
      contents: read
      packages: write
    with:
      images: '["trino"]'

  mirror-postgres:
    needs: validate-input
    if: ${{ needs.validate-input.outputs.run_postgres == 'true' }}
    uses: ./.github/workflows/mirror-ci-images.yml
    permissions:
      contents: read
      packages: write
    with:
      images: '["postgres"]'

  postgres:
    needs: [validate-input, mirror-postgres]
    if: ${{ needs.validate-input.outputs.run_postgres == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      POSTGRES_IMAGE: ghcr.io/benchbox-dev/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Bring up PostgreSQL compose stack
        run: docker compose -f docker/postgresql/docker-compose.yml up -d --wait

      - name: Run PostgreSQL live integration tests
        run: |
          set -o pipefail
          uv run -- python -m pytest tests/integration/platforms/test_postgresql_live.py \
            tests/integration/test_throughput_session_isolation.py::TestPostgreSQLIndependentConnectionIsolatesSessions \
            -m "live_postgresql" --tb=short -v -p no:cacheprovider \
            | tee /tmp/pg_docker_output.txt
          if ! grep -Eq '[0-9]+ passed' /tmp/pg_docker_output.txt; then
            echo "::error::PostgreSQL Docker integration produced no passing tests."
            exit 1
          fi

      - name: Tear down compose stack
        if: always()
        run: docker compose -f docker/postgresql/docker-compose.yml down -v

  clickhouse:
    needs: [validate-input, mirror-clickhouse]
    if: ${{ needs.validate-input.outputs.run_clickhouse == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      CLICKHOUSE_IMAGE: ghcr.io/benchbox-dev/clickhouse:25.8@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Bring up ClickHouse compose stack
        env:
          CLICKHOUSE_MEMORY_LIMIT: 4g
        run: docker compose -f docker/clickhouse/docker-compose.yml up -d --wait

      - name: Run ClickHouse live integration tests
        run: |
          set -o pipefail
          uv run -- python -m pytest tests/integration/platforms/test_clickhouse_live.py \
            -m "live_clickhouse" --tb=short -v -p no:cacheprovider \
            | tee /tmp/ch_docker_output.txt
          if ! grep -Eq '[0-9]+ passed' /tmp/ch_docker_output.txt; then
            echo "::error::ClickHouse Docker integration produced no passing tests."
            exit 1
          fi

      - name: Tear down compose stack
        if: always()
        run: docker compose -f docker/clickhouse/docker-compose.yml down -v

  trino:
    needs: [validate-input, mirror-trino]
    if: ${{ needs.validate-input.outputs.run_trino == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      TRINO_IMAGE: ghcr.io/benchbox-dev/trino:480@sha256:1565e8cac299a32dd9177a4da2d748da4ceb9f1560a9c409d1d18fd72ea5253e
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Bring up Trino compose stack
        run: docker compose -f docker/trino/docker-compose.yml up -d --wait

      - name: Run Trino live integration tests
        run: |
          set -o pipefail
          uv run -- python -m pytest tests/integration/platforms/test_trino_live.py \
            -m "live_trino" --tb=short -v -p no:cacheprovider \
            | tee /tmp/trino_docker_output.txt
          if ! grep -Eq '[0-9]+ passed' /tmp/trino_docker_output.txt; then
            echo "::error::Trino Docker integration produced no passing tests."
            exit 1
          fi

      - name: Tear down compose stack
        if: always()
        run: docker compose -f docker/trino/docker-compose.yml down -v

  singlestore:
    needs: validate-input
    if: ${{ needs.validate-input.outputs.run_singlestore == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      SINGLESTORE_IMAGE: ghcr.io/singlestore-labs/singlestoredb-dev:latest@sha256:2f181587a74b63a83e7dbd46b02e9dce031b8cacf1f5651bff297b2d8c87df37
      SINGLESTORE_MEMORY_LIMIT: 4g
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev --extra singlestore

      - name: Bring up SingleStore compose stack
        run: docker compose -f docker/singlestore/docker-compose.yml up -d --wait --wait-timeout 600

      - name: Run SingleStore live integration tests
        run: |
          set -o pipefail
          uv run --extra singlestore -- python -m pytest tests/integration/platforms/test_singlestore_live.py \
            tests/integration/platforms/test_singlestore_tpcds_maintenance_live.py \
            -m "live_singlestore" --tb=short -v -p no:cacheprovider \
            | tee /tmp/singlestore_docker_output.txt
          if ! grep -Eq '[0-9]+ passed' /tmp/singlestore_docker_output.txt; then
            echo "::error::SingleStore Docker integration produced no passing tests."
            exit 1
          fi

      - name: Tear down compose stack
        if: always()
        run: docker compose -f docker/singlestore/docker-compose.yml down -v

  firebolt:
    needs: validate-input
    if: ${{ needs.validate-input.outputs.run_firebolt == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      FIREBOLT_IMAGE: ghcr.io/firebolt-db/firebolt-core:preview-rc@sha256:c8a7fa4630105cb4f5328fd62c504a62c445ff66574e58a8e211b3d7bf0b65b5
      FIREBOLT_CORE_IMAGE_REF: ghcr.io/firebolt-db/firebolt-core:preview-rc@sha256:c8a7fa4630105cb4f5328fd62c504a62c445ff66574e58a8e211b3d7bf0b65b5
      FIREBOLT_CORE_HOST: localhost
      FIREBOLT_CORE_PORT: "3473"
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev --extra firebolt

      - name: Bring up Firebolt Core compose stack
        run: docker compose -f docker/firebolt/docker-compose.yml up -d --wait --wait-timeout 600

      - name: Show runner and container limits
        run: |
          uname -a
          free -m
          nproc
          docker compose -f docker/firebolt/docker-compose.yml exec -T firebolt bash -c 'ulimit -l' || true

      - name: Run Firebolt Core native load verification
        run: |
          set -o pipefail
          uv run --extra firebolt -- python -m pytest tests/integration/platforms/test_firebolt_core_native_load_live.py \
            -m "live_firebolt_core" --tb=short -v -s -p no:cacheprovider \
            | tee /tmp/firebolt_docker_output.txt
          if ! grep -Eq '[0-9]+ passed' /tmp/firebolt_docker_output.txt; then
            echo "::error::Firebolt Core native load verification produced no passing tests."
            exit 1
          fi

      - name: Collect Firebolt Core container logs
        if: always()
        run: docker compose -f docker/firebolt/docker-compose.yml logs --no-color --tail 500 firebolt > /tmp/firebolt_core_container.log 2>&1 || true

      - name: Upload Firebolt logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: firebolt-core-native-load-logs
          path: |
            /tmp/firebolt_docker_output.txt
            /tmp/firebolt_core_container.log
          if-no-files-found: warn

      - name: Tear down compose stack
        if: always()
        run: docker compose -f docker/firebolt/docker-compose.yml down -v
