          REVIEWER: ${{ needs.select-5.outputs.reviewer }}
        run: >-
          python3 -m _project.scripts.oracle_reviewers.cli ensure-attempt --plan "$RUNNER_TEMP/oracle-plan/plan.json" --slot 5 --reviewer "$REVIEWER"
          --out-dir "$RUNNER_TEMP/oracle-attempt"

      - name: Upload the attempt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oracle-verdict-attempt-5
          path: ${{ runner.temp }}/oracle-attempt/attempt-5.json
          if-no-files-found: error
          retention-days: 7

  attempt-5-agy:
    name: attempt 5 (agy ${{ needs.select-5.outputs.reviewer }})
    needs: [plan, select-5]
    if: ${{ !cancelled() && needs.select-5.outputs.harness == 'agy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: oracle
    permissions:
      contents: read
    steps:
      - name: Check out the trusted develop copy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            .github/oracle-reviewers.yml
            .github/soundness-paths.txt
            _project/scripts/oracle_reviewers
            _project/scripts/soundness_paths.py
          sparse-checkout-cone-mode: false

      - name: Check out the pull request head for reading only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.plan.outputs.head_sha }}
          path: workspace
          fetch-depth: 1
          persist-credentials: false

      - name: Download the plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: oracle-verdict-plan
          path: ${{ runner.temp }}/oracle-plan

      - name: Install agy
        continue-on-error: true
        env:
          AGY_URL: https://storage.googleapis.com/antigravity-public/antigravity-cli/1.3.3-5524738307653632/linux-x64/cli_linux_x64.tar.gz
          AGY_SHA256: 8ee3ca32574c431285efbf4d4732f7f8d53e959370bc4a61646e4fa496f7f2b6
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 "$AGY_URL" -o "$RUNNER_TEMP/agy.tar.gz"
          echo "$AGY_SHA256  $RUNNER_TEMP/agy.tar.gz" | sha256sum --check --strict
          mkdir -p "$HOME/.local/bin" "$HOME/.gemini/antigravity-cli"
          tar -xzf "$RUNNER_TEMP/agy.tar.gz" -C "$RUNNER_TEMP" antigravity
          install -m 0755 "$RUNNER_TEMP/antigravity" "$HOME/.local/bin/agy"
          echo '{"modelProvider": "gemini"}' > "$HOME/.gemini/antigravity-cli/settings.json"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "Installed agy $("$HOME/.local/bin/agy" --version)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the reviewer
        working-directory: trusted
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGY_CLI_DISABLE_AUTO_UPDATE: '1'
          REVIEWER: ${{ needs.select-5.outputs.reviewer }}
        run: >-
          python3 -m _project.scripts.oracle_reviewers.cli review --plan "$RUNNER_TEMP/oracle-plan/plan.json" --slot 5 --reviewer "$REVIEWER" --harness agy
          --workspace "$GITHUB_WORKSPACE/workspace" --scratch "$RUNNER_TEMP/oracle-scratch"
          --out-dir "$RUNNER_TEMP/oracle-attempt"

      - name: Record an absence if the reviewer did not finish
        if: always()
        working-directory: trusted
        env:
          REVIEWER: ${{ needs.select-5.outputs.reviewer }}
        run: >-
          python3 -m _project.scripts.oracle_reviewers.cli ensure-attempt --plan "$RUNNER_TEMP/oracle-plan/plan.json" --slot 5 --reviewer "$REVIEWER"
          --out-dir "$RUNNER_TEMP/oracle-attempt"

      - name: Upload the attempt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oracle-verdict-attempt-5
          path: ${{ runner.temp }}/oracle-attempt/attempt-5.json
          if-no-files-found: error
          retention-days: 7

  post:
    name: post
    needs:
      - plan
      - select-1
      - select-2
      - select-3
      - select-4
      - select-5
      - attempt-1-claude
      - attempt-1-codex
      - attempt-1-muse
      - attempt-1-agy
      - attempt-2-claude
      - attempt-2-codex
      - attempt-2-muse
      - attempt-2-agy
      - attempt-3-claude
      - attempt-3-codex
      - attempt-3-muse
      - attempt-3-agy
      - attempt-4-claude
      - attempt-4-codex
      - attempt-4-muse
      - attempt-4-agy
      - attempt-5-claude
      - attempt-5-codex
      - attempt-5-muse
      - attempt-5-agy
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.post == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: oracle
    permissions:
      actions: write
      contents: read
    env:
      HAS_APP: ${{ secrets.ORACLE_APP_ID != '' && secrets.ORACLE_APP_PRIVATE_KEY != '' }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ needs.plan.outputs.pr }}
      HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
    steps:
      - name: Check out the trusted develop copy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/oracle-reviewers.yml
            .github/soundness-paths.txt
            _project/scripts/oracle_reviewers
            _project/scripts/soundness_paths.py
          sparse-checkout-cone-mode: false

      - name: Download the plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: oracle-verdict-plan
          path: ${{ runner.temp }}/oracle-plan

      - name: Download this run's attempts
        if: needs.plan.outputs.decision == 'review'
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: oracle-verdict-attempt-*
          merge-multiple: true
          path: ${{ runner.temp }}/oracle-attempts

      - name: Validate this run's artifacts and decide
        id: finalize
        run: >-
          python3 -m _project.scripts.oracle_reviewers.cli finalize --plan "$RUNNER_TEMP/oracle-plan/plan.json" --attempts-dir "$RUNNER_TEMP/oracle-attempts"
          --out-dir "$RUNNER_TEMP/oracle-final"

      - name: Upload the retry state
        if: steps.finalize.outputs.has_state == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oracle-verdict-state-${{ needs.plan.outputs.pr }}
          path: ${{ runner.temp }}/oracle-final/state/state.json
          if-no-files-found: error
          retention-days: 7

      - name: Log the result when the App is not configured
        if: env.HAS_APP != 'true'
        env:
          RESULT_STATE: ${{ steps.finalize.outputs.state }}
        run: echo "::notice::oracle-verdict is not posted because the App secrets are not set; result $RESULT_STATE for $HEAD_SHA"

      - name: Mint the App token
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.ORACLE_APP_ID }}
          private-key: ${{ secrets.ORACLE_APP_PRIVATE_KEY }}
          permission-statuses: write
          permission-pull-requests: write

      - name: Skip a result this head already has
        id: guard
        if: env.HAS_APP == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 -m _project.scripts.oracle_reviewers.cli guard --plan "$RUNNER_TEMP/oracle-plan/plan.json"

      - name: Post the commit status
        if: env.HAS_APP == 'true' && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" --input "$RUNNER_TEMP/oracle-final/status.json"

      - name: Post the findings comment
        if: env.HAS_APP == 'true' && steps.guard.outputs.skip != 'true' && steps.finalize.outputs.comment == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" --input "$RUNNER_TEMP/oracle-final/comment.json"

      - name: Post the findings review
        if: env.HAS_APP == 'true' && steps.guard.outputs.skip != 'true' && steps.finalize.outputs.review == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api --method POST "repos/$REPO/pulls/$PR_NUMBER/reviews" --input "$RUNNER_TEMP/oracle-final/review.json"

      - name: Rerun the failed synchronize suite for this head
        if: env.HAS_APP == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IDS="$(gh run list --repo "$REPO" --workflow oracle-review.yml --limit 100 --json databaseId,headSha,event,conclusion --jq '[.[] | select(.headSha == env.HEAD_SHA and (.event == "pull_request" or .event == "pull_request_review") and .conclusion == "failure") | .databaseId] | join(" ")')"
          for id in $IDS; do
            gh run rerun "$id" --failed --repo "$REPO" || echo "::warning::could not rerun run $id; skipping"
          done
