      - name: Select the reviewer for attempt 5
        id: select
        run: python3 -m _project.scripts.oracle_reviewers.cli select --plan "$RUNNER_TEMP/oracle-plan/plan.json" --attempts-dir "$RUNNER_TEMP/oracle-attempts" --slot 5 --classification "$RUNNER_TEMP/oracle-classification/classification.json"

