      - name: Select the reviewer for attempt 3
        id: select
        run: python3 -m _project.scripts.oracle_reviewers.cli select --plan "$RUNNER_TEMP/oracle-plan/plan.json" --attempts-dir "$RUNNER_TEMP/oracle-attempts" --slot 3 --classification "$RUNNER_TEMP/oracle-classification/classification.json"

  attempt-3-omp:
    name: attempt 3 (omp ${{ needs.select-3.outputs.reviewer }})
    needs: [plan, select-3]
    if: ${{ !cancelled() && needs.select-3.outputs.reviewer != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: oracle
    permissions:
      contents: read
      id-token: write
    env:
      HAS_TAILNET: ${{ secrets.TS_OAUTH_CLIENT_ID != '' && secrets.TS_AUDIENCE != '' }}
    steps:
      - name: Check out the trusted develop copy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            .github/oracle-reviewers.yml
            .github/oracle-omp-config.yml
            .github/soundness-paths.txt
            _project/scripts/oracle_reviewers
            _project/scripts/soundness_paths.py
            .github/inert-paths.txt
            _project/scripts/inert_paths.py
          sparse-checkout-cone-mode: false

      - name: Check out the pull request head for reading only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.plan.outputs.head_sha }}
          path: workspace
          fetch-depth: 1
