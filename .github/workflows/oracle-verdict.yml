          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:oracle-ci

      - name: Run the reviewer
        working-directory: trusted
        env:
          OMP_GATEWAY_TOKEN: ${{ secrets.ORACLE_GATEWAY_TOKEN }}
          REVIEWER: ${{ needs.select-3.outputs.reviewer }}
        run: >-
          python3 -m _project.scripts.oracle_reviewers.cli review --plan "$RUNNER_TEMP/oracle-plan/plan.json" --slot 3 --reviewer "$REVIEWER" --harness omp
