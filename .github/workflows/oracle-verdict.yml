    needs: [plan, select-5]
    if: ${{ !cancelled() && needs.select-5.outputs.reviewer != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: oracle
    permissions:
      contents: read
      id-token: write
    env:
      HAS_TAILNET: ${{ secrets.TS_OAUTH_CLIENT_ID != '' && secrets.TS_AUDIENCE != '' }}
    steps:
      - name: Check out the trusted develop copy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
