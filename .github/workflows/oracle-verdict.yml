          --out-dir "$RUNNER_TEMP/oracle-attempt"
          --classification "$RUNNER_TEMP/oracle-classification/classification.json"

      - name: Record an absence if the reviewer did not finish
        if: always()
        working-directory: trusted
        env:
          REVIEWER: ${{ needs.select-4.outputs.reviewer }}
        run: >-
          python3 -m _project.scripts.oracle_reviewers.cli ensure-attempt --plan "$RUNNER_TEMP/oracle-plan/plan.json" --slot 4 --reviewer "$REVIEWER"
          --out-dir "$RUNNER_TEMP/oracle-attempt"

      - name: Upload the attempt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oracle-verdict-attempt-4
          path: ${{ runner.temp }}/oracle-attempt/attempt-4.json
          if-no-files-found: error
          retention-days: 7
  select-5:
