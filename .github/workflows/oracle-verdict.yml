name: oracle-verdict

run-name: oracle-verdict (${{ github.event_name }} pr=${{ github.event.pull_request.number || github.event.issue.number || inputs.pr || 'sweep' }}${{ (github.event.pull_request.head.sha || inputs.head) && format(' head={0}', github.event.pull_request.head.sha || inputs.head) || '' }})

on:
  push:
    branches: [develop]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
        type: string
      head:
        description: Head commit the dispatch targets; a different current head skips the run
        required: false
        type: string
      reason:
        description: Why this dispatch was requested
        required: false
        type: string
  schedule:
    - cron: '23 * * * *'

permissions: {}

concurrency:
  group: oracle-verdict-${{ ((github.event_name == 'schedule' || github.event_name == 'push') && 'sweep') || (((github.event_name == 'pull_request_target' && (github.event.action != 'edited' || github.event.changes.base)) || (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/oracle-review') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) || github.event_name == 'workflow_dispatch') && format('pr-{0}', github.event.pull_request.number || github.event.issue.number || inputs.pr) || format('run-{0}', github.run_id)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  sweep:
    name: sweep
    if: github.event_name == 'schedule' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: oracle
    permissions:
      actions: write
      contents: read
      pull-requests: read
    env:
      HAS_APP: ${{ secrets.ORACLE_APP_ID != '' }}
    steps:
      - name: Check out the trusted develop copy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/oracle-reviewers.yml
            .github/soundness-paths.txt
            _project/scripts/oracle_reviewers
            _project/scripts/soundness_paths.py
            .github/inert-paths.txt
            _project/scripts/inert_paths.py
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Mint the App token for failure statuses
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.ORACLE_APP_ID }}
          private-key: ${{ secrets.ORACLE_APP_PRIVATE_KEY }}
          permission-statuses: write

      - name: Dispatch due retries
        env:
          GH_TOKEN: ${{ github.token }}
          SURFACE_TOKEN: ${{ steps.app.outputs.token }}
        run: uv run --isolated --no-project --python 3.12 --with pyyaml==6.0.3 -- python -m _project.scripts.oracle_reviewers.cli sweep --policy .github/oracle-reviewers.yml

  review:
    name: review
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && (github.event.action != 'edited' || github.event.changes.base)) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/oracle-review') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 255
    environment: oracle
    permissions:
      actions: write
      contents: read
      pull-requests: read
      id-token: write
    env:
      HAS_TAILNET: ${{ secrets.TS_OAUTH_CLIENT_ID != '' && secrets.TS_AUDIENCE != '' }}
      HAS_APP: ${{ secrets.ORACLE_APP_ID != '' }}
      REPO: ${{ github.repository }}
    steps:
      - name: Refuse a dispatch from any ref other than develop
        if: github.event_name == 'workflow_dispatch'
        env:
          CURRENT_REF: ${{ github.ref }}
        run: |
          if [ "$CURRENT_REF" != refs/heads/develop ]; then
            echo "oracle-verdict: error: dispatch runs only from develop" >&2
            exit 2
          fi

      - name: Check out the trusted develop copy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            .github/oracle-reviewers.yml
            .github/oracle-omp-config.yml
            .github/workflows/oracle-verdict.yml
            .github/soundness-paths.txt
            _project/scripts/oracle_reviewers
            _project/scripts/soundness_paths.py
            .github/inert-paths.txt
            _project/scripts/inert_paths.py
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Plan the review
        id: plan
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
        run: >-
          uv run --isolated --no-project --python 3.12 --with pyyaml==6.0.3 -- python -m _project.scripts.oracle_reviewers.cli plan --policy .github/oracle-reviewers.yml
          --pr "$PR_NUMBER" --out "$RUNNER_TEMP/oracle-plan"

      - name: Check out the pull request head for reading only
        if: steps.plan.outputs.decision == 'review'
        continue-on-error: true
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ steps.plan.outputs.head_sha }}
          path: workspace
          fetch-depth: 1
          persist-credentials: false

      - name: Classify the change and select the reviewer for attempt 1
        id: classify
        if: steps.plan.outputs.decision == 'review'
        continue-on-error: true
        working-directory: trusted
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: >-
          python3 -m _project.scripts.oracle_reviewers.cli select --plan "$RUNNER_TEMP/oracle-plan/plan.json" --attempts-dir "$RUNNER_TEMP/oracle-attempts" --slot 1
          --classification "$RUNNER_TEMP/oracle-classification/classification.json"

      - name: Scan the disk for secret values before the reviewer runs
        if: steps.plan.outputs.decision == 'review'
        working-directory: trusted
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          JOB_TOKEN: ${{ github.token }}
        run: >-
          python3 -m _project.scripts.oracle_reviewers.cli scan-disk --root "$HOME" --root "$RUNNER_TEMP" --root "$GITHUB_WORKSPACE/trusted" --root "$GITHUB_WORKSPACE/workspace"
          --root /tmp --root /var/tmp --root /dev/shm --root "${TMPDIR:-/tmp}"
          --env TYPESAFE_API_KEY --env JOB_TOKEN

      - name: Install omp
        if: steps.plan.outputs.decision == 'review'
        continue-on-error: true
        working-directory: trusted
        run: |
          binary=$(uv run --isolated --no-project --python 3.12 --with pyyaml==6.0.3 -- python -m _project.scripts.oracle_reviewers.cli install-omp --policy .github/oracle-reviewers.yml)
          "$binary" --version | tee -a "$GITHUB_STEP_SUMMARY"
          echo "ORACLE_OMP_BINARY=$binary" >> "$GITHUB_ENV"

      - name: Join the tailnet to reach the credential gateway
        if: steps.plan.outputs.decision == 'review' && env.HAS_TAILNET == 'true'
        continue-on-error: true
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:oracle-ci

      - name: Verify Linux process isolation
        if: steps.plan.outputs.decision == 'review'
        working-directory: trusted
        run: python3 -m _project.scripts.oracle_reviewers.isolation

      - name: Run the attempt loop
        id: loop
        if: steps.plan.outputs.decision == 'review'
        working-directory: trusted
        env:
          OMP_GATEWAY_TOKEN: ${{ secrets.ORACLE_GATEWAY_TOKEN }}
          ORACLE_GATEWAY_URL: ${{ secrets.ORACLE_GATEWAY_URL }}
        run: >-
          python3 -m _project.scripts.oracle_reviewers.cli attempts --plan "$RUNNER_TEMP/oracle-plan/plan.json" --attempts-dir "$RUNNER_TEMP/oracle-attempts"
          --classification "$RUNNER_TEMP/oracle-classification/classification.json"
          --workspace "$GITHUB_WORKSPACE/workspace" --home-root "$RUNNER_TEMP"

      - name: Scan the disk for secret values after the reviewer exits
        if: steps.plan.outputs.decision == 'review'
        working-directory: trusted
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          JOB_TOKEN: ${{ github.token }}
        run: >-
          python3 -m _project.scripts.oracle_reviewers.cli scan-disk --root "$HOME" --root "$RUNNER_TEMP" --root "$GITHUB_WORKSPACE/trusted" --root "$GITHUB_WORKSPACE/workspace"
          --root /tmp --root /var/tmp --root /dev/shm --root "${TMPDIR:-/tmp}"
          --env TYPESAFE_API_KEY --env JOB_TOKEN

      - name: Validate this run's attempts and decide
        id: finalize
        if: steps.plan.outputs.post == 'true'
        working-directory: trusted
        run: >-
          python3 -m _project.scripts.oracle_reviewers.cli finalize --plan "$RUNNER_TEMP/oracle-plan/plan.json" --attempts-dir "$RUNNER_TEMP/oracle-attempts"
          --out-dir "$RUNNER_TEMP/oracle-final" --classification "$RUNNER_TEMP/oracle-classification/classification.json"
          --workspace "$GITHUB_WORKSPACE/workspace"

      - name: Redact every secret value held by the job from the results
        id: redact
        if: steps.plan.outputs.post == 'true'
        working-directory: trusted
        env:
          OMP_GATEWAY_TOKEN: ${{ secrets.ORACLE_GATEWAY_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          ORACLE_GATEWAY_URL: ${{ secrets.ORACLE_GATEWAY_URL }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
          JOB_TOKEN: ${{ github.token }}
        run: >-
          python3 -m _project.scripts.oracle_reviewers.cli redact-check --path "$RUNNER_TEMP/oracle-attempts" --path "$RUNNER_TEMP/oracle-final"
          --env JOB_TOKEN

      - name: Log the result when the App is not configured
        if: steps.plan.outputs.post == 'true' && env.HAS_APP != 'true'
        env:
          RESULT_STATE: ${{ steps.finalize.outputs.state }}
          HEAD_SHA: ${{ steps.plan.outputs.head_sha }}
        run: echo "::notice::oracle-verdict is not posted because the App secrets are not set; result $RESULT_STATE for $HEAD_SHA"

      - name: Mint the App token
        id: app
        if: steps.plan.outputs.post == 'true' && env.HAS_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.ORACLE_APP_ID }}
          private-key: ${{ secrets.ORACLE_APP_PRIVATE_KEY }}
          permission-statuses: write
          permission-pull-requests: write

      - name: Skip a result this head already has
        id: guard
        if: steps.plan.outputs.post == 'true' && env.HAS_APP == 'true'
        working-directory: trusted
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 -m _project.scripts.oracle_reviewers.cli guard --plan "$RUNNER_TEMP/oracle-plan/plan.json"

      - name: Post the commit status
        id: status
        if: steps.plan.outputs.post == 'true' && env.HAS_APP == 'true' && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_SHA: ${{ steps.plan.outputs.head_sha }}
        run: gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" --input "$RUNNER_TEMP/oracle-final/status.json"

      - name: Post the findings comment
        if: steps.plan.outputs.post == 'true' && env.HAS_APP == 'true' && steps.guard.outputs.skip != 'true' && steps.finalize.outputs.comment == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ steps.plan.outputs.pr }}
        run: gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" --input "$RUNNER_TEMP/oracle-final/comment.json"

      - name: Post the findings review
        if: steps.plan.outputs.post == 'true' && env.HAS_APP == 'true' && steps.guard.outputs.skip != 'true' && steps.finalize.outputs.review == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ steps.plan.outputs.pr }}
        run: gh api --method POST "repos/$REPO/pulls/$PR_NUMBER/reviews" --input "$RUNNER_TEMP/oracle-final/review.json"

      - name: Upload the retry state
        if: steps.status.outcome == 'success' && steps.finalize.outputs.has_state == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oracle-verdict-state-${{ steps.plan.outputs.pr }}
          path: ${{ runner.temp }}/oracle-final/state/state.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload attempt 1
        if: ${{ always() && steps.redact.outcome == 'success' && steps.loop.outputs.attempts >= 1 }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oracle-verdict-attempt-1
          path: ${{ runner.temp }}/oracle-attempts/attempt-1.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload attempt 2
        if: ${{ always() && steps.redact.outcome == 'success' && steps.loop.outputs.attempts >= 2 }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oracle-verdict-attempt-2
          path: ${{ runner.temp }}/oracle-attempts/attempt-2.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload attempt 3
        if: ${{ always() && steps.redact.outcome == 'success' && steps.loop.outputs.attempts >= 3 }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oracle-verdict-attempt-3
          path: ${{ runner.temp }}/oracle-attempts/attempt-3.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload attempt 4
        if: ${{ always() && steps.redact.outcome == 'success' && steps.loop.outputs.attempts >= 4 }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oracle-verdict-attempt-4
          path: ${{ runner.temp }}/oracle-attempts/attempt-4.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload attempt 5
        if: ${{ always() && steps.redact.outcome == 'success' && steps.loop.outputs.attempts >= 5 }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oracle-verdict-attempt-5
          path: ${{ runner.temp }}/oracle-attempts/attempt-5.json
          if-no-files-found: error
          retention-days: 7

      - name: Dispatch the gate for the reviewed head
        if: steps.plan.outputs.post == 'true' && env.HAS_APP == 'true' && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          READ_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ steps.plan.outputs.pr }}
          HEAD_SHA: ${{ steps.plan.outputs.head_sha }}
        run: |
          base=$(GH_TOKEN="$READ_TOKEN" gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .base.ref)
          if [ "$base" = develop ]; then
            gh workflow run oracle-gate.yml --repo "$REPO" --ref develop -f pr="$PR_NUMBER" -f head_sha="$HEAD_SHA"
          fi
