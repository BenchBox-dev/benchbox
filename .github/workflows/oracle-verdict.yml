          --out-dir "$RUNNER_TEMP/oracle-attempt"

      - name: Upload the attempt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oracle-verdict-attempt-3
          path: ${{ runner.temp }}/oracle-attempt/attempt-3.json
          if-no-files-found: error
          retention-days: 7
  select-4:
    name: select 4
    needs: [plan, select-3, attempt-3-omp]
    if: ${{ !cancelled() && needs.plan.outputs.decision == 'review' && needs.select-3.outputs.reviewer != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      reviewer: ${{ steps.select.outputs.reviewer }}
