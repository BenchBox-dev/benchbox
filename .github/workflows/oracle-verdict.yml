name: oracle-verdict

run-name: oracle-verdict (${{ github.event_name }} pr=${{ github.event.pull_request.number || github.event.issue.number || inputs.pr || 'sweep' }})

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
        type: string
  schedule:
    - cron: '23 * * * *'

permissions: {}

concurrency:
  group: oracle-verdict-${{ ((github.event_name == 'pull_request_target' && (github.event.action != 'edited' || github.event.changes.base)) || (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/oracle-review') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) || github.event_name == 'workflow_dispatch') && format('pr-{0}', github.event.pull_request.number || github.event.issue.number || inputs.pr) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  sweep:
    name: sweep
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Check out the trusted develop copy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/oracle-reviewers.yml
            .github/soundness-paths.txt
            _project/scripts/oracle_reviewers
            _project/scripts/soundness_paths.py
            .github/inert-paths.txt
            _project/scripts/inert_paths.py
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Dispatch due retries
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --isolated --no-project --python 3.12 --with pyyaml==6.0.3 -- python -m _project.scripts.oracle_reviewers.cli sweep --policy .github/oracle-reviewers.yml

  plan:
    name: plan
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && (github.event.action != 'edited' || github.event.changes.base)) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/oracle-review') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      decision: ${{ steps.plan.outputs.decision }}
      post: ${{ steps.plan.outputs.post }}
      pr: ${{ steps.plan.outputs.pr }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
    steps:
      - name: Refuse a dispatch from any ref other than develop
        if: github.event_name == 'workflow_dispatch'
        env:
          CURRENT_REF: ${{ github.ref }}
        run: |
          if [ "$CURRENT_REF" != refs/heads/develop ]; then
            echo "oracle-verdict: error: dispatch runs only from develop" >&2
            exit 2
          fi

      - name: Check out the trusted develop copy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/oracle-reviewers.yml
            .github/workflows/oracle-verdict.yml
            .github/soundness-paths.txt
            _project/scripts/oracle_reviewers
            _project/scripts/soundness_paths.py
            .github/inert-paths.txt
            _project/scripts/inert_paths.py
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Plan the review
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
        run: >-
          uv run --isolated --no-project --python 3.12 --with pyyaml==6.0.3 -- python -m _project.scripts.oracle_reviewers.cli plan --policy .github/oracle-reviewers.yml
          --pr "$PR_NUMBER" --out "$RUNNER_TEMP/oracle-plan"

      - name: Upload the plan
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oracle-verdict-plan
          path: ${{ runner.temp }}/oracle-plan
          if-no-files-found: error
          retention-days: 7

  select-1:
    name: select 1
    needs: plan
    if: needs.plan.outputs.decision == 'review'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: oracle
    permissions:
      contents: read
    outputs:
      reviewer: ${{ steps.select.outputs.reviewer }}
      harness: ${{ steps.select.outputs.harness }}
    steps:
      - name: Check out the trusted develop copy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/oracle-reviewers.yml
            .github/soundness-paths.txt
            _project/scripts/oracle_reviewers
            _project/scripts/soundness_paths.py
            .github/inert-paths.txt
            _project/scripts/inert_paths.py
          sparse-checkout-cone-mode: false

      - name: Download the plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: oracle-verdict-plan
          path: ${{ runner.temp }}/oracle-plan

      - name: Select the reviewer for attempt 1
        id: select
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: >-
          python3 -m _project.scripts.oracle_reviewers.cli select --plan "$RUNNER_TEMP/oracle-plan/plan.json" --attempts-dir "$RUNNER_TEMP/oracle-attempts" --slot 1
          --classification "$RUNNER_TEMP/oracle-classification/classification.json"

      - name: Upload the classification
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oracle-verdict-classification
          path: ${{ runner.temp }}/oracle-classification/classification.json
          if-no-files-found: warn
          retention-days: 7

  attempt-1-omp:
    name: attempt 1 (omp ${{ needs.select-1.outputs.reviewer }})
    needs: [plan, select-1]
    if: ${{ !cancelled() && needs.select-1.outputs.reviewer != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: oracle
    permissions:
      contents: read
      id-token: write
    env:
      HAS_TAILNET: ${{ secrets.TS_OAUTH_CLIENT_ID != '' && secrets.TS_AUDIENCE != '' }}
    steps:
      - name: Check out the trusted develop copy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            .github/oracle-reviewers.yml
            .github/oracle-omp-config.yml
            .github/soundness-paths.txt
            _project/scripts/oracle_reviewers
            _project/scripts/soundness_paths.py
            .github/inert-paths.txt
            _project/scripts/inert_paths.py
          sparse-checkout-cone-mode: false

      - name: Check out the pull request head for reading only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.plan.outputs.head_sha }}
          path: workspace
          fetch-depth: 1
          persist-credentials: false

      - name: Download the plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: oracle-verdict-plan
          path: ${{ runner.temp }}/oracle-plan

      - name: Download the classification
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: oracle-verdict-classification
          path: ${{ runner.temp }}/oracle-classification

      - name: Install omp
        env:
          OMP_URL: https://build.stencil.so/d/omp/20261017-231446-291e055/omp-linux-x64
          OMP_SHA256: 16181401e616d7d895bae31fa97476f1513d4080807d60d3a1a04006191a1bb3
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 "$OMP_URL" -o "$RUNNER_TEMP/omp"
          echo "$OMP_SHA256  $RUNNER_TEMP/omp" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/omp"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/omp" --version | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Write the reviewer's OMP home
        working-directory: trusted
        env:
          ORACLE_GATEWAY_URL: ${{ secrets.ORACLE_GATEWAY_URL }}
        run: >-
          python3 -m _project.scripts.oracle_reviewers.cli reviewer-home --home "$HOME" --gateway-url "$ORACLE_GATEWAY_URL"

      - name: Join the tailnet to reach the credential gateway
        if: env.HAS_TAILNET == 'true'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:oracle-ci

      - name: Run the reviewer
        working-directory: trusted
        env:
          OMP_GATEWAY_TOKEN: ${{ secrets.ORACLE_GATEWAY_TOKEN }}
          REVIEWER: ${{ needs.select-1.outputs.reviewer }}
        run: >-
          python3 -m _project.scripts.oracle_reviewers.cli review --plan "$RUNNER_TEMP/oracle-plan/plan.json" --slot 1 --reviewer "$REVIEWER" --harness omp
          --workspace "$GITHUB_WORKSPACE/workspace" --scratch "$RUNNER_TEMP/oracle-scratch"
          --out-dir "$RUNNER_TEMP/oracle-attempt"
          --classification "$RUNNER_TEMP/oracle-classification/classification.json"

      - name: Record an absence if the reviewer did not finish
        if: always()
        working-directory: trusted
        env:
          REVIEWER: ${{ needs.select-1.outputs.reviewer }}
        run: >-
          python3 -m _project.scripts.oracle_reviewers.cli ensure-attempt --plan "$RUNNER_TEMP/oracle-plan/plan.json" --slot 1 --reviewer "$REVIEWER"
          --out-dir "$RUNNER_TEMP/oracle-attempt"

      - name: Upload the attempt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oracle-verdict-attempt-1
          path: ${{ runner.temp }}/oracle-attempt/attempt-1.json
          if-no-files-found: error
          retention-days: 7
  select-2:
    name: select 2
    needs: [plan, select-1, attempt-1-omp]
    if: ${{ !cancelled() && needs.plan.outputs.decision == 'review' && needs.select-1.outputs.reviewer != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      reviewer: ${{ steps.select.outputs.reviewer }}
      harness: ${{ steps.select.outputs.harness }}
    steps:
      - name: Check out the trusted develop copy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/oracle-reviewers.yml
            .github/soundness-paths.txt
            _project/scripts/oracle_reviewers
            _project/scripts/soundness_paths.py
            .github/inert-paths.txt
            _project/scripts/inert_paths.py
          sparse-checkout-cone-mode: false

      - name: Download the plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
