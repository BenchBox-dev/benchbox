name: oracle-verdict

run-name: oracle-verdict (${{ github.event_name }} pr=${{ github.event.pull_request.number || github.event.issue.number || inputs.pr || 'sweep' }})

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
        type: string
  schedule:
    - cron: '23 * * * *'

permissions: {}

concurrency:
  group: oracle-verdict-${{ ((github.event_name == 'pull_request_target' && (github.event.action != 'edited' || github.event.changes.base)) || (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/oracle-review') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) || github.event_name == 'workflow_dispatch') && format('pr-{0}', github.event.pull_request.number || github.event.issue.number || inputs.pr) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  sweep:
    name: sweep
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Check out the trusted develop copy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/oracle-reviewers.yml
            .github/soundness-paths.txt
            _project/scripts/oracle_reviewers
            _project/scripts/soundness_paths.py
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Dispatch due retries
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --isolated --no-project --python 3.12 --with pyyaml==6.0.3 -- python -m _project.scripts.oracle_reviewers.cli sweep --policy .github/oracle-reviewers.yml

  plan:
    name: plan
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && (github.event.action != 'edited' || github.event.changes.base)) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/oracle-review') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      decision: ${{ steps.plan.outputs.decision }}
      post: ${{ steps.plan.outputs.post }}
      pr: ${{ steps.plan.outputs.pr }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      tier: ${{ steps.plan.outputs.tier }}
    steps:
      - name: Refuse a dispatch from any ref other than develop
        if: github.event_name == 'workflow_dispatch'
        env:
          CURRENT_REF: ${{ github.ref }}
        run: |
          if [ "$CURRENT_REF" != refs/heads/develop ]; then
            echo "oracle-verdict: error: dispatch runs only from develop" >&2
            exit 2
          fi

      - name: Check out the trusted develop copy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/oracle-reviewers.yml
            .github/workflows/oracle-verdict.yml
            .github/soundness-paths.txt
            _project/scripts/oracle_reviewers
            _project/scripts/soundness_paths.py
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Plan the review
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
        run: >-
          uv run --isolated --no-project --python 3.12 --with pyyaml==6.0.3 -- python -m _project.scripts.oracle_reviewers.cli plan --policy .github/oracle-reviewers.yml
          --pr "$PR_NUMBER" --out "$RUNNER_TEMP/oracle-plan"

      - name: Upload the plan
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oracle-verdict-plan
          path: ${{ runner.temp }}/oracle-plan
          if-no-files-found: error
          retention-days: 7

  select-1:
    name: select 1
    needs: plan
    if: needs.plan.outputs.decision == 'review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      reviewer: ${{ steps.select.outputs.reviewer }}
      harness: ${{ steps.select.outputs.harness }}
    steps:
      - name: Check out the trusted develop copy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/oracle-reviewers.yml
            .github/soundness-paths.txt
            _project/scripts/oracle_reviewers
            _project/scripts/soundness_paths.py
          sparse-checkout-cone-mode: false

      - name: Download the plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: oracle-verdict-plan
          path: ${{ runner.temp }}/oracle-plan

      - name: Select the reviewer for attempt 1
        id: select
        run: python3 -m _project.scripts.oracle_reviewers.cli select --plan "$RUNNER_TEMP/oracle-plan/plan.json" --attempts-dir "$RUNNER_TEMP/oracle-attempts" --slot 1

  attempt-1-claude:
    name: attempt 1 (claude ${{ needs.select-1.outputs.reviewer }})
    needs: [plan, select-1]
    if: ${{ !cancelled() && needs.select-1.outputs.harness == 'claude' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: oracle
    permissions:
      contents: read
    steps:
      - name: Check out the trusted develop copy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            .github/oracle-reviewers.yml
            .github/soundness-paths.txt
            _project/scripts/oracle_reviewers
            _project/scripts/soundness_paths.py
          sparse-checkout-cone-mode: false

      - name: Check out the pull request head for reading only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.plan.outputs.head_sha }}
          path: workspace
          fetch-depth: 1
          persist-credentials: false

      - name: Download the plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: oracle-verdict-plan
          path: ${{ runner.temp }}/oracle-plan

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Claude Code
        continue-on-error: true
        run: npm install --global @anthropic-ai/claude-code@2.1.289

      - name: Run the reviewer
        working-directory: trusted
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REVIEWER: ${{ needs.select-1.outputs.reviewer }}
        run: >-
          python3 -m _project.scripts.oracle_reviewers.cli review --plan "$RUNNER_TEMP/oracle-plan/plan.json" --slot 1 --reviewer "$REVIEWER" --harness claude
          --workspace "$GITHUB_WORKSPACE/workspace" --scratch "$RUNNER_TEMP/oracle-scratch"
          --out-dir "$RUNNER_TEMP/oracle-attempt"

      - name: Record an absence if the reviewer did not finish
        if: always()
        working-directory: trusted
        env:
          REVIEWER: ${{ needs.select-1.outputs.reviewer }}
        run: >-
          python3 -m _project.scripts.oracle_reviewers.cli ensure-attempt --plan "$RUNNER_TEMP/oracle-plan/plan.json" --slot 1 --reviewer "$REVIEWER"
          --out-dir "$RUNNER_TEMP/oracle-attempt"

      - name: Upload the attempt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oracle-verdict-attempt-1
          path: ${{ runner.temp }}/oracle-attempt/attempt-1.json
          if-no-files-found: error
          retention-days: 7

  attempt-1-codex:
    name: attempt 1 (codex ${{ needs.select-1.outputs.reviewer }})
    needs: [plan, select-1]
    if: ${{ !cancelled() && needs.select-1.outputs.harness == 'codex' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: oracle
    permissions:
      contents: read
    steps:
      - name: Check out the trusted develop copy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            .github/oracle-reviewers.yml
            .github/soundness-paths.txt
            _project/scripts/oracle_reviewers
            _project/scripts/soundness_paths.py
          sparse-checkout-cone-mode: false

      - name: Check out the pull request head for reading only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.plan.outputs.head_sha }}
          path: workspace
          fetch-depth: 1
          persist-credentials: false

      - name: Download the plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: oracle-verdict-plan
          path: ${{ runner.temp }}/oracle-plan

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Codex
        continue-on-error: true
        run: npm install --global @openai/codex@0.160.0

      - name: Let the Codex sandbox create user namespaces
        continue-on-error: true
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Log in to Codex with the API key
        continue-on-error: true
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p "$CODEX_HOME"
          printenv OPENAI_API_KEY | codex login --with-api-key

      - name: Run the reviewer
        working-directory: trusted
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
          REVIEWER: ${{ needs.select-1.outputs.reviewer }}
        run: >-
          python3 -m _project.scripts.oracle_reviewers.cli review --plan "$RUNNER_TEMP/oracle-plan/plan.json" --slot 1 --reviewer "$REVIEWER" --harness codex
          --workspace "$GITHUB_WORKSPACE/workspace" --scratch "$RUNNER_TEMP/oracle-scratch"
          --out-dir "$RUNNER_TEMP/oracle-attempt"

      - name: Record an absence if the reviewer did not finish
        if: always()
        working-directory: trusted
        env:
          REVIEWER: ${{ needs.select-1.outputs.reviewer }}
        run: >-
          python3 -m _project.scripts.oracle_reviewers.cli ensure-attempt --plan "$RUNNER_TEMP/oracle-plan/plan.json" --slot 1 --reviewer "$REVIEWER"
          --out-dir "$RUNNER_TEMP/oracle-attempt"

      - name: Upload the attempt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oracle-verdict-attempt-1
          path: ${{ runner.temp }}/oracle-attempt/attempt-1.json
          if-no-files-found: error
          retention-days: 7

  attempt-1-muse:
    name: attempt 1 (muse ${{ needs.select-1.outputs.reviewer }})
    needs: [plan, select-1]
    if: ${{ !cancelled() && needs.select-1.outputs.harness == 'muse' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: oracle
    permissions:
      contents: read
    steps:
      - name: Check out the trusted develop copy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            .github/oracle-reviewers.yml
            .github/soundness-paths.txt
            _project/scripts/oracle_reviewers
            _project/scripts/soundness_paths.py
          sparse-checkout-cone-mode: false

      - name: Check out the pull request head for reading only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.plan.outputs.head_sha }}
          path: workspace
          fetch-depth: 1
          persist-credentials: false

      - name: Download the plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: oracle-verdict-plan
          path: ${{ runner.temp }}/oracle-plan

      - name: Install muse
        continue-on-error: true
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 https://dev.meta.ai/install.sh -o "$RUNNER_TEMP/muse-install.sh"
          bash "$RUNNER_TEMP/muse-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "Installed $("$HOME/.local/bin/muse" --version)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the reviewer
        working-directory: trusted
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
          REVIEWER: ${{ needs.select-1.outputs.reviewer }}
        run: >-
          python3 -m _project.scripts.oracle_reviewers.cli review --plan "$RUNNER_TEMP/oracle-plan/plan.json" --slot 1 --reviewer "$REVIEWER" --harness muse
          --workspace "$GITHUB_WORKSPACE/workspace" --scratch "$RUNNER_TEMP/oracle-scratch"
          --out-dir "$RUNNER_TEMP/oracle-attempt"

      - name: Record an absence if the reviewer did not finish
        if: always()
        working-directory: trusted
        env:
          REVIEWER: ${{ needs.select-1.outputs.reviewer }}
        run: >-
          python3 -m _project.scripts.oracle_reviewers.cli ensure-attempt --plan "$RUNNER_TEMP/oracle-plan/plan.json" --slot 1 --reviewer "$REVIEWER"
          --out-dir "$RUNNER_TEMP/oracle-attempt"

      - name: Upload the attempt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oracle-verdict-attempt-1
          path: ${{ runner.temp }}/oracle-attempt/attempt-1.json
          if-no-files-found: error
          retention-days: 7

  attempt-1-agy:
    name: attempt 1 (agy ${{ needs.select-1.outputs.reviewer }})
    needs: [plan, select-1]
    if: ${{ !cancelled() && needs.select-1.outputs.harness == 'agy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: oracle
    permissions:
      contents: read
    steps:
      - name: Check out the trusted develop copy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            .github/oracle-reviewers.yml
            .github/soundness-paths.txt
            _project/scripts/oracle_reviewers
            _project/scripts/soundness_paths.py
          sparse-checkout-cone-mode: false

      - name: Check out the pull request head for reading only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.plan.outputs.head_sha }}
          path: workspace
          fetch-depth: 1
          persist-credentials: false

      - name: Download the plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: oracle-verdict-plan
          path: ${{ runner.temp }}/oracle-plan

      - name: Install agy
        continue-on-error: true
        env:
          AGY_URL: https://storage.googleapis.com/antigravity-public/antigravity-cli/1.3.3-5524738307653632/linux-x64/cli_linux_x64.tar.gz
          AGY_SHA256: 8ee3ca32574c431285efbf4d4732f7f8d53e959370bc4a61646e4fa496f7f2b6
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 "$AGY_URL" -o "$RUNNER_TEMP/agy.tar.gz"
          echo "$AGY_SHA256  $RUNNER_TEMP/agy.tar.gz" | sha256sum --check --strict
          mkdir -p "$HOME/.local/bin" "$HOME/.gemini/antigravity-cli"
          tar -xzf "$RUNNER_TEMP/agy.tar.gz" -C "$RUNNER_TEMP" antigravity
          install -m 0755 "$RUNNER_TEMP/antigravity" "$HOME/.local/bin/agy"
          echo '{"modelProvider": "gemini"}' > "$HOME/.gemini/antigravity-cli/settings.json"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "Installed agy $("$HOME/.local/bin/agy" --version)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the reviewer
        working-directory: trusted
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGY_CLI_DISABLE_AUTO_UPDATE: '1'
          REVIEWER: ${{ needs.select-1.outputs.reviewer }}
        run: >-
          python3 -m _project.scripts.oracle_reviewers.cli review --plan "$RUNNER_TEMP/oracle-plan/plan.json" --slot 1 --reviewer "$REVIEWER" --harness agy
          --workspace "$GITHUB_WORKSPACE/workspace" --scratch "$RUNNER_TEMP/oracle-scratch"
          --out-dir "$RUNNER_TEMP/oracle-attempt"

      - name: Record an absence if the reviewer did not finish
        if: always()
        working-directory: trusted
        env:
          REVIEWER: ${{ needs.select-1.outputs.reviewer }}
        run: >-
          python3 -m _project.scripts.oracle_reviewers.cli ensure-attempt --plan "$RUNNER_TEMP/oracle-plan/plan.json" --slot 1 --reviewer "$REVIEWER"
          --out-dir "$RUNNER_TEMP/oracle-attempt"

      - name: Upload the attempt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oracle-verdict-attempt-1
          path: ${{ runner.temp }}/oracle-attempt/attempt-1.json
          if-no-files-found: error
          retention-days: 7

  select-2:
    name: select 2
    needs: [plan, select-1, attempt-1-claude, attempt-1-codex, attempt-1-muse, attempt-1-agy]
    if: ${{ !cancelled() && needs.plan.outputs.decision == 'review' && needs.select-1.outputs.reviewer != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      reviewer: ${{ steps.select.outputs.reviewer }}
      harness: ${{ steps.select.outputs.harness }}
    steps:
      - name: Check out the trusted develop copy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/oracle-reviewers.yml
            .github/soundness-paths.txt
            _project/scripts/oracle_reviewers
            _project/scripts/soundness_paths.py
          sparse-checkout-cone-mode: false

      - name: Download the plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: oracle-verdict-plan
          path: ${{ runner.temp }}/oracle-plan

      - name: Download this run's attempts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: oracle-verdict-attempt-*
          merge-multiple: true
          path: ${{ runner.temp }}/oracle-attempts

      - name: Select the reviewer for attempt 2
        id: select
        run: python3 -m _project.scripts.oracle_reviewers.cli select --plan "$RUNNER_TEMP/oracle-plan/plan.json" --attempts-dir "$RUNNER_TEMP/oracle-attempts" --slot 2

  attempt-2-claude:
    name: attempt 2 (claude ${{ needs.select-2.outputs.reviewer }})
    needs: [plan, select-2]
    if: ${{ !cancelled() && needs.select-2.outputs.harness == 'claude' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: oracle
    permissions:
      contents: read
    steps:
      - name: Check out the trusted develop copy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            .github/oracle-reviewers.yml
            .github/soundness-paths.txt
            _project/scripts/oracle_reviewers
            _project/scripts/soundness_paths.py
          sparse-checkout-cone-mode: false

      - name: Check out the pull request head for reading only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.plan.outputs.head_sha }}
          path: workspace
          fetch-depth: 1
          persist-credentials: false

      - name: Download the plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: oracle-verdict-plan
          path: ${{ runner.temp }}/oracle-plan

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Claude Code
        continue-on-error: true
        run: npm install --global @anthropic-ai/claude-code@2.1.289

      - name: Run the reviewer
        working-directory: trusted
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REVIEWER: ${{ needs.select-2.outputs.reviewer }}
        run: >-
          python3 -m _project.scripts.oracle_reviewers.cli review --plan "$RUNNER_TEMP/oracle-plan/plan.json" --slot 2 --reviewer "$REVIEWER" --harness claude
          --workspace "$GITHUB_WORKSPACE/workspace" --scratch "$RUNNER_TEMP/oracle-scratch"
          --out-dir "$RUNNER_TEMP/oracle-attempt"

      - name: Record an absence if the reviewer did not finish
        if: always()
        working-directory: trusted
        env:
          REVIEWER: ${{ needs.select-2.outputs.reviewer }}
        run: >-
          python3 -m _project.scripts.oracle_reviewers.cli ensure-attempt --plan "$RUNNER_TEMP/oracle-plan/plan.json" --slot 2 --reviewer "$REVIEWER"
          --out-dir "$RUNNER_TEMP/oracle-attempt"

      - name: Upload the attempt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oracle-verdict-attempt-2
          path: ${{ runner.temp }}/oracle-attempt/attempt-2.json
          if-no-files-found: error
          retention-days: 7

  attempt-2-codex:
    name: attempt 2 (codex ${{ needs.select-2.outputs.reviewer }})
    needs: [plan, select-2]
    if: ${{ !cancelled() && needs.select-2.outputs.harness == 'codex' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: oracle
    permissions:
      contents: read
    steps:
      - name: Check out the trusted develop copy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            .github/oracle-reviewers.yml
            .github/soundness-paths.txt
            _project/scripts/oracle_reviewers
            _project/scripts/soundness_paths.py
          sparse-checkout-cone-mode: false

      - name: Check out the pull request head for reading only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
