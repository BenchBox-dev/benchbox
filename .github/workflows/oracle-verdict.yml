name: oracle-verdict

run-name: oracle-verdict (${{ github.event_name }} pr=${{ github.event.pull_request.number || github.event.issue.number || inputs.pr || 'sweep' }}${{ (github.event.pull_request.head.sha || inputs.head) && format(' head={0}', github.event.pull_request.head.sha || inputs.head) || '' }})

on:
  push:
    branches: [develop]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
        type: string
      head:
        description: Head commit the dispatch targets; a different current head skips the run
        required: false
        type: string
      reason:
        description: Why this dispatch was requested
        required: false
        type: string
  schedule:
    - cron: '23 * * * *'

permissions: {}

concurrency:
  group: oracle-verdict-${{ ((github.event_name == 'schedule' || github.event_name == 'push') && 'sweep') || (((github.event_name == 'pull_request_target' && (github.event.action != 'edited' || github.event.changes.base)) || (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/oracle-review') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) || github.event_name == 'workflow_dispatch') && format('pr-{0}', github.event.pull_request.number || github.event.issue.number || inputs.pr) || format('run-{0}', github.run_id)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  sweep:
    name: sweep
    if: github.event_name == 'schedule' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: oracle
    permissions:
      actions: write
      contents: read
      pull-requests: read
    env:
      HAS_APP: ${{ secrets.ORACLE_APP_ID != '' }}
    steps:
      - name: Check out the trusted develop copy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/oracle-reviewers.yml
            .github/soundness-paths.txt
            _project/scripts/oracle_reviewers
            _project/scripts/soundness_paths.py
            .github/inert-paths.txt
            _project/scripts/inert_paths.py
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Mint the App token for failure statuses
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.ORACLE_APP_ID }}
          private-key: ${{ secrets.ORACLE_APP_PRIVATE_KEY }}
          permission-statuses: write

      - name: Dispatch due retries
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
          SURFACE_TOKEN: ${{ steps.app.outputs.token }}
        run: uv run --isolated --no-project --python 3.12 --with pyyaml==6.0.3 -- python -m _project.scripts.oracle_reviewers.cli drive --policy .github/oracle-reviewers.yml sweep

  review:
    name: review
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && (github.event.action != 'edited' || github.event.changes.base)) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/oracle-review') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 255
    environment: oracle
    permissions:
      actions: write
      contents: read
      pull-requests: read
    env:
      HAS_TAILNET: ${{ secrets.TS_OAUTH_CI_CLIENT_ID != '' && secrets.TS_OAUTH_CI_SECRET != '' }}
      HAS_APP: ${{ secrets.ORACLE_APP_ID != '' }}
    steps:
      - name: Refuse a dispatch from any ref other than develop
        if: github.event_name == 'workflow_dispatch'
        env:
          CURRENT_REF: ${{ github.ref }}
        run: |
          if [ "$CURRENT_REF" != refs/heads/develop ]; then
            echo "oracle-verdict: error: dispatch runs only from develop" >&2
            exit 2
          fi

      - name: Check out the trusted develop copy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            .github/oracle-reviewers.yml
            .github/oracle-omp-config.yml
            .github/workflows/oracle-verdict.yml
            .github/soundness-paths.txt
            _project/scripts/oracle_reviewers
            _project/scripts/soundness_paths.py
            .github/inert-paths.txt
            _project/scripts/inert_paths.py
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Prepare the review
        id: prepare
        timeout-minutes: 15
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: >-
          uv run --isolated --no-project --python 3.12 --with pyyaml==6.0.3 -- python -m _project.scripts.oracle_reviewers.cli drive --policy .github/oracle-reviewers.yml prepare

      - name: Check out the pull request head for reading only
        if: steps.prepare.outputs.decision == 'review'
        continue-on-error: true
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ steps.prepare.outputs.head_sha }}
          path: workspace
          fetch-depth: 1
          persist-credentials: false

      - name: Scan the disk for secret values before the reviewer runs
        if: steps.prepare.outputs.decision == 'review'
        timeout-minutes: 10
        working-directory: trusted
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          TS_OAUTH_CI_SECRET: ${{ secrets.TS_OAUTH_CI_SECRET }}
          JOB_TOKEN: ${{ github.token }}
        run: python3 -m _project.scripts.oracle_reviewers.cli drive scan

      - name: Install omp
        id: harness
        if: steps.prepare.outputs.decision == 'review'
        timeout-minutes: 10
        working-directory: trusted
        run: uv run --isolated --no-project --python 3.12 --with pyyaml==6.0.3 -- python -m _project.scripts.oracle_reviewers.cli drive --policy .github/oracle-reviewers.yml harness

      - name: Join the tailnet to reach the credential gateway
        if: steps.prepare.outputs.decision == 'review' && env.HAS_TAILNET == 'true'
        continue-on-error: true
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CI_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CI_SECRET }}
          tags: tag:oracle-ci

      - name: Scan the disk for secret values after the tailnet join
        if: steps.prepare.outputs.decision == 'review'
        timeout-minutes: 10
        working-directory: trusted
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          TS_OAUTH_CI_SECRET: ${{ secrets.TS_OAUTH_CI_SECRET }}
          JOB_TOKEN: ${{ github.token }}
        run: python3 -m _project.scripts.oracle_reviewers.cli drive scan

      - name: Verify Linux process isolation
        if: steps.prepare.outputs.decision == 'review'
        timeout-minutes: 5
        working-directory: trusted
        run: python3 -m _project.scripts.oracle_reviewers.cli drive isolation

      - name: Run the attempt loop
        if: steps.prepare.outputs.decision == 'review' && steps.harness.outputs.state == 'installed'
        timeout-minutes: 225
        working-directory: trusted
        env:
          OMP_GATEWAY_TOKEN: ${{ secrets.ORACLE_GATEWAY_TOKEN }}
          ORACLE_GATEWAY_URL: ${{ secrets.ORACLE_GATEWAY_URL }}
        run: python3 -m _project.scripts.oracle_reviewers.cli drive attempts

      - name: Classify the invalid attempt after attempt 1
        if: steps.prepare.outputs.decision == 'review' && steps.harness.outputs.state == 'installed'
        timeout-minutes: 10
        working-directory: trusted
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python3 -m _project.scripts.oracle_reviewers.cli drive recover

      - name: Resume the attempt loop after attempt 1
        if: steps.prepare.outputs.decision == 'review' && steps.harness.outputs.state == 'installed'
        timeout-minutes: 225
        working-directory: trusted
        env:
          OMP_GATEWAY_TOKEN: ${{ secrets.ORACLE_GATEWAY_TOKEN }}
          ORACLE_GATEWAY_URL: ${{ secrets.ORACLE_GATEWAY_URL }}
        run: python3 -m _project.scripts.oracle_reviewers.cli drive attempts

      - name: Classify the invalid attempt after attempt 2
        if: steps.prepare.outputs.decision == 'review' && steps.harness.outputs.state == 'installed'
        timeout-minutes: 10
        working-directory: trusted
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python3 -m _project.scripts.oracle_reviewers.cli drive recover

      - name: Resume the attempt loop after attempt 2
        if: steps.prepare.outputs.decision == 'review' && steps.harness.outputs.state == 'installed'
        timeout-minutes: 225
        working-directory: trusted
        env:
          OMP_GATEWAY_TOKEN: ${{ secrets.ORACLE_GATEWAY_TOKEN }}
          ORACLE_GATEWAY_URL: ${{ secrets.ORACLE_GATEWAY_URL }}
        run: python3 -m _project.scripts.oracle_reviewers.cli drive attempts

      - name: Classify the invalid attempt after attempt 3
        if: steps.prepare.outputs.decision == 'review' && steps.harness.outputs.state == 'installed'
        timeout-minutes: 10
        working-directory: trusted
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python3 -m _project.scripts.oracle_reviewers.cli drive recover

      - name: Resume the attempt loop after attempt 3
        if: steps.prepare.outputs.decision == 'review' && steps.harness.outputs.state == 'installed'
        timeout-minutes: 225
        working-directory: trusted
        env:
          OMP_GATEWAY_TOKEN: ${{ secrets.ORACLE_GATEWAY_TOKEN }}
          ORACLE_GATEWAY_URL: ${{ secrets.ORACLE_GATEWAY_URL }}
        run: python3 -m _project.scripts.oracle_reviewers.cli drive attempts

      - name: Classify the invalid attempt after attempt 4
        if: steps.prepare.outputs.decision == 'review' && steps.harness.outputs.state == 'installed'
        timeout-minutes: 10
        working-directory: trusted
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python3 -m _project.scripts.oracle_reviewers.cli drive recover

      - name: Resume the attempt loop after attempt 4
        if: steps.prepare.outputs.decision == 'review' && steps.harness.outputs.state == 'installed'
        timeout-minutes: 225
        working-directory: trusted
        env:
          OMP_GATEWAY_TOKEN: ${{ secrets.ORACLE_GATEWAY_TOKEN }}
          ORACLE_GATEWAY_URL: ${{ secrets.ORACLE_GATEWAY_URL }}
        run: python3 -m _project.scripts.oracle_reviewers.cli drive attempts

      - name: Scan the disk for secret values after the reviewer exits
        if: steps.prepare.outputs.decision == 'review'
        timeout-minutes: 10
        working-directory: trusted
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          TS_OAUTH_CI_SECRET: ${{ secrets.TS_OAUTH_CI_SECRET }}
          JOB_TOKEN: ${{ github.token }}
        run: python3 -m _project.scripts.oracle_reviewers.cli drive scan

      - name: Decide the verdict and redact every secret value from the results
        id: finalize
        if: steps.prepare.outputs.post == 'true'
        timeout-minutes: 15
        working-directory: trusted
        env:
          OMP_INSTALL_STATE: ${{ steps.harness.outputs.state }}
          OMP_GATEWAY_TOKEN: ${{ secrets.ORACLE_GATEWAY_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          ORACLE_GATEWAY_URL: ${{ secrets.ORACLE_GATEWAY_URL }}
          TS_OAUTH_CI_CLIENT_ID: ${{ secrets.TS_OAUTH_CI_CLIENT_ID }}
          TS_OAUTH_CI_SECRET: ${{ secrets.TS_OAUTH_CI_SECRET }}
          JOB_TOKEN: ${{ github.token }}
        run: python3 -m _project.scripts.oracle_reviewers.cli drive finalize

      - name: Mint the App token
        id: app
        if: steps.prepare.outputs.post == 'true' && env.HAS_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.ORACLE_APP_ID }}
          private-key: ${{ secrets.ORACLE_APP_PRIVATE_KEY }}
          permission-statuses: write
          permission-pull-requests: write

      - name: Post the result
        id: publish
        if: steps.prepare.outputs.post == 'true'
        timeout-minutes: 10
        working-directory: trusted
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          JOB_TOKEN: ${{ github.token }}
        run: python3 -m _project.scripts.oracle_reviewers.cli drive publish

      - name: Record the retry attempt
        if: always() && steps.finalize.outcome == 'success' && steps.finalize.outputs.has_state == 'true' && steps.publish.outputs.skip != 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          overwrite: true
          name: oracle-verdict-state-attempt-${{ steps.prepare.outputs.pr }}
          path: ${{ runner.temp }}/oracle-final/attempt/state.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the retry state
        if: steps.publish.outputs.state_recorded == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          overwrite: true
          name: oracle-verdict-state-${{ steps.prepare.outputs.pr }}
          path: ${{ runner.temp }}/oracle-final/state/state.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload attempt 1
        if: ${{ always() && steps.finalize.outcome == 'success' && steps.finalize.outputs.attempts >= 1 }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oracle-verdict-attempt-1
          path: ${{ runner.temp }}/oracle-attempts/attempt-1.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload attempt 2
        if: ${{ always() && steps.finalize.outcome == 'success' && steps.finalize.outputs.attempts >= 2 }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oracle-verdict-attempt-2
          path: ${{ runner.temp }}/oracle-attempts/attempt-2.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload attempt 3
        if: ${{ always() && steps.finalize.outcome == 'success' && steps.finalize.outputs.attempts >= 3 }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oracle-verdict-attempt-3
          path: ${{ runner.temp }}/oracle-attempts/attempt-3.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload attempt 4
        if: ${{ always() && steps.finalize.outcome == 'success' && steps.finalize.outputs.attempts >= 4 }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oracle-verdict-attempt-4
          path: ${{ runner.temp }}/oracle-attempts/attempt-4.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload attempt 5
        if: ${{ always() && steps.finalize.outcome == 'success' && steps.finalize.outputs.attempts >= 5 }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oracle-verdict-attempt-5
          path: ${{ runner.temp }}/oracle-attempts/attempt-5.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload the captured reviewer event streams
        if: ${{ always() && steps.finalize.outcome == 'success' && steps.finalize.outputs.attempts >= 1 }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oracle-verdict-capture
          path: ${{ runner.temp }}/oracle-attempts/captures/
          if-no-files-found: ignore
          retention-days: 30

      - name: Dispatch the gate for the reviewed head
        if: steps.prepare.outputs.post == 'true' && env.HAS_APP == 'true' && steps.publish.outputs.skip != 'true'
        timeout-minutes: 5
        working-directory: trusted
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          JOB_TOKEN: ${{ github.token }}
        run: python3 -m _project.scripts.oracle_reviewers.cli drive dispatch
