name: review-gate

run-name: review-gate (${{ github.event_name }} ${{ (github.event.pull_request.number || github.event.issue.number || inputs.pr) && format('pr={0}', github.event.pull_request.number || github.event.issue.number || inputs.pr) || github.event.workflow_run.head_sha && format('sha={0}', github.event.workflow_run.head_sha) || 'sweep' }})

on:
  push:
    branches: [develop]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [review-request]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to gate
        required: true
        type: string
      head_sha:
        description: Head commit the gate falls back to when the pull request cannot be read
        required: false
        type: string
  schedule:
    - cron: '41 * * * *'

permissions: {}

concurrency:
  group: "review-gate-${{ (github.event_name == 'push' && 'push-sweep') || (github.event_name == 'issue_comment' && !((startsWith(github.event.comment.body, 'Stand-in review: APPROVE') || startsWith(github.event.comment.body, 'Stand-in oracle review: APPROVE')) || contains(github.event.comment.body, 'Omp candidate check: ') || (startsWith(github.event.comment.body, 'Review adjudication: ') || startsWith(github.event.comment.body, 'Oracle adjudication: ')) || (github.event.action == 'deleted' && (contains(github.event.comment.body, 'Stand-in review: APPROVE') || contains(github.event.comment.body, 'Stand-in oracle review: APPROVE') || contains(github.event.comment.body, 'Review adjudication: ') || contains(github.event.comment.body, 'Oracle adjudication: '))) || (github.event.action == 'edited' && ((contains(github.event.changes.body.from, 'Stand-in review: APPROVE') || contains(github.event.changes.body.from, 'Stand-in oracle review: APPROVE')) || contains(github.event.changes.body.from, 'Omp candidate check: ') || (contains(github.event.changes.body.from, 'Review adjudication: ') || contains(github.event.changes.body.from, 'Oracle adjudication: '))))) && format('ignored-{0}', github.run_id)) || (github.event_name == 'workflow_run' && format('bridge-{0}', github.event.workflow_run.head_sha)) || github.event.pull_request.number || github.event.issue.number || inputs.pr || format('run-{0}', github.run_id) }}"
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  gate:
    permissions:
      actions: write
      contents: read
      pull-requests: read
    uses: joeharris76/theseus/.github/workflows/gate.yml@5188161c85d6a8d15c73d9685cd5a58c2e78aeeb
    with:
      environment: oracle
      theseus_ref: 5188161c85d6a8d15c73d9685cd5a58c2e78aeeb
      gated_base: develop
      policy_path: .github/oracle-reviewers.yml
    secrets:
      REVIEW_APP_ID: ${{ secrets.ORACLE_APP_ID }}
      REVIEW_APP_PRIVATE_KEY: ${{ secrets.ORACLE_APP_PRIVATE_KEY }}
