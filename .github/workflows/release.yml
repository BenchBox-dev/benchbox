name: Release

on:
  workflow_dispatch:
    inputs:
      test_pypi:
        description: 'Publish to Test PyPI instead of PyPI'
        required: false
        default: false
        type: boolean

jobs:
  verify-tag-on-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Assert release ref is release or an ancestor of release
        run: |
          git fetch origin release --quiet
          target_sha="${{ github.sha }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "Tag push ${{ github.ref_name }}: verifying $target_sha is an ancestor of origin/release"
          else
            echo "workflow_dispatch from ${{ github.ref }}: verifying $target_sha is origin/release or an ancestor of it"
          fi
          if ! git merge-base --is-ancestor "$target_sha" origin/release; then
            echo "::error::Ref $target_sha (${{ github.ref }}) is not origin/release or an ancestor of it. Refusing to build/publish."
            exit 1
          fi
          echo "OK: $target_sha is origin/release or an ancestor of it."

      - name: Assert tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_version=$(grep -E '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          expected_tag="v${package_version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match package version '$package_version' (expected '$expected_tag')."
            exit 1
          fi
          echo "OK: release tag $RELEASE_TAG matches package version $package_version."

  verify-uat-charter:
    needs: verify-tag-on-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Require a committed UAT charter or pointer
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            tests/uat/CHARTER.md
            _project/release-evidence/README.md
          )
          found=0
          for path in "${candidates[@]}"; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1 && test -s "$path"; then
              echo "Found committed UAT charter or pointer: $path"
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::Release ref contains neither a committed UAT charter nor a release-evidence pointer."
            exit 1
          fi

  dependency-bounds:
    needs: verify-tag-on-release
    runs-on: ubuntu-latest
    outputs:
      report_path: ${{ steps.gate.outputs.report_path }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check dependency upper bounds (blocking + report)
        id: gate
        run: |
          mkdir -p release-artifacts
          report=release-artifacts/dependency-bounds.md
          uv run -- python scripts/check_dependency_bounds.py \
            --fail-on=cap-reached \
            --output "$report"
          echo "report_path=$report" >> "$GITHUB_OUTPUT"

      - name: Upload bounds report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dependency-bounds-report
          path: release-artifacts/dependency-bounds.md
          retention-days: 90

  sqlglot-upstream-freshness:
    needs: verify-tag-on-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Require the bundled SQLGlot runtime to be on the newest upstream release
        run: uv run -- python scripts/check_sqlglot_upstream_freshness.py

      - name: Require the bundled SQLGlot runtime to carry no published advisory
        run: uv run -- python scripts/check_sqlglot_advisories.py

  build:
    needs: [verify-tag-on-release, verify-uat-charter, dependency-bounds, sqlglot-upstream-freshness]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Extract version
        id: version
        run: |
          version=$(grep -E '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Build package with reproducible timestamp
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          echo "Building with SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          uv build

      - name: Check package
        run: uvx twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-dist
          path: dist/
          retention-days: 30

  publish:
    needs: [build, test-installation]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.test_pypi == 'true' && 'test-pypi' || 'pypi' }}
      url: ${{ github.event.inputs.test_pypi == 'true' && 'https://test.pypi.org/p/benchbox' || 'https://pypi.org/p/benchbox' }}
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-dist
          path: dist/

      - name: Publish to Test PyPI
        if: github.event.inputs.test_pypi == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          attestations: false
          verbose: true

      - name: Publish to PyPI
        if: github.event.inputs.test_pypi != 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          skip-existing: true
          attestations: false
          verbose: true

  github-release:
    needs: [publish, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Download build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-dist
          path: dist/

      - name: Extract curated release notes
        run: >
          python3 scripts/generate_changelog_entry.py
          --version "${{ needs.build.outputs.version }}"
          --print-section
          > release-notes.md

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          title="BenchBox ${{ needs.build.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "$title" --notes-file release-notes.md
          else
            gh release create "$tag" dist/* --title "$title" --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-installation:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        exclude:
          - os: windows-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.14'
          - os: macos-latest
            python-version: '3.14'
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-dist
          path: dist/

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test installation from built wheel
        shell: bash
        run: |
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install dist/*.whl
          python -c "import importlib.util; import benchbox; assert importlib.util.find_spec('pandas') is None, 'published core wheel must not pull pandas'; print(f'BenchBox {benchbox.__version__} installed successfully (minimal import surface)')"
          benchbox --help

  cleanup-artifacts:
    needs: [publish, test-installation]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Delete old release artifacts
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const { owner, repo } = context.repo;
            const sevenDaysAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);

            for (const name of ['dist', 'release-dist', 'test-dist']) {
              const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
                owner,
                repo,
                name,
                per_page: 100,
              });
              for (const artifact of artifacts) {
                if (new Date(artifact.created_at) < sevenDaysAgo) {
                  console.log(`Deleting old artifact: ${artifact.name} (${artifact.id}) from ${artifact.created_at}`);
                  await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
                }
              }
            }
