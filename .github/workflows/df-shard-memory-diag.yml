name: DF shard memory diagnostic

on:
  push:
    branches: ['ci/df-shard-memory-diag']

permissions:
  contents: read

jobs:
  shard:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: [polars-df, pandas-df, datafusion-df]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install
        run: uv sync --group dev --extra dataframe-polars --extra dataframe-pandas --extra dataframe-datafusion

      - name: Run the shard with a memory sampler
        env:
          UV_NO_SYNC: '1'
        run: |
          set -uo pipefail
          free -m
          nproc
          (
            while true; do
              mem=$(free -m | awk '/Mem:/{printf "avail=%sMB used=%sMB",$7,$3} /Swap:/{printf " swap=%sMB",$3}')
              top=$(ps -eo rss,etimes,args --sort=-rss | awk 'NR==2{printf "%.0fMB %ss %s", $1/1024,$2,substr($0, index($0,$3), 170)}')
              echo "[mem] $(date -u +%H:%M:%S) $mem | $top"
              sleep 10
            done
          ) &
          make uat-sweep CONFIG=tests/uat/configs/release-gate-01-native-dataframe.yaml PLATFORMS="${{ matrix.platform }}"

      - name: Cell results
        if: always()
        run: |
          shopt -s nullglob
          for f in "$HOME"/Developer/benchmark_runs/logs/uat_*/run/cells.jsonl "$HOME"/Developer/benchmark_runs/logs/uat_*/cells.jsonl; do
            echo "== $f"; cut -c1-260 "$f"
          done
