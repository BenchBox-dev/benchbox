name: Mirror CI images

on:
  workflow_call:
    inputs:
      images:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install registry copy tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | skopeo login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Verify pinned digest and mirror image
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          pinned_source=
          fallback_sources=()
          repository=$IMAGE
          case "$IMAGE" in
            clickhouse) compose=docker/clickhouse/docker-compose.yml; service=clickhouse ;;
            trino) compose=docker/trino/docker-compose.yml; service=trino ;;
            cedardb) compose=docker/cedardb/docker-compose.yml; service=cedardb ;;
            postgres)
              compose=docker/postgresql/docker-compose.yml
              service=postgresql
              fallback_sources=(docker.io/library/postgres)
              ;;
            postgres17)
              pinned_source=public.ecr.aws/docker/library/postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
              repository=postgres
              fallback_sources=(docker.io/library/postgres)
              ;;
            *) echo "::error::Unsupported mirror image: $IMAGE"; exit 1 ;;
          esac
          if [ -n "$pinned_source" ]; then
            source=$pinned_source
          else
            source=$(CLICKHOUSE_MEMORY_LIMIT=4g docker compose -f "$compose" config --format json | jq -r --arg service "$service" '.services[$service].image')
          fi
          if [[ ! "$source" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Mirror source must be pinned to a SHA-256 digest in compose: $source"
            exit 1
          fi
          digest=${source##*@}
          source_name=${source%@*}
          source_registry=docker.io
          if [[ "$source_name" == */* && "${source_name%%/*}" == *[.:]* ]]; then
            source_registry=${source_name%%/*}
            source_name=${source_name#*/}
          fi
          source_repository=${source_name%/*}
          source_leaf=${source_name##*/}
          if [[ "$source_name" == */* ]]; then
            source_repository="$source_repository/${source_leaf%%:*}"
          else
            source_repository=${source_leaf%%:*}
          fi
          source_ref="docker://$source_registry/$source_repository@${digest}"
          destination="ghcr.io/benchbox-dev/$repository@${digest}"
          copy_destination="ghcr.io/benchbox-dev/$repository:digest-${digest#sha256:}"
          destination_ref="docker://$destination"
          mirror_manifest="$RUNNER_TEMP/${IMAGE}-mirror-manifest.json"
          inspect_error="$RUNNER_TEMP/${IMAGE}-mirror-inspect.err"
          printf 'Pinned %s (%s): %s\n' "$IMAGE" "$source" "$digest" >> "$GITHUB_STEP_SUMMARY"
          if skopeo inspect --raw "$destination_ref" > "$mirror_manifest" 2> "$inspect_error"; then
            :
          else
            inspect_output=$(cat "$inspect_error")
            if [[ "$inspect_output" != *"manifest unknown"* && "$inspect_output" != *"MANIFEST_UNKNOWN"* ]]; then
              cat "$inspect_error" >&2
              exit 1
            fi
            source_refs=("$source_ref")
            for fallback in ${fallback_sources[@]+"${fallback_sources[@]}"}; do
              source_refs+=("docker://$fallback@${digest}")
            done
            retry_pattern='toomanyrequests|too many requests|rate limit|Data limit exceeded|(^|[^[:alnum:]])(429|500|502|503|504)([^[:alnum:]]|$)|timeout|timed out|deadline exceeded|connection reset|connection refused|unexpected EOF|temporarily unavailable|service unavailable|bad gateway'
            auth_pattern='unauthorized|denied|forbidden|authentication required|(^|[^[:alnum:]])(401|403)([^[:alnum:]]|$)'
            max_attempts=3
            base_delay=${MIRROR_RETRY_BASE_SECONDS:-10}
            copy_error="$RUNNER_TEMP/${IMAGE}-mirror-copy.err"
            failures=()
            copied=false
            for candidate in "${source_refs[@]}"; do
              attempt=1
              retry_delay=$base_delay
              while true; do
                if skopeo copy --all --preserve-digests "$candidate" "docker://$copy_destination" 2> "$copy_error"; then
                  copied=true
                  break 2
                fi
                copy_output=$(cat "$copy_error")
                shopt -s nocasematch
                retryable=false
                authfail=false
                if [[ "$copy_output" =~ $retry_pattern ]]; then
                  retryable=true
                elif [[ "$copy_output" =~ $auth_pattern ]]; then
                  authfail=true
                fi
                shopt -u nocasematch
                failures+=("$candidate (attempt $attempt): $copy_output")
                if [ "$authfail" = true ]; then
                  echo "::error::Authentication failure copying $candidate: $copy_output"
                  exit 1
                fi
                if [ "$retryable" = true ] && [ "$attempt" -lt "$max_attempts" ]; then
                  echo "::warning::Transient error copying $candidate (attempt $attempt of $max_attempts); retrying in ${retry_delay}s: $copy_output"
                  sleep "$retry_delay"
                  retry_delay=$((retry_delay * 2))
                  attempt=$((attempt + 1))
                  continue
                fi
                echo "::warning::Giving up on $candidate after $attempt attempt(s): $copy_output"
                break
              done
            done
            if [ "$copied" != true ]; then
              echo "::error::Could not copy $IMAGE digest $digest from any source."
              for failure in "${failures[@]}"; do
                echo "::error::$failure"
              done
              exit 1
            fi
            skopeo inspect --raw "$destination_ref" > "$mirror_manifest"
          fi
          mirror_digest="sha256:$(sha256sum "$mirror_manifest" | cut -d' ' -f1)"
          if [[ "$mirror_digest" != "$digest" ]]; then
            echo "::error::GHCR mirror digest mismatch for $source: expected $digest but got $mirror_digest."
            exit 1
          fi
