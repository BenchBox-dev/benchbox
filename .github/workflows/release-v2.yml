name: Release v2

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Annotated release tag to publish (for example v0.5.0rc1 for TestPyPI, v0.5.0 for PyPI)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-v2-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  admit:
    name: admit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      head_sha: ${{ steps.admit.outputs.head_sha }}
      target: ${{ steps.route.outputs.target }}
    steps:
      - name: Validate tag shape
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::Tag '$RELEASE_TAG' is not a PEP 440 vX.Y.Z or vX.Y.Z(a|b|rc)N tag."
            exit 1
          fi

      - name: Route pre-releases to TestPyPI only
        id: route
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "target=pypi" >> "$GITHUB_OUTPUT"
          else
            echo "target=test-pypi" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Require an annotated tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          kind="$(git cat-file -t "$RELEASE_TAG")"
          if [ "$kind" != "tag" ]; then
            echo "::error::Tag $RELEASE_TAG is a $kind, not an annotated tag object. Create it with: git tag -a $RELEASE_TAG -m $RELEASE_TAG"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Verify the pre-tag state
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          make release-check VERSION="$version"

      - name: Check ruleset drift without the readiness override
        env:
          RULESET_DRIFT_TOKEN: ${{ secrets.RULESET_DRIFT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$RULESET_DRIFT_TOKEN"
          unset RELEASE_READINESS_OVERRIDE_SHA RELEASE_READINESS_OVERRIDE_REASON
          uv run -- python scripts/ruleset_drift_check.py --token "$RULESET_DRIFT_TOKEN" --require-bypass-actor-visibility

      - name: Refuse open release-blocking issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run -- python scripts/release_blocker_check.py

      - name: Admit the trunk-tested artifacts
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          uv run -- python scripts/release_artifact_consumer.py admit \
            --source . --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/admitted"
          head_sha="$(git rev-parse HEAD)"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          cp -R "$RUNNER_TEMP/admitted" admitted

      - name: Upload the admitted directory
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: admitted-${{ inputs.tag || github.ref_name }}
          path: admitted/
          retention-days: 7
          if-no-files-found: error

  install-matrix:
    name: install ${{ matrix.python-version }} ${{ matrix.os }}
    needs: admit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Download the admitted directory
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: admitted-${{ inputs.tag || github.ref_name }}
          path: admitted

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Stage and install the admitted wheel
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          HEAD_SHA: ${{ needs.admit.outputs.head_sha }}
        run: |
          set -euo pipefail
          python -m pip install packaging
          python scripts/release_admitted_dist.py --admitted admitted --tag "$RELEASE_TAG" --sha "$HEAD_SHA" --stage staged
          python -m pip install staged/*.whl
          python -c "import benchbox; print(benchbox.__version__)"
          benchbox --help

  release-uat:
    name: release UAT
    needs: admit
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Name the distribution digest file
        run: echo "RELEASE_DIST_DIGEST_FILE=$RUNNER_TEMP/dist-digest.txt" >> "$GITHUB_ENV"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Download the admitted directory
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: admitted-${{ inputs.tag || github.ref_name }}
          path: ${{ runner.temp }}/admitted

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install the admitted wheel and record its digest
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          HEAD_SHA: ${{ needs.admit.outputs.head_sha }}
        run: |
          set -euo pipefail
          uv sync --group dev --extra clickhouse-local --extra clickhouse-server --extra lakesail --extra databend --extra influxdb --extra singlestore
          uv run --no-sync -- python scripts/release_admitted_dist.py --admitted "$RUNNER_TEMP/admitted" --tag "$RELEASE_TAG" --sha "$HEAD_SHA" --stage "$RUNNER_TEMP/staged"
          uv pip install --python .venv/bin/python "$RUNNER_TEMP"/staged/*.whl
          (cd "$RUNNER_TEMP/staged" && sha256sum -- *.whl *.tar.gz) > "$RELEASE_DIST_DIGEST_FILE"
          cat "$RELEASE_DIST_DIGEST_FILE"

      - name: Hide the checkout package so UAT imports the admitted wheel
        run: |
          set -euo pipefail
          git ls-files -z benchbox | xargs -0 git update-index --assume-unchanged
          mv benchbox "$RUNNER_TEMP/benchbox.checkout"

      - name: Run the release-gate UAT configs against the admitted distribution
        env:
          UV_NO_SYNC: '1'
        run: |
          set -euo pipefail
          .venv/bin/python -c "import benchbox, pathlib; path = pathlib.Path(benchbox.__file__).resolve(); assert 'site-packages' in path.parts, path"
          logs="$HOME/Developer/benchmark_runs/logs"
          stage=0
          for config in tests/uat/configs/release-gate-*.yaml; do
            stage=$((stage + 1))
            make uat-sweep CONFIG="$config"
            latest="$(ls -1dt "$logs"/uat_* | head -n 1)"
            echo "$latest" > "$RUNNER_TEMP/stage$stage.dir"
          done
          test "$stage" -eq 3
          .venv/bin/python -c "import benchbox, pathlib; path = pathlib.Path(benchbox.__file__).resolve(); assert 'site-packages' in path.parts, path"
          make uat-gate-check \
            STAGE1="$(cat "$RUNNER_TEMP/stage1.dir")" \
            STAGE2="$(cat "$RUNNER_TEMP/stage2.dir")" \
            STAGE3="$(cat "$RUNNER_TEMP/stage3.dir")" \
            OUTPUT="$RUNNER_TEMP/uat-gate-summary.json" \
            DIST_DIGEST="$(sha256sum "$RELEASE_DIST_DIGEST_FILE" | cut -d' ' -f1)"

      - name: Restore the checkout package
        if: always()
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/benchbox.checkout" ]; then
            mv "$RUNNER_TEMP/benchbox.checkout" benchbox
          fi
          git ls-files -z benchbox | xargs -0 git update-index --no-assume-unchanged

      - name: Upload UAT evidence with the distribution digest
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-uat-${{ inputs.tag || github.ref_name }}
          path: |
            ${{ runner.temp }}/dist-digest.txt
            ${{ runner.temp }}/uat-gate-summary.json
            ~/Developer/benchmark_runs/logs/
          retention-days: 30
          if-no-files-found: warn

  publish:
    name: publish to ${{ needs.admit.outputs.target }}
    needs: [admit, install-matrix, release-uat]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ needs.admit.outputs.target }}
      url: ${{ needs.admit.outputs.target == 'test-pypi' && 'https://test.pypi.org/p/benchbox' || 'https://pypi.org/p/benchbox' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Download the admitted directory
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: admitted-${{ inputs.tag || github.ref_name }}
          path: admitted

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install the staging gate dependency
        run: python3 -m pip install packaging

      - name: Re-check the hosted tag after approval
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" --force
          python3 scripts/release_tag_recheck.py --admitted admitted --tag "$RELEASE_TAG"

      - name: Stage only the verified distributions
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          HEAD_SHA: ${{ needs.admit.outputs.head_sha }}
        run: |
          set -euo pipefail
          python3 scripts/release_admitted_dist.py --admitted admitted --tag "$RELEASE_TAG" --sha "$HEAD_SHA" --stage staged
          ls -l staged

      - name: Attest the staged distributions
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            staged/*.whl
            staged/*.tar.gz

      - name: Publish to TestPyPI
        if: needs.admit.outputs.target == 'test-pypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: staged/
          skip-existing: true
          attestations: true
          verbose: true

      - name: Publish to PyPI
        if: needs.admit.outputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: staged/
          skip-existing: true
          attestations: true
          verbose: true

  github-release:
    name: github release
    needs: [admit, publish]
    if: needs.admit.outputs.target == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Download the admitted directory
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: admitted-${{ inputs.tag || github.ref_name }}
          path: admitted

      - name: Create the GitHub release from the admitted distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          HEAD_SHA: ${{ needs.admit.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install packaging
          python3 scripts/release_admitted_dist.py --admitted admitted --tag "$RELEASE_TAG" --sha "$HEAD_SHA" --stage staged
          version="${RELEASE_TAG#v}"
          python3 scripts/generate_changelog_entry.py --version "$version" --print-section > release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" staged/* --clobber
            gh release edit "$RELEASE_TAG" --title "BenchBox $version" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" staged/* --title "BenchBox $version" --notes-file release-notes.md
          fi
