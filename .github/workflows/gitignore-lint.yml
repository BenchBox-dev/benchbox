name: gitignore lint

on:
  pull_request:
    branches: [develop]
    paths: ['.gitignore']

permissions:
  contents: read

concurrency:
  group: gitignore-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ignore-vs-tracked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Detect newly-ignored tracked paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          uv run --no-project --no-cache -- python - <<'PY'
          from __future__ import annotations

          import os
          import re
          import subprocess
          import sys
          from collections import defaultdict
          from pathlib import Path


          def run(args: list[str], *, input_bytes: bytes | None = None) -> subprocess.CompletedProcess[bytes]:
              return subprocess.run(args, input=input_bytes, capture_output=True, check=False)


          def added_gitignore_lines(base_sha: str) -> set[int]:
              diff = subprocess.check_output(
                  ["git", "diff", "--unified=0", "--no-color", f"{base_sha}..HEAD", "--", ".gitignore"],
                  text=True,
              )
              added: set[int] = set()
              new_line: int | None = None
              for line in diff.splitlines():
                  if line.startswith("@@"):
                      match = re.search(r"\+(\d+)(?:,\d+)?", line)
                      new_line = int(match.group(1)) if match else None
                      continue
                  if new_line is None:
                      continue
                  if line.startswith("+") and not line.startswith("+++"):
                      added.add(new_line)
                      new_line += 1
                  elif line.startswith("-") and not line.startswith("---"):
                      continue
                  elif not line.startswith("\\"):
                      new_line += 1
              return added


          def ignored_tracked_paths(paths: bytes, added_lines: set[int]) -> dict[int, dict[str, set[str]]]:
              proc = run(["git", "check-ignore", "-z", "-v", "--no-index", "--stdin"], input_bytes=paths)
              if proc.returncode not in (0, 1):
                  sys.stderr.buffer.write(proc.stderr)
                  sys.exit(proc.returncode)

              fields = proc.stdout.split(b"\0")
              hits: dict[int, dict[str, set[str]]] = defaultdict(lambda: defaultdict(set))
              for idx in range(0, len(fields) - 1, 4):
                  source, line_no, pattern, path = fields[idx : idx + 4]
                  if source.decode("utf-8", "replace") != ".gitignore":
                      continue
                  line = int(line_no)
                  if line not in added_lines:
                      continue
                  hits[line][pattern.decode("utf-8", "replace")].add(path.decode("utf-8", "replace"))
              return hits


          base_sha = os.environ["BASE_SHA"]
          added_lines = added_gitignore_lines(base_sha)
          if not added_lines:
              print("No new .gitignore lines in this PR.")
              sys.exit(0)

          lines = Path(".gitignore").read_text(encoding="utf-8-sig").splitlines()
          waiver_lines = {
              line_no + 1
              for line_no, text in enumerate(lines, start=1)
              if "benchbox-ignore-lint: allow-next-line tracked" in text
          }

          base_paths = subprocess.check_output(["git", "ls-tree", "-r", "--name-only", "-z", base_sha])
          head_paths = subprocess.check_output(["git", "ls-files", "-z"])
          base_hits = ignored_tracked_paths(base_paths, added_lines)
          head_hits = ignored_tracked_paths(head_paths, added_lines)

          failed = False
          for line, pattern_hits in sorted(head_hits.items()):
              failed = True
              patterns = ", ".join(repr(pattern) for pattern in pattern_hits)
              print(
                  f"::error file=.gitignore,line={line}::New ignore pattern(s) {patterns} "
                  "still match files tracked in this PR. Drop the ignore rule or untrack the files "
                  "with 'git rm -r --cached <path>' in the same PR."
              )
              for paths in pattern_hits.values():
                  for path in sorted(paths)[:20]:
                      print(f"  {path}")

          for line, pattern_hits in sorted(base_hits.items()):
              if line in head_hits or line in waiver_lines:
                  continue
              failed = True
              patterns = ", ".join(repr(pattern) for pattern in pattern_hits)
              print(
                  f"::error file=.gitignore,line={line}::New ignore pattern(s) {patterns} "
                  "match files tracked on the base branch. This can create modify-vs-delete "
                  "conflicts for open PRs. If this is intentional untracking, keep the PR isolated, "
                  "remove the tracked files from the index, and add this comment immediately before "
                  "the pattern: '# benchbox-ignore-lint: allow-next-line tracked'."
              )
              for paths in pattern_hits.values():
                  for path in sorted(paths)[:20]:
                      print(f"  {path}")

          if failed:
              sys.exit(1)

          print("New .gitignore rules do not newly ignore tracked files.")
          PY
