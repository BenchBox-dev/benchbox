name: Nightly T3

env:
  BENCHBOX_TEST_LOCK_WAIT_SECONDS: "0"

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      run_drift:
        description: "Run the t3:drift checks (scheduled runs run them on Mondays only)"
        type: boolean
        required: false
        default: true

concurrency:
  group: nightly-t3-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror-images:
    uses: ./.github/workflows/mirror-ci-images.yml
    permissions:
      contents: read
      packages: write
    with:
      images: '["clickhouse", "trino", "postgres"]'

  mirror-cedardb:
    uses: ./.github/workflows/mirror-ci-images.yml
    permissions:
      contents: read
      packages: write
    with:
      images: '["cedardb"]'

  mirror-questdb:
    uses: ./.github/workflows/mirror-ci-images.yml
    permissions:
      contents: read
      packages: write
    with:
      images: '["questdb"]'

  mirror-postgres17:
    uses: ./.github/workflows/mirror-ci-images.yml
    permissions:
      contents: read
      packages: write
    with:
      images: '["postgres17"]'

  docker:
    name: "t3:docker | ${{ matrix.service }}"
    needs: mirror-images
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: postgres
            compose: docker/postgresql/docker-compose.yml
            tests: tests/integration/platforms/test_postgresql_live.py
            marker: live_postgresql
          - service: clickhouse
            compose: docker/clickhouse/docker-compose.yml
            tests: tests/integration/platforms/test_clickhouse_live.py
            marker: live_clickhouse
          - service: trino
            compose: docker/trino/docker-compose.yml
            tests: tests/integration/platforms/test_trino_live.py
            marker: live_trino
    env:
      CLICKHOUSE_MEMORY_LIMIT: 4g
      CLICKHOUSE_IMAGE: ghcr.io/benchbox-dev/clickhouse:25.8@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
      TRINO_IMAGE: ghcr.io/benchbox-dev/trino:480@sha256:1565e8cac299a32dd9177a4da2d748da4ceb9f1560a9c409d1d18fd72ea5253e
      POSTGRES_IMAGE: ghcr.io/benchbox-dev/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Bring up compose stack
        run: docker compose -f "${{ matrix.compose }}" up -d --wait

      - name: Run live integration tests
        run: |
          set -o pipefail
          uv run -- python -m pytest "${{ matrix.tests }}" \
            -m "${{ matrix.marker }}" --tb=short -v -p no:cacheprovider \
            | tee "docker-${{ matrix.service }}-output.txt"
          if ! grep -Eq '[0-9]+ passed' "docker-${{ matrix.service }}-output.txt"; then
            echo "::error::${{ matrix.service }} Docker integration produced no passing tests."
            exit 1
          fi

      - name: Collect compose logs
        if: failure()
        run: docker compose -f "${{ matrix.compose }}" logs --no-color > "docker-${{ matrix.service }}-compose.log" || true

      - name: Tear down compose stack
        if: always()
        run: docker compose -f "${{ matrix.compose }}" down -v

      - name: Upload docker artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: t3-docker-${{ matrix.service }}
          path: |
            docker-${{ matrix.service }}-output.txt
            docker-${{ matrix.service }}-compose.log
          if-no-files-found: ignore
          retention-days: 14

  cloud:
    name: "t3:cloud | live plan capture"
    if: ${{ vars.BENCHBOX_T3_CLOUD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USERNAME: ${{ secrets.SNOWFLAKE_USERNAME }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
      BIGQUERY_PROJECT: ${{ secrets.BIGQUERY_PROJECT }}
      BIGQUERY_DATASET: ${{ secrets.BIGQUERY_DATASET }}
      REDSHIFT_HOST: ${{ secrets.REDSHIFT_HOST }}
      REDSHIFT_PORT: ${{ secrets.REDSHIFT_PORT || 5439 }}
      REDSHIFT_USER: ${{ secrets.REDSHIFT_USER }}
      REDSHIFT_PASSWORD: ${{ secrets.REDSHIFT_PASSWORD }}
      REDSHIFT_DATABASE: ${{ secrets.REDSHIFT_DATABASE }}
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      MOTHERDUCK_DATABASE: ${{ secrets.MOTHERDUCK_DATABASE || 'benchbox_test' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: |
          uv sync --group dev --extra snowflake --extra bigquery --extra redshift --extra duckdb

      - name: Write GCP service account key to temp file
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -n "${GCP_SERVICE_ACCOUNT_KEY}" ]; then
            key_file="${RUNNER_TEMP}/gcp-service-account-key.json"
            printf '%s' "${GCP_SERVICE_ACCOUNT_KEY}" > "${key_file}"
            chmod 600 "${key_file}"
            echo "GOOGLE_APPLICATION_CREDENTIALS=${key_file}" >> "${GITHUB_ENV}"
          else
            echo "No GCP service account key configured; BigQuery tests will skip."
          fi

      - name: Run Snowflake, BigQuery, Redshift, and MotherDuck plan-capture live tests
        run: |
          uv run -- python -m pytest \
            "tests/integration/platforms/test_snowflake_live.py::TestLiveSnowflakeQueryPlanCapture" \
            "tests/integration/platforms/test_bigquery_live.py::TestLiveBigQueryQueryPlanCapture" \
            "tests/integration/platforms/test_redshift_live.py::TestLiveRedshiftQueryPlanCapture" \
            "tests/integration/platforms/test_motherduck_live.py::TestLiveMotherDuckQueryPlanCapture" \
            -m "live_snowflake or live_bigquery or live_redshift or live_motherduck" --tb=short -v -p no:cacheprovider \
            --junitxml=junit-cloud.xml

      - name: Upload cloud artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: t3-cloud
          path: junit-cloud.xml
          if-no-files-found: ignore
          retention-days: 14

  perf:
    name: "t3:perf | DuckDB TPC-H SF=0.01"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Set isolated benchmark output
        run: echo "BENCHBOX_OUTPUT_DIR=$RUNNER_TEMP/perf-smoke" >> "$GITHUB_ENV"

      - name: Run DuckDB TPC-H SF=0.01 power phase
        run: |
          uv run benchbox run \
            --platform duckdb \
            --benchmark tpch \
            --scale 0.01 \
            --phases power \
            --non-interactive

      - name: Locate current result file
        id: current
        run: |
          results=()
          while IFS= read -r result; do
            results+=("$result")
          done < <(find "$BENCHBOX_OUTPUT_DIR/results" -maxdepth 1 -name 'tpch_sf001_duckdb_sql_*.json' -print)
          if [[ "${#results[@]}" != "1" ]]; then
            echo "Expected one current result file, found ${#results[@]}." >&2
            exit 1
          fi
          echo "path=${results[0]}" >> "$GITHUB_OUTPUT"

      - name: Compare against baseline (fail on >10% regression)
        run: |
          uv run benchbox compare \
            _project/baselines/perf_smoke_duckdb_tpch_001.json \
            "${{ steps.current.outputs.path }}" \
            --fail-on-regression 10% \
            --min-regression-delta 7ms \
            --min-aggregate-regression-delta 82ms

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: t3-perf-result
          path: |
            ${{ env.BENCHBOX_OUTPUT_DIR }}/results/*.json
            _project/baselines/perf_smoke_duckdb_tpch_001.json
          retention-days: 14

  matrix:
    name: "t3:matrix | ${{ matrix.os }} py${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Build package
        run: uv build

      - name: Test package installation
        shell: bash
        run: |
          set -euo pipefail
          wheel_count=$(find dist -maxdepth 1 -name '*.whl' | wc -l | tr -d '[:space:]')
          if [ "$wheel_count" != "1" ]; then
            echo "::error::Expected exactly one wheel, found $wheel_count"
            find dist -maxdepth 1 -type f -print
            exit 1
          fi
          wheel=$(find "$PWD/dist" -maxdepth 1 -name '*.whl' -print -quit)
          tmpdir=$(mktemp -d)
          cd "$tmpdir"
          uv run --isolated --no-project --with "$wheel" -- python -c "import importlib.util; import benchbox; assert importlib.util.find_spec('pandas') is None, 'core install must not pull pandas'; print('Package installation successful (minimal import surface)')"
          uv run --isolated --no-project --with "$wheel" -- benchbox --help

      - name: Run bundled dbgen and dsdgen from the installed wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find "$PWD/dist" -maxdepth 1 -name '*.whl' -print -quit)
          tmpdir=$(mktemp -d)
          cd "$tmpdir"
          uv run --isolated --no-project --with "$wheel" -- python - <<'PY'
          import tempfile
          from pathlib import Path

          from benchbox import TPCDS, TPCH

          with tempfile.TemporaryDirectory() as tmp:
              for cls, table in ((TPCH, "nation.tbl"), (TPCDS, "call_center.dat")):
                  out = Path(tmp) / cls.__name__.lower()
                  cls(scale_factor=0.01, output_dir=out).generate_data()
                  produced = out / table
                  assert produced.is_file() and produced.stat().st_size > 0, f"{cls.__name__} produced no {table}"
                  print(f"{cls.__name__}: {table} {produced.stat().st_size} bytes")
          PY

      - name: Install raw binary framing test dependencies
        if: matrix.python-version == '3.12'
        run: uv sync --group dev

      - name: Verify bundled dbgen binaries emit clean framing
        if: matrix.python-version == '3.12'
        run: uv run -- python -m pytest tests/unit/core/tpch/test_tpch_dbgen_framing_binaries.py -m slow -v

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: t3-matrix-dist-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/
          if-no-files-found: ignore
          retention-days: 7

  extension:
    name: "t3:extension | duckdb-datasketches"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install duckdb only
        run: uv sync --no-dev --no-install-project

      - name: Run datasketches smoke
        run: |
          set -o pipefail
          uv run -- python scripts/duckdb_datasketches_smoke.py 2>&1 | tee datasketches-smoke.txt

      - name: Upload extension artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: t3-extension
          path: datasketches-smoke.txt
          if-no-files-found: ignore
          retention-days: 14

  install:
    name: "t3:install | pypi-latest installability"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install and import PyPI-latest benchbox (no local source in sys.path)
        shell: bash
        run: |
          set -euo pipefail
          workdir=$(mktemp -d)
          cd "$workdir"
          uv run --isolated --no-project --with benchbox -- python -c "import importlib.util; import benchbox; assert importlib.util.find_spec('pandas') is None, 'core install must not pull pandas'; print(f'PyPI-latest BenchBox {benchbox.__version__} installed successfully (minimal import surface)')" | tee "$GITHUB_WORKSPACE/pypi-latest-install.txt"

      - name: Upload install artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: t3-install
          path: pypi-latest-install.txt
          if-no-files-found: ignore
          retention-days: 14

  throughput:
    name: "t3:throughput | duckdb tpch sf1 streams 3"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      THROUGHPUT_FLOOR_MEDIAN: ${{ vars.THROUGHPUT_FLOOR_MEDIAN }}
      THROUGHPUT_FLOOR_MAX_DROP_FRACTION: ${{ vars.THROUGHPUT_FLOOR_MAX_DROP_FRACTION }}
      THROUGHPUT_BASELINE_MIN_RECORDED_AT: ${{ vars.THROUGHPUT_BASELINE_MIN_RECORDED_AT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run real-DB throughput integration tests (DuckDB)
        run: |
          uv run -- python -m pytest tests/integration -k "throughput and duckdb" -m integration --tb=short -v

      - name: Run DuckDB throughput UAT cell (TPC-H SF1, run-official --streams 3)
        id: duckdb-sweep
        run: |
          make uat-sweep CONFIG=tests/uat/configs/uat-throughput-duckdb-nightly.yaml

      - name: Download retained Throughput@Size baselines
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          history="$HOME/Developer/benchmark_runs/throughput-baseline-history"
          mkdir -p "$history"
          if ! legacy_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --paginate \
            --jq '.workflows[] | select(.name == "Nightly Validation" or (.path | endswith("/nightly.yml"))) | .id'); then
            echo "::warning::could not resolve the retired Nightly Validation workflow; its Throughput@Size baselines are not counted"
            legacy_id=""
          fi
          if [ -z "${legacy_id}" ]; then
            echo "::warning::no workflow named Nightly Validation is registered; its Throughput@Size baselines are not counted"
          fi
          for workflow in nightly-v2.yml ${legacy_id}; do
            if ! run_ids=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch develop --event schedule --limit 30 \
              --json databaseId --jq ".[] | select(.databaseId != ${GITHUB_RUN_ID}) | .databaseId"); then
              echo "::warning::could not list prior ${workflow} runs; their Throughput@Size baselines are not counted"
              continue
            fi
            for run_id in ${run_ids}; do
              gh run download "${run_id}" --repo "$GITHUB_REPOSITORY" \
                --pattern 'throughput-baseline-duckdb-tpch-sf1-*' --dir "${history}/${run_id}" 2>/dev/null || true
            done
          done
          echo "Downloaded $(find "$history" -name 'throughput-baseline-*.json' | wc -l) baseline record(s)"

      - name: Assert the requested stream count reached the driver and every stream succeeded
        if: ${{ !cancelled() }}
        run: |
          uv run -- python -m tests.uat.throughput assert \
            --cells-glob "$HOME/Developer/benchmark_runs/logs/uat_throughput_duckdb_nightly_*/cells.jsonl" \
            --platform duckdb --benchmark tpch --scale 1 --streams 3 \
            --evaluate-floor \
            --baseline-history "$HOME/Developer/benchmark_runs/throughput-baseline-history" \
            --baseline-out "$HOME/Developer/benchmark_runs/throughput-baseline"

      - name: Upload throughput UAT logs and results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: throughput-uat-duckdb-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ~/Developer/benchmark_runs/logs/uat_throughput_duckdb_*
            ~/Developer/benchmark_runs/results/tpch_sf1_*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Throughput@Size baseline record
        if: ${{ !cancelled() && steps.duckdb-sweep.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: throughput-baseline-duckdb-tpch-sf1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ~/Developer/benchmark_runs/throughput-baseline/
          if-no-files-found: ignore
          retention-days: 90

  throughput-cedardb:
    name: "t3:throughput-cedardb | cedardb tpch sf1 streams 3"
    needs: mirror-cedardb
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    outputs:
      cedardb_sweep_outcome: ${{ steps.cedardb-sweep.outcome }}
    env:
      CEDARDB_IMAGE: ghcr.io/benchbox-dev/cedardb@sha256:dbbacb16b24421a9a123cd1d065e2a049c60b7cc6060d7db2f3cccbf69f5ff62
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Run CedarDB throughput UAT cell (TPC-H SF1, run-official --streams 3)
        id: cedardb-sweep
        run: |
          make uat-sweep CONFIG=tests/uat/configs/uat-throughput-cedardb-nightly.yaml

      - name: Assert the CedarDB cell stream count and per-stream success
        if: ${{ !cancelled() }}
        run: |
          uv run -- python -m tests.uat.throughput assert \
            --cells-glob "$HOME/Developer/benchmark_runs/logs/uat_throughput_cedardb_nightly_*/cells.jsonl" \
            --platform cedardb --benchmark tpch --scale 1 --streams 3

      - name: Upload CedarDB throughput UAT logs and results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: throughput-uat-cedardb-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ~/Developer/benchmark_runs/logs/uat_throughput_cedardb_*
            ~/Developer/benchmark_runs/results/tpch_sf1_*.json
          if-no-files-found: warn
          retention-days: 14

  throughput-signal:
    name: throughput-signal
    needs: [throughput, throughput-cedardb]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Publish the throughput-uat commit status
        env:
          GH_TOKEN: ${{ github.token }}
          DUCKDB_RESULT: ${{ needs.throughput.result }}
          CEDARDB_RESULT: ${{ needs.throughput-cedardb.result }}
          CEDARDB_SWEEP_OUTCOME: ${{ needs.throughput-cedardb.outputs.cedardb_sweep_outcome }}
        run: |
          case "${DUCKDB_RESULT}:${CEDARDB_RESULT}" in
            success:success) state=success ;;
            cancelled:*|*:cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context="nightly/throughput-uat" \
            -f description="throughput-uat DuckDB ${DUCKDB_RESULT}; CedarDB job ${CEDARDB_RESULT}; cell ${CEDARDB_SWEEP_OUTCOME:-not run}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  drift-gate:
    name: "t3:drift | gate"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - name: Decide whether to run drift checks
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_DRIFT: ${{ inputs.run_drift }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            run="$RUN_DRIFT"
          elif [ "$(date -u +%u)" = "1" ]; then
            run=true
          else
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Drift checks selected: $run"

  drift:
    name: "t3:drift | corpus, pricing, validator, baseline"
    needs: [drift-gate]
    if: ${{ needs.drift-gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUMMARY_PATH: t3-drift/cross-surface-baseline-summary.json
      BASELINE_PATH: benchbox/core/equivalence/cross_surface_baseline.yaml
    steps:
      - name: Check out develop
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Fetch published-results
        run: git fetch --no-tags --depth=1 origin published-results:refs/remotes/origin/published-results

      - name: Corpus drift (develop vs published-results, directional)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          PUB=origin/published-results
          DEV=HEAD

          if ! git cat-file -e "${PUB}:results-data" 2>/dev/null; then
            echo "::error::published-results has no results-data/ tree"
            exit 2
          fi

          PATHSPECS=(
            'results-data/bundles'
            'results-data/CORPUS_NOTES.md'
            'results-data/SEED_CORPUS_SPEC.md'
            'results-data/README.md'
            'results-data/validate_corpus.py'
          )

          DEVELOP_AHEAD=$(git diff --name-only --diff-filter=A "${PUB}" "${DEV}" -- "${PATHSPECS[@]}" || true)
          PUBLISHED_ONLY=$(git diff --name-only --diff-filter=D "${PUB}" "${DEV}" -- "${PATHSPECS[@]}" || true)
          CONTENT_CHANGED=$(git diff --name-only --diff-filter=M "${PUB}" "${DEV}" -- "${PATHSPECS[@]}" || true)
          STALE_PATHS=$(printf '%s\n%s\n' "${CONTENT_CHANGED}" "${DEVELOP_AHEAD}" | sed '/^$/d' || true)

          if [[ -n "${PUBLISHED_ONLY}" ]]; then
            PO_COUNT=$(printf '%s\n' "${PUBLISHED_ONLY}" | sed '/^$/d' | wc -l | tr -d ' ')
            echo "::notice::published-results has ${PO_COUNT} path(s) not on develop (accepted archive submissions; not drift)."
            printf '%s\n' "${PUBLISHED_ONLY}" | head -40
          fi

          if [[ -z "${STALE_PATHS}" ]]; then
            echo "No develop-ahead corpus drift."
            exit 0
          fi

          COUNT=$(printf '%s\n' "${STALE_PATHS}" | wc -l | tr -d ' ')
          echo "::error::published-results corpus is ${COUNT} path(s) behind develop (develop-ahead or content-changed)."
          printf '%s\n' "${STALE_PATHS}" | head -40
          echo "Mirror develop-ahead paths with the non-destructive union overlay:"
          echo "  gh workflow run sync-results-data-to-published.yml --ref develop"
          echo "Never use a wipe-based full mirror: published-only community submissions would be deleted."
          exit 1

      - name: Corpus privacy scan (published-results tip)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          PUB=origin/published-results
          if ! git cat-file -e "${PUB}:results-data/bundles" 2>/dev/null; then
            echo "::error::published-results has no results-data/bundles tree"
            exit 2
          fi

          uv run -- python - <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          import sys

          from benchbox.core.results.anonymization import find_public_path_leaks

          pub = "origin/published-results"
          listed = subprocess.check_output(
              ["git", "ls-tree", "-r", "--name-only", pub, "results-data/"],
              text=True,
          )
          json_paths = [p for p in listed.splitlines() if p.endswith(".json")]
          if not json_paths:
              print("::error::published-results results-data/ has no JSON files to scan", file=sys.stderr)
              sys.exit(2)

          offenders: list[str] = []
          unreadable: list[str] = []
          for path in json_paths:
              try:
                  raw = subprocess.check_output(["git", "show", f"{pub}:{path}"])
                  payload = json.loads(raw)
              except (subprocess.CalledProcessError, UnicodeDecodeError, json.JSONDecodeError) as exc:
                  unreadable.append(f"{path}: {type(exc).__name__}")
                  continue
              leaks = find_public_path_leaks(payload)
              if leaks:
                  offenders.append(f"{path}: {', '.join(sorted(set(leaks))[:5])}")

          if unreadable:
              print(f"::error::{len(unreadable)} published corpus file(s) could not be parsed (failing closed):", file=sys.stderr)
              print("\n".join(unreadable[:20]), file=sys.stderr)
              sys.exit(1)
          if offenders:
              print(f"::error::{len(offenders)} published corpus file(s) expose private paths:", file=sys.stderr)
              print("\n".join(offenders[:20]), file=sys.stderr)
              sys.exit(1)
          print(f"Privacy scan clean: {len(json_paths)} published JSON surface(s), 0 path leaks.")
          PY

      - name: Submission validator drift (develop vs published-results)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          PUB=origin/published-results
          if ! git cat-file -e "${PUB}:.github/workflows/validate-submission.yml" 2>/dev/null; then
            echo "::error::published-results has no .github/workflows/validate-submission.yml"
            exit 2
          fi
          git show "${PUB}:.github/workflows/validate-submission.yml" > "${RUNNER_TEMP}/published-validate-submission.yml"
          uv run -- python scripts/check_submission_validator_sync.py \
            --develop .github/workflows/validate-submission.yml \
            --published "${RUNNER_TEMP}/published-validate-submission.yml"

      - name: Cross-surface baseline drift (resolved entries still listed)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${SUMMARY_PATH}")"
          uv run -- python _project/scripts/cross_surface_baseline_autodetect.py \
            --json-out "${SUMMARY_PATH}"
          if ! git diff --exit-code -- "${BASELINE_PATH}"; then
            echo "::error::Resolved cross-surface baseline entries are still listed in ${BASELINE_PATH}. Run 'make cross-surface-update-baseline BENCHMARK=<gate>' and commit the pruned baseline."
            exit 1
          fi

      - name: Restore checkout after baseline check
        if: ${{ !cancelled() }}
        run: git checkout -- "${BASELINE_PATH}"

      - name: Pricing data drift (re-pull vendor APIs)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          uv run -- python scripts/generate_pricing_data.py --refresh
          if git diff --exit-code -- benchbox/core/cost/pricing_data.yaml \
              benchbox/core/cost/pricing_vendor_evidence.yaml; then
            echo "Vendor pricing matches the recorded evidence."
          else
            echo "::error::Upstream vendor prices moved. Review the diff above, then run 'make pricing-data' locally after confirming the new list prices and commit the refreshed evidence and tables together."
            exit 1
          fi

      - name: Upload drift artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: t3-drift
          path: ${{ env.SUMMARY_PATH }}
          if-no-files-found: ignore
          retention-days: 30

  quarantine:
    name: "t3:quarantine | quarantined tests"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BENCHBOX_TEST_TIER: t3
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run quarantined tests
        run: |
          set -uo pipefail
          mkdir -p t3-quarantine
          uv run -- python -m pytest --markers > t3-quarantine/markers.txt
          if ! grep -q '^@pytest.mark.quarantine' t3-quarantine/markers.txt; then
            echo "::notice::The quarantine marker is not registered yet; nothing to run."
            exit 0
          fi
          rc=0
          uv run -- python -m pytest tests -m quarantine -n 0 --tb=short --timeout=1200 \
            --junitxml=t3-quarantine/junit-quarantine.xml || rc=$?
          if [ "$rc" = "5" ]; then
            echo "No quarantined tests."
            exit 0
          fi
          exit "$rc"

      - name: Upload quarantine artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: t3-quarantine
          path: t3-quarantine/
          if-no-files-found: ignore
          retention-days: 14

  liveness:
    name: "t3:liveness | scheduled workflow liveness"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout develop (scheduled runs come from the default branch)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: develop

      - name: Assert every scheduled workflow has a recent scheduled run
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/scheduled_workflow_liveness.py | tee liveness.log

      - name: Upload liveness log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: t3-liveness
          path: liveness.log
          if-no-files-found: ignore
          retention-days: 14

  ruleset-drift:
    name: "t3:ruleset-drift | live rulesets match the runbook"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout develop (scheduled runs come from the default branch)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: develop
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Compare live governance with the runbook
        shell: bash
        env:
          RULESET_DRIFT_TOKEN: ${{ secrets.RULESET_DRIFT_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/ruleset_drift_check.py \
            --token "${RULESET_DRIFT_TOKEN}" \
            --require-bypass-actor-visibility \
            --output ruleset-drift.json

      - name: Upload drift evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: t3-ruleset-drift
          path: ruleset-drift.json
          if-no-files-found: warn
          retention-days: 30

  windows:
    name: "t3:windows | fast unit tests (windows-latest, py3.12)"
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run fast tests
        run: uv run -- python -m pytest tests -m "fast and not (slow or stress or resource_heavy or live_integration)" --tb=short --timeout=120 --junitxml=junit-fast-windows.xml

      - name: Upload fast test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: t3-windows
          path: junit-fast-windows.xml
          if-no-files-found: ignore
          retention-days: 14
  tpcds-obt:
    name: "t3:tpcds-obt | OBT vs TPC-DS results (SF1)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BENCHBOX_TEST_TIER: t3
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Compare OBT and TPC-DS results at SF1
        run: make tpcds-obt-equivalence TPCDS_OBT_EQUIVALENCE_SF=1 PYTEST_ARGS="--junitxml=junit-tpcds-obt.xml -rs"

      - name: Upload OBT equivalence report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: t3-tpcds-obt
          path: junit-tpcds-obt.xml
          if-no-files-found: ignore
          retention-days: 14

  sql-execution-gate-obt:
    name: "t3:sql-execution-gate-obt | OBT execution gate (SF0.01)"
    needs: mirror-postgres17
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: ghcr.io/benchbox-dev/postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        credentials:
          username: ${{ github.actor }}
          password: ${{ github.token }}
        env:
          POSTGRES_USER: benchbox
          POSTGRES_PASSWORD: benchbox
          POSTGRES_DB: benchbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run the OBT execution gate
        env:
          BENCHBOX_POSTGRES_DSN: postgresql://benchbox:benchbox@127.0.0.1:5432/benchbox_test
        run: make sql-execution-gate SQL_EXECUTION_GATE_ARGS="--benchmarks tpcds_obt --baseline-ref none --report /tmp/gate-obt.json"

      - name: Upload OBT gate report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: t3-sql-execution-gate-obt
          path: /tmp/gate-obt.json
          if-no-files-found: ignore
          retention-days: 14

  durations-refresh:
    name: "t3:durations | duration refresh"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BENCHBOX_TEST_TIER: t3
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Measure fast tier durations
        run: |
          set -uo pipefail
          mkdir -p t3-durations
          statuses=(0 0)
          uv run -- python -m pytest tests -m "fast and not (slow or stress or resource_heavy or live_integration)" \
            --tb=short --timeout=120 --durations=0 --junitxml=t3-durations/junit-fast.xml \
            2>&1 | tee t3-durations/durations-fast.txt || statuses=("${PIPESTATUS[@]}")
          if [ "${statuses[1]}" != "0" ]; then exit "${statuses[1]}"; fi
          rc=${statuses[0]}
          printf '%s\n' "$rc" > t3-durations/pytest-fast.exit
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi

      - name: Measure slow tier durations
        run: |
          set -uo pipefail
          statuses=(0 0)
          uv run -- python -m pytest tests -m "slow and not (stress or resource_heavy or live_integration)" \
            -n 0 --tb=short --timeout=1200 --durations=0 --junitxml=t3-durations/junit-slow.xml \
            2>&1 | tee t3-durations/durations-slow.txt || statuses=("${PIPESTATUS[@]}")
          if [ "${statuses[1]}" != "0" ]; then exit "${statuses[1]}"; fi
          rc=${statuses[0]}
          printf '%s\n' "$rc" > t3-durations/pytest-slow.exit
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi

      - name: Regenerate duration file
        run: |
          set -euo pipefail
          if [ ! -f _project/scripts/update_test_durations.py ]; then
            echo "::notice::No duration tooling in this checkout; publishing raw --durations output only."
            exit 0
          fi
          uv run -- python _project/scripts/update_test_durations.py \
            --input t3-durations/junit-fast.xml \
            --input t3-durations/junit-slow.xml \
            --output t3-durations/test_durations.json

      - name: Upload duration artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: t3-durations
          path: t3-durations/
          if-no-files-found: ignore
          retention-days: 30

      - name: Require successful sampled tests
        if: ${{ always() }}
        run: |
          set -uo pipefail
          failed=0
          for tier in fast slow; do
            verdict="t3-durations/pytest-${tier}.exit"
            junit="t3-durations/junit-${tier}.xml"
            if [ ! -f "$verdict" ]; then
              echo "::error::${tier} duration sample has no pytest verdict."
              failed=1
              continue
            fi
            rc="$(cat "$verdict")"
            case "$rc" in
              0 | 1) ;;
              *)
                echo "::error::${tier} duration sample ended with pytest exit '${rc}'."
                failed=1
                continue
                ;;
            esac
            if [ ! -f "$junit" ]; then
              echo "::error::${tier} duration sample has no JUnit report."
              failed=1
              continue
            fi
            if ! ids="$(python3 - "$junit" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          for case in root.iter("testcase"):
              if case.find("failure") is not None or case.find("error") is not None:
                  print(f"{case.get('classname', '')}::{case.get('name', '')}")
          PY
            )"; then
              echo "::error::${tier} duration sample has an unparseable JUnit report."
              failed=1
              continue
            fi
            if [ "$rc" = "0" ] && [ -n "$ids" ]; then
              echo "::error::${tier} duration sample reported success but its JUnit report records failures: $(printf '%s' "$ids" | paste -sd ',' - | sed 's/,/, /g')"
              failed=1
            elif [ "$rc" = "1" ] && [ -z "$ids" ]; then
              echo "::error::${tier} duration sample reported test failures but its JUnit report records none."
              failed=1
            elif [ "$rc" = "1" ]; then
              names="$(printf '%s' "$ids" | paste -sd ',' - | sed 's/,/, /g')"
              echo "::warning::${tier} duration sample had failing tests (gated by the PR, trunk and release canary lanes): ${names}"
            fi
          done
          exit "$failed"

  security:
    name: "t3:security | pip-audit"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_AUDIT_IGNORE_VULNS: ""
    steps:
