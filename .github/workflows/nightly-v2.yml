  cross-engine:
    name: "t3:cross-engine | tpch sf0.01 duckdb x ${{ matrix.comparison }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - comparison: datafusion
            test-class: TestDuckDBDataFusion
          - comparison: polars-df
            test-class: TestDuckDBPolarsDF
          - comparison: clickhouse-local
            test-class: TestDuckDBClickHouseLocal
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Compare DuckDB with ${{ matrix.comparison }}
        id: compare
        continue-on-error: true
        env:
          TEST_CLASS: ${{ matrix.test-class }}
          REPORT: validation-report-${{ matrix.comparison }}.json
        run: |
          uv run -- python -m pytest tests/integration/validation/test_cross_platform.py \
            -v -m "live_integration" -k "${TEST_CLASS}" --tb=short \
            --json-report --json-report-file="${REPORT}"

      - name: Write structured diff artifact
        if: steps.compare.outcome == 'failure'
        run: |
          uv run -- python scripts/cross_engine_diff_artifact.py \
            --report validation-report-${{ matrix.comparison }}.json \
            --output diff-artifact-${{ matrix.comparison }}.json \
            --comparison ${{ matrix.comparison }}

      - name: Upload comparison artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: t3-cross-engine-tpch-${{ matrix.comparison }}
          path: |
            validation-report-${{ matrix.comparison }}.json
            diff-artifact-${{ matrix.comparison }}.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail when the engines diverge
        if: steps.compare.outcome == 'failure'
        run: |
          echo "::error::DuckDB and ${{ matrix.comparison }} diverged on TPC-H SF=0.01; see diff-artifact-${{ matrix.comparison }}.json and docs/internal/result-validation-triage.md"
          exit 1

  integration-smoke:
    name: "t3:integration-smoke | ${{ matrix.os }} py${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      BENCHBOX_TEST_TIER: t2
      PYTEST_ADDOPTS: --junitxml=junit-integration-smoke-${{ matrix.os }}.xml
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run integration smoke tests
        if: runner.os != 'Windows'
        run: make test-integration-smoke

      - name: Run integration smoke tests (Windows)
        if: runner.os == 'Windows'
        run: uv run -- python -m pytest tests/integration -m "platform_smoke or (integration and fast)" --tb=short

      - name: Upload integration smoke artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: t3-integration-smoke-${{ matrix.os }}
          path: junit-integration-smoke-${{ matrix.os }}.xml
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: "t3:integration | ${{ matrix.suite }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BENCHBOX_TEST_TIER: t2
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            junit: junit-integration-core.xml
          - suite: table-formats
            junit: junit-integration-table-formats.xml
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run core integration tests
        if: matrix.suite == 'core'
        run: uv run -- python -m pytest tests/integration -m "integration and not (slow or stress or resource_heavy or live_integration)" --tb=short --maxfail=5 --timeout=300 --junitxml=${{ matrix.junit }}

      - name: Run table-format integration tests
        if: matrix.suite == 'table-formats'
        run: uv run -- python -m pytest tests/integration/core/data_organization/test_presorted_generation.py -m "requires_table_formats" --tb=short --junitxml=${{ matrix.junit }}

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: t3-integration-${{ matrix.suite }}
          path: ${{ matrix.junit }}
          if-no-files-found: ignore
          retention-days: 14

  parity:
    name: "t3:parity | fixtures match Python source"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Verify parity fixtures match Python source
        run: |
          set -o pipefail
          make parity-check 2>&1 | tee parity-check.txt

      - name: Upload parity artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: t3-parity
          path: parity-check.txt
          if-no-files-found: ignore
          retention-days: 14

  sqlglot-generator:
    name: "t3:sqlglot-generator | generated translation pilot"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --group dev

      - name: Validate generated-case disposition policy
        run: >-
          uv run -- python scripts/check_sqlglot_generator_known_failures.py
          --policy _project/sqlglot-upstream/generator-policy.json

      - name: Run deterministic generated translation cases
        id: generator
        shell: bash
        env:
          FAILURE_ARTIFACT: ${{ runner.temp }}/sqlglot-generator-failure.json
          SUMMARY_ARTIFACT: ${{ runner.temp }}/sqlglot-generator-summary.json
        run: |
          set +e
          uv run -- python _project/sqlglot-upstream/repros/generator.py \
            --seed "${GITHUB_RUN_ID}" \
            --source-dialect postgres \
            --target-dialect duckdb \
            --cases 1024 \
            --deadline-seconds 300 \
            --failure-artifact "${FAILURE_ARTIFACT}" \
            --summary-artifact "${SUMMARY_ARTIFACT}"
          status=$?
          set -e

          if [ "${status}" -eq 1 ]; then
            uv run -- python _project/sqlglot-upstream/repros/generator.py \
              --seed "${GITHUB_RUN_ID}" \
              --source-dialect postgres \
              --target-dialect duckdb \
              --failure-artifact "${FAILURE_ARTIFACT}" \
              --summary-artifact "${SUMMARY_ARTIFACT}" \
              --validate-advisory-evidence
            echo "::warning::SQLGlot generated translation case discovered; replay artifact uploaded and the domain stays red."
            exit "${status}"
          fi
          if [ "${status}" -ne 0 ]; then
            echo "::error::SQLGlot generator infrastructure or contract failure (exit ${status})."
            exit "${status}"
          fi

      - name: Upload generated translation evidence
        if: ${{ !cancelled() && steps.generator.outcome != 'skipped' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: t3-sqlglot-generator
          path: |
            ${{ runner.temp }}/sqlglot-generator-summary.json
            ${{ runner.temp }}/sqlglot-generator-failure.json
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Report T3 results
    needs:
      - docker
      - mirror-images
      - mirror-cedardb
      - cloud
      - perf
      - matrix
      - extension
      - install
      - throughput
      - throughput-cedardb
      - throughput-signal
      - drift-gate
      - drift
      - quarantine
      - liveness
      - ruleset-drift
      - windows
      - tpcds-obt
      - sql-execution-gate-obt
      - security
      - cross-engine
      - integration-smoke
      - integration
      - parity
      - sqlglot-generator
      - mirror-questdb
      - mirror-postgres17
      - durations-refresh
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      NEEDS_JSON: ${{ toJSON(needs) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DOC_URL: ${{ github.server_url }}/${{ github.repository }}/blob/develop/docs/internal/nightly-t3.md
    steps:
      - name: Open, update, or close one issue per domain
        shell: bash
        run: |
          set -euo pipefail
          reopen_days=14
          marker_prefix='<!-- t3-signature:'
          result_of() {
            printf '%s' "$NEEDS_JSON" | jq -r --arg j "$1" '.[$j].result // "skipped"'
          }
          for job in docker cloud perf matrix extension install throughput throughput-cedardb drift quarantine liveness ruleset-drift windows tpcds-obt sql-execution-gate-obt durations-refresh security cross-engine integration-smoke integration parity sqlglot-generator mirror-questdb mirror-postgres17; do
            case "$job" in
              durations-refresh) domain=durations ;;
              *) domain="$job" ;;
            esac
            label="t3:${domain}"
            result="$(result_of "$job")"
            failure_detail="Domain job result: ${result}."
            case "$job" in
              docker) legs="mirror-images docker" ;;
              throughput) legs="throughput throughput-signal" ;;
              drift) legs="drift-gate drift" ;;
              throughput-cedardb) legs="mirror-cedardb throughput-cedardb" ;;
              *) legs="$job" ;;
            esac
            failed_jobs=""
            cancelled_jobs=""
            for leg in $legs; do
              case "$(result_of "$leg")" in
                failure) failed_jobs="${failed_jobs}${leg}"$'\n' ;;
                cancelled) cancelled_jobs="${cancelled_jobs}${leg}"$'\n' ;;
              esac
            done
            signature="$(printf '%s' "$failed_jobs" | sed '/^$/d' | LC_ALL=C sort | paste -sd, -)"
            if [ "$job" = docker ] && [ "$(result_of mirror-images)" = failure ]; then
              failure_detail="Image mirror infrastructure failed; database test job result: ${result}."
            fi
            if [ "$job" = throughput-cedardb ] && [ "$(result_of mirror-cedardb)" = failure ]; then
              failure_detail="CedarDB image mirror infrastructure failed; throughput cell result: ${result}."
            fi
            if [ "$job" = throughput ] && [ "$(result_of throughput-signal)" = failure ]; then
              failure_detail="The nightly/throughput-uat commit status was not published; throughput job result: ${result}."
            fi
            if [ "$job" = drift ] && [ "$(result_of drift-gate)" = failure ]; then
              failure_detail="Drift selection (drift-gate) failed, so drift checks did not run; drift job result: ${result}."
            fi
            if [ -n "$signature" ]; then
              result=failure
              failure_detail="${failure_detail} Failed jobs: ${signature}."
            elif [ -n "$cancelled_jobs" ]; then
              result=cancelled
            fi
            echo "${label}: ${result}"
            if [ "$job" = drift ] && [ "$result" = skipped ]; then
              echo "Drift not selected: drift-gate ran and chose run=$(printf '%s' "$NEEDS_JSON" | jq -r '.["drift-gate"].outputs.run // "unknown"')."
            fi

            existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$label" \
              --limit 1 --json number --jq '.[0].number // empty')"

            case "$result" in
              failure)
                marker="${marker_prefix} ${signature} -->"
                comment="Nightly T3 run ${GITHUB_RUN_ID} failed for \`${label}\` on $(date -u +%F): ${RUN_URL}. ${failure_detail}
          ${marker}"
                if [ -n "$existing" ]; then
                  recorded="$(gh issue view "$existing" --repo "$GITHUB_REPOSITORY" --json body,comments \
                    --jq '[.body, (.comments[].body)] | map(select(contains("<!-- t3-signature:"))) | last // ""' \
                    | sed -n 's/.*<!-- t3-signature: \(.*\) -->.*/\1/p' | tail -n 1)"
                  if [ "$recorded" = "$signature" ]; then
                    echo "No new comment on issue #${existing}: failure signature unchanged (${signature})."
                  else
                    gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$comment"
                    echo "Updated issue #${existing}"
                  fi
                else
                  cutoff="$(( $(date -u +%s) - reopen_days * 86400 ))"
                  recent="$(gh issue list --repo "$GITHUB_REPOSITORY" --state closed --label "$label" \
                    --limit 100 --json number,closedAt \
                    | jq -r --argjson cutoff "$cutoff" \
                      '[.[] | select((.closedAt | fromdateiso8601) >= $cutoff)] | sort_by(.closedAt) | last | .number // empty')"
                  if [ -n "$recent" ]; then
                    gh issue reopen "$recent" --repo "$GITHUB_REPOSITORY"
                    gh issue comment "$recent" --repo "$GITHUB_REPOSITORY" --body "$comment"
                    echo "Reopened issue #${recent}"
                  else
                    gh label create "$label" --repo "$GITHUB_REPOSITORY" \
                      --description "Nightly T3 ${domain} domain is red" --color B60205 >/dev/null 2>&1 || true
                    body="The nightly T3 \`${domain}\` domain failed.

          - Run: ${RUN_URL}
          - Commit: ${GITHUB_SHA}
          - Failure: ${failure_detail}
          - Artifacts: attached to the run (names start with \`t3-${domain}\` where the domain uploads any)

          The owner fixes or reverts within one working day. See ${DOC_URL} for the response policy. This issue stays open while the domain is red and closes when a nightly run passes.
          ${marker}"
                    gh issue create --repo "$GITHUB_REPOSITORY" --label "$label" \
                      --title "Nightly T3 ${domain} failing" --body "$body"
                  fi
                fi
                ;;
              success)
                if [ -n "$existing" ]; then
                  gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
                    --body "Nightly T3 run ${GITHUB_RUN_ID} passed for \`${label}\`: ${RUN_URL}"
                  gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --reason completed
                  echo "Closed issue #${existing}"
                fi
                ;;
              cancelled)
                if [ -n "$existing" ]; then
                  gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
                    --body "Nightly T3 run ${GITHUB_RUN_ID} has no verdict (cancelled or timed out) for \`${label}\`: ${RUN_URL}"
                  echo "Commented on issue #${existing}: no verdict"
                else
                  echo "No issue change for ${label} (cancelled, no open issue)."
                fi
                ;;
              *)
                echo "No issue change for ${label} (${result})."
                ;;
            esac
          done
