version: 2
mode: enforce
status_context: oracle-verdict
findings_delivery: review
bot_login: benchbox-oracle
brief_max_bytes: 100000
max_attempts: 5
protocol:
  max_defects: 10
  max_do_not_ship: 3
retry:
  daily_budget: 6
  backoff_start_minutes: 60
  sweep_max_dispatches: 5
omp:
  version: 18.14.0
  builds:
    linux-x64:
      url: https://build.stencil.so/d/omp/20261029-182540-31147f9/omp-linux-x64
      sha256: e7dd2b606c4ebe9d1a7bcfad1b8820db968cd6b05409fed1c6bc8db0b6a95a8f
    linux-arm64:
      url: https://build.stencil.so/d/omp/20261029-182540-31147f9/omp-linux-arm64
      sha256: dba8d170499709bc87359e02e677821aa76a6ef998ca0254578fe4ea07aff5bc
    darwin-arm64:
      url: https://build.stencil.so/d/omp/20261029-182540-31147f9/omp-darwin-arm64
      sha256: 608843959ab34295d52460dd09dd7d548b6c903c08a83c67954c2d4c36fd1f5a
pools: [claude, codex]
reviewers:
  trivial:
    harness: omp
    family: codex
    pool: codex
    model: "@smol"
    effort: ""
    role: review
    read_only: hard
    reads_files: true
    timeout_minutes: 15
    enabled: true
  small:
    harness: omp
    family: codex
    pool: codex
    model: "@smol"
    effort: ""
    role: review
    read_only: hard
    reads_files: true
    timeout_minutes: 20
    enabled: true
  medium:
    harness: omp
    family: claude
    pool: claude
    model: "@default"
    effort: ""
    role: review
    read_only: hard
    reads_files: true
    timeout_minutes: 25
    enabled: true
  large:
    harness: omp
    family: claude
    pool: claude
    model: "@review"
    effort: ""
    role: review
    read_only: hard
    reads_files: true
    timeout_minutes: 30
    enabled: true
  huge:
    harness: omp
    family: claude
    pool: claude
    model: "@plan"
    effort: ""
    role: review
    read_only: hard
    reads_files: true
    timeout_minutes: 40
    enabled: true
  max:
    harness: omp
    family: claude
    pool: claude
    model: "@slow"
    effort: ""
    role: review
    read_only: hard
    reads_files: true
    timeout_minutes: 45
    enabled: true
buckets:
  trivial: trivial
  small: small
  medium: medium
  large: large
  huge: huge
  max: max
classifier:
  gate_paths:
    - .github/oracle-reviewers.yml
    - .github/oracle-omp-config.yml
    - _project/scripts/oracle_gateway_host.sh
    - .github/soundness-paths.txt
    - .github/workflows/oracle-gate.yml
    - .github/workflows/oracle-review.yml
    - .github/workflows/oracle-verdict.yml
    - .github/workflows/omp-pin-bump.yml
    - .github/workflows/omp-pin-watch.yml
    - .github/workflows/soundness-merge-digest.yml
    - _project/scripts/oracle_gate.py
    - _project/scripts/oracle_review_check.py
    - _project/scripts/oracle_reviewers/*
    - _project/scripts/soundness_paths.py
    - _project/scripts/inert_paths.py
    - .github/inert-paths.txt
    - _project/inert-doc-readers.json
    - _project/scripts/soundness_merge_digest.py
    - _project/scripts/check_soundness_review.py
    - _project/scripts/ruleset_review_enforcement.py
    - scripts/ruleset_drift_check.py
  logic_paths:
    - benchbox/core/equivalence/*
    - benchbox/core/expected_results/*
    - benchbox/core/results/*
    - "*validation*"
    - "*equivalence*"
    - "*comparator*"
    - "*result_capture*"
    - "*result_digest*"
  data_paths:
    - _sources/tpc-h/dbgen/answers/*
    - _sources/tpc-ds/answer_sets/*
    - results-data/bundles/*.override.json
    - _project/joinorder/*.json
    - "*_specs.yaml"
evidence:
  exempt_paths:
    - "README*.md"
    - "**/README*.md"
    - "CHANGELOG*.md"
    - "**/CHANGELOG*.md"
    - "docs/*.md"
