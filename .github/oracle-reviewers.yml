version: 2
mode: enforce
status_context: oracle-verdict
findings_delivery: review
bot_login: benchbox-oracle
brief_max_bytes: 100000
max_attempts: 5
protocol:
  max_defects: 10
  max_do_not_ship: 3
retry:
  daily_budget: 6
  backoff_start_minutes: 60
  sweep_max_dispatches: 5
pools: [claude]
reviewers:
  trivial:
    harness: omp
    family: claude
    pool: claude
    model: "@smol"
    effort: ""
    role: review
    read_only: hard
    reads_files: true
    timeout_minutes: 15
    enabled: true
  small:
    harness: omp
    family: claude
    pool: claude
    model: "@smol"
    effort: ""
    role: review
    read_only: hard
    reads_files: true
    timeout_minutes: 20
    enabled: true
  medium:
    harness: omp
    family: claude
    pool: claude
    model: "@default"
    effort: ""
    role: review
    read_only: hard
    reads_files: true
    timeout_minutes: 25
    enabled: true
  large:
    harness: omp
    family: claude
    pool: claude
    model: "@review"
    effort: ""
    role: review
    read_only: hard
    reads_files: true
    timeout_minutes: 30
    enabled: true
  huge:
    harness: omp
    family: claude
    pool: claude
    model: "@plan"
    effort: ""
    role: review
    read_only: hard
    reads_files: true
    timeout_minutes: 40
    enabled: true
  max:
    harness: omp
    family: claude
    pool: claude
    model: "@slow"
    effort: ""
    role: review
    read_only: hard
    reads_files: true
    timeout_minutes: 45
    enabled: true
buckets:
  trivial: trivial
  small: small
  medium: medium
  large: large
  huge: huge
  max: max
classifier:
  gate_paths:
    - .github/oracle-reviewers.yml
    - .github/soundness-paths.txt
    - .github/workflows/oracle-review.yml
    - .github/workflows/oracle-verdict.yml
    - .github/workflows/oracle-review-shadow.yml
    - .github/workflows/soundness-merge-digest.yml
    - _project/scripts/oracle_review_check.py
    - _project/scripts/oracle_reviewers/*
    - _project/scripts/soundness_paths.py
    - _project/scripts/soundness_merge_digest.py
    - _project/scripts/check_soundness_review.py
    - _project/scripts/ruleset_review_enforcement.py
    - scripts/ruleset_drift_check.py
  logic_paths:
    - benchbox/core/equivalence/*
    - benchbox/core/expected_results/*
    - benchbox/core/results/*
    - "*validation*"
    - "*equivalence*"
    - "*comparator*"
    - "*result_capture*"
    - "*result_digest*"
  data_paths:
    - _sources/tpc-h/dbgen/answers/*
    - _sources/tpc-ds/answer_sets/*
    - results-data/bundles/*.override.json
    - _project/joinorder/*.json
    - "*_specs.yaml"
  exempt_paths:
    - docs/*
    - "*.md"
    - _project/todo-db-export/*
