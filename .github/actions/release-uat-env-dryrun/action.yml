name: Release UAT environment
description: Build and install the checkout wheel, record its distribution digest, and hide the checkout package

runs:
  using: composite
  steps:
    - name: Name the distribution digest file
      shell: bash
      run: echo "RELEASE_DIST_DIGEST_FILE=$RUNNER_TEMP/dist-digest.txt" >> "$GITHUB_ENV"

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'

    - name: Set up Java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        distribution: temurin
        java-version: '21'

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

    - name: Build and install the checkout wheel and record its digest
      shell: bash
      run: |
        set -euo pipefail
        uv sync --group dev --extra clickhouse-local --extra clickhouse-server --extra lakesail --extra databend --extra influxdb --extra singlestore
        uv build --out-dir "$RUNNER_TEMP/staged"
        uv pip install --python .venv/bin/python --reinstall --no-deps "$RUNNER_TEMP"/staged/*.whl
        (cd "$RUNNER_TEMP/staged" && sha256sum -- *.whl *.tar.gz) > "$RELEASE_DIST_DIGEST_FILE"
        cat "$RELEASE_DIST_DIGEST_FILE"

    - name: Hide the checkout package so UAT imports the built wheel
      shell: bash
      run: |
        set -euo pipefail
        git ls-files -z benchbox | xargs -0 git update-index --assume-unchanged
        mv benchbox "$RUNNER_TEMP/benchbox.checkout"
