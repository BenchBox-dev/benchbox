name: Release UAT environment
description: Install the admitted wheel, record its distribution digest, and hide the checkout package

inputs:
  tag:
    description: Release tag the admitted artifacts belong to
    required: true
  head-sha:
    description: Admitted commit the job has checked out
    required: true

runs:
  using: composite
  steps:
    - name: Name the distribution digest file
      shell: bash
      run: echo "RELEASE_DIST_DIGEST_FILE=$RUNNER_TEMP/dist-digest.txt" >> "$GITHUB_ENV"

    - name: Download the admitted directory
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        name: admitted-${{ inputs.tag }}
        path: ${{ runner.temp }}/admitted

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'

    - name: Set up Java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        distribution: temurin
        java-version: '21'

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

    - name: Install the admitted wheel and record its digest
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        HEAD_SHA: ${{ inputs.head-sha }}
      run: |
        set -euo pipefail
        uv sync --group dev --extra clickhouse-local --extra clickhouse-server --extra lakesail --extra databend --extra influxdb --extra singlestore
        uv run --no-sync -- python scripts/release_admitted_dist.py --admitted "$RUNNER_TEMP/admitted" --tag "$RELEASE_TAG" --sha "$HEAD_SHA" --stage "$RUNNER_TEMP/staged"
        uv pip install --python .venv/bin/python "$RUNNER_TEMP"/staged/*.whl
        (cd "$RUNNER_TEMP/staged" && sha256sum -- *.whl *.tar.gz) > "$RELEASE_DIST_DIGEST_FILE"
        cat "$RELEASE_DIST_DIGEST_FILE"

    - name: Hide the checkout package so UAT imports the admitted wheel
      shell: bash
      run: |
        set -euo pipefail
        git ls-files -z benchbox | xargs -0 git update-index --assume-unchanged
        mv benchbox "$RUNNER_TEMP/benchbox.checkout"
