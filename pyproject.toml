[build-system]
requires = ["setuptools>=58.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchbox"
version = "0.5.0rc1"
description = "Embedded benchmark datasets and queries for database evaluation. Implements TPC-H, TPC-DS, TPC-DI and other industry-standard benchmarks."
readme = "README.md"
authors = [{ name = "Joe Harris", email = "joe@benchbox.dev" }]
license = {text = "MIT"}
keywords = ["benchmark", "database", "tpc-h", "tpc-ds", "tpc-di", "analytics", "olap", "performance-testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Testing :: Acceptance",
    "Topic :: System :: Benchmark",
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "textcharts>=0.1.0",
    "click>=8.3.3,<9.0.0",
    "rich>=13.0.0",
    "keyring>=25.0.0",
    "psutil>=5.9.0",
    "pydantic>=2.0.0,<3.0.0",
    "pyyaml>=6.0.0",
    "packaging>=24.0",
    "pyarrow>=21.0.0,<25.0.0",
    "numpy>=1.24.0",
    "zstandard>=0.20.0",
    "requests>=2.31.0",
    "certifi>=2026.10.19",
]

[tool.uv]
required-version = ">=0.13.4"
override-dependencies = ["filelock>=4.2.1,<5"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["benchbox*"]
exclude = [
    "benchmark_runs",
    "benchmark_runs.*",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
