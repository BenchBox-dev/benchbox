    "trino>=0.336.0",
    "firebolt-sdk>=1.18.0",
    "influxdb3-python>=0.10.0",
    "databricks-sdk>=0.20.0",
    "pyspark>=3.5.0",
    "mcp>=2,<3",
    "mutmut>=3.5.0",
    "dask[distributed]>=2026.1.1",
    "pymysql>=1.1.2",
    "delta-spark>=4.1.0",
    "presto-python-client>=0.8.4",
    "codespell>=2.4.2",
    "pre-commit>=4.6.0",
    "import-linter>=2.13",
    "opentelemetry-sdk>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "pytest-json-report>=1.5.0",
    "pygments>=2.18.0",
    "markdown-it-py>=4.0.0",
    "bashlex==0.18",
    "lxml>=6.0.0",
]

[tool.mutmut]
paths_to_mutate = [
    "benchbox/platforms/duckdb.py",
    "benchbox/platforms/base/adapter.py",
    "benchbox/core/runner/runner.py",
    "benchbox/core/visualization/chart_generator.py",
    "benchbox/cli/commands/run.py",
]
tests_dir = ["tests/unit/"]

[tool.setuptools.package-data]
"benchbox._vendor" = ["*.zip", "sqlglot.json", "SQLGLOT_LICENSE.txt"]
"benchbox.core" = ["benchmark_registry.yaml"]
"benchbox.core.equivalence" = ["cross_surface_baseline.yaml"]
"benchbox.core.flightdata" = ["query_catalog.yaml"]
"benchbox.core.nyctaxi" = ["query_catalog.yaml"]
"benchbox.core.results" = ["benchmark_specs.yaml"]
"benchbox.core.primitives.catalog" = ["queries.yaml"]
"benchbox.core.tpcds_obt.catalog" = ["queries.yaml"]
"benchbox.core.tsbs_devops" = ["query_catalog.yaml"]
"benchbox.data.coffeeshop" = ["*.csv"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "migrations",
    "venv",
    ".git",
    "__pycache__",
    ".tox",
    "examples/notebooks",
    "examples/visualization",
    "tests/validation",
]

[tool.ruff.lint]
preview = true
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "C90",
    "PIE",
    "SIM",
    "PLW1514",
    "RUF100",
    "TID251",
]
ignore = [
    "E501",
    "E402",
    "E721",
    "E731",
    "E741",
    "B905",
    "B007",
    "B017",
    "B023",
    "B024",
    "B027",
    "SIM102",
    "SIM103",
    "SIM105",
    "SIM108",
    "SIM110",
    "SIM113",
    "SIM115",
    "SIM116",
    "SIM117",
    "SIM118",
    "SIM201",
    "SIM401",
    "C401",
    "PIE810",
    "UP006",
    "UP007",
    "UP017",
    "UP042",
    "UP035",
    "UP045",
    "N802",
    "N803",
    "N806",
    "N811",
    "N818",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlglot".msg = "Use the bundled wheel runtime through benchbox._vendor.sqlglot."

[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true
known-first-party = ["benchbox", "_project"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.per-file-ignores]
"benchbox/core/tpcds/schema/registry.py" = ["F405"]
"tests/**/conftest.py" = ["F401", "F811"]
"tests/**/test_*.py" = ["F401", "F811"]
"**/__init__.py" = ["F401", "F811", "F822"]
"benchbox/utils/runtime_env.py" = ["F401"]
"benchbox/core/visualization/ascii/*.py" = ["F403"]
"benchbox/core/visualization/ascii_api.py" = ["F403"]
"benchbox/core/write_primitives/dataframe_operations.py" = ["N812"]
"benchbox/platforms/databricks/dataframe_adapter.py" = ["N812"]
"benchbox/platforms/dataframe/expression_family.py" = ["N812"]
"benchbox/platforms/dataframe/unified_frame.py" = ["N812"]
"_project/sqlglot-upstream/repros/repro_all.py" = ["TID251"]
"_project/sqlglot-upstream/repros/sqlite_extract.py" = ["TID251"]
"_project/scripts/build_joinorder_data.py" = ["TID251"]
"tests/utilities/qgen_wrapper.py" = ["TID251"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
exclude = ["*.md"]

[tool.coverage.run]
source = ["benchbox"]
branch = true
omit = [
    "benchbox/__main__.py",
    "**/test_*.py",
    "**/conftest.py",
    "benchbox/core/tpcds/dataframe_queries/queries.py",
    "benchbox/core/tpcds/dataframe_queries/rollup_helper.py",
    "benchbox/core/tpcds/dataframe_queries/channel_helper.py",
    "benchbox/core/datavault/dataframe_queries/queries.py",
    "benchbox/core/nyctaxi/dataframe_queries/queries.py",
    "benchbox/core/tpcdi/etl/scd_processor.py",
    "benchbox/experimental/load_testing/executor.py",
    "benchbox/experimental/load_testing/pool_tester.py",
    "benchbox/core/clickbench/dataframe_queries/queries.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@abstractmethod",
]


[tool.benchbox.complexity]
max_complexity = 18
warn_complexity = 12
max_exception_days = 90
exclusions = []

[tool.benchbox.duplicates]
source_root = "benchbox"
min_lines = 10
threshold = 8073
exclude_patterns = [
    "tests/",
    "__pycache__",
]
ignore_function_names = [
    "_load_queries",
    "_generate_default_params",
    "get_all_variants",
    "find_postgres_divergences",
    "find_clickhouse_divergences",
    "to_dict",
    "get_etl_config",
    "get_performance_config",
]
ignore_rules = [
    { function_names = ["from_config", "apply_constraint_configuration", "apply_unified_tuning", "supports_tuning_type", "apply_tuning_configuration"], path_contains = [
        "benchbox/platforms/athena.py", "benchbox/platforms/azure_synapse.py",
