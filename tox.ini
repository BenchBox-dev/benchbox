[tox]
envlist = py{311,312,313,314}, lint
isolated_build = True

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314, lint

[testenv]
deps =
    pytest>=8.0.0
    pytest-cov>=4.1.0
commands =
    pytest {posargs:tests} --cov=benchbox --cov-report=xml --cov-report=term

[testenv:lint]
deps =
    ruff>=0.5.0
    ty>=0.0.1a14
commands =
    ruff format --check .
    ruff check .
    ty check
