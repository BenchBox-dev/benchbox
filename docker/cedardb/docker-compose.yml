services:
  cedardb:
    image: ${CEDARDB_IMAGE:-cedardb/cedardb@sha256:dbbacb16b24421a9a123cd1d065e2a049c60b7cc6060d7db2f3cccbf69f5ff62}
    mem_limit: 2g
    ports:
      - "5435:5432"
    environment:
      CEDAR_USER: benchbox
      CEDAR_PASSWORD: Benchbox1!
      CEDAR_DB: benchbox_test
    volumes:
      - cedardb-data:/var/lib/cedardb/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U benchbox -d benchbox_test || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  cedardb-data:
    driver: local
