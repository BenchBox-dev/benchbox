services:
  pg-duckdb:
    image: pgduckdb/pgduckdb:18-v1.1.1@sha256:44c88eb9207971af1d7f9804a37429b1bb36f413cd8d7118c81e1288ddde85d1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: benchbox
      POSTGRES_DB: benchbox
    ports:
      - "5432:5432"
    volumes:
      - pg-duckdb18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    shm_size: "256mb"

volumes:
  pg-duckdb18-data:
    driver: local
