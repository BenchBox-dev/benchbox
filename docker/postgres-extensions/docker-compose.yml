services:
  pg-duckdb:
    image: pgduckdb/pgduckdb:18-v1.1.1@sha256:44c88eb9207971af1d7f9804a37429b1bb36f413cd8d7118c81e1288ddde85d1
    container_name: benchbox-pg-duckdb-test
    environment:
      POSTGRES_USER: benchbox
      POSTGRES_PASSWORD: benchbox
      POSTGRES_DB: benchbox_test
    ports:
      - "${PG_DUCKDB_PORT:-5432}:5432"
    volumes:
      - pg-duckdb18-test-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchbox -d benchbox_test"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    shm_size: "256mb"

  pg-mooncake:
    image: mooncakelabs/pg_mooncake:latest@sha256:230731437d5fb1f091c4b1f1ddb27bad419088f44119a8e2d1937ea6cf11c9aa
    container_name: benchbox-pg-mooncake-test
    environment:
      POSTGRES_USER: benchbox
      POSTGRES_PASSWORD: benchbox
      POSTGRES_DB: benchbox_test
    ports:
      - "${PG_MOONCAKE_PORT:-5433}:5432"
    volumes:
      - pg-mooncake18-test-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchbox -d benchbox_test"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    shm_size: "256mb"

volumes:
  pg-duckdb18-test-data:
    driver: local
  pg-mooncake18-test-data:
    driver: local
