services:
  pg-mooncake:
    image: mooncakelabs/pg_mooncake:latest@sha256:230731437d5fb1f091c4b1f1ddb27bad419088f44119a8e2d1937ea6cf11c9aa
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=128
      - -c
      - max_replication_slots=128
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: benchbox
      POSTGRES_DB: benchbox
    ports:
      - "5432:5432"
    volumes:
      - pg-mooncake18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    shm_size: "256mb"

volumes:
  pg-mooncake18-data:
    driver: local
