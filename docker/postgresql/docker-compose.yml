services:
  postgresql:
    image: ${POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336}
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: benchbox
      POSTGRES_PASSWORD: benchbox
      POSTGRES_DB: benchbox_test
    volumes:
      - postgresql18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchbox -d benchbox_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgresql18-data:
    driver: local
