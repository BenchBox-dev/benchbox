services:
  questdb:
    image: ${QUESTDB_IMAGE:-questdb/questdb:10.0.1@sha256:67eaed863ebb2383227919ea9a5499a4a39ceca3862c20b974c84a10e11cdf89}
    ports:
      - "19000:9000"
      - "8812:8812"
      - "9003:9003"
    environment:
      - QDB_CAIRO_COMMIT_LAG=1000
      - QDB_CAIRO_MAX_UNCOMMITTED_ROWS=500000
      - QDB_HTTP_MAX_RECV_BUF_SIZE=2147483648
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9003"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    restart: unless-stopped
