name: benchbox-velox

services:
  velox-connect:
    image: benchbox-velox:${VELOX_IMAGE_TAG:-dev}
    platform: ${VELOX_DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ../..
      dockerfile: docker/velox/Dockerfile
      args:
        GLUTEN_VERSION: ${GLUTEN_VERSION:-1.6.0}
    command: ["connect"]
    ports:
      - "${SPARK_CONNECT_PORT:-50051}:50051"
    environment:
      GLUTEN_JAR: /opt/gluten.jar
      SPARK_DRIVER_MEM: ${SPARK_DRIVER_MEM:-4g}
      VELOX_OFFHEAP: ${VELOX_OFFHEAP:-8g}
      SPARK_CONNECT_PORT: "50051"
    volumes:
      - "${BENCHBOX_DATA_DIR}:${BENCHBOX_DATA_DIR}:ro"
    tmpfs:
      - /tmp:exec,size=2g
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost', 50051)); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 60s

  velox-runner:
    profiles: [runner]
    image: benchbox-velox:${VELOX_IMAGE_TAG:-dev}
    platform: ${VELOX_DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ../..
      dockerfile: docker/velox/Dockerfile
      args:
        GLUTEN_VERSION: ${GLUTEN_VERSION:-1.6.0}
    command: ["run", "--benchmark", "tpch", "--scale", "0.01"]
    environment:
      GLUTEN_JAR: /opt/gluten.jar
      SPARK_DRIVER_MEM: ${SPARK_DRIVER_MEM:-4g}
      VELOX_OFFHEAP: ${VELOX_OFFHEAP:-8g}
