services:
  presto:
    image: prestodb/presto:0.297@sha256:7da6d257a4c879f61b5010feca9d73ff70b069935505edb2ecff435cbe486bf9
    mem_limit: 6g
    ports:
      - "${PRESTO_HOST_PORT:-18081}:8080"
    environment:
      HOSTNAME: presto
    volumes:
      - ./catalog:/opt/presto-server/etc/catalog:ro
      - ./jvm.properties:/opt/presto-server/etc/jvm.config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped
