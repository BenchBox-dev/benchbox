services:
  starrocks:
    image: starrocks/allin1-ubuntu:3.5.16
    mem_limit: ${STARROCKS_MEMORY_LIMIT:-8g}
    ports:
      - "${STARROCKS_HOST_PORT:-19030}:9030"
      - "${STARROCKS_HTTP_PORT:-18040}:8040"
    volumes:
      - starrocks-fe-meta:/data/deploy/starrocks/fe/meta
      - starrocks-be-storage:/data/deploy/starrocks/be/storage
    healthcheck:
      test: >
        sh -c 'mysql -h127.0.0.1 -P9030 -uroot --skip-password -e "SHOW FRONTENDS\\G"
        | grep -q "Alive: true" && mysql -h127.0.0.1 -P9030 -uroot --skip-password
        -e "SHOW BACKENDS\\G" | grep -q "Alive: true"'
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 60s
    restart: unless-stopped

volumes:
  starrocks-fe-meta:
    driver: local
  starrocks-be-storage:
    driver: local
