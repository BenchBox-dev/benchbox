services:
  firebolt:
    image: ${FIREBOLT_IMAGE:-ghcr.io/firebolt-db/firebolt-core:preview-rc}
    user: root
    ulimits:
      memlock:
        soft: 8589934592
        hard: 8589934592
    security_opt:
      - seccomp:unconfined
    ports:
      - "3473:3473"
    volumes:
      - firebolt-data:/firebolt-core/volume
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/3473' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    restart: unless-stopped

volumes:
  firebolt-data:
    driver: local
