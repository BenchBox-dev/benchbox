services:
  firebolt:
    image: ghcr.io/firebolt-db/firebolt-core:preview-rc@sha256:c8a7fa4630105cb4f5328fd62c504a62c445ff66574e58a8e211b3d7bf0b65b5
    user: root
    ulimits:
      memlock:
        soft: 8589934592
        hard: 8589934592
    security_opt:
      - seccomp:unconfined
    ports:
      - "3473:3473"
    volumes:
      - firebolt-data:/firebolt-core/volume
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/3473' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    restart: unless-stopped

volumes:
  firebolt-data:
    driver: local
