services:
  databend:
    image: datafuselabs/databend:latest
    environment:
      QUERY_STORAGE_TYPE: fs
      QUERY_DEFAULT_USER: benchbox
      QUERY_DEFAULT_PASSWORD: benchbox
    ports:
      - "8000:8000"
      - "3307:3307"
    volumes:
      - databend-meta:/var/lib/databend/meta
      - databend-query:/var/lib/databend/query
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  databend-meta:
    driver: local
  databend-query:
    driver: local
