services:
  trino:
    image: ${TRINO_IMAGE:-trinodb/trino:484@sha256:2704eb53935af5e582d63d6033e9bf99d20c325e9b0e30b1016ef59a4773979f}
    mem_limit: 6g
    ports:
      - "${TRINO_HOST_PORT:-18080}:8080"
    volumes:
      - ./catalog:/etc/trino/catalog:ro
      - "${BENCHBOX_DATA_DIR}:${BENCHBOX_DATA_DIR}:ro"
    healthcheck:
      test:
        - CMD-SHELL
        - |
          r=$$(curl -fsS -X POST -H "X-Trino-User: benchbox" --data "SELECT 1" http://localhost:8080/v1/statement) || exit 1
          i=0
          while [ "$$i" -lt 15 ]; do
            case "$$r" in *'"error"'*) exit 1;; esac
            case "$$r" in *'"data":[[1]]'*) exit 0;; esac
            case "$$r" in *'"nextUri":"'*) ;; *) exit 1;; esac
            n=$${r#*'"nextUri":"'}
            n=$${n%%'"'*}
            sleep 1
            r=$$(curl -fsS "http://localhost:8080/$${n#*://*/}") || exit 1
            i=$$((i+1))
          done
          exit 1
      interval: 5s
      timeout: 25s
      retries: 20
      start_period: 20s
    restart: unless-stopped
