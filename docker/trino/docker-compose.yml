services:
  trino:
    image: ${TRINO_IMAGE:-trinodb/trino:480@sha256:1565e8cac299a32dd9177a4da2d748da4ceb9f1560a9c409d1d18fd72ea5253e}
    mem_limit: 6g
    ports:
      - "${TRINO_HOST_PORT:-18080}:8080"
    volumes:
      - ./catalog:/etc/trino/catalog:ro
    healthcheck:
      test:
        - CMD-SHELL
        - |
          r=$$(curl -fsS -X POST -H "X-Trino-User: benchbox" --data "SELECT 1" http://localhost:8080/v1/statement) || exit 1
          i=0
          while [ "$$i" -lt 15 ]; do
            case "$$r" in *'"error"'*) exit 1;; esac
            case "$$r" in *'"data":[[1]]'*) exit 0;; esac
            n=$$(echo "$$r" | grep -o '"nextUri":"[^"]*"' | cut -d'"' -f4)
            [ -n "$$n" ] || exit 1
            sleep 1
            r=$$(curl -fsS "http://localhost:8080/$${n#*://*/}") || exit 1
            i=$$((i+1))
          done
          exit 1
      interval: 5s
      timeout: 25s
      retries: 20
      start_period: 20s
    restart: unless-stopped
