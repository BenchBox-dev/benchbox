services:
  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.8@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77}
    mem_limit: ${CLICKHOUSE_MEMORY_LIMIT}
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_PASSWORD: benchbox
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HOST_PORT:-9000}:9000"
      - "${CLICKHOUSE_HTTP_HOST_PORT:-8123}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./init-default-database.sql:/docker-entrypoint-initdb.d/init-default-database.sql:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "benchbox", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  clickhouse-data:
    driver: local
