services:
  singlestore:
    image: ghcr.io/singlestore-labs/singlestoredb-dev:latest
    platform: linux/amd64
    mem_limit: ${SINGLESTORE_MEMORY_LIMIT:-4g}
    cpus: ${SINGLESTORE_CPUS:-4}
    ports:
      - "${SINGLESTORE_HOST_PORT:-13306}:3306"
    environment:
      ROOT_PASSWORD: benchbox
    volumes:
      - singlestore-data:/var/lib/singlestore
    healthcheck:
      test: >
        singlestore -h127.0.0.1 -P3306 -uroot -pbenchbox -e "SELECT 1"
        || exit 1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped

volumes:
  singlestore-data:
    driver: local
