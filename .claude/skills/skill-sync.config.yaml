# Project-owned skill settings, read by the `code` and `test` skills (see
# `.claude/skills/code/SKILL.md`). Maintained by hand: the rsync skill-sync
# wrapper neither reads nor rewrites this file, so edit values here directly
# and commit them like any other project configuration.
code:
  fast_test: uv run -- python -m pytest -m fast -q
  format: uv run ruff format .
  line_length: 120
  lint: uv run ruff check .
  lint_fix: uv run ruff check --fix .
  review_checklist:
    - For TODOs claiming to retire a SQL-translation post-fixup from a harness
      PASS, grep the helper call site and confirm the harness probe matches the
      wrapper's `read=` argument. A single-dialect PASS cannot retire a helper
      invoked with SQLGlot cross-dialect translation.
    - For changed measured values, add a checked-in smoke or Make target that
      reproduces the measurement and a test that detects catalog/document drift.
    - When an ADR changes branch shape, moves CI, or vendors across branches,
      list CI, contributor, automation, and downstream consumers and verify each
      under the allowlist; an undocumented exception blocks the ADR.
    - When a specification is divided into work units, estimate lines per unit
      from the module breakdown and require a split or a rationale for any unit
      over 300 lines before approval.
  typecheck: uv run -- python -m scripts.typecheck
  verify: uv run ruff check . && uv run -- python -m scripts.typecheck && uv run -- python -m pytest -m
    fast -q
test:
  coverage: uv run -- python -m pytest --cov=benchbox --cov-report=term-missing
  runner: pytest
