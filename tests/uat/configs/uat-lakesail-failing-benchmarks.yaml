# TEMPLATE — reusable focused-rerun shape for LakeSail failure-cluster
# triage; edit the benchmarks.include list per investigation. See
# _project/specs/uat-framework.md Section 9.
name: "uat-lakesail-failing-benchmarks"
description: "Focused LakeSail rerun for UAT enabled-platforms remediation failure clusters"

phases:
  - preflight
  - execute
  - report

platforms:
  include: ["lakesail"]

benchmarks:
  include:
    - ai_primitives
    - clickbench
    - coffeeshop
    - flightdata
    - metadata_primitives
    - nyctaxi
    - read_primitives
    - tpcds
    - tpcds_obt
    - tpch_skew
    - tpchavoc
    - transaction_primitives
    - tsbs_devops
    - vector_search
    - write_primitives

scales:
  rungs: [0.01]

execute:
  per_cell_timeout_s: 600
  early_stop_after_s: 86400
  early_stop_on_failure: false
  phases_arg: "load,power"
  skip_unreachable: true
  parallel_platforms: false

preflight:
  free_space_min_gib: 5
  free_space_path: "~/Developer/benchmark_runs"
  docker_required: true

cleanup:
  preserve_datagen: true
  prune_databases: true
  docker_manage_platforms: true
  docker_platform_switch: "volumes"
  docker_project_prefix: "benchbox-uat-lakesail"
  docker_start_timeout_s: 300
  docker_fixed_container_name_policy: "fail"

report:
  matrix_summary_tsv: "matrix_summary.tsv"

output:
  benchmark_runs_dir_template: "~/Developer/benchmark_runs"
  logs_dir_template: "~/Developer/benchmark_runs/logs/uat_lakesail_failing_benchmarks_{date}"
  submissions_dir_template: "~/Developer/benchmark_runs/submissions/{name}"
