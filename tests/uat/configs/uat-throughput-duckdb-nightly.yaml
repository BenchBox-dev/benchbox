# TEMPLATE — canonical nightly-CI throughput config (.github/workflows/nightly.yml);
# edited in place, not cloned per sweep. See _project/specs/uat-framework.md
# Section 9.
name: "uat-throughput-duckdb-nightly"
description: "Nightly: real multi-stream throughput phase on DuckDB TPC-H SF1 (run-official --streams 3)"

phases:
  - preflight
  - execute
  - validate
  - report

platforms:
  include: ["duckdb"]

benchmarks:
  include: ["tpch"]

scales:
  rungs: [1]

execute:
  per_cell_timeout_s: 900
  early_stop_after_s: 900
  early_stop_on_failure: false
  phases_arg: "load,power,throughput"
  skip_unreachable: true
  parallel_platforms: false
  official: true
  streams: 3
  seed: 20260709

preflight:
  free_space_min_gib: 5
  free_space_path: "~/Developer/benchmark_runs"
  docker_required: false

cleanup:
  preserve_datagen: true
  prune_databases: true
  docker_manage_platforms: false
  docker_platform_switch: "off"

validate:
  validator_clean_rate_floor: 1.0

report:
  matrix_summary_tsv: "matrix_summary.tsv"

output:
  benchmark_runs_dir_template: "~/Developer/benchmark_runs"
  logs_dir_template: "~/Developer/benchmark_runs/logs/uat_throughput_duckdb_nightly_{date}"
  submissions_dir_template: "~/Developer/benchmark_runs/submissions/{name}"
